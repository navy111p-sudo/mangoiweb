# 임시 — 사장님이 올려주신 mp3 «내용» 받아쓰기. main 에 올리지 않는다.
# 왜: 이 컨테이너에는 오디오 디코더가 없어 «무슨 말인지» 를 알 수 없다.
#     이 파일이 «목소리 샘플» 인지 «완성된 나레이션» 인지에 따라 할 일이 정반대다.
name: stt13
on: { push: { branches: [video13] } }
permissions: { contents: write }
jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper
      - name: 받아쓰기 + 음향 실측
        run: |
          set -euo pipefail
          echo "=== 길이/포맷 ==="
          ffprobe -v error -show_entries format=duration,bit_rate -show_entries stream=codec_name,channels,sample_rate -of default=nw=1 .stt/new-voice.mp3
          echo "=== 무음 구간(문장 경계) ==="
          ffmpeg -v info -i .stt/new-voice.mp3 -af silencedetect=n=-35dB:d=0.25 -f null - 2>&1 | grep -i silence || true
          python3 - <<'PY' > .stt/transcript.txt
          from faster_whisper import WhisperModel
          m = WhisperModel("large-v3", device="cpu", compute_type="int8")
          segs, info = m.transcribe(".stt/new-voice.mp3", language="ko",
                                    vad_filter=True, beam_size=5,
                                    vad_parameters=dict(min_silence_duration_ms=300))
          print(f"# language={info.language} prob={info.language_probability:.2f} dur={info.duration:.2f}")
          for s in segs:
              print(f"[{s.start:7.2f} → {s.end:7.2f}] {s.text.strip()}")
          PY
          cat .stt/transcript.txt
      - name: 결과 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add .stt/transcript.txt
          git commit -m "stt: 새 mp3 받아쓰기 [skip ci]" || exit 0
          git push origin HEAD:video13
