# 임시 — 9초 «삡» · 18초 «중복» 수리 + 배경음악을 «시작과 끝에만». main 에 올리지 않는다.
#
# 🔴 사장님이 실제로 들으신 것 (2026-09-05)
#    9초  = t2 문장이 끝나는 자리에 «삡» — 앞서 잘랐지만 덜 잘렸다(−19dB 라 «정상 말소리»
#           로 잘못 판단했다. **숫자가 정상 범위여도 사람 귀에는 이물질일 수 있다**)
#    18초 = t4 문장 중간에 «중복» — 줄 안쪽이라 자를 수 없다 → 다시 뽑는다
# ✅ 두 줄만 후보 3개씩 다시 뽑아 «가장 깨끗한 것» 을 재서 고른다.
# ✅ 배경음악은 중간을 «완전히 비운다» — 사장님 지시가 「시작과 끝에」였고,
#    가운데 깔린 잔향이 «중복 소리» 로 들렸을 가능성도 있다.
name: video-recut
on: { workflow_dispatch: {}, push: { branches: [video11] } }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && command -v ffprobe

      - name: 재료 내려받기 (원본 + 후보)
        run: |
          set -euo pipefail
          python3 - <<'PY' > get.sh
          import json
          for d in ('.video-short', '.video'):
              print(f'mkdir -p {d}/raw')
              for x in json.load(open(f'{d}/narration.json')):
                  print(f"curl -fsSL -o {d}/raw/{x['f']}.wav '{x['url']}'")
          print('mkdir -p .video-short/cand')
          for k, urls in json.load(open('.video-short/recut.json')).items():
              for i, u in enumerate(urls):
                  print(f"curl -fsSL -o .video-short/cand/{k}_{i}.wav '{u}'")
          print(f"curl -fsSL -o .video-short/music.m4a '{json.load(open('.video-short/music.json'))['url']}'")
          PY
          bash get.sh
          for f in .video-short/raw/*.wav .video/raw/*.wav .video-short/cand/*.wav; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" >/dev/null || { echo "❌ $f"; exit 1; }
          done
          ls -la .video-short/cand

      - name: ① 후보를 재서 «가장 깨끗한 것» 을 고른다
        run: |
          set -euo pipefail
          mkdir -p .audit
          cat > pick.py <<'PY'
          import wave, array, json, os, shutil, math
          W = 0.01
          def env(p):
              w = wave.open(p); sr = w.getframerate(); ch = w.getnchannels()
              a = array.array('h'); a.frombytes(w.readframes(w.getnframes()))
              if ch == 2: a = a[0::2]
              N = max(1, int(sr*W))
              return [max(abs(x) for x in a[i:i+N]) for i in range(0, len(a)-N+1, N)], len(a)/sr

          def score(p):
              """떨어져 나온 덩어리의 «크기» 를 점수로. 낮을수록 깨끗하다."""
              e, dur = env(p); pk = max(e) or 1
              Q = pk*0.012
              worst = -99.0; n = 0
              i = 0
              while i < len(e):
                  if e[i] < Q: i += 1; continue
                  j = i
                  while j < len(e) and e[j] >= Q: j += 1
                  # 이 덩어리 앞뒤가 «충분히 조용한가»
                  before = 0; k = i-1
                  while k >= 0 and e[k] < Q: before += 1; k -= 1
                  after = 0; k = j
                  while k < len(e) and e[k] < Q: after += 1; k += 1
                  short = (j - i) <= 30                       # 0.3초 이하 = 말이 아니라 소리 한 점
                  if short and before >= 4 and (after >= 4 or j >= len(e)-2):
                      db = 20*math.log10(max(e[i:j])/pk)
                      worst = max(worst, db); n += 1
                  i = j
              return worst, n, dur

          picks = {}
          rows = []
          for k in json.load(open('.video-short/recut.json')):
              best = None
              for i in range(3):
                  p = f'.video-short/cand/{k}_{i}.wav'
                  w, n, d = score(p)
                  rows.append((k, i, w, n, d))
                  if best is None or (w, d) < (best[1], best[2]): best = (i, w, d)
              picks[k] = best[0]
          # 원본도 같이 재어 «정말 나아졌나» 를 본다
          for k in picks:
              w, n, d = score(f'.video-short/raw/{k}.wav')
              rows.append((k, 'raw', w, n, d))
          print(f'{"줄":6s} {"후보":5s} {"떨어진 덩어리 최대":>18s} {"개수":>5s} {"길이":>7s}')
          for k, i, w, n, d in rows:
              mark = ' ←뽑음' if picks.get(k) == i else ''
              print(f'{k:6s} {str(i):5s} {w:15.1f} dB {n:5d} {d:7.3f}s{mark}')
          for k, i in picks.items():
              shutil.copy(f'.video-short/cand/{k}_{i}.wav', f'.video-short/raw/{k}.wav')
              print(f'✅ {k} ← 후보 {i}')
          json.dump(picks, open('.audit/picks.json','w'))
          PY
          python3 pick.py | tee .audit/pick.txt

      - name: ② 문장 끝 «툭» 잘라내기 (문턱을 더 조인다)
        run: |
          set -euo pipefail
          cat > tail.py <<'PY'
          import wave, array, json, os, math
          W = 0.01
          def env(path):
              w = wave.open(path); sr = w.getframerate(); ch = w.getnchannels()
              a = array.array('h'); a.frombytes(w.readframes(w.getnframes()))
              if ch == 2: a = a[0::2]
              N = max(1, int(sr*W))
              return sr, [max(abs(x) for x in a[i:i+N]) for i in range(0, len(a)-N+1, N)], len(a)/sr
          cuts = {}
          for d in ('.video-short', '.video'):
              for fn in sorted(os.listdir(f'{d}/raw')):
                  p = f'{d}/raw/{fn}'
                  sr, e, dur = env(p); pk = max(e) or 1
                  QUIET = pk*0.012
                  # 🔴 −25dB → −33dB 로 낮춘다. 9초 «삡» 은 −19dB 였는데 이전 문턱을
                  #    «정상 말소리» 로 보고 남겼다 — 사람 귀에는 이물질이었다.
                  LOUD  = pk*0.022        # ≈ −33dB
                  i = len(e)-1
                  while i >= 0 and e[i] < QUIET: i -= 1
                  eos = i; j = i
                  while j >= 0 and e[j] >= QUIET: j -= 1
                  bs = j+1; gap = 0; k = j
                  while k >= 0 and e[k] < QUIET: gap += 1; k -= 1
                  blob = max(e[bs:eos+1]) if eos >= bs else 0
                  short = (eos - bs) <= 30       # 0.3초 이하 = 말이 아니다
                  cut = dur; why = '그대로'
                  if gap >= 4 and blob >= LOUD and short and k >= 0:
                      cut = round((j+1)*W, 3)
                      why = f'덩어리 {bs*W:.2f}~{(eos+1)*W:.2f}s (앞 조용 {gap*W:.2f}s, {20*math.log10(blob/pk):.1f}dB)'
                  cuts[p] = {'dur': round(dur,3), 'cut': cut, 'why': why}
                  print(('✂' if cut < dur-0.005 else ' ') + f' {p:28s} {dur:6.3f} → {cut:6.3f}s   {why}')
          json.dump(cuts, open('.audit/cuts.json','w'), ensure_ascii=False, indent=1)
          PY
          python3 tail.py | tee .audit/tail.txt

      - name: ③ 자르기 + 잡음 제거
        run: |
          set -euo pipefail
          CHAIN="highpass=f=70,afftdn=nr=15:nf=-40:tn=1,deesser=i=0.35,equalizer=f=7000:width_type=q:w=1.2:g=-2"
          cat > clean.py <<'PY'
          import json, os, subprocess
          cuts = json.load(open('.audit/cuts.json')); chain = os.environ['CHAIN']
          for p, c in cuts.items():
              out = p.replace('/raw/', '/aud/'); os.makedirs(os.path.dirname(out), exist_ok=True)
              fs = max(0.0, c['cut'] - 0.03)
              subprocess.run(['ffmpeg','-v','error','-y','-t',str(c['cut']),'-i',p,
                              '-af', f"{chain},afade=t=out:st={fs:.3f}:d=0.03",
                              '-ar','48000','-ac','2', out], check=True)
          print('완료', len(cuts))
          PY
          CHAIN="$CHAIN" python3 clean.py

      - name: ④ 조립 — 소리는 wav 로, AAC 는 마지막 한 번
        run: |
          set -euo pipefail
          (cd .video && bash music.sh >/dev/null)
          python3 - <<'PY' > build.sh
          import json
          def scenes(d, tail_of, crf, title=False):
              items = json.load(open(f'{d}/narration.json')); N=len(items); names=[]
              print(f'cd {d}; mkdir -p seg; : > vlist.txt')
              if title:
                  print('ffmpeg -v error -y -i intro.wav -ar 48000 -ac 2 seg/s00.a.wav'); names.append('s00')
              for n,x in enumerate(items):
                  f=x['f']
                  print(f'ffmpeg -v error -y -i aud/{f}.wav -af "apad=pad_dur={tail_of(n,N)}" -ar 48000 -ac 2 seg/{f}.n.wav')
                  if title and n==N-1:
                      print(f'ffmpeg -v error -y -i seg/{f}.n.wav -i outro.wav -filter_complex "[0][1]concat=n=2:v=0:a=1" -ar 48000 -ac 2 seg/{f}.a.wav')
                  else:
                      print(f'mv seg/{f}.n.wav seg/{f}.a.wav')
                  names.append(f)
              for f in names:
                  print(f'D=$(python3 -c "import wave;w=wave.open(\'seg/{f}.a.wav\');print(w.getnframes()/w.getframerate())")')
                  print(f'FR=$(awk -v a="$D" \'BEGIN{{printf "%d", (a*30<1?1:a*30)}}\')')
                  print(f'ffmpeg -v error -y -loop 1 -i slides/{f}.jpg -t "$D" -an '
                        f'-vf "scale=3840:-2,zoompan=z=\'min(zoom+0.00035,1.06)\':d=$FR:'
                        f'x=\'iw/2-(iw/zoom/2)\':y=\'ih/2-(ih/zoom/2)\':s=1920x1080:fps=30,format=yuv420p" '
                        f'-c:v libx264 -preset medium -crf {crf} -r 30 seg/{f}.v.mp4')
                  print(f'echo "file \'seg/{f}.v.mp4\'" >> vlist.txt')
              print('ffmpeg -v error -y -f concat -safe 0 -i vlist.txt -c copy video_only.mp4')
              ins=' '.join(f'-i seg/{f}.a.wav' for f in names)
              ch=''.join(f'[{i}:a]' for i in range(len(names)))
              print(f'ffmpeg -v error -y {ins} -filter_complex "{ch}concat=n={len(names)}:v=0:a=1" -ar 48000 -ac 2 -c:a pcm_s16le narration_full.wav')
              print('cd ..')
          scenes('.video-short', lambda n,N: 1.2 if n==N-1 else 0.45, 21)
          scenes('.video',       lambda n,N: 0.55,                    20, title=True)
          PY
          bash build.sh

      - name: ⑤ 짧은 판 — 배경음악은 «시작과 끝에만»
        run: |
          set -euo pipefail
          cd .video-short
          T=$(python3 -c "import wave;w=wave.open('narration_full.wav');print(w.getnframes()/w.getframerate())")
          python3 - "$T" <<'PY' > mix.txt
          import sys
          T = float(sys.argv[1])
          # 🔴 (2026-09-05) 가운데를 «완전히 비운다» — 지시가 「시작과 끝에」였고,
          #    가운데 깔린 잔향이 «중복 소리» 로 들렸을 가능성이 있다.
          #    ⛔ 뚝 끊기면 그것대로 들린다 → 3초에 걸쳐 천천히 사라지고 천천히 돌아온다.
          FI, DK0, DK1 = 1.0, 4.5, 7.5        # 페이드인 · 내리기 시작 · 완전 무음
          UP0, UP1, FO = T - 8.0, T - 5.0, T - 2.0
          LOUD, END = 0.20, 0.18
          assert DK1 < UP0
          e = (f"if(lt(t,{FI}),{LOUD}*t/{FI},"
               f"if(lt(t,{DK0}),{LOUD},"
               f"if(lt(t,{DK1}),{LOUD}*(1-(t-{DK0})/{DK1-DK0}),"
               f"if(lt(t,{UP0:.3f}),0,"
               f"if(lt(t,{UP1:.3f}),{END}*(t-{UP0:.3f})/{UP1-UP0},"
               f"if(lt(t,{FO:.3f}),{END},"
               f"max(0,{END}*(1-(t-{FO:.3f})/{T-FO:.3f}))))))))")
          print(f"[1:a]aformat=sample_rates=48000:channel_layouts=stereo,"
                f"volume=eval=frame:volume='{e}',atrim=0:{T},asetpts=N/SR/TB[m];"
                f"[0:a][m]amix=inputs=2:duration=first:normalize=0[x];[x]volume=0.90[a]")
          PY
          cat mix.txt
          ffmpeg -v error -y -i narration_full.wav -stream_loop -1 -i music.m4a \
            -filter_complex_script mix.txt -map '[a]' -c:a pcm_s16le mixed.wav
          ffmpeg -v error -y -i video_only.mp4 -i mixed.wav -map 0:v -map 1:a \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart mangoi-ai-short.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 mangoi-ai-short.mp4

      - name: ⑥ 긴 판
        run: |
          set -euo pipefail
          cd .video
          ffmpeg -v error -y -i video_only.mp4 -i narration_full.wav -map 0:v -map 1:a \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart mangoi-ai-guide.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 mangoi-ai-guide.mp4

      - name: ⑦ 확인 — 8~10초 · 17~19초를 특히 자세히
        run: |
          set -euo pipefail
          cat > verify.py <<'PY'
          import subprocess, wave, array, os, sys, math
          def peaks(mp4, win):
              wav = '/tmp/' + os.path.basename(mp4) + str(win) + '.wav'
              subprocess.run(['ffmpeg','-v','error','-y','-i',mp4,'-ac','1','-ar','16000',
                              '-c:a','pcm_s16le',wav], check=True)
              w = wave.open(wav); sr = w.getframerate()
              a = array.array('h'); a.frombytes(w.readframes(w.getnframes()))
              N = int(sr*win)
              return [(round(i/sr,2), 20*math.log10((max(abs(x) for x in a[i:i+N]) or 1)/32768))
                      for i in range(0, len(a)-N+1, N)]
          for p in ['.video-short/mangoi-ai-short.mp4', '.video/mangoi-ai-guide.mp4']:
              v = peaks(p, 0.25); n = 0
              print(f'\n── {p}  창 {len(v)}개')
              for i,(t,x) in enumerate(v):
                  nb = [v[j][1] for j in (i-1,i+1) if 0 <= j < len(v)]
                  if nb and x - max(nb) >= 12:
                      print(f'   ⚠ t={t:7.2f}s  {x:7.2f} dB  (이웃 {max(nb):.1f})'); n += 1
              print('   ✅ 12dB 넘게 튀는 창 없음' if n == 0 else f'   ⚠ {n}건')
          print('\n── 짧은 판 8~10초 · 17~19초 (0.05초 창)')
          fine = peaks('.video-short/mangoi-ai-short.mp4', 0.05)
          for lo, hi in ((7.8, 10.2), (16.8, 19.2)):
              print(f'   [{lo}~{hi}s]', ' '.join(f'{x:.0f}' for t, x in fine if lo <= t <= hi))
          for p in ['.video/mangoi-ai-guide.mp4', '.video-short/mangoi-ai-short.mp4']:
              m = os.path.getsize(p)/1048576
              print(f'   {p}  {m:.2f} MiB (여유 {(25-m)*1024:.0f} KiB)')
              if m >= 25: print('   ❌ 25 MiB 초과'); sys.exit(1)
          PY
          python3 verify.py | tee .audit/verify.txt

      - name: 결과 커밋
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .audit .video/mangoi-ai-guide.mp4 .video-short/mangoi-ai-short.mp4
          git commit -m "video: 9초 삡 · 18초 중복 수리 + 음악은 시작·끝에만 [skip ci]"
          git push origin HEAD:video11
