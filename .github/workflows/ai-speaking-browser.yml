name: AI speaking entry sandbox
on:
  pull_request:
    paths:
      - 'cloudflare-deploy/public/ai-speaking.html'
      - 'cloudflare-deploy/public/warmup.html'
      - 'cloudflare-deploy/public/ai-friend.html'
      - 'cloudflare-deploy/public/js/mango-avatar.js'
      - 'cloudflare-deploy/public/js/eleader-entry.js'
      - 'cloudflare-deploy/public/js/ai-speaking-progress*.js'
      - 'cloudflare-deploy/public/js/warmup-points.js'
      - 'cloudflare-deploy/public/css/ai-speaking-progress.css'
      - 'cloudflare-deploy/public/css/warmup-guide.css'
      - 'test-harness/manual/ai-speaking-browser.mjs'
      - 'test-harness/manual/ai-speaking-progress-browser.mjs'
      - 'test-harness/helpers/browser-pool.mjs'
      - '.github/workflows/ai-speaking-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speaking-entry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  entry-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⚡ 체크아웃 빠르게 (2026-11-03) — 지난번 .git 을 캐시에서 되살리면 아래 checkout 이 «바뀐 것만» 받습니다.
      #    PR·브라우저 검사는 «읽기만» 합니다(저장은 deploy.yml 이 한 주에 한 번). 설명: deploy.yml «git 캐시» 주석.
      - name: Restore .git cache (faster checkout)
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: repo-git-v1-${{ github.run_id }}
          restore-keys: repo-git-v1-
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/speaking-pw" playwright@1.58.2
          "$RUNNER_TEMP/speaking-pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: 320 entry and return scenarios (localhost only)
        env:
          PW_DIR: ${{ runner.temp }}/speaking-pw
        run: node test-harness/manual/ai-speaking-browser.mjs
      - name: Speaking results on real PC and mobile pages (offline API/audio)
        env:
          PW_DIR: ${{ runner.temp }}/speaking-pw
        run: node test-harness/manual/ai-speaking-progress-browser.mjs
