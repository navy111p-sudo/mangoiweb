name: Deploy WebRTC Unified Platform (Cloudflare Workers)

# main 브랜치에 push 될 때마다 자동 배포.
# 수동 실행도 가능 (Actions 탭 → Run workflow).
#
# ⚠️ 2026-08-07 — paths 필터를 뺐다. 「불필요한 배포 방지」로 얻는 것보다
#   「조용히 배포가 안 되는」 위험이 훨씬 컸다.
#
#   무슨 일이 있었나: PR #33(115 커밋)을 main 에 병합했는데 워크플로가 한 건도 안 돌았다.
#   Actions 활성 · 워크플로 active · 시크릿 존재 · PushEvent 기록까지 전부 정상이었고,
#   변경 파일 239개 중 134개가 cloudflare-deploy/ 아래라 필터에 걸려야 했는데도 실행이 없었다.
#   대기(queued) 실행도 0건 — GitHub 이 실행을 아예 만들지 않았다.
#
#   비교: 8/4 병합은 2커밋·1파일 → 정상 작동. 이번은 115커밋·239파일 → 안 걸림.
#   구조적 차이가 push 크기 하나뿐이다. GitHub 은 push 의 경로 필터를 그 push 에 담긴
#   커밋 목록으로 판정하는데, 커밋이 대량이면 그 목록이 잘려 판정이 어긋난다.
#
#   가장 나쁜 건 아무 신호가 없다는 것이다. 실패도 경고도 아니고 그냥 아무 일이 안 일어난다.
#   작은 PR 은 잘 걸리니 평소엔 문제를 못 느끼다가, 정작 큰 병합에서 조용히 빠진다.
#   (그동안 다들 로컬 deploy.ps1 로만 배포하게 된 이유일 가능성이 크다)
#
#   맞바꾼 것: 이제 문서만 고쳐 main 에 올려도 Worker 가 한 번 재배포된다.
#   main push 자체가 드물고 의도적이라 그 비용은 작고, main 은 언제나 배포 가능한 상태여야 한다.
#   반대로 「나갔어야 할 게 안 나간 것」은 터지기 전까지 아무도 모른다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_base:
        description: 'base Worker 배포 건너뜀'
        required: false
        default: 'false'
      skip_prod:
        description: 'production Worker 배포 건너뜀'
        required: false
        default: 'false'

# 동시 실행 방지 (중복 배포로 인한 바인딩 경쟁 방지)
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # 작업 디렉터리를 cloudflare-deploy/ 로 고정 (package.json / wrangler.toml 위치)
    defaults:
      run:
        working-directory: cloudflare-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 이상이어야 한다 — 낮추지 말 것.
          #   회귀 하니스 9개가 src/*.ts 를 **직접 import** 해서 순수 모듈을 실행한다
          #   (once_per_isolate · ddl_once · judgment_* · org_settlement · cafe24_sync 등).
          #   Node 는 22.6 부터 타입 벗기기를 지원하고 23.6+/24 부터 기본으로 켜진다.
          #   20 에서는 그 import 가 통째로 실패한다.
          #   2026-08-10: 20 인 채로 하니스 게이트를 붙였다가 배포가 막혔다 —
          #   로컬(Node 24)에서만 확인하고 CI 환경에서 확인하지 않은 실수였다.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-deploy/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # ─── 컴파일 게이트 (차단) ───
      # 2026-08-09 이전엔 여기에 continue-on-error: true 가 붙어 있어서
      #   「검사는 하는데 실패해도 그냥 배포」 였다. 검사한 척만 하는 상태다.
      #
      # 그리고 npx 는 쓰지 않는다 — npx 가 조용히 실패해도 «출력 없음 + exit 0» 이라
      #   통과와 화면이 똑같다(CLAUDE.md 함정 목록에 있는 그것).
      #   node 로 로컬 typescript 바이너리를 직접 부르면 그 착시가 없다.
      #   deploy.ps1 과 같은 방식이어야 두 배포 경로의 검사 수준이 같아진다.
      - name: TypeScript check (src/*.ts) — 차단
        run: node node_modules/typescript/bin/tsc --noEmit

      # ─── 회귀 하니스 (차단) ───
      # 하니스 138개는 하나하나가 «예전에 이렇게 고장 났었다» 는 사고 기록이다.
      # 그런데 이 CI 경로는 그중 2개(문법·캐시버전)만 돌리고 있었고,
      # 전체 게이트는 로컬 deploy.ps1 에만 걸려 있었다 —
      # main 으로 배포하면 검사를 사실상 안 받고 나가는 구조였다.
      #
      # 기준선(2026-08-09): PASS 115 / SKIP(E2E) 20 / FAIL 0.
      # E2E 20개는 라이브 화상수업·브라우저 상태가 필요해 헤드리스에서 자동 제외된다.
      - name: Regression harness (run.mjs --fast) — 차단
        working-directory: .
        run: node test-harness/run.mjs --fast

      # ─── 인라인 JS 문법 게이트 (차단) ───
      # 이 경로는 deploy.ps1 을 타지 않는다. 로컬 배포에만 게이트를 걸면
      # main 에 push 되는 순간 여기로 그대로 빠져나간다.
      #
      # 2026-07-23 장애: 폰트 일괄치환이 JS 문자열 안 CSS 를 건드려 문자열이 끊겼고
      #   index.html 인라인 script 10블록이 통째로 SyntaxError → 수업 입장 함수가
      #   아예 정의되지 않아 전 사용자가 수업에 못 들어갔다. 그런데
      #     · 위 tsc 는 src/*.ts 만 본다 (게다가 continue-on-error 라 실패해도 통과)
      #     · 아래 헬스체크는 HTTP 200 여부만 본다 (내용이 깨져도 200 이다)
      #   이 두 개로는 절대 못 잡는다.
      #
      # continue-on-error 를 붙이지 않는다 — 실패하면 배포하지 않는다.
      # 검사 대상: cloudflare-deploy/public 이하 .html 인라인 <script> + .js 전수
      - name: Inline JS syntax gate (HTML <script> + .js)
        working-directory: .
        run: node test-harness/inline_js_syntax_harness.mjs

      # ─── 정적자산 캐시버전 게이트 (차단) ───
      # deploy.ps1 은 sw.js 의 CACHE_NAME 만 자동으로 올린다. js/css 의 ?v= 는 사람이 손으로 올린다.
      # 안 올리면 «배포는 됐는데 기존 사용자에게는 옛 파일이 그대로» 가 된다 —
      # 화면은 새것, 스크립트는 옛것이라 원인 찾기가 특히 어렵다.
      #
      # 2026-08-07 하루에만 두 번 걸렸다: /js/adm-tlink.js (v=1) · /js/adm-core.js (v=39).
      # 둘 다 deploy.ps1 의 게이트(run.mjs --fast 안에 이 하니스가 있다)가 잡아서 사람이 올렸다.
      # 그런데 이 CI 경로에는 그 게이트가 없어서, main 으로 배포되면 그대로 빠져나간다.
      # deploy.ps1 과 CI 두 경로 모두에 같은 게이트가 걸려 있어야 한다.
      #
      # continue-on-error 를 붙이지 않는다 — 실패하면 배포하지 않는다.
      - name: Static asset cache-version gate (?v= 누락)
        working-directory: .
        run: node test-harness/asset_version_harness.mjs

      # ─── 배포 단계용 Node 되돌리기 (20) ───
      # 왜 두 벌을 쓰나 — 두 단계가 서로 다른 것을 요구한다.
      #   · 위 «검사» 단계: Node 24 가 필요하다. 하니스 9개가 src/*.ts 를 직접 import 하는데
      #     Node 20 은 타입 벗기기를 못 한다(22.6+ 지원, 23.6+/24 기본).
      #   · 아래 «배포» 단계: Node 20 이 필요하다. wrangler-action 이 내부에서 npm install 을
      #     하는데, npm 11(Node 24 동봉)이 이 저장소의 optional peer 충돌에서 멈춘다:
      #         found  @cloudflare/workers-types@4.20260413.1        (이 저장소가 ^4 로 고정)
      #         wants  peerOptional @cloudflare/workers-types@^5...  (wrangler 4.120)
      #     npm 10(Node 20 동봉)은 optional peer 라 넘어갔다. npm 11 은 ERESOLVE 로 죽는다.
      #     마지막 성공 실행(2026-08-09)이 Node 20.20.2 였던 것이 그 증거다.
      #
      # 근본 해결은 @cloudflare/workers-types 를 ^5 로 올리는 것이지만, 그건 src/*.ts 76개의
      # 타입이 바뀌는 일이라 별도 작업으로 다룬다. 여기서는 두 요구를 그대로 인정한다.
      - name: Setup Node.js 20 (배포 단계 전용)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 시크릿 존재 여부 확인 — 없으면 워크플로우는 성공 처리하고 배포만 건너뜀
      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID 시크릿이 설정되지 않아 Cloudflare 배포를 건너뜁니다. (Settings → Secrets and variables → Actions 에서 등록)"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Cloudflare 시크릿 확인 완료"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi

      # ─── 1) base Worker 배포 (webrtc-unified-platform) ───
      - name: Deploy base Worker
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_base != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-deploy'
          wranglerVersion: '4'
          # wrangler deploy — top-level 바인딩 사용 (Durable Objects/KV/D1/R2)
          command: deploy

      # ─── 2) production Worker 배포 (webrtc-unified-platform-prod) ───
      # Wrangler 4부터 [env.production] 은 top-level 바인딩을 자동 상속하지 않으므로
      # wrangler.toml 에 production 블록이 재선언되어 있어야 함 (이미 되어 있음).
      - name: Deploy production Worker
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_prod != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-deploy'
          wranglerVersion: '4'
          command: deploy --env production

      # ─── 3) 배포 후 헬스체크 ───
      - name: Health check — base
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_base != 'true'
        run: |
          URL="https://webrtc-unified-platform.navy111p.workers.dev/video-call/"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL" || echo "000")
          echo "base   → $URL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::base Worker 헬스체크 실패 (HTTP $CODE)"
          fi

      - name: Health check — production
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_prod != 'true'
        run: |
          URL="https://webrtc-unified-platform-prod.navy111p.workers.dev/video-call/"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL" || echo "000")
          echo "prod   → $URL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::production Worker 헬스체크 실패 (HTTP $CODE)"
          fi

      - name: Deploy summary
        if: always()
        run: |
          {
            if [ "${{ steps.check_secrets.outputs.secrets_present }}" = "true" ]; then
              echo "### 🚀 Cloudflare Workers 배포 요약"
              echo ""
              echo "| Worker | URL |"
              echo "|---|---|"
              echo "| base | https://webrtc-unified-platform.navy111p.workers.dev/video-call/ |"
              echo "| production | https://webrtc-unified-platform-prod.navy111p.workers.dev/video-call/ |"
              echo ""
              echo "커밋: \`${{ github.sha }}\`"
            else
              echo "### ⏭️ Cloudflare 배포 건너뜀"
              echo ""
              echo "**원인**: \`CLOUDFLARE_API_TOKEN\` 또는 \`CLOUDFLARE_ACCOUNT_ID\` 시크릿 미설정"
              echo ""
              echo "**해결**: Settings → Secrets and variables → Actions 에서 두 시크릿을 추가하세요."
              echo ""
              echo "커밋: \`${{ github.sha }}\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
