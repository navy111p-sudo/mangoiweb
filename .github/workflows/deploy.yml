name: Deploy WebRTC Unified Platform (Cloudflare Workers)

# main 브랜치에 push 될 때마다 자동 배포.
# 수동 실행도 가능 (Actions 탭 → Run workflow).
#
# ⚠️ 2026-08-07 — paths 필터를 뺐다. 「불필요한 배포 방지」로 얻는 것보다
#   「조용히 배포가 안 되는」 위험이 훨씬 컸다.
#
#   무슨 일이 있었나: PR #33(115 커밋)을 main 에 병합했는데 워크플로가 한 건도 안 돌았다.
#   Actions 활성 · 워크플로 active · 시크릿 존재 · PushEvent 기록까지 전부 정상이었고,
#   변경 파일 239개 중 134개가 cloudflare-deploy/ 아래라 필터에 걸려야 했는데도 실행이 없었다.
#   대기(queued) 실행도 0건 — GitHub 이 실행을 아예 만들지 않았다.
#
#   비교: 8/4 병합은 2커밋·1파일 → 정상 작동. 이번은 115커밋·239파일 → 안 걸림.
#   구조적 차이가 push 크기 하나뿐이다. GitHub 은 push 의 경로 필터를 그 push 에 담긴
#   커밋 목록으로 판정하는데, 커밋이 대량이면 그 목록이 잘려 판정이 어긋난다.
#
#   가장 나쁜 건 아무 신호가 없다는 것이다. 실패도 경고도 아니고 그냥 아무 일이 안 일어난다.
#   작은 PR 은 잘 걸리니 평소엔 문제를 못 느끼다가, 정작 큰 병합에서 조용히 빠진다.
#   (그동안 다들 로컬 deploy.ps1 로만 배포하게 된 이유일 가능성이 크다)
#
#   맞바꾼 것: 이제 문서만 고쳐 main 에 올려도 Worker 가 한 번 재배포된다.
#   main push 자체가 드물고 의도적이라 그 비용은 작고, main 은 언제나 배포 가능한 상태여야 한다.
#   반대로 「나갔어야 할 게 안 나간 것」은 터지기 전까지 아무도 모른다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_base:
        description: 'base Worker 배포 건너뜀'
        required: false
        default: 'false'
      skip_prod:
        description: 'production Worker 배포 건너뜀'
        required: false
        default: 'false'

# 동시 실행 방지 (중복 배포로 인한 바인딩 경쟁 방지)
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # 작업 디렉터리를 cloudflare-deploy/ 로 고정 (package.json / wrangler.toml 위치)
    defaults:
      run:
        working-directory: cloudflare-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 이상이어야 한다 — 낮추지 말 것. 검사와 배포가 이제 같은 Node 를 쓴다(둘 다 24).
          #   ① 회귀 하니스 9개가 src/*.ts 를 **직접 import** 해서 순수 모듈을 실행한다
          #      (once_per_isolate · ddl_once · judgment_* · org_settlement · cafe24_sync 등).
          #      Node 는 22.6 부터 타입 벗기기를 지원하고 23.6+/24 부터 기본으로 켜진다. 20 에선 실패.
          #   ② 배포 단계(wrangler-action)의 npm ci 도 24 에서 돈다 — 2026-08-10 에
          #      @cloudflare/workers-types 를 ^4 → ^5 로 올려 npm 11 의 peer 충돌을 없앴다.
          #      (그전엔 배포만 Node 20 으로 되돌려야 했다. 이제 그 분리가 필요 없다.)
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-deploy/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # ─── 배포 차단 게이트 4종 ───
      # 2026-08-13: step 4개로 늘어놓던 것을 test-harness/ci-gates.sh 로 옮겼다.
      #   PR 용 워크플로(ci.yml)를 새로 만들면서, 같은 목록을 두 워크플로에 **복사**하면
      #   이 저장소가 반복해서 밟은 함정이 되기 때문이다 — 바로 아래 8/7 사고 기록이
      #   말하는 그것("목록이 둘이라 한쪽만 고치면 이렇게 된다").
      #   각 게이트의 사고 기록·주의사항은 전부 그 스크립트 안으로 함께 옮겼다.
      #
      # ⚠️ 게이트를 추가·수정할 일이 생기면 **ci-gates.sh 만** 고친다. 여기는 부르기만 한다.
      # continue-on-error 를 붙이지 않는다 — 실패하면 배포하지 않는다.
      #   (게이트는 아래 wrangler 배포 step 보다 **먼저** 돈다. 실패 = 배포 안 나감이지,
      #    깨진 코드가 나가는 것이 아니다.)
      - name: 배포 게이트 (tsc · 회귀 하니스 · 인라인 JS · ?v=) — 차단
        working-directory: .
        run: bash test-harness/ci-gates.sh

      # 시크릿 존재 여부 확인 — 없으면 워크플로우는 성공 처리하고 배포만 건너뜀
      - name: Check required secrets
        id: check_secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID 시크릿이 설정되지 않아 Cloudflare 배포를 건너뜁니다. (Settings → Secrets and variables → Actions 에서 등록)"
            echo "secrets_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Cloudflare 시크릿 확인 완료"
            echo "secrets_present=true" >> "$GITHUB_OUTPUT"
          fi

      # ─── 1) base Worker 배포 (webrtc-unified-platform) ───
      - name: Deploy base Worker
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_base != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-deploy'
          wranglerVersion: '4'
          # wrangler deploy — top-level 바인딩 사용 (Durable Objects/KV/D1/R2)
          command: deploy

      # ─── 2) production Worker 배포 (webrtc-unified-platform-prod) ───
      # Wrangler 4부터 [env.production] 은 top-level 바인딩을 자동 상속하지 않으므로
      # wrangler.toml 에 production 블록이 재선언되어 있어야 함 (이미 되어 있음).
      - name: Deploy production Worker
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_prod != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'cloudflare-deploy'
          wranglerVersion: '4'
          command: deploy --env production

      # ─── 3) 배포 후 헬스체크 ───
      - name: Health check — base
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_base != 'true'
        run: |
          URL="https://webrtc-unified-platform.navy111p.workers.dev/video-call/"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL" || echo "000")
          echo "base   → $URL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::base Worker 헬스체크 실패 (HTTP $CODE)"
          fi

      - name: Health check — production
        if: steps.check_secrets.outputs.secrets_present == 'true' && github.event.inputs.skip_prod != 'true'
        run: |
          URL="https://webrtc-unified-platform-prod.navy111p.workers.dev/video-call/"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -L --max-time 20 "$URL" || echo "000")
          echo "prod   → $URL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::production Worker 헬스체크 실패 (HTTP $CODE)"
          fi

      - name: Deploy summary
        if: always()
        run: |
          {
            if [ "${{ steps.check_secrets.outputs.secrets_present }}" = "true" ]; then
              echo "### 🚀 Cloudflare Workers 배포 요약"
              echo ""
              echo "| Worker | URL |"
              echo "|---|---|"
              echo "| base | https://webrtc-unified-platform.navy111p.workers.dev/video-call/ |"
              echo "| production | https://webrtc-unified-platform-prod.navy111p.workers.dev/video-call/ |"
              echo ""
              echo "커밋: \`${{ github.sha }}\`"
            else
              echo "### ⏭️ Cloudflare 배포 건너뜀"
              echo ""
              echo "**원인**: \`CLOUDFLARE_API_TOKEN\` 또는 \`CLOUDFLARE_ACCOUNT_ID\` 시크릿 미설정"
              echo ""
              echo "**해결**: Settings → Secrets and variables → Actions 에서 두 시크릿을 추가하세요."
              echo ""
              echo "커밋: \`${{ github.sha }}\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
