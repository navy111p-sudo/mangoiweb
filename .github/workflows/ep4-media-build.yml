name: ep4 media build (temporary — never merge to main)
on:
  push:
    branches: [ep4-media-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/ep4build/build.py
      - name: commit outputs
        run: |
          mkdir -p tools/ep4build/out && cp out/* tools/ep4build/out/
          git config user.name ep4-bot && git config user.email ep4-bot@users.noreply.github.com
          git add tools/ep4build/out
          git commit -m "ep4 media build outputs [skip ci]" && git push origin HEAD:ep4-media-build
