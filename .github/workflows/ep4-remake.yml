name: ep4 remake (temporary — never merge to main)
on:
  push:
    branches: [ep4-remake]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper==1.1.1 numpy
      - run: python3 tools/ep4remake/job.py
      - name: commit outputs
        run: |
          git config user.name ep4-bot && git config user.email ep4-bot@users.noreply.github.com
          git add tools/ep4remake/out
          git commit -m "ep4 remake outputs [skip ci]" && git push origin HEAD:ep4-remake
