name: PR 검증 (배포 안 함)

# 이 워크플로는 **절대 배포하지 않는다.**
#   · 배포는 deploy.yml (main push) 과 로컬 deploy.ps1 두 경로뿐이다.
#   · 여기는 PR 을 열었을 때 "머지해도 되는 코드인가"만 본다.
#
# 왜 만들었나 (2026-08-04):
#   그전까지 이 저장소의 워크플로는 deploy.yml / android.yml 둘뿐이었고
#   **둘 다 main push 에만 걸려 있었다.** 즉 PR 단계에서 도는 검사가 하나도 없었고,
#   문제가 있어도 main 에 머지되어 실서비스로 나간 뒤에야 알 수 있었다.
#   (Claude Code 의 CI 패널이 늘 "보고된 검사가 없습니다" 였던 이유가 이것)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 같은 PR 에 push 가 연달아 오면 이전 실행은 취소 (배포가 아니라 검사이므로 취소해도 안전)
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 타입체크 + 인라인 JS 문법 + 회귀 하니스
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # ⚠️ 20 으로 두면 안 된다. 하니스가 Node 22+ 기능에 의존한다:
          #   · node:sqlite            → Node 22.5+  (attendance_last_seen, cafe24_sync, org_settlement)
          #   · .ts 파일 직접 import   → Node 22.18+ 타입 스트리핑 (judgment_level, judgment_scoring)
          # Node 20 에서는 위 5건이 «내 PR 과 무관하게» 실패한다 (2026-08-04 CI 로그로 확인).
          # 개발자 로컬이 Node 24 이므로 CI 도 24 로 맞춘다.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-deploy/package-lock.json'

      - name: Install dependencies (cloudflare-deploy)
        working-directory: cloudflare-deploy
        run: npm ci

      # ─── 1) TypeScript 컴파일 (차단) ───
      # deploy.yml 의 같은 검사는 continue-on-error 라 실패해도 배포가 진행된다.
      # 여기서는 차단한다 — 머지 전에 잡는 것이 이 워크플로의 존재 이유다.
      - name: TypeScript check (src/*.ts)
        working-directory: cloudflare-deploy
        run: npx tsc --noEmit

      # ─── 2) 인라인 JS 문법 게이트 (차단) ───
      # 2026-07-23 장애 재발 방지용. tsc 는 src/*.ts 만 보므로
      # public/*.html 안의 <script> 블록이 깨져도 절대 못 잡는다.
      - name: Inline JS syntax gate (HTML <script> + .js)
        run: node test-harness/inline_js_syntax_harness.mjs

      # ─── 3) 회귀 하니스 --fast (지금은 리포트만 — 아래 사유) ───
      # 이 step 은 반드시 npm ci 뒤에 와야 한다. 일부 하니스가 esbuild 로
      # src/*.ts 를 런타임 번들링하는데, esbuild 는 wrangler 의 전이 의존성이라
      # node_modules 가 없으면 3건이 통째로 실패한다.
      #
      # ⚠️ continue-on-error 인 이유 (2026-08-04, 임시):
      #   깨끗한 main 체크아웃에서 이미 2건이 실패한다 — 이 PR 탓이 아니다.
      #     · chinese_class_routing_harness.mjs
      #     · enroll_contract_harness.mjs
      #   원인: 두 하니스가 mangoi-ai-avatar-cf/src/index.js 의 enrollParseFields 를
      #   import 하는데, 그 함수가 **한 번도 커밋된 적이 없다**(git log -S 로 확인).
      #   하니스 쪽은 2026-07-23 부터 이 함수를 기대하고 있었고, 함수는 누군가의
      #   로컬 작업트리에만 있다. 지금까지 하니스를 늘 «수정된 로컬 트리»에서만
      #   돌렸기 때문에 12일간 아무도 몰랐다. (이 게이트가 필요한 이유 그 자체)
      #
      #   👉 avatar 쪽 소스가 커밋되면 continue-on-error 줄을 지워 차단으로 바꿀 것.
      #      그 전까지 차단으로 두면 모든 PR 이 무조건 빨간불이 된다.
      #
      # ⚠ 그리고 --fast 대상 중 admin_auth_gate / admin_404_apis 두 개는
      #   라이브(test.mangoi.co.kr)로 실제 요청을 보낸다. 라이브가 잠깐 흔들리면
      #   PR 과 무관하게 실패할 수 있다(run.mjs 가 1회 재시도로 흡수).
      #
      # 기준선(2026-08-04, CI ubuntu + Node 24 + npm ci): PASS 57 / SKIP(E2E) 19 / FAIL 2
      - name: Regression harness (--fast)
        continue-on-error: true
        run: node test-harness/run.mjs --fast

      - name: 요약
        if: always()
        run: echo "이 워크플로는 검증만 합니다. 배포는 main push 시 deploy.yml 이 담당합니다."
