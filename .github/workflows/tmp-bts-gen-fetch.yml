# ⛔ 임시 워크플로 — main 에 올리지 않습니다. 작업 브랜치에서만 돌고 지웁니다.
# 목적: 힉스필드 생성 사진(CloudFront, 컨테이너 프록시가 막음)을 러너가 받아 webp 로 줄여 tmp-bts-gen/img/ 에 커밋.
name: tmp-bts-gen-fetch
on:
  push:
    branches: [claude/bold-lovelace-dy58q5]
    paths: ['tmp-bts-gen/urls.json']
permissions:
  contents: write
concurrency: { group: tmp-bts-gen-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick >/dev/null
      - name: download
        run: |
          cat > /tmp/f.mjs <<'JS'
          import fs from 'node:fs';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const ex = promisify(execFile);
          const list = JSON.parse(fs.readFileSync('tmp-bts-gen/urls.json', 'utf8'));
          fs.mkdirSync('tmp-bts-gen/img', { recursive: true });
          const todo = list.filter(x => x.url && !fs.existsSync('tmp-bts-gen/img/' + x.key + '.webp'));
          console.log('total', list.length, 'todo', todo.length);
          let i = 0, ok = 0; const fail = [];
          const get = async u => { for (let t = 0; t < 5; t++) { try { const r = await fetch(u); if (r.ok) return Buffer.from(await r.arrayBuffer()); } catch (e) {} await new Promise(r => setTimeout(r, 1500 * (t + 1))); } return null; };
          const work = async () => { while (i < todo.length) { const x = todo[i++]; const b = await get(x.url); if (!b) { fail.push(x.key); continue; }
            const raw = '/tmp/g_' + x.key, png = raw + '.png'; fs.writeFileSync(raw, b);
            try { await ex('convert', [raw + '[0]', '-resize', '640x480^', '-gravity', 'center', '-extent', '640x480', png]);
              await ex('cwebp', ['-quiet', '-q', '78', png, '-o', 'tmp-bts-gen/img/' + x.key + '.webp']); ok++; } catch (e) { fail.push(x.key); } } };
          await Promise.all(Array.from({ length: 12 }, work));
          console.log('ok', ok, 'fail', fail.length, fail.join(' '));
          JS
          node /tmp/f.mjs
      - name: commit
        run: |
          git config user.name "tmp-bot"; git config user.email "tmp-bot@users.noreply.github.com"
          git add tmp-bts-gen/img
          git diff --cached --quiet && exit 0
          git commit -qm "tmp: 힉스필드 생성 사진 받아오기 (임시, main 금지)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin claude/bold-lovelace-dy58q5 && git push && break; sleep 7; done
