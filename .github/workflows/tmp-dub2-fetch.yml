# 임시 — dub-002 영상 6개를 임시 CDN 에서 받아 저장소로 옮기는 일회용 작업. main 에 올리지 않음.
name: tmp-dub2-fetch
on:
  push:
    branches: [dub2-media-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: dub2-media-fetch }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: download + poster
        run: |
          set -e
          D=cloudflare-deploy/public/media/dubbing/dub-002
          mkdir -p "$D"
          B=https://d2ol7oe51mr4n9.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k
          i=0
          for u in 83a55a1d-55f2-493b-88b4-2d9495b38613 9d31f4a8-0a3a-43a0-a340-6829399eef35 c0cb620a-eeea-4740-b41c-9d9b9f997b05 25081e3d-ed63-472f-88f5-f7c723c0076a 8cfcf032-fd52-4536-8b75-86e9de40d50d de3f3217-a544-4b81-98d1-e4b5b23a2102; do
            i=$((i+1))
            curl -fsSL --retry 4 -o "/tmp/s$i.mp4" "$B/$u.mp4"
            echo "scene-$i src $(stat -c %s /tmp/s$i.mp4) md5 $(md5sum /tmp/s$i.mp4 | cut -c1-12)"
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of compact "/tmp/s$i.mp4"
            # 25MiB 상한 대비 여유: 20MiB 초과면 재인코딩(crf 23), 아니면 faststart 만
            if [ $(stat -c %s /tmp/s$i.mp4) -gt 20971520 ]; then
              ffmpeg -v error -y -i "/tmp/s$i.mp4" -c:v libx264 -crf 23 -preset slow -c:a aac -b:a 128k -movflags +faststart "$D/scene-$i.mp4"
            else
              ffmpeg -v error -y -i "/tmp/s$i.mp4" -c copy -movflags +faststart "$D/scene-$i.mp4"
            fi
            ffmpeg -v error -y -ss 3 -i "$D/scene-$i.mp4" -frames:v 1 -vf scale=960:-2 -q:v 4 "$D/scene-$i.jpg"
            echo "scene-$i out $(stat -c %s $D/scene-$i.mp4) jpg $(stat -c %s $D/scene-$i.jpg)"
          done
          # 확인용 접촉시트(커밋하되 작업 브랜치로는 안 가져옴)
          ffmpeg -v error -y -i "$D/scene-%d.jpg" -vf "scale=480:-2,tile=3x2" -frames:v 1 contact-dub2.jpg
          git config user.name "dub2-fetch-bot"; git config user.email "noreply@anthropic.com"
          git add "$D" contact-dub2.jpg
          git commit -m "tmp: dub-002 media fetched by CI runner"
          git push origin HEAD:dub2-media-fetch
