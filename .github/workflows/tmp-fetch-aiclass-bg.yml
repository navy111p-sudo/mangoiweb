# 임시 — AI 수업 선생님 칸 배경 그림을 러너가 받아 WebP 로 변환해 커밋. 받은 뒤 지웁니다(main 에 안 올라감).
name: tmp-fetch-aiclass-bg
on:
  push:
    branches: [claude/wizardly-galileo-xp2kuc]
    paths: ['.github/workflows/tmp-fetch-aiclass-bg.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - run: |
          set -e
          curl -fsSL -o /tmp/src.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261009_054425_5854a649-e08e-44b2-8e16-96675a8154ac.png"
          identify /tmp/src.png
          convert /tmp/src.png -resize 720x /tmp/s.png
          cwebp -q 78 -m 6 /tmp/s.png -o cloudflare-deploy/public/img/aiclass-bg-studio.webp
          mkdir -p tmp-preview
          convert /tmp/src.png -resize 480x -quality 85 tmp-preview/aiclass-bg-studio.jpg
          ls -l cloudflare-deploy/public/img/aiclass-bg-studio.webp tmp-preview/
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add cloudflare-deploy/public/img/aiclass-bg-studio.webp tmp-preview
          git commit -m "tmp: AI 수업 선생님 칸 배경 그림 받아오기 (러너)"
          git push
