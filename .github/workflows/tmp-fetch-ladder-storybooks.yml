name: TEMP fetch ladder storybook images
on:
  push:
    branches: [img-fetch-ladder-storybooks]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp >/dev/null
      - name: Download and convert
        run: |
          set -e
          OUT=cloudflare-deploy/public/img/story
          mkdir -p "$OUT" /tmp/raw
          n=0; ok=0
          while IFS=$'\t' read -r NAME URL || [ -n "$NAME" ]; do
            [ -z "$NAME" ] && continue
            n=$((n+1))
            if curl -fsSL --retry 3 "$URL" -o "/tmp/raw/$NAME.src"; then
              convert "/tmp/raw/$NAME.src" -resize 1024x688^ -gravity center -extent 1024x688 -strip "/tmp/raw/$NAME.png"
              cwebp -quiet -q 80 "/tmp/raw/$NAME.png" -o "$OUT/$NAME.webp"
              ok=$((ok+1))
            else
              echo "FAILED $NAME"
            fi
          done < scripts/ladder-storybooks/image-urls.tsv
          echo "listed=$n converted=$ok"
          ls -la "$OUT" | tail -5
          montage -label '%t' -pointsize 12 $(ls /tmp/raw/*.png | sort) -tile 6x -geometry 256x172+4+4 docs-contact.jpg || true
          mkdir -p scripts/ladder-storybooks/preview && mv docs-contact.jpg scripts/ladder-storybooks/preview/contact.jpg || true
      - name: Commit
        run: |
          git config user.name "img-bot"; git config user.email "img-bot@users.noreply.github.com"
          git add cloudflare-deploy/public/img/story scripts/ladder-storybooks/preview
          git commit -m "TEMP: ladder storybook images" || echo nothing
          git push
