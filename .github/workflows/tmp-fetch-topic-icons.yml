# ⚠️ 임시 워크플로 — AI 영어친구 주제 카드 실사 아이콘을 러너에서 받아 WebP 로 굽는다.
#   이 컨테이너의 프록시가 외부 CDN 을 403 으로 막아(CLAUDE.md 2장) 러너를 빌린다.
#   ⛔ main 에 올리지 말 것. 아이콘이 커밋되면 이 파일은 곧바로 지운다.
name: tmp-fetch-topic-icons

on:
  push:
    branches: [claude/peaceful-mccarthy-jy00x6]
    paths: ['.github/workflows/tmp-fetch-topic-icons.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/peaceful-mccarthy-jy00x6

      - name: 도구 설치 (cwebp / ImageMagick)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick

      - name: 받아서 256px WebP 로 굽기
        run: |
          set -euo pipefail
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k
          OUT=cloudflare-deploy/public/img/topics
          mkdir -p "$OUT" /tmp/src
          fetch() { # $1=파일이름  $2=원본파일
            curl -fsSL "$B/$2" -o "/tmp/src/$1.png"
            convert "/tmp/src/$1.png" -resize 256x256 "/tmp/src/$1.r.png"
            cwebp -quiet -q 82 "/tmp/src/$1.r.png" -o "$OUT/$1.webp"
          }
          fetch free      hf_20260909_143614_a5614885-66a8-45dd-9d91-da9af13d951e.png
          fetch family    hf_20260909_143614_9032da3b-dc2d-4923-ba70-b827267191b8.png
          fetch food      hf_20260909_143616_44904c2d-826e-414a-8248-e8df11cbe85b.png
          fetch animals   hf_20260909_143615_3dbb864e-9493-4ae7-a86c-1c5bf824a5b7.png
          fetch space     hf_20260909_143613_35f6569d-e07e-467d-bd9a-2377f0ebb3b6.png
          fetch dinosaurs hf_20260909_143614_cd58e5fe-1ef8-4783-85e8-0d86542453cc.png
          fetch games     hf_20260909_143655_0cee19f8-9e10-49e6-a6c3-8d2e0775bd56.png
          fetch school    hf_20260909_143614_24c3717c-f1ee-4ebc-86fd-5c7a91c3ea3b.png
          fetch sports    hf_20260909_143614_6e3d4089-8104-4bfa-ad0b-bd0ad2ff8ca8.png
          fetch movies    hf_20260909_143614_e20b1102-1630-409f-bd5b-876394a9cd5a.png
          ls -l "$OUT"
          # 상한 확인 — 카드 아이콘 한 장이 120KB 를 넘으면 첫 화면이 무거워진다
          for f in "$OUT"/*.webp; do
            s=$(stat -c%s "$f")
            [ "$s" -le 122880 ] || { echo "::error::$f 가 ${s}B 로 120KB 를 넘습니다"; exit 1; }
          done

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-deploy/public/img/topics
          git diff --cached --quiet && { echo "바뀐 것 없음"; exit 0; }
          git commit -m "주제 카드 실사 아이콘 10장 (러너에서 생성)"
          git push origin HEAD:claude/peaceful-mccarthy-jy00x6
