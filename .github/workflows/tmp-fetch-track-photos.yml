# 임시: 프록시가 Higgsfield CDN 을 막아 러너가 받아 커밋합니다. 받은 뒤 이 파일은 지웁니다.
name: tmp-fetch-track-photos
on:
  push:
    branches: [claude/compassionate-noether-sekfow]
    paths: [.github/workflows/tmp-fetch-track-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - run: |
          set -e
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k
          D=cloudflare-deploy/public/img/curriculum-tracks
          mkdir -p $D tmpdl
          printf '%s\n' \
            "kids hf_20261013_035344_7164719e-40ba-4e89-8c55-d3e6bbba6ef6" \
            "school hf_20261013_035344_509c0b25-8c89-42aa-8a36-34a1894cc83b" \
            "business hf_20261013_035344_39f66904-91b3-4d03-a3d1-acb9c2dff8bf" \
            "test hf_20261013_035344_52a2e3ab-e586-4438-b8c5-107f394cd8bd" \
            "conversation hf_20261013_035346_05894b7a-cb9b-40bf-be17-50f37850badc" \
            "travel hf_20261013_035413_a1e05ec6-a50e-4473-b3ef-bd26995bd4b0" > list.txt
          N=0
          while read -r NAME F; do
            curl -fsSL -o tmpdl/$NAME.png "$B/$F.png"
            cwebp -quiet -q 80 -resize 640 0 tmpdl/$NAME.png -o $D/$NAME.webp
            N=$((N+1))
          done < list.txt
          echo "converted=$N"; test "$N" = 6
          montage tmpdl/*.png -resize 400x -tile 3x -geometry +4+4 docs/tmp-curriculum-tracks-preview.jpg
          ls -la $D
      - run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git add cloudflare-deploy/public/img/curriculum-tracks docs/tmp-curriculum-tracks-preview.jpg
          git commit -m "curriculum track photos (fetched by runner)"
          git push
