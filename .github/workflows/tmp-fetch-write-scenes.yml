# ⚠️ 임시 워크플로 — 병합하지 않습니다. 이 브랜치(tmp/fetch-write-scenes-260831)에서만 돕니다.
#
# 왜 필요한가:
#   AI 영작의 「오늘의 그림」 20장을 새로 생성했는데, 작업 컨테이너의 조직 프록시가
#   생성물 CDN(cloudfront)을 403 으로 막아 파일을 내려받을 수 없습니다(curl·브라우저 모두 확인).
#   CI 러너는 인터넷이 열려 있으므로, 여기서 받아 기존 규격(1440x611 webp)으로 변환해 커밋합니다.
#   받은 뒤 이 파일은 지웁니다 — main 에는 올라가지 않습니다.
name: (임시) write-scenes 이미지 받아 webp 로 커밋

on:
  push:
    branches: [tmp/fetch-write-scenes-260831]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 변환 도구 설치 (cwebp · ImageMagick)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - name: 20장 내려받아 1440x611 webp 로 변환
        run: |
          set -euo pipefail
          B=https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k
          OUT=cloudflare-deploy/public/img/write-scenes
          mkdir -p "$OUT" raw
          # 파일이름:생성물이름
          LIST="
          farm:hf_20260831_024315_0b981323-a5c3-4c72-9efe-1ff18929e909.png
          zoo:hf_20260831_024315_36fb5eb8-58b6-4735-b325-25d5a6495eb4.png
          bakery:hf_20260831_024315_92977853-f8b9-4502-8649-2a820c552172.png
          library:hf_20260831_024315_fb5eee1a-75e1-48bd-a75f-c70440b5d067.png
          playground:hf_20260831_024315_7512d905-44ae-497c-969a-66a9e4b0a230.png
          snow:hf_20260831_024315_13bbbcdc-b461-4eda-a5f7-ce4735eae8c2.png
          rain:hf_20260831_024315_f3fa12e5-42d9-4396-8c6d-217af418b5dc.png
          market:hf_20260831_024315_714f63fc-c2a4-47df-9ddf-96915abd7f43.png
          camping:hf_20260831_024315_c02f888b-76df-46df-939b-1979a4789f33.png
          train:hf_20260831_024315_d340d79e-f200-4b36-902e-413725f1bc5a.png
          airport:hf_20260831_024331_c312afdd-b9a9-4f47-b06b-bb735c4d2c11.png
          clinic:hf_20260831_024331_3a5cdee3-059a-4669-95c1-35982db7864f.png
          firestation:hf_20260831_024331_e32bbed6-dc1d-428e-8a2d-8f9483691b81.png
          aquarium:hf_20260831_024331_694c1b49-a87b-42e3-b5fa-3149a2700815.png
          musicroom:hf_20260831_024331_f78c5181-d973-43ab-b168-5ed8efdc3742.png
          artroom:hf_20260831_024331_693398c9-c4e0-4637-80f9-16ef1c4c4af2.png
          sportsday:hf_20260831_024331_eb8ae714-81a0-4155-9ca2-d762be253f49.png
          picnic:hf_20260831_024331_ded4d344-9912-418f-900e-9e542898027f.png
          treehouse:hf_20260831_024331_328eb681-25ed-4a7f-8d0d-873a99ebd2eb.png
          balloon:hf_20260831_024331_8ab2af26-d7d9-45f6-bbb3-953bb3d1c1c6.png
          "
          for row in $LIST; do
            name="${row%%:*}"; src="${row##*:}"
            curl -fsS -o "raw/$name.png" "$B/$src"
            # 기존 12장과 같은 규격: 1440x611 cover 크롭 → webp
            convert "raw/$name.png" -resize 1440x611^ -gravity center -extent 1440x611 "raw/$name.crop.png"
            cwebp -quiet -q 78 "raw/$name.crop.png" -o "$OUT/$name.webp"
          done
          ls -la "$OUT"
          du -sh "$OUT"
      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-deploy/public/img/write-scenes
          git commit -m "chore(임시): 오늘의 그림 20장 추가 (CI 에서 받아 1440x611 webp 로 변환)"
          git push
