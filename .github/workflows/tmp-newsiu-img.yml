name: tmp-newsiu-img
on:
  push:
    branches: [tmp/newsiu-img-260928]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[img-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y webp >/dev/null
      - name: download
        run: |
          mkdir -p docs/newsiu-sample/gen
          while read -r NAME URL; do
            [ -z "$NAME" ] && continue
            curl -fsSL -o /tmp/$NAME.png "$URL"
            cwebp -quiet -q 82 -resize 1280 0 /tmp/$NAME.png -o docs/newsiu-sample/gen/$NAME.webp
            echo "$NAME $(stat -c %s docs/newsiu-sample/gen/$NAME.webp)"
          done < docs/newsiu-sample/gen-list.txt
          ls docs/newsiu-sample/gen | wc -l
      - run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add docs/newsiu-sample/gen && git commit -m "[img-done] newsiu images" && git push
