# ⛔ 임시 — 동화책 2~4권 그림을 받아 webp 로 바꿔 이 브랜치에 커밋합니다. 그림이 들어오면 지웁니다(main 에 올리지 않음).
name: tmp-story-images
on:
  push:
    branches: [claude/vigilant-shannon-atk4q7]
    paths: ['.github/workflows/tmp-story-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
      - run: |
          set -e
          D=cloudflare-deploy/public/img/story
          get(){ curl -fsSL -o /tmp/$1.png "$2"; cwebp -quiet -q 80 -resize 1024 0 /tmp/$1.png -o $D/$1.webp; ls -l $D/$1.webp; }
          get birthday-cake-cover https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034012_6d27a268-48ca-4fc2-86ce-948970c5432e.png
          get robot-dance-cover https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034012_c877d8c2-9ebb-4532-a379-6385559a9590.png
          get treasure-map-cover https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034012_a2da1021-efba-4575-b457-1d82ad3ea6e9.png
          get birthday-cake-s4 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034312_23032930-aa76-4fa6-a0e3-4012a02d0361.png
          get birthday-cake-s7 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034312_d635dfd5-e0d4-4e24-a9a7-6fc04455cc4b.png
          get robot-dance-s4 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034313_49d83e0f-c290-4de2-bb42-fe191abcd8e5.png
          get robot-dance-s9 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034312_cbc2facb-1023-46d4-9686-9885f3abddc1.png
          get treasure-map-s1 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034313_694f530c-9233-4ef1-8dee-94fd31727649.png
          get treasure-map-s9 https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20261013_034312_9f3b4c3f-88b8-4076-8816-6250c23b6fbb.png
          identify $D/*.webp
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add $D/*.webp
          git commit -m "tmp: 동화책 2~4권 그림 9장 (러너가 받아 webp 로 변환)"
          git push
