name: TEMP WebRTC recovery verify

on:
  push:
    branches:
      - fix/webrtc-fast-video-recovery-gpt

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/webrtc-fast-video-recovery-gpt
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply patch
        run: python3 .github/scripts/tmp-webrtc-recovery.py

      - name: Install dependencies
        working-directory: cloudflare-deploy
        run: npm ci --legacy-peer-deps

      - name: Typecheck and focused test
        working-directory: cloudflare-deploy
        run: |
          npx tsc --noEmit
          node test-harness/vc_rx_stall_harness.mjs

      - name: Fast regression suite
        working-directory: cloudflare-deploy
        run: |
          if [ -f test-harness/run.mjs ]; then node test-harness/run.mjs --fast; fi
          for f in \
            test-harness/aao_freeze_harness.mjs \
            test-harness/vc_ghost_liveness_harness.mjs \
            test-harness/body_class_observer_harness.mjs \
            test-harness/observer_camera_guard_harness.mjs \
            test-harness/vc_quality_blindspot_harness.mjs \
            test-harness/asset_version_harness.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done

      - name: Commit verified patch
        run: |
          rm -f .github/workflows/tmp-webrtc-recovery.yml .github/scripts/tmp-webrtc-recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: recover stalled WebRTC video without reconnect'
          git push origin HEAD:fix/webrtc-fast-video-recovery-gpt
