name: TEMP WebRTC fast recovery patch

on:
  push:
    branches: [fix/webrtc-fast-video-recovery-gpt]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webrtc-fast-video-recovery-gpt
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare-deploy/package-lock.json
      - name: Apply minimal receiver recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-deploy/public/js/idx-vc-qlog.js')
          s = p.read_text(encoding='utf-8')
          if 'function vcqRxRecoverySample(' in s:
              raise SystemExit('recovery helper already exists; refusing duplicate patch')

          anchor = 'function vcqRxTick() {'
          if anchor not in s:
              raise SystemExit('vcqRxTick anchor missing')

          helper = r'''/* 🎞️ 수신 영상 빠른 복구 — 실제 decoded frame을 근거로만 UI/element를 회복한다.
   [2026-09-17] v15는 실제 수업에서 수동 조작 없이 영상이 돌아왔지만, 검은 덮개가
   cam-state 신호를 기다려 실제 프레임이 이미 온 뒤에도 남을 수 있었다. 여기서는 기존
   4초 수신 통계 틱을 재사용한다. 새 timer/observer/ICE restart/재협상은 만들지 않는다.
   🔒 'user'(사람이 카메라 OFF)는 절대 지우지 않는다. track/sender enabled도 건드리지 않는다. */
function vcqRxRecoverySample(id, kind, sample, pc, receiver, seq) {
    try {
        if (!id || !sample) return;
        var all = window.__vcRxRecovery || (window.__vcRxRecovery = {});
        var R = all[id] || (all[id] = { seq: -1, bad: 0, attempts: 0, lastAttempt: 0 });
        if (R.seq !== seq) { R.seq = seq; R.video = null; R.audio = null; }
        if (kind === 'video') R.video = { dfr: sample.dfr, known: sample.known, track: receiver && receiver.track };
        else if (kind === 'audio') R.audio = { dr: sample.dr };

        /* 새 decoded frame이 실제로 왔다면 stale AAO 덮개를 신호와 독립적으로 걷는다.
           ⛔ user OFF는 건드리지 않는다. */
        if (kind === 'video' && sample.known && sample.dfr > 0) {
            R.bad = 0; R.attempts = 0;
            var off = window.vcRemoteCamOff || {};
            if (off[id] === 'aao') {
                delete off[id];
                try { if (typeof window.vcApplyRemoteCamHint === 'function') window.vcApplyRemoteCamHint(id); } catch (_) {}
                try { console.log('[vc-recovery] recovered-overlay', id); } catch (_) {}
            }
        }
        if (!R.video || !R.audio) return;                    // 같은 4초 틱의 audio/video 짝을 기다린다

        var why = (window.vcRemoteCamOff || {})[id];
        if (why) { R.bad = 0; return; }                      // aao/user 모두: 의도적으로 영상이 없는 상태
        var cs = pc && pc.connectionState, ice = pc && pc.iceConnectionState;
        if (cs && cs !== 'connected') { R.bad = 0; return; }
        if (ice && ice !== 'connected' && ice !== 'completed') { R.bad = 0; return; }
        var tr = R.video.track;
        if (!tr || tr.readyState !== 'live' || tr.muted) { R.bad = 0; return; }
        if (!(R.audio.dr > 0) || !R.video.known || R.video.dfr > 0) { R.bad = 0; return; }

        R.bad++;
        if (R.bad < 2) return;                               // 2틱 ≈ 8초 — 1회 정지는 건드리지 않는다
        var now = Date.now();
        if (R.attempts >= 3 || now - (R.lastAttempt || 0) < 12000) return;
        R.lastAttempt = now; R.attempts++;

        var box = document.getElementById('vc-video-' + id);
        var v = box && box.querySelector && box.querySelector('video');
        if (!v) return;
        try {
            var ms = v.srcObject;
            var has = false;
            if (ms && typeof ms.getVideoTracks === 'function') {
                var old = ms.getVideoTracks();
                for (var i = 0; i < old.length; i++) if (old[i] === tr || (old[i].id && old[i].id === tr.id)) has = true;
            }
            if (!has && typeof MediaStream !== 'undefined') {
                var next = (ms && typeof ms.getTracks === 'function') ? ms : new MediaStream();
                if (typeof next.getVideoTracks === 'function' && typeof next.removeTrack === 'function') {
                    next.getVideoTracks().forEach(function (t) { if (t !== tr && (!t.id || t.id !== tr.id)) next.removeTrack(t); });
                }
                if (typeof next.addTrack === 'function') next.addTrack(tr);
                v.srcObject = next;
            }
            var pr = v.play && v.play();
            if (pr && typeof pr.catch === 'function') pr.catch(function (e) {
                try { console.warn('[vc-recovery] video-play-rejected', id, e && e.message || e); } catch (_) {}
            });
            try { console.log('[vc-recovery] video-element-recover', id, 'attempt=' + R.attempts); } catch (_) {}
        } catch (e) {
            try { console.warn('[vc-recovery] element-recover-error', id, e && e.message || e); } catch (_) {}
        }
    } catch (_) {}
}

'''
          s = s.replace(anchor, helper + anchor, 1)

          old = "    var prevAll = window.__vcRxPrev || (window.__vcRxPrev = {});\n"
          new = old + "    var rxSeq = (window.__vcRxSeq = (window.__vcRxSeq || 0) + 1);\n"
          if old not in s: raise SystemExit('prevAll anchor missing')
          s = s.replace(old, new, 1)

          old = "                        var fz = s.freezeCount || 0;\n"
          new = old + "                        var frKnown = (typeof s.framesDecoded === 'number');\n                        var fr = frKnown ? s.framesDecoded : 0;\n                        var dfr = (prev && frKnown && typeof prev.fr === 'number') ? Math.max(0, fr - prev.fr) : 0;\n"
          if old not in s: raise SystemExit('video stats anchor missing')
          s = s.replace(old, new, 1)

          old = "                        prevAll[key] = { lost: lost, rec: rec, fz: fz };\n"
          new = "                        prevAll[key] = { lost: lost, rec: rec, fz: fz, fr: frKnown ? fr : null };\n                        try { vcqRxRecoverySample(id, 'video', { dr: dr, dfr: dfr, known: !!(prev && frKnown && typeof prev.fr === 'number') }, pc, r, rxSeq); } catch (_) {}\n"
          if old not in s: raise SystemExit('video prev anchor missing')
          s = s.replace(old, new, 1)

          old = "                        prevAll[key] = { lost: lost, rec: rec, cs: cs, ts: ts };\n"
          new = old + "                        try { vcqRxRecoverySample(id, 'audio', { dr: dr }, pc, r, rxSeq); } catch (_) {}\n"
          if old not in s: raise SystemExit('audio prev anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          idx = Path('cloudflare-deploy/public/index.html')
          t = idx.read_text(encoding='utf-8')
          oldv = 'idx-vc-qlog.js?v=15'
          if oldv not in t: raise SystemExit('expected qlog v15 reference missing')
          t = t.replace(oldv, 'idx-vc-qlog.js?v=16', 1)
          idx.write_text(t, encoding='utf-8')
          PY

      - name: Add focused receiver recovery harness
        shell: bash
        run: |
          cat > cloudflare-deploy/test-harness/vc_rx_stall_harness.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';

          const src = fs.readFileSync(new URL('../public/js/idx-vc-qlog.js', import.meta.url), 'utf8');
          const a = src.indexOf('function vcqRxRecoverySample(');
          const b = src.indexOf('\nfunction vcqRxTick()', a);
          assert.ok(a >= 0 && b > a, 'recovery helper must exist before vcqRxTick');
          const helper = src.slice(a, b);
          for (const bad of ['restartIce(', 'createOffer(', '.close(', 'setInterval(', 'MutationObserver', 'track.enabled', 'replaceTrack(', 'setParameters(']) {
            assert.equal(helper.includes(bad), false, `helper must not contain ${bad}`);
          }

          class FakeStream {
            constructor(tracks = []) { this.tracks = [...tracks]; }
            getTracks() { return [...this.tracks]; }
            getVideoTracks() { return this.tracks.filter(t => t.kind === 'video'); }
            addTrack(t) { if (!this.tracks.includes(t)) this.tracks.push(t); }
            removeTrack(t) { this.tracks = this.tracks.filter(x => x !== t); }
          }
          let now = 100000;
          let playCount = 0;
          const video = { srcObject: new FakeStream(), play() { playCount++; return Promise.resolve(); } };
          const box = { querySelector(sel) { return sel === 'video' ? video : null; } };
          const windowObj = { vcRemoteCamOff: {}, __vcRxRecovery: {} };
          let hintCalls = 0;
          windowObj.vcApplyRemoteCamHint = () => { hintCalls++; };
          const RealDate = Date;
          class FakeDate extends RealDate { static now() { return now; } }
          const context = vm.createContext({ window: windowObj, document: { getElementById: id => id === 'vc-video-p1' ? box : null }, MediaStream: FakeStream, Date: FakeDate, console, Promise });
          vm.runInContext(helper, context);
          const f = context.vcqRxRecoverySample;
          assert.equal(typeof f, 'function');
          const vtrack = { id: 'v1', kind: 'video', readyState: 'live', muted: false };
          const pc = { connectionState: 'connected', iceConnectionState: 'connected' };
          const vr = { track: vtrack };

          windowObj.vcRemoteCamOff.p1 = 'aao';
          f('p1', 'video', { dfr: 1, known: true }, pc, vr, 1);
          assert.equal(windowObj.vcRemoteCamOff.p1, undefined, 'decoded frame clears stale AAO only');
          assert.equal(hintCalls, 1, 'AAO hint refreshes after self-clear');

          windowObj.vcRemoteCamOff.p1 = 'user';
          f('p1', 'video', { dfr: 1, known: true }, pc, vr, 2);
          assert.equal(windowObj.vcRemoteCamOff.p1, 'user', 'manual camera OFF must never be cleared');
          delete windowObj.vcRemoteCamOff.p1;

          windowObj.__vcRxRecovery = {};
          playCount = 0; video.srcObject = new FakeStream();
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 10); f('p1', 'audio', { dr: 8 }, pc, null, 10);
          assert.equal(playCount, 0, 'one stalled tick does not recover');
          now += 4000;
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 11); f('p1', 'audio', { dr: 8 }, pc, null, 11);
          assert.equal(playCount, 1, 'two paired stalled ticks recover video element');
          assert.equal(video.srcObject.getVideoTracks()[0], vtrack, 'live receiver video track is attached');

          now += 4000;
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 12); f('p1', 'audio', { dr: 8 }, pc, null, 12);
          assert.equal(playCount, 1, '12s cooldown prevents 4s retry loop');

          windowObj.__vcRxRecovery = {}; playCount = 0; video.srcObject = new FakeStream(); now += 20000;
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 20); f('p1', 'audio', { dr: 0 }, pc, null, 20);
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 21); f('p1', 'audio', { dr: 0 }, pc, null, 21);
          assert.equal(playCount, 0, 'audio+video dead does not use video-only recovery');

          windowObj.__vcRxRecovery = {}; playCount = 0; windowObj.vcRemoteCamOff.p1 = 'user';
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 30); f('p1', 'audio', { dr: 8 }, pc, null, 30);
          f('p1', 'video', { dfr: 0, known: true }, pc, vr, 31); f('p1', 'audio', { dr: 8 }, pc, null, 31);
          assert.equal(playCount, 0, 'manual camera OFF blocks recovery loop');

          console.log('vc_rx_stall_harness: PASS 10 / FAIL 0');
          EOF

      - name: Install and verify
        working-directory: cloudflare-deploy
        shell: bash
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          node test-harness/vc_rx_stall_harness.mjs
          if [ -f test-harness/run.mjs ]; then node test-harness/run.mjs --fast; fi
          for f in \
            test-harness/aao_freeze_harness.mjs \
            test-harness/vc_ghost_liveness_harness.mjs \
            test-harness/body_class_observer_harness.mjs \
            test-harness/observer_camera_guard_harness.mjs \
            test-harness/vc_quality_blindspot_harness.mjs \
            test-harness/asset_version_harness.mjs; do
            if [ -f "$f" ]; then node "$f"; fi
          done

      - name: Commit verified patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-webrtc-recovery.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m "fix: recover stalled WebRTC video without reconnect"
          git push origin HEAD:fix/webrtc-fast-video-recovery-gpt
