name: tmp word image selection
on:
  push:
    branches: [tmp/word-img-selection]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - run: |
          set -euo pipefail
          mkdir -p tmp-selection
          i=0
          for u in \
            https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20260924_032629_7b692f36-2d5f-43cc-abb6-3b29c4310576.png \
            https://d8j0ntlcm91z4.cloudfront.net/user_3GD1yS6zlj6afu2oFQqivYqvn7k/hf_20260924_032629_3429b05f-43aa-4de2-8e30-c3def5c26e3c.png; do
            curl -fsSL "$u" -o src$i.png
            cwebp -quiet -q 80 -resize 640 480 src$i.png -o tmp-selection/v$i.webp
            i=$((i+1))
          done
          ls -l tmp-selection
          test "$(ls tmp-selection | wc -l)" -eq 2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add tmp-selection
          git commit -m "tmp: selection variants"
          git push
