name: tmp-word-img
on:
  push:
    branches: [tmp/word-img-260923c]
    paths: [tmp/list.tsv]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - run: |
          set -e
          D=cloudflare-deploy/public/img/scene-words; n=0
          while IFS=$'\t' read -r I U; do
            curl -fsSL --retry 3 "$U" -o /tmp/$I.png
            cwebp -quiet -q 68 -resize 640 480 /tmp/$I.png -o $D/$I.webp
            n=$((n+1))
          done < tmp/list.tsv
          echo "got $n of $(wc -l < tmp/list.tsv)"
          test "$n" -eq "$(wc -l < tmp/list.tsv)"
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add $D; git commit -m "tmp: word images"; git push
