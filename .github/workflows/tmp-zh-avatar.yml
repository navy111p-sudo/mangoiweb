# 임시 워크플로 — 중국어 교사 아바타 이미지를 러너가 받아 변환합니다.
# ⛔ main 에 올리지 마세요. 이 브랜치에서만 돌고, 끝나면 브랜치째 지웁니다.
name: tmp-zh-avatar
on:
  push:
    branches: [zh-avatar-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          python3 -m pip install --quiet pillow numpy
      - name: run
        run: |
          set -euxo pipefail
          mkdir -p tmp-preview
          python3 tmp-preview/job.py
      - name: commit
        run: |
          git config user.name  "tmp-zh-avatar"
          git config user.email "noreply@github.com"
          git add -A tmp-preview cloudflare-deploy/public/img || true
          git commit -m "tmp: zh avatar artifacts [skip ci]" || echo "nothing"
          git push origin HEAD:zh-avatar-fetch
