name: Video recovery browser verification
on:
  pull_request:
    paths:
      - '.github/workflows/vc-recovery-browser.yml'
      - 'cloudflare-deploy/public/js/idx-main.js'
      - 'cloudflare-deploy/public/js/idx-vc-textbook.js'
      - 'cloudflare-deploy/public/js/idx-vc-officemode.js'
      - 'test-harness/manual/**'
  push:
    branches: [fix/webrtc-fast-video-recovery, fix/video-recovery-retry-20260926, fix/webrtc-recovery-review-20261003]
  workflow_dispatch:
env:
  TZ: Asia/Seoul
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⚡ 체크아웃 빠르게 (2026-11-03) — 지난번 .git 을 캐시에서 되살리면 아래 checkout 이 «바뀐 것만» 받습니다.
      #    PR·브라우저 검사는 «읽기만» 합니다(저장은 deploy.yml 이 한 주에 한 번). 설명: deploy.yml «git 캐시» 주석.
      - name: Restore .git cache (faster checkout)
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: repo-git-v1-${{ github.run_id }}
          restore-keys: repo-git-v1-
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and typecheck
        working-directory: cloudflare-deploy
        run: |
          npm ci --legacy-peer-deps
          node node_modules/typescript/bin/tsc --noEmit
      - name: Required recovery regressions
        run: |
          node test-harness/aao_freeze_harness.mjs
          node test-harness/vc_ghost_liveness_harness.mjs
          node test-harness/body_class_observer_harness.mjs
          node test-harness/observer_camera_guard_harness.mjs
          node test-harness/vc_quality_blindspot_harness.mjs
          node test-harness/asset_version_harness.mjs
          node test-harness/vc_rx_stall_harness.mjs
          node test-harness/vc_fast_recovery_harness.mjs
          node test-harness/vc_office_recovery_harness.mjs
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/vc-pw" playwright@1.58.2
          "$RUNNER_TEMP/vc-pw/node_modules/.bin/playwright" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/vc-browser/installed/chrome-linux"
          PW_ROOT="$RUNNER_TEMP/vc-pw" node -e 'const {chromium}=require(process.env.PW_ROOT+"/node_modules/playwright");require("fs").symlinkSync(chromium.executablePath(),process.env.RUNNER_TEMP+"/vc-browser/installed/chrome-linux/chrome");'
      - name: Real peer frame recovery timing
        env:
          PW_DIR: ${{ runner.temp }}/vc-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vc-browser
        run: |
          set -o pipefail
          node test-harness/manual/vc-aao-realpc-browser.mjs | tee "$RUNNER_TEMP/vc-realpc.log"
          grep -Eq '결과: PASS [1-9][0-9]* / FAIL 0' "$RUNNER_TEMP/vc-realpc.log"
      - name: Textbook history, teacher guide and background lifecycle
        env:
          PW_DIR: ${{ runner.temp }}/vc-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vc-browser
        run: |
          set -o pipefail
          node test-harness/manual/vc-eric-history-stress-browser.mjs | tee "$RUNNER_TEMP/vc-history.log"
          node test-harness/manual/vc-eric-guide-browser.mjs | tee "$RUNNER_TEMP/vc-guide.log"
          node test-harness/manual/vc-eric-background-browser.mjs | tee "$RUNNER_TEMP/vc-background.log"
      - name: Real outgoing audio after AudioContext failure
        env:
          PW_DIR: ${{ runner.temp }}/vc-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vc-browser
        run: |
          set -o pipefail
          node test-harness/manual/vc-office-recovery-browser.mjs | tee "$RUNNER_TEMP/vc-office-audio.log"
          grep -Eq 'PASS [1-9][0-9]* / FAIL 0' "$RUNNER_TEMP/vc-office-audio.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc-recovery-browser-log
          path: |
            ${{ runner.temp }}/vc-realpc.log
            ${{ runner.temp }}/vc-office-audio.log
            ${{ runner.temp }}/vc-history.log
            ${{ runner.temp }}/vc-guide.log
            ${{ runner.temp }}/vc-background.log
          if-no-files-found: ignore
