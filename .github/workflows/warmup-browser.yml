name: Warmup browser verification
on:
  pull_request:
    paths:
      - 'cloudflare-deploy/public/warmup.html'
      - 'cloudflare-deploy/public/ai-friend.html'
      - 'cloudflare-deploy/public/js/speech-preferences.js'
      - 'cloudflare-deploy/public/img/visemes/**'
      - 'cloudflare-deploy/public/js/avatar-visemes.js'
      - 'cloudflare-deploy/public/js/avatar-viseme-worker.js'
      - 'cloudflare-deploy/public/js/mango-avatar.js'
      - 'test-harness/manual/avatar-viseme-browser.mjs'
      - 'test-harness/manual/speech-preferences-browser.mjs'
      - 'test-harness/helpers/speech-sandbox.mjs'
      - 'test-harness/helpers/browser-pool.mjs'
      - 'cloudflare-deploy/public/js/warmup-guide.js'
      - 'cloudflare-deploy/public/css/warmup-guide.css'
      - 'cloudflare-deploy/public/video/warmup-scenes/**'
      - 'cloudflare-deploy/src/warmup-guidance.ts'
      - 'test-harness/manual/warmup*'
      - 'test-harness/manual/_pw.mjs'
      - '.github/workflows/warmup-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    # 2026-11-03: 두 갈래를 «다른 러너» 에서 동시에 돌립니다(예전엔 한 러너에서 차례로 약 5분 30초~7분).
    #   wiring — 아바타 입모양 시계 + 웜업 화면 배선·변이. ⚠️ 아바타는 시각에 민감해 «혼자» 돕니다:
    #            같은 러너에서 다른 검사와 CPU 를 나누면 짧은 입모양 구간을 놓칩니다(CLAUDE.md 그 함정).
    #   speech — 계정 말빠르기 50건. 사례끼리 독립이라 탭 4개로 동시에(helpers/browser-pool.mjs).
    # ⛔ 갈래를 늘리거나 합칠 때 검사를 빠뜨리지 마세요 — 아래 각 단계의 if 가 «어느 갈래에서 도는가» 입니다.
    name: browser (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [wiring, speech]
    # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 옮겨 가는 중이라 러너마다 OS 가 다를 수 있습니다.
    # 아래 playwright@1.58.2 를 검증해 온 24.04 로 고정합니다(admin-repairs-offline-browser.yml 과 같은 방식).
    # 예방 조치입니다 — 2026-11-03 아바타 단계 실패는 이미 24.04 러너에서 났고 원인은 검사 쪽(미리 재생)이었습니다.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # ⚡ 체크아웃 빠르게 (2026-11-03) — 지난번 .git 을 캐시에서 되살리면 아래 checkout 이 «바뀐 것만» 받습니다.
      #    PR·브라우저 검사는 «읽기만» 합니다(저장은 deploy.yml 이 한 주에 한 번). 설명: deploy.yml «git 캐시» 주석.
      - name: Restore .git cache (faster checkout)
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: repo-git-v1-${{ github.run_id }}
          restore-keys: repo-git-v1-
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/warmup-pw" playwright@1.58.2
          # no --with-deps: apt mirror stalls 10+ min; runner image already has the libs (#2276) / apt 미러가 멈춰 10분+ 지연, 러너에 라이브러리 이미 있음
          "$RUNNER_TEMP/warmup-pw/node_modules/.bin/playwright" install chromium
          mkdir -p "$RUNNER_TEMP/warmup-browser/installed/chrome-linux"
          PW_ROOT="$RUNNER_TEMP/warmup-pw" node -e 'const {chromium}=require(process.env.PW_ROOT+"/node_modules/playwright");require("fs").symlinkSync(chromium.executablePath(),process.env.RUNNER_TEMP+"/warmup-browser/installed/chrome-linux/chrome");'
      - name: Avatar cue clock, speed and cancellation (18 browser cases)
        if: matrix.part == 'wiring'
        env:
          PW_DIR: ${{ runner.temp }}/warmup-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/warmup-browser
        run: node test-harness/manual/avatar-viseme-browser.mjs

      - name: Browser baseline and broken-wiring regression
        if: matrix.part == 'wiring'
        env:
          PW_DIR: ${{ runner.temp }}/warmup-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/warmup-browser
        run: |
          node test-harness/manual/warmup-two-way-browser.mjs
          node test-harness/manual/warmup-guided-browser.mjs
          python3 -m http.server 8931 --bind 127.0.0.1 --directory cloudflare-deploy/public > "$RUNNER_TEMP/warmup-http.log" 2>&1 &
          SERVER_PID=$!
          "$RUNNER_TEMP/warmup-browser/installed/chrome-linux/chrome" --headless=new --remote-debugging-address=127.0.0.1 --remote-debugging-port=9931 --no-sandbox --disable-dev-shm-usage --user-data-dir="$RUNNER_TEMP/warmup-cdp" about:blank > "$RUNNER_TEMP/warmup-chrome.log" 2>&1 &
          BROWSER_PID=$!
          trap 'kill "$SERVER_PID" "$BROWSER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8931/warmup.html -o /dev/null && curl -fsS http://127.0.0.1:9931/json/list -o /dev/null; then break; fi
            sleep 1
          done
          set -o pipefail
          node test-harness/manual/warmup-bts-book-browser.mjs | tee "$RUNNER_TEMP/warmup-bts.log"
          grep -Eq 'warmup-bts-book-browser — PASS [1-9][0-9]* / FAIL 0' "$RUNNER_TEMP/warmup-bts.log"
          node test-harness/manual/warmup-two-way-mutation.mjs

      - name: Account speech preferences sandbox (50 full-page cases)
        if: matrix.part == 'speech'
        env:
          PW_DIR: ${{ runner.temp }}/warmup-pw
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/warmup-browser
        run: node test-harness/manual/speech-preferences-browser.mjs
