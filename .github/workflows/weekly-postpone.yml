name: Lesson schedule regression
on:
  pull_request:
    paths:
      - 'cloudflare-deploy/src/**'
      - 'cloudflare-deploy/public/lesson-postpone-demo.html'
      - 'test-harness/weekly_postpone_*'
      - 'test-harness/manual/weekly-postpone-browser.mjs'
      - '.github/workflows/weekly-postpone.yml'
permissions:
  contents: read
jobs:
  schedule-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ⚡ 체크아웃 빠르게 (2026-11-03) — 지난번 .git 을 캐시에서 되살리면 아래 checkout 이 «바뀐 것만» 받습니다.
      #    PR·브라우저 검사는 «읽기만» 합니다(저장은 deploy.yml 이 한 주에 한 번). 설명: deploy.yml «git 캐시» 주석.
      - name: Restore .git cache (faster checkout)
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: repo-git-v1-${{ github.run_id }}
          restore-keys: repo-git-v1-
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-deploy/package-lock.json'
      # Source fixtures follow actual admin imports with the project's TypeScript parser.
      # Install the locked dev dependencies just as the shared PR/deploy gate does.
      - name: Install source harness dependencies
        working-directory: cloudflare-deploy
        run: npm ci
      - name: 600 transaction scenarios
        run: node test-harness/weekly_postpone_atomic_harness.mjs
      - name: 200 postponement and 200 change request workflows
        run: node test-harness/weekly_postpone_routes_harness.mjs
      - name: Install browser tools outside checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/lesson-browser" --ignore-scripts --package-lock=false --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/lesson-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: PC and mobile browser checks
        env:
          PW_DIR: ${{ runner.temp }}/lesson-browser
          BROWSER_OUTPUT: ${{ runner.temp }}/lesson-browser-results
        run: node test-harness/manual/weekly-postpone-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lesson-browser-results
          path: ${{ runner.temp }}/lesson-browser-results
