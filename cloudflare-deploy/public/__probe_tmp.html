<!doctype html><html data-admin-theme="ivory" data-admin-tone="slate"><head><meta charset="utf-8"></head><body><link rel="stylesheet" href="/css/admin-inline-c.css"><details class="table-card menu-card" id="card-timetable" open><summary><span>x</span></summary><div class="menu-body"><style>
      /* ⚠️ 이 style 은 admin-inline-c.css 링크(592행)보다 «뒤» 라야 이긴다 — 그 파일은
            <head> 가 아니라 <body> 안에서 링크된다(CLAUDE.md). 카드 자리에 두는 이유다.
         ⚠️ 숫자에 «색으로» 뜻을 싣지 않는다 — 관리자 화면은 글자색 보정 페인터가 셋이라
            인라인 !important 로 덮인다. 그래서 위계는 «크기·굵기», 경고는 «테두리 + ⚠ 글자» 로 진다.
         ⚠️ 배경은 background-color 로 쓴다(background:#f… 는 옛 다크 규칙에 걸려 투명해진다). */
      #card-timetable .sc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0}
      #card-timetable .sc-card{display:flex;flex-direction:column;gap:2px;min-width:0;
        background-color:#ffffff;border:1px solid #dfe3ea;border-radius:10px;padding:12px 13px;
        text-decoration:none;box-shadow:0 1px 2px rgba(16,24,40,.05)}
      #card-timetable a.sc-card{cursor:pointer}
      #card-timetable a.sc-card:hover{border-color:#b45309}
      #card-timetable .sc-card.sc-static{cursor:default}
      #card-timetable .sc-head{display:flex;align-items:center;gap:6px;min-width:0}
      #card-timetable .sc-ic{font-size:14px;flex-shrink:0}
      #card-timetable .sc-lb{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      /* 한 줄짜리 숫자에는 line-height 를 못 박는다 — 안 정하면 바깥에서 1.5~1.7 을 물려받아
         줄은 하나인데 상자만 두 줄처럼 높아진다(CLAUDE.md). */
      #card-timetable .sc-big{font-size:24px;font-weight:900;line-height:1.18;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums;white-space:nowrap}
      #card-timetable .sc-big.sc-nonum{font-size:0;line-height:0}
      #card-timetable .sc-u{font-size:11px;font-weight:600;margin-left:2px;opacity:.65}
      #card-timetable .sc-sub{font-size:10.5px;line-height:1.5;opacity:.8}
      /* 🚨 안 나간 알림 — 색이 아니라 «테두리» 가 뜻을 진다(페인터는 테두리를 안 건드린다). */
      #card-timetable .sc-card.sc-alert{border-color:#b91c1c;border-left-width:4px}
    </style><div id="sc-cards" class="sc-cards"></div></div></details><script src="/js/adm-schedule-cards.js"></script></body></html>
