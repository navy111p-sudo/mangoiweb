<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>대리점 수업료 · 망고아이</title>
<!--
  🏫 대리점 수업료 — 본사 화면 (2026-10-01 신설)

  옛 mangoi.co.kr B2B 결제의 12가지 문제를 푼 «충전금 지갑» 의 운영판.
    · 정본 계산은 src/b2b-tuition.ts(순수) · D1/API 는 src/b2b-tuition-load.ts
    · 이 화면은 «그리기만» 한다 — 금액·차감·문자 일정을 여기서 다시 계산하지 않는다.
    · 대리점은 로그인 없이 /b2b-pay.html?t=<링크> 한 장으로 보고·내고·연기·이의를 한다.

  ⚠️ /admin/ 밑이라 CSS·JS 는 인라인이다(isAdminPath default-deny 가 /admin/ 자산까지 삼킨다).
  ⚠️ 밝은 테마로만 쓴다 — adm-light-theme 함정(어두운 카드 + 검은 글자).
  ⛔ 스위치 셋(auto·notify·autopay_live)은 기본 «꺼짐». 켜는 것은 사람이다.
-->
<style>
  :root{ --bg:#f5f7fb; --card:#fff; --tx:#101828; --sub:#475467; --mut:#667085; --bd:#e4e7ec;
         --acc:#b45309; --ok:#067647; --okBg:#ecfdf3; --bad:#b42318; --badBg:#fef3f2; --warnBg:#fffaeb; --blue:#1d4ed8; --blueBg:#eff4ff; }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; background:var(--bg); color:var(--tx); }
  body{ font-family:'MangoiHanSC','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:14px; line-height:1.5; }
  @media (min-width:1024px){ body{ zoom:1.3; } }
  .wrap{ max-width:1180px; margin:0 auto; padding:16px; }
  header.top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  header.top img{ width:40px; height:40px; }
  header.top h1{ font-size:20px; margin:0; flex:1 1 auto; }
  .btn{ border:1px solid var(--bd); background:#fff; color:var(--tx); border-radius:8px; padding:7px 12px; font:inherit; cursor:pointer; }
  .btn:hover{ background:#f2f4f7; }
  .btn.pri{ background:#b45309; border-color:#b45309; color:#fff; }
  .btn.pri:hover{ background:#92400e; }
  .btn.dan{ background:#fff; border-color:#fda29b; color:var(--bad); }
  .btn.sm{ padding:3px 8px; font-size:12px; }
  .card{ background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .card h2{ font-size:16px; margin:0 0 8px; }
  .muted{ color:var(--mut); font-size:12.5px; }
  .sub{ color:var(--sub); }
  .grid3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:10px; }
  .sw{ border:1px solid var(--bd); border-radius:10px; padding:10px 12px; display:block; min-width:0; }
  .sw b{ display:block; margin-bottom:2px; }
  .sw .state{ font-weight:700; }
  .on{ color:var(--ok); } .off{ color:var(--bad); }
  .tblwrap{ overflow-x:auto; }
  table{ border-collapse:collapse; width:max-content; min-width:100%; }
  th,td{ border-bottom:1px solid var(--bd); padding:7px 8px; text-align:left; white-space:nowrap; font-size:13px; }
  th{ background:#f9fafb; color:var(--sub); font-weight:600; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .pill{ display:inline-block; border:1px solid var(--bd); border-radius:99px; padding:1px 8px; font-size:12px; }
  .lv-none{ background:var(--okBg); border-color:#abefc6; color:var(--ok); }
  .lv-due_soon{ background:var(--blueBg); border-color:#c4d4fb; color:var(--blue); }
  .lv-overdue,.lv-warn{ background:var(--warnBg); border-color:#fedf89; color:#93370d; }
  .lv-lock_candidate{ background:var(--badBg); border-color:#fda29b; color:var(--bad); }
  .msg{ border-radius:8px; padding:9px 12px; margin:8px 0; font-size:13px; }
  .msg.ok{ background:var(--okBg); color:var(--ok); }
  .msg.bad{ background:var(--badBg); color:var(--bad); }
  .msg.info{ background:var(--blueBg); color:#1e3a8a; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  input[type=text],input[type=number],select,textarea{ border:1px solid #cbd5e1; background:#fff; color:#101828; border-radius:8px; padding:6px 9px; font:inherit; }
  textarea{ width:100%; min-height:70px; }
  .explain{ background:#f9fafb; border:1px solid var(--bd); border-radius:8px; padding:8px 12px; margin:6px 0; }
  .explain p{ margin:3px 0; }
  .report li{ margin:2px 0; }
  .kpi{ display:flex; gap:10px; flex-wrap:wrap; }
  .kpi div{ border:1px solid var(--bd); border-radius:10px; padding:8px 12px; min-width:140px; }
  .kpi b{ display:block; font-size:18px; }
  a{ color:#1d4ed8; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="/img/mango-char.png" alt="">
    <h1 id="ttl">🏫 대리점 수업료</h1>
    <button type="button" class="btn" id="langBtn">EN</button>
    <button type="button" class="btn" id="refreshBtn">🔄</button>
    <a class="btn" href="/admin.html" id="backLink">← 관리자</a>
  </header>
  <div id="msg"></div>

  <section class="card" id="sec-switch">
    <h2 id="h-switch">⚙️ 자동화 스위치</h2>
    <p class="muted" id="sw-note"></p>
    <div class="grid3" id="switches"></div>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn" id="dryBtn"></button>
      <button type="button" class="btn pri" id="runBtn"></button>
      <span class="muted" id="lastRun"></span>
    </div>
    <div id="runOut"></div>
  </section>

  <section class="card" id="sec-shops">
    <h2 id="h-shops">📋 켜 둔 대리점</h2>
    <div class="tblwrap"><table id="shopTbl"></table></div>
    <p class="muted" id="pendNote"></p>
  </section>

  <section class="card" id="sec-detail" hidden>
    <h2 id="h-detail"></h2>
    <div id="detail"></div>
  </section>

  <section class="card" id="sec-cand">
    <h2 id="h-cand">➕ 켤 수 있는 대리점 (예약이 있는 곳)</h2>
    <p class="muted" id="cand-note"></p>
    <div class="tblwrap"><table id="candTbl"></table></div>
  </section>

  <section class="card" id="sec-disp">
    <h2 id="h-disp">❓ 이의 신청</h2>
    <div id="disputes"></div>
  </section>

  <section class="card" id="sec-log">
    <h2 id="h-log">📜 최근 기록</h2>
    <div class="tblwrap"><table id="logTbl"></table></div>
  </section>
</div>
<script>
(function(){
  'use strict';
  var LANG = 'ko';
  try { LANG = (localStorage.getItem('mangoi_lang') === 'en') ? 'en' : 'ko'; } catch (e) {}
  function T(ko, en){ return LANG === 'en' ? en : ko; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function won(n){ return (n == null || !isFinite(Number(n))) ? '—' : '₩' + Number(n).toLocaleString('ko-KR'); }
  function $(id){ return document.getElementById(id); }
  var BASE = '/api/admin/ai-billing/tuition/';
  var STATE = { ov: null, shop: null, detail: null };

  function api(sub, body){
    var opt = { credentials: 'include', headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
    return fetch(BASE + sub, opt).then(function(r){
      return r.json().catch(function(){ return { ok: false, error: 'HTTP ' + r.status }; }).then(function(d){
        if (!r.ok && d && d.ok !== false) d = { ok: false, error: 'HTTP ' + r.status };
        return d || { ok: false, error: 'empty' };
      });
    }).catch(function(e){ return { ok: false, error: String(e && e.message || e) }; });
  }
  function errText(d){
    var e = String(d && (d.message || d.error) || 'unknown');
    if (d && d.who_line) e += ' · ' + d.who_line;
    return e;
  }
  function flash(kind, text){ $('msg').innerHTML = '<div class="msg ' + kind + '">' + esc(text) + '</div>'; }

  var SW_INFO = {
    auto:         ['🤖 자동 정산 허용', '켜면 정산 실행이 지난 수업을 충전금에서 빼고, 모자라면 보충 청구서, 20일부터는 다음 달 청구서를 만듭니다. ⚠️ 지금은 매일 저절로 돌지 않습니다 — 아래 «지금 실제로 실행» 을 눌러야 돕니다(그 버튼은 이 스위치와 무관하게 돕니다).', '🤖 Allow auto settlement', 'When on, a settlement run deducts past classes, issues a top-up if short, and the next-month invoice from the 20th. ⚠️ It does not run by itself yet — press «Run now» below (that button runs regardless of this switch).'],
    notify:       ['✉️ 문자 실제 발송', '꺼져 있으면 «보낼 문자» 를 기록만 하고 대리점에 보내지 않습니다.', '✉️ Send SMS', 'When off, reminder texts are only logged, not sent.'],
    autopay_live: ['💳 자동결제 실제 청구', '카드를 등록한 대리점에 마감일 자동 청구합니다. 꺼져 있으면 «청구할 금액» 만 기록합니다.', '💳 Charge autopay', 'Charges registered cards on the due date. When off, only logged.']
  };
  var LV = { none: ['정상','OK'], due_soon: ['마감 임박','Due soon'], overdue: ['연체','Overdue'], warn: ['D+14 경고','D+14 warning'], lock_candidate: ['D+21 잠금 후보','D+21 lock candidate'] };
  var KIND = { monthly: ['정기','Monthly'], topup: ['보충','Top-up'] };
  var STATUS = { issued: ['미납','Unpaid'], partial: ['일부 입금','Partial'], paid: ['완납','Paid'], void: ['취소','Void'] };

  function renderStatic(){
    document.documentElement.lang = LANG;
    $('langBtn').textContent = LANG === 'en' ? '한국어' : 'EN';
    $('ttl').textContent = T('🏫 대리점 수업료', '🏫 Agency Tuition');
    $('backLink').textContent = T('← 관리자', '← Admin');
    $('h-switch').textContent = T('⚙️ 자동화 스위치', '⚙️ Automation switches');
    $('sw-note').textContent = T('세 스위치는 처음에 모두 꺼져 있습니다. 먼저 «미리 돌려 보기» 로 무엇을 할지 확인한 뒤 켜세요. 대리점마다 «켠 날» 이전 수업은 절대 빼지 않습니다.',
      'All three start OFF. Use “Dry run” first. Classes before each agency’s start date are never charged.');
    $('dryBtn').textContent = T('🔍 미리 돌려 보기 (아무것도 안 바뀜)', '🔍 Dry run (changes nothing)');
    $('runBtn').textContent = T('▶ 지금 실제로 실행', '▶ Run now');
    $('h-shops').textContent = T('📋 켜 둔 대리점', '📋 Enabled agencies');
    $('h-cand').textContent = T('➕ 켤 수 있는 대리점 (예약이 있는 곳)', '➕ Agencies you can enable');
    $('cand-note').textContent = T('카페24에서 옮겨 온 수업(c24)은 기본으로 차감에서 뺍니다 — 옛 사이트에서 이미 청구하고 있을 수 있어 두 번 청구되지 않게 하려는 것입니다.',
      'Classes mirrored from cafe24 (c24) are excluded by default to avoid double billing.');
    $('h-disp').textContent = T('❓ 이의 신청', '❓ Disputes');
    $('h-log').textContent = T('📜 최근 기록', '📜 Recent log');
  }

  function renderOverview(){
    var ov = STATE.ov; if (!ov) return;
    var h = '';
    ['auto','notify','autopay_live'].forEach(function(k){
      var on = !!(ov.switches && ov.switches[k]); var i = SW_INFO[k];
      h += '<label class="sw"><b>' + esc(T(i[0], i[2])) + '</b><span class="muted">' + esc(T(i[1], i[3])) + '</span><div class="row">'
        + '<span class="state ' + (on ? 'on' : 'off') + '">' + (on ? T('켜짐', 'ON') : T('꺼짐', 'OFF')) + '</span>'
        + '<button type="button" class="btn sm" data-act="sw" data-k="' + k + '" data-on="' + (on ? '0' : '1') + '">' + (on ? T('끄기', 'Turn off') : T('켜기', 'Turn on')) + '</button></div></label>';
    });
    $('switches').innerHTML = h;
    var lr = ov.last_run;
    $('lastRun').textContent = lr ? T('마지막 실행: ', 'Last run: ') + new Date(lr.at).toLocaleString() + ' · ' + (lr.status === 'disabled' ? T('스위치 꺼짐으로 건너뜀', 'skipped (switch off)') : T(lr.shops + '곳', lr.shops + ' shops')) : T('아직 한 번도 실행되지 않았습니다', 'Never run yet');

    var shops = (ov.shops || []);
    var en = shops.filter(function(s){ return s.enabled; });
    if (!en.length) $('shopTbl').innerHTML = '<tr><td class="muted">' + T('아직 켜 둔 대리점이 없습니다. 아래 «켤 수 있는 대리점» 에서 켜세요.', 'No agency enabled yet. Enable one below.') + '</td></tr>';
    else {
      var t = '<tr><th>' + T('대리점','Agency') + '</th><th>' + T('켠 날','Since') + '</th><th>' + T('충전금 잔액','Balance') + '</th><th>' + T('미납','Owed') + '</th><th>' + T('상태','Status') + '</th><th>' + T('자동결제','Autopay') + '</th><th>' + T('문자 번호','Phone') + '</th><th></th></tr>';
      en.forEach(function(s){
        var lv = LV[s.overdue] || LV.none;
        t += '<tr><td><b>' + esc(s.shop_name) + '</b></td><td>' + esc(s.enabled_on || '—') + '</td>'
          + '<td class="num">' + (s.balance == null ? '<span class="off">' + T('못 읽음','unknown') + '</span>' : won(s.balance)) + '</td>'
          + '<td class="num">' + won(s.owed) + (s.open_invoices ? ' <span class="muted">(' + s.open_invoices + T('건',' inv') + ')</span>' : '') + '</td>'
          + '<td><span class="pill lv-' + esc(s.overdue || 'none') + '">' + esc(T(lv[0], lv[1])) + '</span></td>'
          + '<td>' + (s.autopay ? '💳 ' + T('등록','On') : '—') + '</td>'
          + '<td>' + (s.has_phone ? '📱' : '<span class="off">' + T('없음 — 문자 못 감','none — no SMS') + '</span>') + '</td>'
          + '<td><button type="button" class="btn sm" data-act="open" data-shop="' + esc(s.shop_name) + '">' + T('열기','Open') + '</button></td></tr>';
      });
      $('shopTbl').innerHTML = t;
    }
    $('pendNote').innerHTML = ov.pending_agency_postpones ? '📅 ' + esc(T('대리점이 낸 연기 신청 ' + ov.pending_agency_postpones + '건이 결재를 기다립니다 — 승인 전까지 그 수업은 차감하지 않습니다(30분 전 신청).', ov.pending_agency_postpones + ' agency postpone request(s) pending — not charged until decided.')) : '';

    var on = {}; en.forEach(function(s){ on[s.shop_name] = 1; });
    var off = {}; shops.forEach(function(s){ if (!s.enabled) off[s.shop_name] = 1; });
    var cand = (ov.candidates || []).filter(function(c){ return !on[c.shop_name]; });
    if (!cand.length) $('candTbl').innerHTML = '<tr><td class="muted">' + T('후보가 없습니다', 'No candidates') + '</td></tr>';
    else {
      var c = '<tr><th>' + T('대리점','Agency') + '</th><th>' + T('학생','Students') + '</th><th>' + T('예약 행','Rows') + '</th><th>' + T('카페24 수업','cafe24 rows') + '</th><th></th></tr>';
      cand.forEach(function(x){
        c += '<tr><td>' + esc(x.shop_name) + (off[x.shop_name] ? ' <span class="muted">(' + T('꺼 둠','off') + ')</span>' : '') + '</td><td class="num">' + Number(x.students || 0) + '</td><td class="num">' + Number(x.rows || 0) + '</td>'
          + '<td class="num">' + (Number(x.c24_rows) ? '<span class="pill lv-warn">' + Number(x.c24_rows) + ' · ' + T('차감 제외','excluded') + '</span>' : '0') + '</td>'
          + '<td><button type="button" class="btn sm" data-act="enable" data-shop="' + esc(x.shop_name) + '">' + T('켜기','Enable') + '</button></td></tr>';
      });
      $('candTbl').innerHTML = c;
    }

    var ds = ov.disputes || [];
    if (!ds.length) $('disputes').innerHTML = '<p class="muted">' + T('이의 신청이 없습니다', 'No disputes') + '</p>';
    else {
      var dh = '';
      ds.forEach(function(d){
        dh += '<div class="explain"><div class="row"><b>' + esc(d.shop_name) + '</b><span class="muted">' + esc(d.month || '') + ' · ' + new Date(d.created_at).toLocaleString() + ' · ' + T('담당','to') + ' ' + esc(d.assignee || '') + '</span>'
          + '<span class="pill ' + (d.status === 'open' ? 'lv-warn' : 'lv-none') + '">' + (d.status === 'open' ? T('답변 대기','Open') : T('답변함','Answered')) + '</span></div>'
          + '<p>' + esc(d.message) + '</p>';
        if (d.status === 'open') dh += '<textarea id="ans-' + d.id + '" placeholder="' + esc(T('답변 기록(본사 내부용 — 대리점 화면에는 아직 안 보입니다)', 'Answer record (internal — not shown to the agency yet)')) + '"></textarea><div class="row"><button type="button" class="btn pri sm" data-act="answer" data-id="' + d.id + '">' + T('답변 저장','Save answer') + '</button></div>';
        else dh += '<p class="sub">↳ ' + esc(d.answer || '') + '</p>';
        dh += '</div>';
      });
      $('disputes').innerHTML = dh;
    }

    var lg = ov.log || [];
    if (!lg.length) $('logTbl').innerHTML = '<tr><td class="muted">' + T('기록이 없습니다', 'No log') + '</td></tr>';
    else {
      var l = '<tr><th>' + T('시각','When') + '</th><th>' + T('대리점','Agency') + '</th><th>' + T('무엇','What') + '</th><th>' + T('내용','Detail') + '</th></tr>';
      lg.forEach(function(x){
        var det = x.detail; try { var j = JSON.parse(x.detail); det = Array.isArray(j) ? j.join(' · ') : JSON.stringify(j); } catch (e) {}
        l += '<tr><td>' + new Date(x.at).toLocaleString() + '</td><td>' + esc(x.shop_name || '—') + '</td><td>' + esc(x.action) + '</td><td style="white-space:normal;max-width:560px">' + esc(det) + '</td></tr>';
      });
      $('logTbl').innerHTML = l;
    }
  }

  function explainBox(calc){
    if (!calc) return '';
    var lines = (LANG === 'en' ? calc.explain_en : calc.explain_ko) || [];
    var h = '<div class="explain">';
    lines.forEach(function(p){ h += '<p>' + esc(p) + '</p>'; });
    h += '</div>';
    if (calc.lines && calc.lines.length) {
      h += '<div class="tblwrap"><table><tr><th>' + T('학생','Student') + '</th><th>' + T('횟수','Count') + '</th><th>' + T('요일·날짜','Pattern') + '</th><th>' + T('금액','Amount') + '</th></tr>';
      calc.lines.forEach(function(ln){
        h += '<tr><td>' + esc(ln.name) + (ln.excluded ? ' <span class="muted">(' + esc(ln.excluded) + ')</span>' : '') + '</td><td class="num">' + Number(ln.count) + '</td><td>' + esc(LANG === 'en' ? ln.pattern_en : ln.pattern_ko) + '</td><td class="num">' + won(ln.amount) + (ln.no_price ? ' <span class="off">' + T('단가 모름','no price') + '</span>' : '') + '</td></tr>';
      });
      h += '</table></div>';
    }
    return h;
  }

  function renderDetail(){
    var v = STATE.detail; var sec = $('sec-detail');
    if (!v) { sec.hidden = true; return; }
    sec.hidden = false;
    $('h-detail').textContent = '🏫 ' + v.shop_name;
    var w = v.wallet;
    var h = '<div class="kpi">'
      + '<div><span class="muted">' + T('충전금 잔액','Balance') + '</span><b>' + (w ? won(w.balance) : T('못 읽음','unknown')) + '</b></div>'
      + '<div><span class="muted">' + T('이번 달 남은 수업','Remaining this month') + '</span><b>' + won(v.committed_krw) + '</b></div>'
      + '<div><span class="muted">' + T('회당 단가(20분)','Unit (20 min)') + '</span><b>' + won(v.unit) + '</b></div>'
      + '<div><span class="muted">' + T('잔액 알림','Alert') + '</span><b>' + (v.alert === 'empty' ? '🔴 ' + T('바닥','Empty') : v.alert === 'low' ? '🟡 ' + T('부족','Low') : '🟢 ' + T('충분','OK')) + '</b></div>'
      + '</div>';
    h += '<h3>' + T('🔗 대리점 링크 (로그인 없이 결제·조회)', '🔗 Agency link (no login)') + '</h3>';
    h += '<div class="row"><input type="text" id="linkBox" readonly style="flex:1 1 360px" value="' + esc(v.link || '') + '"><button type="button" class="btn sm" data-act="copy">' + T('복사','Copy') + '</button><button type="button" class="btn sm dan" data-act="rotate">' + T('새 링크로 바꾸기','Rotate') + '</button></div>';
    h += '<p class="muted">' + T('링크를 바꾸면 옛 링크는 바로 막힙니다. 링크가 새어 나갔을 때만 쓰세요.', 'Rotating instantly disables the old link.') + '</p>';
    h += '<h3>' + T('⚙️ 설정', '⚙️ Settings') + '</h3><div class="row">'
      + '<label>' + T('문자 받을 번호','SMS phone') + ' <input type="text" id="phoneBox" value="' + esc(v.phone || '') + '" placeholder="01012345678"></label>'
      + '<label><input type="checkbox" id="c24Box"' + (v.include_c24 ? ' checked' : '') + '> ' + T('카페24 수업도 차감','Also charge cafe24 classes') + '</label>'
      + '<button type="button" class="btn sm pri" data-act="saveShop">' + T('저장','Save') + '</button>'
      + '<button type="button" class="btn sm dan" data-act="disable">' + T('이 대리점 끄기','Disable') + '</button></div>';
    if (!v.phone) h += '<div class="msg bad">' + T('📵 번호가 없어 독촉 문자를 보낼 수 없습니다. 번호를 넣어 주세요.', '📵 No phone — reminders cannot be sent.') + '</div>';

    h += '<h3>' + T('🏦 통장 입금·조정 기록', '🏦 Record deposit / adjustment') + '</h3><div class="row">'
      + '<input type="number" id="amtBox" placeholder="' + esc(T('금액(빼려면 −)', 'Amount (− to reduce)')) + '">'
      + '<input type="text" id="memoBox" placeholder="' + esc(T('무슨 돈인지 (필수)', 'Memo (required)')) + '" style="flex:1 1 220px">'
      + '<select id="invSel"><option value="">' + T('청구서와 안 묶음(조정)','Not linked (adjust)') + '</option>';
    (v.invoices || []).filter(function(i){ return i.status === 'issued' || i.status === 'partial'; }).forEach(function(i){
      h += '<option value="' + i.id + '">#' + i.id + ' ' + esc(T(KIND[i.kind][0], KIND[i.kind][1])) + ' ' + esc(i.month) + ' · ' + won(i.owed_krw) + '</option>';
    });
    h += '</select><button type="button" class="btn sm pri" data-act="wallet">' + T('기록','Record') + '</button></div>';

    h += '<h3>' + T('🧾 청구서', '🧾 Invoices') + '</h3>';
    var invs = v.invoices || [];
    if (!invs.length) h += '<p class="muted">' + T('아직 청구서가 없습니다', 'No invoices yet') + '</p>';
    invs.forEach(function(i){
      var st = STATUS[i.status] || [i.status, i.status]; var lv = LV[i.overdue] || LV.none;
      h += '<details class="explain"><summary><b>#' + i.id + '</b> ' + esc(T(KIND[i.kind][0], KIND[i.kind][1])) + ' · ' + esc(i.month) + ' · ' + won(i.due_krw)
        + ' · ' + esc(T(st[0], st[1])) + (i.status !== 'paid' && i.status !== 'void' ? ' · ' + T('마감','due') + ' ' + esc(i.due_date) + ' <span class="pill lv-' + esc(i.overdue) + '">' + esc(T(lv[0], lv[1])) + '</span>' : '')
        + (i.first_month ? ' · ' + T('첫 달','first month') : '') + '</summary>'
        + '<p class="muted">' + T('보낸 문자: ','Sent: ') + esc((i.reminders || []).join(', ') || '—') + ' · ' + T('낸 돈 ','Paid ') + won(i.paid_krw) + '</p>'
        + explainBox(i.calc)
        + (i.status === 'issued' && !Number(i.paid_krw) ? '<button type="button" class="btn sm dan" data-act="void" data-id="' + i.id + '">' + T('이 청구서 취소','Void') + '</button>' : '')
        + '</details>';
    });

    h += '<h3>' + T('🔮 다음 달 미리 보기', '🔮 Next month preview') + ' (' + esc(v.next_month) + ')</h3>' + (v.next_preview ? explainBox(v.next_preview) : '<p class="muted">' + T('잔액을 못 읽어 계산하지 않았습니다', 'Not computed (balance unknown)') + '</p>');

    h += '<h3>' + T('👧 학생 (이번 달)', '👧 Students (this month)') + '</h3><div class="tblwrap"><table><tr><th>' + T('이름','Name') + '</th><th>' + T('차감 회차','Charged') + '</th><th>' + T('금액','Amount') + '</th><th>' + T('청구','Billing') + '</th></tr>';
    (v.current || []).forEach(function(s){
      h += '<tr><td>' + esc(s.name) + '</td><td class="num">' + Number(s.deducted) + '</td><td class="num">' + won(s.charged_krw) + '</td><td>'
        + (s.uid ? '<button type="button" class="btn sm" data-act="excl" data-uid="' + esc(s.uid) + '" data-ex="' + (s.excluded ? '0' : '1') + '">' + (s.excluded ? T('↩ 다시 청구', '↩ Include') : T('청구에서 빼기', 'Exclude')) + '</button>' : '') + (s.excluded ? ' <span class="muted">' + esc(s.excluded) + '</span>' : '') + '</td></tr>';
    });
    h += '</table></div>';

    var we = v.wallet_entries || [];
    if (we.length) {
      h += '<h3>' + T('💰 충전금 들어온 기록', '💰 Wallet entries') + '</h3><div class="tblwrap"><table><tr><th>' + T('시각','When') + '</th><th>' + T('종류','Kind') + '</th><th>' + T('금액','Amount') + '</th><th>' + T('메모','Memo') + '</th><th>' + T('누가','By') + '</th></tr>';
      we.forEach(function(e){ h += '<tr><td>' + new Date(e.created_at).toLocaleString() + '</td><td>' + esc(e.kind) + '</td><td class="num">' + won(e.amount) + '</td><td>' + esc(e.memo || '') + '</td><td>' + esc(e.created_by || '') + '</td></tr>'; });
      h += '</table></div>';
    }
    h += '<div class="row" style="margin-top:10px"><button type="button" class="btn" data-act="dryShop">' + T('🔍 이 대리점만 미리 돌려 보기', '🔍 Dry run this agency') + '</button></div><div id="shopRunOut"></div>';
    $('detail').innerHTML = h;
  }

  function reportHtml(d){
    if (!d || d.ok !== true) return '<div class="msg bad">' + esc(errText(d)) + '</div>';
    var h = '<div class="msg info">' + esc((d.status === 'dry_run' ? T('미리 보기 — 아무것도 바뀌지 않았습니다', 'Dry run — nothing changed') : d.status === 'disabled' ? T('스위치가 꺼져 있어 건너뛰었습니다', 'Skipped (switch off)') : T('실행했습니다', 'Ran')) + ' · ' + (d.day || '') + ' · ' + T((d.shops || 0) + '곳', (d.shops || 0) + ' shops')) + '</div>';
    (d.report || []).forEach(function(r){
      h += '<div class="explain"><b>' + esc(r.shop) + '</b> · ' + T('잔액','balance') + ' ' + won(r.balance) + '<ul class="report">';
      if (!(r.actions || []).length) h += '<li class="muted">' + T('할 일 없음', 'Nothing to do') + '</li>';
      (r.actions || []).forEach(function(a){ h += '<li>' + esc(a) + '</li>'; });
      h += '</ul></div>';
    });
    return h;
  }

  function loadOverview(){
    return api('overview').then(function(d){
      if (d.ok !== true) { flash('bad', T('불러오지 못했습니다: ', 'Load failed: ') + errText(d)); return; }
      STATE.ov = d; renderOverview();
    });
  }
  function openShop(name){
    STATE.shop = name;
    return api('shop?shop_name=' + encodeURIComponent(name)).then(function(d){
      if (d.ok !== true) { flash('bad', errText(d)); return; }
      STATE.detail = d; renderDetail();
      $('sec-detail').scrollIntoView({ block: 'start' });
    });
  }
  function reloadAll(){ return loadOverview().then(function(){ if (STATE.shop) return openShop(STATE.shop); }); }

  document.addEventListener('click', function(ev){
    var b = ev.target.closest && ev.target.closest('[data-act]'); if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'sw') {
      var k = b.getAttribute('data-k'), on = b.getAttribute('data-on') === '1';
      var ask = on ? T('정말 켤까요? ', 'Turn on? ') + T(SW_INFO[k][0], SW_INFO[k][2]) : T('끌까요?', 'Turn off?');
      if (!window.confirm(ask)) return;
      api('switch', { key: k, on: on }).then(function(d){ d.ok === true ? flash('ok', T('저장했습니다', 'Saved')) : flash('bad', errText(d)); loadOverview(); });
    } else if (a === 'open') openShop(b.getAttribute('data-shop'));
    else if (a === 'enable') {
      var s = b.getAttribute('data-shop');
      if (!window.confirm(T(s + ' 을(를) 켤까요?\n오늘부터의 수업만 충전금에서 뺍니다. 카페24 수업은 빼지 않습니다.', 'Enable ' + s + '? Only classes from today are charged.'))) return;
      api('shop', { shop_name: s, enabled: true }).then(function(d){ if (d.ok === true) { flash('ok', T('켰습니다 — 링크를 대리점에 보내 주세요', 'Enabled — send the link to the agency')); reloadAll().then(function(){ openShop(s); }); } else flash('bad', errText(d)); });
    } else if (a === 'disable') {
      if (!window.confirm(T('이 대리점을 끌까요? 차감·청구·문자가 멈춥니다. 기록은 남습니다.', 'Disable? Deduction, invoices and SMS stop.'))) return;
      api('shop', { shop_name: STATE.shop, enabled: false }).then(function(d){ d.ok === true ? flash('ok', T('껐습니다', 'Disabled')) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'saveShop') {
      api('shop', { shop_name: STATE.shop, phone: $('phoneBox').value, include_c24: $('c24Box').checked }).then(function(d){ d.ok === true ? flash('ok', T('저장했습니다', 'Saved')) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'copy') {
      var box = $('linkBox'); box.select();
      (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(function(){ flash('ok', T('링크를 복사했습니다', 'Copied')); }, function(){ try { document.execCommand('copy'); flash('ok', T('링크를 복사했습니다', 'Copied')); } catch (e) {} });
    } else if (a === 'rotate') {
      if (!window.confirm(T('새 링크로 바꿀까요? 옛 링크는 바로 막힙니다.', 'Rotate? The old link stops working.'))) return;
      api('link', { shop_name: STATE.shop, rotate: true }).then(function(d){ d.ok === true ? flash('ok', T('새 링크를 만들었습니다 — 대리점에 다시 보내 주세요', 'New link created')) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'wallet') {
      var amt = Number($('amtBox').value), memo = $('memoBox').value.trim(), inv = Number($('invSel').value) || 0;
      if (!amt || !memo) { flash('bad', T('금액과 메모를 적어 주세요', 'Enter amount and memo')); return; }
      if (!window.confirm(T(won(amt) + ' 을(를) 기록할까요?', 'Record ' + won(amt) + '?'))) return;
      api('wallet', { shop_name: STATE.shop, amount: amt, memo: memo, invoice_id: inv || undefined }).then(function(d){ d.ok === true ? flash('ok', T('기록했습니다 · 잔액 ', 'Recorded · balance ') + won(d.wallet && d.wallet.balance)) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'void') {
      if (!window.confirm(T('이 청구서를 취소할까요?', 'Void this invoice?'))) return;
      api('invoice/void', { id: Number(b.getAttribute('data-id')) }).then(function(d){ d.ok === true ? flash('ok', T('취소했습니다', 'Voided')) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'excl') {
      var ex = b.getAttribute('data-ex') === '1';
      var why = ex ? window.prompt(T('왜 빼나요? (예: 학부모 개인 결제)', 'Why exclude?'), '') : '';
      if (ex && why === null) return;
      api('student', { shop_name: STATE.shop, uid: b.getAttribute('data-uid'), excluded: ex, reason: why || '' }).then(function(d){ d.ok === true ? flash('ok', T('저장했습니다', 'Saved')) : flash('bad', errText(d)); reloadAll(); });
    } else if (a === 'answer') {
      var id = b.getAttribute('data-id'), ans = ($('ans-' + id) || {}).value || '';
      if (!ans.trim()) { flash('bad', T('답변을 적어 주세요', 'Write an answer')); return; }
      api('dispute/answer', { id: Number(id), answer: ans }).then(function(d){ d.ok === true ? flash('ok', T('답변을 저장했습니다', 'Saved')) : flash('bad', errText(d)); loadOverview(); });
    } else if (a === 'dryShop') {
      $('shopRunOut').innerHTML = '<p class="muted">…</p>';
      api('run', { dry: true, shop_name: STATE.shop }).then(function(d){ $('shopRunOut').innerHTML = reportHtml(d); });
    }
  });
  $('dryBtn').addEventListener('click', function(){
    $('runOut').innerHTML = '<p class="muted">…</p>';
    api('run', { dry: true }).then(function(d){ $('runOut').innerHTML = reportHtml(d); });
  });
  $('runBtn').addEventListener('click', function(){
    if (!window.confirm(T('지금 실제로 실행할까요? «자동 정산» 스위치가 꺼져 있어도 차감·청구서가 기록됩니다. (문자·자동결제는 각 스위치를 따릅니다)', 'Run now? Charges and invoices are written even if «auto» is off. SMS/autopay follow their switches.'))) return;
    $('runOut').innerHTML = '<p class="muted">…</p>';
    api('run', { dry: false }).then(function(d){ $('runOut').innerHTML = reportHtml(d); reloadAll(); });
  });
  $('refreshBtn').addEventListener('click', function(){ reloadAll(); });
  $('langBtn').addEventListener('click', function(){
    LANG = LANG === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('mangoi_lang', LANG); } catch (e) {}
    renderStatic(); renderOverview(); renderDetail();
  });

  renderStatic();
  loadOverview();
})();
</script>
</body>
</html>
