     적용되므로 한글·영문은 시스템 글꼴 그대로다(추가 다운로드 없음). manager.html 과 동일. -->
<style>@font-face{font-family:'MangoiHanSC';src:url('/fonts/mangoi-han-sc.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+2E80-2EFF,U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+0100-017F,U+01CD-01DC;}</style>

<title>Game Insights · Mangoi</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════
  🎮 전 게임 통합 학습 분석 — Game Insights  (2026-08-08)

  왜 만들었나 — 실측 근거
    관리자 「영어 배틀 관리」 카드는 **배틀이 아니었다.** P2P 배틀 백엔드는 만들어진
    적이 없고(api-admin.ts:9730 주석), 리더보드는 그냥
      SELECT SUM(correct_count) FROM game_progress
    였다. 화면의 「완료 배틀 1235 · 평균 승수 176.4 · jeong vs AI」는 전부
    **단어 정답 누계**를 대결처럼 그린 것이다.

    더 큰 문제 — `game_progress` 에 «어느 게임인지» 칸이 없었다. 게임 8종이 한 표에
    섞여서, 「테트리스가 잘 되고 있나」를 물어볼 수조차 없었다.
    → game 칸 + game_sessions 를 새로 넣고(2026-08-08), 이 화면이 그걸 읽는다.

  ⚠️ 설계 계약 — manager.html · teacher.html 과 동일. 깨면 존재 이유가 사라진다.
     1. **외부 리소스 0개.** link·script src·웹폰트·CDN·차트 라이브러리 전부 금지.
        (admin.html 은 gzip 934KB · 요청 145개 · 흉내회선 19~21초다. 여기에 카드로
         얹으면 전원이 함께 느려진다. manager.html 이 같은 이유로 44배를 냈다.)
     2. **막대는 div width %.** Chart.js 는 155KB — 이 페이지 전체보다 크다.
     3. **집계는 서버가 끝낸다.** 화면은 그리기만 한다(계산 0, 요청 1개).
     4. **한/영 둘 다** — data-ko/data-en + 5줄 applyLang. i18n 사전(204KB)을 부르지 않는다.
        강사·매니저 다수가 필리핀이라 영어는 «있으면 좋은 것»이 아니라 필수다.
     5. **API 가 죽어도 화면은 산다.** 「데이터 없음」을 그리고 끝. 분석 화면 때문에
        업무가 멈추면 안 된다.

  🔒 개인정보: 집계 숫자와 익명 uid 뿐이다. 실명·연락처는 서버 응답에도 없다.
     (지사·대리점도 보는 화면 — isAgencyAllowedPage/Api 에 등록되어 있다)
  ══════════════════════════════════════════════════════════════════════════════
-->
<style>

         --accent:#c2410c; --good:#15803d; --bad:#b91c1c; --warn:#a16207; --blue:#1d4ed8;
         --bar:#f0ece0; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:MangoiHanSC,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;

    padding:11px 16px;background:rgba(253,252,247,.97);border-bottom:1px solid var(--line)}

  .top a{color:var(--ink2);text-decoration:none;font-weight:700;font-size:13px}
  button{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  button:hover{background:#f6f4ec}
  button.on{background:#fff2e8;border-color:var(--accent);color:var(--accent)}
  .wrap{max-width:1020px;margin:0 auto;padding:16px 16px 60px}
  .kpi{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .kpi div{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .kpi b{display:block;font-size:22px;font-weight:800;color:var(--accent);line-height:1.25}
  .kpi span{font-size:12px;color:var(--ink2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:14px}
  .card h2{margin:0 0 3px;font-size:15.5px;font-weight:800}
  .card .why{margin:0 0 11px;font-size:12.5px;color:var(--ink2)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}

  .barwrap{min-width:110px;width:100%}
  .bar{height:9px;background:var(--bar);border-radius:5px;overflow:hidden}

  .bar.g i{background:var(--good)} .bar.b i{background:var(--bad)} .bar.w i{background:var(--warn)}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;
    background:#eee9dc;color:#4b4433}
  .tag.g{background:#dcf5e3;color:#14532d} .tag.b{background:#fde8e8;color:#991b1b}
  .tag.w{background:#fdf0d5;color:#7c5b0b} .tag.p{background:#e4ecfd;color:#1e3a8a}
  .note{background:#fdfaf0;border-left:4px solid var(--warn);border-radius:8px;padding:11px 14px;
    margin-bottom:14px;font-size:13.5px}
  .note.bad{background:#fef5f5;border-left-color:var(--bad)}
  .note.ok{background:#f4faf5;border-left-color:var(--good)}

  @media(max-width:640px){ .top h1{font-size:15px} .wrap{padding:12px 11px 50px} }

       data-en="Share of sessions where nothing was answered. Left in 10s = it didn't load. Left after 3min = too hard.">…</p>

          data-en="Sources: game_sessions (one row per play) · game_progress (per word) · voice_coaching (Azure). Aggregated server-side, cached 10 min.">…</span>

<script>
(function(){
  'use strict';

  /* ── 언어 ── 공통 키는 mangoi_lang (mango_lang 은 구버전 — 쓰지 말 것).
       기본 영어: 강사·매니저 다수가 필리핀. 한국인은 한 번 눌러 바꾸면 기억된다. */
  var LANG = 'en';
  try {
    var s = localStorage.getItem('mangoi_lang');
    if (s === 'ko' || s === 'en') LANG = s;
    else if ((navigator.language || '').indexOf('ko') === 0) LANG = 'ko';
  } catch(e){}
  function EN(){ return LANG === 'en'; }
  function T(en, ko){ return EN() ? en : ko; }

  function applyLang(){
    document.documentElement.lang = LANG;
    var n = document.querySelectorAll('[data-en]');
    for (var i=0;i<n.length;i++) n[i].textContent = EN() ? n[i].getAttribute('data-en') : n[i].getAttribute('data-ko');
    document.getElementById('lang').textContent = EN() ? '한국어' : 'English';
    if (DATA) paint(DATA);   // 숫자·목록은 data-en 으로 못 다룬다 — 다시 그린다
  }
  window.toggleLang = function(){
    LANG = EN() ? 'ko' : 'en';
    try { localStorage.setItem('mangoi_lang', LANG); } catch(e){}
    applyLang();
  };

  var RANGE = 7, DATA = null, BUSY = false;
  function esc(v){ return String(v==null?'':v).replace(/[<>&"]/g, function(c){
    return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); }
  function pct(n){ return (Number(n)||0) + '%'; }
  function el(id){ return document.getElementById(id); }

  /* 정오답을 서버로 보내지 않는 게임들 — 「정답률 0%」를 성적으로 오해하지 않게 표시한다.
     (2026-08-08 실측. 계측을 붙이면 이 목록에서 빠진다.) */
  var NO_ANSWER_TRACKING = [];   // 2026-08-08 6종 전부 계측 연결 완료 — 새로 안 재는 게임이 생기면 여기에 적는다
  function untracked(g){ return NO_ANSWER_TRACKING.indexOf(g) >= 0; }

  window.setRange = function(d){
    RANGE = d;
    el('r7').className  = (d===7 ? 'on' : '');
    el('r30').className = (d===30 ? 'on' : '');
    load(0);
  };

  window.load = function(force){
    if (BUSY) return; BUSY = true;
    var url = '/api/admin/game-insights?range=' + RANGE + (force ? '&nocache=1' : '');
    fetch(url, { credentials:'same-origin' })
      .then(function(r){ return r.json(); })
      .then(function(j){ DATA = j; paint(j); })
      .catch(function(){
        // 분석 화면 때문에 업무가 멈추면 안 된다 — 화면은 살려 두고 사실만 알린다.
        el('banner').innerHTML = '<div class="note bad">' +
          esc(T('Could not load insights. The rest of the console is unaffected.',
                '분석 데이터를 불러오지 못했습니다. 다른 업무 화면에는 영향이 없습니다.')) + '</div>';
      })
      .then(function(){ BUSY = false; });
  };

  function paint(j){
    var g = (j && j.games) || [], t = (j && j.totals) || {};

    /* ── 계측 이전이면 «빈 화면» 대신 사실을 말한다 ── */
    var b = '';
    if (!t.tracking_since) {
      b = '<div class="note">' + esc(T(
        'Tracking just started — no plays recorded yet. Numbers appear as students play. ' +
        'Before 2026-08-08 the games never recorded which game a record came from, so past data cannot be recovered.',
        '계측을 막 시작했습니다 — 아직 기록된 판이 없습니다. 학생이 게임을 하면 숫자가 채워집니다. ' +
        '2026-08-08 이전에는 «어느 게임인지»를 저장한 적이 없어 과거 데이터는 복원할 수 없습니다.')) + '</div>';
    } else if (!g.length) {
      b = '<div class="note">' + esc(T('No plays in this period.', '이 기간에 기록된 판이 없습니다.')) + '</div>';
    }
    if (j && j.ok === false) {
      b += '<div class="note bad">' + esc(T('Aggregation failed — showing what is available.',
                                            '집계에 실패했습니다 — 가능한 부분만 표시합니다.')) + '</div>';
    }
    el('banner').innerHTML = b;

    el('k-sessions').textContent = (t.sessions||0).toLocaleString();
    el('k-students').textContent = (t.students||0).toLocaleString();
    el('k-live').textContent     = (t.games_live||0) + ' / ' + (t.games_total||0);
    el('k-since').textContent    = t.tracking_since ? new Date(t.tracking_since).toISOString().slice(0,10)
                                                    : T('not yet','아직');

    /* ① 게임별 참여 */
    var max = 1; for (var i=0;i<g.length;i++) if (g[i].sessions > max) max = g[i].sessions;
    var h = '';
    for (i=0;i<g.length;i++){
      var r = g[i], nm = EN() ? r.en : r.ko;
      h += '<tr><td>' + esc(nm) + (untracked(r.game)
              ? ' <span class="tag" title="">' + esc(T('answers not tracked','정오답 미계측')) + '</span>' : '') + '</td>'
        +  '<td class="barwrap"><div class="bar"><i style="width:' + Math.round(r.sessions*100/max) + '%"></i></div>'
        +  '<span class="muted" style="font-size:11px">' + r.sessions + '</span></td>'
        +  '<td class="num">' + r.students + '</td>'
        +  '<td class="num">' + r.items_per_session + '</td>'
        +  '<td class="num">' + (untracked(r.game) ? '–' : pct(r.accuracy)) + '</td>'
        +  '<td class="num">' + pct(r.repeat_rate) + '</td>'
        +  '<td class="num">' + r.avg_min + '</td></tr>';
    }
    el('t-games').innerHTML = h || emptyRow(7);

    /* ② 재미 × 학습 사분면 — 중앙값을 기준선으로 (평균은 이상치에 끌려간다) */
    var repMid = median(g.map(function(x){ return x.repeat_rate; }));
    var itmMid = median(g.map(function(x){ return x.items_per_session; }));
    var Q = {
      core:  { tag:'g', ko:'주력',      en:'Core',    a_ko:'수업 숙제로 지정',        a_en:'Assign as homework' },
      waste: { tag:'p', ko:'아깝다',    en:'Wasted',  a_ko:'효과는 좋은데 안 옵니다 — 재미·입구 보강', a_en:'Effective but unvisited — improve fun/entry' },
      candy: { tag:'w', ko:'사탕',      en:'Candy',   a_ko:'보상용으로만. 학습시간으로 세지 않습니다', a_en:'Reward only — do not count as study time' },
      cut:   { tag:'b', ko:'정리 대상', en:'Retire',  a_ko:'3주 연속이면 내리는 것도 결정', a_en:'Three weeks running → consider retiring' }
    };
    h = '';
    for (i=0;i<g.length;i++){
      var x = g[i], fun = x.repeat_rate >= repMid, learn = x.items_per_session >= itmMid;
      var q = fun && learn ? Q.core : (!fun && learn ? Q.waste : (fun && !learn ? Q.candy : Q.cut));
      h += '<tr><td>' + esc(EN() ? x.en : x.ko) + '</td>'
        +  '<td><span class="tag ' + q.tag + '">' + esc(EN()?q.en:q.ko) + '</span></td>'
        +  '<td class="muted" style="white-space:normal">' + esc(EN()?q.a_en:q.a_ko) + '</td></tr>';
    }
    el('t-quad').innerHTML = h || emptyRow(3);

    /* ③ 약점 단어 */
    var w = (j && j.weak) || []; h = '';
    for (i=0;i<w.length;i++){
      var v = w[i];
      h += '<tr><td><b>' + esc(v.item) + '</b></td><td class="muted">' + esc(v.ko) + '</td>'
        +  '<td class="num" style="color:var(--bad);font-weight:700">' + v.wrong + '</td>'
        +  '<td class="num">' + v.correct + '</td><td class="num">' + v.students + '</td>'
        +  '<td class="muted">' + esc(labelOf(v.game)) + '</td></tr>';
    }
    el('t-weak').innerHTML = h || emptyRow(6);

    /* ④ 학생 3구간 */
    var st = (j && j.students) || {};
    el('s-grow').textContent  = st.growing || 0;
    el('s-stuck').textContent = st.stuck || 0;
    el('s-gone').textContent  = st.gone || 0;
    var gl = st.gone_list || []; h = '';
    for (i=0;i<gl.length;i++){
      h += '<tr><td class="muted">' + esc(gl[i].uid) + '</td>'
        +  '<td class="num" style="color:var(--bad);font-weight:700">' + gl[i].idle_days + '</td>'
        +  '<td class="num">' + gl[i].prev_sessions + '</td></tr>';
    }
    el('t-gone').innerHTML = h || emptyRow(3);

    /* ⑤ 발음 분포 */
    var p = (j && j.pron) || {}, tot = p.total || 0;
    if (!tot) {
      el('pron').innerHTML = '<div class="empty">' + esc(T('No pronunciation records in this period.','이 기간에 발음 기록이 없습니다.')) + '</div>';
    } else {
      var bands = [
        ['excellent', T('90+ Excellent','90점 이상 우수'), 'g'],
        ['good',      T('75–89 Good','75~89 양호'),        'g'],
        ['fair',      T('60–74 Fair','60~74 보통'),        'w'],
        ['weak',      T('under 60 Needs coaching','60 미만 코칭 대상'), 'b']
      ];
      h = '';
      for (i=0;i<bands.length;i++){
        var n = p[bands[i][0]] || 0;
        h += '<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px">'
          +  '<span>' + esc(bands[i][1]) + '</span><span class="muted">' + n + '</span></div>'
          +  '<div class="bar ' + bands[i][2] + '"><i style="width:' + Math.round(n*100/tot) + '%"></i></div></div>';
      }
      if (p.unattributed) {
        h += '<div class="note" style="margin:10px 0 0">' + esc(T(
          p.unattributed + ' of ' + tot + ' records have no student attached (recorded as guest), so they cannot be linked to a student.',
          '전체 ' + tot + '건 중 ' + p.unattributed + '건은 학생이 붙어 있지 않습니다(guest 로 기록됨) — 학생별로는 볼 수 없습니다.')) + '</div>';
      }
      el('pron').innerHTML = h;
    }

    /* ⑥ 주의가 필요한 게임
       ⚠️ 정오답을 서버로 안 보내는 게임은 여기서 **빼야 한다.** 넣으면 「이탈률 100%」로 잡히는데
          그건 학생이 포기한 게 아니라 «우리가 안 재고 있는 것»이다. 숫자가 거짓말을 하게 된다. */
    var d = g.filter(function(x){ return !untracked(x.game); })
             .sort(function(a,b2){ return b2.dropoff_rate - a.dropoff_rate; });
    h = '';
    for (i=0;i<d.length;i++){
      var x2 = d[i]; if (!x2.sessions) continue;
      var verdict = x2.dropoff_rate < 30 ? T('healthy','정상')
        : (x2.avg_min < 0.5 ? T('probably did not load','안 뜬 것으로 보임') : T('probably too hard','어려운 것으로 보임'));
      var cls = x2.dropoff_rate < 30 ? 'g' : (x2.dropoff_rate < 60 ? 'w' : 'b');
      h += '<tr><td>' + esc(EN()?x2.en:x2.ko) + '</td>'
        +  '<td class="barwrap"><div class="bar ' + cls + '"><i style="width:' + x2.dropoff_rate + '%"></i></div>'
        +  '<span class="muted" style="font-size:11px">' + pct(x2.dropoff_rate) + '</span></td>'
        +  '<td class="num">' + x2.avg_min + '</td>'
        +  '<td class="muted">' + esc(verdict) + '</td></tr>';
    }
    el('t-drop').innerHTML = h || emptyRow(4);

    paintTodo(j, g, st);
  }

  /* ── 「이번 주 할 일」 — 데이터에서 바로 뽑는다. 여기가 «지식 → 행동» 이 되는 지점이다. ── */
  function paintTodo(j, g, st){
    var out = [];
    if (st && st.gone) out.push(T(
      '📞 ' + st.gone + ' student(s) silent 14+ days — send the list to the branch for a parent call.',
      '📞 14일 이상 침묵한 학생 ' + st.gone + '명 — 명단을 지사에 넘겨 학부모 연락을 요청하세요.'));

    // 계측이 되는 게임만 «포기»로 판단한다 — 안 재는 게임을 버그로 신고하면 개발이 헛일을 한다.
    var bad = g.filter(function(x){ return !untracked(x.game) && x.sessions >= 5 && x.dropoff_rate >= 50; });
    if (bad.length) out.push(T(
      '🐞 ' + bad.length + ' game(s) lose over half of players before a single answer: ' +
        bad.map(function(x){ return x.en; }).join(', ') + ' — open a ticket with dev.',
      '🐞 한 문제도 못 풀고 나가는 비율이 절반을 넘는 게임 ' + bad.length + '개: ' +
        bad.map(function(x){ return x.ko; }).join(', ') + ' — 개발에 티켓을 여세요.'));

    // 계측이 아직 안 붙은 게임 — 학생은 하고 있는데 «무엇을 배웠는지» 를 우리가 모르는 상태다.
    var ut = g.filter(function(x){ return untracked(x.game) && x.sessions > 0; });
    if (ut.length) out.push(T(
      '🔧 ' + ut.length + ' game(s) are played but never report right/wrong answers: ' +
        ut.map(function(x){ return x.en; }).join(', ') + ' — we cannot tell what students learned there.',
      '🔧 학생은 하고 있는데 정오답을 안 보내는 게임 ' + ut.length + '개: ' +
        ut.map(function(x){ return x.ko; }).join(', ') + ' — 거기서 무엇을 배웠는지 알 수 없습니다.'));

    // 계측 시작 전에는 «죽은 게임» 판단을 하지 않는다 — 안 재고 있었을 뿐인데
    // 「22개 전부 폐지를 결정하세요」 같은 소리를 하게 된다.
    var dead = (j.totals && j.totals.tracking_since) ? ((j.totals.games_total || 0) - g.length) : 0;
    if (dead > 0) out.push(T(
      '📢 ' + dead + ' game(s) had zero plays this period — promote them, or decide to retire.',
      '📢 이 기간 한 판도 없던 게임 ' + dead + '개 — 홍보하거나 폐지를 결정하세요.'));

    var wk = (j.weak || []).filter(function(x){ return x.students >= 2; });
    if (wk.length) out.push(T(
      '📚 ' + wk.length + ' word(s) are missed by 2+ students — hand them to the textbook owner and put them in next week\'s warm-up.',
      '📚 학생 2명 이상이 함께 틀린 단어 ' + wk.length + '개 — 교재 담당에게 전달하고 다음 주 워밍업에 넣으세요.'));

    var core = g.filter(function(x){ return x.repeat_rate >= 50 && x.items_per_session >= 5; });
    if (core.length) out.push(T(
      '🎯 Assign as homework this week: ' + core.map(function(x){ return x.en; }).join(', '),
      '🎯 이번 주 숙제로 지정: ' + core.map(function(x){ return x.ko; }).join(', ')));

    if (!out.length) out.push(T('Nothing needs action yet — not enough data.','아직 조치할 항목이 없습니다 — 데이터가 부족합니다.'));
    el('todo').innerHTML = out.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('');
  }

  function labelOf(gid){
    if (!gid) return T('(before tracking)','(계측 이전)');
    var row = (DATA && DATA.games || []).filter(function(x){ return x.game === gid; })[0];
    return row ? (EN() ? row.en : row.ko) : gid;
  }
  function median(a){
    a = a.filter(function(x){ return typeof x === 'number'; }).sort(function(x,y){ return x-y; });
    if (!a.length) return 0;
    var m = Math.floor(a.length/2);
    return a.length % 2 ? a[m] : (a[m-1]+a[m])/2;
  }
  function emptyRow(cols){
    return '<tr><td colspan="' + cols + '" class="empty">' + esc(T('No data','데이터 없음')) + '</td></tr>';
  }

  applyLang();
  setRange(7);
})();
</script>
</body>
</html>
