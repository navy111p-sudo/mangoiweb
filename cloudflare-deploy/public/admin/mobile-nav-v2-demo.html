    · setInterval 은 시계 1개뿐. 화면이 안 보이면(탭 전환) 그것도 멈춘다.

    · 외부 라이브러리 0개. 이 파일 하나로 끝난다.

      { ko: '학습 분석', subs: ['음성 통계', '자기평가 점수'] }
    ]},
    { key: 'money', ko: '정산·매출', ico: 'M2 5h20v14H2zM2 10h20', items: [
      { ko: '회계' },
      { ko: '결제', subs: ['B2B 결제', 'B2C 결제', '정기 결제', '자동 독촉'] },
      { ko: '포인트' },
      { ko: '지사 정산' },
      { ko: '조직 (지사·대리점)' }
    ]},
    { key: 'ops', ko: '시스템', ico: 'M12 9a3 3 0 100 6 3 3 0 000-6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-2.82 1.18V21a2 2 0 11-4 0v-.09A1.65 1.65 0 007.28 19.4l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 003.09 14H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 7.28l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 0010 3.09V3a2 2 0 114 0v.09a1.65 1.65 0 002.72 1.51l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0020.91 10H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z', items: [
      { ko: '경영 지표', subs: ['통합 대시보드', 'KPI', '일별 차트', '랭킹', 'NPS'] },
      { ko: '이탈·예측', subs: ['이탈 위험', 'AI 예측'] },
      { ko: '공지 발송', subs: ['웹 푸시', '카카오 알림', '공지 스튜디오', '팝업 게시', '공지사항'] },
      { ko: '자료실', subs: ['본사 자료실', '강사 자료실', '지사 자료실', '대리점 자료실', '학생 자료실'] },
      { ko: '직원·권한', subs: ['권한 관리', '계정 목록'] },
      { ko: '데이터·보관', subs: ['데이터 내보내기', '보관 정책', '갤러리', '교실 점검'] },
      { ko: '사이트 구조도' }
    ]}
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body;

  /* ── 도착지(카드) 를 메뉴에서 그대로 만든다 ────────────────────────────
     메뉴 항목 하나에 카드 하나 — 그래서 «메뉴에는 있는데 갈 데가 없다» 가 구조적으로 안 생긴다. */
  var DEST = [];   // {id, path:[그룹, 항목, 손자]}
  NAV.forEach(function (g) {
    if (g.solo) { DEST.push({ id: 'sec-' + g.key, path: [g.ko] }); return; }
    g.items.forEach(function (it, i) {
      if (it.subs && it.subs.length) {
        it.subs.forEach(function (s, j) {
          DEST.push({ id: 'sec-' + g.key + '-' + i + '-' + j, path: [g.ko, it.ko, s] });
        });
      } else {
        DEST.push({ id: 'sec-' + g.key + '-' + i, path: [g.ko, it.ko] });
      }
    });
  });

  // 카드 본문 — 높이를 일부러 제각각으로 만든다(짧은 카드에서도 정확히 서는지 보려고)
  function cardHTML(d, n) {
    var rows = '', k = (n % 4) + 2;
    for (var i = 0; i < k; i++) {
      rows += '<div class="row"><b>' + ['진행 중', '대기', '완료', '보류', '검토'][i % 5] + ' 항목 ' + (i + 1) +
              '</b><span>' + (12 + ((n * 7 + i * 13) % 180)) + '건</span></div>';
    }
    return '<details class="card" id="' + d.id + '">' +
      '<summary><span class="tag">' + d.path[0] + '</span>' + d.path[d.path.length - 1] +
      '<span class="chev">&#8250;</span></summary>' +
      '<div class="body"><p style="margin:0 0 4px;color:#64748b">' +
      d.path.join(' &#8250; ') + ' 화면입니다. 실제 관리자에서는 여기에 이 기능의 표와 버튼이 들어갑니다.</p>' +
      rows + '</div></details>';
  }
  $('cards').innerHTML = DEST.map(cardHTML).join('');

  /* ── 메뉴 그리기 ────────────────────────────────────────────────────── */
  function svg(p) {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + p + '"/></svg>';
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  var html = '';
  NAV.forEach(function (g) {
    if (g.solo) {
      html += '<div class="g"><button type="button" class="g-head" data-go="sec-' + g.key + '">' +
              svg(g.ico) + '<span class="t">' + esc(g.ko) + '</span><span class="ar">&#8250;</span></button></div>';
      return;
    }
    var n = 0;
    g.items.forEach(function (it) { n += (it.subs && it.subs.length) ? it.subs.length : 1; });
    html += '<div class="g" data-g="' + g.key + '">' +
            '<button type="button" class="g-head" data-toggle="g">' + svg(g.ico) +
            '<span class="t">' + esc(g.ko) + '</span><span class="n">' + n + '</span><span class="ar">&#8250;</span></button>' +
            '<div class="g-items">';
    g.items.forEach(function (it, i) {
      if (it.subs && it.subs.length) {
        html += '<div class="it"><button type="button" class="it-head" data-toggle="it">' +
                esc(it.ko) + '<span class="ar">&#8250;</span></button><div class="it-subs">';
        it.subs.forEach(function (s, j) {
          html += '<button type="button" class="leaf" data-go="sec-' + g.key + '-' + i + '-' + j + '">' + esc(s) + '</button>';
        });
        html += '</div></div>';
      } else {
        html += '<button type="button" class="it-head" data-go="sec-' + g.key + '-' + i + '">' +
                esc(it.ko) + '<span class="ar" style="opacity:.35">&#8250;</span></button>';
      }
    });
    html += '</div></div>';
  });
  $('menu').innerHTML = html;

  /* ── 여닫기 ────────────────────────────────────────────────────────────
     닫을 때 스크롤 잠금을 «먼저» 푼다. 잠긴 채로 스크롤을 시키면
     브라우저가 무시해 버려서 «눌렀는데 안 갔다» 가 된다 — 지금 관리자의 실제 증상. */
  var lastY = 0;
  function openDrawer() {
    lastY = window.pageYOffset;
    body.classList.add('drawer-open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('btn-menu').setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    body.classList.remove('drawer-open');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('btn-menu').setAttribute('aria-expanded', 'false');
  }
  function toggleDrawer() { body.classList.contains('drawer-open') ? closeDrawer() : openDrawer(); }

  $('btn-menu').addEventListener('click', toggleDrawer);
  $('btn-try').addEventListener('click', openDrawer);
  $('btn-close').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && body.classList.contains('drawer-open')) closeDrawer();
  });

  /* ── ④ 정확한 도착 ─────────────────────────────────────────────────────
     ㄱ) 닫는다(스크롤 잠금 해제)
     ㄴ) 목적지 카드를 «연다»
     ㄷ) 마지막 카드도 맨 위까지 올라올 수 있도록 꼬리 여백을 필요한 만큼만 준다
     ㄹ) 목표 지점을 계산해서 이동
     ㅁ) 도착 후 다시 재서 2px 넘게 어긋났으면 한 번만 더 보정 (사진 로딩 등으로 밀렸을 때)   */
  function appbarH() {
    return $('cards') ? document.querySelector('.appbar').getBoundingClientRect().height : 54;
  }

  function fitTail(el) {
    var tail = $('tail');
    tail.style.height = '0px';
    var want = window.pageYOffset + el.getBoundingClientRect().top - appbarH() - 10;
    var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    var lack = want - maxY;
    tail.style.height = (lack > 0 ? Math.ceil(lack) + 8 : 0) + 'px';
    return want;
  }

  var landedTimer = 0;
  function go(id) {
    var el = document.getElementById(id);
    if (!el) return;

    closeDrawer();                       // ㄱ

    // ㄴ — 도착지는 «열린 채» 로 끝난다. 다른 카드는 접어 화면을 조용하게.
    document.querySelectorAll('.card[open]').forEach(function (c) { if (c !== el) c.open = false; });
    el.open = true;

    var pass = 0;
    function land() {
      var want = fitTail(el);            // ㄷ + ㄹ
      window.scrollTo({ top: Math.max(0, want), behavior: pass === 0 ? 'smooth' : 'auto' });
      pass++;
      if (pass < 3) {
        setTimeout(function () {         // ㅁ — 재서 어긋나면 한 번 더
          var off = el.getBoundingClientRect().top - appbarH() - 10;
          if (Math.abs(off) > 2) land();
        }, pass === 1 ? 340 : 120);
      }
    }
    // 사이드바가 닫히며 body 의 overflow 가 풀리는 것을 브라우저가 반영한 «다음» 프레임부터
    requestAnimationFrame(function () { requestAnimationFrame(land); });

    // 도착 표시 + 현재 위치 + 주소창 해시(뒤로가기로 돌아올 수 있게)
    document.querySelectorAll('.card.landed').forEach(function (c) { c.classList.remove('landed'); });
    el.classList.add('landed');
    clearTimeout(landedTimer);
    landedTimer = setTimeout(function () { el.classList.remove('landed'); }, 2200);

    var d = null;
    for (var i = 0; i < DEST.length; i++) if (DEST[i].id === id) { d = DEST[i]; break; }
    if (d) {
      $('crumb').innerHTML = d.path.slice(0, -1).map(esc).join(' &#8250; ') +
                             (d.path.length > 1 ? ' &#8250; ' : '') + '<b>' + esc(d.path[d.path.length - 1]) + '</b>';
      document.title = d.path.join(' · ') + ' — 망고아이 관리';
    }
    try { history.replaceState(null, '', '#' + id); } catch (e) {}

    document.querySelectorAll('.leaf.current, .it-head.current').forEach(function (b) { b.classList.remove('current'); });
    var btn = $('menu').querySelector('[data-go="' + id + '"]');
    if (btn) btn.classList.add('current');
  }

  /* ── 메뉴 클릭 (한 곳에서만 받는다 — 버튼 200개에 리스너 200개를 달지 않는다) ── */
  $('menu').addEventListener('click', function (e) {
    var t = e.target.closest('[data-go], [data-toggle]');
    if (!t) return;
    if (t.dataset.go) { go(t.dataset.go); return; }

    var box = t.parentElement;                    // .g 또는 .it
    var wasOpen = box.classList.contains('open');
    // 형제만 닫는다(같은 단계). 부모는 건드리지 않는다.
    Array.prototype.forEach.call(box.parentElement.children, function (sib) {
      if (sib !== box) sib.classList.remove('open');
    });
    box.classList.toggle('open', !wasOpen);
  });

  /* ── 검색 ─────────────────────────────────────────────────────────────── */
  $('q').addEventListener('input', function () {
    var v = this.value.trim().toLowerCase();
    var groups = $('menu').querySelectorAll('.g');
    if (!v) {
      groups.forEach(function (g) { g.style.display = ''; });
      $('menu').querySelectorAll('.it, .leaf, .it-head').forEach(function (n) { n.style.display = ''; });
      var e = $('menu').querySelector('.empty'); if (e) e.remove();
      return;
    }
    var hit = 0;
    groups.forEach(function (g) {
      var gHit = 0;
      g.querySelectorAll('.it').forEach(function (it) {
        var itHit = 0;
        it.querySelectorAll('.leaf').forEach(function (l) {
          var m = l.textContent.toLowerCase().indexOf(v) >= 0 ||
                  it.querySelector('.it-head').textContent.toLowerCase().indexOf(v) >= 0;
          l.style.display = m ? '' : 'none';
          if (m) itHit++;
        });
        it.style.display = itHit ? '' : 'none';
        if (itHit) { it.classList.add('open'); gHit += itHit; }
      });
      g.querySelectorAll(':scope > .g-items > .it-head').forEach(function (l) {
        var m = l.textContent.toLowerCase().indexOf(v) >= 0;
        l.style.display = m ? '' : 'none';
        if (m) gHit++;
      });
      g.style.display = gHit ? '' : 'none';
      g.classList.toggle('open', !!gHit);
      hit += gHit;
    });
    var old = $('menu').querySelector('.empty'); if (old) old.remove();
    if (!hit) $('menu').insertAdjacentHTML('beforeend', '<div class="empty">「' + esc(this.value) + '」 에 맞는 메뉴가 없습니다.</div>');
  });

  /* ── ③ 시계 ───────────────────────────────────────────────────────────
     타이머는 이 하나뿐. 화면이 가려지면(다른 앱·탭) 멈춘다 — 배터리·발열의 차이가 여기서 난다. */
  var timer = 0;
  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var now = new Date();
    function parts(tz) {
      var s = new Intl.DateTimeFormat('ko-KR', {
        timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
        month: 'numeric', day: 'numeric', weekday: 'short'
      }).formatToParts(now), o = {};
      s.forEach(function (p) { o[p.type] = p.value; });
      return { t: two(+o.hour % 24) + ':' + o.minute + ':' + o.second, d: o.month + '/' + o.day + ' (' + o.weekday + ')' };
    }
    var kr = parts('Asia/Seoul'), ph = parts('Asia/Manila');
    $('clk-kr').textContent = kr.t; $('dat-kr').textContent = kr.d;
    $('clk-ph').textContent = ph.t; $('dat-ph').textContent = ph.d;
    $('bar-clock').innerHTML = 'KR ' + kr.t.slice(0, 5) + '<br>PH ' + ph.t.slice(0, 5);
  }
  function startClock() { tick(); clearInterval(timer); timer = setInterval(tick, 1000); }
  function stopClock() { clearInterval(timer); timer = 0; }
  document.addEventListener('visibilitychange', function () {
    document.hidden ? stopClock() : startClock();
  });
  startClock();

  /* 주소에 #sec-... 를 달고 들어오면 거기서 시작한다 (링크 공유·새로고침 대비) */
  if (location.hash && document.getElementById(location.hash.slice(1))) {
    setTimeout(function () { go(location.hash.slice(1)); }, 60);
  }
})();
</script>
