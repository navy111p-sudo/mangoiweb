<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 관제탑 — 망고아이</title>
<link rel="stylesheet" href="/css/mangoi-han.css?v=2"><!-- 한자 글꼴 통일 (hanzi_font_harness) — /css 루트 자산이라 admin/ 자산 금지 규칙에 안 걸림 -->
<!--
  🗼 수업 관제탑 (monitor-wall) — 2026-08-27 사장님 지시
  「관리자가 신속하게 전체 상황을 한눈에 보면서 수업도 모니터링」 (보다 솔루션 벤치마킹)

  📌 2026-08-30 2차 (사장님 「STEP 1 + 순회 참관」) — 보다 「개설된 룸 목록」에 맞춰 표로 바꾸고
     검색·정렬·자동 새로고침 주기·강제 종료·회선 신호등을 얹었다. 그리고 보다에 없는 «순회 참관»:
     창 하나가 정해진 초마다 방을 옮겨 다닌다(탭을 여러 개 열지 않아도 전 교실을 훑는다).

  [설계 원칙 — 왜 이렇게 가벼운가]
  · admin.html(1.3MB) 에 얹지 않고 «별도 초경량 한 파일» — manager.html 과 같은 정신.
  · /admin/ 밑은 default-deny 라 이 화면도 자동으로 로그인 게이트가 걸린다(index.ts 무수정).
    ⚠️ /admin/ 밑에는 js·css 정적자산을 두지 않는 규칙(index.ts isAdminPath 주석) — 그 규칙은
       «public/admin/ 디렉터리» 에만 걸린다. 그래서 CSS 는 인라인, 화면 코드는 **/js 루트**에 둔다
       (2026-09-02 분리: /js/monitor-wall.js?v=2). /js·/css 루트는 게이트 밖이라
       이 화면이 이미 /css/mangoi-han.css 를 그렇게 쓰고 있고 admin.html 의 JS 도 전부 거기에 있다.
       ⛔ 뺐다고 «가벼움» 상한이 사라진 것이 아니다 — monitor_wall_harness ①이 HTML 을 따로,
          HTML+JS 를 합쳐서 두 번 잰다(둘 중 하나만 재면 게이트 우회가 된다).
  · 새 서버 API 0개가 원칙이었는데, 2차에서 «방 단위 회선 지표» 하나만 기존 엔드포인트에
    모드로 더했다(/api/admin/vc/quality?live=1). 새 경로가 아니라 이미 관문 3곳에 등록된
    /api/admin/vc/ 밑이라 등록 누락 함정에 걸리지 않는다.
  · 영상은 «상시» 로 틀지 않는다 — 타일에서 골라 눌렀을 때만 /?observe= 새 탭.
    (전 방 영상 상주는 화상수업 DO·강사 업로드 회선에 부담 — 제안서에서 제외한 유일한 무거운 것)
  · 폴링 주기는 사람이 고른다(기본 15초) + 탭이 숨겨지면 일시정지(visibilitychange).
  · 표 위에 마우스가 있는 동안은 다시 그리지 않는다 — 자동 갱신이 조준한 줄을 갈아치워
    «엉뚱한 방을 누르게» 되던 사고(2026-08-12 수정요청 #01)의 재발 방지.
    클릭은 위임 리스너가 «실제로 클릭된 줄» 의 data-room 을 읽는다.
  · 동적 영역에 data-ko/data-en 을 달지 않는다(본문 갈아끼우기 함정) — 언어는 JS 가 직접 그림.
  · 강사 계정은 이 화면을 못 본다 — classes-now 가 forbidden_teacher 로 답하면 목록 자체를
    안 그린다(사이드바 href 항목은 역할 필터를 못 받으므로 화면이 스스로 막는다).
-->
<style>
/* comments in this block stay ASCII or « » - CJK corner brackets here trip the hanzi-font harness */
:root{
  --paper:#f5f6fa; --card:#ffffff; --ink:#101828; --sub:#475467; --muted:#667085;
  --line:#e4e7ec; --accent:#b45309; --violet:#6d28d9; --violet-bg:#f3eefe;
  --ok:#15803d; --ok-bg:#e8f5ec; --warn:#b45309; --warn-bg:#fdf3e2;
  --crit:#b91c1c; --crit-bg:#fdecea; --mono:Consolas,"Courier New",monospace;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--paper); color:var(--ink);
      font-family:MangoiHanSC,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px; line-height:1.6; }
.wrap{ max-width:1180px; margin:0 auto; padding:18px 16px 60px; }
header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
h1{ font-size:19px; margin:0; }
.hd-note{ font-size:12px; color:var(--muted); }
.hd-right{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button, .btn{ font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); padding:6px 12px; font-size:12.5px; font-weight:700; }
button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--violet); outline-offset:1px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 12px; }
.chip{ background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:5px 14px; font-size:12.5px; font-weight:700; color:var(--sub); }
.chip b{ font-size:15px; margin-left:4px; font-variant-numeric:tabular-nums; }
.chip.st-bad{ background:var(--crit-bg); border-color:var(--crit); color:var(--crit); }
.chip.st-good{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }

/* toolbar - search / sort / refresh interval / rotation */
.tools{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 10px; }
.tools input[type=search]{ font:inherit; font-size:12.5px; padding:6px 11px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); flex:1 1 210px; min-width:150px; }
.tools select{ font:inherit; font-size:12.5px; padding:6px 9px; border-radius:8px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:700; }
.tools .lbl{ font-size:12px; color:var(--muted); }
.tools .go{ background:var(--violet); border-color:var(--violet); color:#fff; }
.rotbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px;
  padding:8px 12px; border:1px solid var(--violet); background:var(--violet-bg);
  border-radius:10px; font-size:12.5px; color:var(--violet); font-weight:700; }
.rotbar .rb-now{ font-family:var(--mono); }
.rotbar .rb-left{ font-variant-numeric:tabular-nums; }
[hidden]{ display:none !important; }

/* room table */
.tablewrap{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
table{ border-collapse:collapse; width:100%; min-width:820px; }
th, td{ text-align:left; padding:8px 12px; border-top:1px solid var(--line); vertical-align:top; font-size:13px; }
thead th{ border-top:0; background:#f8f9fc; color:var(--sub); font-size:12px; white-space:nowrap; }
tbody tr{ border-left:5px solid transparent; }
tbody tr.st-ok{ border-left-color:var(--ok); }
tbody tr.st-alone{ border-left-color:var(--warn); background:var(--warn-bg); }
tbody tr.st-alert{ border-left-color:var(--crit); background:var(--crit-bg); }
tbody tr.st-rot{ box-shadow:inset 0 0 0 2px var(--violet); }
td.t{ font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
td.who b{ font-size:13.5px; }
td.rid{ font-family:var(--mono); font-size:11.5px; color:var(--muted); word-break:break-all; }
td.n{ font-variant-numeric:tabular-nums; white-space:nowrap; }
td.acts{ white-space:nowrap; }
td.acts button{ padding:5px 9px; font-size:12px; margin:1px 2px 1px 0; }
.badge{ display:inline-block; font-size:11px; font-weight:800; border-radius:999px; padding:1px 8px; }
.badge.alone{ background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); }
.badge.alert{ background:var(--crit-bg); color:var(--crit); border:1px solid var(--crit); }
.badge.obs{ background:var(--violet-bg); color:var(--violet); }
.sig-ok{ color:var(--ok); font-weight:700; }
.sig-warn{ color:var(--warn); font-weight:700; }
.sig-bad{ color:var(--crit); font-weight:800; }
.acts .go{ background:var(--violet); border-color:var(--violet); color:#fff; }
.acts .go2{ background:var(--violet-bg); border-color:var(--violet); color:var(--violet); }
.acts .enter{ background:#fff7ed; border-color:#f0c48a; color:var(--warn); }
.acts .kill{ background:var(--crit-bg); border-color:var(--crit); color:var(--crit); }
.sec{ margin-top:22px; }
.sec h2{ font-size:14.5px; margin:0 0 4px; color:var(--sub); }
.sec .note{ font-size:12px; color:var(--muted); margin:0 0 8px; }
.rows{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:7px 12px;
  border-top:1px solid var(--line); font-size:13px; }
.row:first-child{ border-top:0; }
.row .t{ font-weight:800; font-variant-numeric:tabular-nums; }
.row .st{ font-size:12px; font-weight:700; }
.empty{ padding:14px; color:var(--muted); font-size:13px; }
.err{ padding:12px 14px; border:1px solid var(--crit); background:var(--crit-bg);
  color:var(--crit); border-radius:10px; margin:10px 0; font-size:13px; }
footer{ margin-top:26px; font-size:12px; color:var(--muted); line-height:1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="hd-title">🗼 수업 관제탑</h1>
    <span class="hd-note" id="hd-note"></span>
    <div class="hd-right">
      <span class="hd-note" id="hd-updated"></span>
      <button type="button" id="btn-refresh">🔄</button>
      <button type="button" id="btn-lang">EN</button>
      <a class="btn" href="/admin.html" id="lnk-admin">← 관리자 홈</a>
    </div>
  </header>

  <div class="chips" id="chips"></div>
  <div id="auth-warn"></div>

  <div class="tools" id="tools">
    <input type="search" id="q" autocomplete="off">
    <span class="lbl" id="lb-sort"></span>
    <select id="sel-sort">
      <option value="sev"></option>
      <option value="time"></option>
      <option value="people"></option>
      <option value="name"></option>
    </select>
    <span class="lbl" id="lb-poll"></span>
    <select id="sel-poll">
      <option value="0"></option>
      <option value="10"></option>
      <option value="15" selected></option>
      <option value="30"></option>
      <option value="60"></option>
    </select>
    <button type="button" class="go" id="btn-rot"></button>
    <select id="sel-dwell">
      <option value="15"></option>
      <option value="20" selected></option>
      <option value="30"></option>
      <option value="60"></option>
    </select>
  </div>

  <div class="rotbar" id="rotbar" hidden></div>

  <div class="tablewrap">
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="rooms"></tbody>
    </table>
  </div>

  <div class="sec">
    <h2 id="sched-title"></h2>
    <p class="note" id="sched-note"></p>
    <div class="rows" id="sched"></div>
  </div>

  <footer id="ft"></footer>
</div>

<script src="/js/monitor-wall.js?v=2" defer></script>
</body>
</html>
