<head>

<!--
  ══════════════════════════════════════════════════════════════════════════════
  🚗 영업담당자 실적·인사평가·보상  (2026-08-18)

  제안서: docs/영업담당_인사평가_제안서_260818.html
  서버:   src/api-sales-hr.ts  (/api/admin/sales/*)

  ⚠️ 설계 계약 — 깨면 제도가 죽습니다.
    1. **본인이 자기 실적 숫자를 타이핑하지 않습니다.** 계약·유지 확인은 본사만 씁니다.
       담당자가 쓰는 것은 «영업일지» 와 «후보 학원» 둘뿐입니다(서버에서도 403 으로 막힘).
    2. 영업일지 입력은 **3분 안에 끝나야** 합니다. 칸을 늘리면 3주째부터 아무도 안 씁니다.
       필수는 «학원 + 종류» 둘뿐, 나머지는 비워도 저장됩니다.
    3. 점수는 서버가 셉니다. 화면은 그리기만 합니다 —
       화면에서 계산하면 서버 값과 어긋나는 날이 반드시 옵니다(approval-hr.ts 와 같은 원칙).
    4. 자료가 없는 항목은 **0점이 아니라 «해당없음»** 입니다. 회색으로 표시합니다.

  📝 이 화면은 한국어 전용입니다(대상이 한국 영업담당자·본사).
     그래서 i18n-sweep 을 일부러 넣지 않았습니다 — 넣으면 한국어 라벨을 영어로 갈아치웁니다.

  admin.html(1.3MB) 은 **1줄도 건드리지 않았습니다.** 독립 화면이라 사고 반경이 여기까지입니다.
  ══════════════════════════════════════════════════════════════════════════════
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:MangoiHanSC,'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
       background:linear-gradient(160deg,#0f172a,#1e293b);color:#e6edf6;min-height:100vh;padding:22px;font-size:17px}
  .wrap{max-width:1180px;margin:0 auto}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  .head img{height:52px}
  h1{font-size:29px;margin:0;font-weight:900}
  .sub{color:#a9b7ca;font-size:16.5px;margin:4px 0 18px;line-height:1.6}
  .card{background:rgba(30,41,59,.92);border:1px solid rgba(148,163,184,.22);border-radius:20px;padding:22px;margin-bottom:18px}
  .card h2{font-size:20px;margin:0 0 4px;font-weight:900}
  .card .hint{color:#a9b7ca;font-size:14.5px;margin:0 0 14px;line-height:1.65}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  input,select,textarea,button{font-size:16px;border-radius:11px;padding:11px 14px;
       border:1px solid rgba(148,163,184,.4);font-family:inherit}
  input,select,textarea{background:#0f172a;color:#e6edf6}
  textarea{width:100%;resize:vertical;min-height:64px;line-height:1.6}
  .btn{cursor:pointer;font-weight:800;background:transparent;color:#e6edf6;border:1px solid rgba(148,163,184,.45)}
  .btn.primary{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1204;border-color:transparent}
  .btn.ghost{font-weight:700;font-size:14.5px;padding:8px 12px}
  .btn:disabled{opacity:.5;cursor:default}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:#a9b7ca;font-weight:700}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .kpi{background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.22);border-radius:16px;padding:16px}
  .kpi .k{font-size:13.5px;color:#a9b7ca;font-weight:700}
  .kpi .v{font-size:27px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .t{font-size:13px;color:#7c8ba1;margin-top:3px}
  .kpi.money .v{color:#6ee7b7}
  .kpi.warn .v{color:#fbbf24}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:16px}
  th,td{padding:11px 10px;text-align:left;border-bottom:1px solid rgba(148,163,184,.16);vertical-align:top}
  th{color:#a9b7ca;font-size:13.5px;font-weight:700;white-space:nowrap}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:nth-child(even){background:rgba(148,163,184,.06)}
  .scroll{overflow-x:auto}
  .bar{height:9px;background:rgba(148,163,184,.2);border-radius:5px;overflow:hidden;min-width:70px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:5px}
  .na{color:#7c8ba1;font-style:normal}
  .badge{font-size:13.5px;font-weight:800;padding:4px 11px;border-radius:999px;white-space:nowrap}
  .b-ok{background:rgba(16,185,129,.18);color:#6ee7b7}
  .b-warn{background:rgba(245,158,11,.18);color:#fbbf24}
  .b-dim{background:rgba(148,163,184,.16);color:#cbd5e1}
  .pipe{display:flex;flex-wrap:wrap;gap:8px}
  .pipe .st{flex:1 1 130px;background:rgba(15,23,42,.6);border:1px solid rgba(148,163,184,.22);
       border-radius:14px;padding:13px 14px}
  .pipe .st .n{font-size:12.5px;color:#7c8ba1;font-weight:700}
  .pipe .st .t{font-size:15.5px;font-weight:800;margin-top:2px}
  .pipe .st .c{font-size:24px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
  .grade{font-size:44px;font-weight:900;line-height:1}
  .empty{text-align:center;color:#a9b7ca;padding:26px 12px;line-height:1.7}
  .muted{color:#7c8ba1;font-size:14.5px;line-height:1.65}
  .warnbox{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);
       border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15px;line-height:1.7}
  .okbox{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);
       border-radius:14px;padding:14px 16px;margin-top:12px;font-size:15px;line-height:1.7}
  .why{font-size:13.5px;color:#a9b7ca;line-height:1.6}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  details.more{margin-top:10px}
  details.more > summary{cursor:pointer;color:#93c5fd;font-weight:700;font-size:15px}
  @media (max-width:760px){
    body{padding:14px;font-size:16px}
    h1{font-size:23px}
    table{font-size:14.5px}
    th,td{padding:9px 6px}
  }
  /* [hidden] 이 작성자 CSS 에 지지 않게 (CLAUDE.md 함정 — teacher.html 실사고) */
  [hidden]{display:none !important}
</style>

  /* PC 가독성 확대 — admin.html(body{zoom:1.3})과 동일 배율. 모바일 영향 없음 */
  @media (min-width:1024px){ body{zoom:1.3} }

<body>
<div class="wrap">

  <div class="head">
    <img src="/img/mango-char.png" alt="Mangoi" loading="lazy" decoding="async">
    <div>
      <h1>영업 실적 · 인사평가</h1>
      <div class="sub">전국 지사·학원 영업 담당자의 활동·계약·평가·성과급을 한 화면에서 봅니다.</div>
    </div>
    <a class="btn ghost" href="/admin.html" style="margin-left:auto;text-decoration:none">← 관리자 홈</a>
  </div>

  <!-- ── 기간·담당자 ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="toolbar">
      <label class="f">담당자
        <select id="rep"></select>
      </label>
      <label class="f">기간
        <select id="period"></select>
      </label>
      <button class="btn primary" id="reload" type="button">불러오기</button>
      <span class="muted" id="asOf"></span>
    </div>
    <div class="muted" id="repInfo"></div>
  </div>

  <div id="body"><div class="empty">불러오는 중…</div></div>

</div>

<script>
(function(){
  'use strict';
  function g(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function won(n){ if(n==null||isNaN(n)) return '-'; return Number(n).toLocaleString('ko-KR')+'원'; }
  function pct(r){ if(r==null||isNaN(r)) return '-'; return Math.round(r*100)+'%'; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  var STATE = { reps:[], repId:null, period:'', data:null, canEdit:false, leads:[], stages:[] };

  /* 기간 선택지 — 최근 12개월 + 최근 4개 반기.
     평가는 반기, 성과급은 월이라 둘 다 있어야 한다. */
  function periodOptions(){
    var out=[], d=new Date(), y=d.getFullYear(), m=d.getMonth()+1, i;
    for(i=0;i<12;i++){
      var yy=y, mm=m-i;
      while(mm<=0){ mm+=12; yy--; }
      var p=yy+'-'+String(mm).padStart(2,'0');
      out.push({ v:p, t:yy+'년 '+mm+'월' });
    }
    var h=(m<=6)?1:2, hy=y;
    for(i=0;i<4;i++){
      out.push({ v:hy+'-H'+h, t:hy+'년 '+(h===1?'상반기':'하반기')+' (평가)' });
      h = (h===1)?2:1; if(h===2) hy--;
    }
    return out;
  }

  function api(path, opts){
    return fetch(path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts||{}))
      .then(function(r){
        if(r.status===401) throw new Error('auth');
        if(r.status===403) throw new Error('forbidden');
        return r.json();
      });
  }

  /* ── 담당자 목록 ────────────────────────────────────────────── */
  function loadReps(){
    return api('/api/admin/sales/reps').then(function(j){
      STATE.reps = j.reps || [];
      STATE.canEdit = !!j.can_edit;
      var sel=g('rep');
      sel.innerHTML = STATE.reps.map(function(r){
        return '<option value="'+r.id+'">'+esc(r.name)+(r.active?'':' (비활성)')+'</option>';
      }).join('') || '<option value="">(등록된 담당자 없음)</option>';
      if(STATE.reps.length){ STATE.repId = STATE.reps[0].id; sel.value=String(STATE.repId); }
    });
  }

  /* ── 첫 화면 (왕복 1회) ─────────────────────────────────────── */
  function load(){
    g('body').innerHTML='<div class="empty">불러오는 중…</div>';
    var p = g('period').value;
    STATE.period = p;
    api('/api/admin/sales/overview?period='+encodeURIComponent(p))
      .then(function(j){
        if(!j.ok) throw new Error(j.error||'error');
        STATE.data = j;
        g('asOf').textContent = '기준일 '+(j.as_of||'');
        render();
        return loadLeads();
      })
      .catch(showError);
  }

  function loadLeads(){
    if(!STATE.repId) return;
    return api('/api/admin/sales/leads?rep_id='+STATE.repId+'&status=active')
      .then(function(j){ STATE.leads=j.leads||[]; STATE.stages=j.stages||[]; fillLeadSelects(); })
      .catch(function(){ /* 목록이 없어도 화면은 살아 있어야 한다 */ });
  }

  function showError(e){
    if(e && e.message==='auth'){
      g('body').innerHTML='<div class="empty">로그인이 필요합니다.<br><a href="/admin/login.html" style="color:#7dd3fc">로그인하기</a></div>';
    } else if(e && e.message==='forbidden'){
      g('body').innerHTML='<div class="empty">이 화면은 본사 계정과 영업담당자 본인만 볼 수 있습니다.</div>';
    } else {
      g('body').innerHTML='<div class="empty">불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
    }
  }

  /* ── 그리기 ─────────────────────────────────────────────────── */
  function render(){
    var j = STATE.data;
    if(!j || !j.cards || !j.cards.length){
      g('body').innerHTML = '<div class="card"><h2>아직 등록된 영업담당자가 없습니다</h2>'
        + '<p class="hint">아래에서 담당자를 먼저 등록하세요. 기본급·건당 성과급·월 목표는 나중에 언제든 바꿀 수 있습니다.</p></div>'
        + repFormHtml(null);
      bindRepForm();
      return;
    }
    var card = j.cards.filter(function(c){ return c.rep.id === STATE.repId; })[0] || j.cards[0];
    STATE.repId = card.rep.id;
    g('rep').value = String(STATE.repId);
    g('repInfo').innerHTML = repInfoHtml(card.rep);

    var html = '';
    html += kpiHtml(card, j);
    html += pipelineHtml(card);
    html += retentionHtml(j);
    html += scoreHtml(card, j);
    html += evalHtml();
    html += diaryHtml(j);
    html += dealFormHtml();
    html += leadFormHtml();
    html += repFormHtml(card.rep);
    g('body').innerHTML = html;

    bindAll();
    loadEvaluation();
  }

  function repInfoHtml(r){
    return '기본급 <b>'+won(r.base_salary_krw)+'</b> · 계약 1곳당 성과급 <b>'+won(r.incentive_per_deal_krw)+'</b>'
      + ' · 월 목표 <b>'+ (r.target_deals||0) +'곳</b>'
      + (r.region?(' · 담당 '+esc(r.region)):'')
      + (r.hired_at?(' · 입사 '+esc(r.hired_at)):'');
  }

  function kpiHtml(c, j){
    var comp = c.compensation || {};
    return '<div class="card">'
      + '<h2>'+esc(j.period_label)+' 요약</h2>'
      + '<p class="hint">숫자는 전부 서버가 기록에서 세어 만든 것입니다. 담당자가 직접 입력한 실적 숫자는 하나도 없습니다.</p>'
      + '<div class="grid g3">'
      + kpi('신규 계약 학원', c.deal_count+'곳', '목표 '+c.targets.deals+'곳','')
      + kpi('신규 등록 학생', c.student_count+'명', '목표 '+c.targets.students+'명','')
      + kpi('방문·상담', findItem(c,'visits')+'건', '목표 '+c.targets.visits+'건','')
      + kpi('영업일지 기록', findItem(c,'diary')+'일', '근무일 '+c.targets.workdays+'일','')
      + kpi('자동 점수(85점 중)', (c.earned==null?'-':c.earned), '적용가능 만점 '+c.applicable_max+'점','warn')
      + kpi('이 기간 성과급', won(comp.incentive_krw), '계약 1차 + 유지 2차','money')
      + '</div>'
      + (c.applicable_max < 85
          ? '<div class="warnbox">아직 <b>자료가 없어 채점하지 않은 항목</b>이 있습니다. 그 항목은 0점이 아니라 «해당없음»으로 빼고, 남은 항목의 만점('
            + c.applicable_max + '점)을 기준으로 환산합니다.</div>'
          : '')
      + '</div>';
  }
  function kpi(k,v,t,cls){
    return '<div class="kpi '+(cls||'')+'"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="t">'+esc(t)+'</div></div>';
  }
  function findItem(c,key){
    var it=(c.auto_items||[]).filter(function(i){ return i.key===key; })[0];
    return it && it.actual!=null ? it.actual : 0;
  }

  function pipelineHtml(c){
    var html = '<div class="card"><h2>영업 파이프라인</h2>'
      + '<p class="hint">지금 진행 중인 후보 학원이 어느 단계에 몇 곳 있는지입니다. '
      + '「방문은 많은데 제안이 없다」와 「제안은 많은데 계약이 없다」는 처방이 정반대라 나눠서 봅니다.</p>'
      + '<div class="pipe">';
    (c.pipeline||[]).forEach(function(s){
      html += '<div class="st"><div class="n">STEP '+s.n+'</div><div class="t">'+esc(s.ko)+'</div><div class="c">'+s.count+'</div></div>';
    });
    html += '</div></div>';
    return html;
  }

  function retentionHtml(j){
    var due = j.retention_due || [];
    if(!due.length) return '';
    var rows = due.map(function(d){
      return '<tr><td>'+esc(d.center_name)+'</td><td>'+esc(d.contract_date)+'</td><td>'+esc(d.retention_due||'')+'</td>'
        + '<td class="row-actions">'
        + (STATE.canEdit
            ? '<button class="btn ghost ret" data-id="'+d.id+'" data-v="1" type="button">유지됨</button>'
              + '<button class="btn ghost ret" data-id="'+d.id+'" data-v="0" type="button">이탈</button>'
            : '<span class="muted">본사가 확인합니다</span>')
        + '</td></tr>';
    }).join('');
    return '<div class="card"><h2>🔔 3개월 유지 확인이 필요한 계약</h2>'
      + '<p class="hint">여기를 누르지 않으면 <b>담당자가 성과급 2차(50%)를 못 받습니다.</b> 계약 후 90일이 지난 건만 올라옵니다.</p>'
      + '<div class="scroll"><table><thead><tr><th>학원</th><th>계약일</th><th>확인 예정일</th><th>확인</th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table></div></div>';
  }

  function scoreHtml(c, j){
    var rows = (c.auto_items||[]).map(function(i){
      var scoreCell, barPct;
      if(i.score==null){ scoreCell='<span class="na">해당없음</span>'; barPct=0; }
      else { scoreCell = i.score+' / '+i.weight; barPct = Math.round(Math.min(1,(i.score/i.weight))*100); }
      return '<tr>'
        + '<td>'+esc(i.label)+'</td>'
        + '<td class="num">'+(i.actual==null?'-':i.actual)+'</td>'
        + '<td class="num">'+(i.target==null?'-':i.target)+'</td>'
        + '<td class="num">'+(i.rate==null?'-':pct(i.rate))+'</td>'
        + '<td class="num">'+scoreCell+'</td>'
        + '<td><span class="bar"><i style="width:'+barPct+'%"></i></span></td>'
        + '</tr>'
        + '<tr><td colspan="6" class="why">'+esc(i.reason)+'</td></tr>';
    }).join('');
    return '<div class="card"><h2>자동 채점 (85점)</h2>'
      + '<p class="hint">실적 60 + 활동 25. 사람이 매기는 15점(보고·차량·협업)은 아래 «평가 확정»에서 넣습니다. '
      + '점수 아래 줄이 <b>«왜 이 점수인가»</b>입니다 — 이걸 설명 못 하면 평가 제도는 무너집니다.</p>'
      + '<div class="scroll"><table><thead><tr><th>항목</th><th class="num">실적</th><th class="num">목표</th>'
      + '<th class="num">달성률</th><th class="num">점수</th><th>　</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      + '</div>';
  }

  /* ── 평가 확정 (사람 15점) ─────────────────────────────────── */
  function evalHtml(){
    return '<div class="card" id="evalCard"><h2>평가 확정 (사람이 매기는 15점)</h2>'
      + '<p class="hint">보고 마감 준수 5 · 차량·비용 관리 5 · 협업 5. '

  function loadEvaluation(){
    if(!STATE.repId) return;
    api('/api/admin/sales/evaluation?rep_id='+STATE.repId+'&period='+encodeURIComponent(STATE.period))
      .then(function(j){
        if(!j.ok){ g('evalBody').innerHTML='<div class="muted">평가를 불러오지 못했습니다.</div>'; return; }
        var s=j.saved||{};
        var canEdit=!!j.can_edit;
        var html='';
        html += '<div class="grid g3">'
          + numField('sc_reporting','보고 마감 준수 (0~5)',5,s.score_reporting,canEdit)
          + numField('sc_vehicle','차량·비용 관리 (0~5)',5,s.score_vehicle,canEdit)
          + numField('sc_teamwork','협업 평가 (0~5)',5,s.score_teamwork,canEdit)
          + '</div>';
        html += '<div class="grid g2" style="margin-top:12px">'
          + '<label class="f">잘한 점<textarea id="ev_str" '+(canEdit?'':'disabled')+'>'+esc(s.strengths||'')+'</textarea></label>'
          + '<label class="f">개선할 점<textarea id="ev_imp" '+(canEdit?'':'disabled')+'>'+esc(s.improvements||'')+'</textarea></label>'
          + '</div>';
        if(canEdit){
          html += '<div class="toolbar" style="margin-top:12px"><button class="btn primary" id="ev_save" type="button">평가 저장·확정</button>'
            + '<span class="muted" id="ev_msg"></span></div>';
        }
        // 현재 총점·등급
        var f=j.final||{};
        html += '<div class="grid g3" style="margin-top:14px">'
          + '<div class="kpi"><div class="k">자동 점수</div><div class="v">'+(j.auto?j.auto.earned:'-')+'</div>'
            + '<div class="t">적용가능 만점 '+(j.auto?j.auto.applicable_max:'-')+'점</div></div>'
          + '<div class="kpi"><div class="k">환산 총점 (100점)</div><div class="v">'+(f.total==null?'-':f.total)+'</div>'
            + '<div class="t">'+(f.converted?'일부 항목 해당없음 → 비율 환산':'전 항목 채점')+'</div></div>'
          + '<div class="kpi money"><div class="k">등급 · 반기 상여</div>'
            + '<div class="v"><span class="grade">'+(j.grade||'-')+'</span></div>'
            + '<div class="t">'+(j.bonus_krw!=null?(won(j.bonus_krw)+' (배율 '+j.bonus_multiplier+')'):'반기를 골라야 계산됩니다')+'</div></div>'
          + '</div>';
        if(f.manual_sum==null){
          html += '<div class="warnbox">사람이 매기는 15점이 아직 비어 있습니다. 지금 총점은 <b>자동 85점만</b>으로 환산한 값입니다.</div>';
        }
        if(s.evaluated_at){
          html += '<div class="muted" style="margin-top:10px">마지막 확정: '+esc(s.evaluator||'')+' · '
            + new Date(Number(s.evaluated_at)).toLocaleString('ko-KR')+'</div>';
        }
        g('evalBody').innerHTML=html;
        if(canEdit && g('ev_save')) g('ev_save').addEventListener('click', saveEvaluation);
      })
      .catch(function(){ g('evalBody').innerHTML='<div class="muted">평가를 불러오지 못했습니다.</div>'; });
  }

  function boot(){
    var ps=periodOptions();
    g('period').innerHTML = ps.map(function(p){ return '<option value="'+p.v+'">'+p.t+'</option>'; }).join('');
    loadReps().then(load).catch(showError);
  }

  g('reload').addEventListener('click', load);
  g('period').addEventListener('change', load);
  g('rep').addEventListener('change', function(){ STATE.repId=Number(g('rep').value); load(); });

  boot();
})();
</script>
