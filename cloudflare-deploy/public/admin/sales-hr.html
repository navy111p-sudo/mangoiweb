  ⚠️ 설계 계약 — 깨면 제도가 죽습니다.
    1. **본인이 자기 실적 숫자를 타이핑하지 않습니다.** 계약·유지 확인은 본사만 씁니다.
       담당자가 쓰는 것은 «영업일지» 와 «후보 학원» 둘뿐입니다(서버에서도 403 으로 막힘).
    2. 영업일지 입력은 **3분 안에 끝나야** 합니다. 칸을 늘리면 3주째부터 아무도 안 씁니다.
       필수는 «학원 + 종류» 둘뿐, 나머지는 비워도 저장됩니다.
    3. 점수는 서버가 셉니다. 화면은 그리기만 합니다 —
       화면에서 계산하면 서버 값과 어긋나는 날이 반드시 옵니다(approval-hr.ts 와 같은 원칙).
    4. 자료가 없는 항목은 **0점이 아니라 «해당없음»** 입니다. 회색으로 표시합니다.

  📝 이 화면은 한국어 전용입니다(대상이 한국 영업담당자·본사).
     그래서 i18n-sweep 을 일부러 넣지 않았습니다 — 넣으면 한국어 라벨을 영어로 갈아치웁니다.

  admin.html(1.3MB) 은 **1줄도 건드리지 않았습니다.** 독립 화면이라 사고 반경이 여기까지입니다.

-->

  <!-- ── 기간·담당자 ─────────────────────────────────────────────── -->
  <div class="card">
    <div class="toolbar">
      <label class="f">담당자
        <select id="rep"></select>
      </label>

<script>
(function(){
  'use strict';
  function g(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  /* ══════════════════════════════════════════════════════════════
     💰 금액 표시 잠금 (2026-08-23 사장님 지시)
       「아직 금액을 책정하지 않았으니 상여금이나 일단 모든 금액은 XX 로」

     ⚠️ 계산을 끈 것이 아닙니다. 서버는 그대로 계산하고 DB 에도 그대로 저장됩니다 —
        **화면에 그리는 것만** 가립니다. 확정 뒤 아래 한 줄을 false 로 바꾸면
        모든 화면의 금액이 한꺼번에 되살아납니다(고칠 곳이 여기 하나뿐입니다).
     ⚠️ 설정 화면의 «기본급·성과급 입력칸» 은 가리지 않습니다.
        거기가 금액을 정하는 자리라, 가리면 확정 자체를 못 합니다.
     ══════════════════════════════════════════════════════════════ */
  var MONEY_LOCKED = true;
  function won(n){
    if(MONEY_LOCKED) return 'XX원';
    if(n==null||isNaN(n)) return '-';
    return Number(n).toLocaleString('ko-KR')+'원';
  }
  function pct(r){ if(r==null||isNaN(r)) return '-'; return Math.round(r*100)+'%'; }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  var STATE = { reps:[], repId:null, period:'', data:null, canEdit:false, leads:[], stages:[], reportText:'',
    // 서버(SALES_DEFAULTS)가 정본. 통신 실패로 못 받았을 때만 쓰는 예비값이다.
    defaults:{ base_salary_krw:2300000, incentive_per_deal_krw:600000,
               target_deals:2, target_students:20, target_visits:48, target_leads:20, target_care:8 } };

  /* 기간 선택지 — 최근 12개월 + 최근 4개 반기.
     평가는 반기, 성과급은 월이라 둘 다 있어야 한다. */
  function periodOptions(){
    var out=[], d=new Date(), y=d.getFullYear(), m=d.getMonth()+1, i;
    for(i=0;i<12;i++){
      var yy=y, mm=m-i;
      while(mm<=0){ mm+=12; yy--; }
      var p=yy+'-'+String(mm).padStart(2,'0');
      out.push({ v:p, t:yy+'년 '+mm+'월' });
    }
    var h=(m<=6)?1:2, hy=y;
    for(i=0;i<4;i++){
      out.push({ v:hy+'-H'+h, t:hy+'년 '+(h===1?'상반기':'하반기')+' (평가)' });
      h = (h===1)?2:1; if(h===2) hy--;
    }
    return out;
  }

  function api(path, opts){
    return fetch(path, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts||{}))
      .then(function(r){
        if(r.status===401) throw new Error('auth');
        if(r.status===403) throw new Error('forbidden');
        return r.json();
      });
  }

  /* ── 담당자 목록 ────────────────────────────────────────────── */
  function loadReps(){
    return api('/api/admin/sales/reps').then(function(j){
      STATE.reps = j.reps || [];
      STATE.canEdit = !!j.can_edit;
      STATE.defaults = j.defaults || STATE.defaults;
      var sel=g('rep');
      sel.innerHTML = STATE.reps.map(function(r){
        return '<option value="'+r.id+'">'+esc(r.name)+(r.active?'':' (비활성)')+'</option>';
      }).join('') || '<option value="">(등록된 담당자 없음)</option>';
      if(STATE.reps.length){ STATE.repId = STATE.reps[0].id; sel.value=String(STATE.repId); }
    });
  }

  /* ── 첫 화면 (왕복 1회) ─────────────────────────────────────── */
  function load(){
    g('body').innerHTML='<div class="empty">불러오는 중…</div>';
    var p = g('period').value;
    STATE.period = p;
    api('/api/admin/sales/overview?period='+encodeURIComponent(p))
      .then(function(j){
        if(!j.ok) throw new Error(j.error||'error');
        STATE.data = j;
        g('asOf').textContent = '기준일 '+(j.as_of||'');
        render();
        return loadLeads();
      })
      .catch(showError);
  }

  function loadLeads(){
    if(!STATE.repId) return;
    return api('/api/admin/sales/leads?rep_id='+STATE.repId+'&status=active')
      .then(function(j){ STATE.leads=j.leads||[]; STATE.stages=j.stages||[]; fillLeadSelects(); })
      .catch(function(){ /* 목록이 없어도 화면은 살아 있어야 한다 */ });
  }

  function showError(e){
    if(e && e.message==='auth'){
      g('body').innerHTML='<div class="empty">로그인이 필요합니다.<br><a href="/admin/login.html" style="color:#7dd3fc">로그인하기</a></div>';
    } else if(e && e.message==='forbidden'){
      g('body').innerHTML='<div class="empty">이 화면은 본사 계정과 영업담당자 본인만 볼 수 있습니다.</div>';
    } else {
      g('body').innerHTML='<div class="empty">불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
    }
  }

  /* ── 그림 조각 ───────────────────────────────────────────────
     글로 길게 설명하던 것을 그림으로 바꾼다. 사장님 지시(2026-08-23):
     「글은 적게·쉽게, 대신 그림으로 이해를 돕게」.
     ⚠️ 전부 인라인 SVG 다 — 외부 파일이 없어야 캐시·오프라인 사고가 안 난다.
     ⚠️ 애니메이션을 넣지 않는다(저전력·백그라운드 탭에서 멈춰 «영영 안 보임» 사고). */

  function svgScoreSplit(){
    return '<svg viewBox="0 0 400 54" class="viz" role="img" aria-label="100점 중 85점은 자동, 15점은 사람">'
      + '<rect x="0" y="10" width="338" height="26" rx="7" fill="#10b981"/>'
      + '<rect x="342" y="10" width="58" height="26" rx="7" fill="#38bdf8"/>'

  function goalBar(now, target){
    var n=Number(now)||0, t=Number(target)||0;
    if(!t) return '';
    var pct=Math.max(0,Math.min(100,Math.round(n/t*100)));
    var col= pct>=100 ? '#10b981' : (pct>=50 ? '#f59e0b' : '#64748b');
    return '<div class="gbar" title="'+pct+'%"><i style="width:'+pct+'%;background:'+col+'"></i></div>';
  }

  function svgLadder(cur){
    var steps=[{t:'좋습니다',c:'#10b981'},{t:'한 번 이야기',c:'#38bdf8'},
               {t:'3개월 함께',c:'#f59e0b'},{t:'다시 이야기',c:'#a78bfa'}];
    var out='<svg viewBox="0 0 400 76" class="viz" role="img" aria-label="지금 '+cur+'단계">';
    for(var i=0;i<4;i++){
      var x=2+i*100, on=(i===cur);
      out += '<rect x="'+x+'" y="14" width="94" height="38" rx="10" fill="'+(on?steps[i].c:'rgba(148,163,184,.10)')
          + '" stroke="'+(on?steps[i].c:'rgba(148,163,184,.30)')+'" stroke-width="'+(on?2:1)+'"/>'
          + '<text x="'+(x+47)+'" y="31" text-anchor="middle" font-size="11" font-weight="800" fill="'+(on?'#0b1220':'#7c8ba1')+'">'+i+'단계</text>'
          + '<text x="'+(x+47)+'" y="45" text-anchor="middle" font-size="12" font-weight="800" fill="'+(on?'#0b1220':'#a9b7ca')+'">'+steps[i].t+'</text>';
      if(on) out += '<text x="'+(x+47)+'" y="70" text-anchor="middle" font-size="11.5" font-weight="800" fill="'+steps[i].c+'">지금 여기</text>';
    }
    return out+'</svg>';
  }

  /* ── 주소 뒤 #칸 으로 들어왔을 때 그 칸으로 보내기 ────────────────
     ⚠️ 이 화면은 카드를 **JS 로 그린다.** 문서가 열리는 순간에는 #sh-low 같은 칸이
        아직 없어서 브라우저의 기본 해시 이동이 **조용히 아무 일도 안 한다**(에러도 없다).
        그래서 render() 가 끝난 뒤에 «직접» 보낸다.
     사이드바(js/adm-ia6.js 「정산·매출 ▸ 영업 실적·평가」)의 손자가 이 앵커들을 쓴다.
     ⛔ 앵커 id 를 바꾸려면 그쪽 secs 도 같이 고칠 것 — 한쪽만 고치면 화면 맨 위만 열린다.
        (sidebar_three_level_harness 가 두 파일을 대조해 FAIL 낸다) */
  function applyHash(){
    var id = String(location.hash || '').replace(/^#/, '');
    if(!id) return;
    var el = document.getElementById(id);
    if(!el) return;
    // 카드가 그려진 «다음 프레임» 에 보내야 위치가 확정된다.
    requestAnimationFrame(function(){
      try { el.scrollIntoView({ behavior:'auto', block:'start' }); } catch(e){ el.scrollIntoView(); }
    });
  }
  window.addEventListener('hashchange', applyHash);

      // 점수 칸 채우기 — 근거가 있는 것만. 이미 값이 있으면 덮지 않는다(사람 우선).
      var put=function(id,d){ var el=g(id); if(el && d && d.score!=null && el.value==='') el.value=d.score; };
      put('sc_reporting', j.reporting); put('sc_vehicle', j.vehicle); put('sc_teamwork', j.teamwork);
      if(g('ev_str') && !g('ev_str').value) g('ev_str').value=(j.strengths||[]).join('\n');

                             : '🤖 AI 초안입니다 — 확정은 사장님이 하십니다.')+'</b>';
      if(j.summary) h+='<br>'+esc(j.summary);
      h+='</div>';
      // AI 가 왜 폴백됐는지 — 한 줄이면 다음 스크린샷으로 원인을 잡을 수 있다
      if(j.model==='rules' && j.ai_error){
        h+='<div class="muted" style="margin-top:6px">AI 연결 상태: '+esc(j.ai_error)+'</div>';
      }
      var ev=function(name,d){
        if(!d) return '';
        return '<div class="rec"><span class="m">'+(d.score!=null?'✏️':'⬜')+'</span><span><b>'+name+'</b> — '
          + (d.score!=null ? (d.score+'점 · '+esc(d.evidence)) : '자료가 없어 비워 둠 (직접 넣어 주세요)')+'</span></div>';
      };
      h+=ev('보고 마감',j.reporting)+ev('차량·비용',j.vehicle)+ev('협업',j.teamwork);

    }).catch(function(){
      btn.disabled=false; btn.textContent='🤖 AI 초안 받기';
      g('ev_ai_box').innerHTML='<div class="warnbox">불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';

  /* ── 🎤 음성 받아쓰기 ────────────────────────────────────────────
     브라우저 내장 음성인식(Web Speech API)을 씁니다. 서버·외부 라이브러리 0개.
     ⚠️ 지원하지 않는 브라우저(파이어폭스 등)에서는 버튼을 숨기고,
        «붙여넣고 AI로 정리하기» 경로가 그대로 남습니다 — 막다른 길을 만들지 않습니다. */
  var REC = null, recOn = false;

  function speechCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

  function setupMic(){
    var btn = g('ac_mic');
    if(!btn) return;
    var Ctor = speechCtor();
    if(!Ctor){
      btn.hidden = true;                       // 지원 안 하면 조용히 숨긴다
      var m = g('ac_ai_msg');
      if(m) m.textContent = '이 브라우저는 음성 입력을 지원하지 않습니다. 받아쓴 내용을 붙여넣고 «AI로 정리하기»를 누르세요.';
      return;
    }
    btn.hidden = false;
    btn.addEventListener('click', function(){ recOn ? stopMic() : startMic(Ctor); });
  }

  function startMic(Ctor){
    try{
      REC = new Ctor();
      REC.lang = 'ko-KR';
      REC.continuous = true;
      REC.interimResults = true;
      REC.onresult = function(e){
        var fin = '';
        for(var i=e.resultIndex; i<e.results.length; i++){
          if(e.results[i].isFinal) fin += e.results[i][0].transcript;
        }
        if(fin){
          var ta = g('ac_voice');
          ta.value = (ta.value ? ta.value + ' ' : '') + fin.trim();
        }
      };
      REC.onerror = function(){ stopMic(); g('ac_ai_msg').textContent = '음성 인식이 중단됐습니다. 다시 눌러 주세요.'; };
      REC.onend = function(){ if(recOn) stopMic(); };
      REC.start();
      recOn = true;
      g('ac_mic').classList.add('on');
      g('ac_mic_t').textContent = '녹음 중 — 누르면 끝';
      g('ac_ai_msg').textContent = '듣고 있습니다. 편하게 말씀하세요.';
    }catch(err){
      recOn = false;
      g('ac_ai_msg').textContent = '음성 입력을 시작하지 못했습니다. 마이크 권한을 확인해 주세요.';
    }
  }

  function stopMic(){
    recOn = false;
    try{ if(REC) REC.stop(); }catch(e){}
    var b=g('ac_mic'); if(b){ b.classList.remove('on'); }
    var t=g('ac_mic_t'); if(t){ t.textContent='말로 쓰기'; }
    // 말이 끝나면 바로 정리한다 — 버튼을 한 번 더 누르게 하면 그 한 번에서 사람이 떨어져 나간다.
    if(g('ac_voice') && g('ac_voice').value.trim()) parseDiary();
  }

  function parseDiary(){
    var text = g('ac_voice') ? g('ac_voice').value.trim() : '';
    if(!text){ g('ac_ai_msg').textContent = '먼저 말하거나 내용을 붙여넣어 주세요.'; return; }
    g('ac_ai_msg').textContent = '정리하는 중…';
    api('/api/admin/sales/parse-diary', { method:'POST', body: JSON.stringify({ rep_id: STATE.repId, text: text }) })
      .then(function(j){
        if(!j.ok || !j.draft){ g('ac_ai_msg').textContent = '정리하지 못했습니다. 아래 칸에 직접 적어 주세요.'; return; }
        var d = j.draft;
        if(d.lead_id && g('ac_lead')) g('ac_lead').value = String(d.lead_id);
        if(d.kind && g('ac_kind')) g('ac_kind').value = d.kind;
        if(g('ac_stage')) g('ac_stage').value = (d.stage_after==null ? '' : String(d.stage_after));
        if(g('ac_note')) g('ac_note').value = d.outcome || d.note || '';
        if(g('ac_next')) g('ac_next').value = d.next_action || '';
        var msg = (d.source === 'ai')
          ? 'AI가 정리했습니다. 틀린 것만 고치고 저장하세요.'
          : '간단히 정리했습니다(AI를 쓸 수 없는 상태). 내용을 확인해 주세요.';
        if(d.unknown_lead){
          msg += ' · 「' + d.unknown_lead + '」는 후보 학원 목록에 없습니다 — 아래 «후보 학원»에서 먼저 등록하세요.';
        }
        g('ac_ai_msg').textContent = msg;
      })
      .catch(function(){ g('ac_ai_msg').textContent = '정리하지 못했습니다. 아래 칸에 직접 적어 주세요.'; });
  }

  function loadReport(){

  function copyReport(){
    var t = STATE.reportText || '';
    if(!t){ g('rp_msg').textContent='먼저 보고서를 만들어 주세요.'; return; }
    // 인앱 브라우저에서 clipboard API 가 막히는 경우가 있어 폴백을 둔다.
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ g('rp_msg').textContent='복사했습니다.'; })
        .catch(function(){ legacyCopy(t); });
    } else { legacyCopy(t); }
  }
  function legacyCopy(t){
    try{
      var ta=document.createElement('textarea');
      ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      g('rp_msg').textContent='복사했습니다.';
    }catch(e){ g('rp_msg').textContent='복사가 막혀 있습니다. 글을 직접 선택해 주세요.'; }
  }

  function recLine(ok, text){
    return '<div class="rec"><span class="m">'+(ok?'✅':'⬜')+'</span><span>'+esc(text)+'</span></div>';
  }

  function meetKo(k){
    return k==='checkin'?'주간 점검':k==='plan_open'?'개선계획 시작':k==='plan_close'?'개선계획 마무리':'면담';
  }

  function bindDiscipline(j){
    if(g('dc_open')) g('dc_open').addEventListener('click', function(){
      var goals = (g('dc_goals').value||'').trim();
      if(!goals){ g('dc_msg').textContent='개선 목표를 적어 주세요.'; return; }
      var st = j.stage || {};
      var trig = (j.evals||[]).filter(function(e){ return !e.advisory; }).slice(0,2);
      post('/api/admin/sales/improvement-plan', {
        action:'open', rep_id: STATE.repId, goals: goals,
        support: (g('dc_support').value||'').trim(),
        months: Number(g('dc_months').value||3),
        trigger_periods: trig.map(function(e){ return e.period; }).join(', '),
        trigger_grades: trig.map(function(e){ return e.grade; }).join(', ')
      }, 'dc_msg', '개선계획을 열었습니다.');
    });

    if(g('dc_close')) g('dc_close').addEventListener('click', function(){
      var result = g('dc_result').value;
      if(!result){ g('dc_msg').textContent='달성/미달을 골라 주세요.'; return; }
      var note = (g('dc_note').value||'').trim();
      if(!note){ g('dc_msg').textContent='판단 근거를 한 줄이라도 적어 주세요.'; return; }
      post('/api/admin/sales/improvement-plan', {
        action:'close', rep_id: STATE.repId, plan_id: (j.open_plan||{}).id,
        result: result, result_note: note
      }, 'dc_msg', '개선계획을 마쳤습니다.');
    });

    if(g('dc_msave')) g('dc_msave').addEventListener('click', function(){
      var sum = (g('dc_msum').value||'').trim();
      if(!sum){ g('dc_mmsg').textContent='무슨 이야기를 했는지 적어 주세요.'; return; }
      post('/api/admin/sales/meeting', {
        rep_id: STATE.repId, meeting_date: g('dc_mdate').value,
        kind: g('dc_mkind').value, summary: sum,
        agreed: (g('dc_magr').value||'').trim(),
        plan_id: (j.open_plan||{}).id || null
      }, 'dc_mmsg', '면담 기록을 저장했습니다.');
    });
  }

  /** 저장 공통 — 성공하면 카드를 다시 그린다(단계가 바뀔 수 있다). */
  function post(url, payload, msgId, okText){
    var el = g(msgId); if(el) el.textContent='저장 중…';
    api(url, { method:'POST', body: JSON.stringify(payload) })
      .then(function(r){
        if(!r || !r.ok){
          if(el) el.textContent = (r && r.message) ? r.message : '저장하지 못했습니다.';
          return;
        }
        if(el) el.textContent = okText;
        loadDiscipline();
      })
      .catch(function(){ if(el) el.textContent='저장하지 못했습니다.'; });
  }

  /* ── ⚖️ 공정성 감시 ───────────────────────────────────────────── */

    return '<div class="card"><h2>⚖️ 공정성 감시</h2>'
      + '<p class="lead">점수만으로는 안 보이는 <b>사정</b>을 미리 짚어 드립니다.</p>'
      + '<div class="eg">예) 담당 지역이 중간에 바뀌었거나, 기록이 남기 시작한 날이 늦었다면 알려 드립니다.<br>'
      + '<span style="color:#7c8ba1">점수를 대신 고쳐 주지는 않습니다. 판단은 사람 몫으로 남깁니다.</span></div>'
      + '<div id="fnBody"><div class="muted">불러오는 중…</div></div></div>';
  }

  function loadFairness(){
    if(!STATE.repId || !g('fnBody')) return;
    api('/api/admin/sales/fairness?rep_id='+STATE.repId+'&period='+encodeURIComponent(STATE.period))
      .then(function(j){
        if(!j.ok){ g('fnBody').innerHTML='<div class="muted">불러오지 못했습니다.</div>'; return; }
        var f=j.flags||[];
        if(!f.length){
          g('fnBody').innerHTML='<div class="okbox">이번 기간에는 짚을 만한 불공정 신호가 없습니다. 점수를 그대로 보셔도 됩니다.</div>';
          return;
        }
        g('fnBody').innerHTML = f.map(function(x){
          return '<div class="flag '+x.level+'"><div class="t">'+esc(x.title)+'</div>'
            + '<div class="d">'+esc(x.detail)+'</div></div>';
        }).join('');
      })
      .catch(function(){ g('fnBody').innerHTML='<div class="muted">불러오지 못했습니다.</div>'; });
  }

  /* ── 후보 학원 등록 ─────────────────────────────────────────── */
  function leadFormHtml(){
    var rows = (STATE.leads||[]).slice(0,30).map(function(l){
      return '<tr><td>'+esc(l.name)+'</td><td>'+esc(l.region||'')+'</td><td>'+esc(stageKo(l.stage))+'</td>'
        + '<td>'+esc(l.contact_name||'')+'</td><td>'+esc(l.next_action||'')+'</td>'
        + '<td>'+esc(l.last_contact_at||'')+'</td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">아직 등록된 후보 학원이 없습니다.</td></tr>';
    return '<div class="card"><h2>후보 학원</h2>'
      + '<p class="lead">만난 학원을 여기 적어 두면 <b>회사에 남습니다.</b> 담당자가 바뀌어도 그대로입니다.</p>'
      + '<div class="grid g3">'
      + '<label class="f">학원 이름<input id="ld_name" placeholder="예: 둔산 ○○어학원"></label>'
      + '<label class="f">지역<input id="ld_region" placeholder="예: 대전 서구"></label>'
      + '<label class="f">원장님 성함<input id="ld_contact"></label>'
      + '<label class="f">연락처<input id="ld_phone" placeholder="010-0000-0000"></label>'
      + '<label class="f">단계<select id="ld_stage">'
        + '<option value="1">1 발굴</option><option value="2">2 접촉</option><option value="3">3 방문상담</option>'
        + '<option value="4">4 제안·시연</option><option value="5">5 계약</option><option value="6">6 개원·정착</option>'
        + '</select></label>'
      + '<label class="f">다음 할 일<input id="ld_next"></label>'
      + '</div>'
      + '<div class="toolbar" style="margin-top:12px"><button class="btn primary" id="ld_save" type="button">후보 학원 등록</button>'
      + '<span class="muted" id="ld_msg"></span></div>'
      + '<div class="scroll" style="margin-top:14px"><table><thead><tr><th>학원</th><th>지역</th><th>단계</th><th>원장님</th><th>다음 할 일</th><th>마지막 접촉</th></tr></thead>'
      + '<tbody>'+rows+'</tbody></table></div></div>';
  }

  function saveLead(){
    var btn=g('ld_save'); btn.disabled=true;
    api('/api/admin/sales/leads', { method:'POST', body: JSON.stringify({
      rep_id: STATE.repId, name: g('ld_name').value, region: g('ld_region').value,
      contact_name: g('ld_contact').value, contact_phone: g('ld_phone').value,
      stage: g('ld_stage').value, next_action: g('ld_next').value
    })}).then(function(j){
      btn.disabled=false;
      g('ld_msg').textContent = j.ok ? '등록했습니다.' : ('등록 실패: '+(j.message||j.error||''));
      if(j.ok){ g('ld_name').value=''; g('ld_next').value=''; load(); }
    }).catch(function(){ btn.disabled=false; g('ld_msg').textContent='등록 실패(통신 오류)'; });
  }

  /* ── 계약 등록 (본사만) ─────────────────────────────────────── */
  function dealFormHtml(){
    if(!STATE.canEdit){
      return '<div class="card"><h2>계약</h2><p class="hint">계약 등록·유지 확인은 <b>본사만</b> 합니다. '
        + '성과급의 근거라서, 본인이 자기 실적을 입력하지 않도록 막아 둔 것입니다.</p></div>';
    }
    return '<div class="card"><h2>계약 등록 (본사)</h2>'
      + '<p class="lead">계약을 넣으면 <b>성과급 절반</b>이 그 달에 잡히고, 3개월 뒤 나머지 절반을 확인합니다.</p>'
      + '<div class="grid g3">'
      + '<label class="f">학원 이름<input id="dl_name"></label>'
      + '<label class="f">연결할 후보 학원<select id="dl_lead"></select></label>'
      + '<label class="f">계약일<input type="date" id="dl_date" value="'+todayISO()+'"></label>'
      + '<label class="f">최초 등록 학생 수<input type="number" id="dl_students" min="0" value="0"></label>'
      + '<label class="f">지역<input id="dl_region"></label>'
      + '<label class="f">성과급 총액(비우면 기본값)<input type="number" id="dl_inc" min="0" placeholder="담당자 기본값 사용"></label>'
      + '</div>'
      + '<div class="toolbar" style="margin-top:12px"><button class="btn primary" id="dl_save" type="button">계약 등록</button>'
      + '<span class="muted" id="dl_msg"></span></div></div>';
  }

  function saveDeal(){
    var btn=g('dl_save'); btn.disabled=true;
    api('/api/admin/sales/deals', { method:'POST', body: JSON.stringify({
      rep_id: STATE.repId, center_name: g('dl_name').value, lead_id: g('dl_lead').value || null,
      contract_date: g('dl_date').value, students_initial: g('dl_students').value,
      region: g('dl_region').value,
      incentive_total_krw: g('dl_inc').value || null
    })}).then(function(j){
      btn.disabled=false;
      g('dl_msg').textContent = j.ok ? '등록했습니다.' : ('등록 실패: '+(j.message||j.error||''));
      if(j.ok){ g('dl_name').value=''; load(); }
    }).catch(function(){ btn.disabled=false; g('dl_msg').textContent='등록 실패(통신 오류)'; });
  }

  /* ⚠️ rep_id 는 «그 계약의 담당자»(행의 data-rep) — STATE.repId(드롭다운 선택)를 보내면
     본사 화면에서 남의 계약을 확인하는 순간 계약·성과급이 선택된 담당자로 재배정된다.
     서버도 유지-전용 페이로드는 유지 칸만 갱신하도록 막았지만(2026-08-27), 값 자체도 맞게. */
  function markRetention(id, v, repId){
    api('/api/admin/sales/deals', { method:'POST', body: JSON.stringify({
      id: Number(id), rep_id: Number(repId || STATE.repId), retained_3m: Number(v), retention_checked_at: todayISO()
    })}).then(function(){ load(); }).catch(function(){});
  }

  /* ── 담당자 설정 ────────────────────────────────────────────── */
  /* 저장된 값이 있으면 그것, 없으면 서버가 준 기본값(SALES_DEFAULTS). */
  function dv(v, key){
    if(v!=null && v!=='') return v;
    var d=STATE.defaults||{};
    return d[key]!=null ? d[key] : 0;
  }

  function repFormHtml(r){
    if(!STATE.canEdit && r) return '';
    r = r || {};
    return '<div class="card"><h2>담당자 설정'+(r.id?'':' (신규 등록)')+'</h2>'
      + '<p class="lead">기본급·성과급·목표를 <b>여기서</b> 바꿉니다. 바꾸면 점수와 금액이 바로 따라옵니다.</p>'
      + (MONEY_LOCKED
          ? '<div class="eg">💰 다른 화면의 금액은 <b>XX</b> 로 가려 두었습니다. '
            + '<b>이 칸만은 그대로 보입니다</b> — 여기가 금액을 정하는 자리라서요.</div>'
          : '')
      + '<div class="eg">한 달만 다르게 하고 싶으면 아래 «이 달만 목표 바꾸기»를 쓰세요.</div>'
      + (r.id ? '' : '<div class="okbox" style="margin-bottom:14px">'
          + '금액·목표는 <b>임시 값</b>으로 미리 채워 두었습니다 (아직 정하는 중입니다).<br>'
          + '<b>담당자 이름만 넣고 «저장»을 누르시면 됩니다.</b> 나중에 언제든 여기서 바꿀 수 있습니다.</div>')
      + '<div class="grid g3">'
      + '<label class="f">이름<input id="rp_name" value="'+esc(r.name||'')+'"></label>'
      + '<label class="f">담당 지역<input id="rp_region" value="'+esc(r.region||'')+'"></label>'
      + '<label class="f">관리자 아이디(본인 로그인)<input id="rp_user" value="'+esc(r.admin_username||'')+'" placeholder="비우면 본인 조회 불가"></label>'
      + '<label class="f">입사일<input type="date" id="rp_hired" value="'+esc(r.hired_at||'')+'"></label>'
      + '<label class="f">연습 기간 시작일<input type="date" id="rp_prog" value="'+esc(r.program_started_at||'')+'"></label>'
      + '<label class="f">기본급(원)<input type="number" id="rp_base" min="0" value="'+dv(r.base_salary_krw,'base_salary_krw')+'"></label>'
      + '<label class="f">계약 1곳당 성과급(원)<input type="number" id="rp_inc" min="0" value="'+dv(r.incentive_per_deal_krw,'incentive_per_deal_krw')+'"></label>'
      + '<label class="f">월 목표 — 계약<input type="number" id="rp_td" min="0" value="'+dv(r.target_deals,'target_deals')+'"></label>'
      + '<label class="f">월 목표 — 학생<input type="number" id="rp_ts" min="0" value="'+dv(r.target_students,'target_students')+'"></label>'
      + '<label class="f">월 목표 — 방문<input type="number" id="rp_tv" min="0" value="'+dv(r.target_visits,'target_visits')+'"></label>'
      + '<label class="f">월 목표 — 신규 발굴<input type="number" id="rp_tl" min="0" value="'+dv(r.target_leads,'target_leads')+'"></label>'
      + '<label class="f">월 목표 — 관리방문<input type="number" id="rp_tc" min="0" value="'+dv(r.target_care,'target_care')+'"></label>'
      + '</div>'
      + '<div class="toolbar" style="margin-top:12px">'
      + '<button class="btn primary" id="rp_save" type="button" data-id="'+(r.id||0)+'">저장</button>'
      + '<span class="muted" id="rp_msg"></span></div>'
      + (r.id ? targetFormHtml(r) : '')
      + '</div>';
  }

  function targetFormHtml(r){
    return '<details class="more"><summary>이 달만 목표 바꾸기 (명절·시험기간 등)</summary>'
      + '<div class="grid g3" style="margin-top:12px">'
      + '<label class="f">대상 월<input id="tg_period" placeholder="2026-03"></label>'
      + '<label class="f">계약<input type="number" id="tg_d" min="0"></label>'
      + '<label class="f">학생<input type="number" id="tg_s" min="0"></label>'
      + '<label class="f">방문<input type="number" id="tg_v" min="0"></label>'
      + '<label class="f">신규 발굴<input type="number" id="tg_l" min="0"></label>'
      + '<label class="f">관리방문<input type="number" id="tg_c" min="0"></label>'
      + '<label class="f">근무일 수(비우면 평일 자동)<input type="number" id="tg_w" min="0"></label>'
      + '</div>'
      + '<div class="toolbar" style="margin-top:10px"><button class="btn" id="tg_save" type="button">이 달 목표 저장</button>'
      + '<span class="muted" id="tg_msg"></span></div></details>';
  }

  function saveRep(){
    var btn=g('rp_save'); btn.disabled=true;
    api('/api/admin/sales/reps', { method:'POST', body: JSON.stringify({
      id: Number(btn.getAttribute('data-id'))||0,
      name: g('rp_name').value, region: g('rp_region').value,
      admin_username: g('rp_user').value, hired_at: g('rp_hired').value,
      program_started_at: g('rp_prog') ? g('rp_prog').value : '',
      base_salary_krw: g('rp_base').value, incentive_per_deal_krw: g('rp_inc').value,
      target_deals: g('rp_td').value, target_students: g('rp_ts').value,
      target_visits: g('rp_tv').value, target_leads: g('rp_tl').value, target_care: g('rp_tc').value
    })}).then(function(j){
      btn.disabled=false;
      g('rp_msg').textContent = j.ok ? '저장했습니다.' : ('저장 실패: '+(j.message||j.error||''));
      if(j.ok) boot();
    }).catch(function(){ btn.disabled=false; g('rp_msg').textContent='저장 실패(통신 오류)'; });
  }

  function saveTarget(){
    var btn=g('tg_save'); btn.disabled=true;
    api('/api/admin/sales/targets', { method:'POST', body: JSON.stringify({
      rep_id: STATE.repId, period: g('tg_period').value,
      target_deals: g('tg_d').value, target_students: g('tg_s').value,
      target_visits: g('tg_v').value, target_leads: g('tg_l').value,
      target_care: g('tg_c').value, workdays: g('tg_w').value
    })}).then(function(j){
      btn.disabled=false;
      g('tg_msg').textContent = j.ok ? '저장했습니다.' : ('저장 실패: '+(j.message||j.error||''));
      if(j.ok) load();
    }).catch(function(){ btn.disabled=false; g('tg_msg').textContent='저장 실패(통신 오류)'; });
  }

  /* ── 이벤트 연결 ───────────────────────────────────────────── */
  function bindRepForm(){
    if(g('rp_save')) g('rp_save').addEventListener('click', saveRep);
    if(g('tg_save')) g('tg_save').addEventListener('click', saveTarget);
  }
  function bindAll(){
    if(g('ac_save')) g('ac_save').addEventListener('click', saveActivity);
    if(g('ac_parse')) g('ac_parse').addEventListener('click', parseDiary);
    setupMic();
    if(g('rt_sweep')) g('rt_sweep').addEventListener('click', runSweep);
    if(g('rp_load')) g('rp_load').addEventListener('click', loadReport);
    if(g('rp_copy')) g('rp_copy').addEventListener('click', copyReport);
    if(g('ld_save')) g('ld_save').addEventListener('click', saveLead);
    if(g('dl_save')) g('dl_save').addEventListener('click', saveDeal);
    bindRepForm();
    Array.prototype.forEach.call(document.querySelectorAll('.ret'), function(b){
      b.addEventListener('click', function(){ markRetention(b.getAttribute('data-id'), b.getAttribute('data-v'), b.getAttribute('data-rep')); });
    });
    fillLeadSelects();
  }

  /* ── 시작 ──────────────────────────────────────────────────── */
  function boot(){
    var ps=periodOptions();
    g('period').innerHTML = ps.map(function(p){ return '<option value="'+p.v+'">'+p.t+'</option>'; }).join('');
    loadReps().then(load).catch(showError);
  }

  g('reload').addEventListener('click', load);
  g('period').addEventListener('change', load);
  g('rep').addEventListener('change', function(){ STATE.repId=Number(g('rep').value); load(); });

  boot();
})();
</script>
<script src="/js/adm-light-surfaces.js?v=15" defer></script>
</body>
</html>
