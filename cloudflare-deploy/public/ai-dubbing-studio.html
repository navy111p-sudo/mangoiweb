<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A.i 더빙동영상</title>
<meta name="description" content="A.i 더빙동영상(🎬 A.i영화더빙 메뉴 안) · 영상 속 캐릭터 대사를 내가 직접 더빙하는 영어 말하기 연습 · 10편">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/css/mangoi-han.css">
<script defer src="/js/back-nav.js"></script>
<script defer src="/js/tts-short-text.js?v=1"></script>
<style>
/* Layout: 녹음 부스 느낌 — 왼쪽 무대(화면+자막+재생기), 오른쪽 설정+큐시트. 모바일은 한 줄로 쌓기 */
:root {
  --bg: #EEF3F4;
  --surface: #FFFFFF;
  --ink: #16252C;
  --muted: #5A6C73;
  --line: #D5E0E3;
  --accent: #0E7A7E;
  --accent-ink: #FFFFFF;
  --mine: #B86E00;
  --mine-soft: #FFF1D9;
  --rec: #E0444A;
  --stage-frame: #16252C;
  --font-display: MangoiHanSC, "Jua", "Nunito", system-ui, sans-serif;
  --font-body: MangoiHanSC, "Nunito", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: MangoiHanSC, "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171B; --surface: #16232A; --ink: #E6EEF0; --muted: #93A6AD; --line: #293A42;
    --accent: #41C1C4; --accent-ink: #062022; --mine: #F2B544; --mine-soft: #3A2D14; --rec: #FF6167;
    --stage-frame: #05090B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E171B; --surface: #16232A; --ink: #E6EEF0; --muted: #93A6AD; --line: #293A42;
  --accent: #41C1C4; --accent-ink: #062022; --mine: #F2B544; --mine-soft: #3A2D14; --rec: #FF6167;
  --stage-frame: #05090B; color-scheme: dark;
}
* { box-sizing: border-box; }
/* mangoi.ai: 화면 곳곳의 display 규칙이 브라우저 기본 [hidden]{display:none} 을 이기므로 못 박는다
   (안 박으면 «더빙 완료»·«영상 만드는 중» 같은 숨긴 덮개가 처음부터 다 보인다). */
[hidden] { display: none !important; }
/* 왼쪽 위 ← 뒤로가기(back-nav.js, 고정 위치)가 제목 첫 글자를 덮지 않게 자리를 비워 둔다 */
.top .brand { padding-left: 48px; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Header ---------- */
.top { max-width: 1180px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; margin: 0; line-height: 1.1; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
.lang button { border: 0; background: none; padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- Main grid ---------- */
.grid { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Stage ---------- */
.stage-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; border-radius: var(--r); overflow: hidden; background: var(--stage-frame); border: 6px solid var(--stage-frame); aspect-ratio: 16 / 9; max-width: 100%; }
.stage svg { display: block; width: 100%; height: 100%; }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #05090B; }
.ai-badge { position: absolute; bottom: 10px; right: 10px; padding: 3px 9px; border-radius: 6px; background: rgba(10,16,19,.72); color: #CFE9EA; font: 500 11px var(--font-mono); letter-spacing: .06em; }
.onair { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px;
  background: rgba(10,16,19,.72); color: #9AA9AE; font: 500 12px var(--font-mono); letter-spacing: .12em; }
.onair i { width: 9px; height: 9px; border-radius: 50%; background: #4A5559; }
.onair.live { color: #fff; }
.onair.live i { background: #FF4B52; box-shadow: 0 0 10px #FF4B52; animation: blink 1s steps(2) infinite; }
.tc { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(10,16,19,.72); color: #E6EEF0; font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; }

.turn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92%, 440px);
  background: rgba(10,16,19,.86); color: #fff; border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.turn-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.turn strong { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.turn.echo strong { color: #8FE3E5; }
.turn:not(.echo) strong { color: #FFC857; }
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: #FFC857; border-radius: 99px; }
.turn.echo .bar span { background: #8FE3E5; }
.done-btn { border: 0; border-radius: 999px; padding: 7px 14px; background: #fff; color: #16252C; font-weight: 800; font-size: 14px; white-space: nowrap; }
.turn.waiting .done-btn { animation: pulse 1s ease-in-out infinite; }

.finish { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; background: rgba(10,16,19,.8); color: #fff; padding: 16px; }
.finish h2 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; color: #FFC857; }
.finish p { margin: 0; font-size: 16px; }
.finish .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.finish button { border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 800; background: #fff; color: #16252C; }
.finish button.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5); }

/* ---------- Caption ---------- */
.caption { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-height: 104px; display: grid; gap: 4px; }
.caption.mine { background: var(--mine-soft); border-color: var(--mine); }
.cap-who { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; color: var(--muted); letter-spacing: .03em; }
.caption.mine .cap-who { color: var(--mine); }
.cap-en { font-size: 22px; font-weight: 700; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.cap-ko { font-size: 15px; color: var(--muted); margin: 0; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .06em; background: var(--mine); color: var(--surface); }

/* ---------- Transport ---------- */
.transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.tbtn svg { width: 16px; height: 16px; fill: currentColor; }
.tbtn.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 10px 20px; font-size: 15px; }
.tbtn:disabled { opacity: .45; cursor: not-allowed; }
.counter { margin-left: auto; font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.notice { font-size: 13px; color: var(--rec); margin: 0; }

/* ---------- Panel ---------- */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 14px; }
.field { display: grid; gap: 7px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg.roles button[aria-pressed="true"] { background: var(--mine); border-color: var(--mine); color: var(--surface); }
.help { margin: 0; font-size: 13px; color: var(--muted); }
.checks { display: grid; gap: 8px; }
.checks label { display: flex; gap: 9px; align-items: center; font-size: 14px; cursor: pointer; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }

.cue-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cue-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.cue-head span { font: 500 12px var(--font-mono); color: var(--muted); }
.cues { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 460px; overflow-y: auto; }
@media (max-width: 860px) { .cues { max-height: none; } }
.cue { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
.cue:hover { background: var(--bg); }
.cue.mine { background: var(--mine-soft); }
.cue.now { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.cue-tc { font: 500 11px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.cue-who { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.cue.mine .cue-who { color: var(--mine); }
.cue-en { grid-column: 2; font-weight: 700; overflow-wrap: anywhere; }
.cue-ko { grid-column: 2; font-size: 13px; color: var(--muted); }

/* ---------- Recording ---------- */
.cap-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.chip-btn { border: 1px solid var(--mine); background: var(--surface); color: var(--mine); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip-btn.solid { background: var(--mine); color: var(--surface); }
.chip-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.cue-rec { grid-column: 2; display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.cue-rec button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
.cue-rec button.has { color: var(--accent); border-color: var(--accent); }
.meter { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--mine); border-radius: 99px; transition: width .3s; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--rec); border-color: var(--rec); background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.status { font-size: 13px; color: var(--muted); margin: 0; min-height: 1.2em; }
.recbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 5px 6px 5px 12px; border-radius: 999px; background: rgba(224,68,74,.92); color: #fff; font-weight: 800; font-size: 13px; white-space: nowrap; }
.recbar button { border: 0; border-radius: 999px; padding: 4px 10px; background: #fff; color: #16252C; font-weight: 800; font-size: 12px; }
body.exporting .transport, body.exporting .panel, body.exporting .cap-actions { pointer-events: none; opacity: .5; }

.foot { max-width: 1180px; margin: 18px auto 0; font-size: 13px; color: var(--muted); }

/* ---------- Scene animation ---------- */
.char .mouth { transform-box: fill-box; transform-origin: center; }
.char.talking .bob { animation: bob .42s ease-in-out infinite; }
.char.talking .mouth { animation: talk .2s ease-in-out infinite alternate; }
.char .spot { opacity: 0; transition: opacity .2s; }
.char.myturn .spot { opacity: .9; }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes talk { from { transform: scaleY(1); } to { transform: scaleY(3.2); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes pulse { 50% { transform: scale(1.06); } }
.stage video.kenburns { animation: kenburns 9s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
@media (prefers-reduced-motion: reduce) {
  .char.talking .bob, .char.talking .mouth, .onair.live i, .turn.waiting .done-btn, .stage video.kenburns { animation: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 data-i18n="title">A.i 더빙동영상</h1>
    <p data-i18n="sub">상대 대사는 들리고, 내 대사 차례엔 소리가 꺼져요</p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-ko" data-lang="ko">KO</button>
    <button type="button" id="lang-en" data-lang="en">EN</button>
  </div>
</header>

<main class="grid">
  <section class="stage-col">
    <div class="stage">
      <svg id="scene" viewBox="0 0 640 360" role="img" aria-label="Scene"></svg>
      <video id="vid" muted playsinline preload="auto" hidden></video>
      <div class="ai-badge" id="ai-badge" hidden>AI VIDEO · HIGGSFIELD</div>
      <div class="recbar" id="recbar" hidden><span>● <span data-i18n="exporting">더빙 영상 만드는 중</span></span><button type="button" id="btn-export-cancel" data-i18n="cancel">취소</button></div>
      <canvas id="export-canvas" width="960" height="540" hidden></canvas>
      <div class="onair" id="onair"><i></i>REC</div>
      <div class="tc" id="tc">00:00.0</div>
      <div class="turn" id="turn" hidden>
        <div class="turn-head">
          <strong id="turn-label"></strong>
          <button type="button" class="done-btn" id="turn-done" data-i18n="done">다 말했어요</button>
        </div>
        <div class="bar"><span id="turn-bar"></span></div>
      </div>
      <div class="finish" id="finish" hidden>
        <h2 data-i18n="finishTitle">더빙 완료!</h2>
        <p id="finish-body"></p>
        <div class="row">
          <button type="button" id="finish-again" data-i18n="again">다시 하기</button>
          <button type="button" class="ghost" id="finish-role" data-i18n="changeRole">역할 바꾸기</button>
        </div>
      </div>
    </div>

    <div class="caption" id="caption" aria-live="polite">
      <div class="cap-who" id="cap-who"></div>
      <p class="cap-en" id="cap-en"></p>
      <p class="cap-ko" id="cap-ko"></p>
      <div class="cap-actions" id="cap-actions" hidden>
        <button type="button" class="chip-btn solid" id="btn-rec"><i class="dot"></i><span id="btn-rec-label"></span></button>
        <button type="button" class="chip-btn" id="btn-myplay" data-i18n="myVoice">내 목소리</button>
      </div>
    </div>

    <div class="transport">
      <button type="button" class="tbtn" id="btn-restart" data-i18n-aria="restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button type="button" class="tbtn" id="btn-prev" data-i18n-aria="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
      <button type="button" class="tbtn play" id="btn-play"></button>
      <button type="button" class="tbtn" id="btn-next" data-i18n-aria="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button type="button" class="tbtn" id="btn-repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><span data-i18n="repeat">이 대사 다시</span></button>
      <span class="counter" id="counter"></span>
    </div>
    <p class="notice" id="notice" hidden></p>
  </section>

  <aside class="panel">
    <div class="card">
      <div class="field">
        <span class="label" data-i18n="episode">에피소드</span>
        <div class="seg" id="seg-ep"></div>
        <p class="help" id="ep-help"></p>
      </div>
      <div class="field">
        <span class="label" data-i18n="role">내 역할</span>
        <div class="seg roles" id="seg-role"></div>
        <div class="row">
          <button type="button" class="btn" id="btn-rotate" data-i18n="rotate">↻ 역할 돌아가며 바꾸기</button>
        </div>
        <p class="help" data-i18n="roleHelp"></p>
      </div>
      <div class="field">
        <span class="label" data-i18n="mode">모드</span>
        <div class="seg" id="seg-mode"></div>
        <p class="help" id="mode-help"></p>
      </div>
      <div class="field">
        <span class="label" data-i18n="speed">속도</span>
        <div class="seg" id="seg-speed"></div>
      </div>
      <div class="field">
        <span class="label" data-i18n="options">옵션</span>
        <div class="checks">
          <label><input type="checkbox" id="opt-bgm"><span data-i18n="bgm">배경음악</span></label>
          <label><input type="checkbox" id="opt-ko"><span data-i18n="subKo">한국어 해석 보기</span></label>
          <label><input type="checkbox" id="opt-hide"><span data-i18n="hideMine">내 대사 가리기 (암기 연습)</span></label>
          <label><input type="checkbox" id="opt-echo"><span data-i18n="echo">연습 모드: 내 대사 듣고 따라 말하기</span></label>
          <label><input type="checkbox" id="opt-auto"><span data-i18n="autoNext">내 차례 시간이 끝나면 자동으로 넘기기</span></label>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="cue-head">
        <h2 data-i18n="recTitle">내 녹음</h2>
        <span id="rec-count"></span>
      </div>
      <div class="meter"><span id="rec-fill"></span></div>
      <p class="help" data-i18n="recHelp"></p>
      <div class="row">
        <button type="button" class="btn primary" id="btn-review" data-i18n="reviewPlay">내 더빙 감상</button>
        <button type="button" class="btn" id="btn-export" data-i18n="exportVideo" hidden>더빙 영상 저장</button>
        <button type="button" class="btn danger" id="btn-clear" data-i18n="clearAll">녹음 지우기</button>
      </div>
      <div class="row" id="clear-confirm" hidden>
        <span class="status" data-i18n="clearAsk"></span>
        <button type="button" class="btn danger" id="btn-clear-yes" data-i18n="clearYes">지우기</button>
        <button type="button" class="btn" id="btn-clear-no" data-i18n="cancel">취소</button>
      </div>
      <p class="status" id="rec-status" aria-live="polite"></p>
    </div>

    <div class="card">
      <div class="cue-head">
        <h2 data-i18n="cueSheet">대본</h2>
        <span id="cue-meta"></span>
      </div>
      <ol class="cues" id="cues"></ol>
    </div>
  </aside>
</main>

<p class="foot" data-i18n="sample">모든 캐릭터와 대본은 자체 제작입니다.</p>

<script>
/* =========================================================
   1. DATA — 캐릭터 & 에피소드 (오리지널 콘텐츠)
   ========================================================= */

/* =========================================================
   3. STATE — 설정 저장(브라우저별)
   ========================================================= */
const STORE_KEY = 'dubstudio.v1';
const state = {
  lang: 'ko', ep: 0, roles: new Set(['kiki']), mode: 'practice', speed: 0.85,
  subKo: true, hideMine: false, echo: true, autoNext: true, bgm: true,
  idx: 0, playing: false, single: false, finished: false,
};
(function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!p) throw 0; // 저장값 없음 → 아래 사이트 언어만 본다
    for (const k of ['lang', 'ep', 'mode', 'speed', 'subKo', 'hideMine', 'echo', 'autoNext', 'bgm']) if (k in p) state[k] = p[k];
    if (Array.isArray(p.roles) && p.roles.length) state.roles = new Set(p.roles.filter((r) => r in CAST));
    if (!EPISODES[state.ep]) state.ep = 0;
  } catch (e) { /* 저장소 없음: 기본값 사용 */ }
  try { const g = localStorage.getItem('mangoi_lang'); if (g === 'ko' || g === 'en') state.lang = g; } catch (e) { /* 무시 */ }
  const qi = epFromQuery(location.search); // 주소로 고른 편이 저장값을 이긴다
  if (qi >= 0) state.ep = qi;
})();
/* 🔗 ?ep=<id> 로 열면 그 편으로 시작한다(2026-10-20 — A.i영화더빙 화면의 «키키와 토토» 카드가 이 주소로 보낸다).
   모르는 id·이상한 글자는 무시(-1) → 저장된 편·첫 편 그대로. */
function epFromQuery(search) {
  const m = /[?&]ep=([A-Za-z0-9_-]{1,24})(?:[&#]|$)/.exec(String(search || ''));
  if (!m) return -1;
  const id = m[1].toLowerCase();
  return EPISODES.findIndex((e) => e.id === id);
}
function savePrefs() {
  try {
    const { lang, ep, mode, speed, subKo, hideMine, echo, autoNext, bgm } = state;
    localStorage.setItem(STORE_KEY, JSON.stringify({ lang, ep, mode, speed, subKo, hideMine, echo, autoNext, bgm, roles: [...state.roles] }));
  } catch (e) { /* 무시 */ }
}

const t = (k) => T[state.lang][k];
/* 다른 에피소드로 바꿨을 때 등장하지 않는 역할은 빼고, 비면 첫 캐릭터를 맡김 */
function fitRoles() {
  const ids = castOf(EPISODES[state.ep]);
  state.roles = new Set([...state.roles].filter((r) => ids.includes(r)));
  if (!state.roles.size) state.roles.add(ids[0]);
}
fitRoles();
const episode = () => EPISODES[state.ep];
const lines = () => episode().lines;

/* 에피소드 미디어 경로 (영상 클립 + 캐릭터 음성). media가 없으면 SVG + 브라우저 음성으로 대체 */
const pad2 = (n) => String(n).padStart(2, '0');
const mediaFor = (i) => {
  const ep = episode(), base = ep.media;
  if (!base) return null;
  const hasClip = !ep.clipLines || ep.clipLines.includes(i + 1); // clipLines: 영상이 있는 대사 번호(1부터)
  return { clip: hasClip ? `${base}${pad2(i + 1)}.mp4` : null, voice: `${base}${pad2(i + 1)}.mp3` };
};
const posterFor = (ep) => (ep.media ? `${ep.media}key.jpg` : '');
/* 대사별 정지 장면 그림 (없으면 에피소드 대표 그림) */
const stillFor = (i) => lines()[i]?.still || posterFor(episode());

/* 음성 파일 미리 불러오기 (에피소드별 캐시) */
const audioCache = new Map();
function audioFor(i) {
  const m = mediaFor(i);
  if (!m) return null;
  if (!audioCache.has(m.voice)) {
    const a = new Audio(m.voice);
    a.preload = 'auto';
    a.addEventListener('loadedmetadata', refreshTimecodesSoon); // 실제 길이로 타임코드 갱신
    audioCache.set(m.voice, a);
  }
  return audioCache.get(m.voice);
}

let tcTimer = null;
function refreshTimecodesSoon() {
  clearTimeout(tcTimer);
  tcTimer = setTimeout(() => {
    const starts = cueStarts();
    document.querySelectorAll('#cues .cue-tc').forEach((el, i) => { el.textContent = fmtTC(starts[i]); });
    $('tc').textContent = fmtTC(starts[state.idx]);
  }, 150);
}

/* 대사 길이(초, 속도 1.0 기준): 음성 파일이 있으면 실제 길이, 없으면 단어 수로 추정 */
const estSec = (line) => 0.9 + line.en.split(/\s+/).length * 0.38;
const lineSec = (line, i) => {
  const d = audioFor(i)?.duration;

};

function cueStarts() {
  let acc = 0;
  return lines().map((l, i) => { const s = acc; acc += lineSec(l, i) + 0.4; return s; });
}
function fmtTC(sec) {

}
/* 암기 연습용 힌트: 단어 첫 글자만 보여주기 */

/* 영상 클립: 대사가 진행되는 동안 반복 재생, 끝나면 멈춤 */

  if (!m) return;

  vid.poster = stillFor(i);
  if (!m.clip) { // 영상이 없는 대사: 그림을 천천히 확대(켄 번스 효과)

  vid.classList.remove('kenburns');
  if (!vid.src.endsWith(m.clip)) vid.src = m.clip;

  vid.playbackRate = state.speed;

  else vid.pause();
}

function setTalking(who, myTurn = false) {

const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voices = [];
let currentUtterance = null; // GC로 onend가 사라지는 브라우저 버그 방지용 참조
function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  const en = all.filter((v) => /^en[-_]/i.test(v.lang));
  const us = en.filter((v) => /US/i.test(v.lang));
  voices = us.length >= 2 ? us : (en.length ? en : all);
}
if (synth) { loadVoices(); synth.addEventListener?.('voiceschanged', loadVoices); }
function voiceFor(who) {
  if (!voices.length) return null;
  return voices[Object.keys(CAST).indexOf(who) % voices.length];
}

/* =========================================================
   6. RECORDINGS — 학생 녹음 (기기 녹음 앱/파일 → 이 기기 IndexedDB 저장)
   ========================================================= */
const recs = new Map(); // "에피소드:대사번호" → { blob, url, audio }
const recKey = (i) => `${episode().id}:${i}`;
const recFor = (i) => recs.get(recKey(i));

let dbPromise = null;
function openDB() {
  dbPromise ??= new Promise((resolve) => {
    try {
      const req = indexedDB.open('dubstudio', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('recs');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
  return dbPromise;
}
async function dbWrite(fn) {
  const db = await openDB();
  if (!db) return;
  try { fn(db.transaction('recs', 'readwrite').objectStore('recs')); } catch (e) { /* 저장 불가: 메모리에만 유지 */ }
}
async function loadRecs() {
  const db = await openDB();
  if (!db) return;
  try {
    const store = db.transaction('recs', 'readonly').objectStore('recs');
    const keys = store.getAllKeys(), vals = store.getAll();
    vals.onsuccess = () => { keys.result.forEach((k, j) => setRec(k, vals.result[j])); renderRecUI(); renderCues(); };
  } catch (e) { /* 무시 */ }
}

function setRec(key, blob) {
  const old = recs.get(key);
  if (old) URL.revokeObjectURL(old.url);
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.preload = 'auto';
  recs.set(key, { blob, url, audio });
}
function deleteRec(key) {
  const r = recs.get(key);
  if (!r) return;
  r.audio.pause();
  URL.revokeObjectURL(r.url);
  recs.delete(key);
  dbWrite((s) => s.delete(key));
}
function canPlay(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    const done = (ok) => { URL.revokeObjectURL(url); resolve(ok); };
    a.onloadedmetadata = () => done(true);
    a.onerror = () => done(false);
    setTimeout(() => done(true), 4000);
  });
}

// Each session owns its destination key, including while permission is pending.
let micSession = null;
function recordingLabel(i) {
  if (micSession && micSession.key === recKey(i)) {
    return t(micSession.recorder ? 'stopRecording' : 'micWaiting');
  }
  return t(recFor(i) ? 'reRecord' : 'record');
}
function stopMicRecording(discard = false) {
  const session = micSession;
  if (!session) return;
  session.discard = session.discard || discard;
  if (!session.stopping && session.recorder && session.recorder.state !== 'inactive') {
    session.stopping = true;
    session.recorder.stop();
  } else if (!session.recorder) micSession = null;
  if (discard) micSession = null;
  if (session.stream) session.stream.getTracks().forEach(track => track.stop());
}
async function pickRecording(i) {
  if (micSession) { stopMicRecording(); renderRecUI(); renderCues(); return; }
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    setStatus(t('micUnsupported')); return;
  }
  pause();
  state.idx = i;
  const session = { key: recKey(i), recorder: null, stream: null, discard: false };
  micSession = session;
  setStatus(t('micWaiting')); renderCurrent(); renderCues();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (micSession !== session || session.discard) {
      stream.getTracks().forEach(track => track.stop()); return;
    }
    session.stream = stream;
    const recorder = new MediaRecorder(stream);
    session.recorder = recorder;
    const chunks = [];
    recorder.ondataavailable = event => { if (event.data?.size) chunks.push(event.data); };
    recorder.onerror = () => {
      session.discard = true;
      stopMicRecording();
      if (micSession === session) micSession = null;
      setStatus(t('micFailed')); renderRecUI(); renderCues();
    };
    recorder.onstop = () => {
      stream.getTracks().forEach(track => track.stop());
      if (micSession === session) micSession = null;
      if (!session.discard) {
        const blob = new Blob(chunks, { type: recorder.mimeType || chunks[0]?.type || 'audio/webm' });
        if (blob.size) {
          setRec(session.key, blob);
          dbWrite(store => store.put(blob, session.key));
          setStatus(t('recSaved'));
        } else setStatus(t('micFailed'));
      }
      renderRecUI(); renderCues();
    };
    recorder.start();
    setStatus(t('micRecording')); renderRecUI(); renderCues();
  } catch (error) {
    if (session.stream) session.stream.getTracks().forEach(track => track.stop());
    if (micSession !== session) return;
    micSession = null;
    setStatus(t(error.name === 'NotAllowedError' ? 'micDenied' : error.name === 'NotFoundError' ? 'micMissing' : 'micFailed'));
    renderRecUI(); renderCues();
  }
}
window.addEventListener('pagehide', () => stopMicRecording(true));
function playMyVoice(i) {
  stopMicRecording();
  const r = recFor(i);
  if (!r) return;
  pause();
  r.audio.currentTime = 0;
  r.audio.playbackRate = 1;
  r.audio.play().catch(() => setStatus(t('recBad')));
}
function setStatus(msg) { $('rec-status').textContent = msg; }

/* =========================================================
   7. MUSIC — 자체 작곡 배경음악 (브라우저에서 실시간 연주, 저작권 없음)
   I–vi–IV–V 코드 진행 + 아르페지오 + 베이스 + 셰이커. 대사 중엔 볼륨을 낮춤(덕킹)
   ========================================================= */
const MIX = { ctx: null, bus: null }; // 모든 소리가 모이는 곳 (영상 저장 시 녹음 대상)
function audioCtx() {
  if (!MIX.ctx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    MIX.ctx = new Ctx();
    MIX.bus = MIX.ctx.createGain();
    MIX.bus.connect(MIX.ctx.destination);
  }
  return MIX.ctx;
}

const CHORDS = [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]]; // I, vi, IV, V
const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
const VOL = { full: 0.09, ducked: 0.035 };
const bgm = { gain: null, timer: 0, next: 0, step: 0, noise: null };
const midiHz = (m) => 440 * 2 ** ((m - 69) / 12);

function note(time, midi, vol, type, dur) {
  const ctx = MIX.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = midiHz(midi);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g).connect(bgm.gain);
  o.start(time); o.stop(time + dur + 0.05);
}
function shaker(time) {
  const ctx = MIX.ctx;
  if (!bgm.noise) {
    bgm.noise = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = bgm.noise.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
  }
  const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  s.buffer = bgm.noise; f.type = 'highpass'; f.frequency.value = 6000; g.gain.value = 0.25;
  s.connect(f).connect(g).connect(bgm.gain);
  s.start(time);
}
function playStep(step, time) {
  const { root } = episode().music;
  const chord = CHORDS[Math.floor(step / 8) % 4];
  const tones = [...chord, chord[0] + 12];
  note(time, root + tones[ARP[step % 8]], 0.5, 'triangle', 0.32);
  if (step % 4 === 0) note(time, root - 24 + chord[0], 0.7, 'sine', 0.6);
  if (step % 2 === 1) shaker(time);
}
function startMusic() {
  if (!state.bgm || !episode().music || bgm.timer) return;
  const ctx = audioCtx();
  if (!ctx) return;
  ctx.resume();
  if (!bgm.gain) { bgm.gain = ctx.createGain(); bgm.gain.connect(MIX.bus); }
  bgm.gain.gain.cancelScheduledValues(ctx.currentTime);
  bgm.gain.gain.setTargetAtTime(VOL.ducked, ctx.currentTime, 0.3);
  bgm.next = ctx.currentTime + 0.1; bgm.step = 0;
  const spb = () => 60 / episode().music.bpm / 2; // 8분음표 길이
  bgm.timer = setInterval(() => {
    while (bgm.next < ctx.currentTime + 0.3) { playStep(bgm.step++, bgm.next); bgm.next += spb(); }
  }, 80);
}
function stopMusic(fanfare = false) {
  if (!bgm.timer) return;
  clearInterval(bgm.timer); bgm.timer = 0;
  const ctx = MIX.ctx, t = ctx.currentTime;
  if (fanfare) {
    bgm.gain.gain.setTargetAtTime(VOL.full * 1.6, t, 0.05);
    const r = episode().music.root + 12;
    [0, 4, 7, 12].forEach((n, k) => note(t + k * 0.12, r + n, 0.6, 'triangle', 0.5));
  }
  bgm.gain.gain.setTargetAtTime(0.0001, t + (fanfare ? 0.8 : 0), 0.25);
}
function duck(on) {
  if (!bgm.timer) return;
  bgm.gain.gain.setTargetAtTime(on ? VOL.ducked : VOL.full, MIX.ctx.currentTime, 0.15);
}

/* =========================================================
   8. ENGINE — 재생 흐름 (연습 / 더빙 / 내 더빙)
   ========================================================= */
let runId = 0;       // 오래된 콜백 무효화용 토큰
let timers = [];
let turnDone = null; // "다 말했어요" 버튼 동작
const later = (fn, ms) => timers.push(setTimeout(fn, ms));

function stopAll() {
  runId++;
  timers.forEach(clearTimeout); timers = [];
  if (synth) synth.cancel();
  const silence = (a) => { a.pause(); a.onended = a.onerror = null; };
  audioCache.forEach(silence);
  recs.forEach((r) => silence(r.audio));
  pauseClip();
  setTalking(null);
  hideTurn();
}

/* 오디오 요소 한 번 재생 → 끝나면 fin, 실패하면 onFail */
function playAudioEl(a, sec, rate, run, fin, onFail) {
  routeToMixer(a);
  a.onended = fin;
  a.onerror = onFail;
  a.currentTime = 0;
  a.playbackRate = rate;
  a.preservesPitch = true;
  a.play().catch(onFail);
  later(fin, sec / rate * 2000 + 2500); // 재생 이벤트가 오지 않는 기기 대비 안전장치
}

/* 대사 소리 내기: 캐릭터 음성 파일 우선, 실패하면 브라우저 음성(TTS) */
function speak(line, i, run, done) {
  let finished = false;
  const fin = () => { if (finished || run !== runId) return; finished = true; done(); };
  const a = audioFor(i);
  if (!a) { speakTTS(line, run, fin); return; }
  const fallback = () => { if (!finished && run === runId) speakTTS(line, run, fin); };
  playAudioEl(a, lineSec(line, i), state.speed, run, fin, fallback);
}

/* 내 녹음 재생 (내 더빙 모드) */
function speakMine(line, i, run, done) {
  const r = recFor(i);
  let finished = false;
  const fin = () => { if (finished || run !== runId) return; finished = true; done(); };
  const d = r.audio.duration;
  playAudioEl(r.audio, Number.isFinite(d) ? d : estSec(line) * 2, 1, run, fin, fin);
}

function speakTTS(line, run, fin) {
  const ms = estSec(line) / state.speed * 1000;
  if (!synth) { later(fin, ms); return; }
  const u = new SpeechSynthesisUtterance(line.en);
  u.lang = 'en-US';
  const v = voiceFor(line.who); if (v) u.voice = v;
  u.pitch = CAST[line.who].pitch;
  u.rate = 0.95 * state.speed;
  u.onend = fin; u.onerror = fin;
  currentUtterance = u;
  later(fin, ms * 2.5 + 1500); // onend가 오지 않는 기기 대비 안전장치
  synth.speak(u);
}

function startTurn(line, i, run, kind, done) {
  setTalking(line.who, true);
  showClip(i, true); // 내가 말하는 동안 캐릭터 입이 움직임 (소리는 없음)
  $('onair').classList.add('live');
  const box = $('turn');
  box.hidden = false;
  box.classList.toggle('echo', kind === 'echo');
  box.classList.remove('waiting');
  $('turn-label').textContent = kind === 'echo' ? t('echoTurn') : t('yourTurn');
  const bar = $('turn-bar');
  const sec = turnSec(line, i);
  bar.style.transition = 'none'; bar.style.width = '0';
  void bar.offsetWidth; // 리플로우로 애니메이션 초기화
  bar.style.transition = `width ${sec}s linear`; bar.style.width = '100%';
  const finish = () => { if (run !== runId) return; hideTurn(); pauseClip(); setTalking(null); done(); };
  turnDone = finish;
  later(() => { if (state.autoNext || exp.active) finish(); else box.classList.add('waiting'); }, sec * 1000);
}
function hideTurn() {
  $('turn').hidden = true;
  $('onair').classList.remove('live');
  turnDone = null;
}

function runLine(i) {
  stopAll();
  const run = runId;
  state.idx = i;
  state.finished = false;
  $('finish').hidden = true;
  renderCurrent();
  duck(true);
  const line = lines()[i];
  const mine = isMine(line);
  const useMyVoice = mine && state.mode === 'review' && recFor(i);
  if (mine && !useMyVoice && state.mode !== 'practice') {
    startTurn(line, i, run, 'turn', () => advance(run)); // 더빙 / 녹음 없는 내 더빙: 음소거 차례
    return;
  }
  setTalking(line.who);
  showClip(i, true);
  (useMyVoice ? speakMine : speak)(line, i, run, () => {
    setTalking(null);
    pauseClip();
    if (state.mode === 'practice' && isMine(line) && state.echo) startTurn(line, i, run, 'echo', () => advance(run));
    else { duck(false); later(() => advance(run), 350); }
  });
}
function advance(run) {
  if (run !== runId || !state.playing) return;
  if (state.single) { state.single = false; pause(); return; }
  if (state.idx + 1 < lines().length) runLine(state.idx + 1);
  else finishEpisode();
}
function play() {
  stopMicRecording();
  if (!state.roles.size) return;
  if (state.finished) state.idx = 0;
  state.playing = true; state.single = false;
  startMusic();
  runLine(state.idx);
  renderTransport();
}
function pause() {
  state.playing = false;
  stopAll();
  stopMusic();
  if (exp.active) finishExport(false);
  renderTransport();
}
function jump(i, keepPlaying = state.playing) {
  stopMicRecording();
  const n = lines().length;
  state.idx = Math.max(0, Math.min(n - 1, i));
  state.finished = false;
  $('finish').hidden = true;
  if (keepPlaying) { state.playing = true; state.single = false; runLine(state.idx); }
  else { stopAll(); renderCurrent(); }
  renderTransport();
}
function repeatLine() {
  stopMicRecording();
  if (!state.roles.size) return;
  state.playing = true; state.single = true;
  runLine(state.idx);
  renderTransport();
}
function finishEpisode() {
  state.playing = false; state.finished = true;
  stopAll();
  stopMusic(true);
  const mineCount = lines().filter(isMine).length;
  $('finish-body').textContent = t('finishBody')(mineCount);
  $('finish').hidden = false;
  if (exp.active) setTimeout(() => finishExport(true), 600); // 마지막 소리 꼬리까지 담기
  renderTransport();
}

/* =========================================================
   9. EXPORT — 내 더빙 영상 저장 (화면+소리를 실시간 녹화)
   ========================================================= */
const exp = { active: false, dest: null, recorder: null, chunks: [], mime: '', raf: 0 };
/* mangoi.ai: 브라우저 내려받기(<a download>)로 저장한다 — 받은 파일은 기기의 다운로드 폴더로 간다. */
const downloads = {
  save({ filename, data }) {
    const u = URL.createObjectURL(data);
    const a = document.createElement('a');
    a.href = u; a.download = filename; a.style.display = 'none';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
    return Promise.resolve({ status: 'saved' });
  },
};

const routed = new WeakSet();
function routeToMixer(a) {
  if (!exp.active || routed.has(a)) return;
  try { MIX.ctx.createMediaElementSource(a).connect(MIX.bus); routed.add(a); } catch (e) { /* 이미 연결됨 */ }
}
const canExport = () => Boolean(downloads && episode().media && window.MediaRecorder &&
  HTMLCanvasElement.prototype.captureStream && (window.AudioContext || window.webkitAudioContext));
function pickMime() {
  const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return types.find((m) => MediaRecorder.isTypeSupported(m)) || '';
}

function startExport() {
  if (micSession) { setStatus(t('micRecording')); return; }
  if (!canExport()) { setStatus(t('exportFail')); return; }
  const ctx = audioCtx();
  ctx.resume();
  exp.dest = ctx.createMediaStreamDestination();
  MIX.bus.connect(exp.dest);
  exp.active = true; // routeToMixer가 연결하도록 먼저 켬
  lines().forEach((_, i) => { const a = audioFor(i); if (a) routeToMixer(a); const r = recFor(i); if (r) routeToMixer(r.audio); });

  const canvas = $('export-canvas');
  lines().forEach((_, i) => stillImage(stillFor(i))); // 장면 그림 미리 불러오기
  try {
    const stream = canvas.captureStream(30);
    exp.dest.stream.getAudioTracks().forEach((tk) => stream.addTrack(tk));
    const mime = pickMime();
    exp.recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    exp.mime = exp.recorder.mimeType || mime || 'video/webm';
  } catch (e) { exp.active = false; MIX.bus.disconnect(exp.dest); setStatus(t('exportFail')); return; }
  exp.chunks = [];
  exp.recorder.ondataavailable = (e) => { if (e.data.size) exp.chunks.push(e.data); };
  document.body.classList.add('exporting');
  $('recbar').hidden = false;
  setStatus('');
  drawFrame();
  exp.recorder.start(1000);
  state.mode = 'review'; savePrefs(); renderSettings();
  state.idx = 0; state.finished = false;
  play();
}

function drawFrame() {
  if (!exp.active) return;
  const canvas = $('export-canvas'), g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, vid = $('vid');
  const still = stillImage(stillFor(state.idx));
  if (vid.getAttribute('src') && vid.readyState >= 2) g.drawImage(vid, 0, 0, W, H);
  else if (still.complete && still.naturalWidth) g.drawImage(still, 0, 0, W, H);
  drawCaption(g, W, H);
  exp.raf = requestAnimationFrame(drawFrame);
}
const stills = new Map();
function stillImage(src) {
  if (!stills.has(src)) { const img = new Image(); img.src = src; stills.set(src, img); }
  return stills.get(src);
}
function drawCaption(g, W, H) {
  const line = lines()[state.idx];
  if (!line) return;
  const text = `${CAST[line.who].name.en}: ${line.en}`;
  let size = 30;
  g.font = `800 ${size}px MangoiHanSC, Nunito, sans-serif`;
  while (g.measureText(text).width > W - 80 && size > 16) { size -= 2; g.font = `800 ${size}px MangoiHanSC, Nunito, sans-serif`; }
  const w = g.measureText(text).width + 40, h = size + 24, x = (W - w) / 2, y = H - h - 20;
  g.fillStyle = 'rgba(10,16,19,.78)';
  g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, 14) : g.rect(x, y, w, h); g.fill();
  g.fillStyle = isMine(line) ? '#FFC857' : '#FFFFFF';
  g.textBaseline = 'middle';
  g.fillText(text, x + 20, y + h / 2 + 1);
}

function finishExport(save) {
  if (!exp.active) return;
  exp.active = false;
  cancelAnimationFrame(exp.raf);
  document.body.classList.remove('exporting');
  $('recbar').hidden = true;
  setTimeout(() => { try { MIX.bus.disconnect(exp.dest); } catch (e) { /* 무시 */ } }, 1500); // 팡파르 꼬리까지
  const rec = exp.recorder;
  rec.onstop = async () => {
    if (!save) { setStatus(t('exportCanceled')); return; }
    const blob = new Blob(exp.chunks, { type: exp.mime });
    const ext = exp.mime.includes('mp4') ? 'mp4' : 'webm';
    setStatus(t('exportReady'));
    try {
      await downloads.save({ filename: `dub-${episode().id}-${new Date().toISOString().slice(0, 10)}.${ext}`, data: blob });
      setStatus(t('exportSaved'));
    } catch (e) {
      setStatus(e?.code === 'declined' ? t('exportDeclined') : t('exportFail'));
    }
  };
  if (rec.state !== 'inactive') rec.stop();
}
function resetEpisode() {
  stopMicRecording(true);
  state.playing = false; state.finished = false; state.idx = 0;
  stopAll();
  stopMusic();
  $('finish').hidden = true;
}

/* =========================================================
   10. RENDER — 화면 갱신
   ========================================================= */
function segButtons(el, items, isOn, onPick) {
  el.innerHTML = '';
  items.forEach((it) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it.label;
    b.setAttribute('aria-pressed', String(isOn(it.value)));
    b.addEventListener('click', () => onPick(it.value));
    el.appendChild(b);
  });
}

function renderStatic() {
  document.documentElement.lang = state.lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
    el.setAttribute('aria-label', t(el.dataset.i18nAria)); el.title = t(el.dataset.i18nAria);
  });
  $('lang-ko').setAttribute('aria-pressed', String(state.lang === 'ko'));
  $('lang-en').setAttribute('aria-pressed', String(state.lang === 'en'));
}

function renderSettings() {
  segButtons($('seg-ep'), EPISODES.map((e, i) => ({ label: `Lv.${e.level} · ${e.title[state.lang]}`, value: i })),
    (v) => v === state.ep, (v) => { state.ep = v; fitRoles(); resetEpisode(); savePrefs(); renderAll(); });
  $('ep-help').textContent = `${t('series')} ${state.ep + 1} · ${episode().desc[state.lang]}`;

  segButtons($('seg-role'), castOf(episode()).map((id) => ({ label: CAST[id].name[state.lang], value: id })),
    (v) => state.roles.has(v),
    (v) => { state.roles.has(v) ? state.roles.delete(v) : state.roles.add(v); resetEpisode(); savePrefs(); renderAll(); });

  segButtons($('seg-mode'), ['practice', 'dub', 'review'].map((m) => ({ label: t(m), value: m })),
    (v) => v === state.mode, (v) => { state.mode = v; resetEpisode(); savePrefs(); renderAll(); });
  $('mode-help').textContent = t({ practice: 'helpPractice', dub: 'helpDub', review: 'helpReview' }[state.mode]);

  segButtons($('seg-speed'), [0.7, 0.85, 1].map((s) => ({ label: `${s}×`, value: s })),
    (v) => v === state.speed, (v) => { state.speed = v; savePrefs(); renderSettings(); });

  $('opt-bgm').checked = state.bgm;
  $('opt-ko').checked = state.subKo;
  $('opt-hide').checked = state.hideMine;
  $('opt-echo').checked = state.echo;
  $('opt-auto').checked = state.autoNext;
}

function lineText(line) {
  return isMine(line) && state.hideMine ? hint(line.en) : line.en;
}

function renderCues() {
  const starts = cueStarts();
  const list = $('cues');
  list.innerHTML = '';
  lines().forEach((line, i) => {
    const li = document.createElement('li');
    li.className = 'cue' + (isMine(line) ? ' mine' : '') + (i === state.idx ? ' now' : '');
    li.tabIndex = 0;
    const who = CAST[line.who].name[state.lang];
    li.innerHTML = `
      <span class="cue-tc">${fmtTC(starts[i])}</span>
      <span class="cue-who">${who}${isMine(line) ? ` <span class="tag">${t('myLine')}</span>` : ''}</span>
      <span class="cue-en"></span>
      ${state.subKo ? '<span class="cue-ko"></span>' : ''}`;
    li.querySelector('.cue-en').textContent = lineText(line);
    if (state.subKo) li.querySelector('.cue-ko').textContent = line.ko;
    if (isMine(line)) li.appendChild(cueRecButtons(i));
    li.addEventListener('click', () => jump(i));
    li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(i); } });
    list.appendChild(li);
  });
  const mine = lines().filter(isMine).length;
  $('cue-meta').textContent = t('lines')(lines().length, mine);
}

function cueRecButtons(i) {
  const box = document.createElement('div');
  box.className = 'cue-rec';
  const has = Boolean(recFor(i));
  const add = (label, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
    b.disabled = Boolean(micSession && micSession.key !== recKey(i));
    b.addEventListener('click', (e) => { e.stopPropagation(); fn(); });
    box.appendChild(b);
  };
  add((has ? '● ' : '🎤 ') + recordingLabel(i), has ? 'has' : '', () => pickRecording(i));
  if (has) add('▶ ' + t('myVoice'), 'has', () => playMyVoice(i));
  return box;
}

function renderRecUI() {
  const mineIdx = lines().map((l, i) => (isMine(l) ? i : -1)).filter((i) => i >= 0);
  const done = mineIdx.filter((i) => recFor(i)).length;
  $('rec-count').textContent = t('recCount')(done, mineIdx.length);
  $('rec-fill').style.width = mineIdx.length ? `${(done / mineIdx.length) * 100}%` : '0';
  $('btn-export').hidden = !canExport();
  $('btn-export').disabled = done === 0;
  $('btn-clear').disabled = done === 0;
  const line = lines()[state.idx];
  const showCap = Boolean(line && isMine(line));
  $('cap-actions').hidden = !showCap;
  if (showCap) {
    const has = Boolean(recFor(state.idx));
    $('btn-rec-label').textContent = recordingLabel(state.idx);
    $('btn-rec').disabled = Boolean(micSession && micSession.key !== recKey(state.idx));
    $('btn-myplay').hidden = !has;
  }
}

function renderCurrent() {
  const line = lines()[state.idx];
  const mine = isMine(line);
  const cap = $('caption');
  cap.classList.toggle('mine', mine);
  $('cap-who').innerHTML = '';
  $('cap-who').append(CAST[line.who].name[state.lang]);
  if (mine) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = t('myLine'); $('cap-who').append(tag); }
  $('cap-en').textContent = lineText(line);
  $('cap-ko').textContent = state.subKo ? line.ko : '';
  $('cap-ko').hidden = !state.subKo;
  $('tc').textContent = fmtTC(cueStarts()[state.idx]);
  if (!state.playing) showClip(state.idx, false);
  renderRecUI();

  const items = $('cues').children;
  [...items].forEach((li, i) => li.classList.toggle('now', i === state.idx));
  const list = $('cues'), cur = items[state.idx];
  if (cur && list.scrollHeight > list.clientHeight) {
    const top = cur.offsetTop - list.offsetTop;
    if (top < list.scrollTop || top + cur.offsetHeight > list.scrollTop + list.clientHeight) {
      list.scrollTo({ top: top - list.clientHeight / 3, behavior: 'smooth' });
    }
  }
  renderTransport();
}

const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
function renderTransport() {
  const noRole = !state.roles.size;
  const btn = $('btn-play');
  btn.innerHTML = (state.playing ? ICON_PAUSE : ICON_PLAY) + `<span>${state.playing ? t('pause') : t('play')}</span>`;
  btn.disabled = noRole;
  $('btn-repeat').disabled = noRole;
  $('btn-prev').disabled = state.idx === 0;
  $('btn-next').disabled = state.idx >= lines().length - 1;
  $('counter').textContent = `${state.idx + 1} / ${lines().length}`;
  const notice = $('notice');
  const msg = noRole ? t('pickRole') : (!synth ? t('noVoice') : '');
  notice.textContent = msg;
  notice.hidden = !msg;
}

function renderAll() {
  renderStatic();
  renderSettings();
  renderScene();
  renderCues();
  renderCurrent();
}

/* =========================================================
   11. EVENTS
   ========================================================= */
/* 영상을 못 불러오면 그림 무대로 대체 */
$('vid').addEventListener('error', () => {
  if (!$('vid').getAttribute('src')) return; // 정지 그림 장면은 오류 아님
  $('vid').hidden = true; $('ai-badge').hidden = true; $('scene').hidden = false;
});

/* 역할 돌아가며 바꾸기: 고른 역할마다 이 에피소드의 다음 캐릭터로 이동 (예: 키키 → 토토 → 엄마 → 룰루 → 키키) */
$('btn-rotate').addEventListener('click', () => {
  const ids = castOf(episode());
  const mine = [...state.roles].filter((r) => ids.includes(r));
  state.roles = new Set(mine.length ? mine.map((r) => ids[(ids.indexOf(r) + 1) % ids.length]) : [ids[0]]);
  resetEpisode(); savePrefs(); renderAll();
});

/* 녹음 */
$('btn-rec').addEventListener('click', () => pickRecording(state.idx));
$('btn-myplay').addEventListener('click', () => playMyVoice(state.idx));
$('btn-review').addEventListener('click', () => {
  state.mode = 'review'; savePrefs(); renderSettings();
  state.idx = 0; state.finished = false; play();
});
$('btn-export').addEventListener('click', startExport);
$('btn-export-cancel').addEventListener('click', pause);
$('btn-clear').addEventListener('click', () => { $('clear-confirm').hidden = false; });
$('btn-clear-no').addEventListener('click', () => { $('clear-confirm').hidden = true; });
$('btn-clear-yes').addEventListener('click', () => {
  stopMicRecording(true);
  lines().forEach((_, i) => deleteRec(recKey(i)));
  $('clear-confirm').hidden = true;
  setStatus(t('cleared'));
  renderRecUI(); renderCues(); renderCurrent();
});

document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
  state.lang = b.dataset.lang; savePrefs();
  try { localStorage.setItem('mangoi_lang', state.lang); } catch (e) { /* 무시 */ }
  renderAll();
}));
$('btn-play').addEventListener('click', () => (state.playing ? pause() : play()));
$('btn-prev').addEventListener('click', () => jump(state.idx - 1));
$('btn-next').addEventListener('click', () => jump(state.idx + 1));
$('btn-restart').addEventListener('click', () => { jump(0, false); play(); });
$('btn-repeat').addEventListener('click', repeatLine);
$('turn-done').addEventListener('click', () => turnDone && turnDone());
$('finish-again').addEventListener('click', () => { state.idx = 0; play(); });
$('finish-role').addEventListener('click', () => { resetEpisode(); renderAll(); $('seg-role').querySelector('button')?.focus(); });

const bindCheck = (id, key, rerender) => $(id).addEventListener('change', (e) => {
  state[key] = e.target.checked; savePrefs(); if (rerender) { renderCues(); renderCurrent(); }
});
bindCheck('opt-ko', 'subKo', true);
bindCheck('opt-bgm', 'bgm', false);
$('opt-bgm').addEventListener('change', () => { if (state.bgm && state.playing) startMusic(); else if (!state.bgm) stopMusic(); });
bindCheck('opt-hide', 'hideMine', true);
bindCheck('opt-echo', 'echo', false);
bindCheck('opt-auto', 'autoNext', false);

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, button, .cue')) return;
  if (e.code === 'Space') { e.preventDefault(); state.playing ? pause() : play(); }
  if (e.key === 'ArrowRight') jump(state.idx + 1);
  if (e.key === 'ArrowLeft') jump(state.idx - 1);
});
