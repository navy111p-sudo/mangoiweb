<!doctype html>
<html lang="ko">
<head>




  <meta charset="utf-8" />
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>💬 AI 영어 친구 Mango — Mangoi</title>
  <link rel="icon" href="/mangoi-favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0a1530" />
  <script src="/js/mango-i18n.js" defer></script>
<script src="/js/session-guard.js" defer></script>
  <style>
    :root {
      --bg: #0a1530; --card: #14213b; --text: #e6ecff; --text2: #a3b3d1;
      --gold: #fbbf24; --green: #10b981; --border: rgba(251,191,36,0.18);
      --bubble-me: linear-gradient(135deg, #fbbf24, #f59e0b);
      --bubble-ai: #1e293b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background:radial-gradient(125% 100% at 50% -8%,#2a4d9e 0%,#1a2f6b 42%,#122350 100%); color: var(--text);
      font-family: MangoiHanSC,-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      line-height: 1.5; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    .top { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: rgba(20, 33, 59, 0.95); position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .top a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; }
    .top .mango-icon { width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      overflow: hidden; }
    .top .mango-icon img { width: 100%; height: 100%; object-fit: cover; }
    .top .info { flex: 1; }
    .top .name { font-size: 14px; font-weight: 800; }
    .top .status { font-size: 11px; color: var(--green); }
    .top .clear-btn { background: rgba(239,68,68,0.15); color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3); padding: 6px 10px;
      border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .opts { display: flex; gap: 6px; padding: 8px 14px; background: rgba(20,33,59,0.6);
      overflow-x: auto; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .opt { padding: 6px 12px; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 999px; cursor: pointer; font-size: 11.5px;
      font-weight: 700; white-space: nowrap; }
    .opt.active { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #1a1a1a; border-color: var(--gold); }

    /* ══ 🎮 게임 HUD: 레벨·XP·스트릭·오늘의 단어·퀘스트 ══ */
    .hud { display: flex; gap: 8px; align-items: center; padding: 8px 14px;
      background: rgba(10,21,48,0.55); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .hud::-webkit-scrollbar { display: none; }
    .hud-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
      background: var(--card); border: 1px solid var(--border); border-radius: 999px;
      font-size: 11.5px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .hud-lv { border-color: rgba(251,191,36,0.45); background: linear-gradient(135deg, rgba(251,191,36,0.16), rgba(245,158,11,0.08)); }
    .hud-lv .xp-track { width: 54px; height: 7px; border-radius: 99px; background: rgba(255,255,255,0.12); overflow: hidden; display: inline-block; }
    .hud-lv .xp-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #fbbf24, #f97316);
      width: 0%; transition: width .8s cubic-bezier(.22,1.4,.36,1); display: block; }
    .hud-streak { color: #fda4af; border-color: rgba(251,113,133,0.4); }
    .hud-pts { color: var(--gold); }
    .hud-wod { border-color: rgba(96,165,250,0.45); background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(37,99,235,0.08));
      cursor: pointer; transition: transform .15s; }
    .hud-wod:hover { transform: scale(1.04); }
    .hud-wod .wod-en { color: #93c5fd; font-weight: 900; }
    .hud-wod .wod-ko { color: var(--text2); font-weight: 600; font-size: 10.5px; }
    .hud-wod.done { border-color: rgba(52,211,153,0.55); background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(5,150,105,0.08)); }
    .hud-wod.done .wod-en { color: #6ee7b7; }
    .quests { display: flex; gap: 6px; align-items: center; padding: 6px 14px 8px;
      background: rgba(10,21,48,0.55); border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0; }
    .quests::-webkit-scrollbar { display: none; }
    .q-label { font-size: 10.5px; color: var(--text2); font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .quest { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 999px; font-size: 10.5px; font-weight: 800; white-space: nowrap; flex-shrink: 0;
      background: rgba(255,255,255,0.06); border: 1px dashed rgba(163,179,209,0.4); color: var(--text2); }
    .quest.done { background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(5,150,105,0.12));
      border: 1px solid rgba(52,211,153,0.6); color: #6ee7b7; }
    .quest .q-prog { color: var(--gold); }
    .quest.done .q-prog { color: #6ee7b7; }

    /* 🗺 지금 이야기 중인 주제 — 고른 주제가 대화 내내 보이고 유지된다 (2026-07-29 학생 제보) */
    /* 대화창이 좁은 폰에서 한 줄을 더 뺏지 않도록 최대한 얇게 (모바일 실측 26px) */
    .topicbar { display: flex; gap: 7px; align-items: center; padding: 3px 14px 4px;
      background: rgba(10,21,48,0.55); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .tb-label { font-size: 10.5px; color: var(--text2); font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .tb-name { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 900; white-space: nowrap; color: #fde68a;
      overflow: hidden; text-overflow: ellipsis; min-width: 0;
      background: linear-gradient(135deg, rgba(251,191,36,0.22), rgba(245,158,11,0.10));
      border: 1px solid rgba(251,191,36,0.55); }
    .tb-change { margin-left: auto; padding: 2px 10px; border-radius: 999px; cursor: pointer;
      font-size: 10.5px; font-weight: 800; white-space: nowrap; flex-shrink: 0; color: var(--text2);
      background: rgba(255,255,255,0.06); border: 1px solid var(--border); }
    .tb-change:hover { color: var(--text); border-color: rgba(251,191,36,0.5); }

    .chat { flex: 1; overflow-y: auto; padding: 18px 14px;
      display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--bubble-me); color: #1a1a1a;
      border-bottom-right-radius: 6px; font-weight: 600; }
    .msg.ai { align-self: flex-start; background: var(--bubble-ai); color: var(--text);
      border-bottom-left-radius: 6px; border: 1px solid var(--border); }
    .msg .wod-hit { background: rgba(255,255,255,0.55); border-radius: 6px; padding: 0 4px; font-weight: 900; }
    /* 💡 문법 팁 카드 — AI 답변 끝의 (💡 …) 를 분리해 예쁘게 */
    .tip-chip { margin-top: 8px; padding: 7px 10px; border-radius: 10px; font-size: 12px;
      background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
      color: #fde68a; line-height: 1.5; white-space: normal; }
    .ai-row { display: flex; gap: 8px; align-items: flex-end; }
    .ai-avatar { width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
      overflow: hidden; }
    .ai-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .ai-row.speaking .ai-avatar { animation: avatarBop .55s ease-in-out infinite; }
    @keyframes avatarBop { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(5deg); } }
    .typing { display: inline-flex; gap: 4px; padding: 14px 18px; }
    .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
      animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; } }
    .input-bar { background: rgba(20,33,59,0.98); border-top: 1px solid var(--border);
      padding: 12px 14px; backdrop-filter: blur(12px); flex-shrink: 0; }
    .input-bar form { display: flex; gap: 8px; max-width: 820px; margin: 0 auto; }
    .input-bar input { flex: 1; padding: 12px 16px; background: var(--card);
      color: var(--text); border: 1px solid var(--border); border-radius: 999px;
      font-size: 14px; font-family: inherit; }
    .input-bar input:focus { outline: 0; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(251,191,36,0.15); }
    .input-bar button { padding: 10px 18px; background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; border: 0; border-radius: 999px; font-size: 14px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 14px -2px rgba(16,185,129,0.4); }
    .input-bar button:disabled { background: #475569; box-shadow: none; }
    .empty-state { text-align: center; color: var(--text2); padding: 22px 16px 30px; }
    .empty-state .hero-mango { width: 84px; height: 84px; border-radius: 50%; overflow: hidden;
      margin: 0 auto 10px; border: 3px solid rgba(251,191,36,0.5); box-shadow: 0 8px 28px -6px rgba(251,191,36,0.45);
      animation: heroFloat 3s ease-in-out infinite; }
    .empty-state .hero-mango img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes heroFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .empty-state h2 { color: var(--gold); font-size: 19px; margin: 0 0 8px 0; }
    .empty-state p { font-size: 13px; line-height: 1.6; margin: 6px 0; }
    /* 🗺 주제 모험 카드 */
    .topics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px;
      max-width: 560px; margin: 16px auto 0; }
    @media (max-width: 520px) { .topics { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    .topic-card { padding: 12px 6px 10px; border-radius: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: transform .15s, box-shadow .15s, border-color .15s; }
    .topic-card:hover { transform: translateY(-3px) scale(1.03); border-color: rgba(251,191,36,0.55);
      box-shadow: 0 10px 22px -8px rgba(251,191,36,0.35); }
    .topic-card .t-emoji { font-size: 26px; line-height: 1; }
    .topic-card .t-name { font-size: 11.5px; font-weight: 800; color: var(--text); }
    /* 🧑 친구(캐릭터) 고르기 카드 — 2026-08-07.
       주제 카드(.topic-card)와 같은 모양이되 «지금 고른 친구» 는 테두리로 확실히 표시한다.
       고른 게 안 보이면 카드를 눌러도 고른 느낌이 안 난다. */
    .friends { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,140px),1fr)); gap: 9px;
      max-width: 560px; margin: 10px auto 0; }
    @media (max-width: 420px) { .friends { grid-template-columns: 1fr; } }
    .friend-card { padding: 12px 8px 10px; border-radius: 14px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.14);
      background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
    .friend-card:hover { border-color: rgba(251,191,36,0.55); }
    .friend-card.on { border-color: var(--gold); background: rgba(251,191,36,0.14);
      box-shadow: 0 0 0 1px rgba(251,191,36,0.5) inset; }
    .friend-card .f-emoji { font-size: 26px; line-height: 1; }
    .friend-card .f-name { font-size: 12.5px; font-weight: 900; color: var(--text); }
    .friend-card .f-desc { font-size: 11px; color: var(--text2); line-height: 1.35; }
    /* 헤더 이름 아래 «눌러서 바꾸기» 안내 — 안 적어두면 이름이 버튼인 줄 아무도 모른다 */
    .top .info .chg { color: var(--gold); font-weight: 700; }

    .quick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
    .quick button { padding: 8px 14px; background: rgba(251,191,36,0.12);
      color: var(--gold); border: 1px solid rgba(251,191,36,0.3);
      border-radius: 999px; font-size: 12px; cursor: pointer; font-weight: 700; }

    /* ⭐ 포인트 플로팅 토스트 */
    .pt-toast { position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%);
      background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1a1a;
      font-weight: 900; font-size: 15px; padding: 8px 18px; border-radius: 999px;
      box-shadow: 0 8px 24px -4px rgba(251,191,36,0.55); z-index: 900; pointer-events: none;
      animation: ptFly 1.5s ease-out forwards; white-space: nowrap; }
    @keyframes ptFly { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.7); }
      18% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
      70% { opacity: 1; transform: translate(-50%, -30px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(.9); } }
    /* 🎉 레벨업/퀘스트 축하 배너 */
    .cele-banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%,-50%) scale(.6);
      background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid var(--gold);
      color: var(--text); padding: 18px 26px; border-radius: 20px; z-index: 950; text-align: center;
      box-shadow: 0 18px 60px -10px rgba(251,191,36,0.5); animation: celePop 2.6s ease forwards; pointer-events: none;
      max-width: 84vw; }
    .cele-banner .cb-big { font-size: 30px; }
    .cele-banner .cb-title { font-size: 17px; font-weight: 900; color: var(--gold); margin-top: 4px; }
    .cele-banner .cb-sub { font-size: 12.5px; color: var(--text2); margin-top: 3px; }
    @keyframes celePop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
      12% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); }
      20% { transform: translate(-50%,-50%) scale(1); }
      82% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-58%) scale(.94); } }
    /* 🎊 콘페티 */
    .confetti-box { position: fixed; inset: 0; pointer-events: none; z-index: 940; overflow: hidden; }
    .confetti-p { position: absolute; width: 9px; height: 14px; top: -20px; border-radius: 2px;
      animation: cfFall linear forwards; }
    @keyframes cfFall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }

    /* 🔊 헤더 소리 ON/OFF 토글 */
    .snd-toggle { background: rgba(251,191,36,0.15); color: var(--gold);
      border: 1px solid rgba(251,191,36,0.35); width: 34px; height: 34px;
      border-radius: 9px; font-size: 15px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; line-height: 1; }
    .snd-toggle.off { background: rgba(148,163,184,0.12); color: #94a3b8; border-color: rgba(148,163,184,0.3); }

    /* 🚀 다음 활동으로 이동 (MangoFlow) — 채팅 화면을 계속 차지하지 않게 헤더의 작은 아이콘 버튼으로 */
    .next-flow-btn { background: rgba(56,189,248,0.15); color: #38bdf8;
      border: 1px solid rgba(56,189,248,0.35); width: 34px; height: 34px;
      border-radius: 9px; font-size: 15px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; line-height: 1; }

    /* 🔊 각 AI 답변 "다시 듣기" 스피커 버튼 */
    .replay-btn { align-self: flex-end; margin-bottom: 2px; width: 30px; height: 30px;
      border-radius: 50%; border: 1px solid rgba(251,191,36,0.35);
      background: rgba(251,191,36,0.12); color: var(--gold); font-size: 14px;
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      line-height: 1; transition: transform .15s, background .15s; padding: 0; }
    .replay-btn:hover { background: rgba(251,191,36,0.22); transform: scale(1.08); }
    .replay-btn.playing { background: var(--gold); color: #1a1a1a; animation: sndPulse 1s ease-in-out infinite; }
    @keyframes sndPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.5); } 50% { box-shadow: 0 0 0 6px rgba(251,191,36,0); } }

    /* ══ 👁 자막 3단계 + 뜻 보기 (2026-08-07) ══
       듣기 훈련을 하려면 글자를 가려야 하는데, 가리기만 하면 안 들리는 순간 학생이 그냥 포기한다.
       그래서 «가리기» 는 끄는 게 아니라 **탭 한 번으로 다시 보이는** 상태다. 확인하고 계속 갈 수 있어야 한다.
       ⚠️ CSS 주석에 CJK 홑낫표(U+300C/U+300D)를 쓰지 말 것 — <style> 은 하니스 검사 대상이고,
          그 두 글자만 있어도 한자 폰트 983KB 를 통째로 내려받는다(admin_lazyload_harness). «» 를 쓸 것.
       ⚠️ opacity + transition 으로 감추지 않는다 — 백그라운드 탭·저전력 모드에서 transition 이 멈추면
          영영 안 보이는 사고가 난다(CLAUDE.md 함정). filter / display 만 쓴다.
       ⚠️ 가리는 것은 **AI 답변만**이다. 학생이 자기가 쓴 말은 늘 보여야 한다. */
    .ai-text { display: inline; }
    .sub-veil { display: none; color: var(--text2); font-size: 13px; font-weight: 700; cursor: pointer; }
    .chat[data-sub="blur"] .ai-row:not(.sub-shown) .ai-text,
    .chat[data-sub="blur"] .ai-row:not(.sub-shown) .tip-chip { filter: blur(6px); cursor: pointer; user-select: none; }
    .chat[data-sub="off"] .ai-row:not(.sub-shown) .ai-text,
    .chat[data-sub="off"] .ai-row:not(.sub-shown) .tip-chip { display: none; }
    .chat[data-sub="off"] .ai-row:not(.sub-shown) .sub-veil { display: inline; }
    /* 뜻 카드 — 파랑. 노란 팁 카드(문법)와 색으로 구분된다 */
    .ko-chip { margin-top: 8px; padding: 7px 10px; border-radius: 10px; font-size: 12.5px;
      background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.35);
      color: #bae6fd; line-height: 1.5; white-space: normal; }
    .ko-chip.err { background: rgba(148,163,184,0.12); border-color: rgba(148,163,184,0.35); color: #cbd5e1; }
    .mean-btn { align-self: flex-end; margin-bottom: 2px; height: 30px; padding: 0 9px;
      border-radius: 999px; border: 1px solid rgba(56,189,248,0.35);
      background: rgba(56,189,248,0.12); color: #7dd3fc; font-size: 11.5px; font-weight: 800;
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      line-height: 1; white-space: nowrap; transition: background .15s; }
    .mean-btn:hover { background: rgba(56,189,248,0.24); }
    .mean-btn.on { background: #38bdf8; color: #06283d; }

    /* 🎤 입력창 말하기(음성 입력) 버튼 */
    .mic-btn { padding: 0; width: 46px; flex-shrink: 0; background: rgba(251,191,36,0.14);
      color: var(--gold); border: 1px solid rgba(251,191,36,0.35); border-radius: 999px;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

      data-ko="🚀 다음 활동 고르기" data-en="🚀 Choose next activity">🚀 다음 활동 고르기</button>
  </div>

  <script>
    // 전체 사이트 로그인된 사용자(mango_user) + 서명 토큰 자동 사용
    // 서버가 uid 를 그대로 믿지 않으므로(타인 대화 열람/삭제 방지 = IDOR 차단)
    // 항상 { uid, token } 쌍으로 요청한다. 게스트는 서버 발급 랜덤 uid + 세션 스코프 토큰.
    let authCache = null;
    function tokenUid(tok) {
      try { return JSON.parse(atob(String(tok).split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).uid || null; } catch(e){ return null; }
    }
    async function getAuth() {
      if (authCache) return authCache;
      let u = null;
      try { u = JSON.parse(localStorage.getItem('mango_user') || 'null'); } catch(e){}
      if (u && u.user_id) {
        let tok = null;
        try { tok = localStorage.getItem('mango_token'); } catch(e){}
        if (tok && tokenUid(tok) === u.user_id) {
          authCache = { uid: u.user_id, token: tok };
          return authCache;
        }
        // 토큰이 없거나 다른 계정 것 → 비밀번호 미설정 계정은 조용히 재발급 (로그인과 동일 보안수준)
        try {
          const r = await fetch('/api/student/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id: u.user_id }) });
          const d = await r.json();
          if (d.ok && d.token) {
            try { localStorage.setItem('mango_token', d.token); } catch(e){}
            authCache = { uid: u.user_id, token: d.token };
            return authCache;
          }
        } catch(e){}
        // 비밀번호 계정인데 토큰 없음(예: 이전 버전에서 로그인) → 재로그인 전까지 게스트로 폴백
      }
      // 게스트 — 세션 스코프(sessionStorage) 랜덤 uid + 서버 발급 토큰
      try {
        const g = JSON.parse(sessionStorage.getItem('mango_guest_chat') || 'null');
        if (g && g.uid && g.token) { authCache = g; return authCache; }
      } catch(e){}
      try {
        const r = await fetch('/api/ai/chat-guest-token', { method:'POST' });
        const d = await r.json();
        if (d.ok && d.uid && d.token) {
          try { sessionStorage.setItem('mango_guest_chat', JSON.stringify({ uid: d.uid, token: d.token })); } catch(e){}
          authCache = { uid: d.uid, token: d.token };
          return authCache;
        }
      } catch(e){}
      return null;
    }
    let currentLevel = 'B1';
    let currentPersona = 'friendly';
    // 🔊 원어민 음성 재생 속도 (localStorage 로 유지, 기본 1 = 보통)
    let currentRate = (function(){
      try { const r = parseFloat(localStorage.getItem('mangoi_aifriend_tts_rate')); return (r >= 0.5 && r <= 1.5) ? r : 1; } catch(e){ return 1; }
    })();

    document.querySelectorAll('.opt[data-level]').forEach(b => {
      b.onclick = () => { document.querySelectorAll('.opt[data-level]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentLevel = b.dataset.level; };
    });
    document.querySelectorAll('.opt[data-persona]').forEach(b => {
      b.onclick = () => { document.querySelectorAll('.opt[data-persona]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentPersona = b.dataset.persona; };
    });
    /* 🎙 친구 고르기 — 고르면 목소리(Aura-2 speaker)와 얼굴(아바타)이 함께 바뀐다. localStorage 로 기억.
       🧑 (2026-08-31) 사장님 지시로 «둘» 에서 «넷» 으로. 웜업과 같은 네 명·같은 화자를 씁니다 —
          두 화면에서 같은 이름이 다른 목소리로 말하면 그때부터 «화면마다 답이 다른» 사고가 시작됩니다.
       🔴 얼굴은 이제 화자 이름이 아니라 «사람 이름» 으로 고릅니다(PEOPLE[].char) —
          예전에는 charForSpeaker() 가 화자 문자열을 비교해서, 화자만 바꾸면
          «남자를 골랐는데 얼굴은 여자» 가 되고 에러도 안 났습니다. */
    const PEOPLE = {
      emma: { speaker:'asteria', char:'emma' },
      jake: { speaker:'apollo',  char:'jake' },
      lily: { speaker:'delia',   char:'lily' },
      noah: { speaker:'aries',   char:'noah' },
    };
    const PEOPLE_ORDER = ['emma','jake','lily','noah'];   // 「번갈아」가 도는 순서
    let currentVoice = (function(){
      try {
        let v = localStorage.getItem('mangoi_aifriend_voice');
        if (v === 'female') v = 'emma'; else if (v === 'male') v = 'jake';   // 옛 저장값 이어받기
        return (v === 'mix' || PEOPLE[v]) ? v : 'emma';
      } catch(e){ return 'emma'; }
    })();
    let _mixTurn = 0;
    // 지금 «말할 사람». 번갈아면 순번이 가리키는 사람.
    function personNow() { return currentVoice === 'mix' ? PEOPLE_ORDER[_mixTurn % PEOPLE_ORDER.length] : currentVoice; }
    function speakerFor() {
      const p = personNow();
      if (currentVoice === 'mix') _mixTurn++;
      return (PEOPLE[p] || PEOPLE.emma).speaker;
    }
    // 👤 사람 ↔ 아바타 얼굴 매핑 (js/mango-avatar.js 의 캐릭터 이름과 «짝»)
    function charForPerson(p) { return (PEOPLE[p] || PEOPLE.emma).char; }
    // 🔄 아바타를 지금 선택된 목소리에 맞춰 즉시 반영 — MangoAvatar 가 아직 준비 전이면(스텁) 조용히 무시되고,
    //    build() 완료 후 다음 setCharacter 호출(버튼 클릭·첫 답변 재생)에서 정상 반영된다.
    function syncAvatarToVoice() {
      try {
        window.MangoAvatar && MangoAvatar.setCharacter &&
          MangoAvatar.setCharacter(charForPerson(personNow()));
      } catch(e){}
    }
    syncAvatarToVoice();
    document.querySelectorAll('.opt[data-voice]').forEach(b => {
      if (b.dataset.voice === currentVoice) { document.querySelectorAll('.opt[data-voice]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
      b.onclick = () => {
        document.querySelectorAll('.opt[data-voice]').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        currentVoice = b.dataset.voice;
        try { localStorage.setItem('mangoi_aifriend_voice', currentVoice); } catch(e){}
        try { if (window.UXT) UXT.hit('ux:aifriend-voice-' + currentVoice); } catch(e){}
        syncAvatarToVoice();   // 👨 '남자'를 누르면 바로 슈퍼맨 얼굴로 바뀌게(다음 답변까지 기다리지 않고)
        syncFriendName();      // 🧑 헤더 이름도 같이 (Emma ↔ Jake)
      };
    });

    /* ══ 🧑 친구(캐릭터) — 2026-08-07 ══
       기능은 원래 다 있었다(목소리 3종 · 실사 아바타 2종 · 말투 4종). 문제는 «고른 느낌» 이 없던 것 —
       설정 줄에 「목소리 여자/남자」 로 레벨·속도와 섞여 있었고, 이름이 전부 Mango 라 누구와
       이야기하는지 구분되지 않았다. 그래서 얼굴·목소리·이름·기본 말투를 «한 사람» 으로 묶는다.

       ⚠️ 저장 키는 기존 mangoi_aifriend_voice 를 그대로 쓴다. 새 키를 만들면 지금까지 고른 목소리가
          한 번 리셋된다. 친구 = 목소리이므로 키를 나눌 이유가 없다.
       ⚠️ 아바타 얼굴은 실제로 2개(female/male)뿐이다. 있지도 않은 얼굴로 캐릭터를 늘리지 않는다 —
          이름만 다른 같은 얼굴은 «고른 느낌» 이 아니라 «속은 느낌» 이 된다. */
    const FRIENDS = [
      { v: 'emma', emoji: '👩', name: 'Emma',
        ko: '엠마', en: 'Emma', persona: 'friendly',
        d_ko: '다정하게 이야기해요', d_en: 'Warm and friendly',
        hi: "Hi! I'm Emma. What do you want to talk about today?" },
      { v: 'jake', emoji: '🦸', name: 'Jake',
        ko: '제이크', en: 'Jake', persona: 'playful',
        d_ko: '장난도 치고 농담도 해요', d_en: 'Playful and funny',
        hi: "Hey! I'm Jake. Ready for some fun English?" },
      { v: 'lily', emoji: '👧', name: 'Lily',
        ko: '릴리', en: 'Lily', persona: 'friendly',
        d_ko: '또래 언니처럼 이야기해요', d_en: 'Like an older sister',
        hi: "Hi! I'm Lily. What do you like to do?" },
      { v: 'noah', emoji: '👦', name: 'Noah',
        ko: '노아', en: 'Noah', persona: 'playful',
        d_ko: '또래 형처럼 이야기해요', d_en: 'Like an older brother',
        hi: "Hey! I'm Noah. What do you like to do?" },
      { v: 'mix', emoji: '🔀', name: 'All four',
        ko: '번갈아', en: 'All four', persona: 'friendly',
        d_ko: '네 친구가 돌아가며 이야기해요', d_en: 'All four take turns',
        hi: "Hi! We'll take turns talking with you!" },
    ];
    const friendOf = (v) => FRIENDS.find(f => f.v === v) || FRIENDS[0];
    function syncFriendName() {
      const el = document.getElementById('friendName');
      if (el) el.textContent = friendOf(currentVoice).name;
    }
    /* 친구를 «고르는» 경로 — 카드에서 고르면 목소리·얼굴·기본 말투까지 한 번에 바뀐다.
       ⚠️ 설정 줄의 말투 버튼은 그대로 남는다. 친구가 정하는 건 «기본값» 이고,
          학생이 따로 말투를 골랐다면 그 선택이 이깁니다(친구를 새로 고를 때만 기본값으로 되돌림). */
    function setFriend(v, greet) {
      const f = friendOf(v);
      currentVoice = f.v;
      try { localStorage.setItem('mangoi_aifriend_voice', currentVoice); } catch(e){}
      document.querySelectorAll('.opt[data-voice]').forEach(x => x.classList.toggle('active', x.dataset.voice === currentVoice));
      currentPersona = f.persona;
      document.querySelectorAll('.opt[data-persona]').forEach(x => x.classList.toggle('active', x.dataset.persona === currentPersona));
      syncAvatarToVoice();
      syncFriendName();
      // 화면에 떠 있는 모든 친구 카드의 «지금 고른 것» 표시를 갱신 —
      // 빈 화면(첫 진입)의 카드는 정적 HTML 이라 이걸 안 하면 눌러도 테두리가 안 옮겨간다
      document.querySelectorAll('.friend-card[data-v]').forEach(c => c.classList.toggle('on', c.dataset.v === f.v));
      try { if (window.UXT) UXT.hit('ux:aifriend-friend-' + f.v); } catch(e){}
      const p = document.getElementById('friendPicker');
      if (p) p.remove();
      // 고르자마자 그 친구가 자기 목소리로 인사한다 — 누구를 골랐는지 «귀로» 확인시켜 준다
      if (greet) { appendMsg('ai', f.hi); if (isSoundOn()) speakText(f.hi, null, null); }
    }
    function friendCards() {
      const en = isEn();
      return '<div class="friends">' + FRIENDS.map(f =>
        '<div class="friend-card' + (f.v === currentVoice ? ' on' : '') + '" data-v="' + f.v + '" onclick="setFriend(\'' + f.v + '\', true)">'
        + '<span class="f-emoji">' + f.emoji + '</span>'
        + '<span class="f-name">' + escapeHtml(en ? f.en : (f.name + ' · ' + f.ko)) + '</span>'
        + '<span class="f-desc">' + escapeHtml(en ? f.d_en : f.d_ko) + '</span></div>').join('') + '</div>';
    }
    /* 대화 도중에도 친구를 바꾸고 싶을 때 — 주제 고르기(showTopicPicker)와 같은 방식으로
       대화 맨 아래에 카드를 띄운다. 화면을 덮는 팝업이 아니라서 하던 대화가 안 끊긴다. */
    function showFriendPicker() {
      const chat = document.getElementById('chat');
      if (!chat) return;
      const old = document.getElementById('friendPicker');
      if (old) old.remove();
      const box = document.createElement('div');
      box.id = 'friendPicker';
      box.style.cssText = 'margin:10px 0 4px';
      box.innerHTML = '<p style="color:var(--text2);font-size:12px;font-weight:800;margin:0 0 8px;text-align:center">'
        + (isEn() ? 'Who do you want to talk with?' : '오늘은 누구랑 이야기할까요?') + '</p>' + friendCards();
      chat.appendChild(box);
      chat.scrollTop = chat.scrollHeight;
    }
    syncFriendName();
    document.querySelectorAll('.opt[data-rate]').forEach(b => {
      if (parseFloat(b.dataset.rate) === currentRate) { document.querySelectorAll('.opt[data-rate]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); }
      b.onclick = () => { applyRate(parseFloat(b.dataset.rate) || 1); };
    });

    /* ══ 👁 자막 3단계 (2026-08-07) ══
       on   = 늘 보임(기본)
       blur = 흐리게 — **탭하면 그 말풍선만 보인다**. 듣기 훈련의 실제 자리.
       off  = 완전히 숨김 — 자리에 "🔊 듣고 맞혀 보세요"만. 역시 탭하면 보인다.
       ⚠️ 어느 단계든 「다시 보는 길」을 남겨 둔다. 확인할 길이 없으면 학생은 그냥 포기하고,
          한 번 포기하면 다음부터 자막을 영영 켜 둔다. */
    let currentSub = (function(){
      try { const v = localStorage.getItem('mangoi_aifriend_sub'); return ['on','blur','off'].includes(v) ? v : 'on'; } catch(e){ return 'on'; }
    })();
    function applySub(v) {
      currentSub = v;
      try { localStorage.setItem('mangoi_aifriend_sub', v); } catch(e){}
      const chat = document.getElementById('chat');
      if (chat) chat.dataset.sub = v;
      document.querySelectorAll('.opt[data-sub]').forEach(x => x.classList.toggle('active', x.dataset.sub === v));
      // 단계를 바꾸면 "이건 봤다" 표시를 지운다 — 안 지우면 가리기로 바꿔도 이전 것들이 계속 보인다
      if (v !== 'on') document.querySelectorAll('.ai-row.sub-shown').forEach(r => r.classList.remove('sub-shown'));
    }
    document.querySelectorAll('.opt[data-sub]').forEach(b => {
      b.onclick = () => {
        applySub(b.dataset.sub);
        try { if (window.UXT) UXT.hit('ux:aifriend-sub-' + b.dataset.sub); } catch(e){}
      };
    });
    applySub(currentSub);

    /* ══ 뜻 보기 — 누른 문장만, 그때 번역한다 ══
       미리 전부 번역해 두면 학생이 보지도 않을 문장까지 비용이 든다. 온디맨드로 부르고,
       서버(/api/translate)가 KV 에 캐시하므로 같은 문장은 두 번째부터 공짜다.
       화면에서도 한 번 받은 건 _koCache 에 담아 두 번 부르지 않는다. */
    const _koCache = new Map();
    async function fetchMeaning(text) {
      const key = String(text || '').trim();
      if (!key) return '';
      if (_koCache.has(key)) return _koCache.get(key);
      const r = await fetch('/api/translate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texts: [key], target: 'ko' })
      });
      const d = await r.json();
      const out = (d && d.ok && d.map && d.map[key]) ? String(d.map[key]) : '';
      if (out) _koCache.set(key, out);
      return out;
    }
    async function toggleMeaning(body, btn, row) {
      const bubble = row.querySelector('.msg.ai');
      if (!bubble) return;
      const existing = bubble.querySelector('.ko-chip');
      if (existing) {                       // 이미 떠 있으면 닫기
        existing.remove();
        btn.classList.remove('on');
        return;
      }
      btn.classList.add('on');
      const chip = document.createElement('div');
      chip.className = 'ko-chip';
      chip.textContent = (window.getLang && getLang() === 'en') ? 'Translating…' : '뜻을 가져오는 중…';
      bubble.appendChild(chip);
      try {
        const ko = await fetchMeaning(body);
        if (ko) {
          chip.textContent = ko;
        } else {
          chip.className = 'ko-chip err';
          chip.textContent = (window.getLang && getLang() === 'en')
            ? "Couldn't get the meaning. Tap again in a moment."
            : '뜻을 가져오지 못했어요. 잠시 후 다시 눌러 주세요.';
        }
      } catch(e) {
        chip.className = 'ko-chip err';
        chip.textContent = (window.getLang && getLang() === 'en')
          ? "Couldn't get the meaning. Tap again in a moment."
          : '뜻을 가져오지 못했어요. 잠시 후 다시 눌러 주세요.';
      }
      // 뜻 카드가 접혀 있던 자막 아래에 생기면 안 보인다 — 뜻을 보려는 순간엔 그 말풍선을 열어 준다
      row.classList.add('sub-shown');
      const chat = document.getElementById('chat');
      if (chat) chat.scrollTop = chat.scrollHeight;
    }
    /* 🐢 (2026-07-23) "천천히 말해줘" 를 말이나 글로 부탁하면 실제로 음성 속도를 한 단계 낮춘다.
       그동안은 속도가 화면 버튼으로만 바뀌어서, 부탁해도 똑같은 속도로 계속 말했다.
       (AI 답변 자체가 요청에 응하는 것은 서버 프롬프트에서 처리) */
    const RATE_STEPS_AF = [0.6, 0.8, 1, 1.2];
    function applyRate(v) {
      currentRate = v;
      try { localStorage.setItem('mangoi_aifriend_tts_rate', String(currentRate)); } catch(e){}
      document.querySelectorAll('.opt[data-rate]').forEach(x => {
        x.classList.toggle('active', parseFloat(x.dataset.rate) === currentRate);
      });
    }
    function maybeAdjustRate(text) {
      const t = String(text || '');
      const slower = /(천천히|느리게|너무\s*빠르|못\s*알아|알아듣기)/.test(t)
                  || /\b(slow(ly| down)?|too fast|more slowly|speak slower)\b/i.test(t);
      const faster = /(빠르게|더\s*빨리)/.test(t) || /\b(faster|speed up)\b/i.test(t);
      if (!slower && !faster) return;
      const i = RATE_STEPS_AF.indexOf(currentRate);
      const cur = i < 0 ? RATE_STEPS_AF.indexOf(1) : i;
      const next = slower ? Math.max(0, cur - 1) : Math.min(RATE_STEPS_AF.length - 1, cur + 1);
      if (RATE_STEPS_AF[next] !== currentRate) applyRate(RATE_STEPS_AF[next]);
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function isEn() { try { return window.getLang && window.getLang() === 'en'; } catch(e){ return false; } }

    /* ══ 🎮 게임화 상태 — 서버 gam 응답(오늘/누적 메시지·스트릭·오늘의 단어)으로 갱신 ══ */
    const MANGO_LEVELS = [
      { at: 0,   name: '새싹 망고' },  { at: 10,  name: '풋풋 망고' },
      { at: 25,  name: '노랑 망고' },  { at: 50,  name: '달콤 망고' },
      { at: 90,  name: '반짝 망고' },  { at: 140, name: '슈퍼 망고' },
      { at: 200, name: '히어로 망고' },{ at: 280, name: '마스터 망고' },
      { at: 380, name: '챔피언 망고' },{ at: 500, name: '황금 망고' },
    ];
    const MANGO_LEVELS_EN = ['Seed Mango','Green Mango','Yellow Mango','Sweet Mango','Shiny Mango','Super Mango','Hero Mango','Master Mango','Champion Mango','Golden Mango'];
    function calcLevel(lifetime) {
      let idx = 0;
      for (let i = 0; i < MANGO_LEVELS.length; i++) if (lifetime >= MANGO_LEVELS[i].at) idx = i;
      const cur = MANGO_LEVELS[idx];
      const next = MANGO_LEVELS[idx + 1] || null;
      const pct = next ? Math.min(100, Math.round((lifetime - cur.at) / (next.at - cur.at) * 100)) : 100;
      return { n: idx + 1, name: cur.name, nameEn: MANGO_LEVELS_EN[idx], pct };
    }
    let gamState = { today: 0, lifetime: 0, streak: 0, word: null, sessionPts: 0, wordDone: false, voiceDone: false, listenDone: false };
    function updateHUD() {
      const g = gamState;
      const lv = calcLevel(g.lifetime);
      document.getElementById('lvName').textContent = 'Lv.' + lv.n + ' ' + (isEn() ? lv.nameEn : lv.name);
      document.getElementById('xpFill').style.width = lv.pct + '%';
      document.getElementById('streakN').textContent = g.streak;
      document.getElementById('ptsN').textContent = g.sessionPts;
      if (g.word) {
        document.getElementById('wodEn').textContent = g.word.w;
        document.getElementById('wodKo').textContent = '(' + g.word.ko + ')';
        document.getElementById('wodEmoji').textContent = g.word.e || '';
        document.getElementById('wodChip').classList.toggle('done', !!g.wordDone);
      }
      const t = Math.min(g.today, 5);
      document.getElementById('qTalkN').textContent = t + '/5';
      document.getElementById('qTalk').classList.toggle('done', g.today >= 5);
      document.getElementById('qWord').classList.toggle('done', !!g.wordDone);
      document.getElementById('qVoice').classList.toggle('done', !!g.voiceDone);
      document.getElementById('qListen').classList.toggle('done', !!g.listenDone);
    }
    function hearWod() {
      if (gamState.word) speakText(gamState.word.w, null, null);
    }

    /* ══ 🎵 효과음 — WebAudio 직접 합성(파일 없음), 소리 토글 존중 ══ */
    let _actx = null;
    function actx() {
      if (!_actx) { try { _actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
      if (_actx && _actx.state === 'suspended') { try { _actx.resume(); } catch(e){} }
      return _actx;
    }
    function tone(freq, t0, dur, type, vol) {
      const c = actx(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, c.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, c.currentTime + t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
    }
    function sndPop()  { if (!isSoundOn()) return; tone(660, 0, 0.09, 'triangle', 0.10); }
    function sndCoin() { if (!isSoundOn()) return; tone(880, 0, 0.08, 'square', 0.06); tone(1320, 0.08, 0.14, 'square', 0.06); }
    function sndFanfare() { if (!isSoundOn()) return;
      [[523,0],[659,0.11],[784,0.22],[1047,0.34]].forEach(p => tone(p[0], p[1], 0.22, 'triangle', 0.11));
      tone(1319, 0.5, 0.4, 'triangle', 0.09);
    }

    /* ══ 🎊 콘페티 + 축하 배너 + ⭐포인트 토스트 ══ */
    function confetti(n) {
      const box = document.createElement('div');
      box.className = 'confetti-box';
      const colors = ['#fbbf24','#f97316','#10b981','#60a5fa','#f472b6','#a78bfa'];
      for (let i = 0; i < (n || 36); i++) {
        const p = document.createElement('div');
        p.className = 'confetti-p';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = (1.4 + Math.random() * 1.4) + 's';
        p.style.animationDelay = (Math.random() * 0.5) + 's';
        box.appendChild(p);
      }
      document.body.appendChild(box);
      setTimeout(() => box.remove(), 3400);
    }
    function celebrate(big, title, sub) {
      const el = document.createElement('div');
      el.className = 'cele-banner';
      el.innerHTML = '<div class="cb-big">' + big + '</div><div class="cb-title">' + escapeHtml(title) + '</div>' + (sub ? '<div class="cb-sub">' + escapeHtml(sub) + '</div>' : '');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2700);
      confetti(44);
      sndFanfare();
    }
    function ptToast(text) {
      const el = document.createElement('div');
      el.className = 'pt-toast';
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600);
      sndCoin();
    }

    /* ══ 서버 gam 반영 — 레벨업/오늘의 단어/수다 5번 퀘스트 감지 → 축하 ══ */
    function applyGam(g, wasVoice) {
      if (!g) return;
      const prevLevel = calcLevel(gamState.lifetime).n;
      const prevToday = gamState.today;
      gamState.today = g.today || 0;
      gamState.lifetime = g.lifetime || 0;
      gamState.streak = g.streak || 0;
      if (g.word) gamState.word = g.word;
      let earned = 0;
      if (g.awarded) earned += g.awarded;
      if (g.voice_bonus) { earned += g.voice_bonus; gamState.voiceDone = true; }
      if (g.word_bonus) { earned += g.word_bonus; gamState.wordDone = true; }
      // 🎧 자막 없이 들은 덤 — 켠 학생에게 벌점이 아니라 끈 학생에게 덤이다
      if (g.listen_bonus) { earned += g.listen_bonus; gamState.listenDone = true; }
      gamState.sessionPts += earned;
      updateHUD();
      const newLevel = calcLevel(gamState.lifetime);
      if (newLevel.n > prevLevel && gamState.lifetime > 1) {
        celebrate('🥭', (isEn() ? 'LEVEL UP! ' : '레벨 업! ') + 'Lv.' + newLevel.n + ' ' + (isEn() ? newLevel.nameEn : newLevel.name),
          isEn() ? 'Your Mango is growing!' : '망고가 무럭무럭 자라고 있어요!');
      } else if (g.word_bonus) {
        celebrate('✨', isEn() ? "Today's word used! +5P" : '오늘의 단어 사용! +5P',
          '"' + (gamState.word ? gamState.word.w : '') + '" — ' + (isEn() ? 'Great vocabulary!' : '멋진 단어 실력이에요!'));
      } else if (prevToday < 5 && gamState.today >= 5) {
        celebrate('🏆', isEn() ? 'Quest complete: 5 chats!' : '퀘스트 달성: 영어 수다 5번!',
          isEn() ? 'You are on fire today!' : '오늘 영어 실력이 불타오르고 있어요!');
      } else if (earned > 0) {
        ptToast('+' + earned + 'P ⭐');
      }
    }

    // 유저 말풍선에서 오늘의 단어 하이라이트
    function renderWithWod(text) {
      let html = escapeHtml(text);
      if (gamState.word) {
        try {
          const re = new RegExp('\\b(' + gamState.word.w + ')\\b', 'gi');
          html = html.replace(re, '<span class="wod-hit">$1</span>');
        } catch(e){}
      }
      return html;
    }
    function appendMsg(role, content) {
      const chat = document.getElementById('chat');
      if (role === 'user') {
        const m = document.createElement('div');
        m.className = 'msg user';
        m.innerHTML = renderWithWod(content);
        chat.appendChild(m);
      } else {
        // (💡 …) 문법 팁을 본문에서 분리해 노란 팁 카드로 — TTS 는 영어 본문만 읽음
        let body = String(content || '');
        let tip = '';
        const tm = body.match(/\(💡[^)]*\)\s*$/);
        if (tm) { tip = tm[0].replace(/^\(/, '').replace(/\)$/, '').trim(); body = body.slice(0, tm.index).trim(); }
        const row = document.createElement('div');
        row.className = 'ai-row';
        /* 👁 본문을 .ai-text 로 감싼다 — 자막 단계(전체/가림/끄기)가 이 span 하나만 건드리면 되고,
           말풍선·아바타·버튼은 늘 그 자리에 남는다. .sub-veil 은 「완전 끄기」일 때만 보이는 안내다. */
        row.innerHTML = '<div class="ai-avatar"><img src="/img/mango-char.png" alt="Mango" loading="lazy" decoding="async"/></div>'
          + '<div class="msg ai">'
          + '<span class="ai-text">' + escapeHtml(body).replace(/\n/g, '<br>') + '</span>'
          + '<span class="sub-veil" data-ko="🔊 듣고 맞혀 보세요 (탭하면 보여요)" data-en="🔊 Listen and guess (tap to see)">🔊 듣고 맞혀 보세요 (탭하면 보여요)</span>'
          + (tip ? '<div class="tip-chip">' + escapeHtml(tip) + '</div>' : '')
          + '</div>'
          + '<button class="replay-btn" aria-label="다시 듣기" data-ko-aria="다시 듣기" data-en-aria="Play again" title="다시 듣기">🔊</button>'
          + '<button class="mean-btn" data-ko="뜻" data-en="Meaning" title="한국어 뜻 보기" data-ko-title="한국어 뜻 보기" data-en-title="Show Korean meaning">뜻</button>';
        const rb = row.querySelector('.replay-btn');
        if (rb) rb.addEventListener('click', () => speakText(body, rb, row));
        const mb = row.querySelector('.mean-btn');
        if (mb) mb.addEventListener('click', () => toggleMeaning(body, mb, row));
        // 가려진 말풍선을 탭하면 그 하나만 열린다(다른 말풍선은 그대로 가려진 채)
        const bubble = row.querySelector('.msg.ai');
        if (bubble) bubble.addEventListener('click', (e) => {
          if (currentSub === 'on') return;
          if (e.target.closest('.ko-chip')) return;   // 뜻 카드 안 텍스트 선택까지 가로채지 않게
          row.classList.toggle('sub-shown');
        });
        row._speakBody = body;
        chat.appendChild(row);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    /* ══ 🔊 소리 듣기 (원어민 TTS: 서버 Deepgram Aura-1 → MeloTTS → 브라우저 폴백) ══ */
    function isSoundOn() { try { return localStorage.getItem('mangoi_aifriend_sound') !== '0'; } catch(e){ return true; } }
    function updateSoundBtn() {
      const b = document.getElementById('sndToggle'); if (!b) return;
      const on = isSoundOn();
      b.textContent = on ? '🔊' : '🔇';
      b.classList.toggle('off', !on);
    }
    function toggleSound() {
      const on = isSoundOn();
      try { localStorage.setItem('mangoi_aifriend_sound', on ? '0' : '1'); } catch(e){}
      if (on) { // 껐음 — 재생 중인 음성 중단
        try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
        document.querySelectorAll('audio').forEach(a => { try { a.pause(); } catch(e){} });
        document.querySelectorAll('.replay-btn.playing').forEach(x => x.classList.remove('playing'));
        document.querySelectorAll('.ai-row.speaking').forEach(x => x.classList.remove('speaking'));
        try { window.MangoAvatar && MangoAvatar.plainStop(); } catch(e){}   // 👩‍🏫 아바타 입 멈춤
      }
      updateSoundBtn();
    }
    let _ttsLangSet = false;
    function speakText(text, btn, row) {
      if (!window.MangoiTTS) return;
      if (!_ttsLangSet) { try { MangoiTTS.setLang('en'); } catch(e){} _ttsLangSet = true; }
      const clean = String(text || '').replace(/^[⚠️❗️\s]+/, '').trim();
      if (!clean || /^⚠️/.test(text)) return;   // 시스템/오류 메시지는 읽지 않음
      document.querySelectorAll('.replay-btn.playing').forEach(x => x.classList.remove('playing'));
      document.querySelectorAll('.ai-row.speaking').forEach(x => x.classList.remove('speaking'));
      if (btn) btn.classList.add('playing');
      if (row) row.classList.add('speaking');
      // 👩‍🏫 실제 TTS 음성을 아바타에 물려 음량 립싱크(요소당 1회 바인딩)
      /* 🐛→✅ (2026-07-27) 예전엔 여기서 바로 plainStart() 를 불렀다. 그런데 실제 재생은
         MangoiTTS.speak() 내부의 서버 TTS fetch 가 끝난 뒤에야 시작되고, 그 네트워크 대기
         시간도 mango-avatar.js 그리기 루프의 "5초 무음 워치독"이 무음으로 세고 있었다.
         TTS 응답이 5초를 넘기면 오디오가 재생을 시작하기도 전에 워치독이 그리기를 꺼버리고,
         그 뒤 오디오가 실제로 흘러나와도 아무도 그리기를 다시 켜지 않아 "소리는 나는데
         입은 안 움직임"으로 보였다(warmup.html 에서 재현·수정한 것과 동일한 버그).
         이제 plainStart() 는 오디오 요소가 실제로 재생을 시작하는 'playing' 이벤트에서만
         부른다 — 워치독이 재는 무음 시간이 실제 재생 이후로만 좁혀진다. */
      try {
        if (window.MangoAvatar && MangoAvatar.attach && MangoiTTS.getAudioEl) {
          const _avEl = MangoiTTS.getAudioEl();
          MangoAvatar.attach(_avEl);
          if (!_avEl._mangoLipBound) {
            _avEl._mangoLipBound = true;
            _avEl.addEventListener('playing', function(){ try { MangoAvatar.plainStart(); } catch(e){} });
          }
        }
      } catch(e){}
      const done = function(){
        if (btn) btn.classList.remove('playing');
        if (row) row.classList.remove('speaking');
        try { window.MangoAvatar && MangoAvatar.plainStop(); } catch(e){}
      };
      try {
        // ⚠️ speakerFor() 는 '번갈아' 모드에서 호출마다 순번(_mixTurn)이 넘어가므로 반드시 1회만 불러
        //   변수에 담아 재사용한다 — 두 번 부르면(화자용 1번+아바타용 1번) 매 턴 건너뛰며 어긋난다.
        const _personNow = personNow();          // ⚠️ speakerFor() 가 번갈아 순번을 넘기므로 «먼저» 읽는다
        const _speaker = speakerFor();
        try { if (MangoiTTS.setSpeaker) MangoiTTS.setSpeaker(_speaker); } catch(e){}
        try { window.MangoAvatar && MangoAvatar.setCharacter && MangoAvatar.setCharacter(charForPerson(_personNow)); } catch(e){}
        MangoiTTS.speak(clean, currentRate, done);
      } catch(e){ done(); }
    }

    /* ══ 🎤 말하기 (녹음 → 서버 Whisper 전사 → 자동 전송 + 🎤보너스) ══
       (2026-07-26) 브라우저 내장 SpeechRecognition 대신 항상 서버 Whisper(mangoi-voice-input.js)
       를 쓴다 — 직원 피드백: 억양 섞인 아이 발음을 브라우저 인식기가 "I like dog"를 "talk"로
       듣는 등 자주 오인식했다(성공한 것처럼 보이지만 틀린 텍스트라 재시도 로직으로도 못 잡음).
       AI 음성코치에서 이미 검증된 방식이라 정확도가 높고, 세션마다 브라우저가 제멋대로 끊던
       문제도 없다(MediaRecorder는 멈추기 전까지 안 끊김). 실시간 자막은 사라지고 "녹음→전사"
       로 UX가 바뀌지만(사장님 승인), 그만큼 정답률이 오른다. */
    let _recognizing = false, _pendingVoice = false;
    function updateMicUI() {
      const b = document.getElementById('micBtn'); if (!b) return;
      b.classList.toggle('recording', _recognizing);
      b.textContent = _recognizing ? '⏹' : '🎤';
    }
    /* 🎤 마이크 상태·오류를 화면에 알려준다 — 그동안 ai-friend 는 아무 안내가 없어서
       권한이 꺼져 있거나 소리가 안 들려도 학생은 "마이크가 안 된다"고만 느꼈다. */
    function micHint(msg, ms) {
      let el = document.getElementById('micHint');
      if (!el) {
        el = document.createElement('div');
        el.id = 'micHint';
        el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:9999;'
          + 'max-width:88vw;padding:10px 16px;border-radius:14px;background:rgba(15,23,42,.92);color:#fff;'
          + 'font-size:14px;line-height:1.45;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.28);display:none';
        document.body.appendChild(el);
      }
      if (el._t) { clearTimeout(el._t); el._t = null; }
      if (!msg) { el.style.display = 'none'; return; }
      el.textContent = msg;
      el.style.display = 'block';
      if (ms !== 0) el._t = setTimeout(() => { el.style.display = 'none'; }, ms || 3200);
    }

    /* 🎤 녹음 → 서버 Whisper 전사(mangoi-voice-input.js). 모든 환경에서 이 방식 하나만 쓴다. */
    let _whisperOn = false;
    async function micViaWhisper() {
      if (!window.MangoiVoice || !MangoiVoice.supported()) {
        micHint(isEn() ? 'This browser cannot use the microphone. Please type instead.'
                       : '이 브라우저는 마이크를 쓸 수 없어요. 아래에 글로 입력해 주세요. 😢', 5000);
        return;
      }
      if (_whisperOn) { MangoiVoice.stop(); return; }     // ⏹ — 지금까지 녹음분으로 전사
      _whisperOn = true; _recognizing = true; updateMicUI();
      try { if (window.MangoiTTS && MangoiTTS.stop) MangoiTTS.stop(); } catch(e){}
      try { window.MangoAvatar && MangoAvatar.plainStop(); } catch(e){}   // 👩‍🏫 아바타 입 멈춤
      const said = await MangoiVoice.record({
        lang: 'en',
        onState: (s, info) => {
          if (s === 'ready')         micHint(isEn() ? 'Getting the mic ready…' : '마이크를 준비하고 있어요…', 0);
          else if (s === 'waiting')  micHint(isEn() ? '🎤 Speak now! Take your time.' : '🎤 지금 말해보세요! 천천히 해도 괜찮아요.', 0);
          else if (s === 'speaking') micHint(isEn() ? '🎤 Listening…' : '🎤 듣고 있어요…', 0);
          else if (s === 'thinking') micHint(isEn() ? '🎧 Writing down what you said…' : '🎧 말한 내용을 받아적는 중…', 0);
          else if (s === 'error') {
            const r = info && info.reason;
            micHint(r === 'denied'
              ? (isEn() ? 'Mic permission is off. Tap the lock icon in the address bar → allow the microphone.'
                        : '🎤 마이크 권한이 꺼져 있어요. 주소창의 자물쇠(🔒) → 마이크 "허용" 후 다시 눌러주세요.')
              : r === 'no_audio'
              ? (isEn() ? "I couldn't hear anything. Try again a bit louder." : '🎤 소리가 잘 안 들렸어요. 조금 더 크게 다시 말해주세요.')
              : (isEn() ? 'Voice input failed. Please type instead.' : '🎤 음성 입력에 실패했어요. 글로 입력해 주세요.'), 5000);
          }
        }
      });
      _whisperOn = false; _recognizing = false; updateMicUI();
      if (said) {
        micHint(null);
        const input = document.getElementById('msgInput');
        if (input) input.value = said;
        _pendingVoice = true; sendMsg();
      }
    }

    function toggleMic() {
      /* 시작 전에 입력창을 비운다 — 이전 내용이 새 녹음에 섞이지 않게. 멈춤(⏹)은
         micViaWhisper() 내부의 _whisperOn 검사가 처리(누르면 지금까지 녹음분으로 전사). */
      if (!_whisperOn) {
        try { const input = document.getElementById('msgInput'); if (input) input.value = ''; } catch(e){}
      }
      micViaWhisper();
    }
    updateSoundBtn();
    function appendTyping() {
      const chat = document.getElementById('chat');
      const row = document.createElement('div');
      row.id = 'typingRow'; row.className = 'ai-row';
      row.innerHTML = '<div class="ai-avatar"><img src="/img/mango-char.png" alt="Mango" loading="lazy" decoding="async"/></div><div class="msg ai typing"><span></span><span></span><span></span></div>';
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }
    function removeTyping() {
      const t = document.getElementById('typingRow');
      if (t) t.remove();
    }

    /* ══ 🗺 주제 모험 카드 — 누르면 영어 스타터 문장을 대신 보내줌 ══
       ⚠️ (2026-07-29 학생 제보) "영화 주제로 들어왔는데 처음엔 동물 얘기를 물어보더라고요".
       예전엔 카드가 영어 문장 한 줄을 대신 보내주는 게 전부라, 그 다음 턴부터는 AI 가
       주제를 붙잡아 둘 근거가 하나도 없었다. 이제 고른 주제를 기억해(id) 매 요청에 함께
       보내고, 화면 위에도 계속 띄운다. */
    const TOPICS = [
      { e: '🍕', ko: '음식 이야기', en: 'Food', id: 'food', msg: "Let's talk about food! What's your favorite food, Mango?" },
      { e: '🐾', ko: '동물 친구들', en: 'Animals', id: 'animals', msg: 'I want to talk about animals! Do you have a favorite animal?' },
      { e: '🚀', ko: '우주 탐험', en: 'Space', id: 'space', msg: "Let's talk about space! Tell me something cool about space." },
      { e: '🦖', ko: '공룡 시대', en: 'Dinosaurs', id: 'dinosaurs', msg: 'Dinosaurs are so cool! Which dinosaur do you like?' },
      { e: '🎮', ko: '게임 이야기', en: 'Games', id: 'video games', msg: "Let's talk about games! What games do you know?" },
      { e: '🏫', ko: '학교 생활', en: 'School', id: 'school life', msg: 'Can I tell you about my school day?' },
      { e: '⚽', ko: '스포츠', en: 'Sports', id: 'sports', msg: "Let's talk about sports! Do you like soccer?" },
      { e: '🎬', ko: '영화·만화', en: 'Movies', id: 'movies and cartoons', msg: "Let's talk about movies and cartoons! What's fun to watch?" },
    ];
    /* 🗺 지금 이야기 중인 주제 — 새로고침해도 이어지게 localStorage 에 보관 */
    let currentTopic = (function () {
      try {
        const id = localStorage.getItem('mangoi_aifriend_topic');
        return TOPICS.find(t => t.id === id) || null;
      } catch (e) { return null; }
    })();
    function renderTopicBar() {
      const bar = document.getElementById('topicBar');
      if (!bar) return;
      if (!currentTopic) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      const nm = document.getElementById('topicName');
      if (nm) nm.textContent = currentTopic.e + ' ' + (isEn() ? currentTopic.en : currentTopic.ko);
    }
    function setTopic(t) {
      currentTopic = t || null;
      try {
        if (currentTopic) localStorage.setItem('mangoi_aifriend_topic', currentTopic.id);
        else localStorage.removeItem('mangoi_aifriend_topic');
      } catch (e) {}
      renderTopicBar();
    }
    /* 🗺 대화 도중 주제를 바꾸고 싶을 때 — 카드를 대화 맨 아래에 다시 띄운다(기록은 안 지움) */
    function showTopicPicker() {
      const chat = document.getElementById('chat');
      if (!chat) return;
      const old = document.getElementById('topicPicker');
      if (old) old.remove();
      const en = isEn();
      const box = document.createElement('div');
      box.id = 'topicPicker';
      box.style.cssText = 'margin:10px 0 4px';
      box.innerHTML = '<p style="color:var(--text2);font-size:12px;font-weight:800;margin:0 0 8px;text-align:center">'
        + (en ? 'Pick a new topic:' : '새 주제를 골라볼까요?') + '</p>'
        + '<div class="topics">' + TOPICS.map((t, i) =>
            '<div class="topic-card" onclick="topicSend(' + i + ')"><span class="t-emoji">' + t.e
            + '</span><span class="t-name">' + escapeHtml(en ? t.en : t.ko) + '</span></div>').join('')
        + '</div>';
      chat.appendChild(box);
      chat.scrollTop = chat.scrollHeight;
    }
    function renderEmpty() {
      const chat = document.getElementById('chat');
      const en = isEn();
      const cards = TOPICS.map((t, i) =>
        '<div class="topic-card" onclick="topicSend(' + i + ')"><span class="t-emoji">' + t.e + '</span><span class="t-name">' + escapeHtml(en ? t.en : t.ko) + '</span></div>'
      ).join('');
      chat.innerHTML = '<div class="empty-state">'
        + '<div class="hero-mango"><img src="/img/mango-char.png" alt="Mango" loading="lazy" decoding="async"/></div>'
        + "<h2>👋 Hi! I'm Mango</h2>"
        + '<p>' + (en ? "Let's chat in English! Every message earns points ⭐" : "Let's chat in English! 한 마디 할 때마다 포인트가 쌓여요 ⭐") + '</p>'
        /* 🧑 친구 고르기를 주제보다 «먼저» 둔다 — 누구와 이야기할지가 먼저고 무슨 이야기를 할지가 그다음이다.
           고르지 않고 주제만 눌러도 그대로 진행된다(관문이 아니라 안내). */
        + '<p style="color:var(--text2)">' + (en ? 'Who do you want to talk with?' : '오늘은 누구랑 이야기할까요?') + '</p>'
        + friendCards()
        + '<p style="color:var(--text2);margin-top:16px">' + (en ? 'Pick an adventure topic:' : '모험 주제를 골라볼까요?') + '</p>'

  #tavatar-status{ font-size:10px; padding:2px 8px; }
  .top{ padding:6px 14px; }
  .top .mango-icon{ width:28px; height:28px; }

  .quest, .q-label{ font-size:11px; }

  .input-bar{ padding:6px 12px; }
  .input-bar input{ padding:9px 12px; font-size:15px; }

  .input-bar button[type=submit]{ font-size:14px; }

}

/* ② 설정·퀘스트는 기본으로 접어 둔다 (⚙ 버튼으로 펼침) */
body:not(.opts-open) .opts,
body:not(.opts-open) .quests{ display:none; }

/* ⚙ 토글 버튼 — 헤더의 다른 버튼과 같은 모양 */
.opts-toggle{ background:rgba(148,163,184,0.16); color:#e2e8f0;
  border:1px solid rgba(148,163,184,0.35); border-radius:10px;
  padding:6px 10px; font-size:12px; font-weight:800; cursor:pointer;
  white-space:nowrap; flex-shrink:0; display:inline-flex; align-items:center; gap:5px; }
.opts-toggle .ot-sum{ color:var(--gold); font-weight:900; }
body.opts-open .opts-toggle{ background:rgba(251,191,36,0.18); border-color:rgba(251,191,36,0.5); }
@media (min-width:760px){ .opts-toggle{ font-size:14px; padding:8px 13px; } }

/* ③ 대화창이 확실히 주인공이 되게 — 남는 높이를 모두 가져간다 */
.chat{ flex:1 1 auto; min-height:0; }

/* 🚀 (2026-08-02) 하단 '다음 활동 고르기' — 입력줄 바로 아래 한 줄.
   높이를 최소로 쓰려고 알약형 얇은 버튼 하나만 둔다(입력줄과 같은 배경으로 이어 붙임).
   (2026-08-03 next-bottom-pc) 원래 폰 전용이었으나 PC에서는 헤더의 🚀 아이콘만 남아
   "다음 활동" 문이 안 보인다는 지적 — 라벨 있는 이 버튼을 모든 폭에서 보여준다. */
.next-bottom{ display:flex; justify-content:center; flex-shrink:0;
  padding:0 12px 8px; background:rgba(20,33,59,0.98); }
.next-bottom button{ width:100%; max-width:420px; padding:8px 14px; line-height:1.25;
  background:rgba(56,189,248,0.14); color:#7dd3fc;
  border:1px solid rgba(56,189,248,0.45); border-radius:999px;
  font-size:14px; font-weight:800; font-family:inherit; cursor:pointer;
  transition:background .15s, transform .12s; }
.next-bottom button:hover{ background:rgba(56,189,248,0.24); }
.next-bottom button:active{ transform:scale(.98); }
@media (max-width:760px){
  .next-bottom{ padding:0 12px 6px; }
  .next-bottom button{ padding:6px 12px; font-size:13px; }
}
/* 눕힌 폰처럼 세로가 짧을 땐 더 얇게 */
@media (max-height:520px){
  .next-bottom{ padding:0 10px 4px; }
  .next-bottom button{ padding:4px 10px; font-size:12px; }
}
</style>
<script>
/* ⚙ 설정/퀘스트 접기 토글 — 마크업은 건드리지 않고 여기서 버튼만 끼워 넣는다.
   접힘 상태에서도 지금 레벨을 버튼에 함께 보여줘(예: "⚙ B1") 뭘 고르고 있는지 알 수 있게. */
(function(){
  var KEY = 'mangoi_aifriend_opts_open';
  function apply(open){
    document.body.classList.toggle('opts-open', !!open);
    try { localStorage.setItem(KEY, open ? '1' : '0'); } catch(e){}
  }
  /* 접힘 상태의 요약 — 레벨 + (자막을 가려 놨으면) 👁 표시.
     ⚠️ 자막을 끈 학생에게 **되돌아올 길이 보여야** 한다. 설정 줄은 기본이 접힘이라,
        표시가 없으면 "글자가 안 보이는데 어디서 켜지?" 가 되고 그건 끄기만 있고 켜기가 없는 것과 같다. */
  function summary(){
    var lv = document.querySelector('.opts .opt.active[data-level]');
    var sb = document.querySelector('.opts .opt.active[data-sub]');
    var s = lv ? lv.textContent.trim() : '';
    if (sb && sb.dataset.sub !== 'on') s = (s ? s + ' ' : '') + '👁';
    return s;
  }
  function init(){
    var top = document.querySelector('.top');
    if (!top || document.querySelector('.opts-toggle')) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opts-toggle';
    btn.title = '레벨·스타일·속도·목소리 설정과 오늘의 퀘스트 열기/닫기';
    btn.setAttribute('data-ko-title', '레벨·스타일·속도·목소리 설정과 오늘의 퀘스트 열기/닫기');
    btn.setAttribute('data-en-title', 'Show/hide settings and daily quests');
    btn.innerHTML = '⚙ <span class="ot-sum"></span>';
    function paint(){ btn.querySelector('.ot-sum').textContent = summary(); }
    btn.onclick = function(){
      apply(!document.body.classList.contains('opts-open'));
      paint();
    };
    /* 소리 버튼 앞에 둔다 — 대화 초기화(빨간 버튼) 옆이면 잘못 누르기 쉽다 */
    var anchor = top.querySelector('.snd-toggle');
    if (anchor) top.insertBefore(btn, anchor); else top.appendChild(btn);

    var saved = '0';
    try { saved = localStorage.getItem(KEY) || '0'; } catch(e){}
    apply(saved === '1');
    paint();
    /* 레벨·자막을 바꾸면 요약 글자도 따라 바뀌게 */
    document.querySelectorAll('.opts .opt[data-level], .opts .opt[data-sub]').forEach(function(o){
      o.addEventListener('click', function(){ setTimeout(paint, 0); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  /* 📐 아바타 카드 높이 다시 맞추기.
     mango-avatar.js 는 '폭 ÷ 비율' 로 높이를 계산해 인라인으로 한 번 박아 넣는다. 위에서
     화면 크기에 따라 폭을 바꾸게 했으므로, 폰을 가로↔세로로 돌리면 옛 높이가 남아 얼굴이
     찌그러진다(회전만 하면 그 계산이 다시 돌지 않는다). 비율은 캔버스 크기가 알고 있다. */
  function refitAvatar(){
    var ring = document.getElementById('tavatar-ring');
    var cv = document.getElementById('tavatar-canvas');
    if (!ring || !cv || !cv.width || !cv.height) return;
    var w = ring.getBoundingClientRect().width;
    if (!w) return;
    ring.style.height = Math.round(w * (cv.height / cv.width)) + 'px';
  }
  var rt;
  function scheduleRefit(){ clearTimeout(rt); rt = setTimeout(refitAvatar, 120); }
  window.addEventListener('resize', scheduleRefit);
  window.addEventListener('orientationchange', scheduleRefit);
  /* 카드 '폭'이 바뀌는 순간을 직접 지켜본다 — resize 이벤트가 오지 않는 상황(주소창 접힘,
     화면분할 등)에서도 확실히 다시 맞춰진다. 높이를 고쳐 다시 불려도 목표값과 같으면
     아무것도 하지 않으므로 되풀이(무한 루프)에 빠지지 않는다. */
  if (window.ResizeObserver) {
    var lastW = 0;
    var ro = new ResizeObserver(function(entries){
      var w = Math.round(entries[0].contentRect.width);
      if (w && w !== lastW) { lastW = w; refitAvatar(); }
    });
    var target = document.getElementById('tavatar-ring');
    if (target) ro.observe(target);
  }
  setTimeout(refitAvatar, 800);   // 아바타 스크립트가 준비된 뒤 한 번
})();
</script>
