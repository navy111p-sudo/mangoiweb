<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.i학습 사용설명서 — 망고아이</title>
<meta name="description" content="망고아이 A.i 학습 11가지를 무엇을 · 언제 · 어떻게 쓰는지 한눈에 정리한 원장님·선생님용 안내서">
<link rel="icon" href="/mangoi-favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f1d3a">
<!--
  📖 A.i학습 사용설명서 — 원장님·선생님용 (2026-10-28 사장님 지시)

  [왜 있나]
    처음 망고아이 A.i 학습을 접하는 학원이 생겼는데, 11가지 도구를 «어떻게 쓰는지» 한 곳에 모은
    안내가 없었다. 원장님께 이 주소(https://mangoi.ai/ai-guide.html) 하나만 보내 드리면 되게 만든다.
    홈 「AI와 친구하기」 목록 제목 아래 «📖 A.i학습 사용설명서» 단추가 여기로 온다(js/idx-allmenu.js).

  [어떻게 만들었나]
    · 문구는 전부 맨 아래 인라인 스크립트의 데이터(TXT · GROUPS · TOOLS · WEEK · FAQ) 한 곳에 KO/EN 짝으로 있다.
      화면은 그 데이터를 그리기만 한다 → 문구를 고칠 때는 데이터만 고친다.
    · 화면 사진은 /img/ai-guide/*.webp (로컬 서버 + 크로미움으로 찍은 실제 화면, 2026-10-28).
      그 화면이 크게 바뀌면 사진도 다시 찍을 것.
    · 수업일·주간 순서(USE · WEEK)는 서버 정본 src/today-plan.ts 의 CLASS_DAY · HOME_WEEK 를 옮겨 적은 것이다
      (CLASS_DAY.home 의 scene = «교재 낱말 쓰기», 금요일 write 가 낮은 밴드에서 AI 친구로 바뀌는 규칙은 문장으로 적음).
      ⚠️ 그 표가 바뀌면 여기도 함께.
    · 판단력 맛보기 상한 숫자는 적지 않는다 — src/judgment-sample-gate.ts 가 «화면에 복제하지 말 것» 이라 못 박았다.

  [규칙]
    · data-ko/data-en 을 쓰지 않는다 — 공용 i18n 엔진이 textContent 를 통째로 갈아 끼워 굵은 글씨·아이콘이
      사라진다(CLAUDE.md 2장). 대신 «mangoi:lang-changed» 를 듣고 이 화면이 직접 다시 그린다.
    · 이모지는 Unicode 13 미만만(Win10 두부 방지 — CLAUDE.md 1-4).
    · 서버를 부르지 않는다(로그인 불필요 · 누구나 열람). 원장님이 카톡으로 받아 바로 열 수 있어야 한다.
-->
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<script src="/js/mango-i18n.js" defer></script>
<script defer src="/js/back-nav.js"></script>
<style>
  :root{
    --bg:#fbf7ee; --paper:#ffffff; --ink:#1b2437; --ink2:#465166; --muted:#77819a; --line:#ebe2cf;
    --navy:#0f1d3a; --navy2:#1c3264; --gold:#fbbf24; --gold2:#f59e0b; --goldink:#8a5800; --goldbg:#fff4d6;
    --learn:#2563eb; --learnbg:#eaf1ff; --speak:#e2580c; --speakbg:#fff0e5;
    --write:#0a8a60; --writebg:#e3f5ec; --play:#7c3aed; --playbg:#f1eaff;
    --shadow:0 12px 30px -18px rgba(15,29,58,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1428; --paper:#121e38; --ink:#eef2fb; --ink2:#c4cde0; --muted:#94a0ba; --line:#26355a;
      --goldink:#fcd34d; --goldbg:rgba(251,191,36,.13);
      --learn:#86adff; --learnbg:rgba(37,99,235,.2); --speak:#ff9a5c; --speakbg:rgba(226,88,12,.18);
      --write:#45d6a0; --writebg:rgba(10,138,96,.2); --play:#bd9cff; --playbg:rgba(124,58,237,.22);
      --shadow:0 12px 30px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1428; --paper:#121e38; --ink:#eef2fb; --ink2:#c4cde0; --muted:#94a0ba; --line:#26355a;
    --goldink:#fcd34d; --goldbg:rgba(251,191,36,.13);
    --learn:#86adff; --learnbg:rgba(37,99,235,.2); --speak:#ff9a5c; --speakbg:rgba(226,88,12,.18);
    --write:#45d6a0; --writebg:rgba(10,138,96,.2); --play:#bd9cff; --playbg:rgba(124,58,237,.22);
    --shadow:0 12px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
    font-family:MangoiHanSC,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;
    -webkit-text-size-adjust:100%}
  a{color:inherit}
  img{max-width:100%}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  /* ── 머리 ── */
  .hero{background:radial-gradient(120% 90% at 85% 0%,#2a4789 0%,var(--navy2) 38%,var(--navy) 78%);color:#fdf6e3;
    padding:64px 0 72px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;inset:auto -10% -58px -10%;height:90px;background:var(--bg);border-radius:50% 50% 0 0}
  .hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
  .hero-char{width:118px;height:auto;filter:drop-shadow(0 10px 22px rgba(245,158,11,.4))}
  .eyebrow{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.5);
    color:#fde68a;font-size:13px;font-weight:800;letter-spacing:.02em}
  .hero h1{margin:10px 0 8px;font-size:40px;line-height:1.15;font-weight:900;letter-spacing:-.03em}
  .hero h1 b{color:var(--gold)}
  .hero .lead{margin:0;max-width:600px;font-size:16.5px;color:#e6dcc0}
  .hero-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
  .hero-chips span{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13.5px;font-weight:700;color:#f4ecd6}
  .hero-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;font:inherit;font-size:15.5px;font-weight:900;
    text-decoration:none;cursor:pointer;border:0}
  .btn-gold{background:linear-gradient(135deg,#fde68a,var(--gold) 55%,var(--gold2));color:#1a1a1a;box-shadow:0 10px 22px -10px rgba(245,158,11,.8)}
  .btn-gold:hover{background:#fde68a}
  .btn-ghost{background:rgba(255,255,255,.1);color:#fdf6e3;border:1px solid rgba(255,255,255,.25)}
  .btn-ghost:hover{background:rgba(255,255,255,.18)}

  /* ── 공통 구역 ── */
  section{margin:34px 0}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px}
  .sec-head h2{margin:0;font-size:25px;font-weight:900;letter-spacing:-.02em}
  .sec-head h2 .n{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:8px;border-radius:11px;
    background:var(--navy);color:var(--gold);font-size:17px;vertical-align:3px}
  .sec-head p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}

  /* ── 한눈에 보기 ── */
  .glance{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .gbox{padding:16px 14px 12px;border-radius:20px;background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--gc);box-shadow:var(--shadow);min-width:0}
  .gbox h3{margin:0;font-size:17px;font-weight:900;color:var(--gc)}
  .gbox p{margin:4px 0 10px;font-size:13px;color:var(--ink2);line-height:1.45}
  .gtile{display:flex;align-items:center;gap:10px;padding:8px 8px;margin:0 -4px;border-radius:12px;text-decoration:none;font-size:14.5px;font-weight:800}
  .gtile:hover{background:var(--gbg)}
  .gtile .ic{flex:0 0 auto;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--gbg);color:var(--gc)}
  .gtile .ic svg{width:21px;height:21px}
  .gtile .ic img{width:27px;height:27px;object-fit:contain}
  .g-learn{--gc:var(--learn);--gbg:var(--learnbg)} .g-speak{--gc:var(--speak);--gbg:var(--speakbg)}
  .g-write{--gc:var(--write);--gbg:var(--writebg)} .g-play{--gc:var(--play);--gbg:var(--playbg)}

  /* ── 시작 3단계 ── */
  .steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:s}
  .s3{position:relative;padding:20px 18px 18px;min-width:0}
  .s3 .big{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,#fde68a,var(--gold) 60%,var(--gold2));color:#1a1a1a;font-size:22px;font-weight:900;margin-bottom:10px}
  .s3 h3{margin:0 0 4px;font-size:18px;font-weight:900}
  .s3 p{margin:0;font-size:14.5px;color:var(--ink2)}
  .s3 p b{color:var(--ink)}
  .s3:not(:last-child):after{content:"";position:absolute;right:-12px;top:42px;width:12px;height:2px;background:var(--gold2)}
  .need{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
  .need div{padding:14px 12px;border-radius:16px;background:var(--goldbg);border:1px dashed rgba(245,158,11,.55);min-width:0}
  .need .e{font-size:26px;line-height:1}
  .need b{display:block;margin:6px 0 2px;font-size:15px}
  .need span{display:block;font-size:13px;color:var(--ink2);line-height:1.45}
  .callout{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--learnbg);color:var(--ink);font-size:14.5px}
  .callout .e{font-size:20px;line-height:1.3}

  /* ── 도구 카드 ── */
  .group-title{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
  .group-title .pill{padding:6px 14px;border-radius:99px;background:var(--gc);color:#fff;font-size:15px;font-weight:900}
  .group-title p{margin:0;color:var(--ink2);font-size:14.5px}
  /* 바로가기로 왔을 때 위쪽 고정 단추(← · 홈 · EN)에 카드 제목이 가리지 않게 */
  .tool{padding:20px;margin-bottom:14px;border-left:6px solid var(--gc);scroll-margin-top:60px}
  .tool-top{display:flex;align-items:flex-start;gap:14px}
  .tool-top .ic{flex:0 0 auto;width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:var(--gbg);color:var(--gc)}
  .tool-top .ic svg{width:31px;height:31px}
  .tool-top .ic img{width:44px;height:44px;object-fit:contain}
  .tool-top h3{margin:0;font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.3}
  .tool-top h3 .no{color:var(--gc);margin-right:6px}
  .tool-top .one{margin:3px 0 0;color:var(--ink2);font-size:15px}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .badges span{padding:3px 10px;border-radius:99px;background:var(--gbg);color:var(--gc);font-size:12.5px;font-weight:800;white-space:nowrap}
  .badges span.new{background:linear-gradient(135deg,#fde68a,var(--gold));color:#1a1a1a}
  .tool-body{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;margin-top:16px;align-items:start}
  .how h4,.extra h4{margin:0 0 8px;font-size:15px;font-weight:900;color:var(--gc)}
  .how ol{list-style:none;margin:0;padding:0;counter-reset:st}
  .how li{position:relative;padding:0 0 12px 40px;font-size:15.5px;counter-increment:st;min-height:30px}
  .how li:before{content:counter(st);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--gc);color:#fff;
    font-size:14.5px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .how li:not(:last-child):after{content:"";position:absolute;left:13px;top:29px;bottom:2px;width:2px;background:var(--gbg)}
  .how li b{color:var(--ink);background:var(--gbg);padding:0 4px;border-radius:5px}
  .extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .extra div{padding:11px 13px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:14px;color:var(--ink2);min-width:0}
  .extra .lbl{display:block;color:var(--ink);font-size:14px;font-weight:900;margin-bottom:2px}
  .extra div b{color:var(--ink)}
  .phone{margin:0;text-align:center}
  .phone .frame{display:block;padding:7px;border-radius:30px;background:#0b1020;box-shadow:0 18px 32px -16px rgba(0,0,0,.55);border:1px solid #2b3550}
  .phone img{display:block;width:100%;height:auto;aspect-ratio:390/700;object-fit:cover;object-position:top;border-radius:23px;background:#16213d}
  .phone figcaption{margin-top:7px;font-size:12.5px;color:var(--muted)}
  .go{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:8px 14px;border-radius:11px;background:var(--gbg);color:var(--gc);
    font-size:14px;font-weight:900;text-decoration:none}
  .go:hover{filter:brightness(.97)}

  /* ── 학원 활용 ── */
  .day{padding:20px}
  .day h3{margin:0 0 4px;font-size:19px;font-weight:900}
  .day > p{margin:0 0 14px;color:var(--ink2);font-size:14.5px}
  .flow{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap}
  .fstop{flex:1 1 0;min-width:0;padding:14px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-align:center}
  .fstop.main{background:var(--navy);border-color:var(--navy);color:#fdf6e3}
  .fstop .when{font-size:12.5px;font-weight:900;color:var(--goldink);letter-spacing:.02em}
  .fstop.main .when{color:var(--gold)}
  .fstop .what{display:block;margin-top:4px;font-size:15px;font-weight:900}
  .fstop .min{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
  .fstop.main .min{color:#cbd5e1}
  .farrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--gold2);font-weight:900}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .wd{padding:10px 6px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:center;min-width:0}
  .wd .d{display:block;font-weight:900;font-size:15px;margin-bottom:6px}
  .wd.sun .d{color:#dc2626} .wd.sat .d{color:var(--learn)}
  .wd span.t{display:block;margin:4px 0;padding:4px 2px;border-radius:9px;font-size:12px;font-weight:800;line-height:1.3}
  .ideas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
  .idea{padding:16px;min-width:0}
  .idea .e{font-size:26px;line-height:1}
  .idea h4{margin:8px 0 4px;font-size:16px;font-weight:900}
  .idea p{margin:0;font-size:14px;color:var(--ink2)}

  /* ── 자주 묻는 질문 ── */
  .faq details{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:var(--shadow)}
  .faq summary{list-style:none;cursor:pointer;padding:15px 46px 15px 16px;font-size:16px;font-weight:900;position:relative}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
    background:var(--goldbg);color:var(--goldink);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
  .faq details[open] summary:after{content:"\2212"}
  .faq .a{padding:0 16px 16px;font-size:15px;color:var(--ink2)}
  .faq .a b{color:var(--ink)}

  .foot{margin:40px 0 0;padding:28px 0 60px;background:var(--navy);color:#e6dcc0;text-align:center}
  .foot h2{margin:0 0 6px;color:#fdf6e3;font-size:21px}
  .foot p{margin:4px 0;font-size:14px}
  .foot .btn{margin-top:12px}
  .foot small{display:block;margin-top:18px;color:#94a3b8;font-size:12.5px}

  @media (max-width:860px){
    .glance{grid-template-columns:repeat(2,minmax(0,1fr))}
    .need{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ideas{grid-template-columns:1fr}
  }
  @media (max-width:680px){
    .hero{padding:58px 0 62px}
    .gbox{padding:14px 10px 10px}
    .gtile{font-size:13.5px;gap:8px;padding:7px 6px}
    .gtile .ic{width:32px;height:32px}
    .hero .wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
    .hero-char{width:96px}
    .hero h1{font-size:31px}
    .hero .lead{font-size:15.5px}
    .hero-chips,.hero-btns{justify-content:center}
    .sec-head{display:block}
    .sec-head p{margin-top:4px}
    .sec-head h2{font-size:22px}
    .steps3{grid-template-columns:1fr}
    .s3:not(:last-child):after{right:auto;left:40px;top:auto;bottom:-12px;width:2px;height:12px}
    .tool{padding:16px}
    .tool-top h3{font-size:19px}
    .tool-body{grid-template-columns:1fr}
    .phone{max-width:200px;margin:0 auto}
    .extra{grid-template-columns:1fr}
    .flow{flex-direction:column}
    .farrow{flex-basis:20px;transform:rotate(90deg)}
    .week{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (max-width:380px){
    .glance{grid-template-columns:1fr}
    .need{grid-template-columns:1fr}
  }

  /* ── 인쇄(A4) — 밝은 색으로, 단추·떠 있는 막대는 빼고 ── */
  @page{size:A4;margin:12mm}
  @media print{
    :root{--bg:#fff;--paper:#fff;--ink:#111827;--ink2:#374151;--muted:#6b7280;--line:#e5e7eb;--shadow:none;
      --goldink:#8a5800;--goldbg:#fff4d6;--learn:#2563eb;--learnbg:#eaf1ff;--speak:#e2580c;--speakbg:#fff0e5;
      --write:#0a8a60;--writebg:#e3f5ec;--play:#7c3aed;--playbg:#f1eaff}
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    #mangoi-global-bar,#mangoi-back-btn,.mangoi-back-btn,.no-print,.hero-btns,.go{display:none!important}
    .hero{padding:24px 0 26px}
    .hero:after{display:none}
    .tool,.gbox,.s3,.day,.idea,.faq details{break-inside:avoid}
    .group-title,.sec-head{break-after:avoid}
    .faq details .a{display:block}
    /* 카드 한 장이 반 쪽을 넘으면 쪽마다 1장씩 남고 빈칸이 생긴다 — 인쇄에서는 작게 */
    section{margin:20px 0}
    .glance{grid-template-columns:repeat(4,minmax(0,1fr))}
    .group-title{margin:14px 0 8px}
    .tool{padding:12px 14px;margin-bottom:8px}
    .tool-top{gap:10px}
    .tool-top .ic{width:42px;height:42px;border-radius:13px}
    .tool-top .ic svg{width:24px;height:24px}
    .tool-top .ic img{width:32px;height:32px}
    .tool-top h3{font-size:17px}
    .tool-top .one{font-size:12.5px}
    .badges{margin-top:5px}
    .badges span{font-size:10.5px;padding:1px 8px}
    .tool-body{grid-template-columns:minmax(0,1fr) 108px;gap:14px;margin-top:8px}
    .phone{max-width:108px}

      ['로그인을 안 해도 되나요?', '대부분 로그인 없이도 해 볼 수 있어요. 하지만 <b>로그인해야</b> 학생 레벨에 맞는 문제가 나오고 기록이 남아요. <b>포인트</b>도 대부분 로그인한 학생에게 쌓이고, 기프티콘 교환은 로그인한 학생만 돼요. (판단력 훈련은 로그인하지 않으면 하루 몇 문제만 맛보기로 풀 수 있어요.)'],
      ['마이크가 안 돼요', '① 처음 뜨는 창에서 <b>허용</b>을 눌렀는지 확인해요.<br>② 이미 막았다면 주소창 왼쪽 <b>🔒 자물쇠 → 마이크 → 허용</b>.<br>③ 카톡 안에서 열었다면 <b>크롬 · 사파리</b>로 다시 열어요.<br>④ 통화 · 녹음 앱이 마이크를 쓰고 있지 않은지 봐요.'],
      ['소리가 안 들려요', '휴대폰 <b>무음 모드</b>와 볼륨을 확인해요. 아이폰은 옆쪽 무음 스위치도 확인! 화면 안의 <b>🔊</b> 버튼이 꺼져 있지 않은지도 봐 주세요.'],
      ['너무 쉬워요 / 너무 어려워요', 'A.i 말하기 연습 · AI 친구 · AI 영작 · AI 음성코치 · A.i 독서는 <b>화면에서 단계를 직접</b> 고를 수 있어요. 판단력 훈련은 AI가 알아서 맞춰 주고, 문제 아래 <b>문장이 너무 어려워요 / 너무 쉬워요</b> 버튼도 있어요. 학생 레벨 자체를 바꾸려면 망고아이에 말씀해 주세요.'],
      ['포인트는 어디에 쓰나요?', '로그인한 학생이 퀴즈 · 영작 · AI 친구 등을 하면 포인트가 쌓여요. <b>1포인트 = 1원</b>이고, <b>3,000P</b>부터 홈 화면의 <b>🎁 포인트상점</b>에서 기프티콘으로 바꿀 수 있어요. 하루에 쌓을 수 있는 양은 정해져 있어요. (학생게임은 포인트 대신 게임 안에서 쓰는 코인을 모아요.)'],
      ['휴대폰으로도 되나요?', '네! 모든 화면이 휴대폰 · 태블릿 · PC에서 돼요. 말하기 활동은 이어폰을 끼면 더 잘 알아들어요. A.i 독서처럼 진도가 기기에 저장되는 활동은 같은 기기로 이어서 해 주세요.'],
      ['중국어도 되나요?', 'A.i 말하기 연습 · AI 음성코치 · 학생게임은 <b>중국어</b>도 고를 수 있어요. 중국어를 배우는 학생에게는 <b>중국어퀴즈</b> 카드가 하나 더 보여요.'],
      ['우리 학원 학생들이 얼마나 했는지 볼 수 있나요?', '로그인한 상태로 한 활동은 학생 계정에 기록돼요. 학원별 사용 현황이 궁금하시면 망고아이에 요청해 주세요. 본사에서 확인해 드려요.']
    ],
    en: [
      ['Do students need to log in?', 'Most activities can be tried without logging in. But <b>logging in</b> gives questions at the student\'s level and saves records. Most <b>points</b> also go to logged-in students, and only logged-in students can swap points for gift cards. (Without login, Decision Training is a short daily sample.)'],
      ['The mic doesn\'t work', '① Make sure you tapped <b>Allow</b> on the first pop-up.<br>② If you blocked it, tap the <b>🔒 lock</b> left of the address bar <b>→ Microphone → Allow</b>.<br>③ If you opened it inside KakaoTalk, reopen it in <b>Chrome or Safari</b>.<br>④ Check that no call or recording app is using the mic.'],
      ['I can\'t hear anything', 'Check <b>silent mode</b> and the volume. On iPhone, check the side silent switch too. Also make sure the <b>🔊</b> button on the screen isn\'t turned off.'],
      ['It\'s too easy / too hard', 'In A.i Speaking Practice, AI Friend, AI Writing, AI Voice Coach and A.i Reading you can <b>pick the level on screen</b>. Decision Training adjusts itself, and has <b>Sentences are too hard / Too easy</b> buttons under each question. To change a student\'s level itself, please contact Mangoi.'],
      ['What are points for?', 'Logged-in students earn points from quizzes, writing, AI Friend and more. <b>1 point = 1 won</b>, and from <b>3,000P</b> they can swap points for gift cards in the <b>🎁 Point Shop</b> on the home screen. There is a daily limit. (Student Games collect in-game coins instead of points.)'],
      ['Does it work on phones?', 'Yes! Every screen works on phones, tablets and PCs. For speaking, earphones help the AI hear better. For activities that save progress on the device (like A.i Reading), keep using the same device.'],
      ['Is Chinese available?', 'A.i Speaking Practice, AI Voice Coach and Student Games also offer <b>Chinese</b>. Students learning Chinese see one more card: <b>Chinese Quiz</b>.'],
      ['Can we see how much our students used it?', 'Activities done while logged in are saved to the student\'s account. If you\'d like usage numbers for your academy, just ask Mangoi — head office will check for you.']
    ]
  };

  function lang(){
    var l = 'ko';
    try {
      if (typeof window.getLang === 'function') l = window.getLang();
      else l = localStorage.getItem('mangoi_lang') || 'ko';
    } catch (e) {}
    return l === 'en' ? 'en' : 'ko';
  }
  function $(id){ return document.getElementById(id); }
  function groupOf(id){ for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i]; return null; }

  function renderHero(t){
    $('h-eyebrow').textContent = t.eyebrow;
    $('h-title').innerHTML = t.title;
    $('h-lead').textContent = t.lead;
    $('h-chips').innerHTML = t.chips.map(function(c){ return '<span>' + c + '</span>'; }).join('');
    $('h-try').textContent = t.tryBtn;
    $('h-print').textContent = t.printBtn;
  }

  function renderGlance(L){
    $('glance-grid').innerHTML = GROUPS.map(function(g){
      var tiles = TOOLS.filter(function(x){ return x.g === g.id; }).map(function(x){
        return '<a class="gtile" href="#t-' + x.id + '"><span class="ic">' + IC[x.icon] + '</span><span>' + x[L].name + '</span></a>';
      }).join('');
      return '<div class="gbox g-' + g.id + '"><h3>' + g[L].name + '</h3><p>' + g[L].desc + '</p>' + tiles + '</div>';
    }).join('');
  }

  function renderStart(L){
    var s = START[L];
    $('start-steps').innerHTML = s.steps.map(function(x, i){
      return '<div class="card s3"><span class="big">' + (i + 1) + '</span><h3>' + x[0] + '</h3><p>' + x[1] + '</p></div>';
    }).join('');
    $('start-need').innerHTML = s.need.map(function(x){
      return '<div><span class="e" aria-hidden="true">' + x[0] + '</span><b>' + x[1] + '</b><span>' + x[2] + '</span></div>';
    }).join('');
    $('start-callout').innerHTML = '<span class="e" aria-hidden="true">🎤</span><span>' + s.callout + '</span>';
  }

  function renderTools(L, t){
    var n = 0;
    $('tool-list').innerHTML = GROUPS.map(function(g){
      var cards = TOOLS.filter(function(x){ return x.g === g.id; }).map(function(x){
        n++;
        var c = x[L];
        var badges = [];
        if (x.isNew) badges.push('<span class="new">' + t.newB + '</span>');
        if (x.min) badges.push('<span>⏱ ' + t.rec + x.min + t.min + '</span>');
        badges.push('<span>' + (x.mic === 'need' ? t.micNeed : (x.mic === 'opt' ? t.micOpt : t.noMic)) + '</span>');
        if (x.sound) badges.push('<span>' + t.sound + '</span>');
        if (x.pt) badges.push('<span>' + t.pts + '</span>');
        if (x.coin) badges.push('<span>' + t.coin + '</span>');
        return '<article class="card tool g-' + g.id + '" id="t-' + x.id + '">'
          + '<div class="tool-top"><span class="ic">' + IC[x.icon] + '</span><div>'
          +   '<h3><span class="no">' + (n < 10 ? '0' + n : n) + '</span>' + c.name + '</h3>'
          +   '<p class="one">' + c.one + '</p>'
          +   '<div class="badges">' + badges.join('') + '</div>'
          + '</div></div>'
          + '<div class="tool-body"><div>'
          +   '<div class="how"><h4>' + t.how + '</h4><ol>' + c.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('') + '</ol></div>'
          +   '<div class="extra"><div><span class="lbl">' + t.good + '</span>' + c.good + '</div><div><span class="lbl">' + t.tip + '</span>' + c.tip + '</div></div>'
          +   '<a class="go" href="' + x.url + '">' + t.open + '</a>'
          + '</div>'
          + '<figure class="phone"><span class="frame"><img src="/img/ai-guide/' + x.img + '.webp" alt="' + c.name + ' — ' + t.shot + '" loading="lazy" decoding="async" width="390" height="700"></span>'
          + '<figcaption>' + (c.cap || t.shot) + '</figcaption></figure>'
          + '</div></article>';
      }).join('');
      return '<div class="group-title g-' + g.id + '"><span class="pill">' + g[L].name + '</span><p>' + g[L].desc + '</p></div>' + cards;
    }).join('');
  }

  /* 주간표 칸은 좁아서 짧은 이름(sh)이 있으면 그것을 쓴다 */
  function toolName(id, L){
    for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i][L].sh || TOOLS[i][L].name;
    return id;
  }

  function renderUse(L){
    var u = USE[L];
    if (!u) return;
    $('use-class').innerHTML = '<h3>' + u.classT + '</h3><p>' + u.classP + '</p><div class="flow">'
      + u.flow.map(function(f, i){
          return (i ? '<span class="farrow" aria-hidden="true">▶</span>' : '')
            + '<div class="fstop' + (f.main ? ' main' : '') + '"><span class="when">' + f.when + '</span><span class="what">' + f.what + '</span><span class="min">' + f.min + '</span></div>';
        }).join('') + '</div>';
    $('use-home').innerHTML = '<h3>' + u.homeT + '</h3><p>' + u.homeP + '</p><div class="week">'
      + WEEK.map(function(w){
          var cls = w.d === 0 ? ' sun' : (w.d === 6 ? ' sat' : '');
          return '<div class="wd' + cls + '"><span class="d">' + u.days[w.d] + '</span>'
            + w.tools.map(function(k){
                var x = null; for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === k) x = TOOLS[i];
                var g = x ? x.g : 'play';
                return '<span class="t g-' + g + '" style="background:var(--gbg);color:var(--gc)">' + toolName(k, L) + '</span>';
              }).join('') + '</div>';
        }).join('') + '</div>';
    $('use-ideas').innerHTML = u.ideas.map(function(x){
      return '<div class="card idea"><span class="e" aria-hidden="true">' + x[0] + '</span><h4>' + x[1] + '</h4><p>' + x[2] + '</p></div>';
    }).join('');
  }

  function renderFaq(L){
    $('faq-list').innerHTML = FAQ[L].map(function(q){
      return '<details><summary>' + q[0] + '</summary><div class="a">' + q[1] + '</div></details>';
    }).join('');
  }

  function render(){
    var L = lang(), t = TXT[L];
    document.documentElement.lang = L;
    document.title = t.docTitle;
    renderHero(t);
    $('s1-t').innerHTML = t.s1t; $('s1-p').textContent = t.s1p;
    $('s2-t').innerHTML = t.s2t; $('s2-p').textContent = t.s2p;
    $('s3-t').innerHTML = t.s3t; $('s3-p').textContent = t.s3p;
    $('s4-t').innerHTML = t.s4t; $('s4-p').textContent = t.s4p;
    $('s5-t').innerHTML = t.s5t; $('s5-p').textContent = t.s5p;
    renderGlance(L);
    renderStart(L);
    renderTools(L, t);
    renderUse(L);
    renderFaq(L);
    $('f-t').textContent = t.ftitle;
    $('f-p').textContent = t.fp;
    $('f-kakao').textContent = t.kakao;
    $('f-date').textContent = t.fdate;
  }

  /* 인쇄할 때는 «자주 묻는 질문» 을 모두 펼친다 */
  window.addEventListener('beforeprint', function(){
    var d = document.querySelectorAll('#faq details');
    for (var i = 0; i < d.length; i++) d[i].open = true;
  });
  $('h-print').addEventListener('click', function(){ window.print(); });
  /* 🌐 공용 바(js/mango-i18n.js)에서 언어를 바꾸면 이 화면이 직접 다시 그린다 */
  window.addEventListener('mangoi:lang-changed', render);
  render();
  /* 공용 엔진(defer)이 실린 뒤 그 엔진의 판정(getLang)으로 한 번 더 — 지금은 같은 키를 읽지만 갈라질 때를 대비 */
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
