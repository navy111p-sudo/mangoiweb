<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AI 말하기 — 망고아이</title>
  <link rel="icon" href="/mangoi-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/mangoi-han.css?v=2">
  <meta name="theme-color" content="#0b1026">
  <!-- 2026-11-03 개편 — 사장님 휴대폰 시안(카드 3장 + 아래 공통 설정).
       📘 교재로 연습 → /warmup.html · 🎯 상황별 말하기 → 이 화면 안 상황 목록 → /warmup.html?sit=… ·
       👫 AI 친구하기 → /ai-friend.html. 💬 자유대화 카드는 사장님 지시로 없앴다(교재 연습 화면의 «교정 정도: 자유대화» 로 같은 대화가 된다).
       상황 목록은 4단계 × 5개(어린이·청소년, 영어만) · 언어 칸은 화면 글자 한/영 · 상황 그림은 저장소에 이미 있는 AI 생성 사진.
       상황 표 정본 js/ai-situations.js · 공통 설정 정본 js/ai-speaking-settings.js.
       ⛔ 이 화면은 로그인·AI 호출·마이크를 쓰지 않는다. 설정은 «사람이 확인을 누를 때만» 저장한다.
       🪐 2026-11-03 2차 — 디자인 시안 C-4-1 «우주 탐험형»(초·중등 공용) 으로 겉모습만 바꿨다.
       밤하늘 배경 + 말하기 3가지를 «행성» 으로(교재=라임·고리, 상황=주황·달, AI 친구=하늘·위성).
       항상 어두운 화면이다(시스템 라이트 모드에서도) — 시안이 다크 전용이라서. 대비는 본문 7:1 이상.
       행성 그림은 Higgsfield(GPT Image 2.5) 로 만든 투명 그림을 320px WebP 로 줄여 저장소에 넣었다
       (/img/ai-speaking/planet-{textbook,situation,friend}.webp — 외부 주소를 쓰지 않는다. CLAUDE.md 2장).
       카드 제목의 이모지는 그림과 겹쳐 뺐다.
       ⛔ 2차에서 아래 스크립트(설정 읽기·쓰기·상황 목록)는 1차와 한 글자도 다르지 않았다 — 동작은 그대로였다(3차 변경은 바로 아래).
       💬 2026-11-03 3차 — «교정 정도» 버튼 바로 아래에 고른 단계의 뜻을 한 줄로 보여 준다(사장님 확정 A안 · ①설명형).
       바뀐 것은 renderSettings 의 #corrState 한 곳뿐이고, 저장 동작은 그대로다. 문구는 버튼의 data-hint-ko/en 에 있다.
       ✅ 2026-11-04 4차(사장님) — 아래 «저장했어요» 줄과 안내문을 없애고 «확인» 버튼을 뒀다.
       수준·교정은 눌러도 화면에만 고른 값(draft)이고, «확인» 을 눌러야 둘을 한꺼번에 저장한다
       (교재 연습·상황별 말하기·AI 친구 두 화면 키 함께).
       수준·교정이 비었거나 «화면마다 다름» 이면 버튼이 잠기고 무엇을 고를지 말한다. 저장 정본 js/ai-speaking-settings.js 는 그대로.
       🌐 같은 날 5차(사장님 「언어는 바로 저장되게 되돌려줘」) — 언어만 예전처럼 누르는 즉시 저장한다(확인과 무관).
       🚪 같은 날 6차(사장님 「확인 안 누르고 나가면 물어보게 해줘」) — 수준·교정을 바꿔 놓고 «확인» 없이 나가면 묻는다.
       화면 안 링크(홈·교재 연습·AI 친구·상황 카드)는 아래 #leaveAsk 창(적용하고 이동 · 적용 안 하고 이동 · 머무르기),
       뒤로가기·새로고침·탭 닫기는 브라우저 기본 확인창(beforeunload — 문구는 브라우저가 정한다. 아이폰 사파리는 이 창을 안 띄우는 것으로 알려져 있다 · 이 저장소에서 못 잼).
       사람이 이 화면에서 «만진» 칸만 묻는다(다른 탭이 바꾼 값을 «안 적용» 으로 보지 않는다).
       ▶ 같은 날 7차(사장님 「자유·균형·집중을 바꾸고 버튼 누르면 교재로 연습 안에서도 똑같이 자동으로」) —
       «연습 시작» 링크(data-start: 교재로 연습 · AI 친구하기 · 펼친 상황 하나하나)는 묻지 않고 «확인» 과 같은 저장을 한 뒤 그대로 간다.
       그래서 들어간 화면의 교정 정도가 여기서 고른 것과 같다. 홈(←) 처럼 «연습을 안 하고 나가는» 링크만 위 창으로 묻는다.
       수준·교정 중 하나가 비어 «확인» 이 잠긴 경우는 시작 링크도 창으로 묻는다(무엇을 고를지 말해야 하므로).
       저장이 막힌 기기면 머물러 «⚠️ 이 기기에선 저장이 안 돼요» 를 보이고, 다시 누르면 그대로 간다(6차 «적용하고 이동» 과 같다).
       📖 2026-11-04 8차(사장님 「적당한 곳에 누르면 보이게」) — «오늘은 …» 줄 오른쪽 «사용 안내» 버튼이
       사용 안내서(/ai-speaking-guide.html · 한 장 판, 초등 눈높이 · KO/EN · 인쇄·PDF·Word)를 이 화면 위 창(dialog)에 연다.
       화면 언어(ui)를 ?lang= 으로 넘기고, 창을 열 때만 iframe 을 불러온다(첫 화면 비용 0). 창을 못 여는 옛 브라우저는 같은 탭으로 간다.
       ⛔ 이 변경은 설정 읽기·쓰기·상황 목록 코드를 건드리지 않는다. -->
  <style>
    :root{--sky:#0b1026;--card:#161d3f;--card2:#1c2550;--line:#283160;--ring:#5b6bb5;--ink:#ffffff;--sub:#b8c1e6;--soft:#dde3ff;
      --lime:#c6f432;--orange:#ff9a3c;--cyan:#4dd8ff;--on:#0b1026;--focus:#fde68a}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html{background:var(--sky);color-scheme:dark}
    body{margin:0;min-height:100vh;background:var(--sky);color:var(--ink);
      font-family:MangoiHanSC,system-ui,sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
    /* ✨ 별 — 2px 점 하나에 그림자로 흩뿌림(그림자는 스크롤 폭에 안 잡힌다) */
    body::before{content:"";position:fixed;left:0;top:0;width:2px;height:2px;border-radius:50%;pointer-events:none;z-index:0;
      box-shadow:6vw 8vh #fff,18vw 3vh rgba(255,255,255,.6),34vw 12vh var(--lime),52vw 5vh rgba(255,255,255,.7),66vw 15vh #fff,
        78vw 40vh rgba(255,255,255,.5),92vw 30vh var(--cyan),3vw 46vh rgba(255,255,255,.6),24vw 64vh rgba(255,255,255,.5),
        60vw 72vh rgba(255,255,255,.45),96vw 58vh #fff,8vw 88vh var(--orange),48vw 95vh rgba(255,255,255,.6),88vw 92vh #fff}
    a{color:inherit}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    .ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:16px 18px calc(28px + env(safe-area-inset-bottom))}
    /* 🧭 머리 */
    header{display:flex;align-items:center;gap:12px;min-height:56px}
    header h1{margin:0;flex:1;min-width:0;font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
    header .home{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;
      border:1px solid var(--line);background:var(--card);text-decoration:none;font-size:15px;font-weight:700}
    .orbit{position:relative;flex:0 0 auto;width:68px;height:68px;border-radius:50%;border:2px dashed #3a4580;display:flex;align-items:center;justify-content:center}
    .orbit::after{content:"";position:absolute;right:2px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--lime)}
    .orbit .mascot{width:48px;height:48px;object-fit:contain;border-radius:50%;background:var(--card)}
    .lead{display:flex;align-items:flex-start;gap:6px;margin:10px 0 16px;color:var(--soft);font-size:15px;font-weight:600}
    .lead .star{width:18px;height:18px;margin-top:2px;fill:var(--lime);stroke:none}
    /* 📖 사용 안내 — «오늘은 …» 줄 오른쪽. 좁으면 다음 줄 오른쪽으로 내려간다 */
    .lead{flex-wrap:wrap}
    .guide-btn{margin-left:auto;align-self:center;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;
      border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:border-color .15s}
    .guide-btn:hover{border-color:var(--ring)}
    .guide-btn .ic{width:18px;height:18px;color:var(--lime)}
    #guideDlg{width:min(960px,calc(100vw - 24px));height:min(92vh,1100px);max-width:none;max-height:none;padding:0;
      border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);overflow:hidden}
    #guideDlg[open]{display:flex;flex-direction:column}
    #guideDlg::backdrop{background:rgba(5,8,22,.72)}
    .gd-head{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--line)}
    .gd-head h2{margin:0;flex:1;min-width:0;font-size:17px;font-weight:900}
    .gd-x{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sky);color:var(--ink);
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
    #guideFrame{flex:1;min-height:0;width:100%;border:0;background:#fff}
    /* 🪐 말하기 3가지 — 휴대폰: 가로 한 줄 카드 */
    .modes{display:grid;gap:12px}
    .mode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;min-width:0;
      padding:12px 14px 12px 8px;border-radius:26px;border:1px solid var(--line);background:var(--card);text-decoration:none;
      transition:border-color .15s}
    .mode:hover{border-color:var(--ring)}
    .mode[aria-expanded="true"]{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset}
    .mode h2{margin:0 0 4px;font-size:18px;font-weight:900;line-height:1.3}
    .mode p{margin:0;color:var(--sub);font-size:14px}
    .txt{min-width:0}
    .go{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--on)}
    .situ .go{background:var(--orange)} .friend .go{background:var(--cyan)}
    .go .ic{width:18px;height:18px;stroke-width:2.6}
    .go-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    /* 행성 그림(장식) — 정사각 투명 WebP */
    .art{flex:0 0 auto;width:80px;height:80px}
    .art img{display:block;width:100%;height:100%;object-fit:contain}
    /* 🎯 상황 목록 */
    #situations{margin-top:16px;padding:18px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
    #situations h3.title{margin:0 0 4px;font-size:18px;font-weight:900}
    #situations .hint{margin:0 0 6px;color:var(--sub);font-size:13.5px}
    .sit-g{margin:14px 0 8px;font-size:14px;color:var(--soft);font-weight:800}
    .sit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .sit{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card2);text-decoration:none;transition:border-color .15s}
    .sit:hover{border-color:var(--orange)}
    .sit-ic{font-size:26px;flex:0 0 auto;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#24305f}
    .sit-ic img{width:100%;height:100%;object-fit:cover}
    .sit b{display:block;font-size:15px}.sit small{display:block;color:var(--sub);font-size:12.5px}
    .sit-t{min-width:0}
    /* ⚙️ 공통 설정 */
    .sheet{margin-top:18px;padding:20px;border-radius:26px;background:var(--card);border:1px solid var(--line)}
    .sheet h2{margin:0 0 14px;font-size:18px;font-weight:900}
    .set-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .tile{display:flex;flex-direction:column;gap:8px;min-width:0}
    .lab{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--soft)}
    .lab .ic{width:18px;height:18px;color:var(--lime)}
    .tile select{width:100%;min-height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--sky);color:var(--ink);font:inherit;font-size:15px}
    .seg{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--sky)}
    .seg button{flex:1;min-width:0;min-height:44px;padding:4px 6px;border:0;border-radius:999px;background:transparent;color:var(--soft);
      font:inherit;font-size:14px;font-weight:800;cursor:pointer}
    .seg button[aria-pressed="true"]{background:var(--lime);color:var(--on)}
    .state{padding:0 6px;font-size:13px;color:var(--sub);min-height:1em}
    /* ✅ 확인 — 고른 세 값을 한꺼번에 저장. 잠김(무엇을 고를지) · 준비(라임) · 저장됨(라임 테두리) · 실패(주황 테두리) */
    .set-foot{display:flex;justify-content:flex-end;margin-top:18px}
    .ok-btn{min-width:220px;min-height:52px;padding:6px 28px;border:2px solid var(--lime);border-radius:999px;background:var(--lime);color:var(--on);
      font:inherit;font-size:16px;font-weight:900;cursor:pointer}
    .ok-btn:disabled{border-style:dashed;border-color:var(--line);background:transparent;color:var(--sub);cursor:not-allowed}
    .ok-btn[data-state="saved"]{background:transparent;color:var(--lime)}
    .ok-btn[data-state="fail"]{background:transparent;border-color:var(--orange);color:var(--orange)}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    /* 🚪 확인 안 누르고 나갈 때 묻는 창 — 이 화면엔 다른 떠 있는 창이 없어 z-index 50 이면 맨 위다(.wrap 은 1) */
    .leave{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:flex;align-items:center;justify-content:center;
      padding:18px;background:rgba(5,8,22,.8)}
    .leave-box{width:100%;max-width:420px;max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);overflow-y:auto;padding:22px;border-radius:26px;
      background:var(--card);border:1px solid var(--ring);box-shadow:0 18px 50px rgba(0,0,0,.55)}
    .leave-box h2{margin:0 0 8px;font-size:19px;font-weight:900;line-height:1.35}
    .leave-box p{margin:0 0 8px;color:var(--soft);font-size:15px}
    .leave-box .leave-pick{color:var(--lime);font-weight:800}
    .leave-acts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .leave-acts .ok-btn{width:100%;min-width:0}
    .leave-btn{min-height:48px;padding:6px 18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);
      font:inherit;font-size:15px;font-weight:800;cursor:pointer}
    .leave-btn.stay{border-color:transparent;color:var(--sub)}
    /* 낮은 화면(가로 폰) — 창이 한 화면에 들어오게 조인다 */
    @media (max-height:420px){.leave-box{padding:14px 18px}.leave-box h2{font-size:17px;margin-bottom:4px}.leave-box p{font-size:14px;margin-bottom:4px}
      .leave-acts{gap:6px;margin-top:8px}.leave-acts .ok-btn,.leave-btn{min-height:44px}}
    /* 💻 PC — 행성 카드 3장 가로 */
    @media (min-width:900px){
      .wrap{padding-top:32px}
      header h1{font-size:42px}
      .orbit{width:120px;height:120px}.orbit::after{right:8px;top:14px;width:14px;height:14px}.orbit .mascot{width:84px;height:84px}
      .lead{font-size:18px;margin:12px 0 26px}.lead .star{width:20px;height:20px}
      .modes{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
      .mode{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:26px;border-radius:32px}
      .mode h2{font-size:24px;margin-bottom:6px}.mode p{font-size:16px}
      .txt{flex:1}
      .go{align-self:stretch;width:auto;height:54px;gap:8px;border-radius:999px;font-size:17px;font-weight:900}
      .go-t{position:static;width:auto;height:auto;overflow:visible;clip:auto}
      .art{width:150px;height:150px}
      .sit-list{grid-template-columns:repeat(3,minmax(0,1fr))}
      .sheet,#situations{padding:26px 28px}
    }
    @media (max-width:640px){.set-row{grid-template-columns:1fr}.ok-btn{width:100%;min-width:0}}
    @media (max-width:420px){.sit-list{grid-template-columns:1fr}header h1{font-size:24px}}
    @media (max-width:640px){#guideDlg{width:100vw;height:100vh;height:100dvh;border-radius:0;border:0}}
    @media (prefers-reduced-motion:reduce){.mode,.sit,.guide-btn{transition:none}}
  </style>
<script src="/js/ai-login-gate.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="home" href="/"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg><span data-ko="홈" data-en="Home">홈</span></a>
    <h1 data-ko="AI 말하기" data-en="AI Speaking">AI 말하기</h1>
    <span class="orbit" aria-hidden="true"><img class="mascot" src="/img/mango-char.png" alt=""></span>

    <div class="set-row">

        <div class="seg" role="group" aria-labelledby="langLab">

      <div class="tile"><label class="lab" for="setLevel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-5"/><path d="M12 20V10"/><path d="M19 20V4"/></svg><span data-ko="수준" data-en="Level">수준</span></label><select id="setLevel"></select></div>

        <!-- 💬 고른 단계의 뜻(아래 #corrState 한 줄). 문구는 서버 동작과 «짝» 이다 — src/warmup-honest.ts
             자유 free_talk = 따라 말하기 없음(흐름을 끊지 않음) · 균형 balanced = 뜻이 바뀌는 큰 실수는 매번·작은 실수는 연달아 안 고침(낱말 고르기 word_choice 는 두 번째부터) → «위주로 / Mostly», 따라 말하기는 WARMUP_REPEAT_GAP_TURNS(3)턴에 한 번까지(src/warmup-correction.ts) — 그래서 «가끔»
             · 집중 focused = 실수를 모두 고친 문장을 FOCUSED_FIX_REPEATS(3)번 들려주고 따라 말하기.
             ⚠️ 서버 동작을 바꾸면 이 문구도 함께 바꾸세요 — ai_speaking_entry_harness 가 숫자를 서버 상수와 대조합니다.
             ⛔ «최대 3번 고쳐요» 로 쓰지 마세요: 집중은 실수 개수에 상한이 없고, 3은 «들려주는 횟수» 입니다. -->
        <div class="seg seg3" role="group" aria-labelledby="corrLab" aria-describedby="corrState" id="corrSeg">
          <button type="button" data-corr="free_talk" aria-pressed="false" data-hint-ko="따라 말하기 없이 대화를 이어가요" data-hint-en="No repeat-after-me. Just keep talking."><span data-ko="자유" data-en="Free">자유</span></button>

    <!-- ✅ 확인 — 글자는 renderOk 가 상태에 맞춰 쓴다(data-ko/en 을 달지 않는다: i18n 루프가 본문을 갈아끼움) -->
    <div class="set-foot"><button type="button" class="ok-btn" id="setOk" disabled><span id="setOkTxt">확인</span></button></div>

<!-- 📖 사용 안내 창(7차) — iframe 주소와 글자(제목·닫기)는 열 때 openGuide 가 T() 로 쓴다(번역 속성을 달지 않는다: i18n 루프가 본문을 갈아끼움).
     #leaveAsk «앞» 에 둔다 — 그 창 검사(ai_speaking_entry_harness G절)가 #leaveAsk 부터 페이지 끝까지를 «그 창» 으로 읽는다. -->

  <div class="gd-head"><h2 id="guideDlgTitle">AI 말하기 사용 안내</h2>

  <iframe id="guideFrame" title="AI 말하기 사용 안내"></iframe>

<!-- 🚪 확인 안 누르고 나갈 때 묻는 창(6차). .wrap «밖» 에 둔다 — 열리면 .wrap 을 inert 로 막기 때문.
     글자는 스크립트가 T() 로 쓴다(data-ko/en 을 달지 않는다: i18n 루프가 본문을 갈아끼움). -->
<div class="leave" id="leaveAsk" hidden>
  <div class="leave-box" role="dialog" aria-modal="true" aria-labelledby="leaveTitle" aria-describedby="leaveBody">
    <h2 id="leaveTitle"></h2>
    <p id="leaveBody"></p>
    <p class="leave-pick" id="leavePick"></p>
    <div class="leave-acts">
      <button type="button" class="ok-btn" id="leaveGo"></button>
      <button type="button" class="leave-btn" id="leaveSkip"></button>
      <button type="button" class="leave-btn stay" id="leaveStay"></button>
    </div>
  </div>

<script src="/js/ai-situations.js?v=2"></script>
<script src="/js/ai-speaking-settings.js?v=1"></script>
<script>
(function(){
  'use strict';
  // 저장소가 막힌 기기(접근만 해도 던짐)에서도 화면은 떠야 한다 → 없는 저장소로 대신한다.
  var LS = (function(){ try { var s = window.localStorage; s.getItem('x'); return s; } catch(e) {
    return { dead:true, getItem:function(){return null;}, setItem:function(){ throw new Error('storage unavailable'); } }; } })();
  var SET = window.AiSpeakSettings, SIT = window.MangoiSituations;
  // 🌐 언어 칸 = 화면 글자 한/영(사이트 공용 키 mangoi_lang). 대화는 영어입니다.
  var ui = SET ? SET.read(LS).lang : 'ko';
  function T(ko, en){ return ui === 'en' ? en : ko; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function applyUi(){
    document.documentElement.lang = ui;
    document.title = T('AI 말하기 — 망고아이', 'AI Speaking — Mangoi');
    document.querySelectorAll('[data-ko][data-en]').forEach(function(el){ el.textContent = el.getAttribute(ui === 'en' ? 'data-en' : 'data-ko'); });
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === ui ? 'true' : 'false'); });
  }
  function renderSituations(){
    var box = document.getElementById('sitBody'); if(!box || !SIT) return;
    box.innerHTML = SIT.steps.map(function(st){
      var items = SIT.list.filter(function(s){ return s.step === st.n; });
      return '<h4 class="sit-g">' + esc(T(st.ko, st.en)) + '</h4><div class="sit-list">' + items.map(function(s){
        var pic = s.img ? '<img src="' + esc(s.img) + '" alt="" loading="lazy">' : s.ic;
        var name = T(s.ko, s.en);
        return '<a class="sit" data-sit="' + esc(s.id) + '" data-start href="' + esc(SIT.url(s)) + '"><span class="sit-ic" aria-hidden="true">' + pic + '</span>'
          + '<span class="sit-t"><b>' + esc(name) + '</b><small>' + esc(T(s.dko, s.den)) + '</small></span></a>';
      }).join('') + '</div>';
    }).join('');
  }
  // ✅ 고른 값(draft) — 버튼을 눌러도 여기만 바뀐다. 저장은 confirmSettings 한 곳(«확인»).
  function readDraft(){ var c = SET ? SET.read(LS) : { level: 0, corr: '' }; return { level: c.level, corr: c.corr }; }
  var draft = readDraft();
  // 이 화면에서 사람이 만진 칸 — 안 만진 칸은 저장소를 따른다(다른 탭·화면이 그 사이 바꿨을 수 있다. 6차 함정 대조)
  var touched = { level: false, corr: false };
  var okState = '';   // '' 아직 · 'saved' 저장됨 · 'fail' 저장 못 함 — 무엇이든 다시 고르면 ''
  function renderSettings(){
    if(!SET){ renderOk(); return; }
    var cur = draft;
    var lv = document.getElementById('setLevel');
    var lvHead = cur.level === 'mixed' ? T('화면마다 다름 — 고르면 맞춰요', 'Differs by screen — pick one') : T('아직 안 정함 (화면 기본)', 'Not set (screen default)');
    // 안 정함(0)·화면마다 다름이면 머리 줄을 둔다 — 없으면 «1단계» 가 골라진 것처럼 보이고, 1을 골라도 change 가 안 난다
    lv.innerHTML = (typeof cur.level === 'number' && cur.level >= 1 ? '' : '<option value="" selected>' + esc(lvHead) + '</option>')
      + SET.LEVELS.map(function(L){ return '<option value="' + L.n + '"' + (cur.level === L.n ? ' selected' : '') + '>' + L.n + T('단계 · ', ' · ') + esc(T(L.ko, L.en)) + '</option>'; }).join('');
    document.querySelectorAll('[data-corr]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-corr') === cur.corr ? 'true' : 'false'); });
    var cs = document.getElementById('corrState');
    if(cs){
      // 💬 고른 단계의 뜻 한 줄(A안). cur.corr 는 SET.CORR 세 값 중 하나만 오므로 선택자에 그대로 써도 안전하다.
      var picked = cur.corr && cur.corr !== 'mixed' ? document.querySelector('[data-corr="' + cur.corr + '"]') : null;
      cs.textContent = cur.corr === 'mixed' ? T('화면마다 다름 — 누르면 맞춰요', 'Differs by screen — tap one')
        : picked ? picked.getAttribute(ui === 'en' ? 'data-hint-en' : 'data-hint-ko')
        : T('아직 안 정함 (화면 기본)', 'Not set (screen default)');
    }
    renderOk();
  }
  // 아직 안 고른 것 — '' 이면 확인할 수 있다. «화면마다 다름»(mixed)도 «안 고름» 으로 본다(하나로 맞춰야 세 연습이 같아진다).
  function draftMissing(){
    var lv = typeof draft.level === 'number' && draft.level >= 1;
    var cr = !!SET && SET.CORR.indexOf(draft.corr) >= 0;
    return lv && cr ? '' : (!lv && !cr) ? 'both' : !lv ? 'level' : 'corr';
  }
  function renderOk(){
    var b = document.getElementById('setOk'), t = document.getElementById('setOkTxt'); if(!b || !t) return;
    var miss = SET ? draftMissing() : 'off';
    b.disabled = !!miss;
    b.setAttribute('data-state', miss ? '' : okState);
    t.textContent = miss === 'off' ? T('설정을 불러오지 못했어요', 'Settings unavailable')
      : miss === 'both' ? T('수준·교정 정도를 골라 주세요', 'Choose a level and corrections')
      : miss === 'level' ? T('수준을 골라 주세요', 'Choose a level')
      : miss === 'corr' ? T('교정 정도를 골라 주세요', 'Choose corrections')
      : okState === 'saved' ? T('✅ 적용됐어요', '✅ Applied')
      : okState === 'fail' ? T('⚠️ 이 기기에선 저장이 안 돼요', '⚠️ Could not save here')
      : T('확인', 'Confirm');
  }
  function status(s){ var m = document.getElementById('setMsg'); if(m) m.textContent = s; }
  function pick(k, v){ draft[k] = v; touched[k] = true; okState = ''; status(''); renderSettings(); syncLeaveGuard(); }
  // 안 만진 칸을 저장소 값으로 — 그래야 «확인»·«적용하고 이동» 이 다른 탭이 새로 정한 값을 옛 값으로 덮지 않는다
  function syncUntouched(){ if(!SET) return; var c = SET.read(LS); if(!touched.level) draft.level = c.level; if(!touched.corr) draft.corr = c.corr; }
  // 확인 — 수준·교정을 두 화면 키에 함께 쓴다. 언어는 누를 때 이미 저장했으므로 여기서 쓰지 않는다
  // (확인 때 다시 쓰면 계정 자동판정 언어가 «사람이 고름» 으로 굳는다 — mangoi_lang_by).
  function confirmSettings(){
    if(!SET) return false;
    syncUntouched();
    if(draftMissing()) return false;
    var a = SET.chooseLevel(LS, draft.level), c = SET.chooseCorr(LS, draft.corr);
    var ok = !!(a && c);
    okState = ok ? 'saved' : 'fail';
    if(ok) touched = { level: false, corr: false };
    renderSettings(); syncLeaveGuard();
    status(ok ? T('저장했어요. 교재 연습·상황별 말하기·AI 친구에 함께 적용돼요.', 'Saved. Applies to all three practices.')
              : T('이 기기에서는 저장이 안 돼요. 각 연습 화면에서 골라 주세요.', 'Could not save on this device. Please choose in each practice screen.'));
    return ok;
  }
  // 🚪 6차 — 확인 안 누르고 나가면 묻는다. «안 적용» = 화면에 고른 수준·교정(draft)이 저장된 값과 다름(되돌려 같아지면 안 묻는다).
  //    사람이 «만진» 칸만 본다 — 안 만진 칸이 저장소와 다른 것은 다른 탭이 바꾼 것이지 이 화면이 바꾼 것이 아니다.
  //    ⛔ 저장이 안 되는 기기(저장소 없음 · «⚠️ 저장이 안 돼요» 상태)는 묻지 않는다 — 다시 물어도 저장할 수 없다.
  //    ⛔ renderSettings·renderOk 안에서 부르지 않는다: 하니스가 그 둘만 오려 «저장소를 안 읽는다» 를 확인한다.
  var leaving = false, guardOn = false, leaveHref = '', leaveFrom = null;
  function unapplied(){
    if(!SET || LS.dead || okState === 'fail') return false;
    var s = SET.read(LS);
    return (touched.level && draft.level !== s.level) || (touched.corr && draft.corr !== s.corr);
  }
  // 뒤로가기·새로고침·탭 닫기 — 브라우저 기본 창. 바꾼 것이 있을 때만 건다(MDN 권고: 늘 걸어 두면 «뒤로가기 보관»(bfcache)을 막는 브라우저가 있다 — 이 저장소에서 재지는 않음).
  function onBeforeUnload(e){ if(leaving || !unapplied()) return; e.preventDefault(); e.returnValue = 'unapplied'; return 'unapplied'; }
  function syncLeaveGuard(){
    var need = unapplied(); if(need === guardOn) return;
    guardOn = need;
    window[need ? 'addEventListener' : 'removeEventListener']('beforeunload', onBeforeUnload);
  }
  function corrName(id){ return id === 'free_talk' ? T('자유', 'Free') : id === 'balanced' ? T('균형', 'Balanced') : id === 'focused' ? T('집중', 'Focused') : ''; }
  function setText(id, s){ var e = document.getElementById(id); if(e) e.textContent = s; return e; }
  function hideLeave(){
    var box = document.getElementById('leaveAsk'); if(box) box.hidden = true;
    var w = document.querySelector('.wrap'); if(w) w.removeAttribute('inert');
  }
  function focusEl(el){ if(el) try { el.focus(); if(el.scrollIntoView) el.scrollIntoView({ block:'center' }); } catch(_) {} }
  function closeLeave(){ var f = leaveFrom; leaveFrom = null; hideLeave(); if(f) try { f.focus(); } catch(_) {} }
  function openLeave(href, from){
    var box = document.getElementById('leaveAsk'); if(!box) return false;
    leaveHref = href; leaveFrom = from || null;
    syncUntouched();
    var miss = draftMissing();   // 'level'·'corr' — 바꾼 것이 있는데 나머지를 안 골라 «확인» 이 잠긴 경우
    setText('leaveTitle', T('설정을 아직 적용하지 않았어요', 'Your settings are not applied yet'));
    setText('leaveBody', miss === 'level' ? T('수준을 골라야 «확인»할 수 있어요. 이대로 나가면 바꾼 교정 정도가 적용되지 않아요.', 'Choose a level to confirm. If you leave now, your new corrections will not apply.')
      : miss === 'corr' ? T('교정 정도를 골라야 «확인»할 수 있어요. 이대로 나가면 바꾼 수준이 적용되지 않아요.', 'Choose corrections to confirm. If you leave now, your new level will not apply.')
      : T('바꾼 수준·교정 정도는 «확인»을 눌러야 교재 연습·상황별 말하기·AI 친구에 적용돼요.', 'Your new level and corrections apply to all three practices only after you confirm.'));
    var parts = [];
    if(typeof draft.level === 'number' && draft.level >= 1) parts.push(T('수준 ' + draft.level + '단계', 'Level ' + draft.level));
    if(corrName(draft.corr)) parts.push(T('교정 ', 'Corrections: ') + corrName(draft.corr));
    var pk = setText('leavePick', parts.length ? T('고른 설정: ', 'Your picks: ') + parts.join(' · ') : '');
    if(pk) pk.hidden = !parts.length;
    setText('leaveGo', miss ? T('고르러 가기', 'Choose now') : T('적용하고 이동', 'Apply and go'));
    setText('leaveSkip', T('적용 안 하고 이동', 'Go without applying'));
    var st = setText('leaveStay', T('머무르기', 'Stay here'));
    if(st) st.hidden = !!miss;   // 잠긴 경우엔 «고르러 가기» 가 곧 머무르기
    box.hidden = false;
    var w = document.querySelector('.wrap'); if(w) w.setAttribute('inert', '');
    // 창 안을 맨 위로 두고 «스크롤 없이» 포커스 — scrollIntoView 를 쓰면 낮은 화면에서 제목이 위로 잘린다(568×320 실측)
    var lb = box.querySelector ? box.querySelector('.leave-box') : null; if(lb) lb.scrollTop = 0;
    var g = document.getElementById('leaveGo'); if(g) try { g.focus({ preventScroll: true }); } catch(_) {}
    return true;
  }
  // 브라우저는 이동을 «시작할 때» beforeunload 를 쏜다 — 그 뒤 이동이 멈추거나 실패해 이 화면에 남으면 다시 묻도록 표시를 되돌린다.
  function goTo(href){ leaving = true; hideLeave(); window.location.href = href; try { window.setTimeout(function(){ leaving = false; }, 3000); } catch(_) {} }
  function leaveGo(){
    var miss = draftMissing();
    if(miss){ leaveFrom = null; hideLeave(); focusEl(miss === 'level' ? document.getElementById('setLevel') : document.querySelectorAll('[data-corr]')[0]); return; }
    if(confirmSettings()){ goTo(leaveHref); return; }
    // 저장 못 함 — 머물러서 버튼의 «⚠️ 이 기기에선 저장이 안 돼요» 를 보인다. 다음에 누르면 묻지 않고 간다(okState 'fail').
    leaveFrom = null; hideLeave(); focusEl(document.getElementById('setOk'));
  }
  function wire(){
    var sitCard = document.getElementById('situation-mode'), panel = document.getElementById('situations');
    if(panel) panel.hidden = true;
    if(sitCard && panel) sitCard.addEventListener('click', function(e){
      e.preventDefault();
      var open = panel.hidden; panel.hidden = !open;
      sitCard.setAttribute('aria-expanded', open ? 'true' : 'false');
      if(open) try { panel.scrollIntoView({ behavior:'smooth', block:'nearest' }); } catch(_) {}
    });
    // 🌐 언어는 누르는 즉시 저장한다(사장님 2026-11-04 — 확인 버튼과 무관). 수준·교정의 «적용됨» 상태는 그대로 둔다.
    //    저장이 막힌 기기면 화면 글자는 바뀌되 사실대로 말한다(버튼 «⚠️» + 화면낭독기 상태 줄).
    document.querySelectorAll('[data-lang]').forEach(function(b){ b.addEventListener('click', function(){
      var l = b.getAttribute('data-lang'); if(l === ui) return;
      var ok = SET ? SET.chooseLang(LS, l) : false;
      ui = l; if(!ok) okState = 'fail';
      applyUi(); renderSituations(); renderSettings(); syncLeaveGuard();
      status(ok ? '' : T('이 기기에서는 언어 저장이 안 돼요. 다른 화면에서는 예전 언어로 보여요.', 'Could not save the language on this device. Other screens keep the old language.'));
    }); });
    document.querySelectorAll('[data-corr]').forEach(function(b){ b.addEventListener('click', function(){
      pick('corr', b.getAttribute('data-corr'));
    }); });
    var lv = document.getElementById('setLevel');
    if(lv) lv.addEventListener('change', function(){ if(!lv.value) return; pick('level', Number(lv.value)); });
    var okBtn = document.getElementById('setOk');
    if(okBtn) okBtn.addEventListener('click', function(){ confirmSettings(); });
    // 🚪 화면 안 링크로 나갈 때 — 위임(상황 카드는 나중에 그려진다). 새 탭·같은 화면 안(#)·이미 막힌 클릭은 건드리지 않는다.
    document.addEventListener('click', function(e){
      if(e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null; if(!a) return;
      var href = a.getAttribute('href') || '';
      if(!href || href.charAt(0) === '#' || a.getAttribute('target') || a.hasAttribute('download')) return;
      if(!unapplied() || !document.getElementById('leaveAsk')) return;
      // ▶ 7차 — 연습 시작 링크는 묻지 않고 «확인» 과 같은 저장을 한 뒤 그대로 간다(고른 교정 정도로 시작).
      //    저장이 되면 unapplied() 가 거짓이 되어 beforeunload 도 안 묻는다. 막지 않으므로 링크 기본 이동이 그대로 일어난다.
      //    ⛔ «확인» 이 잠긴 경우(draftMissing)는 아래 창으로 — 무엇을 고를지 말해야 한다.
      if(a.hasAttribute('data-start') && !draftMissing()){
        if(confirmSettings()) return;
        e.preventDefault(); focusEl(document.getElementById('setOk'));   // 저장 못 함 — 머물러 «⚠️» 를 보인다. 다시 누르면 그대로 간다(okState 'fail')
        return;
      }
      e.preventDefault();
      openLeave(a.href || href, a);
    });
    var goBtn = document.getElementById('leaveGo'), skipBtn = document.getElementById('leaveSkip'), stayBtn = document.getElementById('leaveStay');
    var box = document.getElementById('leaveAsk');
    if(goBtn) goBtn.addEventListener('click', leaveGo);
    if(skipBtn) skipBtn.addEventListener('click', function(){ goTo(leaveHref); });
    if(stayBtn) stayBtn.addEventListener('click', closeLeave);
    if(box){
      box.addEventListener('click', function(e){ if(e.target === box) closeLeave(); });   // 어두운 바깥 = 머무르기
      // 문서에 건다 — 창 안 글자를 누르면 포커스가 body 로 빠져 창에 건 keydown 은 안 온다(함정 대조 실측)
      document.addEventListener('keydown', function(e){
        if(box.hidden) return;
        if(e.key === 'Escape'){ e.preventDefault(); closeLeave(); return; }
        if(e.key !== 'Tab') return;   // 창 안에서만 돈다 — inert 만으로는 마지막 버튼 다음에 창 밖(주소창)으로 빠진다
        var bs = [goBtn, skipBtn, stayBtn].filter(function(b){ return b && !b.hidden; }), last = bs.length - 1, i = bs.indexOf(document.activeElement);
        if(i < 0 || (e.shiftKey && i === 0) || (!e.shiftKey && i === last)){ e.preventDefault(); bs[e.shiftKey ? last : 0].focus(); }
      });
    }
    // 뒤로가기로 «보관된 화면» 이 돌아오면 — 그 사이 다른 화면이 설정을 바꿨을 수 있으니 저장된 값으로 다시 그린다.
    window.addEventListener('pageshow', function(e){
      if(!e.persisted) return;
      leaving = false; leaveFrom = null; hideLeave();
      if(SET) ui = SET.read(LS).lang;
      draft = readDraft(); touched = { level: false, corr: false }; okState = ''; status('');
      applyUi(); renderSituations(); renderSettings(); syncLeaveGuard();
    });
    // 다른 탭이 설정을 바꾸면 — 안 만진 칸은 그 값으로 다시 그리고, «✅ 적용됐어요» 는 더 이상 사실이 아닐 수 있으니 거둔다
    window.addEventListener('storage', function(){
      if(!SET) return;
      syncUntouched(); if(okState === 'saved') okState = '';
      renderSettings(); syncLeaveGuard();
    });
  }
  // 📖 사용 안내 — 안내서를 창 안에 연다. 화면 언어(ui)를 ?lang= 으로 넘긴다(안내서가 그 언어로 뜬다).
  //    창(dialog)을 못 여는 옛 브라우저는 같은 탭으로 간다 — 안내서 위쪽에 «AI 말하기» 로 돌아오는 링크가 있다.
  var GUIDE_URL = '/ai-speaking-guide.html';
  function guideLang(){ return ui === 'en' ? 'en' : 'ko'; }
  function guideHref(){ return GUIDE_URL + '?lang=' + guideLang(); }
  function openGuide(){
    var dlg = document.getElementById('guideDlg'), fr = document.getElementById('guideFrame'), href = guideHref();
    if(!dlg || !fr || typeof dlg.showModal !== 'function'){ location.href = href; return; }
    // 처음엔 src 로 넣는다. 다시 열 때 언어가 바뀌었으면 replace — src 를 다시 쓰면 방문 기록이 하나 늘어 «뒤로» 가 한 번 헛돈다
    if(!fr.getAttribute('src')) fr.setAttribute('src', href);
    else if(fr.getAttribute('data-lang') !== guideLang()){ try { fr.contentWindow.location.replace(href); } catch(_) { fr.setAttribute('src', href); } }
    fr.setAttribute('data-lang', guideLang());
    var title = T('AI 말하기 사용 안내', 'AI Speaking guide');
    fr.setAttribute('title', title);
    var h = document.getElementById('guideDlgTitle'); if(h) h.textContent = title;
    var x = document.getElementById('guideClose'); if(x) x.setAttribute('aria-label', T('닫기', 'Close'));
    if(dlg.open) return;
    try { dlg.showModal(); } catch(_) { location.href = href; }
  }
  function wireGuide(){
    var btn = document.getElementById('guideBtn'), dlg = document.getElementById('guideDlg'), x = document.getElementById('guideClose');
    if(btn) btn.addEventListener('click', openGuide);
    if(!dlg) return;
    if(x) x.addEventListener('click', function(){ dlg.close(); });
    // 창 바깥(어두운 곳)을 누르면 닫는다 — 창 안(머리·iframe)을 누르면 e.target 이 dialog 자신이 아니다
    dlg.addEventListener('click', function(e){ if(e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', function(){ if(btn) try { btn.focus(); } catch(_) {} });
    // 포커스가 창 안(iframe)에 있으면 dialog 가 Esc 를 못 받는다 → 안내서가 알려 오면 닫는다(같은 오리진 · 그 iframe 에서 온 것만)
    var fr = document.getElementById('guideFrame');
    window.addEventListener('message', function(e){
      if(e.data === 'ai-speaking-guide:close' && e.origin === location.origin && fr && e.source === fr.contentWindow && dlg.open) dlg.close();
    });
  }
  applyUi(); renderSituations(); renderSettings(); wire(); wireGuide();
})();
</script>
</body>
