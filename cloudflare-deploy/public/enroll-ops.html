<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📚 수강 운영 관리 — 망고아이 관리자</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { font-family:MangoiHanSC,'Malgun Gothic','맑은 고딕',sans-serif; margin:0; background:#faf7f0; color:#1f2430; }
  @media (min-width:1024px) { body { zoom:1.3; } } /* 관리자 서브페이지 공통 PC 확대 */
  .wrap { max-width:900px; margin:0 auto; padding:16px 14px 50px; }
  /* « 나가는 문 » (2026-09-03 사장님 지시 «뒤로가기 화살표, 홈버튼 만들어줘»)
     ⚠️ 이 style 안 주석에는 홑낫표를 쓰지 말 것 — admin_lazyload ②-3 이 «한자 폰트 장식 문자» 로 셉니다.
     ⛔ 아이콘만 두고 title 로 설명하지 말 것 — 폰에는 hover 가 없다(CLAUDE.md 2장). 글자를 함께 그린다. */
  .nav { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .nav a, .nav button { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border:1.5px solid #e5d9bd; border-radius:999px;
           background:#fff; color:#92400e; font-size:13px; font-weight:700; text-decoration:none; line-height:1.2; white-space:nowrap; font-family:inherit; cursor:pointer; }
  .nav a:hover, .nav button:hover { background:#fff7e8; border-color:#f59e0b; }
  .nav .lang { margin-left:auto; }
  h1 { font-size:20px; color:#b45309; margin:6px 0 2px; }
  .sub { color:#475467; font-size:13px; margin-bottom:12px; line-height:1.6; }
  /* 탭 — 넓은 화면은 줄바꿈, 폰(640px 이하)은 «한 줄 가로 스크롤» (2026-09-25 제안서 D안) */
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tab { padding:8px 14px; border:1.5px solid #e5d9bd; border-radius:999px; background:#fff; font-size:13px; font-weight:700; cursor:pointer; color:#92400e; white-space:nowrap; font-family:inherit; }
  .tab.on { background:#b45309; color:#fff; border-color:#b45309; }
  .tab .cnt { display:inline-block; min-width:18px; margin-left:4px; padding:0 5px; border-radius:999px; background:#fde68a; color:#78350f; font-size:11px; text-align:center; }
  .tab.on .cnt { background:#fff; color:#b45309; }
  @media (max-width:640px) {
    .tabs { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:thin; }
    .tab { flex:0 0 auto; padding:10px 14px; }
  }
  .card { background:#fff; border:1.5px solid #eadfc6; border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:15px; color:#92400e; margin:0 0 8px; }
  /* «같은 일을 하는 다른 곳» 안내 — 한 화면이 한 가지 일만 하도록, 겹치는 메뉴를 이름으로 알려 준다 */
  .alt { display:block; font-size:12.5px; color:#1d4ed8; background:#eef3fd; border-radius:8px; padding:6px 10px; margin:6px 0 10px; line-height:1.55; }
  .alt a { color:#1d4ed8; font-weight:700; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid #f0e8d6; padding:8px 8px; text-align:left; font-size:13.5px; vertical-align:top; }
  th { color:#92400e; font-size:12.5px; background:#fff7e8; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  /* 폰에서 표를 «카드» 로 — 가로로 밀려 마지막 칸이 잘리던 것 (2026-09-25) */
  @media (max-width:640px) {
    table.rs thead { display:none; }
    table.rs tr { display:block; border:1px solid #f0e8d6; border-radius:10px; padding:6px 10px; margin-bottom:8px; }
    table.rs td { display:flex; justify-content:space-between; gap:10px; border:0; padding:4px 0; text-align:right; }
    table.rs td::before { content:attr(data-l); color:#6b7280; font-size:12px; font-weight:600; text-align:left; }
    table.rs td.full { display:block; text-align:left; }
    table.rs td.full::before { content:none; }
  }
  input, select { padding:7px 9px; border:1.5px solid #e5d9bd; border-radius:8px; font-size:13.5px; font-family:inherit; background:#fff; color:#1f2430; }
  input[type=number] { width:96px; text-align:right; }
  button { padding:7px 12px; border:1.5px solid #e5d9bd; border-radius:8px; background:#fff; font-size:13px; cursor:pointer; font-family:inherit; color:#1f2430; }
  button.go { background:#b45309; border-color:#b45309; color:#fff; font-weight:700; }
  button.danger { background:#fff1f2; border-color:#fecdd3; color:#be123c; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .msg { padding:20px 8px; text-align:center; color:#475467; font-size:13.5px; }
  .msg a { color:#b45309; }
  .ok { color:#15803d; font-weight:700; font-size:12.5px; }
  .no { color:#b91c1c; font-weight:700; font-size:12.5px; }
  .hint { font-size:12.5px; color:#667085; line-height:1.6; }
  .big { font-size:22px; font-weight:900; color:#b45309; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
  .p-red { background:#fdecec; color:#b91c1c; } .p-amb { background:#fdf1e2; color:#9a4a07; }
  .p-blu { background:#e8eefc; color:#1d4ed8; } .p-grn { background:#e7f5ec; color:#15803d; } .p-gry { background:#eef0f2; color:#475467; }
  /* 📋 오늘 할 일 — 줄마다 «무엇 · 얼마나 · 버튼 하나» */
  .todo { display:grid; gap:8px; }
  .todo .it { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 12px; border:1.5px solid #eadfc6; border-radius:12px; background:#fff; }
  .todo .it .t { font-size:14px; font-weight:700; line-height:1.45; }
  .todo .it .d { font-size:12.5px; color:#667085; margin-top:2px; line-height:1.5; }
  .todo .it button { flex:0 0 auto; min-height:40px; }
  .todo .it.calm { background:#fbfaf6; }
  @media (max-width:640px) {
    .todo .it { flex-direction:column; align-items:stretch; }
    .todo .it button { width:100%; min-height:44px; }
  }
  .kv { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #f0e8d6; font-size:13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- « 나가는 문 » — ← 는 직전 페이지(판정 정본 back-nav.js 의 window.mangoiGoBack), 🏠 는 관리자 홈.
       href 는 폴백으로 남긴다(back-nav.js 가 없거나 캐시에 옛 사본이 남아도 최악이어도 관리자 홈으로는 간다).
       ⚠️ 글자가 ← 로 시작해야 back-nav.js 가 «보이는 ← 가 이미 있다» 고 보고 자기 동그란 ← 를 안 넣는다(화살표 두 개 방지).
       ⚠️ 한/영 전환은 이 화면이 직접 그린다 — data-ko/data-en 을 «글자만 담은 span» 에 달고(아이콘·배지를 품은 요소에 달면
          i18n 엔진이 textContent 를 갈아끼워 안쪽 요소가 사라진다 — CLAUDE.md 2장), 전환은 아래 applyLang 한 곳. -->
  <nav class="nav" aria-label="화면 이동">
    <a href="/admin.html" id="lnk-back" data-ko="← 뒤로" data-en="← Back" title="이전 화면으로">← 뒤로</a>
    <a href="/admin.html" id="lnk-home" data-ko="🏠 관리자 홈" data-en="🏠 Admin home" title="관리자 홈으로">🏠 관리자 홈</a>
    <button type="button" class="lang" id="btn-lang" aria-label="한국어/English">🌐 <span id="lang-lbl">EN</span></button>
  </nav>
  <h1><span data-ko="📚 수강 운영 관리" data-en="📚 Enrollment operations">📚 수강 운영 관리</span></h1>
  <div class="sub"><span data-ko="학생 수강의 «끝·공휴일·강사 휴가·자동 문자» 를 한 곳에서 처리합니다. 맨 앞 «오늘 할 일» 에 먼저 볼 것이 급한 순서로 모입니다."
    data-en="Handle enrollment endings, holidays, teacher leave and automatic messages in one place. «To-do today» lists what needs attention first.">학생 수강의 «끝·공휴일·강사 휴가·자동 문자» 를 한 곳에서 처리합니다. 맨 앞 «오늘 할 일» 에 먼저 볼 것이 급한 순서로 모입니다.</span></div>
  <!-- 🧹 (2026-09-25 사장님 «D로 정리 → 공휴일 한 곳 → C로 완성») 탭 정리
       · 「📋 오늘 할 일」을 맨 앞(기본 탭)으로
       · 「💸 환불 계산기」 제거 — 정산·매출 › 환불 처리(/admin/refunds.html)가 같은 계산을 하고 실제 환불까지 한다.
         옛 주소 #refund 는 그 화면으로 넘긴다(아래 applyHashTab).
       · 이름: 강사 배율 → 수업료 배율(학생 결제액이 바뀐다) · 자동 작업 점검 → 자동 문자
       ⚠️ data-t 값은 사이드바 손자 메뉴(js/adm-ia6.js 의 secs id)와 짝이다 — sidebar_three_level_harness 가 대조한다. -->
  <div class="tabs" role="tablist">
    <button type="button" class="tab on" data-t="todo"><span data-ko="📋 오늘 할 일" data-en="📋 To-do today">📋 오늘 할 일</span><span class="cnt" id="cnt-todo" hidden></span></button>
    <button type="button" class="tab" data-t="ending"><span data-ko="⏰ 종료 후보" data-en="⏰ Ending soon">⏰ 종료 후보</span><span class="cnt" id="cnt-ending" hidden></span></button>
    <button type="button" class="tab" data-t="leave"><span data-ko="🏖 강사 휴가 대체" data-en="🏖 Leave cover">🏖 강사 휴가 대체</span></button>
    <button type="button" class="tab" data-t="holidays"><span data-ko="🎌 공휴일" data-en="🎌 Holidays">🎌 공휴일</span><span class="cnt" id="cnt-holidays" hidden></span></button>
    <button type="button" class="tab" data-t="rates"><span data-ko="💲 수업료 배율" data-en="💲 Price rates">💲 수업료 배율</span></button>
    <button type="button" class="tab" data-t="sweeps"><span data-ko="🔔 자동 문자" data-en="🔔 Auto messages">🔔 자동 문자</span></button>
  </div>
  <div id="body"><div class="msg">불러오는 중…</div></div>
</div>

<script>
'use strict';
var TAB = 'todo';
var EN = false;
try { EN = localStorage.getItem('mangoi_lang') === 'en'; } catch(e){}
function L(ko, en){ return EN ? en : ko; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function won(n){ return Number(n||0).toLocaleString('ko-KR')+(EN?' KRW':'원'); }
function needLogin(){ $('body').innerHTML = '<div class="msg">'+L('관리자 로그인이 필요합니다.','Admin login required.')+' <a href="/admin/login?next=%2Fenroll-ops.html">'+L('로그인 하러 가기','Log in')+'</a></div>'; }

/* 🔒 (2026-09-10) 이 화면은 «본사 전용» 이 됐다 — 서버가 강사·지사·대리점에게 403 을 준다
   (enrollAdminHqOnly, src/enroll-ops.ts). 그 403 을 «그대로 흘리면 안 된다»:
   렌더러가 «없으면 빈 값» 으로 받으면 「등록된 공휴일이 없습니다」 같은 **정상 문구**로 그린다.
   ⟹ «못 본다» 가 «없다» 로 읽힌다. 화면이 **이유를 말해야** 한다. */
function denied(msg){
  $('body').innerHTML = '<div class="msg">🔒 ' + esc(msg || L('이 기능은 본사 계정만 사용할 수 있습니다.','Only HQ accounts can use this.')) + '</div>';
}

async function api(path, opts){
  var r = await fetch(path, Object.assign({ cache:'no-store' }, opts||{}));
  if (r.status === 401) { needLogin(); throw new Error('auth'); }
  var j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  if (r.status === 403) { denied(j && j.message); throw new Error('forbidden'); }
  return j || {};
}
function post(path, body){ return api(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }

/* «같은 일을 하는 다른 곳» 한 줄 — 겹치는 메뉴를 숨기지 않고 이름으로 알려 준다(제안서 D안).
   ⚠️ 경로는 관리자 사이드바 이름 그대로 적는다(js/adm-ia6.js). 사이드바 이름을 바꾸면 여기도 함께. */
function alt(ko, en){ return '<span class="alt">↔ ' + L(ko, en) + '</span>'; }

/* 탭을 누르면 그 탭을 그린다. ⚠️ 탭 안 버튼은 .tab 이 아니라 부모 .tabs 에 위임한다(재그리기에도 산다). */
document.querySelector('.tabs').addEventListener('click', function(ev){
  var t = ev.target.closest('.tab'); if (!t) return;
  goTab(t.getAttribute('data-t'));
});
function goTab(name){
  var t = document.querySelector('.tab[data-t="' + String(name).replace(/"/g,'') + '"]'); if (!t) return;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
  t.classList.add('on'); TAB = name;
  try { history.replaceState(null, '', '#' + name); } catch(e){}
  render();
}
function setCnt(id, n){
  var el = $(id); if (!el) return;
  if (n > 0) { el.textContent = String(n); el.hidden = false; } else { el.hidden = true; }
}

/* ═══ 📋 오늘 할 일 (2026-09-25 — 제안서 C안) ═══
   서버 요약 한 번(/api/pay/enroll/admin/todo)으로 «무엇을 먼저» 를 그린다.
   ⛔ 칸이 { error } 면 0 이 아니라 «확인 못 함» 이라고 쓴다 — 0 은 «할 일 없음» 으로 읽힌다.
   ✅ 줄마다 버튼은 «그 일을 하는 기존 탭» 을 연다 — 새 기능을 만들지 않고 길만 모은다. */
var LEAVE_DAY = '';
async function viewTodo(){
  $('body').innerHTML = '<div class="msg">'+L('오늘 할 일을 모으는 중…','Collecting today’s to-do…')+'</div>';
  var j = await api('/api/pay/enroll/admin/todo');
  if (!j || j.ok !== true) { $('body').innerHTML = '<div class="msg no">'+L('요약을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.','Could not load the summary. Please reopen in a moment.')+'</div>'; return; }
  var rows = [], urgent = 0;
  function fail(what){ rows.push({ pill:'p-gry', pk:'확인 못 함', pe:'Unknown', t:L(what[0], what[1]) + ' — ' + L('확인하지 못했습니다','could not check'), d:'', btn:null }); }

  var v = j.vacations || {};
  if (v.error) fail(['강사 휴가','Teacher leave']);
  else if (v.count > 0) {
    urgent += v.count;
    rows.push({ pill:'p-red', pk:'급함', pe:'Urgent',
      t: L('다가오는 강사 휴가 ' + v.count + '건 — 수업을 다른 강사에게 넘겼는지 확인', v.count + ' upcoming teacher leave(s) — check the classes were handed over'),
      d: (v.items||[]).map(function(x){ return esc(x.date + (x.end_date && x.end_date !== x.date ? '~' + x.end_date : '') + ' ' + (x.teacher || x.title)); }).join(' · '),
      btn: { ko:'휴가 대체 열기', en:'Open leave cover', tab:'leave', day:(v.items && v.items[0] && v.items[0].date) || '' } });
  }

  var e = j.ending || {};
  if (e.error) fail(['종료 후보','Ending soon']);
  else {
    setCnt('cnt-ending', e.count);
    if (e.count > 0) {
      urgent += e.count;
      rows.push({ pill:'p-amb', pk:'이번 주', pe:'This week',
        t: L(e.days + '일 넘게 새 수업이 없는 학생 ' + e.count + '명', e.count + ' student(s) with no new class for ' + e.days + '+ days'),
        d: (e.top||[]).map(function(s){ return esc(s.name) + ' ' + s.days + L('일','d'); }).join(' · ') + (e.count > 3 ? L(' 외 ' + (e.count-3) + '명', ' +' + (e.count-3)) : ''),
        btn: { ko:'명단 보기', en:'See list', tab:'ending' } });
    } else rows.push({ pill:'p-grn', pk:'없음', pe:'None', t:L('종료 후보가 없습니다','No students ending'), d:'', btn:null, calm:true });
  }

  var m = j.calendar_missing || {};
  if (m.error) fail(['캘린더 공휴일 대조','Calendar holiday check']);
  else {
    setCnt('cnt-holidays', m.count);
    if (m.count > 0) {
      urgent += m.count;
      rows.push({ pill:'p-amb', pk:'확인', pe:'Check',
        t: L('수업을 안 미는 공휴일 ' + m.count + '건 — 캘린더·공식 공휴일에만 있음', m.count + ' holiday(s) not pushing classes — only in the Calendar / official list'),
        d: (m.top||[]).map(function(h){ return esc(h.day + ' ' + h.name); }).join(' · '),
        btn: { ko:'공휴일 옮기기', en:'Move holidays', tab:'holidays' } });
    }
    /* 한쪽 원천만 못 읽었으면 «일부만 대조» 라고 말한다 — 0건이 «다 옮겼다» 로 읽히지 않게. */
    if (m.failed && m.failed.length) fail([srcLabel(m.failed).ko + ' 대조', srcLabel(m.failed).en + ' check']);
  }

  var h = j.holidays || {};
  if (h.error) fail(['다가오는 공휴일','Upcoming holidays']);
  else if (h.count > 0) {
    rows.push({ pill:'p-blu', pk:'자동', pe:'Auto', calm:true,
      t: L('30일 안 공휴일 ' + h.count + '일 · 걸린 수업 ' + h.classes + '건 — 새벽 6시에 자동으로 뒤로 밀립니다', h.count + ' holiday(s) in 30 days · ' + h.classes + ' class(es) on them — moved automatically at 6 AM'),
      d: (h.next||[]).map(function(x){ return esc(x.day + ' ' + x.name); }).join(' · '),
      btn: { ko:'미리보기', en:'Preview', tab:'sweeps' } });
  }

  var x = j.expiry || {};
  if (x.error) fail(['만료 안내 문자','Expiry messages']);
  else rows.push({ pill:'p-blu', pk:'자동', pe:'Auto', calm:true,
      t: L('오늘 10시 만료 안내 문자 대상 ' + x.count + '명 (7일 전 ' + x.exp7 + ' · 3일 전 ' + x.exp3 + ')', x.count + ' expiry message(s) today at 10 AM (7-day ' + x.exp7 + ' · 3-day ' + x.exp3 + ')'),
      d: L('자동으로 나갑니다. 따로 할 일은 없습니다.', 'Sent automatically. Nothing to do.'),
      btn: { ko:'대상 보기', en:'See recipients', tab:'sweeps' } });

  setCnt('cnt-todo', urgent);
  $('body').innerHTML =

function srcPill(src){
  if (src === 'both') return L('캘린더+공식','Calendar+official');
  if (src === 'official') return L('공식 공휴일','Official');
  return L('캘린더','Calendar');
}
function srcLabel(list){
  var ko = [], en = [];
  (list||[]).forEach(function(x){ if (x === 'official') { ko.push('공식 공휴일'); en.push('Official holidays'); } else { ko.push('캘린더'); en.push('Calendar'); } });
  return { ko: ko.join('·') || '공휴일', en: en.join(', ') || 'Holidays' };
}

    + (list.length ? list.map(function(h){

    if (!day) { $('lOut').innerHTML = '<div class="no">'+L('날짜를 선택해 주세요.','Pick a date.')+'</div>'; return; }

    if (!dry && !confirm(L(day+' 수업을 정말 넘길까요?', 'Really hand over the classes on '+day+'?'))) return;
    $('lOut').innerHTML = '<div class="hint">'+L('처리 중…','Working…')+'</div>';
    var j = await post('/api/pay/enroll/admin/teacher-leave', { day: day, from_teacher_id: from, to_teacher_id: to, dry: dry });
    if (!j.ok) { $('lOut').innerHTML = '<div class="no">'+esc(j.error)+'</div>'; return; }
    $('lOut').innerHTML = '<div style="margin-top:10px">'
      + '<div class="'+(j.moved_count?'ok':'hint')+'">'+(dry?L('미리보기: ','Preview: '):'')+L('넘길 수업 '+j.moved_count+'건', j.moved_count+' class(es) to hand over')+(j.skipped_count?L(' · 건너뜀 '+j.skipped_count+'건', ' · '+j.skipped_count+' skipped'):'')+'</div>'
      + (j.moved.length ? '<table><thead><tr><th>'+L('시각','Time')+'</th><th>'+L('학생','Student')+'</th></tr></thead><tbody>'
          + j.moved.map(function(m){ return '<tr><td>'+esc(m.time)+'</td><td>'+esc(m.student||'')+'</td></tr>'; }).join('') + '</tbody></table>' : '')
      + (j.skipped.length ? '<div class="no" style="margin-top:8px">'+L('건너뜀','Skipped')+'</div><table><tbody>'
          + j.skipped.map(function(m){ return '<tr><td>'+esc(m.time)+'</td><td>'+esc(m.student||'')+'</td><td class="hint">'+esc(m.reason)+'</td></tr>'; }).join('') + '</tbody></table>' : '')
      + '</div>';
  }
  $('lDry').onclick = function(){ run(true); };
  $('lGo').onclick = function(){ run(false); };
}

    + '<div class="card"><h2>🎌 ' + L('공휴일 수업 미루기 (매일 새벽 6시 자동)','Holiday class move (auto, 6 AM daily)') + '</h2>'

        + '</tbody></table>' : '');

    var r = j.result||{};
    if (j.ok !== true || r.ok === false) { $('sHolOut').innerHTML = '<div class="no">'+L('확인하지 못했습니다.','Could not check.')+'</div>'; return; }
    $('sHolOut').innerHTML = '<div class="hint">'+L('등록 공휴일 '+(r.holidays||0)+'건 · 옮길 수업 <b>'+((r.items||[]).length)+'건</b>', (r.holidays||0)+' holiday(s) · <b>'+((r.items||[]).length)+'</b> class(es) to move')+(r.failed?L(' · 자리 못 찾음 '+r.failed+'건',' · '+r.failed+' without a free slot'):'')+'</div>'

function render(){
  $('body').onclick = null;   // 탭마다 위임 핸들러를 새로 단다 — 옛 탭 핸들러가 쌓여 두 번 도는 일을 막는다
  var p;
  if (TAB === 'todo') p = viewTodo();
  else if (TAB === 'holidays') p = viewHolidays();
  else if (TAB === 'ending') p = viewEnding();
  else if (TAB === 'rates') p = viewRates();
  else if (TAB === 'leave') p = viewLeave();
  else if (TAB === 'sweeps') p = viewSweeps();
  if (p && p.catch) p.catch(function(e){
    if (e && (e.message === 'auth' || e.message === 'forbidden')) return;   // 이미 화면에 이유를 적었다
    $('body').innerHTML = '<div class="msg no">'+L('불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.','Could not load. Please reopen in a moment.')+'</div>';
  });
}

/* ═══ 🧭 (2026-08-19) 주소 뒤 #탭이름 으로 바로 그 탭을 연다 ═══
   관리자 사이드바의 손자 메뉴(「학생 ▸ 수강 운영 ▸ ⏰ 종료 후보 명단」)가 이 주소로 온다.
   ⚠️ 탭 이름은 위 .tab[data-t] 값과 같아야 한다. 모르는 이름이면 조용히 기본 탭(오늘 할 일)이다
      (하니스 sidebar_three_level_harness 가 사이드바 목록과 이 값이 어긋나면 FAIL 낸다).
   💸 (2026-09-25) 옛 «환불 계산기»(#refund) 주소는 환불 처리 화면으로 넘긴다 — 같은 계산을 하고 실제 환불까지 한다. */
function applyHashTab(){
  var h = String(location.hash || '').replace(/^#/, '');
  if (h === 'refund') { location.replace('/admin/refunds.html'); return true; }
  if (!h) return false;
  var t = document.querySelector('.tab[data-t="' + h.replace(/"/g, '') + '"]');
  if (!t) return false;
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
  t.classList.add('on'); TAB = h;
  return true;
}
window.addEventListener('hashchange', function(){ if (applyHashTab()) render(); });

/* 🌐 한/영 — 이 화면은 adm-lang-boot.js 를 안 싣는 독립 페이지라 localStorage 정본 키 `mangoi_lang` 을 직접 읽고 쓴다
   (⛔ 'adminLang' 키는 어디에서도 쓰지 않는 죽은 키 — CLAUDE.md 2장).
   ⚠️ 이 화면은 공용 i18n 엔진을 안 싣는다 — 글자는 아래 한 곳이 [data-ko]/[data-en] 을 보고 바꾼다. */
function applyLang(){
  document.documentElement.lang = EN ? 'en' : 'ko';
  var els = document.querySelectorAll('[data-ko][data-en]');
  for (var i = 0; i < els.length; i++) els[i].textContent = els[i].getAttribute(EN ? 'data-en' : 'data-ko');
  var lb = $('lang-lbl'); if (lb) lb.textContent = EN ? 'KO' : 'EN';
}
$('btn-lang').addEventListener('click', function(){
  EN = !EN;
  try { localStorage.setItem('mangoi_lang', EN ? 'en' : 'ko'); } catch(e){}
  applyLang(); render();
});

applyLang();
applyHashTab();
render();
/* 탭 이름 옆 숫자는 «오늘 할 일» 을 안 열고 들어와도 보이게 한 번 채운다(요약 API 1회 — 실패해도 조용히 둔다). */
if (TAB !== 'todo') {
  fetch('/api/pay/enroll/admin/todo', { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if (!j || j.ok !== true) return;
    if (j.ending && !j.ending.error) setCnt('cnt-ending', j.ending.count);
    if (j.calendar_missing && !j.calendar_missing.error) setCnt('cnt-holidays', j.calendar_missing.count);
  }).catch(function(){});
}

/* « 나가는 문 » — 판정 정본은 back-nav.js 의 window.mangoiGoBack 하나다(히스토리 → 같은 오리진 referrer → 폴백).
   여기에 판정을 다시 적으면 그 순간 복제가 된다. 함수가 없으면 href(/admin.html)가 폴백으로 동작한다. */
(function(){
  var back = $('lnk-back');
  if (back) back.addEventListener('click', function(e){
    if (window.mangoiGoBack) { e.preventDefault(); window.mangoiGoBack('/admin.html'); }
  });
})();
</script>
