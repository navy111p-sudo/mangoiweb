<!DOCTYPE html>

<head>

<title>오늘 수업일지 — 망고아이</title>

<script src="/js/mango-i18n.js" defer></script>
<script src="/js/session-guard.js" defer></script>
<link rel="stylesheet" href="/css/mangoi-fonts.css?v=2"><!-- ph161: 구글폰트 → 자체호스팅(라틴 장식용). 한글은 시스템 폰트 폴백 -->
<link rel="preload" as="image" href="/img/home-bg-dark.webp?v=20260730">
<style>
  *,*::before,*::after{box-sizing:border-box}
  /* 🎨 마이페이지(parent.html)·월별 리포트(report.html)와 같은 "리포트 패밀리" 톤으로 통일 — 2026-07-31 */
  body{
    position:relative;
    margin:0;
    min-height:100vh;
    background:#0a0e1a;
    color:#f1f5f9;
    font-family:MangoiHanSC,'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
    letter-spacing:-0.2px;
  }
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:url('/img/home-bg-dark.webp?v=20260730') center/cover no-repeat;filter:blur(2px) brightness(0.55) saturate(1.15);transform:scale(1.06)}
  body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center top, rgba(251,191,36,0.08), transparent 60%),radial-gradient(ellipse at center, rgba(11,15,30,0.55), rgba(8,11,24,0.95))}
  .wrap{max-width:680px;margin:0 auto;padding:32px 18px 80px}
  .brand{text-align:center;margin-bottom:24px}
  .brand-logo{
    font-family:MangoiHanSC,'Cormorant Garamond',serif;font-style:italic;font-weight:700;
    background:linear-gradient(180deg,#fff4cc,#fbbf24,#8a5e10);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    font-size:36px;letter-spacing:1px;display:block;line-height:1
  }
  .brand-sub{font-weight:800;font-size:14px;letter-spacing:-0.2px;margin-top:6px;background:linear-gradient(135deg,#fde68a 0%,#fbbf24 35%,#f59e0b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  /* 평가서 카드 */
  .eval-card{
    background:rgba(20,26,43,0.7);
    border:1px solid rgba(139,92,246,0.15);
    border-radius:22px;
    box-shadow:0 30px 80px -10px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04);
    overflow:hidden;
    backdrop-filter:blur(14px)
  }
  .eval-head{
    background:linear-gradient(135deg,rgba(251,191,36,0.20),rgba(245,158,11,0.08));
    border-bottom:1px solid rgba(251,191,36,0.30);
    padding:24px 24px 20px
  }
  .eval-title{font-size:22px;font-weight:800;color:#fff;margin:0 0 6px}
  .eval-meta{font-size:13px;color:#fde68a;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .eval-meta b{color:#fff;font-weight:700}
  .overall-row{
    display:flex;align-items:center;gap:16px;
    padding:18px 24px;
    background:rgba(0,0,0,0.25);
    border-bottom:1px solid rgba(255,255,255,0.06)
  }
  .overall-big{
    font-size:48px;font-weight:900;
    background:linear-gradient(180deg,#fff8d8,#fbbf24,#c08820);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    line-height:1;font-family:MangoiHanSC,'Inter',sans-serif
  }
  .overall-of{font-size:14px;color:#94a3b8;margin-top:6px}
  .overall-stars{font-size:20px;letter-spacing:2px;margin-top:4px}
  /* 점수 그리드 */
  .scores{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .score-row{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:12px;
    padding:12px 14px
  }
  .score-label{font-size:11.5px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .score-bar-wrap{height:8px;background:rgba(0,0,0,0.3);border-radius:99px;overflow:hidden;margin-top:6px}
  .score-bar{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width .8s ease}
  .score-num{font-size:16px;font-weight:800;color:#fde68a;font-family:MangoiHanSC,'Inter',sans-serif}
  /* 코멘트 섹션 */
  .section{padding:18px 24px;border-top:1px solid rgba(255,255,255,0.06)}
  .section h3{font-size:14px;font-weight:800;color:#c4b5fd;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
  .section p{font-size:14px;color:#e2e8f0;line-height:1.7;margin:0;white-space:pre-wrap;word-break:keep-all}
  .empty{color:#64748b;font-style:italic;font-size:13px}
  /* 푸터 */
  .eval-foot{
    padding:18px 24px;
    background:rgba(0,0,0,0.3);
    border-top:1px solid rgba(255,255,255,0.06);
    text-align:center;
    font-size:12px;
    color:#94a3b8
  }
  .eval-foot a{color:#fde68a;font-weight:700;text-decoration:none}
  .home-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:14px;
    padding:10px 22px;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);
    color:#1a1a1a;text-decoration:none;border-radius:99px;
    font-size:13.5px;font-weight:800;
    box-shadow:0 6px 18px -4px rgba(245,158,11,0.5)
  }
  /* 로딩/에러 */
  .state{padding:60px 20px;text-align:center;color:#94a3b8;font-size:14.5px;line-height:1.7}
  /* 우상단 글로벌 홈 버튼 */
  .global-home{position:fixed;top:14px;right:14px;z-index:99;background:rgba(20,28,48,0.65);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.16);color:#f1f5ff;padding:8px 14px;border-radius:99px;font-weight:700;font-size:12.5px;text-decoration:none}
  @media (max-width:480px){
    .wrap{padding:20px 12px 60px}
    .brand-logo{font-size:28px}
    .eval-title{font-size:18px}
    .scores{grid-template-columns:1fr;gap:8px}
    .overall-big{font-size:40px}
  }
</style>
</head>
<body>
  <a class="global-home" href="/" title="망고아이 홈">🏠 홈</a>
  <div class="wrap">
    <div class="brand">
      <span class="brand-logo">Mangoi</span>
      <div class="brand-sub" data-ko="오늘 수업일지" data-en="Today's Lesson Note">오늘 수업일지</div>
    </div>
    <!-- ⚠️ data-ko/data-en 을 직접 단다 — i18n 사전(js/i18n-sweep.js)은 42개 화면이 함께 실어
       고치면 ?v= 를 42곳 올려야 한다. 안 달면 사전 미스라 서버 AI 번역(/api/i18n/translate)으로
       새어 나가고, 시각·id 가 섞인 문구는 캐시가 영원히 빗나간다. -->
  <!-- 🔴 data-ko/data-en 을 #eval-root «자신» 에 달면 안 된다 — 이 요소는 화면 전체가 그려지는
       «그릇» 이라, i18n 엔진이 그 속성을 보고 textContent 를 통째로 갈아끼워 **그린 내용이 사라진다**
       (2026-09-04 실제로 밟음 — 화면이 「불러오는 중…」에서 영영 안 넘어갔다. CLAUDE.md 2장
       「아이콘 버튼에 달았더니」와 같은 뿌리다). 안쪽 span 에 단다 — 그리면 통째로 교체되어 충돌이 없다. -->
  <div id="eval-root" class="state"><span data-ko="📥 수업일지를 불러오는 중…" data-en="📥 Loading lesson notes…">📥 수업일지를 불러오는 중…</span></div>
  </div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || location.pathname.split('/').filter(Boolean).pop();
  const root = document.getElementById('eval-root');

  // 🔐 로그인된 학생 자동 감지 (index.html/report.html 로그인 시 저장되는 키들과 동일)
  function getLoggedUid(){
    try {
      var lu = JSON.parse(localStorage.getItem('mangoi_logged_user') || localStorage.getItem('mango_user') || 'null');
      if (lu && (lu.uid || lu.user_id)) return lu.uid || lu.user_id;
    } catch(e){}
    try { var u = localStorage.getItem('mangoi_uid'); if (u) return u; } catch(e){}
    return null;
  }

  // 🔑 학생 ID/비밀번호 로그인 폼 (report.html 과 동일한 /api/student/login 사용, 같은 톤으로 통일)
  function showLogin(){
    root.className = '';
    root.innerHTML = `
      <div class="eval-card" style="max-width:380px;margin:0 auto;padding:28px 24px">
        <h3 style="font-size:17px;color:#fff;text-align:center;margin-bottom:6px">🔑 학생 로그인</h3>
        <p style="color:#94a3b8;font-size:12.5px;text-align:center;margin-bottom:20px">수업일지를 보려면 로그인하세요</p>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:11.5px;color:#94a3b8;margin-bottom:6px">학생 ID</label>
          <input id="ev-lg-uid" type="text" autocomplete="username" placeholder="예: hong_gd"
            style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(139,92,246,0.35);background:#0e1e40;color:#fff;font-size:14px;outline:none">
        </div>
        <div style="margin-bottom:16px">
          <label style="display:block;font-size:11.5px;color:#94a3b8;margin-bottom:6px">비밀번호</label>
          <input id="ev-lg-pw" type="password" autocomplete="current-password" placeholder="비밀번호"
            style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(139,92,246,0.35);background:#0e1e40;color:#fff;font-size:14px;outline:none">
        </div>
        <p id="ev-lg-err" style="display:none;color:#fca5a5;font-size:12.5px;margin-bottom:12px;text-align:center"></p>
        <button id="ev-lg-btn" onclick="window.evalDoLogin()"
          style="width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a">
          로그인
        </button>
      </div>`;
    const pw = document.getElementById('ev-lg-pw');
    const idf = document.getElementById('ev-lg-uid');
    function onEnter(e){ if (e.key === 'Enter') window.evalDoLogin(); }
    if (pw) pw.addEventListener('keydown', onEnter);
    if (idf) idf.addEventListener('keydown', onEnter);
    if (idf) idf.focus();
  }

  window.evalDoLogin = async function(){
    const idf = document.getElementById('ev-lg-uid');
    const pwf = document.getElementById('ev-lg-pw');
    const err = document.getElementById('ev-lg-err');
    const btn = document.getElementById('ev-lg-btn');
    const loginId = (idf && idf.value || '').trim();
    const pw = (pwf && pwf.value || '').trim();
    if (!loginId) { if (err){ err.style.display='block'; err.textContent='학생 ID를 입력하세요'; } return; }
    if (btn) { btn.disabled = true; btn.textContent = '로그인 중…'; }
    try {
      const r = await fetch('/api/student/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: loginId, password: pw })
      });
      const d = await r.json();
      if (!d.ok) {
        if (err){ err.style.display='block'; err.textContent='❌ ' + (d.message || d.error || '로그인 실패'); }
        if (btn){ btn.disabled = false; btn.textContent = '로그인'; }
        return;
      }
      try {
        const _lu = { user_id: d.user.user_id, uid: d.user.user_id, name: d.user.user_name, user_name: d.user.user_name, role: d.user.role || 'student' };
        localStorage.setItem('mango_user', JSON.stringify(_lu));
        localStorage.setItem('mangoi_logged_user', JSON.stringify(_lu));
        localStorage.setItem('mangoi_uid', d.user.user_id);
        if (d.token) localStorage.setItem('mango_token', d.token);
      } catch(e){}
      load();
    } catch(e) {
      if (err){ err.style.display='block'; err.textContent='❌ ' + e.message; }
      if (btn){ btn.disabled = false; btn.textContent = '로그인'; }
    }
  };

  /* 📏 score_overall 은 «한 칸에 두 척도» 다 — 강사가 쓰는 1분 수업일지(/api/eval/create,
   *   bulk-create)는 1~5 이고, AI 수업 리포트(/api/eval/ai-lesson-report)는 0~100 을 같은 칸에 적는다.
   *   그래서 «/5» 를 못 박으면 100점짜리 행이 「88 / 5점」이 되고, «/10» 은 어느 쪽도 아니다.
   *   ⚠️ 두 갈래를 «행» 으로 가릴 근거가 없다 — ai_lesson_reports.evaluation_id 는
   *      2026-09-04 실측에서 2건 모두 비어 있어 조인이 안 된다. 그래서 값 자체로 척도를 읽는다.
   *   ⛔ 임의의 숫자로 «환산» 하지 말 것 — 만점이 무엇인지 화면이 그대로 말해야 한다. */
  function evalMax(v){ return (Number(v) || 0) > 5 ? 100 : 5; }
  function evalOn5(v){ var m = evalMax(v); return (Number(v) || 0) * 5 / m; }
  function stars(n){
    n = Math.max(0, Math.min(5, Math.round(n||0)));
    return '<span style="color:#fbbf24">'+'★'.repeat(n)+'</span><span style="color:#475569">'+'☆'.repeat(5-n)+'</span>';
  }
  function scoreBar(label, value){
    if (value == null || value === '') return '';
    /* ⚠️ 여기도 만점이 하나가 아니다 — AI 수업 리포트 행은 세부 점수도 0~100 이라
     *   「/ 5」를 못 박으면 「90 / 5」가 된다(위 evalMax 주석과 같은 뿌리). */
    const smax = evalMax(value);
    const pct = Math.max(0, Math.min(100, (Number(value)/smax)*100));
    return `<div class="score-row">
      <div class="score-label">${label}</div>
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <span class="score-num">${value}</span>
        <span style="font-size:12px;color:#94a3b8">/ ${smax}</span>
      </div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${pct}%"></div></div>
    </div>`;
  }
  function escapeText(s){ return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]); }

  async function load(){
    if (!id || !/^\d+$/.test(id)) {
      // 🔐 ID 없이 접속 시 로그인된 본인 계정의 평가서 목록만 표시 — 로그인 안 됐으면 로그인 화면
      //   (예전엔 여기서 비로그인 방문자에게 가짜 데모 평가서를 보여줬음 — 진짜 데이터처럼 보여 혼동을 주고,
      //    로그인 없이도 페이지가 "잘 되는 것처럼" 보여 로그인 우회 통로가 됐다. 로그인 필수로 전환.)
      var loggedUid = getLoggedUid();
      if (!loggedUid) { showLogin(); return; }
      var evTok = '';
      try { evTok = localStorage.getItem('mango_token') || ''; } catch(e){}
      var userName = '';
      try { var lu = JSON.parse(localStorage.getItem('mangoi_logged_user') || localStorage.getItem('mango_user') || 'null'); userName = (lu && (lu.name || lu.user_name)) || loggedUid; } catch(e){ userName = loggedUid; }
      fetch('/api/eval/list?uid=' + encodeURIComponent(loggedUid), evTok ? { headers: { 'Authorization': 'Bearer ' + evTok } } : {})
        .then(function(r){ if (r.status === 401) { showLogin(); return null; } return r.json(); })
        .then(function(d){
          if (!d) return; // 401 → 이미 showLogin() 처리됨
          var items = (d && d.ok && (d.rows || d.items)) || [];
          renderEvalList(items, userName);
        })
        .catch(function(){ root.innerHTML = '<div>❌ 수업일지 목록을 불러오지 못했습니다.<br><br><a href="/" style="color:#fde68a">홈으로</a></div>'; });
      return;
    }

    function renderEvalList(items, name){
      if (!items.length) {
        root.className = '';
        root.innerHTML = '<div class="eval-card" style="padding:40px 24px;text-align:center">'
          + '<div style="font-size:15px;color:#e2e8f0;margin-bottom:6px" data-ko="📋 ' + escapeText(name) + '님의 수업일지" data-en="📋 ' + escapeText(name) + '\'s Lesson Notes">📋 ' + escapeText(name) + '님의 수업일지</div>'
          + '<div class="empty" style="margin-top:10px" data-ko="아직 수업일지가 없습니다. 다음 수업 후 등록됩니다." data-en="No lesson notes yet. One is added after your next class.">아직 수업일지가 없습니다. 다음 수업 후 등록됩니다.</div>'
          + '<a href="/" style="display:inline-block;margin-top:16px;color:#fde68a;text-decoration:none;font-size:13px">🏠 홈으로</a>'
          + '</div>';
        return;
      }
      var html = '<div class="eval-card"><div class="eval-head">';
      html += '<h2 class="eval-title" data-ko="📋 ' + escapeText(name) + '님의 수업일지" data-en="📋 ' + escapeText(name) + '\'s Lesson Notes">📋 ' + escapeText(name) + '님의 수업일지</h2>';
      html += '<div class="eval-meta">총 <b>' + items.length + '개</b></div>';
      html += '</div><div style="padding:16px 24px 24px">';
      items.forEach(function(e){
        var dt = e.lesson_date || (e.created_at ? new Date(e.created_at).toISOString().slice(0,10) : '');
        /* ⚠️ 여기서 stars() 를 쓰는 이유 — 옛 코드는 점수를 그대로 '★'.repeat() 에 넣었다.
         *   그런데 이 칸에는 0~100 척도 행도 섞여 있어(위 evalMax 주석) 88 이 들어오면
         *   '☆'.repeat(5-88) 이 **RangeError 를 던져 목록 전체가 안 그려진다.**
         *   stars() 는 0~5 로 자르고, evalOn5() 가 척도를 먼저 맞춘다. */
        var st = stars(evalOn5(e.score_overall));
        html += '<a href="/eval.html?id=' + e.id + '" style="display:block;background:rgba(139,92,246,0.08);border-left:3px solid #a78bfa;border-radius:10px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:#fff;transition:all .15s" onmouseover="this.style.background=\'rgba(139,92,246,0.15)\';this.style.transform=\'translateY(-2px)\';" onmouseout="this.style.background=\'rgba(139,92,246,0.08)\';this.style.transform=\'\';">';
        html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px">';
        html += '<div><div style="font-size:11.5px;color:#fde68a;margin-bottom:4px">' + dt + '</div>';
        html += '<div style="font-size:15px;font-weight:700">' + (e.lesson_title || '수업') + '</div></div>';
        html += '<div style="text-align:right"><div style="font-size:22px;font-weight:800;background:linear-gradient(180deg,#fff8d8,#fbbf24,#c08820);-webkit-background-clip:text;-webkit-text-fill-color:transparent">' + (e.score_overall != null ? e.score_overall + '<span style="font-size:12px;font-weight:600;color:#94a3b8;-webkit-text-fill-color:#94a3b8">/' + evalMax(e.score_overall) + '</span>' : '-') + '</div>';
        html += '<div style="font-size:11px;color:#94a3b8">' + st + '</div></div></div>';
        if (e.teacher_name) html += '<div style="font-size:12px;color:#94a3b8">👨‍🏫 ' + e.teacher_name + ' 선생님</div>';
        if (e.comment) html += '<div style="font-size:12.5px;color:#cbd5e1;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.1)">💬 ' + (e.comment.length > 80 ? e.comment.substring(0,80) + '...' : e.comment) + '</div>';
        html += '</a>';
      });
      html += '<div style="text-align:center;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,0.08)">';
      html += '<a href="/" style="color:#fde68a;text-decoration:none;font-size:13px">🏠 홈으로</a>';
      html += '</div></div></div>';
      root.className = '';
      root.innerHTML = html;
    }
    try {
      var _et = ''; try { _et = localStorage.getItem('mango_token') || ''; } catch(e){}  // 🔐 본인 인증
      const r = await fetch('/api/eval/' + id, _et ? { headers: { 'Authorization': 'Bearer ' + _et } } : {});
      if (r.status === 401) { showLogin(); return; }  // 🔐 본인 계정 로그인 전엔 열람 불가
      const d = await r.json();
      if (!d.ok || !d.eval) {
        root.innerHTML = '<div>❌ 수업일지를 찾을 수 없습니다 (#'+id+').<br><br><a href="/" style="color:#fde68a">홈으로</a></div>';
        return;
      }
      const e = d.eval;
      const overall = e.score_overall;
      const dt = e.lesson_date ? e.lesson_date : new Date(e.created_at).toISOString().slice(0,10);

      const scoresHtml = [
        scoreBar('🎯 참여도', e.score_participation),
        scoreBar('💡 이해도', e.score_comprehension),
        scoreBar('📝 숙제 완성', e.score_homework),
        scoreBar('😊 수업 태도', e.score_attitude),
        scoreBar('🗣 말하기', e.score_speaking),
      ].filter(Boolean).join('');

      root.className = '';
      root.innerHTML = `
        <div class="eval-card">
          <div class="eval-head">
            <h1 class="eval-title">${escapeText(e.student_name||'학생')} 학생 수업일지</h1>
            <div class="eval-meta">
              <span>📅 <b>${escapeText(dt)}</b></span>
              ${e.lesson_title?`<span>📚 <b>${escapeText(e.lesson_title)}</b></span>`:''}
              ${e.teacher_name?`<span>👨‍🏫 <b>${escapeText(e.teacher_name)}</b> 강사</span>`:''}
            </div>
          </div>
          ${overall != null ? `
          <div class="overall-row">
            <div>
              <div class="overall-big">${overall}</div>
              <div class="overall-of" data-ko="종합 / ${evalMax(overall)}점" data-en="Overall / ${evalMax(overall)}">종합 / ${evalMax(overall)}점</div>
            </div>
            <div style="flex:1">
              <div class="overall-stars">${stars(evalOn5(overall))}</div>
              <div style="font-size:12.5px;color:#94a3b8;margin-top:6px">${(function(r){
                return r >= 4.5 ? '🏆 매우 우수' :
                       r >= 4.0 ? '⭐ 우수' :
                       r >= 3.5 ? '👍 양호' :
                       r >= 3.0 ? '🙂 보통' : '💪 분발 필요';
              })(evalOn5(overall))}</div>
            </div>
          </div>` : ''}
          ${scoresHtml ? `<div class="scores">${scoresHtml}</div>` : ''}
          <div class="section">
            <h3>✨ 잘한 점</h3>
            <p${e.strengths?'':' class="empty"'}>${e.strengths ? escapeText(e.strengths) : '— 아직 입력되지 않았어요.'}</p>
          </div>
          <div class="section">
            <h3>💪 보완할 점</h3>
            <p${e.improvements?'':' class="empty"'}>${e.improvements ? escapeText(e.improvements) : '— 아직 입력되지 않았어요.'}</p>
          </div>
          <div class="section">
            <h3>🎯 다음 수업 목표</h3>
            <p${e.next_goals?'':' class="empty"'}>${e.next_goals ? escapeText(e.next_goals) : '— 아직 입력되지 않았어요.'}</p>
          </div>
          ${e.teacher_comment ? `
          <div class="section">
            <h3>📝 강사 코멘트</h3>
            <p>${escapeText(e.teacher_comment)}</p>
          </div>` : ''}
          <div class="eval-foot">
            <div>${escapeText(e.teacher_name||'담당 강사')} 드림</div>
            <div style="margin-top:6px;font-size:11px" data-ko="수업일지 #${e.id}" data-en="Lesson note #${e.id}">수업일지 #${e.id}</div>
            <div style="margin-top:2px;font-size:11px">${new Date(e.created_at).toLocaleString('ko-KR')}</div>
            <a class="home-btn" href="/">🏠 망고아이 홈페이지로</a>
          </div>
        </div>`;
    } catch (err) {
      root.innerHTML = '<div>❌ 로드 실패: ' + (err.message||err) + '</div>';
    }
  }
  load();
})();
</script>
