<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>판단력 훈련 · 망고아이</title>
<style>
  :root{
    --pp:#a78bfa; --pp-d:#7c3aed; --gold:#fbbf24; --ink:#f4f1ff; --mut:#b6aed6;
    --card:rgba(255,255,255,.055); --line:rgba(167,139,250,.28);
    --ok:#34d399; --no:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:MangoiHanSC,'Pretendard','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
    background:#0b1020;color:var(--ink);min-height:100dvh;padding:clamp(14px,3vw,34px);
    display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  /* 🌌 살아있는 배경 — 은은히 떠다니는 빛 덩어리 */
  .blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;z-index:0}
  .b1{width:46vw;height:46vw;background:#3b1d8f;top:-14vw;left:-10vw;animation:drift 16s ease-in-out infinite alternate}
  .b2{width:38vw;height:38vw;background:#6d28d9;bottom:-12vw;right:-8vw;animation:drift 20s ease-in-out infinite alternate-reverse}
  .b3{width:22vw;height:22vw;background:#b45309;top:40%;left:60%;opacity:.22;animation:drift 24s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,4vw) scale(1.12)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}

  .wrap{position:relative;z-index:1;width:100%;max-width:1080px}

  /* ── 헤더 (기존 대비 2배 스케일) ── */
  .top{display:flex;align-items:center;gap:16px;margin:6px 4px 20px;flex-wrap:wrap}
  .top img{height:clamp(44px,6vw,64px);width:auto;filter:drop-shadow(0 6px 16px rgba(245,158,11,.4));animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(3deg)}}
  .top h1{font-size:clamp(28px,4.2vw,44px);margin:0;font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(92deg,#fdf6e3 20%,var(--gold) 55%,var(--pp) 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .top .sub{font-size:clamp(14px,1.8vw,19px);color:var(--mut);margin-top:4px;font-weight:600}
  .top .sub b{color:var(--gold)}
  /* 🪤 칩이 하나 늘 때마다 폰에서 화면이 옆으로 밀린다 — `flex:0 0 auto` 라 «줄어들지도
        줄바꿈하지도» 않기 때문이다. 2026-08-26 실측(390px): «🧑‍🎓 학생» 칩이 붙으면서
        이 상자가 467px 이 되어 문서가 81px 밖으로 나갔다(속도 버튼까지 더하면 95px).
        ⛔ 상한을 숫자로 박지 말 것 — 칩은 앞으로도 는다. 줄바꿈으로 푼다. */
  .top .btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;flex:0 1 auto;margin-left:auto}
  .pill{background:rgba(167,139,250,.14);color:#e6ddff;border:1px solid var(--line);border-radius:16px;
    padding:14px 20px;font-size:clamp(14px,1.7vw,18px);font-weight:800;cursor:pointer;white-space:nowrap;
    transition:transform .15s,background .15s,box-shadow .15s;font-family:inherit}
  .pill:hover{transform:translateY(-2px);background:rgba(167,139,250,.26);box-shadow:0 8px 20px -8px rgba(124,58,237,.55)}

  /* ← 뒤로 / 🏠 홈 — 헤더 맨 왼쪽. 다른 학습 페이지(micro-quiz 등)와 같은 크기·순서 */
  .top-nav-btn{display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:46px;height:46px;border-radius:14px;font-size:22px;line-height:1;cursor:pointer;
    background:rgba(167,139,250,.14);border:1px solid var(--line);color:#e6ddff;
    text-decoration:none;font-family:inherit;
    transition:transform .15s,background .15s,box-shadow .15s}
  .top-nav-btn:hover{transform:translateY(-2px);background:rgba(251,191,36,.18);
    box-shadow:0 8px 20px -8px rgba(124,58,237,.55)}
  .top-nav-btn:active{transform:scale(.94)}
  @media(max-width:640px){ .top-nav-btn{width:38px;height:38px;font-size:18px;border-radius:12px} }

  /* ── 💡 왜 하나요? 설명 카드 ── */
  .explain{background:linear-gradient(150deg,rgba(251,191,36,.10),rgba(124,58,237,.12));
    border:1px solid rgba(251,191,36,.30);border-radius:22px;margin-bottom:20px;overflow:hidden}
  .explain-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;
    padding:18px 24px;font-family:inherit;font-size:clamp(16px,2vw,21px);font-weight:900;color:#fde68a;text-align:left}
  .explain-head .chev{margin-left:auto;transition:transform .25s;font-size:.85em;color:var(--mut)}
  .explain.open .explain-head .chev{transform:rotate(90deg)}
  .explain-body{max-height:0;opacity:0;transition:max-height .35s ease,opacity .3s ease,padding .3s ease;padding:0 24px}
  .explain.open .explain-body{max-height:640px;opacity:1;padding:0 24px 22px}
  .explain-body p{margin:0 0 16px;font-size:clamp(15px,1.9vw,19px);line-height:1.65;color:#e9e2ff;font-weight:500}
  .explain-body p b{color:var(--gold)}
  .exp-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .exp-chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .exp-chip .ic{font-size:clamp(20px,2.6vw,28px)}
  .exp-chip b{display:block;font-size:clamp(13px,1.7vw,17px);margin-top:6px;color:#fdf6e3}
  .exp-chip span{display:block;font-size:clamp(12px,1.5vw,14.5px);color:var(--mut);margin-top:3px;line-height:1.45}
  @media(max-width:640px){.exp-chips{grid-template-columns:1fr}}

  /* ── 메인 스테이지 카드 ── */
  .card{background:linear-gradient(160deg,rgba(30,24,64,.92),rgba(15,14,38,.94));
    border-radius:28px;padding:clamp(22px,3.4vw,40px);border:1px solid var(--line);
    box-shadow:0 30px 80px -24px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06)}
  .enter{animation:cardIn .4s cubic-bezier(.34,1.4,.64,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

  .sit-label{font-size:clamp(14px,1.8vw,18px);font-weight:800;color:var(--pp);letter-spacing:.5px;margin-bottom:12px}
  .tb-chip{display:inline-block;font-size:clamp(12px,1.5vw,15px);color:#c4b5fd;font-weight:700;margin-bottom:12px;
    background:rgba(124,58,237,.18);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  .sit{font-size:clamp(20px,3vw,30px);line-height:1.55;font-weight:800;margin-bottom:26px;color:#fdf6e3}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.opts{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:16px;text-align:left;font-size:clamp(16px,2vw,21px);
    padding:clamp(16px,2.2vw,24px) clamp(16px,2vw,22px);border-radius:18px;font-family:inherit;
    border:2px solid rgba(167,139,250,.22);background:rgba(255,255,255,.045);cursor:pointer;
    transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;font-weight:700;color:var(--ink);
    opacity:0;animation:optIn .35s ease forwards}
  .opt:nth-child(1){animation-delay:.02s}.opt:nth-child(2){animation-delay:.09s}
  .opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.23s}
  @keyframes optIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .opt:hover{transform:translateY(-2px);border-color:var(--pp);background:rgba(124,58,237,.14);box-shadow:0 10px 24px -10px rgba(124,58,237,.5)}
  .opt.sel{border-color:var(--gold);background:linear-gradient(140deg,rgba(251,191,36,.16),rgba(124,58,237,.18));
    box-shadow:0 0 0 3px rgba(251,191,36,.18),0 12px 26px -10px rgba(245,158,11,.4)}
  .opt .k{width:clamp(36px,4.4vw,48px);height:clamp(36px,4.4vw,48px);flex:0 0 auto;border-radius:14px;
    background:rgba(167,139,250,.16);color:#e6ddff;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:clamp(16px,2vw,21px);transition:background .15s,color .15s}
  .opt.sel .k{background:var(--gold);color:#1a1a1a}

  .why-label{font-size:clamp(16px,2vw,21px);font-weight:800;margin:26px 0 10px;color:#fdf6e3}
  textarea{width:100%;min-height:clamp(96px,13vw,140px);border:2px solid rgba(167,139,250,.25);border-radius:18px;
    padding:16px 18px;font-size:clamp(16px,1.9vw,20px);font-family:inherit;resize:vertical;
    background:rgba(255,255,255,.05);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea::placeholder{color:#7f77a3}
  textarea:focus{outline:none;border-color:var(--pp);box-shadow:0 0 0 4px rgba(124,58,237,.18)}
  .hint{font-size:clamp(13px,1.6vw,16px);color:var(--mut);margin-top:8px}

  .btn{width:100%;margin-top:22px;padding:clamp(16px,2.2vw,22px);border:0;border-radius:18px;
    background:linear-gradient(92deg,#7c3aed,#a855f7 55%,#c084fc);color:#fff;font-family:inherit;
    font-size:clamp(17px,2.2vw,23px);font-weight:900;cursor:pointer;letter-spacing:.3px;
    box-shadow:0 14px 30px -10px rgba(124,58,237,.6);transition:transform .15s,box-shadow .15s,opacity .15s}
  .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 36px -10px rgba(124,58,237,.75)}
  .btn:active:not(:disabled){transform:scale(.985)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:rgba(167,139,250,.14);color:#e6ddff;border:1px solid var(--line);box-shadow:none}
  .btn.gold{background:linear-gradient(92deg,#f59e0b,#fbbf24);color:#1a1a1a;box-shadow:0 14px 30px -10px rgba(245,158,11,.5)}

  /* ── 🎚️ 읽기 난이도 탈출구 — 조용하게. 레벨 '숫자'는 아이에게 보여주지 않습니다.
        ("너는 레벨 2"는 초등학생에게 낙인이 됩니다. 문장 길이만 조용히 바뀝니다.) ── */
  .lvladj{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  /* 눈에 띄지 않게 두되 터치 영역은 44px 이상 — 초등학생 손가락 기준(작으면 오터치로 난이도가 엉뚱하게 바뀜) */
  .lvladj button{flex:0 1 auto;background:transparent;border:1px dashed var(--line);color:var(--mut);
    font-family:inherit;font-size:clamp(12px,1.5vw,15px);font-weight:700;padding:0 18px;min-height:46px;border-radius:999px;
    cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .lvladj button:hover{color:#e6ddff;border-color:var(--pp);background:rgba(167,139,250,.1)}
  .lvladj button:disabled{opacity:.45;cursor:not-allowed}
  .lvlnote{display:block;margin-bottom:12px;font-size:clamp(12px,1.5vw,15px);font-weight:700;
    color:#a7f3d0;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);
    border-radius:12px;padding:9px 14px}

  /* ── 🏷️ 문장 난이도 고르기 — 숫자가 아니라 '기초·중급' 같은 이름으로 고릅니다 ── */
  .lvp-title{font-size:clamp(17px,2.2vw,23px);font-weight:900;color:var(--pp);margin-bottom:6px}
  .lvp-list{display:grid;gap:10px;margin:16px 0 4px}
  .lvp-item{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,transform .12s}
  .lvp-item:hover{border-color:var(--pp);background:rgba(167,139,250,.12);transform:translateY(-1px)}
  .lvp-item.cur{border-color:var(--pp);background:rgba(124,58,237,.2)}
  .lvp-name{display:block;font-size:clamp(16px,2vw,20px);font-weight:900;color:var(--ink);margin-bottom:3px}
  .lvp-desc{display:block;font-size:clamp(12px,1.5vw,15px);color:var(--mut);font-weight:600}
  /* 교재 Lv 을 이름 바로 옆에 — 학생은 이름으로, 강사는 Lv 으로 같은 것을 가리키게 합니다 */
  .lvp-lv{font-size:clamp(11px,1.3vw,14px);color:#a78bfa;font-weight:800;white-space:nowrap;margin-left:7px}
  .lvp-now{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;color:#1a1a1a;
    background:linear-gradient(92deg,#f59e0b,#fbbf24);border-radius:999px;padding:2px 9px;vertical-align:middle}

  /* ── 🎚️ 난이도를 누가 정할지 — 두 가지 모드 ── */
  .lvm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
  @media(max-width:560px){.lvm{grid-template-columns:1fr}}
  .lvm-btn{display:block;width:100%;text-align:left;background:rgba(255,255,255,.05);
    border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;
    font-family:inherit;transition:border-color .15s,background .15s,transform .12s}
  .lvm-btn:hover{border-color:var(--pp);background:rgba(167,139,250,.12);transform:translateY(-1px)}
  .lvm-btn.cur{border-color:#fbbf24;background:rgba(245,158,11,.16)}
  .lvm-ic{font-size:22px;line-height:1}
  .lvm-t{display:block;margin-top:6px;font-size:clamp(15px,1.9vw,19px);font-weight:900;color:var(--ink)}
  .lvm-d{display:block;margin-top:3px;font-size:clamp(12px,1.4vw,14px);color:var(--mut);font-weight:600}
  .lvm-on{display:inline-block;margin-left:7px;font-size:11px;font-weight:800;color:#1a1a1a;
    background:linear-gradient(92deg,#f59e0b,#fbbf24);border-radius:999px;padding:2px 9px;vertical-align:middle}
  .lvp-sub{margin:18px 0 0;font-size:clamp(13px,1.6vw,16px);font-weight:800;color:var(--pp)}

  /* ── 🎬 첫 진입 설정 카드(2026-08-26) — 새 상자를 만들지 않고 위 .lvm-* 를 그대로 씁니다.
        한 줄에 하나씩 놓아야 «① → ②» 순서가 눈으로 읽힙니다(2열이면 나란히 놓여 순서가 사라짐). */
  .lvm.one{grid-template-columns:1fr}
  .setup-num{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;
    margin-right:7px;border-radius:50%;background:linear-gradient(92deg,#7c3aed,#a78bfa);
    color:#fff;font-size:12px;font-weight:900;vertical-align:middle}
  /* 추천 갈래는 테두리로만 구분합니다 — 1-3 «판단력 훈련 UI 의 게임 요소 금지» */
  .lvm-btn.reco{border-color:#a78bfa;background:rgba(124,58,237,.16)}
  .lvm-reco{display:inline-block;margin-left:7px;font-size:11px;font-weight:800;color:#1a1a1a;
    background:linear-gradient(92deg,#a78bfa,#c4b5fd);border-radius:999px;padding:2px 9px;vertical-align:middle}

  /* ── 🎯 레벨 찾기(배치테스트) ── */
  .pl-cta{display:block;width:100%;margin-top:12px;text-align:left;background:rgba(16,185,129,.12);
    border:2px solid rgba(16,185,129,.35);border-radius:16px;padding:14px 16px;cursor:pointer;
    font-family:inherit;transition:border-color .15s,background .15s,transform .12s}
  .pl-cta:hover{border-color:#10b981;background:rgba(16,185,129,.2);transform:translateY(-1px)}
  .pl-cta .lvm-t{color:#a7f3d0}
  .pl-dots{display:flex;gap:7px;justify-content:center;margin-bottom:14px}
  .pl-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.16)}
  .pl-dot.on{background:linear-gradient(92deg,#10b981,#34d399)}
  .pl-dot.now{background:#fbbf24;transform:scale(1.25)}
  .pl-step{font-size:clamp(12px,1.5vw,15px);font-weight:800;color:var(--mut);text-align:center;margin-bottom:10px}
  .pl-done{text-align:center;padding:8px 0 2px}
  .pl-done .big{font-size:clamp(24px,4vw,38px);font-weight:900;color:#a7f3d0;margin:10px 0 4px}
  .pl-done .sub{font-size:clamp(13px,1.7vw,17px);color:var(--mut);font-weight:600}

  /* ── 결과 ── */
  .res{margin-top:2px}
  .banner{border-radius:18px;padding:18px 22px;font-weight:900;font-size:clamp(19px,2.6vw,27px);
    margin-bottom:18px;display:flex;align-items:center;gap:12px;animation:pop .45s cubic-bezier(.34,1.8,.64,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .banner.ok{background:rgba(52,211,153,.14);color:var(--ok);border:1px solid rgba(52,211,153,.4)}
  .banner.no{background:rgba(251,191,36,.12);color:var(--no);border:1px solid rgba(251,191,36,.35)}
  .fb{font-size:clamp(16px,2vw,20px);line-height:1.65;background:rgba(124,58,237,.12);border:1px solid var(--line);
    border-radius:16px;padding:18px 20px;margin-bottom:16px;color:#efe9ff}
  .best{font-size:clamp(15px,1.8vw,18px);color:var(--mut);margin-bottom:16px}
  .best b{color:var(--gold)}

  /* 🗣️ 내가 고른 표현 + 그게 어떻게 들리는지 */
  .mypick{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.32);
    border-radius:16px;padding:16px 20px;margin-bottom:16px}
  .mypick .mp-h{font-size:clamp(12px,1.5vw,14px);font-weight:800;color:var(--gold);letter-spacing:.4px;margin-bottom:6px}
  .mypick .mp-q{font-size:clamp(17px,2.2vw,22px);font-weight:800;color:#fdf6e3;line-height:1.45}
  .mypick .mp-w{font-size:clamp(14px,1.8vw,18px);color:#e9e2ff;line-height:1.6;margin-top:8px}

  /* 📊 선택지 채점표 — 네 표현을 점수와 함께 나란히 비교 */
  .ot{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;
    padding:16px 18px;margin-bottom:16px}
  .ot-h{font-size:clamp(13px,1.6vw,16px);font-weight:800;color:var(--pp);margin-bottom:12px}
  .ot-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;
    padding:9px 10px;border-radius:12px;margin-bottom:4px}
  .ot-row.mine{background:rgba(251,191,36,.12);box-shadow:inset 0 0 0 1px rgba(251,191,36,.3)}
  .ot-k{width:26px;height:26px;border-radius:8px;background:rgba(167,139,250,.18);color:#e6ddff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
  .ot-t{font-size:clamp(14px,1.8vw,18px);font-weight:700;color:#efe9ff;line-height:1.45}
  .ot-b,.ot-m{display:inline-block;font-size:clamp(10px,1.2vw,12px);font-weight:800;
    border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle;white-space:nowrap}
  .ot-b{background:rgba(52,211,153,.18);color:#6ee7b7}
  .ot-m{background:rgba(251,191,36,.2);color:var(--gold)}
  .ot-s{font-size:clamp(15px,1.9vw,19px);font-weight:900;min-width:2.4em;text-align:right}
  .ot-s.g{color:#34d399} .ot-s.y{color:var(--gold)} .ot-s.r{color:#f87171}

<script>
(function(){
  // 로그인 사용자: ?uid= → 사이트 공통 로그인(mango_user/mangoi_logged_user JSON) → 개별 키
  function resolveUser(){
    var qs = new URLSearchParams(location.search).get('uid');
    if(qs) return { uid:qs, name:'' };
    try{ var u=JSON.parse(localStorage.getItem('mangoi_logged_user')||'null'); if(u&&(u.uid||u.user_id||u.id)) return { uid:u.uid||u.user_id||u.id, name:u.name||'' }; }catch(e){}
    try{ var a=JSON.parse(localStorage.getItem('mango_user')||'null'); if(a&&(a.uid||a.user_id||a.id)) return { uid:a.uid||a.user_id||a.id, name:a.name||'' }; }catch(e){}
    var plain = localStorage.getItem('mangoi_uid') || localStorage.getItem('mango_uid') || localStorage.getItem('mangoUid')
      || localStorage.getItem('uid') || localStorage.getItem('student_uid') || '';
    return { uid:plain, name:'' };
  }
  var _USER = resolveUser();
  var UID = _USER.uid;
  /* 🔐 (2026-08-28) 본인 확인용 서명 토큰 — 서버가 이 화면의 세 API(growth·scenario·answer)에
     소유자 판정을 걸었다. 예전에는 검사가 아예 없어서 아이디만 알면 남의 아이 판단력 기록을
     읽고 오답까지 밀어 넣을 수 있었다(무인증 실측으로 확인).
     ⚠️ 게스트(guest_*)는 토큰 없이 그대로 통과한다 — 비로그인 체험 흐름은 안 깨진다.
     본보기: review-quiz.html·idx-x8.js 가 쓰는 것과 같은 방식(localStorage 'mango_token'). */
  function authTok(){ try { return localStorage.getItem('mango_token') || ''; } catch(e){ return ''; } }
  var NAME = _USER.name || localStorage.getItem('mango_name') || localStorage.getItem('studentName') || '';
  var TEXTBOOK = localStorage.getItem('mangoi_default_textbook') || localStorage.getItem('mango_textbook') || localStorage.getItem('textbook') || '';
  // 🌐 언어: ?lang= → 사이트 공통 mangoi_lang(홈 토글과 자동 동기화) → 구키 폴백 → 기본 ko
  function normLang(l){ l=String(l||'').slice(0,2).toLowerCase(); return (l==='en'||l==='zh') ? l : 'ko'; }
  var LANG = normLang(new URLSearchParams(location.search).get('lang') || localStorage.getItem('mangoi_lang') || localStorage.getItem('mango_lang') || localStorage.getItem('lang') || 'ko');
  function T(ko,en,zh){ return LANG==='en' ? en : LANG==='zh' ? (zh||en) : ko; }

  var stage = document.getElementById('stage');
  var streakEl = document.getElementById('streak');
  var scenario = null, chosen = -1, solved = 0, view = 'q';

  /* ══ 🔊 원어민 음성 — 상황문·보기를 미국 원어민 여성 목소리로 들려준다 ═══════════
     · 소리는 공용 모듈 /js/game-tts.js 하나로만 낸다(서버 Deepgram Aura-2 → Aura-1
       → MeloTTS → 브라우저 음성 순 폴백. 서버 응답은 R2 에 캐시돼 두 번째부터는 즉시).
     · ⚠️ game-tts.js 는 defer 라 이 인라인 스크립트보다 «나중에» 실행된다.
       그래서 여기서 곧바로 setLang/setSpeaker 를 부르면 window.MangoiTTS 가 없어
       조용히 아무 일도 안 일어난다 — 말할 때 늦게 한 번만 준비한다(ttsOn).
     · ⚠️ 첫 문제는 브라우저 자동재생 정책 때문에 소리가 안 날 수 있다(사용자가 이 문서에서
       아직 아무것도 누르지 않은 상태). 그래서 문장·보기마다 🔊 를 두었고, 한 번 누른
       뒤부터는 새 문제가 올 때 상황문을 자동으로 읽어 준다. */
  var MUTE_KEY = 'mangoi_judgment_muted';
  var MUTED = (function(){ try{ return localStorage.getItem(MUTE_KEY)==='1'; }catch(e){ return false; } })();
  /* 🐢 읽기 속도 — 「조금 빠르다」(2026-08-26 사장님)는 제보로 넣었다.
     · 처음엔 0.75 / 0.9 / 1.0 이었는데 「0.75 도 좀 빠르다」(같은 날)로 **눈금을 한 칸씩
       내렸다**: 0.6 / 0.75 / 0.9. 기본도 제일 느린 0.6 이다 — 두 번 연속 «빠르다» 였으므로
       아무것도 안 눌러도 느린 쪽에서 시작하고, 빠르게 듣고 싶으면 한 번 누르면 된다.
     · ⛔ 0.5 아래로는 내리지 말 것 — playbackRate 가 그 아래에서는 소리가 뭉개진다
       (음높이 보정이 한계에 부딪힌다). 더 느려야 하면 화자·엔진을 바꾸는 별건이다.
     · 값이 세 개뿐인 이유: 슬라이더는 폰에서 정확히 집기 어렵고 «지금 몇 배속인지» 가 안 보인다.
     · 서버 음성은 <audio>.playbackRate 로, 브라우저 폴백은 utterance.rate 로 적용된다
       (둘 다 game-tts.js 의 speak(text, rate) 가 알아서 갈라 준다. 음높이는 안 변한다). */
  var RATE_KEY = 'mangoi_judgment_rate';
  var RATES = [0.6, 0.75, 0.9];
  var RATE_I = (function(){
    try{
      var v = parseFloat(localStorage.getItem(RATE_KEY));
      for(var i=0;i<RATES.length;i++) if(Math.abs(RATES[i]-v) < 0.01) return i;
    }catch(e){}
    return 0;   // 기본 = 0.6 (느리게) — 「0.75 도 빠르다」(2026-08-26 사장님)
  })();
  function rate(){ return RATES[RATE_I]; }
  var _ttsReady = false;
  var _autoSay = false;   // 새 문제·새 채점 결과가 «막 도착했을 때» 만 자동 낭독(언어 토글 재렌더에는 안 읽는다)
  var _pending = null;    // 모듈이 아직 안 왔을 때 «읽어 달라» 던 문장 (아래 flushPending 이 마저 읽는다)

  function ttsOn(){
    if(!window.MangoiTTS) return false;
    if(!_ttsReady){
      // 🎙 미국 원어민 여성 asteria — Aura-2·Aura-1 «양쪽 목록에 다 있는» 이름이라
      //    서버가 한 단계 폴백해도 목소리(성별)가 바뀌지 않는다. 바꿀 때 이 점을 확인할 것.
      try{ MangoiTTS.setLang('en'); MangoiTTS.setSpeaker('asteria'); }catch(e){}
      _ttsReady = true;
    }
    return true;
  }
  function sayStop(){
    try{ if(window.MangoiTTS) MangoiTTS.stop(); }catch(e){}
    try{ Array.prototype.forEach.call(document.querySelectorAll('.spk.playing'), function(b){ b.classList.remove('playing'); }); }catch(e){}
  }
  function say(text, btn){
    if(MUTED) return;
    text = String(text==null?'':text).trim();
    if(!text) return;
    // ⚠️ 서버가 문제를 «즉시»(캐시) 돌려주면 이 화면이 그려질 때 defer 로 실린 game-tts.js 가
    //    아직 안 와 있다. 그대로 돌아가면 첫 문제만 소리가 안 나므로 적어 두었다가 마저 읽는다.
    if(!window.MangoiTTS){ _pending = { text: text, btn: btn }; return; }
    if(!ttsOn()) return;
    sayStop();
    if(btn) btn.classList.add('playing');
    try{ MangoiTTS.speak(text, rate(), function(){ if(btn) btn.classList.remove('playing'); }); }
    catch(e){ if(btn) btn.classList.remove('playing'); }
  }
  function flushPending(){
    if(!_pending || MUTED || !window.MangoiTTS) return;
    var q = _pending; _pending = null;
    // 버튼이 그 사이 다시 그려졌으면(언어 토글 등) 하이라이트는 포기하고 소리만 낸다
    say(q.text, (q.btn && q.btn.isConnected) ? q.btn : null);
  }
  window.addEventListener('DOMContentLoaded', flushPending);

  // 🔢 숫자 카운트업
  function countUp(el, target, ms){
    if(target==null || isNaN(target)){ el.textContent='—'; return; }
    var t0=null, done=false;
    function step(ts){
      if(!t0) t0=ts;
      var k=Math.min(1,(ts-t0)/ms); k=1-Math.pow(1-k,3);
      el.textContent=Math.round(target*k);
      if(k<1) requestAnimationFrame(step); else done=true;
    }
    requestAnimationFrame(step);
    // ⚠️ rAF 는 백그라운드 탭·저전력 모드에서 아예 안 돕니다. 그러면 점수가 '—' 인 채로 굳습니다.
    //    애니메이션은 곁들이는 것일 뿐, 숫자는 반드시 나와야 하므로 타이머로 최종값을 보장합니다.
    setTimeout(function(){ if(!done) el.textContent=Math.round(target); }, ms+400);
  }

  // ⚡ 다음 문제 선(先)생성 — 문제는 AI가 만들어 몇 초 걸립니다. 학생이 지금 문제를 푸는 동안

  var prefetch = null, prefetchDone = false;
  function requestScenario(focusMisc, nudge, setBand, mode, probeBand, src, ageGroup){
    var body = {uid:UID, lang:'en', textbook:TEXTBOOK};
    if(focusMisc) body.focus_misconception = focusMisc;
    // 🎚️ 읽기 난이도 조정 — 서버가 밴드를 옮긴 뒤 그 밴드로 문제를 만들어 돌려줍니다.
    //    새 API 경로 없이 기존 요청에 실어 보냅니다.
    if(nudge) body.band_nudge = nudge;
    if(setBand) body.set_band = setBand;      // 목록에서 직접 고른 범주(1~8)
    if(mode) body.band_mode = mode;           // 'auto'(AI가 조절) / 'manual'(고른 자리 유지)
    if(probeBand) body.probe_band = probeBand; // 레벨 찾기 — 저장값은 안 건드리고 이 밴드로만 출제
    if(src) body.band_src = src;              // 밴드를 누가 정했는지 기록('placement')
    if(ageGroup) body.age_group = ageGroup;    // 🧑‍🎓 누구를 위한 문제인가('child'/'adult') — 실력과 독립인 축
    body.token = authTok();                    // 🔐 본인 확인(게스트는 빈 값 그대로)
    return fetch('/api/judgment/scenario', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body:JSON.stringify(body)})
      .then(function(r){ return r.json(); })
      .catch(function(){ return null; });
  }
  //   ageGroup 을 주면 그 나이대로 미리 만듭니다 — 첫 설정 카드에서 «성인» 을 누른 순간
  //   서버에 저장까지 함께 끝내려는 것입니다(그래야 그다음 «시작» 이 기다림 0 이 됩니다).
  function prefetchNext(ageGroup){
    if(prefetch) return;
    prefetchDone = false;
    prefetch = requestScenario(null, 0, 0, null, 0, null, ageGroup || null).then(function(d){ prefetchDone = true; return d; });
  }

  // renderFirstRunSetup() 이 자체 흐름으로 처리). 헤더 pill 로 명시적으로 바꾼 경우도

  // 방금 'AI가 맞춰줄게요'로 바꾼 경우에만 안내 한 줄을 띄우기 위한 표시(다음 문제부터는 안 띄움)
  var MODE_JUST_SET = false;
  function captureBand(d){
    if(!d) return;
    if(Array.isArray(d.band_catalog) && d.band_catalog.length) BAND_CATALOG = d.band_catalog;
    if(d.reading_band) CUR_BAND = Number(d.reading_band)||0;
    if(d.band_mode) CUR_MODE = (d.band_mode==='manual') ? 'manual' : 'auto';
    if(d.age_group) CUR_AGE = (d.age_group==='adult') ? 'adult' : 'child';
    updateAgeBtn();
  }
  function bandText(b, key){
    // key: 이름(n) / 설명(d) — 화면 언어에 맞춰 고릅니다
    if(key==='n') return LANG==='en' ? b.en : LANG==='zh' ? b.zh : b.ko;
    return LANG==='en' ? b.den : LANG==='zh' ? b.dzh : b.dko;
  }
  // ⚠️ 서버의 reading_band_name 을 그대로 쓰면 안 됩니다 — 그건 '문제 지문의 언어'(항상 en)를 따라가서
  //    한국어 화면에 'Elementary' 가 떴습니다. 화면 언어는 여기서만 아니까 목록에서 골라 씁니다.
  function bandNameOf(band){
    var list = BAND_CATALOG || [];
    for(var i=0;i<list.length;i++) if(Number(list[i].band)===Number(band)) return bandText(list[i],'n');
    return '';
  }
  // ── 🎯 레벨 찾기(배치테스트) — 6문항 적응형 ──────────────────────────────
  //   가운데(4)에서 시작해 맞으면 올리고 틀리면 내리되 보폭을 줄여 수렴합니다.
  //   채점은 여기서 correct_index 로 바로 합니다 — AI 재호출이 없어 3분이면 끝납니다.
  //   ⚠️ 배치 문항은 /api/judgment/answer 로 보내지 않습니다.
  //      일부러 너무 어려운 문제를 섞기 때문에 판단력 지수에 넣으면 점수가 왜곡됩니다.
  var PL_ITEMS = 6, PL_START = 4, PL_FIRST_STEP = 2;
  var plOn = false, plIdx = 0, plBand = PL_START, plStep = PL_FIRST_STEP, plQ = null, plCorrect = 0;

  function plDots(){
    var s = '';
    for(var i=0;i<PL_ITEMS;i++) s += '<span class="pl-dot'+(i<plIdx?' on':(i===plIdx?' now':''))+'"></span>';
    return '<div class="pl-dots">'+s+'</div>';
  }
  function startPlacement(){
    plOn = true; plIdx = 0; plBand = PL_START; plStep = PL_FIRST_STEP; plCorrect = 0;
    prefetch = null; prefetchDone = false;      // 배치 중엔 미리 받아둔 일반 문제를 쓰지 않습니다
    nextPlacementQuestion();
  }
  async function nextPlacementQuestion(){
    view = 'placement';
    loading(T('레벨을 찾는 중이에요…','Finding your level…','正在测定你的难度…'));
    var d = await requestScenario(null, 0, 0, null, plBand);
    if(!validScenario(d)){
      stage.innerHTML = '<div class="center">'+T('문제를 불러오지 못했어요.','Could not load a question.','题目加载失败。')
        + '<br><button class="btn ghost" style="max-width:260px;margin:18px auto 0" id="plAbort">'+T('그만두기','Stop','退出')+'</button></div>';
      var ab=document.getElementById('plAbort'); if(ab) ab.addEventListener('click', function(){ plOn=false; loadScenario(); });
      return;
    }
    captureBand(d);   // 목록만 받아 둡니다(배치 중 reading_band 는 탐색값이라 CUR_BAND 로 쓰지 않음)
    plQ = d;
    _autoSay = true;
    renderPlacement();
  }
  function renderPlacement(){
    view = 'placement';
    var letters = ['A','B','C','D'];
    var opts = plQ.options.map(function(o,i){
      return '<button class="opt" data-i="'+i+'"><span class="k">'+letters[i]+'</span><span>'+esc(o)+'</span>'+spk(o)+'</button>';
    }).join('');
    stage.innerHTML =
      plDots()+
      '<div class="pl-step">'+T('레벨 찾기','Finding your level','测定难度')+' '+(plIdx+1)+' / '+PL_ITEMS+'</div>'+
      '<div class="sit-label">🗣️ '+T('이런 상황이에요','Here is the situation','情境是这样的')+spk(plQ.situation, 'sit-spk')+'</div>'+
      '<div class="sit">'+esc(plQ.situation)+'</div>'+
      '<div class="opts">'+opts+'</div>'+
      '<div class="hint">✨ '+T('가장 잘 어울리는 말을 골라요. 이유는 안 써도 돼요.',
                                'Just pick the best one — no need to explain here.',
                                '选出最合适的说法即可，这里不用写理由。')+'</div>'+
      '<button class="btn ghost" id="plStop" style="margin-top:14px">'+T('그만두기','Stop','退出')+'</button>';
    reEnter();
    prefetchList([plQ.situation].concat(plQ.options || []));
    if(_autoSay){ _autoSay = false; say(plQ.situation, stage.querySelector('.sit-spk')); }
    Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(el){
      el.addEventListener('click', function(){
        Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(x){ x.disabled = true; });
        answerPlacement(Number(el.getAttribute('data-i')));
      });
    });
    var st=document.getElementById('plStop');
    if(st) st.addEventListener('click', function(){ plOn=false; loadScenario(); });
  }
  function answerPlacement(idx){
    var ok = (Number(idx) === Number(plQ.correct_index));
    if(ok) plCorrect++;
    // 계단 이동 — 맞으면 올리고 틀리면 내리되 보폭을 한 칸씩 줄입니다(서버 placementNext 와 같은 규칙)
    plBand = Math.max(1, Math.min(8, plBand + (ok ? plStep : -plStep)));
    plStep = Math.max(1, plStep - 1);
    plIdx++;
    if(plIdx >= PL_ITEMS) finishPlacement();
    else nextPlacementQuestion();
  }
  async function finishPlacement(){
    view = 'placement';
    loading(T('딱 맞는 난이도를 정하고 있어요…','Setting your level…','正在设定你的难度…'));
    // 찾은 밴드로 확정 + 모드는 '자동' — 배치는 출발점만 정하고, 이후는 AI 가 이어서 맞춥니다
    var d = await requestScenario(null, 0, plBand, 'auto', 0, 'placement');
    plOn = false;
    captureBand(d);
    var nm = bandNameOf(plBand) || '';
    var lv = (BAND_CATALOG||[]).filter(function(b){return Number(b.band)===Number(plBand);})[0];
    stage.innerHTML =
      '<div class="pl-done">'+
        '<div style="font-size:44px">🎯</div>'+
        '<div class="sub">'+T('너에게 딱 맞는 난이도를 찾았어요','We found your level','已找到适合你的难度')+'</div>'+
        '<div class="big">'+esc(nm)+'</div>'+
        '<div class="sub">'+(lv?esc(lv.lv)+' · '+esc(bandText(lv,'d')):'')+'</div>'+
        '<div class="hint" style="margin-top:14px">'+T('6문제 중 '+plCorrect+'개를 맞혔어요. 이제 AI가 계속 맞춰줄게요.',
              'You got '+plCorrect+' of 6. AI will keep adjusting from here.',
              '6题中答对'+plCorrect+'题。接下来AI会继续调整。')+'</div>'+
        '<button class="btn" id="plGo" style="margin-top:18px">'+T('이 난이도로 시작하기 🚀','Start at this level 🚀','用这个难度开始 🚀')+'</button>'+
      '</div>';
    reEnter();
    var go=document.getElementById('plGo');
    if(go) go.addEventListener('click', function(){
      if(validScenario(d)){ scenario = d; _autoSay = true; renderQuestion(); reEnter(); prefetchNext(); }
      else loadScenario();
    });
  }

  // ── 🎬 첫 진입 설정 카드 (2026-08-26 사장님 지시) ──────────────────────────
  //   왜 만들었나 — 신규 학생은 지금 **전원 밴드 3**에서 시작합니다. 설계서의 1순위였던
  //   «강사가 준 레벨» 은 운영 D1 실측으로 `students_erp.level` 0/29,417행 · `level_tests` 0행이라
  //   현장에 존재하지 않습니다. 즉 «폴백이 곧 전부» 입니다.
  //
  //   ⛔ 그렇다고 배치테스트 6문항을 첫 관문으로 세우지는 않습니다 — 문항은 문제은행이 아니라
  //      LLM 이 요청마다 만들고, 배치 중에는 선(先)생성도 꺼집니다(아래 startPlacement).
  //      운영 실측(analysis_perf_log 최근 14일 78건): 평균 11.0초 · 절반이 10초 초과 · 최대 57초
  //      → 6문항이면 **대기만 1분 이상**입니다. 첫 방문의 이탈은 «어려워서» 가 아니라 «안 떠서» 납니다.
  //   ✅ 그래서 이 카드는 LLM 호출 0 으로 즉시 뜨고, **카드가 떠 있는 동안 뒤에서 첫 문제를 만듭니다.**
  //      가장 흔한 갈래(🤖 AI가 맞춰줄게요)를 고르면 문제가 이미 와 있어 기다림이 0 이 됩니다.
  //      지금의 «첫 화면 8~11초 공백» 이 «설명 읽는 시간» 으로 바뀌는 것이 이 변경의 진짜 이득입니다.
  //
  //   ⚠️ «난이도» 만 묻지 않는 이유 — 밴드는 답을 보고 자동으로 움직이지만
  //      나이대(child/adult)는 학생이 말해 주지 않으면 **영원히** 학교·친구 소재에 머뭅니다.
  //      자동 조절이 못 맞추는 유일한 축이라 첫 카드에 반드시 있어야 합니다(2026-08-26 결정).
  var SETUP_KEY = 'mangoi_judg_setup_v1';
  var setupAge = 'child', setupList = false, setupBusy = false;
  // ⚠️ 사파리 프라이빗 등에서 localStorage 접근 자체가 예외를 던집니다 — 못 읽으면 «아직 안 정함» 으로
  //    보고 카드를 띄웁니다(카드에 «바로 시작» 갈래가 있으므로 최악이어도 한 번 더 묻는 것으로 끝납니다).
  function setupDone(){ try{ return localStorage.getItem(SETUP_KEY)==='1'; }catch(e){ return false; } }
  function markSetupDone(){ try{ localStorage.setItem(SETUP_KEY,'1'); }catch(e){} }

  function setupStart(fn){
    if(setupBusy) return false;      // 연타로 요청이 두 번 나가지 않게
    setupBusy = true; markSetupDone();
    Array.prototype.forEach.call(stage.querySelectorAll('button'), function(b){ b.disabled = true; });
    fn();
    return true;
  }

  function renderFirstRunSetup(){
    view = 'setup';
    // 📜 «왜 판단력 훈련을 하나요?» 설명 상자는 기본이 펼침(class="explain open")이라 폰에서 두 화면쯤 됩니다.
    //    그 아래로 밀리면 정작 «정하라»고 띄운 카드가 스크롤 밖에 있어 첫 진입의 뜻이 사라집니다
    //    (390px 실측 2026-08-26: 카드 top 966px — 화면 844px 밖).
    //    ⛔ 상자를 없애지는 않습니다 — 제목 줄이 그대로 토글이라 한 번 누르면 다시 펼쳐집니다.
    try{ document.getElementById('explain').classList.remove('open'); }catch(e){}
    // ⚡ 카드가 떠 있는 동안 첫 문제를 뒤에서 만들어 둡니다 — 이 카드의 진짜 이득이 이 한 줄입니다.
    //    (이미 만들고 있으면 prefetchNext 가 그냥 돌아가므로, 다시 그릴 때마다 불러도 안전합니다)
    if(!prefetch) prefetchNext(setupAge==='adult' ? 'adult' : null);
    var onChip = '<span class="lvm-on">'+T('선택','on','已选')+'</span>';
    function ageBtn(g, ic, t, d){
      var cur = (setupAge===g);
      return '<button type="button" class="lvm-btn su-age'+(cur?' cur':'')+'" data-g="'+g+'">'
        + '<span class="lvm-ic">'+ic+'</span>'
        + '<span class="lvm-t">'+t+(cur?onChip:'')+'</span>'
        + '<span class="lvm-d">'+d+'</span></button>';
    }
    // ②의 «직접 고르기» 목록 — 이름·설명의 단일 출처는 서버(judgment-level.ts)입니다.
    //   BAND_CATALOG 는 부팅 때 `?only=band` 로 이미 받아 둡니다(LLM 대기 없음).
    var list = '';
    if(setupList){
      list = (BAND_CATALOG && BAND_CATALOG.length)
        ? '<div class="lvp-list">'+BAND_CATALOG.map(function(b){
            return '<button type="button" class="lvp-item su-band" data-b="'+b.band+'">'
              + '<span class="lvp-name">'+esc(bandText(b,'n'))+'<span class="lvp-lv">('+esc(b.lv)+')</span></span>'
              + '<span class="lvp-desc">'+esc(bandText(b,'d'))+'</span></button>';
          }).join('')+'</div>'
        : '<div class="hint" style="margin-top:10px">'+T('난이도 목록을 불러오는 중이에요…','Loading the level list…','正在加载难度列表…')+'</div>';
    }
    stage.innerHTML =
      '<div class="lvp-title">🎬 '+T('시작하기 전에 두 가지만 정할게요','Two quick things before we start','开始前先定两件事')+'</div>'+
      '<div class="hint">'+T('건너뛰어도 괜찮아요. 나중에 언제든 바꿀 수 있어요.',
                             'You can skip this — everything is changeable later.',
                             '跳过也没关系，之后随时可以更改。')+'</div>'+

      '<div class="lvp-sub"><span class="setup-num">1</span>'+T('누구를 위한 문제인가요?','Who is this for?','谁在做题？')+'</div>'+
      '<div class="hint">'+T('문장 난이도가 아니라 «소재와 말투»가 달라져요.',
                             'This changes the topics and tone — not the sentence level.',
                             '这改变的是题材和语气，不是句子难度。')+'</div>'+
      '<div class="lvm">'+
        ageBtn('child','🧑‍🎓',T('학생','Student','学生'),
               T('학교·친구 같은 일상 소재로 문제를 만들어요.','Everyday school and friend situations.','以学校、朋友等日常情境出题。'))+
        ageBtn('adult','🧑‍💼',T('성인','Adult','成人'),
               T('직장·일상 같은 성인 상황으로 문제를 만들어요.','Workplace and everyday adult situations.','以职场、日常等成人情境出题。'))+
      '</div>'+

      '<div class="lvp-sub"><span class="setup-num">2</span>'+T('문장 난이도는 어떻게 정할까요?','How should we set the sentence level?','句子难度怎么定？')+'</div>'+
      '<div class="lvm one">'+
        '<button type="button" class="lvm-btn reco" data-s="auto">'+
          '<span class="lvm-ic">🤖</span>'+
          '<span class="lvm-t">'+T('AI가 맞춰줄게요','Let AI adjust','让AI来调整')
            +'<span class="lvm-reco">'+T('추천','best','推荐')+'</span></span>'+
          '<span class="lvm-d">'+T('바로 시작해요. 푸는 걸 보고 더 쉽게·더 어렵게 자동으로 바꿔요.',
                                   'Start right away — it moves up or down as you answer.',
                                   '马上开始，根据你的作答自动变简单或变难。')+'</span>'+
        '</button>'+
        '<button type="button" class="lvm-btn" data-s="manual">'+
          '<span class="lvm-ic">🖐️</span>'+
          '<span class="lvm-t">'+T('내가 고를래요','I choose myself','我自己选')+'</span>'+
          '<span class="lvm-d">'+T('8단계 중에서 직접 고르고, 그 자리에 그대로 있어요.',
                                   'Pick one of 8 levels and stay there.',
                                   '从8个等级中自选，并保持不变。')+'</span>'+
        '</button>'+
      '</div>'+
      list+
      // 🎯 배치테스트는 «없애지 않고» 선택지 셋 중 하나로 둡니다 — 원하는 사람만 들어갑니다.
      //    안내 문구의 «2~3분» 은 위 실측(문항당 평균 11초)에 맞춘 값입니다. 줄이지 마세요.
      '<button type="button" class="pl-cta" data-s="placement">'+
        '<span class="lvm-ic">🎯</span>'+
        '<span class="lvm-t">'+T('내 레벨을 찾아 주세요','Find my level for me','帮我测一下难度')+'</span>'+
        '<span class="lvm-d">'+T('문제 6개를 풀면 딱 맞는 난이도를 찾아드려요. (약 2~3분)',
                                 'Six questions and we will find your level. (about 2–3 min)',
                                 '做6道题就能找到合适的难度。（约2~3分钟）')+'</span>'+
      '</button>'+
      '<button class="btn ghost" data-s="skip">'+T('그냥 바로 시작할래요','Just start now','直接开始')+'</button>';
    reEnter();

    // ① 나이대 — 누른 즉시 서버에 반영하고, 그 응답을 **다음 문제로 미리 받아 둡니다.**
    //    (요청을 여기서 한 번 보내 두어야 «성인 + AI가 맞춰줄게요» 갈래도 기다림 0 이 됩니다)
    Array.prototype.forEach.call(stage.querySelectorAll('.su-age'), function(el){

        // 헤더 🧑‍🎓/🧑‍💼 pill 은 지금까지 서버 응답(captureBand)으로만 갱신됐는데, 이 카드에서
        // 고르는 순간은 아직 응답 전이라 pill 이 한 박자 늦게 "학생"으로 남아 있었다 — 골랐으면
        // 바로 반영한다(실제로 저장되는 시점은 여전히 ②를 끝냈을 때다).

      el.addEventListener('click', function(){

        if(k==='manual'){
          if(setupBusy) return;
          setupList = !setupList;
          renderFirstRunSetup();

          setupStart(function(){ startPlacement(); });
          return;
        }
        // 'auto' / 'skip' — 미리 받아 둔 문제를 그대로 씁니다(기다림 0).
        //   ⚠️ mode 를 붙여 보내면 loadScenario 가 미리 받아 둔 문제를 버리고 새로 만듭니다(평균 11초).
        //      신규 학생의 기본 모드가 이미 'auto' 라 붙일 이유가 없고, 예전에 «직접» 으로 두었던
        //      학생만 실제로 바꿔야 하므로 그때만 붙입니다.
        setupStart(function(){ loadScenario(null, 0, 0, (CUR_MODE==='manual' ? 'auto' : null)); });
      });
    });

    // 목록에서 범주를 직접 고른 경우 — 그 자리에 머무는 «직접» 모드가 됩니다.
    Array.prototype.forEach.call(stage.querySelectorAll('.su-band'), function(el){
      el.addEventListener('click', function(){
        var b = Number(el.getAttribute('data-b'))||0;
        if(!b) return;
        setupStart(function(){ loadScenario(null, 0, b, 'manual'); });
      });
    });
  }

  /** 난이도 범주 목록 확보 — 부팅 때 못 받았으면(네트워크 실패 등) 미리 받아 둔 문제 응답에서 줍습니다. */
  async function ensureCatalog(){
    if(BAND_CATALOG && BAND_CATALOG.length) return true;
    if(!prefetch) prefetchNext(setupAge==='adult' ? 'adult' : null);
    try{ captureBand(await prefetch); }catch(e){}   // ⚠️ prefetch 를 비우지 않습니다 — 이어서 loadScenario 가 그대로 씁니다
    return !!(BAND_CATALOG && BAND_CATALOG.length);
  }

  /**
   * 부팅 — «난이도를 정한 적 있는 학생인가» 를 KV 1회로 물어보고 첫 화면을 정합니다.
   *   ⚠️ 이 판정을 시나리오 요청으로 하려 하면 LLM 생성(평균 11초)을 기다려야 해서
   *      첫 화면이 통째로 늦어집니다. 그래서 이미 열려 있는 GET 에 `?only=band` 를 얹었습니다.
   *   ⚠️ 그 요청이 실패해도 화면은 반드시 떠야 합니다 — 실패는 «모름» 으로 보고 로컬 표시를 따릅니다.
   */
  async function boot(){
    if(new URLSearchParams(location.search).get('placement')==='1'){
      markSetupDone(); startPlacement(); return;
    }
    if(setupDone()){ loadScenario(); return; }
    loading(T('준비하고 있어요…','Getting ready…','正在准备…'));
    var d = null;
    try{
      var r = await fetch('/api/judgment/growth?only=band&uid='+encodeURIComponent(UID)+'&token='+encodeURIComponent(authTok()), {credentials:'include'});
      d = await r.json();
    }catch(e){ d = null; }
    if(d && d.ok){
      if(Array.isArray(d.band_catalog) && d.band_catalog.length) BAND_CATALOG = d.band_catalog;
      if(d.has_band){
        // 이미 정해 둔 학생 — 기기를 바꿔 로컬 표시가 없어도 다시 묻지 않습니다.
        if(d.reading_band) CUR_BAND = Number(d.reading_band)||0;
        if(d.band_mode) CUR_MODE = (d.band_mode==='manual') ? 'manual' : 'auto';
        if(d.age_group) CUR_AGE = setupAge = (d.age_group==='adult') ? 'adult' : 'child';
        markSetupDone(); loadScenario(); return;
      }
    }
    renderFirstRunSetup();
  }

    if(!BAND_CATALOG || !BAND_CATALOG.length) return;
    view='lvpick';
    var items = BAND_CATALOG.map(function(b){
      var cur = (Number(b.band)===CUR_BAND);
      // 이름 바로 옆에 교재 Lv 을 괄호로 — "초급 (Lv 9-12)"
      return '<button type="button" class="lvp-item'+(cur?' cur':'')+'" data-b="'+b.band+'">'

        +   (cur ? '<span class="lvp-now">'+T('지금','now','当前')+'</span>' : '')+'</span>'

    //    문제 소재·말투만 바뀝니다(2026-08-24 제안서). data-g 를 쓰고 data-m 은 안 씁니다 — 아래 모드 버튼 핸들러와
    //    같은 .lvm-btn 클래스를 재사용하지만 서로 다른 속성으로 갈라야 두 핸들러가 안 겹칩니다.

      '<div class="lvm">'+

          '<span class="lvm-d">'+T('학교·친구 같은 일상 소재로 문제를 만들어요.',
                                   'Uses everyday school and friend situations.',
                                   '以学校、朋友等日常情境出题。')+'</span>'+
        '</button>'+
        '<button type="button" class="lva-btn lvm-btn'+(CUR_AGE==='adult'?' cur':'')+'" data-g="adult">'+
          '<span class="lvm-ic">🧑‍💼</span>'+
          '<span class="lvm-t">'+T('성인','Adult','成人')+(CUR_AGE==='adult'?onChip:'')+'</span>'+
          '<span class="lvm-d">'+T('직장·일상 같은 성인 상황으로 문제를 만들어요.',
                                   'Uses workplace and everyday adult situations.',
                                   '以职场、日常等成人情境出题。')+'</span>'+
        '</button>'+
      '</div>';
    var modes =
      '<div class="lvm">'+
        '<button type="button" class="lvm-btn'+(CUR_MODE==='auto'?' cur':'')+'" data-m="auto">'+
          '<span class="lvm-ic">🤖</span>'+
          '<span class="lvm-t">'+T('AI가 맞춰줄게요','Let AI adjust','让AI来调整')+(CUR_MODE==='auto'?onChip:'')+'</span>'+
          '<span class="lvm-d">'+T('푸는 걸 보고 더 쉽게·더 어렵게 자동으로 바꿔요.',
                                   'It watches your answers and moves up or down for you.',
                                   '根据你的作答自动变简单或变难。')+'</span>'+

          '<span class="lvm-d">'+T('아래에서 고른 난이도에 그대로 있어요.',

      ageToggle+
      modes+
      // 🎯 어느 쪽을 고르든, 출발점을 모르겠으면 여기서 찾습니다
      '<button type="button" class="pl-cta" id="plStart">'+
        '<span class="lvm-ic">🎯</span>'+
        '<span class="lvm-t">'+T('내 레벨 찾아줄까요?','Find my level','帮我测一下难度')+'</span>'+
        '<span class="lvm-d">'+T('문제 6개만 풀면 딱 맞는 난이도를 찾아드려요. (약 3분)',

      '</button>'+
      '<div class="lvp-sub">'+T('직접 고르기','Choose a level','自选难度')+'</div>'+
      '<div class="hint">'+T('여기서 고르면 자동으로 ‘내가 고를래요’가 돼요.',
                             'Picking one here switches to “I choose myself”.',
                             '在此选择即切换为“我自己选”。')+'</div>'+
      '<div class="lvp-list">'+items+'</div>'+
      '<button class="btn ghost" id="lvpClose">'+T('그냥 계속하기','Keep going','继续做题')+'</button>';
    reEnter();
    // data-m 이 있는 것만 — 아래 나이대 토글(.lva-btn)도 같은 .lvm-btn 스타일을 재사용하지만
    // data-g 를 쓰므로, 여기서 걸러 두 핸들러가 서로의 버튼을 잘못 집지 않게 합니다.
    Array.prototype.forEach.call(stage.querySelectorAll('.lvm-btn[data-m]'), function(el){
      el.addEventListener('click', function(){
        var m = el.getAttribute('data-m');
        if(m===CUR_MODE){ if(scenario){ renderQuestion(); reEnter(); } else { loadScenario(); } return; }
        Array.prototype.forEach.call(stage.querySelectorAll('.lvm-btn,.lva-btn,.lvp-item'), function(x){ x.disabled = true; });
        if(m==='manual'){
          // '직접'은 어느 범주에 머물지가 있어야 뜻이 생깁니다 → 지금 범주 그대로 고정합니다.
          loadScenario(null, 0, CUR_BAND || 0, 'manual');
        } else {
          loadScenario(null, 0, 0, 'auto');
        }
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.lva-btn'), function(el){
      el.addEventListener('click', function(){
        var g = el.getAttribute('data-g');
        if(g===CUR_AGE){ if(scenario){ renderQuestion(); reEnter(); } else { loadScenario(); } return; }
        Array.prototype.forEach.call(stage.querySelectorAll('.lvm-btn,.lva-btn,.lvp-item'), function(x){ x.disabled = true; });
        loadScenario(null, 0, 0, null, g);
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.lvp-item'), function(el){
      el.addEventListener('click', function(){
        var b = Number(el.getAttribute('data-b'))||0;
        if(!b) return;
        // 이미 그 범주면 서버를 부르지 않고 그냥 문제로 돌아갑니다(불필요한 생성 방지).
        if(b===CUR_BAND){ if(scenario){ renderQuestion(); reEnter(); } else { loadScenario(); } return; }
        Array.prototype.forEach.call(stage.querySelectorAll('.lvp-item'), function(x){ x.disabled = true; });
        loadScenario(null, 0, b);
      });
    });
    var ps = document.getElementById('plStart');
    if(ps) ps.addEventListener('click', function(){ startPlacement(); });
    var cl = document.getElementById('lvpClose');
    if(cl) cl.addEventListener('click', function(){
      if(scenario){ renderQuestion(); reEnter(); } else { loadScenario(); }
    });
  }

  // focusMisc 를 주면 그 오답 유형에 맞춘 문제를 새로 받습니다.
  //   미리 받아둔 문제는 '일반' 문제라 이 경우엔 쓰지 않고 버립니다.
  //   nudge(-1/+1)·setBand 도 마찬가지 — 미리 받아둔 문제는 '옮기기 전' 밴드로 만들어졌으므로 반드시 버립니다.
  //   ageGroup 도 같은 이유 — 방금 성인/학생을 바꿨는데 옛 나이대로 미리 만들어 둔 문제를 내보내면 안 됩니다.
  async function loadScenario(focusMisc, nudge, setBand, mode, ageGroup){
    view='q'; chosen = -1;
    MODE_JUST_SET = (mode === 'auto' && !setBand);
    var p = null, ready = false;
    if(focusMisc || nudge || setBand || mode || ageGroup){
      prefetch = null; prefetchDone = false;
      p = requestScenario(focusMisc, nudge, setBand, mode, 0, null, ageGroup);
    } else {
      p = prefetch; ready = prefetchDone;
      prefetch = null; prefetchDone = false;
      if(!p){ p = requestScenario(); ready = false; }
    }
    if(!ready) loading(
      (mode==='auto' && !setBand) ? T('이제 AI가 맞춰줄게요…','AI will adjust from now on…','接下来交给AI调整…')
      : setBand ? T('고른 난이도로 문제를 만들고 있어요…','Making a question at that level…','正在按所选难度出题…')
      : nudge ? (nudge<0
          ? T('조금 더 쉬운 문장으로 바꾸고 있어요…','Making the sentences easier…','正在换成更简单的句子…')
          : T('조금 더 도전적인 문장으로 바꾸고 있어요…','Making the sentences harder…','正在换成更有挑战的句子…'))
      : ageGroup ? (ageGroup==='adult'
          ? T('성인용 문제로 바꾸고 있어요…','Switching to adult questions…','正在切换为成人题…')
          : T('학생용 문제로 바꾸고 있어요…','Switching to student questions…','正在切换为学生题…'))
      : focusMisc
        ? T('이 유형에 맞춘 문제를 만들고 있어요…','Making a question on this type…','正在出这类题…')
        : T('맞춤 문제를 만들고 있어요…','Creating your question…','正在为你出题…'));
    try{
      var d = await p;
      // 레벨 목록·현재 범주는 문제 생성이 실패해도 챙깁니다 — 실패했을 때야말로
      //   "레벨 고르기"로 빠져나갈 수 있어야 하니까요.
      captureBand(d);
      if(!validScenario(d)) throw new Error('no scenario');
      scenario = d;
      _autoSay = true;
      renderQuestion(); reEnter();
      prefetchNext();                      // 학생이 이 문제를 푸는 동안 다음 문제를 준비
    }catch(e){
      stage.innerHTML = '<div class="center">'+T('문제를 불러오지 못했어요.','Could not load a question.','题目加载失败。')+'<br><button class="btn ghost" style="max-width:260px;margin:18px auto 0" onclick="location.reload()">'+T('다시 시도','Try again','再试一次')+'</button></div>';
    }
  }

  function renderQuestion(){
    view='q';
    var letters = ['A','B','C','D'];
    var opts = scenario.options.map(function(o,i){
      return '<button class="opt" data-i="'+i+'"'+(i===chosen?' data-sel="1"':'')+'><span class="k">'+letters[i]+'</span><span>'+esc(o)+'</span>'+spk(o)+'</button>';
    }).join('');
    var tbChip = scenario.textbook ? '<span class="tb-chip">📖 '+esc(scenario.textbook)+' '+T('연계','linked','关联')+'</span>' : '';
    // 🏷️ 지금 문장 난이도 — 숫자가 아니라 이름으로, 교재 Lv 을 옆에 붙여서.
    //    학생은 '초급'으로 알아보고, 옆에서 보는 강사·학부모는 'Lv 9–12'로 교재와 맞춥니다.
    var lvName = bandNameOf(scenario.reading_band);
    var lvChip = lvName
      ? '<span class="tb-chip" title="'+T('아래 ‘난이도 설정’에서 바꿀 수 있어요','Change it in Level settings below','可在下方“难度设置”中更改')+'">'
        + (CUR_MODE==='manual' ? '🖐️ ' : '🤖 ') + esc(lvName)
        + (scenario.reading_band_label ? ' ('+esc(scenario.reading_band_label)+')' : '')+'</span>'
      : '';
    // 난이도 — 어려운 문제를 맞히면 판단력 지수에 더 크게 반영되므로 미리 알려줍니다
    var dv = Math.max(1, Math.min(5, Math.round(Number(scenario.difficulty)||3)));
    var dChip = '<span class="tb-chip" title="'+T('어려운 문제일수록 지수에 더 크게 반영돼요','Harder questions count more toward your index','越难的题对指数影响越大')+'">'
      + T('난이도','Level','难度')+' '+'★'.repeat(dv)+'<span style="opacity:.4">'+'☆'.repeat(5-dv)+'</span></span>';
    // 🎚️ 읽기 난이도가 방금 조정됐으면 한 줄만 알려 줍니다 — 레벨 숫자는 보여주지 않습니다.
    var mv = Number(scenario.band_moved)||0;
    var lvlNote = '';
    if(scenario.band_picked) lvlNote = '<div class="lvlnote">🖐️ '
      + T('‘'+lvName+'’ 난이도로 맞춰 뒀어요. 여기 그대로 있을게요.',
          'Set to “'+lvName+'”. It will stay here.',
          '已设为“'+lvName+'”，将保持不变。')+'</div>';
    else if(scenario.band_mode==='auto' && CUR_MODE==='auto' && scenario.band_moved===0 && !scenario.band_at_edge && MODE_JUST_SET)
      lvlNote = '<div class="lvlnote">🤖 '+T('이제 AI가 난이도를 맞춰줄게요.','AI will adjust the level from now on.','接下来由AI调整难度。')+'</div>';
    else if(mv<0) lvlNote = '<div class="lvlnote">✅ '+T('조금 쉬운 문장으로 바꿨어요.','Switched to easier sentences.','已换成更简单的句子。')+'</div>';
    else if(mv>0) lvlNote = '<div class="lvlnote">✅ '+T('조금 더 긴 문장에 도전해요!','Let\'s try longer sentences!','来挑战更长的句子吧！')+'</div>';
    else if(scenario.band_at_edge) lvlNote = '<div class="lvlnote">'+T('지금이 가장 알맞은 문장 길이예요.','This is already the best fit for you.','现在的句子长度已经最合适了。')+'</div>';
    stage.innerHTML =
      lvlNote+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+tbChip+lvChip+dChip+'</div>'+
      '<div class="sit-label">🗣️ '+T('이런 상황이에요','Here is the situation','情境是这样的')+spk(scenario.situation, 'sit-spk')+'</div>'+
      '<div class="sit">'+esc(scenario.situation)+'</div>'+
      '<div class="opts">'+opts+'</div>'+
      '<div class="why-label">🤔 '+T('왜 그 표현을 골랐어요?','Why did you choose it?','你为什么选这个表达？')+'</div>'+
      '<textarea id="why" placeholder="'+T('예: 선생님께 말하는 거라서 공손하게…  (한국어로 써도 괜찮아요)','e.g. Because I am talking to my teacher, so I chose a polite one…','例如：因为是对老师说的话，所以选了礼貌的表达…（用中文写也可以）')+'"></textarea>'+
      '<div class="hint">✨ '+T('이유를 잘 설명할수록 판단력 점수가 올라가요.','The better you explain, the higher your score.','理由说明得越好，判断力分数就越高。')+'</div>'+
      '<button class="btn" id="submit"'+(chosen<0?' disabled':'')+'>'+T('제출하기 🚀','Submit 🚀','提交 🚀')+'</button>'+
      // 읽기가 버거워서 틀리는 것은 판단력이 아니라 읽기를 재는 것입니다. 아이가 직접 빠져나올 길을 둡니다.
      '<div class="lvladj">'+
        '<button type="button" data-n="-1">'+T('문장이 너무 어려워요','Sentences are too hard','句子太难了')+'</button>'+
        '<button type="button" data-n="1">'+T('너무 쉬워요','Too easy','太简单了')+'</button>'+
        // 한 칸씩 옮기는 것 말고, 범주를 직접 고르고 싶은 학생·학부모를 위한 길
        (BAND_CATALOG && BAND_CATALOG.length
          ? '<button type="button" data-pick="1">🎚️ '+T('난이도 설정','Level settings','难度设置')+'</button>' : '')+
        // 🎯 레벨 찾기 상시 입구(2026-08-24 학원장 검수) — [난이도 설정] 2단계 안쪽에만 있어
        //    «처음엔 있었는데 다시 못 찾겠다» 는 제보. 문제 화면에 항상 보이게 꺼내 둔다.
        '<button type="button" data-pl="1">🎯 '+T('레벨 다시 재기','Retake my level','重新测难度')+'</button>'+
      '</div>';
    Array.prototype.forEach.call(stage.querySelectorAll('.lvladj button'), function(el){
      el.addEventListener('click', function(){
        if(el.getAttribute('data-pl')){ startPlacement(); return; }
        if(el.getAttribute('data-pick')){ showBandPicker(); return; }
        // 연타로 여러 밴드가 한꺼번에 밀리지 않도록 즉시 잠급니다(요청은 ±1 로만 해석되지만 화면도 막아 둡니다).
        Array.prototype.forEach.call(stage.querySelectorAll('.lvladj button'), function(b){ b.disabled = true; });
        loadScenario(null, Number(el.getAttribute('data-n')));
      });
    });
    Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(el){
      if(el.getAttribute('data-sel')) el.classList.add('sel');
      el.addEventListener('click', function(){
        chosen = Number(el.getAttribute('data-i'));
        Array.prototype.forEach.call(stage.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
        el.classList.add('sel');
        document.getElementById('submit').disabled = false;
        // 🔊 고른 표현을 바로 들려준다 — 고르는 순간이 곧 듣기 연습이 되게.
        say(scenario.options[chosen], el.querySelector('.spk'));
      });
    });
    document.getElementById('submit').addEventListener('click', submitAnswer);
    // 다음 문제로 넘어갈 때 소리가 바로 나도록 미리 받아 둔다(두 번째부터는 R2 캐시라 즉시).
    prefetchList([scenario.situation].concat(scenario.options || []));
    // 새 문제가 «막 도착했을 때» 만 상황문을 자동으로 읽는다.
    //   ⚠️ 🌐 언어 토글도 이 함수를 다시 부르므로 조건 없이 읽으면 누를 때마다 다시 낭독된다.
    if(_autoSay){ _autoSay = false; say(scenario.situation, stage.querySelector('.sit-spk')); }
  }

  async function submitAnswer(){
    if(chosen<0) return;
    var reasoning = (document.getElementById('why')||{}).value || '';
    loading(T('망고 선생님이 채점하고 있어요…','Teacher Mango is grading…','芒果老师正在批改…'));
    try{
      var r = await fetch('/api/judgment/answer', {method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
        body:JSON.stringify({ uid:UID, token:authTok(), student_name:NAME, situation:scenario.situation, skill_tag:scenario.skill_tag,
          options:scenario.options, chosen_index:chosen, correct_index:scenario.correct_index, reasoning:reasoning, lang:LANG,
          option_scores:scenario.option_scores, difficulty:scenario.difficulty, sid:scenario.sid })});
      var d = await r.json();
      if(!d || d.ok===false) throw new Error('score fail');
      solved++;
      window._lastResult = d;
      _autoSay = true;
      renderResult(d); reEnter();
      if(d.correct){ confetti(); xpPop('+'+(d.choice_score!=null?d.choice_score:'💯')); }
    }catch(e){
      stage.innerHTML = '<div class="center">'+T('채점에 실패했어요.','Grading failed.','批改失败了。')+'<br><button class="btn ghost" style="max-width:260px;margin:18px auto 0" onclick="location.reload()">'+T('다시 시도','Try again','再试一次')+'</button></div>';
    }
  }

  // 오답도 등급이 갈립니다 — "아깝게 틀림"과 "완전히 다른 표현"에 같은 말을 하지 않기 위해
  function bannerText(ok, cs){
    if(ok) return '🎉 '+T('잘 골랐어요!','Great choice!','选得好！');
    var s = Number(cs);
    if(isFinite(s) && s>=60) return '😮 '+T('아주 아까워요! 뜻은 통해요','So close — it does get the meaning across','太可惜了！意思是通的');
    if(isFinite(s) && s<35)  return '🧐 '+T('이 표현은 상황과 많이 달라요','That one is quite far from the situation','这个表达和情境差得比较远');
    return '🤔 '+T('거의 다 왔어요!','So close!','就差一点！');
  }
  // 📊 선택지 채점표 — 네 개를 점수와 함께 나란히 놓고 비교하게 합니다.
  //    "정답은 B였어요" 한 줄보다, 내가 고른 것이 몇 점이고 왜 낮은지 보이는 편이 훨씬 남습니다.
  function optionTable(d){
    if(!d.options || !d.option_scores || d.option_scores.length!==d.options.length) return '';
    var letters=['A','B','C','D'];
    var rows = d.options.map(function(o,i){
      var s = Number(d.option_scores[i]);
      var isBest = (i===d.correct_index), isMine = (i===d.chosen_index);
      var tone = s>=90 ? 'g' : s>=55 ? 'y' : 'r';
      var tags = (isBest? '<span class="ot-b">'+T('가장 자연스러움','Most natural','最自然')+'</span>':'')
               + (isMine? '<span class="ot-m">'+T('내 선택','Your pick','我的选择')+'</span>':'');
      return '<div class="ot-row'+(isMine?' mine':'')+'">'
        + '<span class="ot-k">'+letters[i]+'</span>'
        + '<span class="ot-t">'+esc(o)+spk(o,'sm')+tags+'</span>'
        + '<span class="ot-s '+tone+'">'+s+'</span>'
        + '<span class="ot-bar"><i class="'+tone+'" style="width:'+Math.max(3,s)+'%"></i></span>'
        + '</div>';
    }).join('');
    return '<div class="ot"><div class="ot-h">'+T('표현마다 몇 점일까요?','How each option scores','每个表达得几分？')+'</div>'+rows+'</div>';
  }
  function renderResult(d){
    view='result';
    var ok = !!d.correct;
    var fb = LANG==='en' ? (d.feedback_en||d.feedback_ko||'')
           : LANG==='zh' ? (d.feedback_zh||d.feedback_en||d.feedback_ko||'')
           : (d.feedback_ko||d.feedback_en||'');
    var scores =
      '<div class="scores">'+
        '<div class="sc"><div class="v" data-cnt="'+(d.choice_score!=null?d.choice_score:'')+'">—</div><div class="l">'+T('선택 적절성','Choice','选择恰当度')+'</div></div>'+
        '<div class="sc"><div class="v" data-cnt="'+(d.reasoning_score!=null?d.reasoning_score:'')+'">—</div><div class="l">'+T('이유 논리','Reasoning','理由逻辑')+'</div></div>'+
      '</div>';
    var best = (!ok && d.best_option) ? '<div class="best">💡 '+T('가장 자연스러운 표현','Most natural expression','最自然的表达')+': <b>'+esc(d.best_option)+'</b>'+spk(d.best_option,'sm')+'</div>' : '';
    // 🗣️ 내가 고른 그 표현이 왜 그렇게 들리는지 (Duolingo Max 의 Explain My Answer 에 해당)
    var wc = LANG==='en' ? (d.why_chosen_en||d.why_chosen_ko||'')
           : LANG==='zh' ? (d.why_chosen_zh||d.why_chosen_en||d.why_chosen_ko||'')
           : (d.why_chosen_ko||d.why_chosen_en||'');
    var myPick = (wc && d.options && d.chosen_index!=null)
      ? '<div class="mypick"><div class="mp-h">'+T('내가 고른 표현','Your answer','你选的表达')+'</div>'
        + '<div class="mp-q">“'+esc(d.options[d.chosen_index])+'”'+spk(d.options[d.chosen_index],'sm')+'</div>'
        + '<div class="mp-w">'+esc(wc)+'</div></div>'
      : '';
    // 🎚️ 자동 조절이 방금 밴드를 움직였으면 한 줄만. 레벨 숫자·승급 연출은 넣지 않습니다.
    var bm = Number(d.band_moved)||0;
    var mvNote = bm>0
      ? '<div class="lvlnote">🌱 '+T('다음 문제는 조금 더 긴 문장으로 가볼게요.','Next questions will use longer sentences.','下一题会用更长的句子。')+'</div>'
      : bm<0
      ? '<div class="lvlnote">🌿 '+T('다음 문제는 조금 쉬운 문장으로 갈게요.','Next questions will use easier sentences.','下一题会用更简单的句子。')+'</div>'
      : '';
    stage.innerHTML =
      '<div class="res">'+
        '<div class="banner '+(ok?'ok':'no')+'">'+bannerText(ok, d.choice_score)+'</div>'+
        mvNote+
        myPick+
        best+
        '<div class="fb">'+esc(fb)+'</div>'+
        optionTable(d)+
        scores+
        '<button class="btn" id="next">'+T('다음 문제 →','Next question →','下一题 →')+'</button>'+
        // 방금 틀린 유형을 바로 한 번 더 — 틀린 채로 넘어가지 않게 하는 것이 핵심입니다.
        (d.misconception
          ? '<button class="btn ghost" id="again" data-misc="'+esc(d.misconception)+'" style="margin-top:10px">🔁 '
            + T('이 유형 한 번 더','Try this type again','再练一次这类')+' — '+esc(miscLabel(d.misconception))+'</button>'
          : '')+
        '<button class="btn ghost" id="mygrowth" style="margin-top:10px">🌱 '+T('내 성장 보기','See my growth','查看我的成长')+'</button>'+
      '</div>';
    Array.prototype.forEach.call(stage.querySelectorAll('.sc .v'), function(el){
      var v=el.getAttribute('data-cnt');
      if(v==='') el.textContent='—'; else countUp(el, Number(v), 900);
    });
    document.getElementById('next').addEventListener('click', function(){ loadScenario(); });
    var ag=document.getElementById('again');
    if(ag) ag.addEventListener('click', function(){ loadScenario(ag.getAttribute('data-misc')); });
    var mg=document.getElementById('mygrowth'); if(mg) mg.addEventListener('click', showGrowth);
    streakEl.innerHTML = streakText();
    // 🔊 «가장 자연스러운 표현» 을 한 번 들려준다 — 틀린 채로 넘어가지 않게 하는 것과 같은 뜻.
    //    ⚠️ 언어 토글도 이 함수를 다시 부르므로 채점이 «막 끝났을 때» 만 읽는다.
    if(_autoSay){
      _autoSay = false;
      var model = d.best_option || (d.options && d.correct_index!=null ? d.options[d.correct_index] : '');
      if(model){
        var mb = null;
        Array.prototype.forEach.call(stage.querySelectorAll('.spk'), function(b){
          if(!mb && b.getAttribute('data-say')===String(model)) mb = b;
        });
        say(model, mb);
      }
    }
  }

  // 숫자만 보여주면 "그래서 뭘 해야 하지?"가 남습니다. 축마다 해석 한 마디를 붙입니다.
  function band(v){
    if(v==null) return ['', ''];
    if(v>=90) return [T('아주 좋아요','Excellent','非常好'), 'g'];
    if(v>=75) return [T('잘하고 있어요','Good','做得不错'), 'g'];
    if(v>=60) return [T('무난해요','Okay','还可以'), 'y'];
    if(v>=40) return [T('조금 더 연습','Needs practice','再练一练'), 'y'];
    return [T('집중 연습이 필요해요','Focus here','需要重点练习'), 'r'];
  }
  function bar(label, v){
    var val = (v==null? 0 : v);
    var b = band(v);
    return '<div class="bar-row">'
      + '<div class="bar-head"><span>'+label+'</span>'
      +   (b[0]? '<span class="bnd '+b[1]+'">'+b[0]+'</span>' : '')
      +   '<span class="bv">'+(v==null?'—':v)+'</span></div>'
      + '<div class="bar-track"><div class="bar-fill" data-w="'+val+'"></div></div>'
      + '</div>';
  }
  async function showGrowth(){
    view='growth';
    loading(T('내 성장을 불러오고 있어요…','Loading your growth…','正在加载你的成长记录…'));
    try{
      var r = await fetch('/api/judgment/growth?uid='+encodeURIComponent(UID)+'&token='+encodeURIComponent(authTok()), {credentials:'include'});
      var d = await r.json();
      if(!d || d.ok===false) throw new Error('no growth');
      window._lastGrowth = d;
      renderGrowth(d); reEnter();
    }catch(e){
      stage.innerHTML = '<div class="center">'+T('성장 기록을 불러오지 못했어요.','Could not load your growth.','成长记录加载失败。')+'<br><button class="btn ghost" style="max-width:260px;margin:18px auto 0" id="g-back">← '+T('문제 풀기','Practice','去做题')+'</button></div>';
      var b=document.getElementById('g-back'); if(b) b.addEventListener('click', function(){ loadScenario(); });
    }
  }
  // 📈 지난달 대비 — 한 시점 점수만으론 성장을 못 봅니다. 추세가 있으면 한 줄로 보여줍니다.
  function monthTrend(d){
    var t = Array.isArray(d.trend) ? d.trend.filter(function(x){ return x && x.judgment_index!=null; }) : [];
    if(t.length < 2) return '';
    var cur = t[t.length-1], prev = t[t.length-2];
    var diff = Math.round(cur.judgment_index - prev.judgment_index);
    if(diff === 0) return '<div class="trendline">'+T('지난달과 같은 수준을 지키고 있어요.','Holding steady since last month.','和上个月保持同一水平。')+'</div>';
    var up = diff > 0, n = Math.abs(diff);
    var mark = '<b class="'+(up?'up':'dn')+'">'+(up?'▲':'▼')+' '+n+'</b>';
    return '<div class="trendline">'+T(
      '지난달보다 '+mark+'점 '+(up?'올랐어요':'내려갔어요'),
      mark+' points '+(up?'up':'down')+' from last month',
      '比上个月'+(up?'上升':'下降')+' '+mark+' 分')+'</div>';
  }
  function renderGrowth(d){
    view='growth';
    var rad = d.radar || {};
    var has = (d.events_count||0) > 0;
    var idx = (d.judgment_index!=null? d.judgment_index : null);
    var miscs = Array.isArray(d.top_misconceptions)? d.top_misconceptions.slice(0,3) : [];
    var R=86, C=2*Math.PI*R;
    // 🆕 이번 판단 결과 + 지수 변화 — "100점을 받아도 지수가 그대로"로 보이던 문제 해소
    var lastBox = '';
    if(d.last && d.last.choice_score!=null){
      var ls = d.last.choice_score;
      var dl = (d.delta_index==null? null : Math.round(d.delta_index));
      var dTxt = (dl==null||dl===0)
        ? '<span style="color:var(--mut)">'+T('지수 변화 없음','no change','指数无变化')+'</span>'
        : (dl>0 ? '<span style="color:#34d399">▲ '+dl+'</span>' : '<span style="color:#f87171">▼ '+Math.abs(dl)+'</span>');
      lastBox = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;'
        + 'margin:0 0 6px;padding:10px 14px;border-radius:14px;'
        + 'background:rgba(124,58,237,.14);border:1px solid rgba(168,85,247,.35);font-weight:800">'
        + '<span>'+T('이번 판단','This attempt','本次判断')+'</span>'
        + '<span style="color:'+(d.last.is_optimal?'#fbbf24':'#f0abfc')+';font-size:1.15em">'+ls+T('점','','分')+'</span>'
        + '<span style="color:var(--mut);font-weight:700">'+T('지수','index','指数')+'</span>'+dTxt
        + '</div>'
        // 🆕 "이번 판단 점수"와 "판단력 지수"가 다른 이유를 매번 헷갈려해서(신고 반복) 바로 밑에 짧게 설명.
        //    지수는 오늘 답 하나가 아니라 최근 여러 판단(선택·이유·교정력·어투·일관성)의 평균이라는 점을 명시.
        + '<div style="font-size:12px;color:var(--mut);margin:0 0 14px;line-height:1.5">'
        +   T('💡 지수는 이번 점수 하나가 아니라, 최근 여러 판단(선택·이유·교정력·어투·일관성)을 종합한 평균이에요.',
              '💡 The index isn\'t just this score — it\'s an average of several recent decisions (choice, reasoning, self-correction, register, consistency).',
              '💡 指数不是这一次的分数，而是最近多次判断（选择、理由、纠正力、语气、一致性）的综合平均值。')
        + '</div>';
    }
    var practice = has
      ? '<div class="ring-box">'
        + '<div class="ring">'
        +   '<svg viewBox="0 0 200 200"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">'
        +   '<stop offset="0%" stop-color="#7c3aed"/><stop offset="60%" stop-color="#a855f7"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient></defs>'
        +   '<circle class="track" cx="100" cy="100" r="'+R+'"/>'
        +   '<circle class="prog" id="ringProg" cx="100" cy="100" r="'+R+'" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/></svg>'
        +   '<div class="mid"><div class="num" id="ringNum">0</div><div class="cap">'+T('나의 판단력 지수','My judgment index','我的判断力指数')+'</div></div>'
        + '</div>'
        + '<div class="ring-side">'
        +   '<div style="font-size:clamp(14px,1.8vw,18px);color:var(--mut);font-weight:700;margin-bottom:12px">🏅 '
        +     T('지금까지 <b style="color:#fbbf24">'+(d.events_count||0)+'</b>번 판단했어요','<b style="color:#fbbf24">'+(d.events_count||0)+'</b> decisions so far','到目前为止做了 <b style="color:#fbbf24">'+(d.events_count||0)+'</b> 次判断')+'</div>'
        +   lastBox
        +   monthTrend(d)
        +   bar(T('선택 적절성','Choice','选择恰当度'), rad['선택적절성'])
        +   bar(T('이유 논리','Reasoning','理由逻辑'), rad['이유논리'])
        +   bar(T('자기 교정력','Self-correction','自我纠正力'), rad['자기교정력'])
        +   bar(T('어투 민감도','Register','语气敏感度'), rad['어투민감도'])
        +   bar(T('일관성','Consistency','一致性'), rad['일관성'])
        + '</div>'
        + '</div>'
        + (miscs.length ? '<div class="misc-box">'
            + '<div class="mt">💪 '+T('이런 걸 더 연습하면 좋아요','Practice these a bit more','这些再多练练会更好')+'</div>'
            // 보여주기만 하고 끝나면 학생이 할 게 없습니다. 누르면 그 유형으로 바로 문제를 받게 합니다.
            + miscs.map(function(m){
                return '<button class="mi-go" data-misc="'+esc(m.code)+'">'
                  + '<span>'+esc(miscLabel(m.code))+'</span>'
                  + '<span class="go">'+T('이 유형 연습 →','Practice this →','练这类 →')+'</span></button>';
              }).join('')
            + '</div>' : '')
      : '<div class="center">'+T('아직 판단 기록이 없어요.<br>문제를 풀면 나의 성장이 여기 나타나요! 🌱','No records yet.<br>Solve questions and your growth appears here! 🌱','还没有判断记录。<br>做题之后你的成长会显示在这里！🌱')+'</div>';
    stage.innerHTML = '<div class="res">'
      + '<div class="sit-label">🌱 '+T('나의 판단력 성장','My decision-making growth','我的判断力成长')+'</div>'
      + practice
      + '<button class="btn gold" id="g-train" style="margin-top:22px">'+T('문제 풀러 가기 →','Go practice →','去做题 →')+'</button>'
      + '</div>';
    // 애니메이션: 링 채우기 + 지수 카운트업 + 막대 채우기
    // ⚠️ 예전에는 이 블록 전체가 requestAnimationFrame 안에 있었습니다. rAF 는 백그라운드 탭·
    //    저전력 모드에서 아예 실행되지 않아, 그런 상태로 열면 지수가 '0', 막대가 전부 빈 채로 굳었습니다.
    //    성장 화면은 숫자를 보러 오는 화면이므로 타이머로 바꿔 반드시 그려지게 합니다.
    setTimeout(function(){
      var rp=document.getElementById('ringProg');
      if(rp && idx!=null){ rp.style.strokeDashoffset = String(C*(1-Math.max(0,Math.min(100,idx))/100)); }
      var rn=document.getElementById('ringNum');
      if(rn){ if(idx==null){ rn.textContent='—'; } else countUp(rn, idx, 1100); }
      Array.prototype.forEach.call(stage.querySelectorAll('.bar-fill'), function(el){
        el.style.width = el.getAttribute('data-w')+'%';
      });
    }, 30);
    var t=document.getElementById('g-train'); if(t) t.addEventListener('click', function(){ loadScenario(); });
    Array.prototype.forEach.call(stage.querySelectorAll('.mi-go'), function(el){
      el.addEventListener('click', function(){ loadScenario(el.getAttribute('data-misc')); });
    });
  }
  var gb = document.getElementById('growthBtn'); if(gb) gb.addEventListener('click', showGrowth);

  // 🧑‍🎓/🧑‍💼 상단 pill — 누르면 바로 반대 나이대로 전환(🌐 언어 토글과 같은 동작 방식).
  //   난이도(문장 길이)와 달리 이건 정체성 설정이라 [난이도 설정] 안에 묻지 않고 상시 노출한다
  //   (2026-08-26 사장님 지적). 레벨 찾기(plOn) 도중에는 적응형 문항 흐름이 깨지므로 무시한다.
  var ab = document.getElementById('ageBtn');
  if(ab) ab.addEventListener('click', function(){
    if(plOn || ageSwitching) return;
    switchAgeGroup((CUR_AGE==='adult') ? 'child' : 'adult');
  });

  applyStatic();
  // 🎯 전체메뉴 「레벨 테스트」 타일이 ?placement=1 로 들어온다 — 문제 대신 레벨 찾기부터 시작.
  //    (기능은 전부터 있었지만 입구가 [난이도 설정] 2단계 안쪽뿐이라
  //     «처음엔 있었는데 다시 못 찾겠다» 는 검수 피드백이 있었다. 2026-08-24)
  //  🎬 그 밖의 진입은 boot() 가 «처음 오는 학생인가» 를 보고 첫 설정 카드 / 문제를 가른다(2026-08-26).
  boot();
})();
