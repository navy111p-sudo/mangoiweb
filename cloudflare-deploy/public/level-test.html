<!-- ══════════════════════════════════════════════════════════════════════
     🎯 레벨테스트 신청서 «한 벌»로 통일 (2026-08-07)

     이 페이지에는 원래 신청 폼이 통째로 있었다(2026-06-14). 2주 뒤 홈 모달에
     «회원가입 + 신청» 개선판이 생겼는데 이 페이지를 지우지 않아, 같은 안내 음성을
     쓰면서 **받는 항목이 다른 신청서 두 벌**이 동시에 돌아갔다.

       · 옛 페이지(여기)  : 이름·연락처·날짜·시간 4개.  회원가입 없음, 동의 체크 없음
       · 홈 모달          : 아이디·비번(회원가입) + 이메일·연령 + 개인정보 동의

     그래서 어느 문으로 들어왔느냐에 따라 **계정이 생기기도 하고 안 생기기도 했다.**
     계정이 없으면 student_uid 가 빈 채로 접수되고, 조회는 uid 로만 하므로
     (이름으로 찾으면 동명이인 신청이 새어나간다) 마이페이지 「내 레벨테스트」에
     영영 안 떴다.

     → 신청서는 홈 모달 한 벌만 남긴다. 이 주소는 문자·카톡·즐겨찾기에 이미
       나가 있으므로 **지우지 않고** 모달로 넘겨준다(404 를 만들면 그 사람들은 길이 끊긴다).
       받는 쪽: public/js/idx-grid-menu.js 끝의 `?menu=leveltest` 처리.
     ⚠️ 원래 폼이 필요하면 git 이력에 그대로 있다 (이 파일의 8fc832e19 이전 판).
     ══════════════════════════════════════════════════════════════════════ -->

<script>
  /* 쿼리스트링은 그대로 넘긴다 — 유입경로(utm_*) 나 프리필 값이 붙어 오는 경우가 있다.
     replace() 라서 뒤로가기를 눌러도 이 중간 페이지로 되돌아오지 않는다. */
  (function(){
    try {
      var q = new URLSearchParams(location.search);
      q.set('menu', 'leveltest');
      location.replace('/?' + q.toString());
    } catch (e) {
      location.replace('/?menu=leveltest');
    }
  })();
</script>
