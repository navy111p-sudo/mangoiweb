<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>망고아이 월간 학습 레포트</title>
<link rel="stylesheet" href="/css/mangoi-fonts.css?v=2"><!-- ph161: 구글폰트 → 자체호스팅(라틴 장식용). 한글은 시스템 폰트 폴백 -->
<link rel="preload" as="image" href="/img/home-bg-dark.webp?v=20260730">
<style>
  /* 🎨 마이페이지(parent.html)·월별 리포트(report.html)·평가서(eval.html)와 같은 "리포트 패밀리" 톤으로 통일 — 2026-07-31 */
  :root{--mango:#fbbf24;--mango-d:#f59e0b;--kakao:#FEE500;--navy:#fff;--slate:#e6ecff;--muted:#94a3b8;
    --line:rgba(139,92,246,0.15);--bg:#0a0e1a;--card:rgba(20,26,43,0.7);--good:#34d399;--up:#22c55e;--blue:#a78bfa;--pink:#ec4899;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{position:relative;font-family:MangoiHanSC,'Noto Sans KR','Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--navy);line-height:1.55;-webkit-font-smoothing:antialiased;padding:18px 12px 60px}
  body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:url('/img/home-bg-dark.webp?v=20260730') center/cover no-repeat;filter:blur(2px) brightness(0.55) saturate(1.15);transform:scale(1.06)}
  body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center top, rgba(251,191,36,0.08), transparent 60%),radial-gradient(ellipse at center, rgba(11,15,30,0.55), rgba(8,11,24,0.95))}
  .wrap{max-width:640px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto 14px;color:#fff}
  .topbar .logo{font-weight:900;font-size:15px}
  .topbar .sp{flex:1}
  .lang-btn{background:rgba(20,26,43,0.7);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;color:var(--slate);backdrop-filter:blur(8px)}
  /* form */
  .formcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;box-shadow:0 10px 30px -16px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
  .formcard h2{font-size:17px;font-weight:900;margin-bottom:4px;color:#fff}
  .formcard p{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
  .fld input{width:100%;padding:11px 13px;border:1px solid rgba(139,92,246,0.35);border-radius:10px;font-size:14px;font-family:inherit;background:#0e1e40;color:#fff}
  .gobtn{width:100%;margin-top:6px;padding:13px;border:0;border-radius:11px;font-weight:900;font-size:14px;cursor:pointer;
    background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;box-shadow:0 8px 18px -8px rgba(245,158,11,.5)}
  /* dashboard */
  .dash{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 18px 44px -22px rgba(0,0,0,.6);border:1px solid var(--line);backdrop-filter:blur(8px)}
  .hero{background:linear-gradient(135deg,rgba(251,191,36,0.22),rgba(245,158,11,0.10));border-bottom:1px solid rgba(251,191,36,0.30);padding:22px 22px 48px;position:relative;color:#fff}
  .hero .mango{position:absolute;right:18px;top:14px;font-size:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
  .hero .badge{display:inline-block;background:rgba(0,0,0,.28);font-size:11px;font-weight:800;padding:3px 11px;border-radius:99px;margin-bottom:8px;color:#fde68a}
  .hero h2{font-size:21px;font-weight:900}
  .hero .who{font-size:13px;font-weight:700;opacity:.85;margin-top:2px}
  .body{padding:0 16px 22px;margin-top:-30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 15px;margin-bottom:13px;box-shadow:0 4px 14px -8px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
  .card h3{font-size:13px;font-weight:900;display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#c4b5fd}
  .ai-greet{font-size:13.5px;color:#e2e8f0;line-height:1.75;white-space:pre-wrap}
  .ai-tag{margin-left:auto;font-size:10px;font-weight:800;color:#92600e;background:#fde68a;padding:2px 8px;border-radius:99px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;backdrop-filter:blur(8px)}
  .kpi .v{font-size:19px;font-weight:900;color:#fff}
  .kpi .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
  .mg{color:var(--mango-d)}.blue{color:var(--blue)}.up{color:var(--up)}.pink{color:var(--pink)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .pron-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .pron-row .lab{font-size:12px;font-weight:700;width:64px;flex-shrink:0;color:var(--muted)}
  .bar{flex:1;height:12px;background:rgba(0,0,0,0.3);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#10b981)}
  .pron-row .pct{font-size:12px;font-weight:900;width:54px;text-align:right;color:#fff}
  .comment{background:rgba(251,191,36,0.08);border:1px dashed rgba(251,191,36,0.35);border-radius:14px;padding:12px 14px;font-size:13px;color:#fde68a;line-height:1.65}
  .comment .by{font-size:11px;font-weight:800;color:#fbbf24;margin-top:8px}
  .goal{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:#e2e8f0;margin-bottom:7px}
  .goal .n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--mango);color:#1a1a1a;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
  .cta{display:flex;gap:10px;margin-top:4px}
  .cta a{flex:1;text-align:center;padding:13px;border-radius:13px;font-weight:900;font-size:13.5px;text-decoration:none}
  .cta .primary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;box-shadow:0 8px 18px -8px rgba(245,158,11,.5)}
  .cta .ghost{background:rgba(20,26,43,0.7);border:1.5px solid var(--mango-d);color:var(--mango-d)}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty .ico{font-size:46px;opacity:.5;margin-bottom:10px}
  .muted-note{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
  .spin{text-align:center;padding:60px 0;color:var(--muted);font-weight:700}
  /* 🌟 2026-07-25 — 오각형 요약 카드 + 인쇄 버튼 (기획안 Phase 2, 기존 카드는 그대로 둔 "증축") */
  .print-btn{background:rgba(20,26,43,0.7);border:1px solid rgba(251,191,36,0.35);border-radius:99px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer;color:var(--mango-d);margin-right:6px;backdrop-filter:blur(8px)}
  .radar-card{border:1.5px solid rgba(251,191,36,0.30);background:linear-gradient(180deg,rgba(251,191,36,0.06),var(--card))}
  .growth-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#92600e;background:#fde68a;padding:5px 11px;border-radius:99px;margin-bottom:10px}
  .radar-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .radar-row svg{width:170px;height:170px;flex:none;overflow:visible}
  .radar-list{list-style:none;flex:1;min-width:160px}
  .radar-list li{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:6px}
  .radar-list .rlab{color:#e2e8f0;font-weight:700}
  .radar-list .rval{font-weight:900;color:var(--blue)}
  /* 🤖 2026-08-07 — AI 학습기록으로 채운 축 표시. 인쇄에서도 남아야 해서 색이 아니라 «글자»로 밝힌다 */
  .radar-list .rsrc{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
    font-size:10.5px;font-weight:800;color:#c4b5fd;background:rgba(167,139,250,0.16);
    border:1px solid rgba(167,139,250,0.42);vertical-align:middle;white-space:nowrap}
  .radar-list .rbasis{display:block;margin:-3px 0 8px;font-size:11px;color:#94a3b8;line-height:1.45}
  .radar-note{margin-top:10px;font-size:11.5px;color:#94a3b8;line-height:1.5}
  @media print{ .radar-list .rsrc{color:#4c1d95;background:#ede9fe;border-color:#c4b5fd}
    .radar-list .rbasis,.radar-note{color:#475569} }
  .chip-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border-radius:12px;background:rgba(139,92,246,0.08);border:1px solid var(--line)}
  .chip .stripe{width:4px;align-self:stretch;border-radius:3px;flex:none;background:var(--good)}
  .chip .ttl{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .chip .cval{font-size:13.5px;font-weight:900;color:var(--good)}
  @media print{
    body{background:#fff !important;color:#1a1a1a !important;padding:0}
    body::before,body::after{display:none !important}
    .topbar{display:none !important}
    .dash{box-shadow:none;border:none;border-radius:0;background:#fff !important;backdrop-filter:none !important}
    .card,.kpi,.formcard{background:#fff !important;border:1px solid #ddd !important;backdrop-filter:none !important;color:#1a1a1a !important}
    .card h3{color:#1a1a1a !important}
    .cta{display:none !important}
    .detail-section{display:none !important}
    @page{size:A4;margin:14mm}
  }
</style>
<script src="/js/session-guard.js" defer></script>
</head>
<body>
  <div class="topbar">
    <span class="logo"><img src="/img/mango-char.png" alt="" style="height:1.4em;width:auto;vertical-align:-0.35em;margin-right:.15em" loading="lazy" decoding="async"><span data-ko="망고아이 학습 레포트" data-en="Mangoi Learning Report">망고아이 학습 레포트</span></span>
    <span class="sp"></span>
    <button class="print-btn" onclick="window.print()" data-ko="🖨 인쇄 / PDF" data-en="🖨 Print / PDF">🖨 인쇄 / PDF</button>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
  <div class="wrap" id="root"><div class="spin">로딩 중…</div></div>

<script>
(function(){
  "use strict";
  var L = { ko:{}, en:{} };
  var lang = 'ko';
  function t(ko,en){ return lang==='ko'?ko:(en||ko); }

  var q = new URLSearchParams(location.search);
  var uid = (q.get('uid')||q.get('id')||'').trim();
  var period = (q.get('period')||'').trim();   // YYYY-MM
  var nameOverride = (q.get('name')||'').trim();
  var token = (q.get('t')||'').trim();          // 있으면 토큰 열람(저장된 레포트), 없으면 실시간 미리보기

  window.toggleLang = function(){
    lang = (lang==='ko')?'en':'ko';
    document.getElementById('langBtn').textContent = (lang==='ko')?'EN':'한국어';
    document.documentElement.lang = lang;
    // static labels
    document.querySelectorAll('[data-ko]').forEach(function(el){
      var v = el.getAttribute(lang==='ko'?'data-ko':'data-en'); if(v!=null) el.textContent=v;
    });
    if (window._lastData) renderDash(window._lastData);
    else if (!uid) renderForm();
  };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function renderForm(){
    var thisMonth = new Date().toISOString().slice(0,7);
    document.getElementById('root').innerHTML =
      '<div class="formcard">'+
        '<h2>'+t('월간 학습 레포트 미리보기','Monthly Report Preview')+'</h2>'+
        '<p>'+t('학생 ID와 월을 입력하면 해당 학생의 월간 레포트를 불러옵니다. (관리자·교사용)','Enter a student ID and month to load the report. (Admin/Teacher)')+'</p>'+
        '<div class="fld"><label>'+t('학생 ID','Student ID')+'</label><input id="f-uid" placeholder="예: hong / stu_123" /></div>'+
        '<div class="fld"><label>'+t('월','Month')+'</label><input id="f-period" type="month" value="'+thisMonth+'" /></div>'+
        '<button class="gobtn" onclick="goReport()">'+t('레포트 보기 ›','View Report ›')+'</button>'+
      '</div>'+
      '<div class="muted-note">'+t('💡 카카오톡으로 보낼 때는 이 페이지 주소에 ?uid=학생ID&period=YYYY-MM 를 붙입니다.','💡 To send via Kakao, append ?uid=ID&period=YYYY-MM to this URL.')+'</div>';
  }
  window.goReport = function(){
    var u = (document.getElementById('f-uid').value||'').trim();
    var p = (document.getElementById('f-period').value||'').trim();
    if(!u||!p){ alert(t('학생 ID와 월을 입력하세요.','Enter student ID and month.')); return; }
    location.search = '?uid='+encodeURIComponent(u)+'&period='+encodeURIComponent(p);
  };

  function svgTrend(items){
    // items: [{score_overall, ...}] 종합점수(5점) → 라인. 비면 안내
    var pts = (items||[]).map(function(r){ return Number(r.score_overall)||0; }).filter(function(v){return v>0;});
    if(pts.length<2) return '<div style="font-size:12px;color:#94a3b8;padding:10px 4px">'+t('점수 추이를 그릴 데이터가 아직 적어요.','Not enough data yet.')+'</div>';
    var W=500,H=170,pad=24, n=pts.length;
    var max=5, min=0;
    var xs=function(i){ return pad + (W-pad*2)*(i/(n-1)); };
    var ys=function(v){ return 18 + (H-40)*(1-(v-min)/(max-min)); };
    var poly=pts.map(function(v,i){return xs(i).toFixed(1)+','+ys(v).toFixed(1);}).join(' ');
    var dots=pts.map(function(v,i){return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="4.5" fill="#a78bfa"/>';}).join('');
    var labs=pts.map(function(v,i){return '<text x="'+xs(i).toFixed(1)+'" y="'+H+'" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">'+(i+1)+t('회','')+'</text>';}).join('');
    return '<svg viewBox="0 0 '+W+' '+(H+6)+'" style="width:100%;height:auto">'+
      '<g stroke="rgba(255,255,255,0.08)"><line x1="'+pad+'" y1="18" x2="'+(W-pad)+'" y2="18"/><line x1="'+pad+'" y1="78" x2="'+(W-pad)+'" y2="78"/><line x1="'+pad+'" y1="138" x2="'+(W-pad)+'" y2="138"/></g>'+
      '<polyline fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+poly+'"/>'+dots+labs+'</svg>';
  }

  /* 🌟 오각형(레이더) 5축 — d.radar = {pronunciation,vocab,sentence,attitude,participation} (0~100 또는 null)
     🤖 (2026-08-07) src = d.radar_source — 축마다 'teacher'(강사 평가서) / 'ai'(AI 학습 활동) / null.
        AI 로 채운 축은 반드시 그렇다고 표시하고 근거(basis)를 같이 적는다.
        표시를 빼면 학부모가 AI 활동 점수를 «선생님이 매긴 점수» 로 읽는다 — 그건 거짓말이 된다. */
  function svgRadar(radar, src, basis){
    src = src || {}; basis = basis || {};
    var axes = [
      {k:'pronunciation', ko:'발음·유창성', en:'Pronunciation & Fluency'},
      {k:'vocab', ko:'어휘 수준', en:'Vocabulary Level'},
      {k:'sentence', ko:'문장 구성력', en:'Sentence Building'},
      {k:'attitude', ko:'수업 태도', en:'Class Attitude'},
      {k:'participation', ko:'학습 참여도', en:'Participation'}
    ];
    var haveAny = radar && axes.some(function(a){ return radar[a.k]!=null; });
    if(!haveAny) return '';
    var n=axes.length, cx=100, cy=100, R=72;
    function pt(i,val){ var a=-Math.PI/2+i*(2*Math.PI/n); var r=R*(Math.max(0,Math.min(100,Number(val)||0))/100); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
    function ringPt(i,frac){ var a=-Math.PI/2+i*(2*Math.PI/n); return [cx+R*frac*Math.cos(a), cy+R*frac*Math.sin(a)]; }
    var rings=[0.25,0.5,0.75,1].map(function(frac){
      var pts=[]; for(var i=0;i<n;i++) pts.push(ringPt(i,frac).join(','));
      return '<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>';
    }).join('');
    var spokes=''; for(var i=0;i<n;i++){ var o=ringPt(i,1); spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+o[0]+'" y2="'+o[1]+'" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>'; }
    var poly = axes.map(function(a,i){ return pt(i,radar[a.k]).join(','); }).join(' ');
    var dots = axes.map(function(a,i){ var p=pt(i,radar[a.k]); return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#a78bfa"/>'; }).join('');
    var svg = '<svg viewBox="0 0 200 200" role="img">'+rings+spokes+
      '<polygon points="'+poly+'" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-width="2.2" stroke-linejoin="round"/>'+dots+'</svg>';
    var list = '<ul class="radar-list">'+axes.map(function(a){
      var v = radar[a.k];
      var tag = (src[a.k]==='ai')
        ? '<span class="rsrc">'+t('AI 학습기록','From AI activity')+'</span>' : '';
      var b = basis[a.k];
      var bl = (src[a.k]==='ai' && b) ? '<li class="rbasis">'+esc(t(b.ko, b.en))+'</li>' : '';
      return '<li><span class="rlab">'+t(a.ko,a.en)+tag+'</span><span class="rval">'+(v!=null?v:'—')+'</span></li>'+bl;
    }).join('')+'</ul>';
    /* AI 로 채운 축이 하나라도 있으면 카드 아래에 한 줄로 한 번 더 밝힌다.
       칩만으로는 인쇄본에서 눈에 안 들어온다. */
    var aiN = axes.filter(function(a){ return src[a.k]==='ai'; }).length;
    var note = aiN ? '<p class="radar-note">'+t(
        '※ «AI 학습기록» 표시가 붙은 항목은 선생님 평가가 아니라, 학생이 실제로 한 AI 학습 기록에서 자동으로 계산한 점수입니다.',
        '※ Items marked "From AI activity" are calculated automatically from the student\'s own AI learning records, not from a teacher\'s evaluation.'
      )+'</p>' : '';
    return '<div class="radar-row">'+svg+list+'</div>'+note;
  }

  function renderDash(d){
    window._lastData = d;
    var s = d.student||{};
    var nm = nameOverride || s.student_name || s.user_id || uid;
    var ev = d.evaluations||{count:0,avg_score:0,items:[]};
    var vo = d.voice||{};
    var att = (d.attendance||{}).days||0;
    var items = ev.items||[];
    var hasData = (ev.count>0)||(att>0)||((vo.sessions||0)>0)||!!d.judgment||!!(d.scene_words&&d.scene_words.sessions>0);

    var goals = items.map(function(r){return r.next_goals;}).filter(Boolean).slice(-3);
    var aiText = d.ai_text || (hasData ? t('이번 달 학습 요약입니다.','Monthly learning summary.') : '');

    var html = '<div class="dash"><div class="hero"><div class="mango"><img src="/img/mango-char.png" alt="망고아이" style="width:52px;height:52px;object-fit:contain" loading="lazy" decoding="async"></div>'+
      '<span class="badge">'+esc(d.year_month||period)+'</span>'+
      '<h2>'+esc(nm)+' '+t('학생 학습 레포트','Report')+'</h2>'+
      '<div class="who">'+(s.parent_name?(t('학부모: ','Parent: ')+esc(s.parent_name)):t('망고아이 영어','Mangoi English'))+'</div></div>'+
      '<div class="body">';

    if(!hasData){
      html += '<div class="card"><div class="empty"><div class="ico">📭</div><div style="font-weight:800;color:#e6ecff">'+
        t('이번 달 학습 기록이 아직 없습니다','No records for this month yet')+'</div>'+
        '<div style="font-size:12.5px;margin-top:6px">'+t('수업·평가·발음 연습 기록이 쌓이면 자동으로 채워집니다.','It fills automatically as lessons and evaluations accumulate.')+'</div></div></div>';
    } else {
      var jd = d.judgment;
      // 🌟 오각형 요약 카드 (기획안 4-1) — 화면에서도, 인쇄에서도 가장 먼저 보이는 자리
      var radarHtml = svgRadar(d.radar, d.radar_source, d.radar_basis);
      if(radarHtml){
        var gh = d.growth_highlight;
        html += '<div class="card radar-card"><h3>🌟 '+t('이번 기간 한눈에 보기','This Period at a Glance')+'</h3>'+
          (gh ? '<span class="growth-badge">✨ '+esc(t(gh.text_ko, gh.text_en))+'</span>' : '')+
          radarHtml+'</div>';
      }
      // 📋 현황 상태칩 — 실제로 값이 있는 것만(출결은 항상, 판단력은 있을 때만. 지어낸 값은 넣지 않음)
      var chips = '<div class="chip"><span class="stripe"></span><div><div class="ttl">'+t('출결 상황','Attendance')+'</div><div class="cval">'+att+t('일 출석','d attended')+'</div></div></div>';
      if(d.ai_activity_count){
        chips += '<div class="chip"><span class="stripe"></span><div><div class="ttl">'+t('AI 학습 활동','AI Learning Activity')+'</div><div class="cval">'+d.ai_activity_count+t('회 이용','times')+'</div></div></div>';
      }
      if(jd && jd.index!=null){
        chips += '<div class="chip"><span class="stripe"></span><div><div class="ttl">'+t('판단력 지수','Judgment Index')+'</div><div class="cval">'+jd.index+' / 100</div></div></div>';
      }
      html += '<div class="card"><h3>📋 '+t('이번 기간 현황','This Period\'s Status')+'</h3><div class="chip-row">'+chips+'</div></div>';
      // 💬 담임의 한마디 — AI 초안 + 강사 확인(2026-07-25: 예전엔 이 카드와 "강사 코멘트" 카드가 같은 내용을 두 번 보여줬음 — 하나로 통합)
      if(aiText) html += '<div class="card"><h3>💬 '+t('담임의 한마디','Teacher\'s Note')+' <span class="ai-tag">AI</span></h3><div class="ai-greet">'+esc(aiText)+'</div></div>';

      // ── 화면 전용 상세(인쇄 시 숨김) — 기존 카드는 하나도 안 지우고 그대로 둔다 ──
      html += '<div class="detail-section">';
      html += '<div class="kpis">'+
        '<div class="kpi"><div class="v mg">'+att+t('일','d')+'</div><div class="l">'+t('출석','Attend')+'</div></div>'+
        '<div class="kpi"><div class="v blue">'+(ev.avg_score||0)+'</div><div class="l">'+t('평가(5점)','Eval/5')+'</div></div>'+
        '<div class="kpi"><div class="v up">'+(vo.avg_pronunciation||0)+'</div><div class="l">'+t('발음','Pron')+'</div></div>'+
        '<div class="kpi"><div class="v pink">'+(vo.best||0)+'</div><div class="l">'+t('최고','Best')+'</div></div></div>';
      html += '<div class="card"><h3>📈 '+t('평가 점수 추이','Score Trend')+'</h3>'+svgTrend(items)+'</div>';
      if((vo.sessions||0)>0){
        html += '<div class="card"><h3>🎤 '+t('발음 영역별','Pronunciation')+'</h3>'+
          pronRow(t('정확도','Accuracy'),vo.avg_accuracy)+pronRow(t('발음','Pron.'),vo.avg_pronunciation)+pronRow(t('유창성','Fluency'),vo.avg_fluency)+'</div>';
      }
      if(jd){
        html += '<div class="card"><h3>🧠 '+t('판단력 성장','Decision-making')+' <span class="ai-tag">AI</span></h3>'+
          '<div style="text-align:center;margin:2px 0 10px"><span style="font-size:32px;font-weight:900;color:#7c3aed">'+(jd.index!=null?jd.index:'—')+'</span>'+
          '<span style="color:#94a3b8;font-size:12.5px"> / 100 · '+(jd.events||0)+t('회 판단','')+'</span>'+
          '<div style="font-size:12px;color:#94a3b8;margin-top:2px">'+t('상황에 맞는 표현을 스스로 고르고 이유를 설명하는 힘','Choosing the best expression and explaining why')+'</div></div>'+
          pronRow(t('선택 적절성','Choice'), jd.axis&&jd.axis.choice)+
          pronRow(t('이유 논리','Reasoning'), jd.axis&&jd.axis.reasoning)+
          pronRow(t('어투 민감도','Register'), jd.axis&&jd.axis.register)+
          ((jd.top_gaps&&jd.top_gaps.length)? '<div style="font-size:12.5px;color:#7c3aed;margin-top:8px">💪 '+t('더 연습할 점','Practice more')+': '+jd.top_gaps.map(esc).join(', ')+'</div>':'')+
          '</div>';
      }
      /* ✍️ 교재 낱말 쓰기 숙제 — 한 판이라도 했을 때만(서버가 null 이면 카드째 생략). 약한 낱말은 «다시 볼 것» 으로만 말한다. */
      var sw=d.scene_words;
      if(sw&&sw.sessions>0){
        html += '<div class="card"><h3>✍️ '+t('교재 낱말 쓰기 숙제','Textbook Word Writing')+'</h3>'+
          '<div style="font-size:13.5px;color:var(--slate);margin-bottom:8px">'+t('이번 달 ','This month: ')+sw.sessions+t('번 · 낱말 ',' sessions · ')+sw.items+t('개 중 ',' words, ')+sw.correct+t('개를 스스로 맞혔어요',' written correctly on the first try')+'</div>'+
          ((sw.weak&&sw.weak.length)
            ? '<div style="font-size:12.5px;color:var(--mango)">💪 '+t('다시 볼 낱말','Words to review')+': <b>'+sw.weak.map(esc).join(', ')+'</b></div>'
            : '<div style="font-size:12.5px;color:var(--good)">'+t('이번 달 틀린 낱말이 남아 있지 않아요 👏','No tricky words left this month 👏')+'</div>')+
          '</div>';
      }
      html += '</div>'; // .detail-section

      // 다음 목표
      if(goals.length){
        var gi=''; goals.forEach(function(g,i){ gi+='<div class="goal"><span class="n">'+(i+1)+'</span><span>'+esc(g)+'</span></div>'; });
        html += '<div class="card"><h3>🎯 '+t('다음 목표','Next Goal')+'</h3>'+gi+'</div>';
      }
      // 🏠 가정 실천 팁 (기획안 4-3 신규 — AI 초안, 강사 승인 대상)
      if(d.ai_draft_tip_ko || d.ai_draft_tip_en){
        html += '<div class="card"><h3>🏠 '+t('가정에서 도와주실 수 있어요','How You Can Help at Home')+'</h3><div class="comment">'+
          esc(t(d.ai_draft_tip_ko||'', d.ai_draft_tip_en||''))+'</div></div>';
      }
    }
    // CTA (항상)
    html += '<div class="cta"><a class="primary" href="/?menu=payment">'+t('🔄 수강 연장','🔄 Renew')+'</a>'+
      '<a class="ghost" href="/?menu=inquiry">'+t('💬 상담 신청','💬 Consult')+'</a></div>';
    html += '<div class="muted-note">'+t('이 레포트는 망고아이 학습 데이터를 바탕으로 자동 생성되었습니다.','Auto-generated from Mangoi learning data.')+'</div>';
    html += '</div></div>';
    document.getElementById('root').innerHTML = html;
  }
  function pronRow(lab,v){ v=Number(v)||0; return '<div class="pron-row"><span class="lab">'+lab+'</span><div class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></div><span class="pct">'+v+t('점','')+'</span></div>'; }

  function loadReport(){
    document.getElementById('root').innerHTML = '<div class="spin">'+t('레포트 불러오는 중…','Loading…')+'</div>';
    // 토큰이 있으면 저장된 레포트를 토큰 검증으로 열람(학부모 링크), 없으면 실시간 생성 미리보기(관리자/교사)
    var _mt = ''; try { _mt = localStorage.getItem('mango_token') || ''; } catch(e){}
    var api = token
      ? '/api/report/monthly-view?uid='+encodeURIComponent(uid)+'&period='+encodeURIComponent(period)+'&t='+encodeURIComponent(token)
      : '/api/report/monthly/'+encodeURIComponent(uid)+'/'+encodeURIComponent(period)+'?ai=1'+(_mt?'&token='+encodeURIComponent(_mt):'');  // 🔐 관리자는 쿠키, 그 외는 토큰
    fetch(api, {cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(!d||!d.ok){ document.getElementById('root').innerHTML='<div class="card"><div class="empty"><div class="ico">⚠️</div>'+t('레포트를 불러오지 못했습니다.','Could not load the report.')+'</div></div>'; return; }
        renderDash(d);
      })
      .catch(function(){ document.getElementById('root').innerHTML='<div class="card"><div class="empty"><div class="ico">⚠️</div>'+t('네트워크 오류','Network error')+'</div></div>'; });
  }

  if(uid && period){ loadReport(); } else { renderForm(); }
})();
</script>
