<style>
  @media print {

  body{position:relative;min-height:100vh;background:#0a0e1a;color:#e6ecff;font-family:MangoiHanSC,'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;padding-bottom:80px}

  .wrap{max-width:860px;margin:0 auto;padding:32px 18px}
  .brand{text-align:center;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid rgba(139,92,246,0.18)}

<body>

<div class="actions no-print">
  <button class="print-btn" onclick="window.print()">🖨 인쇄 / PDF 저장</button>
  <a class="home-btn" href="/" style="text-decoration:none;display:inline-block">🏠 홈</a>
</div>

<div class="wrap">
  <div class="brand">
    <span class="brand-logo">Mangoi</span>
    <div class="brand-sub" id="report-title">월간 성적표</div>
  </div>
  <div id="content"><div class="empty">불러오는 중…</div></div>
</div>

<script>
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function getQuery(k){ try { return new URLSearchParams(location.search).get(k); } catch(e){ return null; } }

// 로그인된 학생 자동 감지 (index.html 로그인 시 저장되는 키들)
function getLoggedUid(){
  try {
    var lu = JSON.parse(localStorage.getItem('mangoi_logged_user') || localStorage.getItem('mango_user') || 'null');
    if (lu && (lu.uid || lu.user_id)) return lu.uid || lu.user_id;
  } catch(e){}
  try { var u = localStorage.getItem('mangoi_uid'); if (u) return u; } catch(e){}
  return null;
}

const uid = getQuery('uid') || getLoggedUid();
const ym = getQuery('ym') || (new Date()).toISOString().slice(0, 7);  // YYYY-MM

if (!uid) {
  showLogin();
} else {
  load();
}

// 🔑 학생 ID/비밀번호 로그인 폼 (index.html 과 동일한 /api/student/login 사용)
function showLogin() {
  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:380px;margin:20px auto;padding:28px 24px">
      <h3 style="font-size:17px;color:#fff;text-align:center;margin-bottom:6px">🔑 학생 로그인</h3>
      <p style="color:#94a3b8;font-size:12.5px;text-align:center;margin-bottom:20px">성적표를 보려면 로그인하세요</p>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11.5px;color:#94a3b8;margin-bottom:6px">학생 ID</label>
        <input id="lg-uid" type="text" autocomplete="username" placeholder="예: hong_gd"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(139,92,246,0.35);background:#0e1e40;color:#fff;font-size:14px;outline:none">
      </div>
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:11.5px;color:#94a3b8;margin-bottom:6px">비밀번호</label>
        <input id="lg-pw" type="password" autocomplete="current-password" placeholder="비밀번호"
          style="width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(139,92,246,0.35);background:#0e1e40;color:#fff;font-size:14px;outline:none">
      </div>
      <p id="lg-err" style="display:none;color:#fca5a5;font-size:12.5px;margin-bottom:12px;text-align:center"></p>
      <button id="lg-btn" onclick="doStudentLogin()"
        style="width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a">
        로그인
      </button>
    </div>`;
  // 엔터로 로그인
  const pw = document.getElementById('lg-pw');
  const idf = document.getElementById('lg-uid');
  function onEnter(e){ if (e.key === 'Enter') doStudentLogin(); }
  if (pw) pw.addEventListener('keydown', onEnter);
  if (idf) idf.addEventListener('keydown', onEnter);
  if (idf) idf.focus();
}

async function doStudentLogin() {
  const idf = document.getElementById('lg-uid');
  const pwf = document.getElementById('lg-pw');
  const err = document.getElementById('lg-err');
  const btn = document.getElementById('lg-btn');
  const loginId = (idf && idf.value || '').trim();
  const pw = (pwf && pwf.value || '').trim();
  if (!loginId) { if (err){ err.style.display='block'; err.textContent='학생 ID를 입력하세요'; } return; }
  if (btn) { btn.disabled = true; btn.textContent = '로그인 중…'; }
  try {
    const r = await fetch('/api/student/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: loginId, password: pw })
    });
    const d = await r.json();
    if (!d.ok) {
      if (err){ err.style.display='block'; err.textContent='❌ ' + (d.message || d.error || '로그인 실패'); }
      if (btn){ btn.disabled = false; btn.textContent = '로그인'; }
      return;
    }
    // index.html 과 동일한 키로 세션 저장
    try {
      const _lu = {
        user_id: d.user.user_id, uid: d.user.user_id,
        name: d.user.user_name, user_name: d.user.user_name,
        role: d.user.role || 'student'
      };
      localStorage.setItem('mango_user', JSON.stringify(_lu));
      localStorage.setItem('mangoi_logged_user', JSON.stringify(_lu));
      localStorage.setItem('mangoi_uid', d.user.user_id);
      // 🔐 uid 서명 토큰 — AI 친구 대화 등 uid 기반 개인 데이터 API 인증용
      if (d.token) localStorage.setItem('mango_token', d.token);
    } catch(e){}
    // uid 를 붙여 보고서 재진입
    const p = new URLSearchParams(location.search);
    p.set('uid', d.user.user_id);
    if (!p.get('ym')) p.set('ym', ym);
    location.search = p.toString();
  } catch(e) {
    if (err){ err.style.display='block'; err.textContent='❌ ' + e.message; }
    if (btn){ btn.disabled = false; btn.textContent = '로그인'; }
  }
}
window.doStudentLogin = doStudentLogin;

async function load() {
  let _t = ''; try { _t = localStorage.getItem('mango_token') || ''; } catch(e){}
  const url = `/api/report/monthly/${encodeURIComponent(uid)}/${ym}` + (_t ? '?token=' + encodeURIComponent(_t) : '');  // 🔐 본인 인증
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (!d.ok) {
      // 🔐 URL의 ?uid= 는 실제 로그인(토큰)을 대신할 수 없다 — 인증 안 됐으면 로그인 화면으로.
      //   (카카오톡 공유 링크 등 uid만 아는 상태로 들어와도 실제 데이터는 로그인해야만 보임)
      if (r.status === 401 || d.error === 'auth_required') { showLogin(); return; }
      throw new Error(d.error);
    }
    render(d);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty">로드 실패: ${esc(e.message)}</div>`;
  }
}

/* 📏 score_overall 은 «한 칸에 두 척도» 다 — 강사가 쓰는 1분 수업일지(/api/eval/create,
 *   bulk-create)는 1~5, AI 수업 리포트(/api/eval/ai-lesson-report)는 0~100 을 같은 칸에 적는다.
 *   옛 코드는 「/10」으로 못 박아 두 갈래 **어느 쪽도 아닌 숫자**를 학부모에게 보여줬다
 *   (2026-09-04 실측: 1~5 행 3건 · 0~100 행 2건). 값에서 척도를 읽어 만점을 그대로 말한다.
 *   ⚠️ eval.html 의 evalMax() 와 «같은 말» 을 해야 한다 — 한쪽만 고치면 두 화면이 다른 만점을 말한다.
 *   ⛔ 임의의 숫자로 환산하지 말 것.
 *   ⚠️ 남은 것 — 위 「평균 점수」 타일(ev.avg_score)은 **서버가 두 척도를 섞어 평균 낸 값**이라
 *      한 달에 두 갈래가 같이 있으면 뜻 없는 숫자가 된다(5 와 88 → 46.5). 만점도 못 붙인다.
 *      고치려면 buildMonthlyReportData(src/api-reports.ts) 에서 맞춰야 하므로 별건으로 남긴다. */
function evalMax(v){ return (Number(v) || 0) > 5 ? 100 : 5; }
/* 🔴 「평균 점수」는 서버(buildMonthlyReportData, src/api-reports.ts)가 score_overall 을 그대로
 *   평균 낸 값이다. 한 달에 두 척도가 섞이면 5 와 88 의 평균이 46.5 가 되어 **뜻이 없는 숫자**다.
 *   ⛔ 그 숫자를 만점도 단서도 없이 그대로 보여주지 말 것 — 화면이 모르면 «모른다» 고 말해야 한다
 *      (CLAUDE.md 2장 「측정할 수 없는 값을 그럴듯하게 채우고 싶을 때」).
 *   ⚠️ 서버를 고치는 것이 정본이다 — 여기서는 «섞였는지» 만 보고 가린다. */
function avgLabel(ev){
  var items = (ev && ev.items) || [];
  var kinds = {};
  items.forEach(function(e){ if (e && e.score_overall != null) kinds[evalMax(e.score_overall)] = 1; });
  if (Object.keys(kinds).length > 1) return '—';           // 섞인 달 — 평균이 뜻을 잃는다
  var max = Object.keys(kinds)[0];
  return (ev && ev.avg_score) ? ev.avg_score + '<span style="font-size:13px;color:#94a3b8;-webkit-text-fill-color:#94a3b8">/' + (max || 5) + '</span>' : 0;
}
function render(d) {
  const s = d.student || {};
  const v = d.voice || {};
  const ev = d.evaluations || {};
  const att = d.attendance || {};
  const pay = d.payments || {};

  const [year, month] = d.year_month.split('-');
  document.getElementById('report-title').textContent = `${year}년 ${parseInt(month,10)}월 성적표`;

  let html = `
    <h1>${esc(s.student_name||uid)} 학생</h1>
    <div class="meta">
      <div>학생 ID: <b>${esc(s.user_id||uid)}</b></div>
      <div>학부모: <b>${esc(s.parent_name||'-')}</b></div>
      <div>리포트 생성: <b>${new Date(d.generated_at).toLocaleString('ko-KR')}</b></div>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="stat-num">${att.days || 0}</div><div class="stat-label">출석 일수</div></div>
      <div class="stat"><div class="stat-num">${ev.count || 0}</div><div class="stat-label">수업일지</div></div>
      <div class="stat"><div class="stat-num">${avgLabel(ev)}</div><div class="stat-label">평균 점수</div></div>
      <div class="stat"><div class="stat-num">${v.sessions || 0}</div><div class="stat-label">음성 코칭</div></div>
      <div class="stat"><div class="stat-num">${v.best || 0}</div><div class="stat-label">발음 최고점</div></div>
      <div class="stat"><div class="stat-num">${(pay.total_krw||0).toLocaleString('ko-KR')}</div><div class="stat-label">결제 (원)</div></div>
    </div>

    <div class="card">
      <h3>🎙 AI 음성 코칭 평균</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
        <div><div style="font-size:22px;font-weight:800;color:#34d399">${v.avg_accuracy||0}</div><div style="font-size:11px;color:#94a3b8">정확도</div></div>
        <div><div style="font-size:22px;font-weight:800;color:#fbbf24">${v.avg_pronunciation||0}</div><div style="font-size:11px;color:#94a3b8">발음</div></div>
        <div><div style="font-size:22px;font-weight:800;color:#a78bfa">${v.avg_fluency||0}</div><div style="font-size:11px;color:#94a3b8">유창성</div></div>
      </div>
    </div>

    <div class="card">
      <h3>📝 이번 달 수업일지</h3>
      ${(ev.items||[]).length ? (ev.items||[]).map(e => `
        <div class="eval-item">
          <span class="eval-score">${e.score_overall||0}/${evalMax(e.score_overall)}</span>
          <span class="eval-date">${esc(e.lesson_date||'-')}</span>
          ${e.strengths ? `<div class="eval-body"><b>💪 잘한 점:</b> ${esc(e.strengths)}</div>` : ''}
          ${e.improvements ? `<div class="eval-body"><b>⚠️ 보완:</b> ${esc(e.improvements)}</div>` : ''}
          ${e.next_goals ? `<div class="eval-body"><b>🎯 다음 목표:</b> ${esc(e.next_goals)}</div>` : ''}
          ${e.teacher_comment ? `<div class="eval-body"><b>💬 강사 코멘트:</b> ${esc(e.teacher_comment)}</div>` : ''}
        </div>`).join('') : '<div class="empty">이번 달 수업일지가 없습니다</div>'}
    </div>

    <div style="text-align:center;margin-top:30px;padding:20px;color:#94a3b8;font-size:11.5px;border-top:1px solid rgba(139,92,246,0.18)">
      ✨ <b style="color:#fbbf24">망고아이 영어학원</b> — AI 기반 영어 교육 플랫폼<br>
      이 보고서는 자동 생성되었습니다. 인쇄/PDF 저장 가능.
    </div>`;
  document.getElementById('content').innerHTML = html;
}
</script>
