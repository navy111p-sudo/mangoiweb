<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Reading Ladder</title>
<meta name="description" content="영어 독서 4단계 사다리 · 이야기 → 지식 글 · 핵심 찾기 반복 · 그림 동화책 4권">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/mangoi-han.css">
<script defer src="/js/back-nav.js"></script>
<style>
/* A.i 동화책 모음 — 학생 메뉴 «AI 학습 도구 › 📚 영어 독서» 이 여는 화면. 책 목록은 아래 BOOKS 한 곳이 정본. */
:root{
  --paper:#fbf8f2; --page:#ffffff; --ink:#23262f; --soft:#5b6170; --line:#e4dccd; --chip:#f1ebdf; --ok:#1f7a4d;
  --okbg:#e3f3ea; --no:#a33a2c; --nobg:#fbe8e4; --mark:#fff1b8; --accent:#1d6fa5;
  --display:'Fraunces',Georgia,serif;
  --body:'MangoiHanSC','Nunito','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17191f; --page:#20232b; --ink:#eceae4; --soft:#a9adb8; --line:#363a45; --chip:#2b2f39; --ok:#7fd3a6; --okbg:#1d3a2c; --no:#f2998c; --nobg:#40231f; --mark:#4a4116; --accent:#7cc0ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17191f; --page:#20232b; --ink:#eceae4; --soft:#a9adb8; --line:#363a45; --chip:#2b2f39; --ok:#7fd3a6; --okbg:#1d3a2c; --no:#f2998c; --nobg:#40231f; --mark:#4a4116; --accent:#7cc0ea; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* ← 뒤로 · 🏠 홈 — 글자가 ← 로 시작해 back-nav.js 가 떠 있는 동그란 ← 를 따로 안 넣는다(hasVisibleBack). */
.nav{display:inline-flex;align-items:center;gap:4px;min-height:36px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:99px;padding:5px 14px;font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.nav:hover,.lang:hover{border-color:var(--soft)}
.nav:focus-visible,.lang:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.tag{font-size:13px;color:var(--soft);flex:1 1 auto}
.lang{min-height:36px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:14px 0 6px}
.lead{color:var(--soft);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.book{display:flex;flex-direction:column;background:var(--page);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;min-width:0}
.book:hover{border-color:var(--c)}
.book:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.book img{display:block;width:100%;aspect-ratio:1024/687;object-fit:cover;background:var(--chip)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.no{font-size:12px;font-weight:800;color:var(--c)}
.bt{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2}
.bs{font-size:14px;color:var(--soft)}
.prog{font-size:13px;font-weight:700;color:var(--soft)}
.prog.done{color:var(--ok)}
.foot{margin-top:22px;font-size:13px;color:var(--soft)}
/* ── 📚 4단계 독서 사다리(js/reading-ladder.js) — 단계 색은 데이터(--sc)가 준다 ── */
.rl-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
@media (max-width:640px){.rl-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rl-tab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-top:5px solid var(--sc);border-radius:14px;background:var(--page);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.rl-tab.on{box-shadow:0 0 0 2px var(--sc) inset;background:var(--chip)}
.rl-tab-n{font-size:12px;font-weight:800;color:var(--soft)}
.rl-tab-t{font-weight:800;font-size:15px;line-height:1.25}
.rl-tab-g,.rl-tab-p{font-size:12px;color:var(--soft)}
.rl-stagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:14px;background:var(--page);margin-bottom:10px}
.rl-stagehead span{color:var(--soft);font-size:14px}
.rl-howto{font-size:13px;color:var(--soft);margin:0 0 12px}
.rl-next{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--okbg);color:var(--ink);font-weight:700;margin-bottom:10px}
.rl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.rl-card{display:flex;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--page);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.rl-card:hover{border-color:var(--soft)}
.rl-card.done{border-color:var(--ok)}
.rl-card-no{flex:0 0 28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.rl-card-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.rl-card-t{font-weight:800;line-height:1.25}
.rl-card-k,.rl-card-m{font-size:13px;color:var(--soft)}
.rl-card-s{font-size:13px;font-weight:700}
.rl-card.done .rl-card-s{color:var(--ok)}
.rl-h3{margin:22px 0 10px;font-size:17px}
/* 📋 보기 방식 · 단계별 한눈에 · 주제 거르기 */
.rl-segs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:99px;background:var(--page);margin:0 0 12px;flex-wrap:wrap}
.rl-seg{min-height:38px;padding:6px 14px;border:0;border-radius:99px;background:none;color:var(--soft);font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.rl-seg.on{background:var(--accent);color:var(--page)}
.rl-pbar{display:inline-block;vertical-align:middle;width:72px;height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-right:6px}
.rl-pbar i{display:block;height:100%;background:var(--sc)}
.rl-sec{background:var(--page);border:1px solid var(--line);border-top:6px solid var(--sc);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.rl-sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 16px;align-items:flex-start;margin-bottom:10px}
.rl-sec-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.rl-sec-n{font-size:12px;font-weight:800;color:var(--soft)}
.rl-sec h2{margin:0;font-family:var(--display);font-size:clamp(20px,4vw,26px);line-height:1.2}
.rl-sec-g{font-size:13px;font-weight:700;color:var(--ink)}
.rl-sec-d{font-size:13px;color:var(--soft)}
.rl-sec-p{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.rl-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:6px}
.rl-li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:"no t s" "no m s";gap:0 10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer;min-width:0}
.rl-li:hover{border-color:var(--soft)}
.rl-li:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rl-li.done{border-color:var(--ok)}
.rl-li-no{grid-area:no;width:28px;height:28px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.rl-li-t{grid-area:t;font-weight:800;line-height:1.3;min-width:0}
.rl-li-t small{display:block;font-weight:600;font-size:13px;color:var(--soft)}
.rl-li-m{grid-area:m;font-size:12px;color:var(--soft)}
.rl-li-s{grid-area:s;font-size:12px;font-weight:700;white-space:nowrap}
.rl-li.done .rl-li-s{color:var(--ok)}
.rl-pic{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;border:1px solid var(--sc);vertical-align:2px}
.rl-jump{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
@media (max-width:640px){.rl-jump{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rl-jbtn{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:12px;background:var(--page);color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer;min-width:0}
.rl-jbtn span{color:var(--soft);font-variant-numeric:tabular-nums}
.rl-jbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rl-sec{scroll-margin-top:12px}
.rl-topics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rl-tchip{min-height:34px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--page);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.rl-tchip.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--chip)}
.rl-seg:focus-visible,.rl-tchip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rl-btn{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--page);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none}
.rl-btn:hover{border-color:var(--soft)}
.rl-btn.rl-primary{background:var(--accent);border-color:var(--accent);color:var(--page)}
.rl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rl-badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid var(--sc);color:var(--ink)}
.rl-pos{margin-left:auto;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.rl-read{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rl-read h2{font-family:var(--display);font-size:clamp(22px,4.5vw,30px);line-height:1.2;margin:0 0 4px;text-wrap:balance}
.rl-sub{margin:0 0 10px;color:var(--soft);font-size:14px}
.rl-bg{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.rl-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.rl-text{font-size:18px;line-height:1.8;margin:12px 0}
.rl-s{display:inline;padding:2px 3px;border-radius:6px;border:0;background:none;color:inherit;font:inherit;text-align:left}
.rl-text.pick .rl-s{cursor:pointer;background:var(--chip);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rl-text.pick .rl-s:hover{background:var(--mark)}
.rl-s.ok{background:var(--okbg)!important;box-shadow:inset 0 -2px 0 var(--ok)}
.rl-s.no{background:var(--nobg)!important}
.rl-ko{display:block;font-size:14px;color:var(--soft);line-height:1.5;margin:0 0 6px}
.rl-text .rl-ko{font-size:14px}
.rl-words{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.rl-word{font-size:14px;padding:4px 10px;border-radius:99px;background:var(--chip)}
.rl-chiplab{font-size:12px;font-weight:800;color:var(--soft);margin-right:4px}
.rl-step{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rl-step.cur{border-color:var(--accent)}
.rl-step h3{margin:0 0 6px;font-size:17px}
.rl-q{margin:0 0 8px}
.rl-opts{display:grid;gap:8px}
.rl-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.rl-opt:hover:not([disabled]){border-color:var(--soft)}
.rl-opt[disabled]{cursor:default}
.rl-opt.ok{background:var(--okbg);border-color:var(--ok)}
.rl-opt.no{background:var(--nobg);border-color:var(--no)}
.rl-opt .rl-ko{margin:0}
.rl-fb{margin:8px 0;font-size:15px}
.rl-fb.ok{color:var(--ok);font-weight:700}
.rl-fb.no{color:var(--no);font-weight:700}
.rl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.rl-chip{font-size:14px;padding:3px 10px;border-radius:99px;border:1px dashed var(--soft)}
.rl-sum{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical}
.rl-model{padding:10px 12px;border-radius:12px;background:var(--mark);font-weight:700}
.rl-end{padding:14px 16px;border-radius:16px;background:var(--okbg);font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.rl-end.big{display:block;font-size:18px}
.rl-end.big p{font-weight:600;font-size:15px}
.rl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rl-btn:focus-visible,.rl-tab:focus-visible,.rl-card:focus-visible,.rl-opt:focus-visible,.rl-s:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="nav" id="backBtn" href="/" onclick="if(window.mangoiGoBack){event.preventDefault();window.mangoiGoBack();}">← <span data-ko="뒤로" data-en="Back">뒤로</span></a>
    <a class="nav" id="homeBtn" href="/">🏠 <span data-ko="홈" data-en="Home">홈</span></a>
    <span class="tag" data-ko="4단계 독서 사다리 · 이야기 48편 + 그림 동화책 4권" data-en="4-step reading ladder · 48 texts + 4 picture books">4단계 독서 사다리 · 이야기 48편 + 그림 동화책 4권</span>
    <button type="button" class="lang" id="langBtn" aria-label="언어 전환 / Switch language">EN</button>
  </div>
  <h1 data-ko="📚 영어 독서" data-en="📚 English Reading">📚 영어 독서</h1>
  <p class="lead" data-ko="쉬운 이야기부터 고1 지식 글까지 4단계. 한 편마다 «핵심 문장 → 중심 내용 → 영어 한 문장» 으로 핵심 찾기를 반복해요." data-en="Four steps from easy stories to high-school non-fiction. In every text, practice finding the main idea: key sentence → main idea → one English sentence.">쉬운 이야기부터 고1 지식 글까지 4단계. 한 편마다 «핵심 문장 → 중심 내용 → 영어 한 문장» 으로 핵심 찾기를 반복해요.</p>
  <!-- 📚 4단계 사다리(js/reading-ladder.js 가 그린다). 그림 동화책 4권은 2단계 안에 함께 그린다. -->
  <div id="rlApp"></div>
  <!-- 사다리 스크립트를 못 받으면 예전처럼 그림 동화책 목록만 보인다(reading-ladder.js 가 돌면 이 칸을 감춘다). -->
  <div id="booksWrap"><div class="grid" id="books"></div></div>
  <p class="foot" data-ko="진행 기록·도장은 이 기기에 저장됩니다. 포인트는 그림 동화책만, 하루 2권까지 받을 수 있어요." data-en="Progress and stamps are saved on this device. Points are for picture books only, up to 2 books a day.">진행 기록·도장은 이 기기에 저장됩니다. 포인트는 그림 동화책만, 하루 2권까지 받을 수 있어요.</p>
</div>
<script>
(function(){
  // 📚 책 목록 정본 — 새 책을 만들면 여기 한 줄 + 학생 메뉴는 그대로(이 화면 하나로 갑니다).
  var BOOKS = [
    { id:'red-umbrella',  no:1, c:'#c8372d', title:'The Red Umbrella',
      ko:'버스 정류장 의자 밑 빨간 우산, 비 오기 전에 주인을 찾아 줄까?', en:'A red umbrella under the bench — can they return it before the rain?' },
    { id:'birthday-cake', no:2, c:'#c2410c', title:'The Missing Birthday Cake',
      ko:'생일 케이크가 사라졌다! 단서를 따라 범인을 찾아라.', en:'The birthday cake is gone! Follow the clues to find who took it.' },
    { id:'robot-dance',   no:3, c:'#1d6fa5', title:'Bolt Can Dance',
      ko:'춤을 못 추는 로봇 볼트, 자기만의 춤을 찾을 수 있을까?', en:'Bolt the robot can’t dance — can he find a dance of his own?' },
    { id:'treasure-map',  no:4, c:'#7a4fb0', title:'The Map in the Library Book',
      ko:'도서관 책 속에서 나온 오래된 지도, 보물은 어디에?', en:'An old map falls out of a library book. Where is the treasure?' }
  ];
  var STAMPS = ['read','key','sum','words','infer','write'];
  var lang = 'ko';
  try { lang = localStorage.getItem('story_lang') || 'ko'; } catch(e){}

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function stampCount(id){
    var st = {};
    try { st = JSON.parse(localStorage.getItem('story_' + id + '_stamps') || '{}') || {}; } catch(e){ st = {}; }
    return STAMPS.filter(function(k){ return !!st[k]; }).length;
  }
  function booksHtml(){
    var en = lang === 'en';
    return BOOKS.map(function(b){
      var n = stampCount(b.id);
      var prog = n >= 6 ? (en ? '🎉 Finished (6/6)' : '🎉 완주 (6/6)')
               : n > 0 ? (en ? '🏅 Stamps ' + n + ' / 6' : '🏅 도장 ' + n + ' / 6')
               : (en ? 'Not started' : '아직 안 읽었어요');
      return '<a class="book" style="--c:' + b.c + '" href="/story-' + b.id + '.html">' +
        '<img src="/img/story/' + b.id + '-cover.webp" alt="' + esc(b.title) + '" loading="lazy" decoding="async">' +
        '<div class="bd"><span class="no">Story ' + b.no + '</span>' +
        '<span class="bt">' + esc(b.title) + '</span>' +
        '<span class="bs">' + esc(en ? b.en : b.ko) + '</span>' +
        '<span class="prog' + (n >= 6 ? ' done' : '') + '">' + prog + '</span></div></a>';
    }).join('');
  }
  function render(){ document.getElementById('books').innerHTML = booksHtml(); }
  // 📚 사다리(js/reading-ladder.js)가 2단계 안에 같은 책 목록을 그리고, 이 화면의 언어를 따른다.
  window.__storyBooksHtml = booksHtml;
  // 📋 «단계별 한눈에» 가 2단계 안에 그림책을 한 줄씩 그릴 때 쓴다(도장 수 n 포함).
  window.__storyBookList = function(){ return BOOKS.map(function(b){ return { id:b.id, no:b.no, title:b.title, ko:b.ko, en:b.en, n:stampCount(b.id) }; }); };
  window.__storyLang = function(){ return lang; };
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ko]').forEach(function(el){ el.textContent = el.getAttribute(lang === 'en' ? 'data-en' : 'data-ko'); });
    document.getElementById('langBtn').textContent = lang === 'en' ? 'KO' : 'EN';
    render();
    try { window.dispatchEvent(new Event('story:lang')); } catch(e){}
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('story_lang', lang); } catch(e){}
    applyLang();
  });
  // 책에서 돌아왔을 때 도장 수가 바로 바뀌게(뒤로가기 캐시 포함)
  window.addEventListener('pageshow', function(){ render(); });
  applyLang();
})();
</script>

<script src="/js/reading-ladder.js?v=3"></script>
