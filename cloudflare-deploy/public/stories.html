<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Reading Ladder</title>
<meta name="description" content="영어 독서 4단계 사다리 · 이야기 → 지식 글 · 핵심 찾기 반복 · 그림 동화책 4권">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/mangoi-han.css">
<script defer src="/js/back-nav.js"></script>
<style>
/* A.i 동화책 모음 — 학생 메뉴 «AI 학습 도구 › 📚 영어 독서» 이 여는 화면. 책 목록은 아래 BOOKS 한 곳이 정본. */
:root{
  --paper:#fbf8f2; --page:#ffffff; --ink:#23262f; --soft:#5b6170; --line:#e4dccd; --chip:#f1ebdf; --ok:#1f7a4d;
  --okbg:#e3f3ea; --no:#a33a2c; --nobg:#fbe8e4; --mark:#fff1b8; --accent:#1d6fa5;
  --line2:#cdbfa6; --doing:#8a5300; --doingbg:#fff0cc;
  --shadow:0 1px 2px rgba(35,38,47,.05),0 6px 18px rgba(35,38,47,.07); --pop:0 12px 32px rgba(35,38,47,.18);
  --display:'Fraunces',Georgia,serif;
  --body:'MangoiHanSC','Nunito','Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17191f; --page:#20232b; --ink:#eceae4; --soft:#a9adb8; --line:#363a45; --chip:#2b2f39; --ok:#7fd3a6; --okbg:#1d3a2c; --no:#f2998c; --nobg:#40231f; --mark:#4a4116; --accent:#7cc0ea;
  --line2:#4a4f5c; --doing:#f5c45b; --doingbg:#3a2f12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17191f; --page:#20232b; --ink:#eceae4; --soft:#a9adb8; --line:#363a45; --chip:#2b2f39; --ok:#7fd3a6; --okbg:#1d3a2c; --no:#f2998c; --nobg:#40231f; --mark:#4a4116; --accent:#7cc0ea;
  --line2:#4a4f5c; --doing:#f5c45b; --doingbg:#3a2f12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --pop:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
/* 머리줄 한 줄: ← 뒤로 · 🏠 홈 · 로고+제목 · 읽는 순서 1-2-3 · 전체 진도(reading-ladder.js 가 채움) · 언어 */
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:12px}
/* ← 뒤로 · 🏠 홈 — 글자가 ← 로 시작해 back-nav.js 가 떠 있는 동그란 ← 를 따로 안 넣는다(hasVisibleBack). */
.nav{display:inline-flex;align-items:center;gap:4px;min-height:36px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:99px;padding:5px 14px;font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.nav:hover,.lang:hover{border-color:var(--soft)}
.nav:focus-visible,.lang:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.tag{display:block;margin-top:4px;font-size:12px;color:var(--soft)}
.flow{display:flex;align-items:center;gap:6px;list-style:none;margin:0 auto 0 0;padding:0}
.flow li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--soft);white-space:nowrap}
.flow li+li::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--line2)}
.flow .fn{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--doingbg);color:var(--doing);font-size:11px;font-weight:800}
.overall{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
.overall:empty{display:none}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}
.rl-meter{width:110px;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.rl-meter i{display:block;height:100%;border-radius:inherit;background:var(--ok)}
.lang{min-height:36px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:99px;padding:5px 14px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.book{display:flex;flex-direction:column;background:var(--page);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;overflow:hidden;color:inherit;text-decoration:none;min-width:0}
.book:hover{border-color:var(--c)}
.book:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.book img{display:block;width:100%;aspect-ratio:1024/687;object-fit:cover;background:var(--chip)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.no{font-size:12px;font-weight:800;color:var(--c)}
.bt{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.2}
.bs{font-size:14px;color:var(--soft)}
.prog{font-size:13px;font-weight:700;color:var(--soft)}
.prog.done{color:var(--ok)}
.foot{margin-top:22px;font-size:13px;color:var(--soft)}
/* ── 📋 고르기 화면(C안 · 2026-10-18 · js/reading-ladder.js) — 툴바 + 왼쪽 글 목록 + 오른쪽 상세, 스크롤 없이 한 장.
      html.rl-browse 일 때만 화면 높이에 꽉 차고(읽기·반복 연습은 예전처럼 아래로 스크롤), 단계 색은 데이터(--sc)가 준다. ── */
html.rl-browse,html.rl-browse body{height:100%}
html.rl-browse .wrap{height:100%;display:flex;flex-direction:column;max-width:1480px;padding-bottom:10px}
html.rl-browse #rlApp{flex:1;min-height:0;display:flex}
html.rl-browse .foot{flex:none;margin:8px 0 0;font-size:12px}
.rl-app{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;
  --sc-tint:var(--chip);--sc-soft:var(--line);--sc-line:var(--line2);--sc-ink:var(--ink);--sc-strong:var(--sc)}
/* color-mix 를 모르는 옛 브라우저는 위 단색으로 그린다(사용자 정의 속성은 «다시 선언» 으로는 되돌아가지 않아 @supports 로 가른다) */
@supports (color:color-mix(in srgb,red 50%,blue)){.rl-app{
  --sc-tint:color-mix(in srgb,var(--sc) 10%,var(--page));--sc-soft:color-mix(in srgb,var(--sc) 24%,var(--page));
  --sc-line:color-mix(in srgb,var(--sc) 45%,var(--line));--sc-ink:color-mix(in srgb,var(--sc) 72%,var(--ink));
  --sc-strong:color-mix(in srgb,var(--sc) 80%,#000)}}
.rl-tb{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rl-stair{display:flex;align-items:flex-end;gap:3px;height:36px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--page)}
.rl-stair button{width:12px;padding:0;border:0;border-radius:3px;background:var(--chip);cursor:pointer}
.rl-stair button:nth-child(1){height:25%}
.rl-stair button:nth-child(2){height:50%}
.rl-stair button:nth-child(3){height:75%}
.rl-stair button:nth-child(4){height:100%}
.rl-stair button.past{background:var(--sc);opacity:.38}
.rl-stair button[aria-pressed="true"]{background:var(--sc);opacity:1}
.rl-dd{position:relative}
.rl-dd>summary{list-style:none}
.rl-dd>summary::-webkit-details-marker{display:none}
.rl-dd-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--page);font-size:13px;white-space:nowrap;cursor:pointer;user-select:none}
.rl-dd-btn:hover,.rl-dd[open]>.rl-dd-btn{border-color:var(--line2)}
.rl-dd-btn svg{width:14px;height:14px;color:var(--soft)}
.rl-dd[open] .rl-chev{transform:rotate(180deg)}
.rl-dd-lab{font-size:12px;color:var(--soft)}
.rl-dd-val{font-weight:800}
.rl-dd-menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:100%;max-height:min(380px,60vh);overflow:auto;display:grid;gap:2px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--page);box-shadow:var(--pop)}
.rl-dd-right .rl-dd-menu{left:auto;right:0}
.rl-dd-cols .rl-dd-menu{grid-template-columns:repeat(2,minmax(0,1fr));min-width:300px}
.rl-dd-opt{display:flex;align-items:center;gap:10px;min-height:36px;border:0;background:none;padding:6px 10px;border-radius:8px;text-align:left;font:inherit;font-size:13px;color:var(--ink);white-space:nowrap;cursor:pointer;text-decoration:none}
.rl-dd-opt:hover,.rl-dd-opt[aria-checked="true"]{background:var(--chip)}
.rl-dd-opt[aria-checked="true"]{font-weight:800}
.rl-dd-opt small{margin-left:auto;padding-left:14px;font-size:11.5px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.rl-dd-opt em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--soft);margin-left:6px}
.rl-dd-item{min-width:330px;white-space:normal}
.rl-dd-tx{display:grid;gap:1px}
.rl-dd-tx small{margin:0;padding:0;font-weight:600}
.rl-sw{width:10px;height:10px;border-radius:3px;background:var(--sc);flex:none}
.rl-tb-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--page);color:var(--ink);font:inherit;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer}
.rl-tb-btn:hover{border-color:var(--line2)}
.rl-tb-next{background:var(--okbg);border-color:var(--ok)}
.rl-count{margin-left:auto;font-size:12.5px;color:var(--soft)}
.rl-count b{color:var(--ink);font-variant-numeric:tabular-nums}
.rl-split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:12px}
.rl-list{min-height:0;overflow:auto;display:grid;grid-template-rows:repeat(12,minmax(56px,1fr));gap:4px;padding:6px;border-radius:16px;border:1px solid var(--line);background:var(--page)}
.rl-item{display:grid;grid-template-columns:26px 64px minmax(0,1fr) auto 58px 20px;align-items:center;gap:10px;padding:3px 10px;border:0;border-radius:10px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-width:0}
.rl-item:hover{background:var(--chip)}
.rl-item.sel{background:var(--sc-tint);box-shadow:inset 0 0 0 1.5px var(--sc)}
.rl-thumb{position:relative;display:grid;place-items:center;width:64px;height:44px;border-radius:8px;overflow:hidden;background:var(--chip);font-size:24px}
.rl-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rl-thumb img[hidden]{display:none}
a.rl-item{text-decoration:none}
a.rl-item:hover .rl-tt b{text-decoration:underline}
.rl-no{font-size:13px;font-weight:800;color:var(--sc-ink);font-variant-numeric:tabular-nums}
.rl-tt{display:grid;min-width:0}
.rl-tt b{font-size:14px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-tt span{font-size:12px;line-height:1.25;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-topic{padding:2px 8px;border-radius:99px;background:var(--chip);font-size:11.5px;color:var(--ink);white-space:nowrap}
.rl-wc{font-size:12px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.rl-si{display:grid;place-items:center;flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2)}
.rl-si svg{width:11px;height:11px}
.rl-si.doing{border-color:var(--doing);background:conic-gradient(var(--doing) 0 50%,transparent 0) padding-box}
.rl-si.done{border-color:var(--ok);background:var(--ok);color:var(--page)}
.rl-empty{grid-row:1/-1;align-self:center;margin:0;padding:24px;text-align:center;font-size:13px;color:var(--soft)}
.rl-detail{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:20px;border:1px solid var(--sc-line);background:var(--page);box-shadow:var(--shadow)}
/* ⛔ 칸이 모자라면 안쪽 상자가 «줄어들지» 말고 상세 칸이 스크롤한다 — .rl-hero 는 overflow:hidden 이라 줄어들면 제목이 통째로 잘린다(2026-10-19 900×600 실측) */
.rl-detail>*{flex-shrink:0}
.rl-hero{position:relative;overflow:hidden;display:grid;gap:8px;padding:20px 22px;border-radius:14px;background:var(--sc-tint)}
.rl-hero-no{position:absolute;right:14px;bottom:-24px;font-family:var(--display);font-weight:800;font-size:120px;line-height:1;color:var(--sc-soft);pointer-events:none}
.rl-hero>:not(.rl-hero-no){position:relative}
.rl-hero-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rl-eyebrow{font-size:12px;font-weight:800;color:var(--sc-ink)}
.rl-hero h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.3vw,34px);line-height:1.15;text-wrap:balance;max-width:85%}
.rl-hero-ko{margin:-2px 0 0;font-size:15px;font-weight:700;color:var(--soft)}
.rl-facts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rl-facts>span{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:var(--page);font-size:12px;color:var(--ink)}
.rl-hero-bg{margin:0;max-width:92%;font-size:13px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rl-how{display:grid;gap:8px;padding:0 6px}
.rl-how h3{margin:0;font-size:12px;font-weight:800;color:var(--soft)}
.rl-how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rl-how li{display:grid;gap:5px;align-content:start;padding:12px;border-radius:12px;border:1px solid var(--line)}
.rl-how li.done{border-color:var(--ok);background:var(--okbg)}
.rl-hn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sc-strong);color:#fff;font-size:12px;font-weight:800}
.rl-how li.done .rl-hn{background:var(--ok);color:var(--page)}
.rl-hn svg{width:13px;height:13px}
.rl-how b{font-size:13.5px}
.rl-how p{margin:0;font-size:12.5px;color:var(--soft)}
.rl-foot{margin-top:auto;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:2px 6px}
.rl-prog{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:12px;color:var(--soft)}
.rl-dots{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:132px;flex:none}
.rl-dots i{height:8px;border-radius:3px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line)}
.rl-dots i.done{background:var(--ok);box-shadow:none}
.rl-dots i.doing{background:var(--doing);box-shadow:none}
/* 한 단계가 12편을 넘으면(2026-10-19 확장) 줄은 내용 높이로 쌓고 목록 칸 안에서 스크롤 · 진도 점은 작게 두 줄 */
.rl-list.rl-long{grid-template-rows:none;grid-auto-rows:minmax(56px,auto)}
.rl-dots.rl-many{grid-template-columns:repeat(24,1fr);gap:2px;width:168px}
.rl-dots.rl-many i{height:5px;border-radius:2px}
.rl-acts{display:flex;gap:8px;flex-wrap:wrap}
.rl-ghost{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--page);color:var(--ink);font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;text-decoration:none}
.rl-ghost:hover:not(:disabled){border-color:var(--line2)}
.rl-ghost:disabled{opacity:.45;cursor:default}
.rl-garr{display:none;font-size:20px;line-height:1}
.rl-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 22px;border:0;border-radius:99px;background:var(--sc-strong);color:#fff;font:inherit;font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.rl-cta:hover{filter:brightness(1.08)}
.rl-cta svg{width:12px;height:12px}
.rl-stchip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap;background:var(--page);color:var(--soft)}
.rl-stchip svg{width:11px;height:11px}
.rl-stchip.doing{background:var(--doingbg);color:var(--doing)}
.rl-stchip.done{background:var(--okbg);color:var(--ok)}
.rl-pic{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;border:1px solid var(--sc);vertical-align:2px}
.rl-stair button:focus-visible,.rl-dd-btn:focus-visible,.rl-dd-opt:focus-visible,.rl-tb-btn:focus-visible,.rl-item:focus-visible,.rl-ghost:focus-visible,.rl-cta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:1180px){
  .flow{display:none}
  .brand{margin-right:auto}
  .rl-split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rl-item{grid-template-columns:26px 64px minmax(0,1fr) 54px 20px}
  .rl-topic{display:none}
  /* «이렇게 읽어요» 3칸은 좁아도 나란히 — 세로로 쌓으면 상세 칸이 150~360px 넘쳐 한 장에 안 들어간다(2026-10-19 실측) */
  .rl-hero{padding:16px 18px}
  .rl-how li{padding:9px 10px}
  .rl-how p{font-size:12px}
}
/* 한 장 고정일 때만(아래 «폰·낮은 창» 은 쌓는다):
   ① 버튼 줄(이전·다음·읽기 시작)을 상세 칸 바닥에 붙인다 — 상세가 넘쳐도 «읽기 시작» 을 찾으러 내리지 않게.
   ② 실제 노트북 창 높이(1366×768 화면 → 창 약 640px · 1280×720 → 약 600px)에서 12편이 안쪽 스크롤 없이 다 보이게 줄 간격을 조인다.
      (2026-10-19 실측: 줄 최소 38px 이면 목록이 512px 필요한데 그 창들은 437~487px) */
@media (min-width:821px) and (min-height:561px){
  .rl-foot{position:sticky;bottom:-14px;margin:auto -14px -14px;padding:8px 20px 12px;background:var(--page);border-top:1px solid var(--line);z-index:1}
}
@media (min-width:821px) and (min-height:561px) and (max-height:719px){
  .rl-list{grid-template-rows:repeat(12,minmax(50px,1fr));gap:2px;padding:4px}
  .rl-item{padding:1px 10px}
  .rl-tt b{line-height:1.15}
  .rl-tt span{font-size:11.5px;line-height:1.2}
  .rl-detail{gap:6px}
  .rl-hero{padding:14px 18px;gap:6px}
  .rl-hero h2{font-size:clamp(20px,2.1vw,28px)}
  .rl-how{gap:5px}
  .rl-how li{padding:8px 10px;gap:3px}
  .rl-how p{font-size:12px;line-height:1.35}
}
/* 좁은 창(821~1100, 한 장 고정)에서 줄이 접히지 않게(2026-10-19 실측 — EN 900×600 은 도구 줄 2줄 · 버튼 줄 3줄이라 칸이 넘쳤다):
   ① 도구 줄: 계단 그림은 «단계» 드롭다운과 같은 일을 하므로 감춘다 · «단계»·«정렬» 이름표는 값만으로 뜻이 서므로 감춘다
      (⛔ «주제»·«상태» 이름표는 남긴다 — 둘 다 값이 «전체» 라 이름이 없으면 무엇의 전체인지 모른다)
      · «N / 12편» 숫자도 감춘다 — 거른 결과는 목록 줄 수로 보이고, 그것까지 두면 EN 2단계(그림 동화책 드롭다운)가 다시 두 줄이 된다
   ② 이전·다음 글은 화살표만 — 글자는 화면에서만 감추고 낭독기 이름으로 남긴다(display:none 이면 글자 이름이 사라지고 title 한 겹에만 기댄다) */
@media (min-width:821px) and (max-width:1100px) and (min-height:561px){
  .rl-tb>.rl-stair{display:none}
  .rl-dd-stage .rl-dd-lab,.rl-dd-sort .rl-dd-lab{display:none}
  .rl-tb>.rl-count{display:none}
  .rl-pn{position:relative;width:40px;padding:0;justify-content:center}
  .rl-pn .rl-garr{display:inline}
  .rl-pn .rl-gtx{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
}
/* 좁고 낮은 창(예: 900~1100 × 600~719)에서는 3칸의 설명 줄을 접는다 — 단계 이름은 남고, 읽기 화면이 단계마다 다시 설명한다 */
@media (min-width:821px) and (max-width:1100px) and (min-height:561px) and (max-height:719px){
  .rl-how p{display:none}
  .rl-hero-bg{-webkit-line-clamp:1}
}
/* 폰·낮은 창: 한 장에 안 들어가므로 목록 → 상세 순으로 아래로 쌓고 페이지가 스크롤한다 */
@media (max-width:820px),(max-height:560px){
  html.rl-browse,html.rl-browse body,html.rl-browse .wrap{height:auto}
  html.rl-browse #rlApp{display:block}
  .rl-split{grid-template-columns:1fr}
  .rl-list,.rl-detail{overflow:visible}
  .rl-list{grid-template-rows:none}
}
@media (max-width:640px){
  .rl-item{grid-template-columns:22px 52px minmax(0,1fr) 20px;gap:7px;padding:5px 6px}
  .rl-thumb{width:52px;height:36px}
  /* Let mobile book titles wrap in full instead of hiding their ending. */
  .rl-tt b,.rl-tt span{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  .rl-tt b{line-height:1.3}
  .rl-tt span{line-height:1.3}

  .rl-item .rl-wc{display:none}
  .rl-meter{display:none}
  .rl-tb{position:relative}
  .rl-dd{position:static}
  .rl-dd-menu,.rl-dd-right .rl-dd-menu{left:0;right:0;min-width:0}
  .rl-dd-cols .rl-dd-menu{min-width:0}
  .rl-dd-item{min-width:0}
  .rl-count{width:100%;margin-left:0}
  .rl-foot,.rl-acts{width:100%}
  .rl-acts .rl-cta{flex:1}
  .rl-hero{padding:16px}
}
.rl-btn{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--page);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none}
.rl-btn:hover{border-color:var(--soft)}
.rl-btn.rl-primary{background:var(--accent);border-color:var(--accent);color:var(--page)}
.rl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rl-badge{font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid var(--sc);color:var(--ink)}
.rl-pos{margin-left:auto;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.rl-read{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rl-read h2{font-family:var(--display);font-size:clamp(22px,4.5vw,30px);line-height:1.2;margin:0 0 4px;text-wrap:balance}
.rl-sub{margin:0 0 10px;color:var(--soft);font-size:14px}
.rl-bg{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.rl-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.rl-text{font-size:18px;line-height:1.8;margin:12px 0}
.rl-s{display:inline;padding:2px 3px;border-radius:6px;border:0;background:none;color:inherit;font:inherit;text-align:left}
.rl-text.pick .rl-s{cursor:pointer;background:var(--chip);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.rl-text.pick .rl-s:hover{background:var(--mark)}
.rl-s.ok{background:var(--okbg)!important;box-shadow:inset 0 -2px 0 var(--ok)}
.rl-s.no{background:var(--nobg)!important}
.rl-ko{display:block;font-size:14px;color:var(--soft);line-height:1.5;margin:0 0 6px}
.rl-text .rl-ko{font-size:14px}
.rl-words{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.rl-word{font-size:14px;padding:4px 10px;border-radius:99px;background:var(--chip)}
.rl-chiplab{font-size:12px;font-weight:800;color:var(--soft);margin-right:4px}
.rl-step{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rl-step.cur{border-color:var(--accent)}
.rl-step h3{margin:0 0 6px;font-size:17px}
.rl-q{margin:0 0 8px}
.rl-opts{display:grid;gap:8px}
.rl-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.rl-opt:hover:not([disabled]){border-color:var(--soft)}
.rl-opt[disabled]{cursor:default}
.rl-opt.ok{background:var(--okbg);border-color:var(--ok)}
.rl-opt.no{background:var(--nobg);border-color:var(--no)}
.rl-opt .rl-ko{margin:0}
.rl-fb{margin:8px 0;font-size:15px}
.rl-fb.ok{color:var(--ok);font-weight:700}
.rl-fb.no{color:var(--no);font-weight:700}
.rl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.rl-chip{font-size:14px;padding:3px 10px;border-radius:99px;border:1px dashed var(--soft)}
.rl-sum{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);resize:vertical}
.rl-model{padding:10px 12px;border-radius:12px;background:var(--mark);font-weight:700}
.rl-end{padding:14px 16px;border-radius:16px;background:var(--okbg);font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.rl-end.big{display:block;font-size:18px}
.rl-end.big p{font-weight:600;font-size:15px}
.rl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rl-btn:focus-visible,.rl-opt:focus-visible,.rl-s:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 🖥 큰 PC 화면은 통째로 키운다(2026-10-19 사장님 «글자가 너무 작아서 보기 힘들어 · PC 화면에 맞게 크게»).
   글자·버튼·칸을 같은 비율로 키워야 위의 배치가 안 깨지므로 .wrap 에 zoom 을 건다 — 동화책 4편(story-*.html)과 같은 방식.
   ① 읽기·반복 연습(아래로 스크롤): 폭만 본다 — 980px 칸 × zoom 이 화면 폭의 80% 안.
   ② 고르기 화면(html.rl-browse · 한 장 고정): 폭과 «높이» 를 함께 본다 — zoom 뒤 남는 칸이 1260×700 보다 작으면
      목록이 안쪽 스크롤되고(2026-10-19 실측: 높이 640 에서 12편이 35px 넘침) 영어 머리줄이 두 줄로 접히므로, 둘 다 맞는 가장 큰 단계를 쓴다.
   ⚠️ 1600px 아래(노트북 1366×640 · 1440×860 · 1280×600)는 어느 단계에도 안 걸린다 — 위의 노트북 맞춤을 그대로 둔다.
   ⚠️ 미디어쿼리는 «실제 창» 을 보므로 남는 칸이 위의 경계(1180·720)보다 커야 위 규칙들과 말이 맞는다 — 그래서 1260×700. */
@media (min-width:1400px){html:not(.rl-browse) .wrap{zoom:1.1}}
@media (min-width:1600px){html:not(.rl-browse) .wrap{zoom:1.2}}
@media (min-width:1900px){html:not(.rl-browse) .wrap{zoom:1.3}}
@media (min-width:2300px){html:not(.rl-browse) .wrap{zoom:1.6}}
@media (min-width:2800px){html:not(.rl-browse) .wrap{zoom:1.9}}
@media (min-width:3400px){html:not(.rl-browse) .wrap{zoom:2.3}}
@media (min-width:1600px) and (min-height:840px){html.rl-browse .wrap{zoom:1.2}}
@media (min-width:1640px) and (min-height:910px){html.rl-browse .wrap{zoom:1.3}}
@media (min-width:1765px) and (min-height:980px){html.rl-browse .wrap{zoom:1.4}}
@media (min-width:1890px) and (min-height:1050px){html.rl-browse .wrap{zoom:1.5}}
@media (min-width:2080px) and (min-height:1155px){html.rl-browse .wrap{zoom:1.65}}
@media (min-width:2270px) and (min-height:1260px){html.rl-browse .wrap{zoom:1.8}}
@media (min-width:2520px) and (min-height:1400px){html.rl-browse .wrap{zoom:2}}
@media (min-width:2835px) and (min-height:1575px){html.rl-browse .wrap{zoom:2.25}}
@media (min-width:3150px) and (min-height:1750px){html.rl-browse .wrap{zoom:2.5}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <a class="nav" id="backBtn" href="/" onclick="if(window.mangoiGoBack){event.preventDefault();window.mangoiGoBack();}">← <span data-ko="뒤로" data-en="Back">뒤로</span></a>
    <a class="nav" id="homeBtn" href="/">🏠 <span data-ko="홈" data-en="Home">홈</span></a>
    <div class="brand">
      <!-- 책 네 권을 쌓은 계단 = 4단계(색은 단계 색) -->
      <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
        <rect x="3" y="29" width="34" height="7" rx="2" fill="#2f9e44"/><rect x="7" y="21" width="28" height="7" rx="2" fill="#1971c2"/>
        <rect x="11" y="13" width="22" height="7" rx="2" fill="#e8590c"/><rect x="15" y="5" width="16" height="7" rx="2" fill="#862e9c"/>
        <path d="M31 32.5h3M30 24.5h2.5M28.5 16.5h2M27 8.5h2" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div><h1 data-ko="영어 독서" data-en="English Reading">영어 독서</h1>
        <span class="tag" data-ko="4단계 독서 사다리 · 이야기 180편 + 그림 동화책 4권" data-en="4-step reading ladder · 180 texts + 4 picture books">4단계 독서 사다리 · 이야기 180편 + 그림 동화책 4권</span></div>
    </div>
    <ol class="flow" aria-label="읽는 순서 / Reading steps">
      <li><span class="fn">1</span><span data-ko="핵심 문장" data-en="Key sentence">핵심 문장</span></li>
      <li><span class="fn">2</span><span data-ko="중심 내용" data-en="Main idea">중심 내용</span></li>
      <li><span class="fn">3</span><span data-ko="영어 한 문장" data-en="One English sentence">영어 한 문장</span></li>
    </ol>
    <div class="overall" id="rlOverall"></div>
    <a class="nav" href="/story-cover-gallery.html" data-ko="표지 갤러리" data-en="Cover gallery">표지 갤러리</a>
    <button type="button" class="lang" id="langBtn" aria-label="언어 전환 / Switch language">EN</button>
  </header>
  <!-- 📚 4단계 사다리(js/reading-ladder.js 가 그린다 — 고르기 화면 C안). 그림 동화책 4권은 2단계 툴바의 드롭다운에 있다. -->
  <div id="rlApp"></div>
  <!-- 사다리 스크립트를 못 받으면 예전처럼 그림 동화책 목록만 보인다(reading-ladder.js 가 돌면 이 칸을 감춘다). -->
  <div id="booksWrap"><div class="grid" id="books"></div></div>
  <p class="foot" data-ko="진행 기록·도장은 이 기기에 저장됩니다. 포인트는 그림 동화책만, 하루 2권까지 받을 수 있어요." data-en="Progress and stamps are saved on this device. Points are for picture books only, up to 2 books a day.">진행 기록·도장은 이 기기에 저장됩니다. 포인트는 그림 동화책만, 하루 2권까지 받을 수 있어요.</p>
</div>
<script>
(function(){
  // 📚 책 목록 정본 — 새 책을 만들면 여기 한 줄 + 학생 메뉴는 그대로(이 화면 하나로 갑니다).
  var BOOKS = [
    { id:'red-umbrella',  no:1, c:'#c8372d', title:'The Red Umbrella',
      ko:'버스 정류장 의자 밑 빨간 우산, 비 오기 전에 주인을 찾아 줄까?', en:'A red umbrella under the bench — can they return it before the rain?' },
    { id:'birthday-cake', no:2, c:'#c2410c', title:'The Missing Birthday Cake',
      ko:'생일 케이크가 사라졌다! 단서를 따라 범인을 찾아라.', en:'The birthday cake is gone! Follow the clues to find who took it.' },
    { id:'robot-dance',   no:3, c:'#1d6fa5', title:'Bolt Can Dance',
      ko:'춤을 못 추는 로봇 볼트, 자기만의 춤을 찾을 수 있을까?', en:'Bolt the robot can’t dance — can he find a dance of his own?' },
    { id:'treasure-map',  no:4, c:'#7a4fb0', title:'The Map in the Library Book',
      ko:'도서관 책 속에서 나온 오래된 지도, 보물은 어디에?', en:'An old map falls out of a library book. Where is the treasure?' }
  ];
  var STAMPS = ['read','key','sum','words','infer','write'];
  var lang = 'ko';
  try { lang = localStorage.getItem('story_lang') || 'ko'; } catch(e){}

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function stampCount(id){
    var st = {};
    try { st = JSON.parse(localStorage.getItem('story_' + id + '_stamps') || '{}') || {}; } catch(e){ st = {}; }
    return STAMPS.filter(function(k){ return !!st[k]; }).length;
  }
  function booksHtml(){
    var en = lang === 'en';
    return BOOKS.map(function(b){
      var n = stampCount(b.id);
      var prog = n >= 6 ? (en ? '🎉 Finished (6/6)' : '🎉 완주 (6/6)')
               : n > 0 ? (en ? '🏅 Stamps ' + n + ' / 6' : '🏅 도장 ' + n + ' / 6')
               : (en ? 'Not started' : '아직 안 읽었어요');
      return '<a class="book" style="--c:' + b.c + '" href="/story-' + b.id + '.html">' +
        '<img src="/img/story/' + b.id + '-cover.webp" alt="' + esc(b.title) + '" loading="lazy" decoding="async">' +
        '<div class="bd"><span class="no">Story ' + b.no + '</span>' +
        '<span class="bt">' + esc(b.title) + '</span>' +
        '<span class="bs">' + esc(en ? b.en : b.ko) + '</span>' +
        '<span class="prog' + (n >= 6 ? ' done' : '') + '">' + prog + '</span></div></a>';
    }).join('');
  }
  function render(){ document.getElementById('books').innerHTML = booksHtml(); }
  // 📚 사다리(js/reading-ladder.js)가 2단계 안에 같은 책 목록을 그리고, 이 화면의 언어를 따른다.
  window.__storyBooksHtml = booksHtml;
  // 📋 «단계별 한눈에» 가 2단계 안에 그림책을 한 줄씩 그릴 때 쓴다(도장 수 n 포함).
  window.__storyBookList = function(){ return BOOKS.map(function(b){ return { id:b.id, no:b.no, title:b.title, ko:b.ko, en:b.en, n:stampCount(b.id) }; }); };
  window.__storyLang = function(){ return lang; };
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-ko]').forEach(function(el){ el.textContent = el.getAttribute(lang === 'en' ? 'data-en' : 'data-ko'); });
    document.getElementById('langBtn').textContent = lang === 'en' ? 'KO' : 'EN';
    render();
    try { window.dispatchEvent(new Event('story:lang')); } catch(e){}
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('story_lang', lang); } catch(e){}
    applyLang();
  });
  // 책에서 돌아왔을 때 도장 수가 바로 바뀌게(뒤로가기 캐시 포함)
  window.addEventListener('pageshow', function(){ render(); });
  applyLang();
})();
</script>
