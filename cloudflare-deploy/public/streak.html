<!doctype html>
<html lang="ko">
<head>






  <meta charset="utf-8" />
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🔥 데일리 스트릭 — mangoi.ai</title>
  <link rel="icon" href="/mangoi-favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a1530" />
  <script src="/js/mango-i18n.js" defer></script>
<script src="/js/session-guard.js" defer></script>
  <style>
    :root {
      --bg: #0a1530; --card: #14213b; --text: #e6ecff; --text2: #a3b3d1;
      --gold: #fbbf24; --gold2: #f59e0b; --border: rgba(251,191,36,0.18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: MangoiHanSC,-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      line-height: 1.55; }
    .top { display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      background: rgba(20, 33, 59, 0.95); position: sticky; top: 0; z-index: 50;
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .top a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; }
    .top h1 { margin: 0; font-size: 16px; font-weight: 800; flex: 1; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 18px; }
    .hero { background: linear-gradient(135deg, #f97316, #fb923c, #fbbf24);
      border-radius: 18px; padding: 28px 24px; text-align: center; margin-bottom: 18px;
      box-shadow: 0 12px 32px -8px rgba(249, 115, 22, 0.4); color: #1f1505; }
    .hero .flame { font-size: 64px; line-height: 1; }
    .hero .streak-num { font-size: 56px; font-weight: 900; margin: 6px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.15); }
    .hero .streak-label { font-size: 14px; font-weight: 700; opacity: 0.85; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; text-align: center; }
    .stat-val { font-size: 28px; font-weight: 900; color: var(--gold); }
    .stat-lbl { font-size: 12px; color: var(--text2); font-weight: 600; margin-top: 4px; }
    .check-btn { display: block; width: 100%; padding: 18px; margin: 18px 0;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706); color: #1a1a1a;
      border: 0; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 18px -2px rgba(245, 158, 11, 0.45); }
    .check-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .check-btn:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
    .milestones { background: var(--card); border-radius: 14px; padding: 16px;
      border: 1px solid var(--border); margin-bottom: 14px; }
    .milestones h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--gold); }
    .ms-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px dashed rgba(251,191,36,0.1); }
    .ms-row:last-child { border-bottom: 0; }
    .ms-row .ms-icon { font-size: 20px; }
    .ms-row .ms-name { flex: 1; font-size: 13px; font-weight: 700; }
    .ms-row .ms-gem { font-size: 13px; color: var(--gold); font-weight: 800; }
    /* 보너스는 «한 번» 이 아니라 그 단계부터 «매일» 붙는다(api-games-streak.ts) — 지운 줄처럼 보이면 안 된다 */
    .ms-row.done .ms-name::after { content: ' ✓'; color: #10b981; }
    .ms-note { margin: 10px 0 0; font-size: 12px; color: var(--text2); line-height: 1.6; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981, #059669); color: #fff;
      padding: 14px 22px; border-radius: 12px; font-weight: 700; font-size: 14px;
      box-shadow: 0 8px 24px -4px rgba(16,185,129,0.5); z-index: 100;
      opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    .leaders { margin-top: 18px; }
    .leaders h3 { font-size: 14px; color: var(--gold); margin: 0 0 10px 0; }
    .leader-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }
    .leader-rank { width: 28px; height: 28px; border-radius: 50%;
      background: rgba(251,191,36,0.18); color: var(--gold);
      display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
    .leader-uid { flex: 1; font-size: 13px; font-weight: 700; }
    .leader-streak { font-size: 13px; color: #fb923c; font-weight: 800; }
  </style>
</head>
<body>
  <div class="top">
    <a href="/">← <span data-ko="홈" data-en="Home">홈</span></a>
    <h1 data-ko="🔥 데일리 스트릭" data-en="🔥 Daily Streak">🔥 데일리 스트릭</h1>
  </div>
  <div class="wrap">
    <div class="hero">
      <div class="flame">🔥</div>
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label" id="streakLbl" data-ko="연속 출석일" data-en="Day Streak">연속 출석일</div>
    </div>

    <div class="stat-grid">
      <div class="stat">
        <div class="stat-val" id="gems">0</div>
        <div class="stat-lbl">💎 <span data-ko="보유 보석" data-en="Gems">보유 보석</span></div>
      </div>
      <div class="stat">
        <div class="stat-val" id="longest">0</div>
        <div class="stat-lbl">🏆 <span data-ko="최장 기록" data-en="Best Streak">최장 기록</span></div>
      </div>
    </div>

    <button class="check-btn" id="checkBtn" onclick="checkIn()">
      ✅ <span data-ko="오늘 출석 체크" data-en="Check in today">오늘 출석 체크</span>
    </button>

    <div class="milestones">
      <h3>🎁 <span data-ko="출석 보석 (매일)" data-en="Daily check-in gems">출석 보석 (매일)</span></h3>
      <div class="ms-row"><span class="ms-icon">✅</span><span class="ms-name" data-ko="출석할 때마다" data-en="Every check-in">출석할 때마다</span><span class="ms-gem">+10💎</span></div>
      <div class="ms-row" id="ms3"><span class="ms-icon">💪</span><span class="ms-name" data-ko="3일째부터 매일 보너스" data-en="Daily bonus from day 3">3일째부터 매일 보너스</span><span class="ms-gem">+5💎</span></div>
      <div class="ms-row" id="ms7"><span class="ms-icon">✨</span><span class="ms-name" data-ko="7일째부터 매일 보너스" data-en="Daily bonus from day 7">7일째부터 매일 보너스</span><span class="ms-gem">+20💎</span></div>
      <div class="ms-row" id="ms14"><span class="ms-icon">🔥</span><span class="ms-name" data-ko="14일째부터 매일 보너스" data-en="Daily bonus from day 14">14일째부터 매일 보너스</span><span class="ms-gem">+30💎</span></div>
      <div class="ms-row" id="ms30"><span class="ms-icon">🏆</span><span class="ms-name" data-ko="30일째부터 매일 보너스" data-en="Daily bonus from day 30">30일째부터 매일 보너스</span><span class="ms-gem">+50💎</span></div>
      <p class="ms-note" data-ko="💡 보석은 연속 출석 기록이에요. 포인트(P)와 따로 쌓이며, 포인트상점에서는 쓰지 않아요." data-en="💡 Gems record your check-in streak. They are separate from points (P) and are not spent in the Point Shop.">💡 보석은 연속 출석 기록이에요. 포인트(P)와 따로 쌓이며, 포인트상점에서는 쓰지 않아요.</p>
    </div>

    <div class="leaders">
      <h3>🏅 <span data-ko="연속 출석 순위 (전체 기간)" data-en="Streak ranking (all time)">연속 출석 순위 (전체 기간)</span></h3>
      <div id="leaderList"><div style="color:var(--text2);font-size:13px;padding:12px">불러오는 중…</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* 🔴 (2026-09-09) 예전엔 mango_user.user_id 하나만 봤는데, 로그인 동기화가 실제로
       저장하는 모양은 {uid,name,role} — user_id 칸이 없다. 그래서 로그인 학생도 매번
       «게스트» 로 떨어졌고, 게다가 그 게스트 id 를 저장하지 않고 «호출마다 새 난수»
       였다 — 연속 기록이 원리상 이어질 수 없었다. mangoi_logged_user 를 먼저 보고,
       게스트 id 도 `mangoi_guest_uid` 에 고정한다.
       ⚠️ 게스트 id «키» 는 화면마다 갈려 있습니다(실측) — 여기·ai-write·micro-quiz·tetris 는
          `mangoi_guest_uid`, review-quiz 는 `rq_guest_id`, vocab 은 서버 서명 `mango_guest_id`,
          warmup 은 게스트 id 를 «아예 안 만듭니다». 통일돼 있다고 적지 마세요. */
    function getUid() {
      try {
        const a = JSON.parse(localStorage.getItem('mangoi_logged_user') || 'null');
        if (a && (a.uid || a.user_id || a.id)) return a.uid || a.user_id || a.id;
      } catch(e){}
      try {
        const u = JSON.parse(localStorage.getItem('mango_user') || 'null');
        if (u && (u.user_id || u.uid || u.id)) return u.user_id || u.uid || u.id;
      } catch(e){}
      // 비로그인 상태도 게스트로 동작 — 호출마다 바뀌면 연속 기록이 이어지지 않으므로 고정 저장
      try {
        let g = localStorage.getItem('mangoi_guest_uid');
        if (!g) { g = 'guest_' + Math.random().toString(36).slice(2, 8); localStorage.setItem('mangoi_guest_uid', g); }
        return g;
      } catch(e){}
      return 'guest_' + (Math.random().toString(36).slice(2, 8));
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    function updateMilestones(streak) {
      // 서버는 보너스를 «가장 높은 단계 하나» 만 준다(else-if) — 지금 받는 단계에만 ✓
      const now = [30, 14, 7, 3].find((n) => streak >= n);
      [['ms3', 3], ['ms7', 7], ['ms14', 14], ['ms30', 30]].forEach(([id, n]) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('done', n === now);
      });
    }
    async function loadStatus() {
      const uid = getUid();
      try {
        const r = await fetch('/api/streak/status?uid=' + encodeURIComponent(uid) + '&token=' + encodeURIComponent((function(){ try { return localStorage.getItem('mango_token')||''; } catch(e){ return ''; } })()));
        const d = await r.json();
        if (d.ok) {
          document.getElementById('streakNum').textContent = d.current_streak || 0;
          document.getElementById('gems').textContent = d.gems || 0;
          document.getElementById('longest').textContent = d.longest_streak || 0;
          updateMilestones(d.current_streak || 0);
          const btn = document.getElementById('checkBtn');
          if (d.checked_today) {
            btn.disabled = true;
            btn.innerHTML = '✓ 오늘 출석 완료';
          }
        }
      } catch(e){ console.error(e); }
    }
    async function loadLeaderboard() {
      try {
        // 서버는 아이디를 주지 않는다(이름·me 만) — 본인 표시용으로 내 uid 만 보낸다
        const r = await fetch('/api/streak/leaderboard?uid=' + encodeURIComponent(getUid()));
        const d = await r.json();
        const wrap = document.getElementById('leaderList');
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const en = (function(){ try { return localStorage.getItem('mangoi_lang') === 'en'; } catch(e){ return false; } })();
        const t = (ko, eng) => `<span data-ko="${ko}" data-en="${eng}">${en ? eng : ko}</span>`;
        if (d.ok && d.items.length) {
          wrap.innerHTML = d.items.slice(0, 10).map((it, i) =>
            `<div class="leader-row">
              <span class="leader-rank">${i+1}</span>
              <span class="leader-uid">${it.student_name ? esc(it.student_name) : t('학생', 'Student')}${it.me ? ' ' + t('(나)', '(me)') : ''}</span>
              <span class="leader-streak">🔥 ${Number(it.current_streak) || 0}${t('일', 'd')}</span>
            </div>`).join('');
        } else {
          wrap.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:12px">아직 데이터가 없어요. 출석 체크로 시작해보세요!</div>';
        }
      } catch(e){ console.error(e); }
    }
    async function checkIn() {
      const uid = getUid();
      const btn = document.getElementById('checkBtn');
      btn.disabled = true; btn.innerHTML = '⏳ 처리 중…';
      try {
        const r = await fetch('/api/streak/check-in', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          // 🔐 실계정은 mango_token 으로 본인 확인(서버 IDOR 가드). 게스트는 토큰 불필요.
          body: JSON.stringify({ uid, token: (function(){ try { return localStorage.getItem('mango_token')||''; } catch(e){ return ''; } })() })
        });
        const d = await r.json();
        if (d.ok) {
          if (d.already_today) {
            showToast('오늘 이미 출석했습니다');
            btn.innerHTML = '✓ 오늘 출석 완료';
          } else {
            showToast(d.bonus_msg + ' (총 💎 ' + d.gems + ')');
            btn.innerHTML = '✓ 출석 완료!';
          }
          await loadStatus();
        } else if (d.error === 'auth_required') {
          // 토큰 없는 옛 세션 — 게스트로 몰래 기록하면 진짜 스트릭이 안 쌓이므로 정직하게 재로그인 안내
          alert('로그인 정보가 만료됐어요. 홈에서 다시 로그인한 뒤 출석해주세요!');
          btn.disabled = false; btn.innerHTML = '✅ 오늘 출석 체크';
        } else {
          alert('오류: ' + (d.error || 'unknown'));
          btn.disabled = false; btn.innerHTML = '✅ 오늘 출석 체크';
        }
      } catch(e){
        alert('네트워크 오류'); btn.disabled = false;
      }
    }
    loadStatus(); loadLeaderboard();
  </script>
