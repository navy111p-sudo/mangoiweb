<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>망고아이 문법 피자 마스터</title>
<style>
  :root{
    --wood-1:#8c5a2b; --wood-2:#7a4a20; --wood-3:#9c6a35;
    --mango-orange:#ff9800; --mango-deep:#f57c00; --mango-yellow:#ffc107;
    --ok:#4caf50; --bad:#e53935;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{
    /* 한/영/중 모든 텍스트가 같은 폰트 스택을 쓰도록 통일 (중국어 포함) */
    font-family:MangoiHanSC,'Pretendard','Malgun Gothic',sans-serif; color:#3d2405;
    display:flex; flex-direction:column; align-items:center;
    padding:10px 10px 30px; overflow-x:hidden;
    /* 주방 배경(위: 흐린 주방 보케) + 아래: 원목 테이블 */
    background:
      radial-gradient(220px 140px at 12% 6%, rgba(255,236,200,.55), transparent 70%),
      radial-gradient(260px 160px at 85% 4%, rgba(255,210,150,.45), transparent 70%),
      radial-gradient(200px 130px at 55% 10%, rgba(255,255,235,.35), transparent 70%),
      linear-gradient(180deg, #d9b98c 0%, #cfa671 16%, #b98a52 30%, #a5713a 46%, #96622e 100%);
    background-attachment:fixed;
  }
  /* 원목 널빤지 결 */
  body::before{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      repeating-linear-gradient(90deg, rgba(90,50,10,.14) 0 2px, transparent 2px 120px),
      repeating-linear-gradient(0deg, rgba(255,235,200,.05) 0 3px, rgba(80,40,5,.05) 3px 6px);
  }

  header{width:100%; max-width:860px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  h1{
    margin:2px 0; font-size:1.25em; color:#fff8ec;
    text-shadow:0 2px 4px rgba(80,40,0,.6);
  }
  #hud{display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
  .hud-chip{
    background:rgba(255,252,244,.94); border:2px solid #e2b56b; border-radius:12px;
    padding:4px 12px; font-weight:800; font-size:.86em; color:#7a4a12;
    box-shadow:0 3px 8px rgba(60,30,0,.3); text-align:center; line-height:1.15;
  }
  .hud-chip small{display:block; font-size:.66em; font-weight:700; color:#b07f38;}
  #time-chip span{color:#d32f2f; font-size:1.12em;}
  #btn-hint{
    border:none; border-radius:12px; padding:8px 14px; cursor:pointer;
    background:linear-gradient(180deg,#fff3cf,#ffd97a); color:#7a4a12;
    font-weight:900; font-size:.88em; font-family:inherit; border:2px solid #e2b56b;
    box-shadow:0 3px 8px rgba(60,30,0,.3);
  }

  /* ── 유리 미션 패널 ─────────────────────── */
  #mission-glass{
    width:100%; max-width:860px; margin:8px 0 4px; text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.6));
    border:1px solid rgba(255,255,255,.9); border-radius:14px;
    box-shadow:0 6px 18px rgba(60,30,0,.35), inset 0 1px 0 #fff;
    padding:10px 14px; backdrop-filter:blur(2px);
  }
  #sentence-display{font-size:clamp(1.05em, 3.4vw, 1.5em); font-weight:800; font-family:inherit; color:#2d1a04; letter-spacing:.01em;}
  #ko-hint{font-size:.85em; color:#8a5a1a; font-weight:700; margin-top:2px;}
  #lessonNav{width:100%; max-width:860px;}

  #status{
    width:100%; max-width:860px; text-align:center; margin:4px 0;
    color:#fff3dd; font-weight:800; font-size:.92em;
    text-shadow:0 2px 4px rgba(70,35,0,.7);
  }

  /* ── 나무 도마 + 실사 도우 ──────────────── */
  #board-wrap{position:relative; margin:6px 0 2px; filter:drop-shadow(0 14px 18px rgba(50,25,0,.45));}
  #paddle{
    position:relative;
    width:min(400px,92vw); height:min(400px,92vw);
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #b98a52 0%, #a06a33 55%, #8a5626 100%);
    box-shadow:inset 0 0 0 6px rgba(120,70,25,.55), inset 0 0 34px rgba(60,30,5,.5);
  }
  #paddle::before{ /* 도마 손잡이 */
    content:''; position:absolute; right:-13%; top:50%;
    width:34%; height:16%; transform:translateY(-50%) rotate(-8deg);
    background:linear-gradient(180deg,#a5713a,#8a5626);
    border-radius:40px; z-index:-1;
    box-shadow:inset 0 3px 6px rgba(255,220,170,.35), inset 0 -4px 8px rgba(50,25,0,.4);
  }
  #paddle::after{ /* 손잡이 구멍 */
    content:''; position:absolute; right:-9%; top:50%; transform:translateY(-50%);
    width:5.5%; height:5.5%; border-radius:50%; background:#6d4218;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.5); z-index:0;
  }
  #pizza{
    position:absolute; inset:4.5%;
    transition:filter 1.1s ease, transform .5s;
  }
  #pizza img.dough{width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none;}
  #pizza img.sauce-base{
    position:absolute; left:14%; top:15%; width:72%; height:70%;
    object-fit:fill; opacity:0; transition:opacity .8s; border-radius:50%;
    filter:saturate(1.05);
  }
  #pizza.saucy img.sauce-base{opacity:.96;}
  #pizza.baked{filter:sepia(.32) saturate(1.25) brightness(.95) contrast(1.05); transform:scale(1.015);}
  /* 🔥 완성: 실사 구운 피자 사진으로 크로스페이드 */
  #pizza img.baked-photo{
    position:absolute; inset:-2%; width:104%; height:104%; object-fit:contain;
    opacity:0; transition:opacity .9s ease; z-index:5; pointer-events:none;
    user-select:none; -webkit-user-drag:none;
  }
  #pizza.served img.baked-photo{opacity:1;}
  #pizza.served{animation:servedPulse 1s ease; filter:none;}
  /* 완성 피자 이름 배지 */
  #pizza-name{
    position:absolute; left:50%; bottom:-4%; transform:translateX(-50%) scale(0);
    z-index:7; white-space:nowrap; pointer-events:none;
    background:linear-gradient(180deg,#fffdf6,#ffe9b8); color:#7a3a00;
    font-weight:900; font-size:clamp(.85em,3vw,1.1em); padding:6px 18px;
    border-radius:20px; border:3px solid var(--mango-yellow);
    box-shadow:0 6px 16px rgba(60,25,0,.45);
    transition:transform .35s cubic-bezier(.2,1.5,.4,1);
  }
  #pizza-name.show{transform:translateX(-50%) scale(1);}
  @keyframes servedPulse{0%{transform:scale(.96);}55%{transform:scale(1.06);}100%{transform:scale(1.015);}}
  #toppings-layer{position:absolute; inset:0; pointer-events:none;}
  .top-sprite{
    position:absolute; transform:translate(-50%,-50%) rotate(var(--rot)) scale(0);
    animation:drop .45s cubic-bezier(.2,1.6,.4,1) forwards;
    filter:drop-shadow(0 3px 3px rgba(60,20,0,.35));
    user-select:none; -webkit-user-drag:none;
  }
  @keyframes drop{
    0%{transform:translate(-50%,-160%) rotate(var(--rot)) scale(1.25); opacity:.4;}
    100%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1); opacity:1;}
  }
  .word-chip{
    position:absolute; transform:translate(-50%,-50%);
    background:rgba(255,255,255,.93); border-radius:12px; padding:2px 9px 3px;
    font-weight:800; font-size:clamp(.72em,2.6vw,.95em); font-family:inherit; color:#2d1a04;
    box-shadow:0 2px 6px rgba(60,25,0,.4); border:1.5px solid rgba(210,160,90,.8);
    animation:chipin .3s ease-out; white-space:nowrap;
  }
  .word-chip small{
    display:block; text-align:center; font-size:.62em; font-weight:800;
    margin-top:-1px; line-height:1.1;
  }
  @keyframes chipin{from{transform:translate(-50%,-50%) scale(.3); opacity:0;}}
  #board-wrap.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-9px);}75%{transform:translateX(9px);}}

  /* ── 스테인리스 트레이 + 재료 볼 ─────────── */
  #tray{
    width:100%; max-width:860px; margin-top:14px;
    background:linear-gradient(180deg,#e8e8ea 0%, #c9cbd0 30%, #a9adb5 70%, #8f939c 100%);
    border-radius:18px; padding:14px 10px 12px;
    box-shadow:inset 0 3px 8px rgba(255,255,255,.8), inset 0 -6px 12px rgba(40,45,55,.45), 0 10px 20px rgba(50,25,0,.45);
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px; min-height:112px;
  }
  #tray:empty::after{content:'모든 재료를 올렸어요! 🔥 굽는 중...'; color:#5a5f68; font-weight:800; font-size:.9em; align-self:center;}
  .bowl{
    width:96px; cursor:pointer; text-align:center; user-select:none;
    transition:transform .15s;
  }
  .bowl:active{transform:scale(.93);}
  .bowl .dish{
    width:88px; height:88px; margin:0 auto; border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%, #ffffff 0%, #e9eaee 34%, #b9bcc4 62%, #83878f 88%, #6e727b 100%);
    box-shadow:inset 0 4px 8px rgba(255,255,255,.9), inset 0 -6px 10px rgba(40,45,55,.5), 0 4px 8px rgba(30,20,5,.4);
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .bowl .dish img{
    max-width:68%; max-height:68%; object-fit:contain;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));
    pointer-events:none; -webkit-user-drag:none;
  }
  .bowl .dish .w{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-weight:800; font-size:1.02em; font-family:inherit; color:#1c1002;
    text-shadow:0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff, 0 2px 5px rgba(255,255,255,.9);
    pointer-events:none; white-space:nowrap;
  }
  .bowl .role{
    display:inline-block; margin-top:4px; font-size:.62em; font-weight:800;
    padding:1px 9px; border-radius:8px; color:#fff; letter-spacing:.02em;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  /* 문법 성분 색 */
  .r-subject{background:#e53935;} .r-verb{background:#f57c00;}
  .r-object{background:#43a047;}  .r-article{background:#8d6e63;}
  .r-prep{background:#1e88e5;}    .r-noun{background:#c0a000;}
  .r-adj{background:#ab47bc;}     .r-adv{background:#00897b;}
  .r-comp{background:#5c6bc0;}    .r-aux{background:#fb8c00;}
  .r-inf{background:#7e57c2;}     .r-word{background:#78909c;}

  /* 🏷️ 문법 성분 힌트 가리기 — 재료 볼·피자 위 단어 칩의 성분 배지를 통째로 숨긴다
     (원장님 제안 2026-08-13: 중·고급은 태그 맞추기 꼼수 방지를 위해 가리기 기본) */
  body.roles-off .role{display:none !important;}
  #btn-roles{
    border:2px solid #e2b56b; background:#fff3cf; color:#7a4a12;
    border-radius:12px; padding:4px 12px; font-family:inherit; font-weight:800;
    font-size:.95em; cursor:pointer;
  }
  #btn-roles.off{background:#efe7d8; color:#a08a60; border-color:#cbbc9e;}

  /* ── ▶ 시작 전 듣기 오버레이 ─────────────── */
  #ready{
    position:fixed; inset:0; z-index:45; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(45,22,0,.55);
  }
  #ready.show{display:flex;}
  #ready-card{
    background:linear-gradient(180deg,#fffdf6,#fff3da); border-radius:20px;
    max-width:440px; width:100%; padding:22px 18px; text-align:center;
    border:4px solid var(--mango-yellow); box-shadow:0 14px 40px rgba(0,0,0,.45);
    animation:pop .3s;
  }
  #ready-card .head{font-size:1em; font-weight:900; color:var(--mango-deep);}
  #ready-card .sent{font-size:1.25em; font-weight:800; color:#4a2a06; margin:10px 0 4px;}
  #ready-card .ko{font-size:.88em; color:#9a6a20; font-weight:700; margin-bottom:14px;}

  /* ── 듣기·말하기 미션 오버레이 ───────────── */
  #mission{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:center; justify-content:center; padding:16px;
    background:rgba(45,22,0,.55);
  }
  #mission.show{display:flex;}
  #mission-card{
    background:linear-gradient(180deg,#fffdf6,#fff3da); border-radius:20px;
    max-width:440px; width:100%; padding:20px 18px; text-align:center;
    border:4px solid var(--mango-yellow); box-shadow:0 14px 40px rgba(0,0,0,.45);
    animation:pop .3s;
  }
  @keyframes pop{from{transform:scale(.88); opacity:0;} to{transform:scale(1); opacity:1;}}
  #mission-card .head{font-size:1em; font-weight:900; color:var(--mango-deep);}
  #mission-card .sent{font-size:1.18em; font-weight:900; color:#4a2a06; margin:8px 0 2px;}
  #mission-card .py{font-size:.85em; color:#9a6a20; margin-bottom:6px;}
  .mission-row{display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; margin:10px 0;}
  .big-btn{
    border:none; border-radius:14px; padding:12px 22px; font-size:1em;
    font-weight:900; cursor:pointer; color:#fff; font-family:inherit;
    background:linear-gradient(180deg,var(--mango-orange),var(--mango-deep));
    box-shadow:0 3px 0 #c05f00; transition:transform .1s;
  }
  .big-btn:active{transform:translateY(2px); box-shadow:none;}
  .big-btn:disabled{opacity:.45; cursor:not-allowed;}
  .big-btn.green{background:linear-gradient(180deg,#66bb6a,#43a047); box-shadow:0 3px 0 #2e7d32;}
  .dots{display:flex; gap:6px; justify-content:center; margin-top:4px;}
  .dot{width:14px; height:14px; border-radius:50%; background:#ffe0a3; border:2px solid #e8a13c;}
  .dot.on{background:var(--ok); border-color:#2e7d32;}
  #speech-result{font-size:.85em; color:#8a6a30; min-height:1.3em; margin-top:4px;}

  #mission-card{max-height:calc(100dvh - 32px);overflow-y:auto;}
  #mission-card .sent,#speech-result{overflow-wrap:anywhere;}
  .voice-option{font:inherit;font-size:.82em;min-height:44px;padding:8px 12px;border:1px solid #b88a43;border-radius:10px;background:#fff9eb;color:#734512;cursor:pointer;}
  .voice-option:disabled{opacity:.5;cursor:not-allowed;}
  #btn-speak[aria-pressed="true"]{background:#c64b20;box-shadow:0 3px 0 #823214;}

  /* ── 문법 힌트 팝업 ─────────────────────── */
  #hint-overlay{
    position:fixed; inset:0; background:rgba(45,22,0,.55);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  #hint-overlay.show{display:flex;}
  #hint-card{
    background:#fffdf6; border-radius:20px; max-width:430px; width:100%;
    border:4px solid var(--mango-yellow); padding:22px 20px; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4); animation:pop .25s;
  }
  #hint-card h3{margin:0 0 8px; color:#c05f00; font-size:1.1em;}
  #hint-card .badge{
    display:inline-block; background:var(--mango-orange); color:#fff;
    font-size:.72em; font-weight:900; border-radius:10px; padding:3px 12px; margin-bottom:8px;
  }
  #hint-body{font-size:.92em; line-height:1.6; color:#6b4a12; white-space:pre-line;}
  #hint-order{
    margin-top:10px; background:#fff3d6; border-radius:12px; padding:8px;
    font-weight:900; color:var(--mango-deep); font-size:.9em;
  }

  #toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(45,22,0,.92); color:#ffe9c4; padding:10px 22px; border-radius:24px;
    font-weight:800; font-size:.9em; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:60; white-space:nowrap;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .burst{position:fixed; font-size:1.6em; pointer-events:none; z-index:70; animation:fly 1.1s ease-out forwards;}
  @keyframes fly{from{transform:translate(0,0) scale(1); opacity:1;} to{transform:translate(var(--dx),var(--dy)) scale(.4); opacity:0;}}

  /* 📚 lesson-nav(공용 다크 테마) → 밝은 우드 배경 가독성 오버라이드
     lesson-nav.js가 자기 스타일을 나중에 head에 넣으므로 !important 필수 */
  .lnav-book label{color:#fff3dd !important; text-shadow:0 1px 3px rgba(70,35,0,.7);}
  .lnav-sel{background:#fffdf6 !important; color:#4a2a06 !important; border:2px solid #e2b56b !important;}
  .lnav-btn{background:#fff3cf !important; color:#7a4a12 !important; border:2px solid #e2b56b !important;}
  .lnav-btn:disabled{opacity:.45 !important;}
  .lnav-label{color:#fff3dd !important; text-shadow:0 1px 3px rgba(70,35,0,.7);}
  .lnav-label b{color:#ffe08a !important;}
  .lnav-pos{color:#ffd9a0 !important;}
  .lnav-mine{color:#b9f6a3 !important;}
  .lnav-empty{color:#fff3dd !important; text-shadow:0 1px 3px rgba(70,35,0,.7);}

  /* 🍄 재료 이름 말풍선 (접시 클릭 시: 중/영 + 한국어) */
  .ing-tip{
    position:fixed; transform:translate(-50%,-100%); z-index:65;
    background:rgba(255,253,246,.97); color:#4a2a06; font-weight:800; font-size:.82em;
    padding:5px 12px 4px; border-radius:12px; border:2px solid #e2b56b;
    box-shadow:0 4px 12px rgba(60,30,0,.4); white-space:nowrap; pointer-events:none;
    animation:tipin .18s ease-out;
  }
  .ing-tip::after{
    content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#e2b56b; border-bottom:0;
  }
  @keyframes tipin{from{opacity:0; transform:translate(-50%,-80%);}}
  .ing-tip.out{opacity:0; transition:opacity .3s;}

  #level-bar{display:flex; gap:6px; margin:4px 0 2px; flex-wrap:wrap; justify-content:center;}
  .lv-btn{
    border:2px solid #e2b56b; background:rgba(255,250,238,.92); color:#8a5a1a;
    border-radius:12px; padding:5px 13px; font-weight:900; cursor:pointer; font-family:inherit; font-size:.82em;
    box-shadow:0 2px 6px rgba(60,30,0,.25);
  }
  .lv-btn.on{background:linear-gradient(180deg,var(--mango-orange),var(--mango-deep)); color:#fff; border-color:#c05f00;}
</style>
<script src="/js/mangoi-voice-input.js?v=4"></script>
<script src="/js/mangoi-stt.js?v=2"></script><!-- 🎤 음성인식 조기 종료 보호막 -->
<!-- 🗣 (2026-08-03) 따라 말하기 채점을 허브와 같은 것으로 통일 + 한국인 발음 처방
     이 게임은 "이 문장을 따라 말하라" 과제라 문장 정렬 채점이 맞다.
     기존 matchScore 는 단어가 **어디에 있든** 세어서 어순이 틀려도 통과했다. -->
<script src="/js/mangoi-speak-score.js?v=1"></script>
<script src="/js/mangoi-pron-tags.js?v=1"></script>
<script src="/js/mangoi-memory.js?v=1"></script>
<!-- 🔁 (2026-08-04) 발음 점수 서버 적립 — 이 게임은 채점·기억큐는 하면서 서버에는 한 건도
     안 보내고 있었다(기기를 바꾸면 기록이 사라지고 교사 화면에도 안 남았다).
     MangoiMemory.log 를 감싸 자동으로 POST /api/games/shadow 로 보낸다 — 채점 코드는 안 건드린다.
     ⚠️ 반드시 mangoi-memory.js **다음에** 실을 것. -->
<script src="/js/mangoi-shadow-sync.js?v=1"></script>
<script src="/js/i18n-sweep.js?v=22" defer></script>
<script src="/js/game-track.js?v=3" defer></script>
</head>
<body>

<header>
  <h1>🍕 망고아이 문법 피자 마스터</h1>
  <div id="hud">
    <div class="hud-chip"><small>⚡ 난이도</small><select id="diff-sel" style="border:0;background:transparent;font-family:inherit;font-weight:800;font-size:1em;color:#7a4a12;cursor:pointer;outline:none;"></select></div>

var TOPPING_MAP = [];
function _hashStr(s){ var h = 2166136261; for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function buildToppingMap(){
  var n = cur().tokens.length;

  for(var i = idx.length - 1; i > 0; i--){ var j = Math.floor(rng() * (i + 1)); var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
  TOPPING_MAP = [];
  for(var k = 0; k < n; k++) TOPPING_MAP.push(idx[k % idx.length]);
}
function toppingOf(tokenIdx){
  return (TOPPING_MAP[tokenIdx] != null) ? TOPPING_MAP[tokenIdx] : (tokenIdx % TOPPINGS.length);
}

/* ── 교재(레슨) 문장 자동 성분 태거 — 데이터에 성분 정보가 없을 때 ── */
var AUX_WORDS = ['is','am','are','was','were','be','can','could','will','would','should','must','may','might','do','does','did','have','has','had'];
var PREP_WORDS = ['in','on','at','of','for','with','from','by','about','under','over','near','behind','into','after','before'];
var PRONOUNS = ['i','you','he','she','it','we','they'];
function tagTokens(words){
  var seenVerb = false;
  return words.map(function(word, i){
    // 중국어(한자) 단어엔 영어 성분 규칙이 안 맞음 → 배지 없는 'word'
    if(/[㐀-鿿]/.test(String(word))) return [word, 'word'];
    var w = String(word).toLowerCase().replace(/[^a-z']/g, '');
    var role = 'word';
    if(['a','an','the'].indexOf(w) > -1) role = 'article';
    else if(w === 'to') role = 'inf';
    else if(PREP_WORDS.indexOf(w) > -1) role = 'prep';
    else if(AUX_WORDS.indexOf(w) > -1){ role = (i < words.length - 1 && !seenVerb) ? 'aux' : 'verb'; if(role !== 'aux') seenVerb = true; }
    else if(PRONOUNS.indexOf(w) > -1) role = (i === 0 || !seenVerb) ? 'subject' : 'object';
    else if(/ly$/.test(w) && w.length > 3) role = 'adv';
    else if(i === 0) role = 'subject';
    else role = 'noun';
    return [word, role];
  });
}

var TTS_LANG = (GLANG === 'zh') ? 'zh-CN' : 'en-US';
function langOf(text){ return /[㐀-鿿]/.test(String(text)) ? 'zh-CN' : 'en-US'; }
var voiceCache = {};
function voiceFor(lang){
  if(!('speechSynthesis' in window)) return null;
  if(voiceCache[lang] !== undefined) return voiceCache[lang];
  var vs = speechSynthesis.getVoices();
  var pref = (lang === 'zh-CN') ? /zh[-_](CN|Hans)/i : /en[-_]US/i;
  var v = vs.find(function(x){ return pref.test(x.lang) && /female|zira|aria|jenny|samantha|xiaoxiao|yaoyao|huihui/i.test(x.name); })
       || vs.find(function(x){ return pref.test(x.lang); })
       || vs.find(function(x){ return x.lang.slice(0,2).toLowerCase() === lang.slice(0,2); }) || null;
  voiceCache[lang] = v;
  return v;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = function(){ voiceCache = {}; };
}
/* 🔊 모바일·앱에서도 소리 나는 3단 TTS 스택 (P-38·전차전과 동일 전략)
   ① 앱 네이티브(AndroidTTS) ② 서버 오디오(en=/api/voice/tts 원어민, zh=/api/tts-free 만다린)
   ③ 기기 speechSynthesis 폴백. done 콜백은 안전 타임아웃으로 반드시 1회 호출. */
var _pzAudio = null, _pzCache = {}, _pzSeq = 0, _pzTtsTimer = null;
function _pzStop(){
  _pzSeq++;
  clearTimeout(_pzTtsTimer);
  try{ if(window.AndroidTTS && window.AndroidTTS.stop) window.AndroidTTS.stop(); }catch(_){}
  try{ if(_pzAudio){ _pzAudio.onended = _pzAudio.onerror = null; _pzAudio.pause(); } }catch(_){}
  try{ speechSynthesis.cancel(); }catch(_){}
}
function _pzFetch(text, lang){                             // 서버 오디오 → objectURL (캐시)
  var key = lang + '|' + text;
  if(_pzCache[key]) return Promise.resolve(_pzCache[key]);
  var req = (lang === 'zh-CN')
    ? fetch('/api/tts-free?lang=zh&q=' + encodeURIComponent(text))
    : fetch('/api/voice/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text: text, lang: 'en' }) });
  return req.then(function(r){
    var ct = r.headers.get('content-type') || '';
    if(!r.ok || ct.indexOf('audio') < 0) throw new Error('tts');
    return r.blob();
  }).then(function(b){ var u = URL.createObjectURL(b); _pzCache[key] = u; return u; });
}
function _pzSynth(text, lang, fin){                        // ③ 기기 음성 폴백
  if(!('speechSynthesis' in window)){ fin(); return; }
  try{
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = RATE_BY_DIFF[DIFF - 1];
    var v = voiceFor(lang);
    if(v) u.voice = v;
    u.onend = u.onerror = function(){ fin(); };
    speechSynthesis.speak(u);
  }catch(_){ fin(); }
}
function speak(text, done, lang){
  lang = lang || langOf(text);
  _pzStop();
  var seq = _pzSeq;
  var called = false;
  function fin(){
    if(called || seq !== _pzSeq) return;
    called = true;
    _pzStop(); // 타임아웃 뒤 늦게 도착한 오디오가 마이크 위에서 재생되지 않게 한다.
    if(done) done();
  }
  _pzTtsTimer = setTimeout(fin, Math.max(3500, String(text).length * 170) + 4000);   // ⏱ 어떤 경우에도 흐름이 안 멈추게
  // ① 앱 네이티브 TTS
  try{
    if(window.AndroidTTS && window.AndroidTTS.isReady && window.AndroidTTS.isReady()){
      window.AndroidTTS.speak(text, lang.slice(0, 2), 1.0, RATE_BY_DIFF[DIFF - 1]);
      setTimeout(fin, Math.max(1500, String(text).length * (lang === 'zh-CN' ? 260 : 110)));
      return;
    }
  }catch(_){}
  // ② 서버 오디오 (모바일 브라우저·WebView에서도 확실히 재생)
  var fetchTimer;
  var audioReady = Promise.race([
    _pzFetch(text, lang),
    new Promise(function(resolve, reject){ fetchTimer = setTimeout(function(){ reject(new Error('tts-timeout')); }, 2500); })
  ]);
  audioReady.then(function(url){
    clearTimeout(fetchTimer);
    if(seq !== _pzSeq) return;
    try{
      if(!_pzAudio) _pzAudio = new Audio();
      _pzAudio.onended = function(){ fin(); };
      _pzAudio.onerror = function(){ _pzSynth(text, lang, fin); };
      _pzAudio.src = url;
      _pzAudio.playbackRate = RATE_BY_DIFF[DIFF - 1] || 1;
      try{ _pzAudio.preservesPitch = true; _pzAudio.webkitPreservesPitch = true; }catch(_){}
      var p = _pzAudio.play();
      if(p && p.catch) p.catch(function(){ if(seq === _pzSeq) _pzSynth(text, lang, fin); });
    }catch(_){ _pzSynth(text, lang, fin); }
  }).catch(function(){ clearTimeout(fetchTimer); if(seq === _pzSeq) _pzSynth(text, lang, fin); });
}

function norm(s){
  if(GLANG === 'zh') return String(s).replace(/[\s\p{P}]/gu, '');
  return String(s).toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();
}
function matchScore(said, target){
  if(GLANG === 'zh'){
    var a = norm(said), b = norm(target);
    if(!b.length) return 0;
    var hit = 0;
    for(var i = 0; i < b.length; i++){ if(a.indexOf(b[i]) > -1) hit++; }
    return hit / b.length;
  }
  /* 🗣 (2026-08-03) 허브와 같은 채점기로 교체.
     예전엔 `pool2.indexOf(w)` 로 **단어가 어디에 있든** 셌다 → 어순이 뒤바뀌어도,
     뜻이 다른 낱말을 말해도 7할만 겹치면 통과했다.
     지금은 단어를 순서대로 정렬해 누락·삽입·치환을 구분한다(기능어는 가중치를 낮춘다).
     ⚠️ 반환값은 예전과 같은 0~1 비율이다 → 호출부의 `>= 0.7` 기준은 안 바꿨다. */
  if(window.MangoiScore){
    var g = MangoiScore.grade(said, target);
    _pzDiag = '';
    try{
      var d = (window.MangoiPron && MangoiPron.analyze(g)) || { tags:[], goodTags:[] };
      _pzTags = d;
      _pzDiag = (window.MangoiPron && MangoiPron.tipFor(d.tags)) || '';
    }catch(_e){}
    return g.accuracy;
  }
  return _legacyMatchScore(said, target);
}
var _pzDiag = '', _pzTags = { tags:[], goodTags:[] };
// 채점기 로드 실패 시에만 쓰는 옛 방식 — 게임이 아예 안 되는 것보다는 낫다
function _legacyMatchScore(said, target){
  var saidW = norm(said).split(' ').filter(Boolean);
  var tgtW = norm(target).split(' ').filter(Boolean);
  if(!tgtW.length) return 0;
  var pool2 = saidW.slice(), hit2 = 0;
  tgtW.forEach(function(w){
    var i = pool2.indexOf(w);
    if(i > -1){ hit2++; pool2.splice(i, 1); }
  });
  return hit2 / tgtW.length;
}
/* 🧠 판정이 끝난 순간에만 기억 큐에 적립한다.
   matchScore 는 인식 중간결과마다 불리므로 거기서 적립하면 한 문장이 수십 번 쌓인다. */
function _pzRemember(ok){

}

/* ══════════ 🏷️ 문법 성분 힌트 보이기/가리기 (원장님 제안 2026-08-13) ══════════

/* 정답 재료를 피자 위 섹터에 흩뿌리기 + 단어 칩 */
function placeTopping(word, role, tokenIdx, total){
  var layer = $('toppings-layer');
  var img = TOPPING_IMGS[toppingOf(tokenIdx)];
  var angC = (tokenIdx / total) * Math.PI * 2 - Math.PI / 2;
  var spread = Math.PI * 2 / total;
  for(var i = 0; i < 3; i++){
    var ang = angC + (Math.random() - 0.5) * spread * 0.8;
    var rad = 18 + Math.random() * 16;                    // 중심 기준 %
    var x = 50 + Math.cos(ang) * rad;
    var y = 50 + Math.sin(ang) * rad;
    var el = document.createElement('img');
    el.className = 'top-sprite';
    el.src = img;
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.width = (13 + Math.random() * 5) + '%';
    el.style.setProperty('--rot', Math.floor(Math.random() * 360) + 'deg');
    layer.appendChild(el);
  }
  var info = ROLE_INFO[role] || ROLE_INFO.word;
  var chip = document.createElement('div');
  chip.className = 'word-chip';
  chip.innerHTML = word + (role === 'word' ? '' :
    '<small><span class="role ' + info.cls + '" style="display:inline-block;padding:0 7px;border-radius:6px;color:#fff;">' + info.ko + '</span></small>');
  chip.style.left = (50 + Math.cos(angC) * 38) + '%';
  chip.style.top = (50 + Math.sin(angC) * 38) + '%';
  layer.appendChild(chip);
}

  updateHud();
  applyRoles();   // 🏷️ 단계(Level)·레슨 전환에 맞춰 성분 힌트 기본값 적용
  // 🔊 서버 오디오 미리받기(문장+단어) — 클릭·듣기 즉시 재생
  prefetchTts(sentenceText());
  s.tokens.forEach(function(t){ prefetchTts(t[0]); });
  // ▶ 타이머는 바로 안 돌리고, 먼저 문장 듣기 오버레이부터
  $('timer').textContent = fmtTime(TIME_BY_DIFF[DIFF - 1]);
  showReady();
}

/* 마우스 호버 전용: 재료 이름 말풍선 + 재료 이름 발음(영/중)
   ⚠ 클릭과 절대 섞이지 않음 — 클릭 직후 1.5초는 호버 발음 음소거(단어 발음 보호) */
var hoverTip = null, hoverSpeakTimer = null, hoverMuteUntil = 0;
function showHoverTip(el, tokenIdx){
  removeHoverTip();
  var r = el.getBoundingClientRect();
  hoverTip = document.createElement('div');
  hoverTip.className = 'ing-tip';
  hoverTip.textContent = '🍕 ' + toppingName(tokenIdx);
  hoverTip.style.left = (r.left + r.width / 2) + 'px';
  hoverTip.style.top = (r.top - 6) + 'px';
  document.body.appendChild(hoverTip);
  // 🔊 재료 이름 발음 — 빠르게 스치는 호버는 건너뛰고, 클릭 직후엔 단어 발음을 끊지 않도록 음소거
  hoverSpeakTimer = setTimeout(function(){
    if(Date.now() < hoverMuteUntil) return;
    var t = TOPPINGS[toppingOf(tokenIdx)];
    speak(GLANG === 'zh' ? t.zh : t.en);
  }, 180);
}
function removeHoverTip(){
  if(hoverSpeakTimer){ clearTimeout(hoverSpeakTimer); hoverSpeakTimer = null; }
  if(hoverTip){ hoverTip.remove(); hoverTip = null; }
}

/* 클릭 전용: 문장 단어 말풍선 (재료 이름 아님!) */
function showWordTip(el, word){
  var r = el.getBoundingClientRect();
  var tip = document.createElement('div');
  tip.className = 'ing-tip';
  tip.textContent = '🔊 ' + word;
  tip.style.left = (r.left + r.width / 2) + 'px';
  tip.style.top = (r.top - 6) + 'px';
  document.body.appendChild(tip);
  setTimeout(function(){ tip.classList.add('out'); }, 1200);
  setTimeout(function(){ tip.remove(); }, 1550);
}

function onBowlClick(el, tokenIdx){
  if(missionActive || baking || awaitingStart) return;
  var s = cur();
  hoverMuteUntil = Date.now() + 1500;        // 클릭 후 잠시 호버 발음 금지 → 단어 발음이 안 끊김
  removeHoverTip();                          // 재료 이름 말풍선·예약된 재료 발음 즉시 취소
  speakWord(s.tokens[tokenIdx][0]);          // 클릭 = 반드시 문장 단어 발음 (zh=중국어, en=영어)
  showWordTip(el, s.tokens[tokenIdx][0]);    // 클릭 = 단어 말풍선 (재료 이름 아님)
  if(tokenIdx === placedCount){
    el.onclick = null;
    el.remove();
    if(placedCount === 0) $('pizza').classList.add('saucy');   // 첫 재료 = 소스부터!
    placeTopping(s.tokens[tokenIdx][0], s.tokens[tokenIdx][1], tokenIdx, s.tokens.length);
    placedCount++;
    if(placedCount === s.tokens.length){
      stopTimer();
      bakePizza();
    }
  } else {
    var bw = $('board-wrap');
    bw.classList.remove('shake');
    void bw.offsetWidth;
    bw.classList.add('shake');
    showHint();
  }
}

/* 💡 (2026-08-13 원장님 제안) 고정 '듣기 3회' 강제를 풀었다 — 1회만 들으면 말하기가 열리고,
   더 듣고 싶은 학생만 3회까지 듣는다. 잘하는 학생의 형식적 횟수 채우기를 없애기 위함. */
$('btn-listen').onclick = function(){
  if(!missionActive || listening || _pzTtsBusy) return;
  var seq = _pzMissionSeq;
  _pzTtsBusy = true;
  _pzButtons();
  $('speech-result').textContent = '🔊 문장을 듣고 있어요…';
  speak(sentenceText(), function(){
    if(seq !== _pzMissionSeq || !missionActive) return;
    listenCount++;
    renderDots('listen-dots', Math.min(3, listenCount));
    _pzTtsBusy = false;
    _pzButtons();
    $('speech-result').textContent = '🎤 말하기를 누르고 마이크가 준비되면 문장을 읽어 주세요.';
  });
};

/* 💯 (2026-08-13 원장님 제안) 정확도 기반 적응형 통과.
   · sc(정확도 0~1)가 PERFECT_SC 이상이면 남은 반복을 건너뛰고 즉시 통과.
   · 그게 **첫 시도**(speakAttempts===1)면 '원샷 원킬' 퍼펙트 보너스 토큰까지.
   · 100점 미만(0.7~)은 예전처럼 3회를 채워 자연스러운 반복 학습. */
function speakSuccess(sc){
  speakCount++;
  try{ if(typeof _pzRemember === 'function') _pzRemember(true); }catch(_e){}   // 🧠 성공 적립 (부가기능은 본 흐름 뒤에)
  if(sc != null && sc >= PERFECT_SC){
    renderDots('speak-dots', 3);
    missionComplete(speakAttempts <= 1);
    return;
  }
  renderDots('speak-dots', speakCount);
  if(speakCount >= 3){
    missionComplete(false);
  } else {
    toast('말하기 ' + speakCount + ' / 3 — 잘했어요!');
    $('speech-result').textContent = '✅ 정확해요! ' + (3 - speakCount) + '번 더! (100점이면 바로 통과!)';
  }
}

$('btn-speak').onclick = function(){
  if(!missionActive || _pzTtsBusy || listenCount < 1 || speakCount >= 3) return;
  if(listening){ if(_pzStopListen) _pzStopListen(); return; }
  _pzStop();
  var seq = _pzMissionSeq, target = sentenceText();
  var _pzSaid = '', _pzBase = '', _pzGot = false, _pzSil = null, _pzBest = 0;
  var rec = null, watchdog = null, endTimer = null, error = '', recording = _pzUseRecording || !SR;
  var settled = false, stopRequested = false;
  function active(){ return !settled && seq === _pzMissionSeq && missionActive; }
  function cleanup(){
    settled = true;
    clearTimeout(_pzSil); clearTimeout(watchdog); clearTimeout(endTimer);
    if(rec){ rec.onstart = rec.onresult = rec.onerror = rec.onend = null; try{ rec.abort(); }catch(_){} }
    if(recording && window.MangoiVoice) MangoiVoice.cancel();
    listening = false; recognition = null;
    _pzCancelListen = _pzStopListen = null;
    _pzButtons();
  }
  function showError(code){
    var messages = {
      'not-allowed':'마이크 권한이 차단됐어요. 주소창 왼쪽 사이트 설정에서 마이크를 허용한 뒤 다시 눌러 주세요.',
      'service-not-allowed':'브라우저 음성인식을 사용할 수 없어요. 녹음 방식으로 바꿔 다시 눌러 주세요.',
      'audio-capture':'마이크를 찾지 못했어요. 연결과 선택된 입력 장치를 확인해 주세요.',
      'network':'음성인식 연결이 끊겼어요. 녹음 방식으로 바꿔 다시 눌러 주세요.',
      'denied':'마이크 권한이 차단됐어요. 주소창 왼쪽 사이트 설정에서 마이크를 허용해 주세요.',
      'no_audio':'목소리를 듣지 못했어요. 마이크 가까이에서 문장을 읽고 ⏹을 눌러 주세요.',
      'server':'녹음 확인 서버에 연결하지 못했어요. 잠시 뒤 다시 눌러 주세요.',
      'unsupported':'음성인식을 시작할 수 없어요. Chrome·Edge에서 마이크를 허용해 주세요.',
      'timeout':'마이크 응답이 늦어 중단했어요. 다시 눌러 주세요.',
      'aborted':'말하기를 중단했어요. 다시 눌러 주세요.'
    };
    if((code === 'network' || code === 'service-not-allowed') && _pzCanRecord()) _pzUseRecording = true;
    $('speech-result').textContent = messages[code] || '마이크를 시작하지 못했어요. 다시 눌러 주세요.';
    if((code === 'network' || code === 'service-not-allowed') && !_pzCanRecord())
      $('speech-result').textContent = '음성인식 연결을 사용할 수 없어요. Chrome·Edge에서 다시 열어 주세요.';
    $('btn-practice-next').hidden = false;
    _pzButtons();
  }
  function _pzFail(){
    var fix = (typeof _pzDiag === 'string') ? _pzDiag : '';
    $('speech-result').textContent = '들린 말: "' + _pzSaid + '" — 문장을 다시 듣거나 말해 보세요.' + (fix ? ' ' + fix : '');
    try{ if(typeof _pzRemember === 'function') _pzRemember(false); }catch(_){}
    // 오답 후 자동 TTS는 없앤다. 학생이 계속 말하는 동안 정답 음성이 끼어들지 않는다.
  }
  function finish(){
    if(!active()) return;
    _pzGot = true;
    cleanup();
    if(error){ showError(error); return; }
    if(!_pzSaid.trim()){ showError('no_audio'); return; }
    _pzBest = matchScore(_pzSaid, target); // 중간결과 최고점이 아니라 마지막으로 들은 문장
    if(_pzBest >= 0.7){ speakAttempts++; speakSuccess(_pzBest); }
    else { speakAttempts++; _pzFail(); }
  }
  function stop(){
    if(!active() || stopRequested) return;
    stopRequested = true;
    clearTimeout(_pzSil);
    $('speech-result').textContent = '말씀하신 문장을 확인하고 있어요…';
    $('btn-speak').disabled = true;
    if(recording){ MangoiVoice.stop(); return; }
    // stop() 후 마지막 result를 기다리되 end 이벤트가 유실돼도 풀린다.
    endTimer = setTimeout(finish, 1500);
    try{ rec.stop(); }catch(_){ finish(); }
  }
  function _pzArm(ms){
    clearTimeout(_pzSil);
    _pzSil = setTimeout(stop, ms || (_pzSaid ? 2800 : 12000));
  }
  function _pzMerge(a, b){
    a = String(a||'').replace(/\s+/g,' ').trim(); b = String(b||'').replace(/\s+/g,' ').trim();
    if(!a) return b; if(!b) return a;
    if(GLANG === 'zh'){
      for(var n=Math.min(a.length,b.length); n>0; n--) if(a.slice(-n) === b.slice(0,n)) return a + b.slice(n);
      return a + b;
    }
    var la=a.toLowerCase().split(' '), lb=b.toLowerCase().split(' '), rb=b.split(' '), k=0;
    for(var m=Math.min(la.length,lb.length); m>0; m--){
      if(la.slice(-m).join(' ') === lb.slice(0,m).join(' ')){ k=m; break; }
    }
    var rest = rb.slice(k).join(' ');
    return rest ? a + ' ' + rest : a;
  }
  listening = true;
  _pzCancelListen = cleanup;
  _pzStopListen = stop;
  _pzButtons();
  $('speech-result').textContent = '마이크를 준비하고 있어요. 권한 요청이 나오면 허용해 주세요.';
  watchdog = setTimeout(function(){ error = 'timeout'; finish(); }, recording ? 45000 : 30000);
  if(recording){
    if(!_pzCanRecord()){ error = 'unsupported'; finish(); return; }
    try{
      MangoiVoice.record({lang:langOf(target).slice(0,2), firstMs:12000, silenceMs:2800, maxMs:25000,
        onState:function(state, info){
          if(!active()) return;
          if(state === 'error'){ error = info.reason; return; }
          if(state === 'waiting' || state === 'speaking') $('speech-result').textContent = '🎤 마이크가 준비됐어요. 문장을 읽고 ⏹을 눌러 주세요.';
          if(state === 'thinking'){
            $('speech-result').textContent = '녹음한 문장을 확인하고 있어요…';
            $('btn-speak').disabled = true;
          }
        }
      }).then(function(text){ if(!active()) return; _pzSaid = text || ''; finish(); })
        .catch(function(){ if(active()){ error = 'server'; finish(); } });
    }catch(_){ error = 'unsupported'; finish(); }
    return;
  }
  try{
    recognition = rec = new SR();
    recognition.lang = langOf(target);
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 3;
    recognition.onstart = function(){
      if(!active()) return;
      $('speech-result').textContent = '🎤 마이크가 준비됐어요. 문장을 끝까지 읽어 주세요.';
      _pzArm();
    };
    recognition.onresult = function(e){
      if(!active() || _pzGot) return;
      var full = '', allFinal = true;
      for(var i=0;i<e.results.length;i++){
        full = _pzMerge(full, (e.results[i][0]||{}).transcript || '');
        if(!e.results[i].isFinal) allFinal = false;
      }
      _pzSaid = _pzMerge(_pzBase, full).trim();
      $('speech-result').textContent = '🎤 들리는 말: "' + _pzSaid + '"';
      var sc = matchScore(_pzSaid, target);
      // 임시 인식이 잠깐 정답이었다가 수정되는 경우에는 통과시키지 않는다.
      if(allFinal && sc >= PERFECT_SC){ finish(); return; }
      if(!stopRequested) _pzArm();
    };
    recognition.onerror = function(ev){
      if(!active() || ev.error === 'no-speech') return;
      error = ev.error || 'unsupported';
      finish(); // onend가 없어도 즉시 버튼 복구, 구체적인 오류 안내 유지
    };
    recognition.onend = finish;
    if(window.MangoiSTT) MangoiSTT.harden(recognition, {
      isDone:function(){ return _pzGot || !active(); },
      beforeRestart:function(){ _pzBase = _pzSaid; },
      onRestart:_pzArm, maxRestarts:2, maxMs:30000
    });
    recognition.start();
  }catch(e){ error = e && e.name === 'NotAllowedError' ? 'not-allowed' : 'unsupported'; finish(); }
};

function missionComplete(perfect){
  if(!missionActive) return;
  _pzCancelMissionAudio();
  missionActive = false;
  var gain = perfect ? 15 : 10;                          // 🏆 원샷 원킬(첫 시도 100점) = +5 퍼펙트 보너스
  tokens += gain;
  updateHud();
  $('mission').classList.remove('show');
  var r = $('paddle').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
  if(perfect) setTimeout(function(){ burst(r.left + r.width / 2, r.top + r.height / 2); }, 350);
  $('status').textContent = perfect
    ? '🏆 퍼펙트! 첫 시도 100점! ' + gain + '토큰 획득! 다음 피자를 준비할게요...'
    : '🎉 미션 성공! ' + gain + '토큰 획득! 다음 피자를 준비할게요...';
  toast(perfect ? '🏆 원샷 원킬! +' + gain + ' 토큰!' : '+' + gain + ' 토큰!');
  // 🔓 허브 게임 해금 체인 신호 — 허브(student-games.html)가 미션 완료를 세어 다음 게임을 연다
  try{ if(window.parent !== window) parent.postMessage({ type:'mangoi-game-complete', game:'pizza', score:gain }, '*'); }catch(_){}
  var completedSeq = _pzMissionSeq;
  setTimeout(function(){ if(completedSeq === _pzMissionSeq) nextSentence(); }, 2000);
}

function nextSentence(){
  sentIdx++;
  if(sentIdx >= pool().length){
    if(!LESSON_POOL && levelIdx < LEVELS.length - 1){
      levelIdx++;
      sentIdx = 0;
      renderLevelBar();
      toast('🎊 ' + LEVELS[levelIdx].name + ' 시작!');
    } else {
      $('status').textContent = '👑 전부 완료! 최고의 피자 마스터예요!';
      sentIdx = 0;
      if(!LESSON_POOL){ levelIdx = 0; renderLevelBar(); }
    }
  }
  setupSentence();
}

/* ══════════ 레벨 바 (내장 문장 모드) ══════════ */
function renderLevelBar(){
  var bar = $('level-bar');
  bar.innerHTML = '';
  if(LESSON_POOL) return;                                  // 레슨 모드에선 숨김
  LEVELS.forEach(function(lv, i){
    var b = document.createElement('button');
    b.className = 'lv-btn' + (i === levelIdx ? ' on' : '');
    b.textContent = lv.name.split(' · ')[0];
    b.onclick = function(){ levelIdx = i; sentIdx = 0; renderLevelBar(); setupSentence(); };
    bar.appendChild(b);
  });
}

/* ══════════ 📚 교재(레슨) 연동 — MangoiLessonNav ══════════ */
function mountLessonNav(){
  if(!window.MangoiLessonNav) return;
  MangoiLessonNav.mount({ glang:GLANG, mount:$('lessonNav'), onSet:function(sets, info){
    if(sets && sets.length){
      LESSON_POOL = sets.map(function(s){
        return {
          tokens: tagTokens(s.w),
          ko: s.ko || '',
          py: s.py || '',
          grammar: GENERIC_GRAMMAR
        };
      });
      LESSON_INFO = info || null;
    } else {
      LESSON_POOL = null;
      LESSON_INFO = null;
    }
    sentIdx = 0;
    renderLevelBar();
    setupSentence();
  }});
}
