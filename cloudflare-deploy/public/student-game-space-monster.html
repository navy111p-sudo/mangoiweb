<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; }
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1b4d 100%);
      color: #e8f0ff;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hud {
      display: flex;
      gap: 20px;
      padding: 12px;
      background: rgba(8, 16, 34, 0.8);
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }

    .stat { display: flex; flex-direction: column; }
    .stat .label { font-size: 10px; color: #9fb3d6; }
    .stat .value { font-size: 18px; font-weight: 800; }

    #field {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(100,150,255,.1), transparent);
      overflow: hidden;
    }

    .monster {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 180px;
      margin: -90px 0 0 -75px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 15px rgba(147, 51, 234, 0.6));
      will-change: transform, opacity;
    }

    .monster.hit {
      animation: none !important;
      opacity: 0.2;
      filter: grayscale(100%);
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(251, 191, 36, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 100;
    }

    #muzzle {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), rgba(255,240,180,.55), transparent 18%);
      opacity: 0;
      pointer-events: none;
      z-index: 90;
    }

    #muzzle.fire {
      animation: muzzleFlash .12s ease-out;
    }

    @keyframes muzzleFlash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .splash {
      position: fixed;
      width: 90px;
      height: 90px;
      margin: -45px 0 0 -45px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,220,120,.95), rgba(255,120,40,.5) 45%, transparent 70%);
      pointer-events: none;
      z-index: 95;
      animation: splashPop .45s ease-out forwards;
    }

    @keyframes splashPop {
      0% { transform: scale(.4); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    #gameOverModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #gameOverModal.show {
      display: flex;
    }

    #gameOverModal h2 {
      font-size: 40px;
      color: #fbbf24;
    }

    #gameOverModal button {
      padding: 12px 24px;
      background: #fbbf24;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat">
        <div class="label">STAGE</div>
        <div class="value" id="stageVal">1/3</div>
      </div>
      <div class="stat" style="margin-left: auto;">
        <div class="label">TIME</div>
        <div class="value" id="timerVal">60</div>
      </div>
    </div>
    <div id="field"></div>
  </div>

  <div id="crosshair"></div>
  <div id="muzzle"></div>

  <div id="gameOverModal">
    <h2 id="gameOverTitle">Game Over!</h2>
    <p id="gameOverText" style="font-size: 18px; color: #9fb3d6;">Score: 0</p>
    <button onclick="location.reload()">Restart</button>
  </div>

  <script>
    const field = document.getElementById('field');
    const scoreEl = document.getElementById('scoreVal');
    const timerEl = document.getElementById('timerVal');
    const gameOverModal = document.getElementById('gameOverModal');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverText = document.getElementById('gameOverText');
    const muzzle = document.getElementById('muzzle');

    let score = 0;
    let timeLeft = 60;
    let gameActive = true;
    let spawnTimer = null;

    const creatures = [
      { name: 'tripod', img: 'tripod-level-01-frame-00.png' },
      { name: 'blob', img: 'blob-level-01-frame-00.png' },
      { name: 'spider', img: 'spider-level-01-frame-00.png' }
    ];

    const APPROACH_MS = 6000;
    const live = [];

    function spawnMonster() {
      if (!gameActive) return;

      const creature = creatures[Math.floor(Math.random() * creatures.length)];
      const monster = document.createElement('div');

      monster.className = 'monster';
      monster.style.backgroundImage = `url('/img/space-monsters/${creature.img}')`;

      // 화면 안쪽 임의 지점에서 시작해 시야 밖으로 퍼지며 다가온다
      const dirX = (Math.random() * 2 - 1);
      const dirY = (Math.random() * 2 - 1) * 0.5;

      field.appendChild(monster);
      live.push({ el: monster, dirX, dirY, born: performance.now(), dead: false });
    }

    function tick(now) {
      for (let i = live.length - 1; i >= 0; i--) {
        const m = live[i];
        const p = (now - m.born) / APPROACH_MS;

        if (m.dead) continue;

        if (p >= 1) {
          m.el.remove();
          live.splice(i, 1);
          continue;
        }

        // 원근: 뒤에서 앞으로 — 스케일이 커지며 화면 밖으로 벌어진다
        const scale = 0.12 + p * p * 1.9;
        const x = m.dirX * p * p * 420;
        const y = m.dirY * p * p * 300;

        m.el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
        m.el.style.opacity = p < 0.06 ? String(p / 0.06) : (p > 0.94 ? String((1 - p) / 0.06) : '1');
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // 라이트건: 화면 아무 데나 쏘면 그 지점에 명중 판정
    function fire(clientX, clientY) {
      if (!gameActive) return;

      muzzle.style.setProperty('--fx', clientX + 'px');
      muzzle.style.setProperty('--fy', clientY + 'px');
      muzzle.classList.remove('fire');
      void muzzle.offsetWidth;
      muzzle.classList.add('fire');

      const splash = document.createElement('div');
      splash.className = 'splash';
      splash.style.left = clientX + 'px';
      splash.style.top = clientY + 'px';
      document.body.appendChild(splash);
      setTimeout(() => splash.remove(), 450);

      // 탄착점과 겹치는 괴물 중 가장 앞(큰) 것을 맞춘다
      let target = null;
      let bestScale = -1;
      for (const m of live) {
        if (m.dead) continue;
        const r = m.el.getBoundingClientRect();
        if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) continue;
        if (r.width > bestScale) { bestScale = r.width; target = m; }
      }

      if (!target) return;

      target.dead = true;
      target.el.classList.add('hit');
      score += 100;
      scoreEl.textContent = score;
      setTimeout(() => {
        target.el.remove();
        const i = live.indexOf(target);
        if (i >= 0) live.splice(i, 1);
      }, 300);
    }

    document.addEventListener('pointerdown', (e) => fire(e.clientX, e.clientY));

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      clearInterval(spawnTimer);

      live.length = 0;
      document.querySelectorAll('.monster').forEach(m => m.remove());

      gameOverTitle.textContent = 'Game Over!';
      gameOverText.textContent = `Final Score: ${score}`;
      gameOverModal.classList.add('show');
    }

    const timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    spawnMonster();
    spawnTimer = setInterval(spawnMonster, 1400);
  </script>

</body>
</html>
