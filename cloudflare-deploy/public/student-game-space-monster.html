<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; }
    body {
      background: #04060f;
      color: #e8f0ff;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── HUD ── */
    .hud {
      position: relative;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 9px 16px;
      background: rgba(4, 8, 20, 0.85);
      border-bottom: 1px solid rgba(59, 130, 246, 0.35);
    }
    .stat { display: flex; flex-direction: column; line-height: 1.15; }
    .stat .label { font-size: 10px; color: #9fb3d6; letter-spacing: 1px; }
    .stat .value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #scoreVal { color: #fbbf24; }
    #stageVal { color: #60a5fa; }
    #wordsVal { color: #4ade80; }
    #timerVal { color: #7fd1ff; }
    #livesVal { color: #ef4444; font-size: 16px; letter-spacing: 2px; }

    /* ── 문제 배너 ── */
    .quizbar {
      position: relative;
      z-index: 50;
      text-align: center;
      padding: 8px 12px;
      background: rgba(4, 8, 20, 0.75);
      border-bottom: 1px solid rgba(251, 191, 36, 0.25);
    }
    .quizbar .prompt { font-size: 24px; font-weight: 900; color: #fde68a; letter-spacing: 1px; }
    .quizbar .guide { font-size: 12px; color: #9fb3d6; margin-top: 2px; }

    /* ── 전장: 우주 배경 ── */
    #field {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: none;
      background:
        radial-gradient(1.5px 1.5px at 40px 60px, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 120px 150px, rgba(200,220,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 220px 40px, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 300px 190px, rgba(190,210,255,.7), transparent),
        radial-gradient(2px 2px at 170px 250px, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 80px 280px, rgba(220,230,255,.6), transparent),
        radial-gradient(ellipse 90% 60% at 50% 120%, rgba(60, 30, 110, .45), transparent 60%),
        radial-gradient(ellipse 70% 50% at 20% -10%, rgba(20, 60, 140, .35), transparent 60%),
        linear-gradient(180deg, #05081a 0%, #0a0e2c 55%, #120a2e 100%);
      background-size: 340px 340px, 340px 340px, 340px 340px, 340px 340px, 340px 340px, 340px 340px, 100% 100%, 100% 100%, 100% 100%;
    }

    #field.shake { animation: shake .3s; }
    @keyframes shake {
      0%, 100% { margin-left: 0; }
      25% { margin-left: -12px; }
      50% { margin-left: 10px; }
      75% { margin-left: -6px; }
    }

    /* 접근 경고 게이지 */
    #dangerBar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 6px;
      z-index: 46;
      background: rgba(255,255,255,.08);
    }
    #dangerFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #fbbf24 55%, #ef4444);
      transition: width .12s linear;
    }

    #flash {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 40;
    }
    #flash.hitfx { background: rgba(255, 250, 220, .8); animation: flashOut .25s ease-out; }
    #flash.hurtfx { background: rgba(255, 30, 30, .5); animation: flashOut .5s ease-out; }
    @keyframes flashOut { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ── 괴물 (워프게이트 원형) ── */
    .mon {
      position: absolute;
      z-index: 30;
      width: var(--d);
      height: var(--d);
      will-change: transform;
    }
    .mon .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-size: cover;
      background-position: center 30%;
      border: 3px solid rgba(147, 100, 255, .8);
      box-shadow:
        0 0 26px rgba(147, 51, 234, .65),
        0 0 60px rgba(90, 60, 220, .3),
        inset 0 0 34px rgba(20, 5, 50, .8);
    }
    /* 가슴 단어판 */
    .mon .tag {
      position: absolute;
      left: 50%;
      bottom: 4%;
      transform: translateX(-50%);
      transform-origin: center bottom;
      z-index: 2;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(6, 12, 32, 0.92);
      border: 2px solid rgba(251, 191, 36, 0.85);
      box-shadow: 0 0 14px rgba(251,191,36,.35), 0 3px 12px rgba(0,0,0,.6);
      font-size: clamp(15px, 3.2vmin, 24px);
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
      white-space: nowrap;
    }
    .mon.wrongHit .tag {
      border-color: #ef4444;
      color: #fca5a5;
      background: rgba(60, 8, 8, 0.92);
    }
    /* 오답 방어막 튕김 */
    .mon .shield {
      position: absolute;
      inset: -6%;
      border-radius: 50%;
      border: 3px solid rgba(120, 200, 255, .9);
      box-shadow: 0 0 30px rgba(120, 200, 255, .8), inset 0 0 24px rgba(120, 200, 255, .35);
      opacity: 0;
      pointer-events: none;
    }
    .mon.deflect .shield { animation: deflectFx .45s ease-out; }
    @keyframes deflectFx {
      0% { opacity: 1; transform: scale(.92); }
      100% { opacity: 0; transform: scale(1.12); }
    }
    /* 정답 공개 */
    .mon.reveal .face { border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,.8), inset 0 0 34px rgba(10, 60, 30, .8); }
    .mon.reveal .tag { border-color: #22c55e; }
    /* 처치 폭발 */
    .mon.boom .face {
      animation: boomFx .5s ease-out forwards;
    }
    .mon.boom .tag { animation: boomFx .5s ease-out forwards; }
    @keyframes boomFx {
      0% { filter: brightness(2.6) saturate(1.6); opacity: 1; }
      40% { filter: brightness(3) saturate(2); opacity: 1; transform: scale(1.15); }
      100% { filter: brightness(4); opacity: 0; transform: scale(1.5); }
    }
    /* 도망 */
    .mon.flee { transition: opacity .45s ease-out; opacity: 0 !important; }

    /* 1인칭 저격수 사망: 카메라가 쓰러짐 */
    #field.dying { animation: die 1.25s ease-in forwards; }
    @keyframes die {
      0% { transform: none; filter: none; }
      30% { transform: rotate(-3deg); }
      100% { transform: rotate(22deg) translateY(30%) scale(1.06); filter: brightness(.3) saturate(.5) blur(2px); }
    }
    #ohNo {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 60;
      font-size: 54px;
      font-weight: 900;
      color: #ff5a5a;
      letter-spacing: 2px;
      text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 24px rgba(255,60,60,.6);
      opacity: 0;
      pointer-events: none;
    }
    #ohNo.show { animation: ohNoPop 1.2s ease-out forwards; }
    @keyframes ohNoPop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.5) rotate(-4deg); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(2deg); }
      30% { transform: translate(-50%,-50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 처치 문구 팝업 */
    #killPop {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%) scale(.6);
      z-index: 45;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.9);
    }
    #killPop .en { font-size: 40px; font-weight: 900; color: #fbbf24; letter-spacing: 4px; }
    #killPop .ko { font-size: 18px; font-weight: 700; color: #e8f0ff; margin-top: 2px; }
    #killPop .pts { font-size: 20px; font-weight: 800; color: #4ade80; margin-top: 4px; }
    #killPop.show { animation: popIn 1.1s ease-out forwards; }
    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      25% { transform: translate(-50%, -50%) scale(1); }
      75% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -62%) scale(1); }
    }

    /* ── 크로스헤어 ── */
    #crosshair {
      position: fixed;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      border: 2px solid rgba(251, 191, 36, .85);
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 12px rgba(251,191,36,.35), inset 0 0 10px rgba(251,191,36,.15);
      transition: transform .06s;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(251, 191, 36, .8);
      top: 50%; left: 50%;
    }
    #crosshair::before { width: 2px; height: 28px; transform: translate(-50%, -50%); }
    #crosshair::after { width: 28px; height: 2px; transform: translate(-50%, -50%); }
    #crosshair.bang { transform: scale(.78); }

    .splash {
      position: fixed;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,235,150,.95), rgba(255,120,40,.55) 40%, transparent 70%);
      pointer-events: none;
      z-index: 95;
      animation: splashPop .4s ease-out forwards;
    }
    @keyframes splashPop {
      0% { transform: scale(.35); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* ── 결과 모달 ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    #modal.show { display: flex; }
    #modal h2 { font-size: 38px; font-weight: 900; color: #fbbf24; }
    #modal .sub { font-size: 15px; color: #9fb3d6; }
    #modal .score { font-size: 24px; font-weight: 800; color: #e8f0ff; }
    #learnedBox {
      max-width: 420px;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(251,191,36,.25);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
    }
    #learnedBox .t { font-size: 12px; color: #9fb3d6; margin-bottom: 6px; text-align: center; }
    #learnedBox .row { font-size: 15px; font-weight: 700; padding: 3px 0; }
    #learnedBox .row .en { color: #fde68a; }
    #learnedBox .row .ko { color: #cfe0ff; font-weight: 500; }
    #modal button {
      margin-top: 6px;
      padding: 13px 30px;
      background: #fbbf24;
      color: #111;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
      <div class="stat"><div class="label">STAGE</div><div class="value" id="stageVal">1/3</div></div>
      <div class="stat"><div class="label">LIFE</div><div class="value" id="livesVal">&#9829;&#9829;&#9829;</div></div>
      <div class="stat"><div class="label">WORDS</div><div class="value" id="wordsVal">0</div></div>
      <div class="stat" style="margin-left:auto;"><div class="label">TIME</div><div class="value" id="timerVal">99</div></div>
    </div>

    <div class="quizbar">
      <div class="prompt" id="quizPrompt">READY</div>
      <div class="guide"><b>정답 단어를 가진 괴물</b>을 쏘세요! 오답 괴물은 방어막이 튕겨냅니다 &middot; Shoot the monster with the right word!</div>
    </div>

    <div id="field">
      <div id="flash"></div>
      <div id="killPop"><div class="en"></div><div class="ko"></div><div class="pts">+100</div></div>
      <div id="ohNo">Oh no!</div>
      <div id="dangerBar"><div id="dangerFill"></div></div>
    </div>
  </div>

  <div id="crosshair" style="top:50%; left:50%;"></div>

  <div id="modal">
    <h2 id="modalTitle">Game Over</h2>
    <div class="sub" id="modalSub"></div>
    <div class="score" id="modalScore"></div>
    <div id="learnedBox"><div class="t">오늘 사냥한 단어 &middot; Words you mastered</div><div id="learnedList"></div></div>
    <button onclick="location.reload()">다시 도전 &middot; Retry</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const field = $('field'), flash = $('flash');
    const killPop = $('killPop'), crosshair = $('crosshair');
    const scoreEl = $('scoreVal'), stageEl = $('stageVal'), timerEl = $('timerVal');
    const livesEl = $('livesVal'), wordsEl = $('wordsVal');
    const quizPrompt = $('quizPrompt'), dangerFill = $('dangerFill');
    const modal = $('modal');

    // ── Higgsfield 4K 실사 크리처 (level-10 = 최대 해상도, 4프레임) ──
    const CREATURES = ['tripod', 'blob', 'spider', 'cyclops'];
    const framePath = (name, i) => `/img/space-monsters/${name}-level-10-frame-0${i}.png`;
    CREATURES.forEach(c => { for (let i = 0; i < 4; i++) { const im = new Image(); im.src = framePath(c, i); } });

    // ── 스테이지별 단어 은행 ──
    const BANK = [
      [ // Stage 1: 기초
        { en: 'APPLE', ko: '사과' }, { en: 'DOG', ko: '개' }, { en: 'CAT', ko: '고양이' },
        { en: 'BOOK', ko: '책' }, { en: 'MILK', ko: '우유' }, { en: 'FISH', ko: '물고기' },
        { en: 'BIRD', ko: '새' }, { en: 'HOUSE', ko: '집' }, { en: 'WATER', ko: '물' },
        { en: 'MOON', ko: '달' }, { en: 'STAR', ko: '별' }, { en: 'TREE', ko: '나무' },
        { en: 'EGG', ko: '달걀' }, { en: 'HAND', ko: '손' }, { en: 'SUN', ko: '해' }, { en: 'BALL', ko: '공' }
      ],
      [ // Stage 2: 중급
        { en: 'SCHOOL', ko: '학교' }, { en: 'FAMILY', ko: '가족' }, { en: 'MORNING', ko: '아침' },
        { en: 'WINDOW', ko: '창문' }, { en: 'KITCHEN', ko: '부엌' }, { en: 'WEATHER', ko: '날씨' },
        { en: 'BRIDGE', ko: '다리' }, { en: 'MARKET', ko: '시장' }, { en: 'DOCTOR', ko: '의사' },
        { en: 'TEACHER', ko: '선생님' }, { en: 'RIVER', ko: '강' }, { en: 'MOUNTAIN', ko: '산' },
        { en: 'DINNER', ko: '저녁 식사' }, { en: 'FRIEND', ko: '친구' }, { en: 'GARDEN', ko: '정원' }, { en: 'CLOCK', ko: '시계' }
      ],
      [ // Stage 3: 우주 테마
        { en: 'PLANET', ko: '행성' }, { en: 'UNIVERSE', ko: '우주' }, { en: 'GALAXY', ko: '은하' },
        { en: 'GRAVITY', ko: '중력' }, { en: 'ENERGY', ko: '에너지' }, { en: 'SCIENCE', ko: '과학' },
        { en: 'FUTURE', ko: '미래' }, { en: 'MONSTER', ko: '괴물' }, { en: 'COURAGE', ko: '용기' },
        { en: 'JOURNEY', ko: '여행' }, { en: 'VICTORY', ko: '승리' }, { en: 'MEMORY', ko: '기억' },
        { en: 'DREAM', ko: '꿈' }, { en: 'ADVENTURE', ko: '모험' }, { en: 'PROMISE', ko: '약속' }, { en: 'ROCKET', ko: '로켓' }
      ]
    ];

    // 스테이지: 웨이브 제한시간(ms) — 3마리 읽고 조준할 시간
    const STAGE_DUR = [10000, 8000, 6500];
    const KILLS_PER_STAGE = 5;

    // 등장 지점: 바닥에서 솟아오르고, 천장에서 내려오고, 벽에서 미끄러져 들어옴
    const ENTRIES = [
      { name: 'floor',   sx: 50, sy: 118, ex: 50, ey: 62 },   // 바닥
      { name: 'ceiling', sx: 50, sy: -18, ex: 50, ey: 28 },   // 천장
      { name: 'wallL',   sx: -18, sy: 44, ex: 20, ey: 46 },   // 왼쪽 벽
      { name: 'wallR',   sx: 118, sy: 44, ex: 80, ey: 46 }    // 오른쪽 벽
    ];

    // 등장 후 바닥·천장·벽 사이를 랜덤으로 왔다갔다 — 박진감!
    function randAnchor() {
      const z = Math.floor(Math.random() * 4);
      if (z === 0) return { x: 18 + Math.random() * 64, y: 64 + Math.random() * 16 };  // 바닥
      if (z === 1) return { x: 18 + Math.random() * 64, y: 18 + Math.random() * 12 };  // 천장
      if (z === 2) return { x: 11 + Math.random() * 9,  y: 28 + Math.random() * 38 };  // 왼쪽 벽
      return               { x: 80 + Math.random() * 9,  y: 28 + Math.random() * 38 }; // 오른쪽 벽
    }

    let score = 0, stage = 1, lives = 3, kills = 0, timeLeft = 99;
    let gameActive = true;
    let wave = null; // { answer, monsters:[], born, dur, done }
    const learned = [];

    function pick(arr, n) {
      const pool = arr.slice();
      const out = [];
      while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      return out;
    }

    function monsterDiameter() {
      return Math.max(170, Math.min(340, Math.min(field.clientWidth, field.clientHeight) * 0.52));
    }

    function startWave() {
      if (!gameActive) return;
      field.querySelectorAll('.mon').forEach(m => m.remove());

      const words = pick(BANK[stage - 1], 3);   // [0]=정답
      const answer = words[0];
      const shuffledWords = pick(words, 3);
      const creatures = pick(CREATURES, 3);

      wave = { answer, born: performance.now(), dur: STAGE_DUR[stage - 1], done: false, monsters: [] };
      quizPrompt.textContent = '🎯 ' + answer.ko;

      const d = monsterDiameter();
      const entries = pick(ENTRIES, 3);          // 바닥/천장/벽 중 3곳 무작위
      const xSlots = pick([25, 50, 75], 3);      // 바닥·천장용 가로 위치 (겹침 방지)

      shuffledWords.forEach((w, i) => {
        const el = document.createElement('div');
        el.className = 'mon';
        el.style.setProperty('--d', d + 'px');
        el.innerHTML = '<div class="face"></div><div class="shield"></div><div class="tag"></div>';
        el.querySelector('.tag').textContent = w.en;
        field.appendChild(el);

        // 등장 경로 계산: 바닥/천장은 가로 슬롯 적용, 벽은 고정 경로
        const e = entries[i];
        let path;
        if (e.name === 'floor')        path = { sx: xSlots[i], sy: 118, ex: xSlots[i], ey: 60 };
        else if (e.name === 'ceiling') path = { sx: xSlots[i], sy: -18, ex: xSlots[i], ey: 30 };
        else                           path = { sx: e.sx, sy: e.sy, ex: e.ex, ey: e.ey };

        wave.monsters.push({
          el,
          face: el.querySelector('.face'),
          tag: el.querySelector('.tag'),
          word: w,
          correct: w.en === answer.en,
          creature: creatures[i],
          path,
          cx: path.sx, cy: path.sy,
          from: null, to: null, moveStart: 0, moveDur: 0, nextHopAt: 0,
          phase: i * 2.1,
          frame: -1,
          gone: false
        });
      });
    }

    // ── 메인 루프 (rAF): 3마리 동시 접근 ──
    function tick(now) {
      if (wave && !wave.done) {
        const p = Math.min(1, (now - wave.born) / wave.dur);

        for (const m of wave.monsters) {
          if (m.gone) continue;

          // 1단계(~22%): 바닥/천장/벽에서 화면 안으로 등장
          const emerge = Math.min(1, p / 0.22);
          let x, y;
          if (emerge < 1) {
            const eo = 1 - (1 - emerge) * (1 - emerge);   // easeOut
            x = m.path.sx + (m.path.ex - m.path.sx) * eo;
            y = m.path.sy + (m.path.ey - m.path.sy) * eo;
            m.cx = x; m.cy = y;
          } else {
            // 2단계: 바닥·천장·벽 사이를 랜덤으로 휙휙 이동하며 다가옴
            if (!m.nextHopAt || now >= m.nextHopAt) {
              m.from = { x: m.cx, y: m.cy };
              m.to = randAnchor();
              m.moveStart = now;
              m.moveDur = 550 + Math.random() * 350;
              // 머무는 시간: 스테이지 오를수록 짧아짐 = 더 정신없이 이동
              m.nextHopAt = now + m.moveDur + 400 + Math.random() * Math.max(300, 1400 - stage * 350);
            }
            const q = Math.min(1, (now - m.moveStart) / m.moveDur);
            const ei = q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2;  // easeInOut
            x = m.from.x + (m.to.x - m.from.x) * ei;
            y = m.from.y + (m.to.y - m.from.y) * ei;
            m.cx = x; m.cy = y;
          }

          const s = 0.2 + 0.8 * p * p;
          const sway = Math.sin(now / 420 + m.phase) * 10 * (1 - p);

          m.el.style.left = x + '%';
          m.el.style.top = y + '%';
          m.el.style.transform = `translate(-50%, -50%) translateX(${sway}px) scale(${s})`;

          // 단어판은 멀리 있어도 읽히게 역보정
          const k = Math.max(1, 0.5 / s);
          m.tag.style.transform = `translateX(-50%) scale(${k})`;

          // 괴물 프레임 순환 (개체별 위상차)
          const f = Math.floor(now / 220 + m.phase) % 4;
          if (f !== m.frame) {
            m.frame = f;
            m.face.style.backgroundImage = `url('${framePath(m.creature, f)}')`;
          }
        }

        dangerFill.style.width = (p * 100) + '%';
        if (p >= 1) monstersAttack();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ── 발사 ──
    function fire(x, y) {
      crosshair.classList.add('bang');
      setTimeout(() => crosshair.classList.remove('bang'), 70);
      const sp = document.createElement('div');
      sp.className = 'splash';
      sp.style.left = x + 'px'; sp.style.top = y + 'px';
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 400);

      if (!gameActive || !wave || wave.done) return;

      // 원형 판정: 클릭점이 괴물 원 안이면 명중
      let best = null, bestDist = Infinity;
      for (const m of wave.monsters) {
        if (m.gone) continue;
        const r = m.face.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const dist = Math.hypot(x - cx, y - cy);
        if (dist <= r.width / 2 + 12 && dist < bestDist) { best = m; bestDist = dist; }
      }
      if (!best) return;

      if (best.correct) killMonster(best);
      else deflect(best);
    }

    function speak(word) {
      try {
        const u = new SpeechSynthesisUtterance(word.toLowerCase());
        u.lang = 'en-US'; u.rate = 0.95;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function killMonster(m) {
      wave.done = true;
      m.el.classList.add('boom');
      wave.monsters.forEach(o => { if (o !== m) o.el.classList.add('flee'); });

      const timeBonus = Math.round((1 - (performance.now() - wave.born) / wave.dur) * 50);
      score += 100 + timeBonus;
      kills++;
      learned.push(wave.answer);
      scoreEl.textContent = score;
      wordsEl.textContent = learned.length;

      flash.className = ''; void flash.offsetWidth; flash.classList.add('hitfx');
      field.classList.add('shake'); setTimeout(() => field.classList.remove('shake'), 320);

      killPop.querySelector('.en').textContent = wave.answer.en;
      killPop.querySelector('.ko').textContent = wave.answer.ko + ' 맞춤! 괴물 퇴치!';
      killPop.querySelector('.pts').textContent = '+' + (100 + timeBonus);
      killPop.classList.remove('show'); void killPop.offsetWidth; killPop.classList.add('show');

      speak(wave.answer.en);

      fetch('/api/games/space-monster/hit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ score, creature: m.creature, stage, word: wave.answer.en })
      }).catch(() => {});

      if (kills >= stage * KILLS_PER_STAGE) {
        if (stage >= 3) return endGame(true);
        stage++;
        stageEl.textContent = stage + '/3';
      }
      setTimeout(startWave, 950);
    }

    function deflect(m) {
      // 오답 괴물: 방어막이 총알을 튕겨냄 + 전체가 확 다가옴
      m.el.classList.remove('deflect'); void m.el.offsetWidth; m.el.classList.add('deflect');
      m.el.classList.add('wrongHit');
      score = Math.max(0, score - 20);
      scoreEl.textContent = score;
      wave.born -= wave.dur * 0.22;
      field.classList.add('shake'); setTimeout(() => field.classList.remove('shake'), 320);
    }

    function sayOhNo() {
      try {
        const u = new SpeechSynthesisUtterance('Oh no!');
        u.lang = 'en-US'; u.rate = 1; u.pitch = 0.8;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function monstersAttack() {
      wave.done = true;
      lives--;
      livesEl.innerHTML = '&#9829;'.repeat(Math.max(0, lives)) + '<span style="opacity:.25">' + '&#9829;'.repeat(3 - Math.max(0, lives)) + '</span>';
      flash.className = ''; void flash.offsetWidth; flash.classList.add('hurtfx');
      field.classList.add('shake'); setTimeout(() => field.classList.remove('shake'), 320);

      // 저격수 피격: "Oh no!"
      sayOhNo();
      const oh = $('ohNo');
      oh.classList.remove('show'); void oh.offsetWidth; oh.classList.add('show');

      // 정답 괴물 공개 (학습 효과)
      const ans = wave.monsters.find(o => o.correct);
      if (ans) ans.el.classList.add('reveal');

      if (lives <= 0) {
        // 최후: 저격수 사망 — 카메라가 쓰러진다
        field.classList.add('dying');
        setTimeout(() => endGame(false), 1350);
        return;
      }
      setTimeout(startWave, 1500);
    }

    function endGame(win) {
      gameActive = false;
      wave = null;
      field.querySelectorAll('.mon').forEach(m => m.remove());
      clearInterval(timerInterval);

      $('modalTitle').textContent = win ? 'Mission Clear!' : 'Game Over';
      $('modalSub').textContent = win
        ? '모든 우주 괴물을 퇴치했습니다! · All monsters defeated!'
        : '다시 도전하면 더 많은 단어를 잡을 수 있어요! · Try again, hunter!';
      $('modalScore').textContent = 'Score ' + score + ' · Words ' + learned.length;

      const list = $('learnedList');
      list.innerHTML = '';
      if (learned.length === 0) {
        list.innerHTML = '<div class="row" style="text-align:center;color:#9fb3d6;">아직 없어요 — 다음에 도전! · None yet!</div>';
      } else {
        learned.forEach(w => {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = '<span class="en">' + w.en + '</span> &mdash; <span class="ko">' + w.ko + '</span>';
          list.appendChild(row);
        });
      }
      modal.classList.add('show');
    }

    // ── 입력 ──
    document.addEventListener('pointermove', (e) => {
      crosshair.style.left = e.clientX + 'px';
      crosshair.style.top = e.clientY + 'px';
    });
    document.addEventListener('pointerdown', (e) => {
      if (modal.classList.contains('show')) return;
      fire(e.clientX, e.clientY);
    });

    // ── 전체 타이머 ──
    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame(kills >= 10);
    }, 1000);

    startWave();
  </script>
