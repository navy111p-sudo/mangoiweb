<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    :root {
      --accent: #fbbf24;
      --good: #22c55e;
      --bad: #ef4444;
      --blue: #3b82f6;
      --tx: #e8f0ff;
      --sub: #9fb3d6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
      color: var(--tx);
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1b4d 100%);
      overflow: hidden;
      user-select: none;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #field {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center 30%, rgba(100,150,255,.15), transparent 50%),
                  linear-gradient(180deg, rgba(10,14,39,.4) 0%, rgba(26,26,62,.6) 50%, rgba(8,12,32,.8) 100%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(59,130,246,.3);
      background: rgba(8,16,34,.8);
    }

    .stat {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .stat .lab {
      font-size: 10px;
      color: var(--sub);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat .val {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #scoreVal { color: var(--accent); }
    #stageVal { color: var(--blue); }
    #timerVal { color: #7fd1ff; }

    .timer { margin-left: auto; }

    .target {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(59,130,246,.2);
      background: rgba(8,16,34,.6);
    }

    .target .hint {
      flex-basis: 100%;
      text-align: center;
      font-size: 11px;
      color: var(--sub);
      margin-bottom: 1px;
    }

    .chip {
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: 0.15s;
      position: relative;
      cursor: pointer;
    }

    .chip.next {
      background: rgba(251,191,36,.15);
      border: 2px solid rgba(251,191,36,.6);
      color: #fde68a;
      animation: pulse 1.1s infinite;
    }

    .chip.done {
      background: rgba(34,197,94,.15);
      border-color: rgba(34,197,94,.4);
      color: #86efac;
    }

    .chip.done::after {
      content: '✓';
      position: absolute;
      top: -7px;
      right: -5px;
      font-size: 10px;
      color: var(--good);
    }

    .chip.pending {
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.1);
      color: var(--sub);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(251,191,36,.55); }
      100% { box-shadow: 0 0 0 12px rgba(251,191,36,0); }
    }

    /* 괴물 애니메이션 */
    .monster {
      position: absolute;
      cursor: pointer;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 15px rgba(147,51,234,.6)) drop-shadow(0 0 8px rgba(100,150,255,.5));
      transition: filter 0.1s ease;
    }

    .monster:hover {
      filter: drop-shadow(0 0 20px rgba(251,191,36,.8)) drop-shadow(0 0 12px rgba(100,200,255,.7));
    }

    .monster.approach-center {
      left: 50%;
      bottom: 140px;
      animation: approachCenter 5s linear forwards;
    }

    .monster.approach-left {
      left: 10%;
      bottom: 120px;
      animation: approachLeft 5s linear forwards;
    }

    .monster.approach-right {
      right: 10%;
      bottom: 120px;
      animation: approachRight 5s linear forwards;
    }

    @keyframes approachCenter {
      0% {
        transform: translate(-50%, 0) scale(0.16);
        opacity: 0;
      }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% {
        transform: translate(-50%, 0) scale(1.0);
        opacity: 0;
      }
    }

    @keyframes approachLeft {
      0% {
        transform: translateX(0) scale(0.15);
        opacity: 0;
      }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% {
        transform: translateX(100px) scale(0.8);
        opacity: 0;
      }
    }

    @keyframes approachRight {
      0% {
        transform: translateX(0) scale(0.15);
        opacity: 0;
      }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% {
        transform: translateX(-100px) scale(0.8);
        opacity: 0;
      }
    }

    .monster.hit {
      animation: none !important;
      opacity: 0.2;
      filter: grayscale(100%);
    }

    /* 크로스헤어 */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 2px solid rgba(251,191,36,.7);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(251,191,36,.3);
      z-index: 100;
    }

    #crosshair::before {
      content: '';
      position: absolute;
      width: 1px;
      height: 24px;
      background: rgba(251,191,36,.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #crosshair::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 1px;
      background: rgba(251,191,36,.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 히트 이펙트 */
    .hit-fx {
      position: fixed;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(251,191,36,.8), transparent);
      border-radius: 50%;
      pointer-events: none;
      animation: hitPop 0.6s ease-out forwards;
      z-index: 99;
    }

    @keyframes hitPop {
      0% {
        transform: scale(0.5);
        opacity: 1;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* 게임 오버 */
    #gameOverModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    #gameOverModal.show {
      display: flex;
    }

    #gameOverModal h2 {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
    }

    #gameOverModal p {
      font-size: 18px;
      color: var(--sub);
    }

    #gameOverModal button {
      padding: 12px 24px;
      background: var(--accent);
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    #gameOverModal button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat">
        <div class="lab">Score</div>
        <div class="val" id="scoreVal">0</div>
      </div>
      <div class="stat">
        <div class="lab">Stage</div>
        <div class="val" id="stageVal">1/3</div>
      </div>
      <div class="stat timer">
        <div class="lab">Time</div>
        <div class="val" id="timerVal">60</div>
      </div>
      <div class="stat" style="margin-left: auto; flex-direction: row; gap: 4px;">
        <div style="width: 13px; height: 12px; background: var(--bad); border-radius: 2px; transform: rotate(-45deg);"></div>
        <div style="width: 13px; height: 12px; background: var(--bad); border-radius: 2px; transform: rotate(-45deg);"></div>
        <div style="width: 13px; height: 12px; background: rgba(255,255,255,.2); border-radius: 2px; transform: rotate(-45deg);"></div>
      </div>
    </div>

    <div class="target">
      <div class="hint">👽 외계 생명체를 퇴치하세요</div>
      <div class="chip next" id="targetWord1">TRIPOD</div>
      <div class="chip pending" id="targetWord2">BLOB</div>
      <div class="chip pending" id="targetWord3">SPIDER</div>
    </div>

    <div id="field"></div>
  </div>

  <div id="crosshair"></div>
  <div id="gameOverModal">
    <h2 id="gameOverTitle">Stage 1 Clear!</h2>
    <p id="gameOverText">Score: 0</p>
    <button id="gameOverBtn">Next Stage</button>
  </div>

  <script>
    const field = document.getElementById('field')
    const scoreEl = document.getElementById('scoreVal')
    const stageEl = document.getElementById('stageVal')
    const timerEl = document.getElementById('timerVal')
    const gameOverModal = document.getElementById('gameOverModal')
    const gameOverTitle = document.getElementById('gameOverTitle')
    const gameOverText = document.getElementById('gameOverText')
    const gameOverBtn = document.getElementById('gameOverBtn')

    let score = 0
    let timeLeft = 60
    let stage = 1
    let lives = 3
    let gameActive = true

    const creatures = [
      { name: 'tripod', word: 'TRIPOD', word_idx: 0 },
      { name: 'blob', word: 'BLOB', word_idx: 1 },
      { name: 'spider', word: 'SPIDER', word_idx: 2 },
      { name: 'cyclops', word: 'CYCLOPS', word_idx: 0 },
      { name: 'flyer', word: 'FLYER', word_idx: 1 },
      { name: 'tentacle', word: 'TENTACLE', word_idx: 2 },
      { name: 'armor', word: 'ARMOR', word_idx: 0 },
      { name: 'phantom', word: 'PHANTOM', word_idx: 1 }
    ]

    const approaches = ['approach-center', 'approach-left', 'approach-right']

    function getStageSettings(stageNum) {
      const settings = {
        1: { timeLimit: 60, spawnInterval: 2000, words: ['TRIPOD', 'BLOB', 'SPIDER'] },
        2: { timeLimit: 90, spawnInterval: 1500, words: ['CYCLOPS', 'FLYER', 'TENTACLE'] },
        3: { timeLimit: 120, spawnInterval: 1000, words: ['ARMOR', 'PHANTOM', 'TRIPOD'] }
      }
      return settings[stageNum] || settings[1]
    }

    function spawnMonster() {
      if (!gameActive || timeLeft <= 0) return

      const creature = creatures[Math.floor(Math.random() * creatures.length)]
      const approach = approaches[Math.floor(Math.random() * approaches.length)]

      const monster = document.createElement('div')
      monster.className = `monster ${approach}`
      monster.dataset.creature = creature.name
      monster.dataset.word = creature.word
      monster.title = creature.word
      monster.dataset.frameIndex = 0

      // Higgsfield 4K 실사 + PIL 벡터 혼합 (10 레벨, 4 프레임 애니메이션)
      const frameSizes = {
        1: { w: 80, h: 100 },
        2: { w: 120, h: 150 },
        3: { w: 160, h: 200 },
        4: { w: 200, h: 250 },
        5: { w: 240, h: 300 },
        6: { w: 280, h: 350 },
        7: { w: 320, h: 400 },
        8: { w: 360, h: 450 },
        9: { w: 420, h: 525 },
        10: { w: 500, h: 625 }
      }

      const frameCount = 4
      let frameIndex = 0
      let currentLevel = 1 // 시작: 가장 멀리서 가장 작은 이미지

      // Higgsfield 4K 스프라이트 목록 (실사 영화급)
      const creatures4k = ['tripod', 'blob', 'spider', 'cyclops']
      const use4k = creatures4k.includes(creature.name)

      const size = frameSizes[currentLevel]
      monster.style.width = size.w + 'px'
      monster.style.height = size.h + 'px'
      monster.dataset.level = currentLevel
      monster.dataset.quality = use4k ? '4k' : 'standard'

      // 애니메이션: 프레임 순환 + 동적 해상도
      const animateFrames = () => {
        if (monster.classList.contains('hit')) return

        // 접근 애니메이션에 따라 레벨 동적 변경 (점진적 zoom in 효과)
        // approachCenter: 0.16 ~ 1.0 scale (5초)
        // 현재 시간 기반으로 대략적인 레벨 추정
        const elapsed = performance.now() % 5000 // 5초 사이클
        const progress = elapsed / 5000 // 0 ~ 1
        const newLevel = Math.min(10, Math.max(1, Math.round(progress * 9 + 1)))

        if (currentLevel !== newLevel) {
          currentLevel = newLevel
          const newSize = frameSizes[newLevel]
          monster.style.width = newSize.w + 'px'
          monster.style.height = newSize.h + 'px'
          monster.dataset.level = newLevel
        }

        const framePath = `/img/space-monsters/${creature.name}-level-${String(currentLevel).padStart(2, '0')}-frame-${String(frameIndex).padStart(2, '0')}.png`
        monster.style.backgroundImage = `url('${framePath}')`
        frameIndex = (frameIndex + 1) % frameCount
        monster.dataset.frameIndex = frameIndex
      }

      animateFrames()
      const frameInterval = setInterval(() => {
        if (monster.parentElement && !monster.classList.contains('hit')) {
          animateFrames()
        } else {
          clearInterval(frameInterval)
        }
      }, 150) // 150ms마다 프레임 전환 (6.7fps, 더 부드러운 애니메이션)

      monster.onclick = (e) => {
        e.stopPropagation()
        if (monster.classList.contains('hit')) return

        monster.classList.add('hit')
        score += 100
        scoreEl.textContent = score

        // 히트 이펙트
        const hitFx = document.createElement('div')
        hitFx.className = 'hit-fx'
        hitFx.style.left = (e.clientX - 30) + 'px'
        hitFx.style.top = (e.clientY - 30) + 'px'
        document.body.appendChild(hitFx)
        setTimeout(() => hitFx.remove(), 600)

        // API 저장 (비동기, 오류 무시)
        fetch('/api/games/space-monster/hit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ score, creature: creature.name, stage, word: creature.word })
        }).catch(() => {})

        setTimeout(() => monster.remove(), 500)
      }

      field.appendChild(monster)

      // 5초 후 자동 제거
      setTimeout(() => {
        if (monster.parentElement && !monster.classList.contains('hit')) {
          lives--
          monster.remove()
          if (lives <= 0) endGame()
        }
      }, 5000)
    }

    function endStage() {
      gameActive = false
      clearInterval(spawnInterval)
      clearInterval(timerInterval)

      document.querySelectorAll('.monster').forEach(m => m.remove())

      if (stage < 3) {
        gameOverTitle.textContent = `Stage ${stage} Clear!`
        gameOverText.textContent = `Score: ${score}`
        gameOverBtn.textContent = 'Next Stage'
        gameOverModal.classList.add('show')
      } else {
        endGame()
      }
    }

    function endGame() {
      gameActive = false
      clearInterval(timerInterval)
      clearInterval(spawnInterval)

      gameOverTitle.textContent = 'Game Over!'
      gameOverText.textContent = `Final Score: ${score}`
      gameOverBtn.textContent = 'Restart'
      gameOverModal.classList.add('show')
    }

    function nextStage() {
      stage++
      if (stage > 3) {
        location.reload()
        return
      }

      gameOverModal.classList.remove('show')
      const settings = getStageSettings(stage)
      timeLeft = settings.timeLimit
      score = 0
      lives = 3

      stageEl.textContent = `${stage}/3`
      scoreEl.textContent = '0'
      gameActive = true

      startGame(settings.spawnInterval)
    }

    function startGame(spawnInterval) {
      // 타이머
      timerInterval = setInterval(() => {
        timeLeft--
        timerEl.textContent = timeLeft
        if (timeLeft <= 0) endStage()
      }, 1000)

      // 스폰 루프
      spawnInterval = setInterval(() => spawnMonster(), spawnInterval)
      window.spawnInterval = spawnInterval
    }

    // 이벤트 리스너
    gameOverBtn.onclick = nextStage

    // 게임 시작
    let timerInterval, spawnInterval
    const settings = getStageSettings(1)
    startGame(settings.spawnInterval)

    // 키보드 (테스트용)
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ') {
        const monsters = Array.from(document.querySelectorAll('.monster'))
        if (monsters.length > 0) {
          const random = monsters[Math.floor(Math.random() * monsters.length)]
          random.click()
        }
      }
    })
  </script>

</html>
