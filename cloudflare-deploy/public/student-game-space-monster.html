<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; }
    body { background: #04060f; color: #e8f0ff; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ── HUD ── */
    .hud {
      position: relative; z-index: 50; display: flex; align-items: center; gap: 18px;
      padding: 8px 16px; background: rgba(4, 8, 20, 0.88);
      border-bottom: 1px solid rgba(59, 130, 246, 0.35);
    }
    .stat { display: flex; flex-direction: column; line-height: 1.15; }
    .stat .label { font-size: 10px; color: #9fb3d6; letter-spacing: 1px; }
    .stat .value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #scoreVal { color: #fbbf24; } #stageVal { color: #60a5fa; }
    #sentVal { color: #4ade80; } #timerVal { color: #7fd1ff; }
    #livesVal { color: #ef4444; font-size: 16px; letter-spacing: 2px; }
    #sfxBtn {
      margin-left: 8px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      color: #cfe0ff; font-size: 13px; font-weight: 700;
    }

    /* ── 문장 조립 바 ── */
    .quizbar {
      position: relative; z-index: 50; text-align: center; padding: 7px 12px;
      background: rgba(4, 8, 20, 0.8); border-bottom: 1px solid rgba(251, 191, 36, 0.25);
    }
    .quizbar .ko { font-size: 17px; font-weight: 800; color: #fde68a; }
    .slots { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 5px; }
    .slot {
      min-width: 66px; padding: 5px 13px; border-radius: 8px;
      font-size: 15px; font-weight: 800; letter-spacing: 1px;
      background: rgba(255,255,255,.05); border: 2px dashed rgba(255,255,255,.22); color: #6c7fa0;
    }
    .slot.next { border-style: solid; border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,.14); animation: slotPulse 1.1s infinite; }
    .slot.done { border-style: solid; border-color: #22c55e; color: #86efac; background: rgba(34,197,94,.16); }
    @keyframes slotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.5); } 50% { box-shadow: 0 0 0 8px rgba(251,191,36,0); } }
    .quizbar .guide { font-size: 11px; color: #9fb3d6; margin-top: 4px; }

    /* ── 전장: 우주선 복도 ── */
    #field {
      flex: 1; position: relative; overflow: hidden; cursor: none;
      background: #04060f;
    }
    #corridorZoom {
      position: absolute; inset: -3%;
      background: #04060f url('/img/space-corridor.webp') center 46% / cover no-repeat;
      filter: brightness(.62) saturate(.9);   /* 괴물이 배경보다 밝게 튀어나오도록 */
      will-change: transform;
    }
    #depthFog {
      position: absolute; inset: 0; pointer-events: none; z-index: 20;
      background: radial-gradient(ellipse 88% 84% at 50% 46%, transparent 46%, rgba(3,5,12,.62) 100%);
    }
    #field.shake { animation: shake .3s; }
    @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -12px; } 50% { margin-left: 10px; } 75% { margin-left: -6px; } }

    #dangerBar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; z-index: 46; background: rgba(255,255,255,.08); }
    #dangerFill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #fbbf24 55%, #ef4444); }

    #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 40; }
    #flash.hitfx { background: rgba(255,250,220,.8); animation: flashOut .25s ease-out; }
    #flash.hurtfx { background: rgba(255,30,30,.5); animation: flashOut .5s ease-out; }
    @keyframes flashOut { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ── 괴물 ── */
    .mon { position: absolute; z-index: 30; width: var(--d); height: calc(var(--d)*1.25); will-change: transform; --aura: 150,70,255; }
    /* 배경 제거된 알파 스프라이트 12프레임 세로 스트립 — 괴물만 보인다 */
    .mon .face {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background-repeat: no-repeat;
      background-size: 100% 1200%;
      background-position-x: 50%;
      background-position-y: 0%;   /* 프레임은 rAF 에서 직접 계산 (백분율 좌표계 함정 회피) */
      filter: brightness(1.18) contrast(1.1) saturate(1.25) drop-shadow(0 6px 18px rgba(0,0,0,.85)) drop-shadow(0 0 16px rgba(var(--aura),.5));
    }
    .mon .glow {
      position: absolute; left: 50%; top: 46%; width: 126%; height: 102%;
      transform: translate(-50%,-50%); pointer-events: none;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(var(--aura),.34), transparent 68%);
      animation: auraPulse 1.6s ease-in-out infinite;
    }
    @keyframes auraPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

    /* 워프 등장 */
    .mon .warp {
      position: absolute; left: 50%; top: 46%; width: 130%; height: 106%;
      transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,255,255,.9), rgba(var(--aura),.7) 40%, transparent 72%);
    }
    .mon.warpin .warp { animation: warpFx .9s ease-out; }
    .mon.warpin .face { animation: warpFace .9s ease-out; }
    @keyframes warpFx {
      0% { opacity: 1; transform: translate(-50%,-50%) scale(.15); }
      55% { opacity: .8; transform: translate(-50%,-50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.35); }
    }
    @keyframes warpFace {
      0% { opacity: 0; filter: brightness(4) blur(6px); }
      50% { opacity: 1; filter: brightness(2) blur(1px); }
      100% { opacity: 1; filter: brightness(1.18) contrast(1.1) saturate(1.25) drop-shadow(0 6px 18px rgba(0,0,0,.85)) drop-shadow(0 0 16px rgba(var(--aura),.5)); }
    }

    /* 피격 스파크 */
    .spark {
      position: fixed; width: 6px; height: 6px; border-radius: 50%;
      background: #ffe89a; box-shadow: 0 0 10px rgba(255,220,120,.95);
      pointer-events: none; z-index: 97;
    }
    .mon .tag {
      position: absolute; left: 50%; bottom: 1%; transform: translateX(-50%);
      transform-origin: center bottom; z-index: 3;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(6,12,32,.35); border: 1px solid rgba(251,191,36,.45);
      backdrop-filter: blur(2px);
      font-size: 13px; font-weight: 800; letter-spacing: 1px;
      color: rgba(255,255,255,.9); white-space: nowrap;
      text-shadow: 0 1px 5px rgba(0,0,0,.95);
    }
    .mon.wrongHit .tag { border-color: rgba(239,68,68,.7); color: #fca5a5; background: rgba(60,8,8,.45); }
    .mon .shield {
      position: absolute; inset: -4%; border-radius: 50%;
      border: 3px solid rgba(120,200,255,.9);
      box-shadow: 0 0 30px rgba(120,200,255,.8), inset 0 0 24px rgba(120,200,255,.35);
      opacity: 0; pointer-events: none; z-index: 2;
    }
    .mon.deflect .shield { animation: deflectFx .45s ease-out; }
    @keyframes deflectFx { 0% { opacity: 1; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.14); } }
    .mon.reveal .glow { background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(34,197,94,.55), transparent 68%); }
    .mon.reveal .tag { border-color: #22c55e; }
    .mon.boom .face, .mon.boom .tag, .mon.boom .glow { animation: boomFx .5s ease-out forwards; }
    @keyframes boomFx {
      0% { filter: brightness(2.6) saturate(1.6); opacity: 1; }
      40% { filter: brightness(3.2) saturate(2); opacity: 1; transform: scale(1.14); }
      100% { filter: brightness(4); opacity: 0; transform: scale(1.55); }
    }
    .mon.flee { transition: opacity .45s ease-out; opacity: 0 !important; }

    /* 저격수 사망 */
    #field.dying { animation: die 1.25s ease-in forwards; }
    @keyframes die {
      0% { transform: none; filter: none; }
      30% { transform: rotate(-3deg); }
      100% { transform: rotate(22deg) translateY(30%) scale(1.06); filter: brightness(.3) saturate(.5) blur(2px); }
    }
    #ohNo {
      position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%);
      z-index: 60; font-size: 54px; font-weight: 900; color: #ff5a5a; letter-spacing: 2px;
      text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 24px rgba(255,60,60,.6); opacity: 0; pointer-events: none;
    }
    #ohNo.show { animation: ohNoPop 1.2s ease-out forwards; }
    @keyframes ohNoPop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.5) rotate(-4deg); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(2deg); }
      30% { transform: translate(-50%,-50%) scale(1); }
      80% { opacity: 1; } 100% { opacity: 0; }
    }

    #killPop {
      position: absolute; top: 24%; left: 50%; transform: translate(-50%,-50%) scale(.6);
      z-index: 45; text-align: center; opacity: 0; pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.95);
    }
    #killPop .en { font-size: 34px; font-weight: 900; color: #fbbf24; letter-spacing: 3px; }
    #killPop .ko { font-size: 17px; font-weight: 700; color: #e8f0ff; margin-top: 2px; }
    #killPop .pts { font-size: 19px; font-weight: 800; color: #4ade80; margin-top: 3px; }
    #killPop.show { animation: popIn 1.2s ease-out forwards; }
    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
      25% { transform: translate(-50%,-50%) scale(1); }
      78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-62%) scale(1); }
    }

    #crosshair {
      position: fixed; width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border: 2px solid rgba(251,191,36,.85); border-radius: 50%;
      pointer-events: none; z-index: 100;
      box-shadow: 0 0 12px rgba(251,191,36,.35), inset 0 0 10px rgba(251,191,36,.15);
      transition: transform .06s;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(251,191,36,.8); top: 50%; left: 50%; }
    #crosshair::before { width: 2px; height: 28px; transform: translate(-50%,-50%); }
    #crosshair::after { width: 28px; height: 2px; transform: translate(-50%,-50%); }
    #crosshair.bang { transform: scale(.78); }

    .splash {
      position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,235,150,.95), rgba(255,120,40,.55) 40%, transparent 70%);
      pointer-events: none; z-index: 95; animation: splashPop .4s ease-out forwards;
    }
    @keyframes splashPop { 0% { transform: scale(.35); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

    #modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 200; flex-direction: column; align-items: center; justify-content: center;
      gap: 11px; text-align: center; padding: 20px;
    }
    #modal.show { display: flex; }
    #modal h2 { font-size: 36px; font-weight: 900; color: #fbbf24; }
    #modal .sub { font-size: 15px; color: #9fb3d6; }
    #modal .score { font-size: 23px; font-weight: 800; color: #e8f0ff; }
    #learnedBox {
      max-width: 460px; width: 100%; max-height: 190px; overflow-y: auto;
      background: rgba(255,255,255,.05); border: 1px solid rgba(251,191,36,.25);
      border-radius: 12px; padding: 12px 16px; text-align: left;
    }
    #learnedBox .t { font-size: 12px; color: #9fb3d6; margin-bottom: 6px; text-align: center; }
    #learnedBox .row { font-size: 14px; font-weight: 700; padding: 4px 0; }
    #learnedBox .row .en { color: #fde68a; }
    #learnedBox .row .ko { color: #cfe0ff; font-weight: 500; }
    #modal button {
      margin-top: 5px; padding: 13px 30px; background: #fbbf24; color: #111;
      border: none; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
      <div class="stat"><div class="label">STAGE</div><div class="value" id="stageVal">1/3</div></div>
      <div class="stat"><div class="label">LIFE</div><div class="value" id="livesVal">&#9829;&#9829;&#9829;</div></div>
      <div class="stat"><div class="label">문장</div><div class="value" id="sentVal">0</div></div>
      <div class="stat" style="margin-left:auto;"><div class="label">TIME</div><div class="value" id="timerVal">120</div></div>
      <button id="sfxBtn" type="button">&#9835; 소리 ON</button>
    </div>

    <div class="quizbar">
      <div class="ko" id="sentKo">READY</div>
      <div class="slots" id="slots"></div>
      <div class="guide"><b>어순대로</b> 괴물을 쏴서 문장을 완성하세요! &middot; Shoot the monsters in the right word order!</div>
    </div>

    <div id="field">
      <div id="corridorZoom"></div>
      <div id="depthFog"></div>
      <div id="flash"></div>
      <div id="killPop"><div class="en"></div><div class="ko"></div><div class="pts">+100</div></div>
      <div id="ohNo">Oh no!</div>
      <div id="dangerBar"><div id="dangerFill"></div></div>
    </div>
  </div>

  <div id="crosshair" style="top:50%; left:50%;"></div>

  <div id="modal">
    <h2 id="modalTitle">Game Over</h2>
    <div class="sub" id="modalSub"></div>
    <div class="score" id="modalScore"></div>
    <div id="learnedBox"><div class="t">오늘 완성한 문장 &middot; Sentences you built</div><div id="learnedList"></div></div>
    <button onclick="location.reload()">다시 도전 &middot; Retry</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const field = $('field'), flash = $('flash'), zoom = $('corridorZoom');
    const killPop = $('killPop'), crosshair = $('crosshair');
    const scoreEl = $('scoreVal'), stageEl = $('stageVal'), timerEl = $('timerVal');
    const livesEl = $('livesVal'), sentEl = $('sentVal');
    const sentKo = $('sentKo'), slotsEl = $('slots'), dangerFill = $('dangerFill');
    const modal = $('modal'), sfxBtn = $('sfxBtn');

    /* ═══ 효과음 (Web Audio 합성) ═══ */
    let AC = null, sfxOn = true, noiseBuf = null;
    function ac() {
      if (!AC) {
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        const len = AC.sampleRate * 2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }
    function env(node, a, peak, dur) {
      const c = ac(); if (!c) return;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(peak, c.currentTime + a);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      node.connect(g); g.connect(c.destination); return g;
    }
    function noise(dur, peak, type, f0, f1) {
      const c = ac(); if (!c || !sfxOn) return;
      const s = c.createBufferSource(); s.buffer = noiseBuf;
      const f = c.createBiquadFilter(); f.type = type;
      f.frequency.setValueAtTime(f0, c.currentTime);
      f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), c.currentTime + dur);
      s.connect(f); env(f, 0.004, peak, dur);
      s.start(); s.stop(c.currentTime + dur + 0.02);
    }
    function tone(type, f0, f1, dur, peak, delay) {
      const c = ac(); if (!c || !sfxOn) return;
      const t = c.currentTime + (delay || 0);
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }
    const sfxShot = () => { tone('square',1400,180,.14,.16); noise(.09,.20,'highpass',2600,700); tone('sine',320,60,.16,.10); };
    const sfxDeflect = () => { tone('sine',2400,900,.20,.14); tone('triangle',1700,620,.26,.09,.03); noise(.10,.10,'bandpass',3200,1800); };
    const sfxKill = () => { noise(.55,.32,'lowpass',1800,90); tone('sawtooth',180,34,.5,.20); tone('square',900,300,.16,.10); };
    const sfxGrowl = (pitch) => {
      const c = ac(); if (!c || !sfxOn) return;
      const k = pitch || 1;
      const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(88*k,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(52*k,c.currentTime+.75);
      lfo.type='sine'; lfo.frequency.value=17; lg.gain.value=26;
      lfo.connect(lg); lg.connect(o.frequency);
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
      o.connect(f); env(f,.05,.20,.8);
      o.start(); lfo.start(); o.stop(c.currentTime+.85); lfo.stop(c.currentTime+.85);
    };
    const sfxHurt = () => { noise(.34,.30,'lowpass',700,70); tone('sawtooth',260,70,.4,.18); };
    const sfxDeath = () => { tone('sawtooth',220,28,1.5,.24); tone('sine',130,22,1.7,.18,.08); noise(1.1,.16,'lowpass',900,60); };
    const sfxClear = () => { [523,659,784,1047].forEach((f,i)=>tone('triangle',f,f,.22,.14,i*.1)); };
    sfxBtn.onclick = (e) => {
      e.stopPropagation(); sfxOn = !sfxOn;
      sfxBtn.innerHTML = sfxOn ? '&#9835; 소리 ON' : '&#9834; 소리 OFF';
      if (sfxOn) { ac(); sfxShot(); }
    };

    /* ═══ 에셋 ═══ */
    // Higgsfield 4K 실사 8종 (각자 고유 오라 색·포효 음높이)
    // blob/spider/armor 는 그린스크린으로 재생성해 크로마키로 정확히 배경 제거함
    const CREATURES = [
      { n:'tripod',   aura:'80,255,150',  pitch:0.85 },
      { n:'cyclops',  aura:'255,90,60',   pitch:0.55 },
      { n:'flyer',    aura:'90,180,255',  pitch:1.55 },
      { n:'tentacle', aura:'255,170,60',  pitch:1.05 },
      { n:'phantom',  aura:'150,255,235', pitch:1.4  },
      { n:'blob',     aura:'255,140,60',  pitch:0.65 },
      { n:'spider',   aura:'190,90,255',  pitch:1.25 },
      { n:'armor',    aura:'150,200,255', pitch:0.75 }
    ];
    // 배경 제거된 알파 스프라이트 시트 (12프레임 세로 스트립)
    const sheetPath = (n) => `/img/space-monsters/${n}-sheet.webp`;
    CREATURES.forEach(c => { const im = new Image(); im.src = sheetPath(c.n); });

    /* ═══ 문장 은행 (스테이지별: 3 → 4 → 5단어) ═══ */
    const SENTENCES = [
      [
        { en:['I','LIKE','APPLES'],      ko:'나는 사과를 좋아해요' },
        { en:['THE','DOG','RUNS'],       ko:'그 개가 달려요' },
        { en:['WE','READ','BOOKS'],      ko:'우리는 책을 읽어요' },
        { en:['SHE','DRINKS','MILK'],    ko:'그녀는 우유를 마셔요' },
        { en:['BIRDS','CAN','FLY'],      ko:'새들은 날 수 있어요' },
        { en:['I','SEE','STARS'],        ko:'나는 별을 봐요' },
        { en:['THE','SUN','SHINES'],     ko:'해가 빛나요' },
        { en:['CATS','LOVE','FISH'],     ko:'고양이는 물고기를 좋아해요' }
      ],
      [
        { en:['I','GO','TO','SCHOOL'],       ko:'나는 학교에 가요' },
        { en:['WE','EAT','GOOD','DINNER'],   ko:'우리는 맛있는 저녁을 먹어요' },
        { en:['MY','FRIEND','IS','KIND'],    ko:'내 친구는 친절해요' },
        { en:['THE','WEATHER','IS','SUNNY'], ko:'날씨가 화창해요' },
        { en:['SHE','OPENS','THE','WINDOW'], ko:'그녀가 창문을 열어요' },
        { en:['I','WALK','EVERY','MORNING'], ko:'나는 매일 아침 걸어요' },
        { en:['THE','TEACHER','HELPS','US'], ko:'선생님이 우리를 도와줘요' },
        { en:['WE','CROSS','THE','BRIDGE'],  ko:'우리는 다리를 건너요' }
      ],
      [
        { en:['THE','ROCKET','FLIES','TO','MARS'],       ko:'로켓이 화성으로 날아가요' },
        { en:['WE','EXPLORE','THE','WIDE','UNIVERSE'],   ko:'우리는 넓은 우주를 탐험해요' },
        { en:['COURAGE','HELPS','US','REACH','DREAMS'],  ko:'용기는 우리가 꿈에 닿게 해줘요' },
        { en:['THE','GALAXY','HAS','MANY','PLANETS'],    ko:'은하에는 행성이 많이 있어요' },
        { en:['SCIENCE','OPENS','THE','BRIGHT','FUTURE'],ko:'과학은 밝은 미래를 열어요' },
        { en:['OUR','JOURNEY','BEGINS','WITH','HOPE'],   ko:'우리의 여행은 희망으로 시작해요' }
      ]
    ];

    // 스테이지별 접근 속도 범위(ms) — 괴물마다 랜덤
    const SPEED = [ [11000,15000], [9000,12500], [7500,10500] ];
    const SENTENCES_PER_STAGE = 2;

    let score = 0, stage = 1, lives = 3, cleared = 0, timeLeft = 120;
    let gameActive = true;
    let wave = null;
    const built = [];
    const usedIdx = [[],[],[]];

    function pick(arr, n) {
      const pool = arr.slice(), out = [];
      while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      return out;
    }
    function rnd(a,b){ return a + Math.random()*(b-a); }

    // 복도 안 면(바닥/천장/좌벽/우벽) — 소실점 기준 방향
    function randSurface(zone) {
      const z = (zone === undefined) ? Math.floor(Math.random()*4) : zone;
      if (z===0) return { dx:(Math.random()-.5)*1.3, dy: 0.95, z };   // 바닥
      if (z===1) return { dx:(Math.random()-.5)*1.3, dy:-0.92, z };   // 천장
      if (z===2) return { dx:-1.06, dy:(Math.random()-.5)*1.1, z };   // 좌벽
      return              { dx: 1.06, dy:(Math.random()-.5)*1.1, z }; // 우벽
    }

    // 다른 괴물들과 최대한 떨어진 목적지를 고른다 (같은 면이면 감점)
    function pickSurface(avoid) {
      if (!avoid || !avoid.length) return randSurface();
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < 28; i++) {
        const c = randSurface();
        let score = Infinity;
        for (const a of avoid) {
          const d = Math.hypot(c.dx - a.dx, c.dy - a.dy) + (c.z === a.z ? 0 : 1.1);
          if (d < score) score = d;
        }
        if (score > bestScore) { bestScore = score; best = c; }
      }
      return best;
    }

    function renderSlots() {
      slotsEl.innerHTML = '';
      wave.words.forEach((w,i) => {
        const s = document.createElement('div');
        s.className = 'slot' + (i < wave.next ? ' done' : (i === wave.next ? ' next' : ''));
        s.textContent = i < wave.next ? w : '＿＿';
        slotsEl.appendChild(s);
      });
    }

    function startWave() {
      if (!gameActive) return;
      field.querySelectorAll('.mon').forEach(m => m.remove());

      const bank = SENTENCES[stage-1];
      let idx = Math.floor(Math.random()*bank.length);
      let guard = 0;
      while (usedIdx[stage-1].includes(idx) && guard++ < 20) idx = Math.floor(Math.random()*bank.length);
      usedIdx[stage-1].push(idx);
      const S = bank[idx];

      wave = { sentence: S, words: S.en, next: 0, monsters: [], failed: false };
      sentKo.textContent = '🎯 ' + S.ko;
      renderSlots();

      // 매 웨이브 서로 다른 괴물 종을 뽑는다 (8종 전부 등장)
      const shuffledCreatures = pick(CREATURES, S.en.length);
      shuffledCreatures.forEach((c, k) => setTimeout(() => sfxGrowl(c.pitch), k * 260));
      const now = performance.now();
      const [lo,hi] = SPEED[stage-1];
      const zonePool = pick([0,1,2,3], 4);   // 처음 4마리는 서로 다른 면에서 등장

      S.en.forEach((w, i) => {
        const cre = shuffledCreatures[i];
        const el = document.createElement('div');
        el.className = 'mon warpin';
        el.style.setProperty('--aura', cre.aura);
        el.innerHTML =
          '<div class="warp"></div><div class="glow"></div>' +
          '<div class="face"></div>' +
          '<div class="shield"></div><div class="tag"></div>';
        const face = el.querySelector('.face');
        face.style.backgroundImage = `url('${sheetPath(cre.n)}')`;
        el.querySelector('.tag').textContent = w;
        field.appendChild(el);
        setTimeout(() => el.classList.remove('warpin'), 900);

        const start = randSurface(zonePool[i % 4]);
        wave.monsters.push({
          el, face, tag: el.querySelector('.tag'),
          word: w, order: i, creature: cre,
          born: now + i * rnd(180, 700),      // 시차를 두고 몰려나온다
          dur: rnd(lo, hi),                    // 괴물마다 다른 속도
          cur: start, from: start, to: start,
          moveStart: now, moveDur: 1, nextHopAt: 0,
          phase: i * 1.7, dead: false,
          frame: -1, frameMs: 78 + Math.random() * 60   // 개체마다 다른 움직임 속도
        });
      });
    }

    /* ═══ 루프 ═══ */
    function tick(now) {
      // 복도가 미세하게 다가오는 전진감
      zoom.style.transform = `scale(${1 + 0.02 * (1 + Math.sin(now/2600))})`;

      if (wave && !wave.failed) {
        const W = field.clientWidth, H = field.clientHeight;
        const vpx = W*0.5, vpy = H*0.46;
        let maxP = 0;

        const live = wave.monsters.filter(m => !m.dead);
        let reached = null;

        // ── 1패스: 위치 계산 ──
        for (const m of live) {
          const p = Math.max(0, Math.min(1, (now - m.born) / m.dur));
          if (p > maxP) maxP = p;
          if (p >= 1 && !reached) reached = m;

          if (!m.nextHopAt || now >= m.nextHopAt) {
            // 다른 괴물들의 목적지를 피해서 다음 지점을 고른다
            const avoid = live.filter(o => o !== m).map(o => o.to);
            m.from = m.cur; m.to = pickSurface(avoid);
            m.moveStart = now; m.moveDur = rnd(600, 1050);
            m.nextHopAt = now + m.moveDur + rnd(260, Math.max(320, 1500 - stage*300 - p*800));
          }
          const q = Math.min(1, (now - m.moveStart) / m.moveDur);
          const ei = q < .5 ? 2*q*q : 1 - Math.pow(-2*q+2,2)/2;
          m.cur = { dx: m.from.dx + (m.to.dx-m.from.dx)*ei, dy: m.from.dy + (m.to.dy-m.from.dy)*ei, z: m.to.z };

          const depth = 0.05 + 0.95 * p * p;
          m._depth = depth;
          m._d = Math.max(30, Math.min(W,H) * (0.09 + 0.60*depth));
          m._x = vpx + m.cur.dx * (W*0.46*depth);
          m._y = vpy + m.cur.dy * (H*0.42*depth) + Math.sin(now/190 + m.phase)*6*depth;
        }

        // ── 2패스: 화면상 겹침 밀어내기 ──
        for (let iter = 0; iter < 3; iter++) {
          for (let a = 0; a < live.length; a++) {
            for (let b = a + 1; b < live.length; b++) {
              const A = live[a], B = live[b];
              const minSep = (A._d + B._d) * 0.40;
              let ddx = B._x - A._x, ddy = (B._y - A._y) * 1.15;
              let dist = Math.hypot(ddx, ddy);
              if (dist < 0.001) { ddx = (a % 2 ? 1 : -1); ddy = 0; dist = 1; }
              if (dist >= minSep) continue;
              const push = (minSep - dist) / 2;
              const ux = ddx / dist, uy = ddy / dist;
              // 가까이 온(큰) 괴물일수록 덜 밀린다
              const sum = A._d + B._d;
              const wA = B._d / sum, wB = A._d / sum;
              A._x -= ux * push * 2 * wA; A._y -= uy * push * 2 * wA;
              B._x += ux * push * 2 * wB; B._y += uy * push * 2 * wB;
            }
          }
        }

        // ── 3패스: 화면 안으로 가두고 그리기 ──
        for (const m of live) {
          m._x = Math.max(m._d*0.30, Math.min(W - m._d*0.30, m._x));
          m._y = Math.max(m._d*0.34, Math.min(H - m._d*0.26, m._y));

          m.el.style.setProperty('--d', m._d+'px');
          m.el.style.left = m._x+'px'; m.el.style.top = m._y+'px';
          m.el.style.transform = 'translate(-50%,-50%)';
          m.el.style.zIndex = 30 + Math.round(m._depth*40);
          m.tag.style.transform = `translateX(-50%) scale(${Math.max(.9, Math.min(1.12, 120/m._d))})`;

          // 12프레임 스프라이트: 이미지가 박스의 12배 높이 → 프레임 k 는 k*(100/11)%
          const fi = Math.floor(now / m.frameMs + m.phase * 3) % 12;
          if (fi !== m.frame) {
            m.frame = fi;
            m.face.style.backgroundPositionY = (fi * (100 / 11)).toFixed(3) + '%';
          }
        }

        dangerFill.style.width = (maxP*100) + '%';
        if (reached) monsterReached(reached);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    /* ═══ 발사 ═══ */
    function fire(x, y) {
      sfxShot();
      crosshair.classList.add('bang');
      setTimeout(()=>crosshair.classList.remove('bang'), 70);
      const sp = document.createElement('div');
      sp.className = 'splash'; sp.style.left = x+'px'; sp.style.top = y+'px';
      document.body.appendChild(sp); setTimeout(()=>sp.remove(), 400);

      if (!gameActive || !wave || wave.failed) return;

      let best = null, bestD = Infinity;
      for (const m of wave.monsters) {
        if (m.dead) continue;
        const r = m.el.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height*0.46;
        const rx = r.width*0.5 + 14, ry = r.height*0.42 + 14;
        const nx = (x-cx)/rx, ny = (y-cy)/ry;
        const dd = nx*nx + ny*ny;
        if (dd <= 1 && dd < bestD) { best = m; bestD = dd; }
      }
      if (!best) return;
      (best.order === wave.next) ? hitCorrect(best) : hitWrong(best);
    }

    function speak(text, rate) {
      try {
        const u = new SpeechSynthesisUtterance(text.toLowerCase());
        u.lang='en-US'; u.rate = rate || 0.95;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch(e) {}
    }

    function sparks(x, y, tint) {
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = x+'px'; s.style.top = y+'px';
        if (tint) s.style.background = 'rgb(' + tint + ')';
        document.body.appendChild(s);
        const a = Math.random()*Math.PI*2, dist = 40 + Math.random()*120;
        s.animate([
          { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
          { transform:`translate(${Math.cos(a)*dist-6}px, ${Math.sin(a)*dist-6}px) scale(.2)`, opacity:0 }
        ], { duration: 420 + Math.random()*260, easing:'cubic-bezier(.2,.7,.3,1)' });
        setTimeout(()=>s.remove(), 720);
      }
    }

    function hitCorrect(m) {
      sfxKill();
      m.dead = true;
      const r = m.el.getBoundingClientRect();
      sparks(r.left + r.width/2, r.top + r.height*0.45, m.creature.aura);
      m.el.classList.add('boom');
      setTimeout(()=>m.el.remove(), 520);

      wave.next++;
      score += 60;
      scoreEl.textContent = score;
      renderSlots();
      flash.className=''; void flash.offsetWidth; flash.classList.add('hitfx');
      field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'), 300);
      speak(m.word);

      if (wave.next >= wave.words.length) completeSentence();
    }

    function hitWrong(m) {
      sfxDeflect();
      m.el.classList.remove('deflect'); void m.el.offsetWidth; m.el.classList.add('deflect');
      m.el.classList.add('wrongHit');
      score = Math.max(0, score - 20);
      scoreEl.textContent = score;
      // 오답 = 그 괴물이 확 다가온다
      m.born -= m.dur * 0.16;
      field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'), 300);
    }

    function completeSentence() {
      const S = wave.sentence;
      const bonus = 120;
      score += bonus; cleared++;
      built.push(S);
      scoreEl.textContent = score;
      sentEl.textContent = cleared;

      wave.monsters.forEach(o => { if (!o.dead) { o.dead = true; o.el.classList.add('flee'); } });

      killPop.querySelector('.en').textContent = S.en.join(' ');
      killPop.querySelector('.ko').textContent = S.ko;
      killPop.querySelector('.pts').textContent = '문장 완성! +' + bonus;
      killPop.classList.remove('show'); void killPop.offsetWidth; killPop.classList.add('show');
      setTimeout(()=>speak(S.en.join(' '), 0.9), 320);
      sfxClear();

      fetch('/api/games/space-monster/hit', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ score, creature:'sentence', stage, word: S.en.join(' ') })
      }).catch(()=>{});

      wave.failed = true;   // 루프 정지
      if (cleared >= stage * SENTENCES_PER_STAGE) {
        if (stage >= 3) { setTimeout(()=>endGame(true), 1500); return; }
        stage++; stageEl.textContent = stage + '/3';
      }
      setTimeout(startWave, 1800);
    }

    function sayOhNo() {
      try {
        const u = new SpeechSynthesisUtterance('Oh no!');
        u.lang='en-US'; u.rate=1; u.pitch=0.8;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch(e) {}
    }

    function monsterReached(m) {
      wave.failed = true;
      lives--;
      livesEl.innerHTML = '&#9829;'.repeat(Math.max(0,lives)) + '<span style="opacity:.25">' + '&#9829;'.repeat(3-Math.max(0,lives)) + '</span>';
      flash.className=''; void flash.offsetWidth; flash.classList.add('hurtfx');
      field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'), 320);

      const oh = $('ohNo');
      oh.classList.remove('show'); void oh.offsetWidth; oh.classList.add('show');
      sayOhNo();

      // 정답이었어야 할 괴물 공개
      const nx = wave.monsters.find(o => !o.dead && o.order === wave.next);
      if (nx) nx.el.classList.add('reveal');

      if (lives <= 0) {
        sfxDeath();
        field.classList.add('dying');
        setTimeout(()=>endGame(false), 1350);
        return;
      }
      sfxHurt();
      setTimeout(startWave, 1700);
    }

    function endGame(win) {
      gameActive = false; wave = null;
      field.querySelectorAll('.mon').forEach(m => m.remove());
      clearInterval(timerInterval);
      if (win) sfxClear();

      $('modalTitle').textContent = win ? 'Mission Clear!' : 'Game Over';
      $('modalSub').textContent = win
        ? '모든 우주 괴물을 퇴치했습니다! · All monsters defeated!'
        : '다시 도전하면 더 많은 문장을 완성할 수 있어요! · Try again, hunter!';
      $('modalScore').textContent = 'Score ' + score + ' · 문장 ' + cleared;

      const list = $('learnedList'); list.innerHTML = '';
      if (!built.length) {
        list.innerHTML = '<div class="row" style="text-align:center;color:#9fb3d6;">아직 없어요 — 다음에 도전! · None yet!</div>';
      } else {
        built.forEach(s => {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = '<span class="en">' + s.en.join(' ') + '</span><br><span class="ko">' + s.ko + '</span>';
          list.appendChild(row);
        });
      }
      modal.classList.add('show');
    }

    /* ═══ 입력 ═══ */
    document.addEventListener('pointermove', (e) => {
      crosshair.style.left = e.clientX+'px'; crosshair.style.top = e.clientY+'px';
    });
    document.addEventListener('pointerdown', (e) => {
      if (modal.classList.contains('show')) return;
      if (e.target && e.target.id === 'sfxBtn') return;
      ac();
      fire(e.clientX, e.clientY);
    });

    const timerInterval = setInterval(() => {
      if (!gameActive) return;
      timeLeft--; timerEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame(cleared >= 3);
    }, 1000);

    startWave();
  </script>
