<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="/css/mangoi-han.css?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: MangoiHanSC,'Noto Sans KR', 'Segoe UI', sans-serif; }
    body { background: #04060f; color: #e8f0ff; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game { position: relative; width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

    /* ── HUD ── */
    .hud {
      position: relative; z-index: 50; display: flex; align-items: center; gap: 18px;
      padding: 8px 16px; background: rgba(4, 8, 20, 0.88);
      border-bottom: 1px solid rgba(59, 130, 246, 0.35);
    }
    .stat { display: flex; flex-direction: column; line-height: 1.15; }
    .stat .label { font-size: 10px; color: #9fb3d6; letter-spacing: 1px; }
    .stat .value { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    #scoreVal { color: #fbbf24; } #stageVal { color: #60a5fa; }
    #sentVal { color: #4ade80; }
    #sfxBtn, #langBtn {
      margin-left: 6px; padding: 5px 11px; border-radius: 8px; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      color: #cfe0ff; font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    #langBtn { margin-left: 8px; }
    /* 🔇 꺼진 상태는 **한눈에 꺼져 보여야 한다.**
       예전엔 ♫/♪ 음표 한 글자와 ON/OFF 글자만 달라서, 버튼이 '지금 상태'를 말하는지
       '누르면 될 일'을 말하는지 구분이 안 됐다 — 실제로 소리를 꺼 놓고
       "쏴서 맞춰도 소리가 안 난다"는 신고가 들어왔다(낭독 TTS 는 계속 나오므로
       게임이 통째로 조용한 게 아니라 '효과음만' 사라져 더 헷갈린다). */
    #sfxBtn.off {
      background: rgba(239, 68, 68, .18); border-color: rgba(239, 68, 68, .55);
      color: #fecaca;
    }

    /* ── 문장 조립 바 ── */
    .quizbar {
      position: relative; z-index: 50; text-align: center; padding: 7px 12px;
      background: rgba(4, 8, 20, 0.8); border-bottom: 1px solid rgba(251, 191, 36, 0.25);
    }
    .quizbar .ko { font-size: 17px; font-weight: 800; color: #fde68a; }
    .slots { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 5px; }
    .slot {
      min-width: 66px; padding: 5px 13px; border-radius: 8px;
      font-size: 15px; font-weight: 800; letter-spacing: 1px;
      background: rgba(255,255,255,.05); border: 2px dashed rgba(255,255,255,.22); color: #6c7fa0;
    }
    .slot.next { border-style: solid; border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,.14); animation: slotPulse 1.1s infinite; }
    .slot.done { border-style: solid; border-color: #22c55e; color: #86efac; background: rgba(34,197,94,.16); }
    @keyframes slotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.5); } 50% { box-shadow: 0 0 0 8px rgba(251,191,36,0); } }
    .quizbar .guide { font-size: 11px; color: #9fb3d6; margin-top: 4px; }

    /* ── 전장: 우주선 복도 ── */
    #field {
      flex: 1; position: relative; overflow: hidden; cursor: none;
      background: #04060f;
    }
    #corridorZoom {
      position: absolute; inset: -3%;
      background: #04060f url('/img/space-corridor.webp') center 46% / cover no-repeat;
      filter: brightness(.62) saturate(.9);   /* 괴물이 배경보다 밝게 튀어나오도록 */
      will-change: transform;
    }
    #depthFog {
      position: absolute; inset: 0; pointer-events: none; z-index: 20;
      background: radial-gradient(ellipse 88% 84% at 50% 46%, transparent 46%, rgba(3,5,12,.62) 100%);
    }
    #field.shake { animation: shake .3s; }
    @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -12px; } 50% { margin-left: 10px; } 75% { margin-left: -6px; } }

    #dangerBar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; z-index: 46; background: rgba(255,255,255,.08); }
    #dangerFill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #fbbf24 55%, #ef4444); }

    #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 40; }
    #flash.hitfx { background: rgba(255,250,220,.8); animation: flashOut .25s ease-out; }
    #flash.hurtfx { background: rgba(255,30,30,.5); animation: flashOut .5s ease-out; }
    @keyframes flashOut { 0% { opacity: 1; } 100% { opacity: 0; } }

    /* ── 괴물 ── */
    /* 크기는 rAF 가 --d(폭) / --dh(높이) 로 직접 넣는다. 괴물마다 가로세로 비율이 다르다
       (박쥐처럼 날개가 넓은 개체를 4:5 박스에 우겨넣으면 날개가 잘려 보인다) */
    .mon { position: absolute; z-index: 30; width: var(--d); height: var(--dh); will-change: transform; --aura: 150,70,255; }
    /* 배경 제거된 알파 스프라이트 24프레임 세로 스트립 — 괴물만 보인다.
       두 겹을 겹쳐 다음 프레임을 교차 페이드해서 저프레임에서도 움직임이 부드럽다. */
    .mon .face {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background-repeat: no-repeat;
      background-size: 100% 2400%;
      background-position-x: 50%;
      background-position-y: 0%;   /* 프레임은 rAF 에서 직접 계산 (백분율 좌표계 함정 회피) */
      filter: brightness(1.18) contrast(1.1) saturate(1.25) drop-shadow(0 6px 18px rgba(0,0,0,.85)) drop-shadow(0 0 16px rgba(var(--aura),.5));
    }
    .mon .faceB { opacity: 0; }
    .mon .glow {
      position: absolute; left: 50%; top: 46%; width: 126%; height: 102%;
      transform: translate(-50%,-50%); pointer-events: none;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(var(--aura),.34), transparent 68%);
      animation: auraPulse 1.6s ease-in-out infinite;
    }
    @keyframes auraPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

    /* 워프 등장 */
    .mon .warp {
      position: absolute; left: 50%; top: 46%; width: 130%; height: 106%;
      transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,255,255,.9), rgba(var(--aura),.7) 40%, transparent 72%);
    }
    .mon.warpin .warp { animation: warpFx .9s ease-out; }
    .mon.warpin .face { animation: warpFace .9s ease-out; }
    @keyframes warpFx {
      0% { opacity: 1; transform: translate(-50%,-50%) scale(.15); }
      55% { opacity: .8; transform: translate(-50%,-50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.35); }
    }
    @keyframes warpFace {
      0% { opacity: 0; filter: brightness(4) blur(6px); }
      50% { opacity: 1; filter: brightness(2) blur(1px); }
      100% { opacity: 1; filter: brightness(1.18) contrast(1.1) saturate(1.25) drop-shadow(0 6px 18px rgba(0,0,0,.85)) drop-shadow(0 0 16px rgba(var(--aura),.5)); }
    }

    /* 피격 스파크 */
    .spark {
      position: fixed; width: 6px; height: 6px; border-radius: 50%;
      background: #ffe89a; box-shadow: 0 0 10px rgba(255,220,120,.95);
      pointer-events: none; z-index: 97;
    }
    /* 🔤 단어 꼬리표 (2026-08-03 확대)
       ── 왜 고쳤나 ──
         13px 고정이라 멀리서·큰 화면에서 안 읽혔다. 이 글자를 읽어야 푸는 게임인데
         정작 글자가 가장 안 보이는 요소였다. (원근과 무관하게 항상 13px 이었다)
       ── 얼마나 키울 수 있나 (실측) ──
         꼬리표는 괴물 아래 중앙에 붙는다. 첫 등장 때 괴물들이 소실점 근처에 모여 있어서,
         너무 키우면 옆 괴물 꼬리표와 겹친다. 게임 자체 수식으로 계산한 '겹치기 시작하는 폭':
           단어 3~4개 → 380px  |  5개 → 138px  |  6개 → 123px  |  7개 → 109px  |  8개 → 94px
         그래서 **한 값으로 고정하지 않고 문장의 단어 수에 따라** 정한다(--tagfs, spawnWave 에서 지정).
         자간을 1px→0.5px 로 줄인 것도 같은 이유 — 같은 크기에서 폭을 4% 아낀다.
       ── 크기만큼 중요한 것: 대비 ──
         배경이 어두운 복도라 반투명(.35)이면 글자가 배경에 묻혔다 → .72 로 올리고 테두리도 진하게. */
    .mon .tag {
      position: absolute; left: 50%; bottom: 1%; transform: translateX(-50%);
      transform-origin: center bottom; z-index: 3;
      padding: 4px 12px; border-radius: 999px;
      background: rgba(6,12,32,.72); border: 1.5px solid rgba(251,191,36,.75);
      backdrop-filter: blur(2px);
      font-size: var(--tagfs, clamp(17px, 2.4vmin, 26px));
      font-weight: 800; letter-spacing: .5px;
      color: #fff; white-space: nowrap;
      text-shadow: 0 1px 6px rgba(0,0,0,.98), 0 0 14px rgba(0,0,0,.75);
    }
    .mon.wrongHit .tag { border-color: rgba(239,68,68,.7); color: #fca5a5; background: rgba(60,8,8,.45); }
    .mon .shield {
      position: absolute; inset: -4%; border-radius: 50%;
      border: 3px solid rgba(120,200,255,.9);
      box-shadow: 0 0 30px rgba(120,200,255,.8), inset 0 0 24px rgba(120,200,255,.35);
      opacity: 0; pointer-events: none; z-index: 2;
    }
    .mon.deflect .shield { animation: deflectFx .45s ease-out; }
    @keyframes deflectFx { 0% { opacity: 1; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.14); } }
    .mon.reveal .glow { background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(34,197,94,.55), transparent 68%); }
    .mon.reveal .tag { border-color: #22c55e; }
    .mon.boom .face, .mon.boom .tag, .mon.boom .glow { animation: boomFx .5s ease-out forwards; }
    @keyframes boomFx {
      0% { filter: brightness(2.6) saturate(1.6); opacity: 1; }
      40% { filter: brightness(3.2) saturate(2); opacity: 1; transform: scale(1.14); }
      100% { filter: brightness(4); opacity: 0; transform: scale(1.55); }
    }
    .mon.flee { transition: opacity .45s ease-out; opacity: 0 !important; }

    /* 저격수 사망 */
    #field.dying { animation: die 1.25s ease-in forwards; }
    @keyframes die {
      0% { transform: none; filter: none; }
      30% { transform: rotate(-3deg); }
      100% { transform: rotate(22deg) translateY(30%) scale(1.06); filter: brightness(.3) saturate(.5) blur(2px); }
    }
    #ohNo {
      position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%);
      z-index: 60; font-size: 54px; font-weight: 900; color: #ff5a5a; letter-spacing: 2px;
      text-shadow: 0 3px 18px rgba(0,0,0,.9), 0 0 24px rgba(255,60,60,.6); opacity: 0; pointer-events: none;
    }
    #ohNo.show { animation: ohNoPop 1.2s ease-out forwards; }
    @keyframes ohNoPop {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.5) rotate(-4deg); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(2deg); }
      30% { transform: translate(-50%,-50%) scale(1); }
      80% { opacity: 1; } 100% { opacity: 0; }
    }

    #killPop {
      position: absolute; top: 24%; left: 50%; transform: translate(-50%,-50%) scale(.6);
      z-index: 45; text-align: center; opacity: 0; pointer-events: none;
      text-shadow: 0 2px 14px rgba(0,0,0,.95);
    }
    #killPop .en { font-size: 34px; font-weight: 900; color: #fbbf24; letter-spacing: 3px; }
    #killPop .ko { font-size: 17px; font-weight: 700; color: #e8f0ff; margin-top: 2px; }
    #killPop .pts { font-size: 19px; font-weight: 800; color: #4ade80; margin-top: 3px; }
    #killPop.show { animation: popIn 1.2s ease-out forwards; }
    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.6); }
      15% { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
      25% { transform: translate(-50%,-50%) scale(1); }
      78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-62%) scale(1); }
    }

    /* ── 문장 듣기 / 따라 말하기 ── */
    #listenPop, #repeatPop {
      position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%);
      /* 괴물이 z-index 30~70 이므로 그 위에 와야 가려지지 않는다 (조준점 100, 모달 200) */
      z-index: 80; text-align: center; pointer-events: none; display: none;
      padding: 22px 30px; border-radius: 20px;
      background: rgba(6,12,32,.82); border: 2px solid rgba(96,165,250,.45);
      box-shadow: 0 10px 40px rgba(0,0,0,.7), 0 0 40px rgba(59,130,246,.22);
      backdrop-filter: blur(3px);
    }
    #listenPop.show, #repeatPop.show { display: block; }
    #listenPop .ear { font-size: 44px; line-height: 1; animation: earPulse 1.1s ease-in-out infinite; }
    #listenPop .t1, #repeatPop .t1 { margin-top: 8px; font-size: 20px; font-weight: 900; color: #bfdbfe; letter-spacing: 1px; }
    #listenPop .t2, #repeatPop .t2 { margin-top: 2px; font-size: 13px; font-weight: 700; color: #7f9dc9; }
    #listenPop .skip { margin-top: 12px; font-size: 11px; color: #64748b; }
    @keyframes earPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }

    /* 소리가 나가는 중이라는 표시 (막대 5개가 파도치듯) */
    #listenPop .wave { display: flex; gap: 5px; justify-content: center; margin-top: 12px; height: 26px; align-items: center; }
    #listenPop .wave i { width: 5px; height: 8px; border-radius: 3px; background: #60a5fa; animation: eq .9s ease-in-out infinite; }
    #listenPop .wave i:nth-child(2) { animation-delay: .12s; }
    #listenPop .wave i:nth-child(3) { animation-delay: .24s; }
    #listenPop .wave i:nth-child(4) { animation-delay: .36s; }
    #listenPop .wave i:nth-child(5) { animation-delay: .48s; }
    @keyframes eq { 0%,100% { height: 8px; opacity: .55; } 50% { height: 26px; opacity: 1; } }

    /* 듣는 차례 = 파랑, 따라 말하는 차례 = 초록. 색이 바뀌면 지금 뭘 할 차례인지 바로 안다 */
    #repeatPop { border-color: rgba(96,165,250,.5); }
    /* 🎤 점수·들린 말 — 학생이 «몇 점이었는지»를 알아야 다음 시도가 달라진다 */
    #repeatPop .feed { margin-top:6px; min-height:18px; font-size:13.5px; font-weight:800; color:#cbd5e1; }
    #repeatPop .feed b { color:#fde68a; }
    #repeatPop.say { border-color: rgba(74,222,128,.55); box-shadow: 0 10px 40px rgba(0,0,0,.7), 0 0 44px rgba(34,197,94,.3); }
    #repeatPop .icon { font-size: 40px; line-height: 1; animation: earPulse 1.1s ease-in-out infinite; }
    #repeatPop .sayIco, #repeatPop .sayTxt { display: none; }
    #repeatPop.say .listenIco, #repeatPop.say .listenTxt { display: none; }
    #repeatPop.say .sayIco { display: block; }
    #repeatPop.say .sayTxt { display: block; }
    #repeatPop .t1 { color: #bfdbfe; }
    #repeatPop.say .t1 { color: #bbf7d0; }
    #repeatPop.say .t2 { color: #86a999; }
    /* 따라 말하려면 문장이 보여야 한다 */
    #repeatPop .sent {
      margin-top: 10px; padding: 6px 14px; border-radius: 10px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #fde68a;
    }
    /* 3번 중 몇 번째인지 — 점이 하나씩 켜진다 */
    #repeatPop .dots { display: flex; gap: 9px; justify-content: center; margin-top: 12px; }
    #repeatPop .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.3); }
    #repeatPop .dots i.on { background: #60a5fa; box-shadow: 0 0 12px rgba(96,165,250,.8); }
    #repeatPop.say .dots i.on { background: #4ade80; box-shadow: 0 0 12px rgba(74,222,128,.8); }

    /* ── 글자 눌러서 뜻·발음 ── */
    .slot.done { cursor: pointer; }
    #defPop {
      position: fixed; display: none; z-index: 150; min-width: 132px; max-width: 260px;
      padding: 12px 16px 10px; border-radius: 16px; text-align: center;
      background: rgba(6,12,32,.96); border: 2px solid rgba(96,165,250,.55);
      box-shadow: 0 12px 40px rgba(0,0,0,.8), 0 0 30px rgba(59,130,246,.25);
    }
    #defPop .w  { font-size: 30px; font-weight: 900; color: #fde68a; letter-spacing: 1px; line-height: 1.15; }
    #defPop .py { font-size: 16px; font-weight: 800; color: #7dd3fc; margin-top: 2px; min-height: 0; }
    #defPop .ko { font-size: 18px; font-weight: 800; color: #e8f0ff; margin-top: 5px; }
    #defPop .say {
      margin-top: 9px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22);
      font-size: 12px; font-weight: 800; color: #cfe0ff;
    }

    #crosshair {
      position: fixed; width: 52px; height: 52px; margin: -26px 0 0 -26px;
      border: 2px solid rgba(251,191,36,.85); border-radius: 50%;
      pointer-events: none; z-index: 100;
      box-shadow: 0 0 12px rgba(251,191,36,.35), inset 0 0 10px rgba(251,191,36,.15);
      transition: transform .06s;
    }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(251,191,36,.8); top: 50%; left: 50%; }
    #crosshair::before { width: 2px; height: 28px; transform: translate(-50%,-50%); }
    #crosshair::after { width: 28px; height: 2px; transform: translate(-50%,-50%); }
    #crosshair.bang { transform: scale(.78); }

    .splash {
      position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,235,150,.95), rgba(255,120,40,.55) 40%, transparent 70%);
      pointer-events: none; z-index: 95; animation: splashPop .4s ease-out forwards;
    }
    @keyframes splashPop { 0% { transform: scale(.35); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

    #modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 200; flex-direction: column; align-items: center; justify-content: center;
      gap: 11px; text-align: center; padding: 20px;
    }
    #modal.show { display: flex; }
    #modal h2 { font-size: 36px; font-weight: 900; color: #fbbf24; }
    #modal .sub { font-size: 15px; color: #9fb3d6; }
    #modal .score { font-size: 23px; font-weight: 800; color: #e8f0ff; }
    #learnedBox {
      max-width: 460px; width: 100%; max-height: 190px; overflow-y: auto;
      background: rgba(255,255,255,.05); border: 1px solid rgba(251,191,36,.25);
      border-radius: 12px; padding: 12px 16px; text-align: left;
    }
    #learnedBox .t { font-size: 12px; color: #9fb3d6; margin-bottom: 6px; text-align: center; }
    #learnedBox .row { font-size: 14px; font-weight: 700; padding: 4px 0; }
    #learnedBox .row .en { color: #fde68a; }
    #learnedBox .row .ko { color: #cfe0ff; font-weight: 500; }
    #modal button {
      margin-top: 5px; padding: 13px 30px; background: #fbbf24; color: #111;
      border: none; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer;
    }
  </style>
<script src="/js/game-track.js?v=4" defer></script>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
      <div class="stat"><div class="label">LEVEL</div><div class="value" id="stageVal">1/6</div></div>
      <!-- 🔁 연습 모드 — LIFE 하트와 TIME 카운트다운을 없앴다.

    /* ═══ 효과음 (Web Audio 합성) ═══ */
    let AC = null, sfxOn = true, noiseBuf = null;
    function ac() {
      if (!AC) {
        try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        const len = AC.sampleRate * 2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }
    function env(node, a, peak, dur) {
      const c = ac(); if (!c) return;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(peak, c.currentTime + a);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      node.connect(g); g.connect(c.destination); return g;
    }
    function noise(dur, peak, type, f0, f1) {
      const c = ac(); if (!c || !sfxOn) return;
      const s = c.createBufferSource(); s.buffer = noiseBuf;
      const f = c.createBiquadFilter(); f.type = type;
      f.frequency.setValueAtTime(f0, c.currentTime);
      f.frequency.exponentialRampToValueAtTime(Math.max(60, f1), c.currentTime + dur);
      s.connect(f); env(f, 0.004, peak, dur);
      s.start(); s.stop(c.currentTime + dur + 0.02);
    }
    function tone(type, f0, f1, dur, peak, delay) {
      const c = ac(); if (!c || !sfxOn) return;
      const t = c.currentTime + (delay || 0);
      const o = c.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }

          { w:['我','妹妹','会','弹','钢琴'],     ko:'내 여동생은 피아노를 칠 줄 알아요' },
          { w:['银河','里','有','很多','行星'],   ko:'은하에는 행성이 많이 있어요' },
          { w:['勇气','让','我们','接近','梦想'], ko:'용기는 우리를 꿈에 가까이 가게 해요' }
        ],
        [ // Lv4 · 6단어
          { w:['我','每天','晚上','都','读','书'],       ko:'나는 매일 밤 책을 읽어요' },
          { w:['我们','在','学校','花园','里','玩'],     ko:'우리는 학교 정원에서 놀아요' },
          { w:['爸爸','开','着','一辆','蓝色','汽车'],   ko:'아빠는 파란 차를 몰아요' },
          { w:['科学家','正在','研究','深深','的','海洋'], ko:'과학자가 깊은 바다를 연구하고 있어요' },
          { w:['老师','给','我们','布置','新','作业'],   ko:'선생님이 우리에게 새 숙제를 내주세요' }
        ],
        [ // Lv5 · 7단어
          { w:['我','很','想','去','外国','旅行','一次'],       ko:'나는 외국에 한번 여행 가고 싶어요' },
          { w:['我们','学','英语','是','为了','交','朋友'],     ko:'우리는 친구를 사귀려고 영어를 배워요' },
          { w:['宇航员','正在','看','天上','明亮','的','星星'], ko:'우주비행사가 하늘의 밝은 별을 보고 있어요' },
          { w:['妈妈','为','我们','全家','做','晚饭','了'],     ko:'어머니가 온 가족을 위해 저녁을 지으셨어요' },
          { w:['科学','帮助','我们','创造','更','好','未来'],   ko:'과학은 우리가 더 좋은 미래를 만들게 도와줘요' }
        ],
        [ // Lv6 · 8단어 · 심화
          { w:['我','希望','将来','能','环游','整个','世界','一次'], ko:'나는 언젠가 온 세계를 한번 여행하고 싶어요' },
          { w:['我们','队','努力','练习','终于','赢','了','比赛'],   ko:'우리 팀은 열심히 연습해 결국 경기를 이겼어요' },
          { w:['勇敢','的','飞行员','穿过','了','那','场','暴风雨'], ko:'용감한 조종사가 그 폭풍을 뚫고 지나갔어요' },
          { w:['我们','应该','为','将来','的','孩子','保护','地球'], ko:'우리는 미래의 아이들을 위해 지구를 지켜야 해요' }
        ]
      ]
    };

    // 🔁 lives·timeLeft 는 없앴다 — 게임오버가 없는 연습 모드다. 틀리면 같은 문장을 다시 낸다.
    let score = 0, stage = 1, cleared = 0;
    let gameActive = true;
    let wave = null;
    const built = [];
    const usedIdx = LEVELS.map(() => []);

    function pick(arr, n) {
      const pool = arr.slice(), out = [];
      while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      return out;
    }
    function rnd(a,b){ return a + Math.random()*(b-a); }

    // 복도 안 면(바닥/천장/좌벽/우벽) — 소실점 기준 방향
    function randSurface(zone) {
      const z = (zone === undefined) ? Math.floor(Math.random()*4) : zone;
      if (z===0) return { dx:(Math.random()-.5)*1.3, dy: 0.95, z };   // 바닥
      if (z===1) return { dx:(Math.random()-.5)*1.3, dy:-0.92, z };   // 천장
      if (z===2) return { dx:-1.06, dy:(Math.random()-.5)*1.1, z };   // 좌벽
      return              { dx: 1.06, dy:(Math.random()-.5)*1.1, z }; // 우벽
    }

    // 다른 괴물들과 최대한 떨어진 목적지를 고른다 (같은 면이면 감점)
    // self 를 주면 '자기 현위치에서도 먼 곳'을 함께 따진다 — 안 그러면 제자리
    // 근처를 목적지로 골라서 이동해도 움직인 티가 안 난다
    function pickSurface(avoid, self) {
      if (!avoid || !avoid.length) return randSurface();
      let best = null, bestScore = -Infinity;
      for (let i = 0; i < 28; i++) {
        const c = randSurface();
        let score = Infinity;
        for (const a of avoid) {
          const d = Math.hypot(c.dx - a.dx, c.dy - a.dy) + (c.z === a.z ? 0 : 1.1);
          if (d < score) score = d;
        }
        if (self) score = Math.min(score, Math.hypot(c.dx - self.dx, c.dy - self.dy) * 0.9);
        if (score > bestScore) { bestScore = score; best = c; }
      }
      return best;
    }

    function renderSlots() {
      slotsEl.innerHTML = '';
      wave.words.forEach((w,i) => {
        const s = document.createElement('div');
        const done = i < wave.next;
        s.className = 'slot' + (done ? ' done' : (i === wave.next ? ' next' : ''));
        s.textContent = done ? w : '＿＿';
        // 맞힌 글자는 눌러서 뜻·발음을 다시 볼 수 있다 (아직 못 맞힌 칸은 정답이 새니까 막는다)
        if (done) { s.dataset.word = w; s.title = '눌러서 뜻 보기'; }
        slotsEl.appendChild(s);
      });
    }

    /* ═══ 글자 눌러서 뜻·발음 보기 ═══
     *  이미 등록돼 있는 /api/games/define 을 그대로 쓴다(한국어 뜻 + 중국어 병음).
     *  같은 글자를 반복해서 누르는 게임이라 한 번 받은 건 기억해 둔다. */
    const defCache = new Map();

    // ⚠ 게임이 문장을 낭독 중일 때는 speechSynthesis.cancel() 을 부르면 안 된다.
    //   낭독 시퀀스의 onend 가 다음 웨이브를 물고 있어서, 끊으면 게임이 멈춘다.
    //   그럴 땐 취소 없이 뒤에 이어 붙인다.
    function speakWord(text) {
      try {
        const zh = (lang === 'zh');
        const u = new SpeechSynthesisUtterance(text);
        u.lang = zh ? 'zh-CN' : 'en-US';
        u.rate = zh ? 0.7 : 0.75;             // 한 글자·한 단어라 아주 또박또박
        const busy = wave && (wave.listening || wave.drilling);
        if (!busy) speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    async function showDef(slotEl) {
      const raw = String(slotEl.dataset.word || '').trim();
      if (!raw) return;
      const zh = (lang === 'zh');
      const q = zh ? raw : raw.toLowerCase();

      defPop.querySelector('.w').textContent = raw;
      defPop.querySelector('.py').textContent = '';
      defPop.querySelector('.ko').textContent = '뜻 찾는 중…';
      // 슬롯 바로 아래에 붙이되 화면 밖으로 나가지 않게 가둔다
      const r = slotEl.getBoundingClientRect();
      defPop.style.display = 'block';
      const w = defPop.offsetWidth;
      defPop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width/2 - w/2)) + 'px';
      defPop.style.top = (r.bottom + 8) + 'px';
      speakWord(raw);

      let d = defCache.get(q);
      if (!d) {
        try {
          const p = new URLSearchParams({ word: q, lang: zh ? 'zh' : 'en' });
          if (wave) p.set('sent', wave.words.join(zh ? '' : ' '));
          const res = await fetch('/api/games/define?' + p.toString());
          d = await res.json();
          if (d && d.ok) defCache.set(q, d);
        } catch (e) {}
      }
      if (defPop.style.display !== 'block') return;      // 그새 닫혔으면 그만
      defPop.querySelector('.py').textContent = (d && d.pinyin) || '';
      defPop.querySelector('.ko').textContent = (d && d.ko) || '뜻을 못 찾았어요';
    }

    function hideDef() { defPop.style.display = 'none'; }

    // 슬롯을 누르면 뜻 보기, 스피커를 누르면 다시 읽기
    slotsEl.addEventListener('pointerdown', (e) => {
      const s = e.target.closest('.slot.done');
      if (!s) return;
      e.stopPropagation();
      showDef(s);
    });
    defPop.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      if (e.target.closest('.say')) speakWord(defPop.querySelector('.w').textContent);
      else hideDef();
    });

    // retry 를 주면 **그 문장을 다시** 낸다 (틀렸을 때 같은 문장을 반복 학습).
    //   ⚠ setTimeout(startWave, ...) / .then(startWave, startWave) 로도 불리므로
    //     문장처럼 생겼을 때만 재시도로 취급한다(에러 객체가 들어와도 안전하게).
    function startWave(retry) {
      if (!gameActive) return;
      stopSpeak();
      repeatPop.classList.remove('show', 'say');
      field.querySelectorAll('.mon').forEach(m => m.remove());

      const isRetry = !!(retry && Array.isArray(retry.w) && retry.w.length);
      let S;
      if (isRetry) {
        S = retry;                       // 같은 문장 — 은행에서 새로 뽑지 않는다
      } else {
        const bank = BANKS[lang][stage-1];
        let idx = Math.floor(Math.random()*bank.length);
        let guard = 0;
        while (usedIdx[stage-1].includes(idx) && guard++ < 20) idx = Math.floor(Math.random()*bank.length);
        usedIdx[stage-1].push(idx);
        S = bank[idx];
      }

      wave = { sentence: S, words: S.w, next: 0, monsters: [], failed: false, listening: true, spawned: false };
      sentKo.textContent = (isRetry ? '🔁 ' : '🎯 ') + S.ko;
      renderSlots();
      dangerFill.style.width = '0%';

      // 🔊 이 웨이브에서 읽을 것(문장 + 낱말 전부)을 미리 받아 둔다.
      //    맞힌 «그 순간» 소리가 나야 하는데, 그때부터 내려받으면 모바일이
      //    "제스처 없이 시작한 소리"로 보고 재생을 거부하는 일이 생긴다.
      ttsPrefetch([fullSentence(S)].concat(S.w));

      // ① 먼저 완성 문장을 소리로만 한 번 들려준다. 영어 문장은 화면에 띄우지 않는다(듣기 훈련).
      //    괴물은 이 동안 등장하지 않고 타이머도 멈춘다 — 듣는 시간이 손해가 되면 안 된다.
      listenPop.classList.add('show');
      speakLine(fullSentence(S), (lang === 'zh') ? 0.78 : 0.84, () => spawnWave(S));
    }

    // 문장 하나를 표기용 문자열로 (중국어는 공백 없이 붙인다)
    function fullSentence(S) { return S.w.join(lang === 'zh' ? '' : ' '); }

    // ② 듣기가 끝나면 실제로 괴물이 몰려온다
    function spawnWave(S) {
      if (!gameActive || !wave || wave.sentence !== S || wave.spawned) return;
      wave.spawned = true; wave.listening = false;
      listenPop.classList.remove('show');

      // 매 웨이브 서로 다른 괴물 종을 뽑는다 (8종 전부 등장)
      const shuffledCreatures = pick(CREATURES, S.w.length);
      shuffledCreatures.forEach((c, k) => setTimeout(() => sfxGrowl(c.pitch), k * 220));
      const now = performance.now();
      const [lo,hi] = LEVELS[stage-1].dur;
      const zonePool = pick([0,1,2,3], 4);   // 처음 4마리는 서로 다른 면에서 등장
      wave.sizeK = 1 / Math.sqrt(S.w.length / 3);   // 많이 몰려올수록 개체는 작게

      /* 🔤 꼬리표 크기 — 문장이 길수록(=괴물이 많을수록) 첫 등장 때 서로 붙어 있어서
         큰 글자를 쓰면 옆 꼬리표와 겹친다. 게임 수식으로 계산한 '겹치기 시작하는 폭'
         (3~4개 380px / 5개 138 / 6개 123 / 7개 109 / 8개 94)에 맞춘 3단계다.
         화면 크기에도 비례(vmin)시켜 큰 모니터에서는 더 크게 나온다. */
      const _n = S.w.length;
      field.style.setProperty('--tagfs',
        _n <= 4 ? 'clamp(20px, 3.2vmin, 34px)'      // 여유가 크다 — 최대한 키운다
      : _n <= 6 ? 'clamp(17px, 2.4vmin, 26px)'
      :           'clamp(15px, 2.0vmin, 21px)');    // 7~8개는 빽빽해서 여기까지

      S.w.forEach((w, i) => {
        const cre = shuffledCreatures[i];
        const el = document.createElement('div');
        el.className = 'mon warpin';
        el.style.setProperty('--aura', cre.aura);
        el.innerHTML =
          '<div class="warp"></div><div class="glow"></div>' +
          '<div class="face faceA"></div><div class="face faceB"></div>' +
          '<div class="shield"></div><div class="tag"></div>';
        const faceA = el.querySelector('.faceA'), faceB = el.querySelector('.faceB');
        faceA.style.backgroundImage = faceB.style.backgroundImage = `url('${sheetPath(cre.n)}')`;
        el.querySelector('.tag').textContent = w;
        /* ❌ 한때 홀수 번째 꼬리표를 아래로 내려 어긋내려 했는데, 측정해 보니 **겹침이 늘었다**.
           천장 괴물의 꼬리표가 내려오면서 좌·우 벽 괴물의 꼬리표 높이대로 들어가기 때문이다
           (3~4단어에서 안전선 380px → 93px). 그래서 넣지 않는다. */
        field.appendChild(el);
        setTimeout(() => el.classList.remove('warpin'), 900);

        const start = randSurface(zonePool[i % 4]);
        wave.monsters.push({
          el, faceA, faceB, tag: el.querySelector('.tag'),
          word: w, order: i, creature: cre, ar: cre.ar || 0.8,
          born: now + i * rnd(140, 520),      // 시차를 두고 몰려나온다
          dur: rnd(lo, hi),                    // 괴물마다 다른 속도
          cur: start, from: start, to: start,
          moveStart: now, moveDur: 1, nextHopAt: 0,
          phase: i * 1.7, dead: false,
          // 24프레임 = 원본 5초. 208ms 가 '실제 속도'지만 그 속도로는 5초에 날갯짓
          // 한 번이라 거의 정지처럼 보인다. 약 2.6배속으로 돌려 날개·다리가 쉬지 않고
          // 움직이게 한다. 두 겹 교차페이드가 있어서 배속을 올려도 뚝뚝 끊기지 않는다.
          frame: -1, frameMs: 72 + Math.random() * 20, arc: 0
        });
      });
    }

    /* ═══ 루프 ═══ */
    function tick(now) {
      // 복도가 미세하게 다가오는 전진감
      zoom.style.transform = `scale(${1 + 0.02 * (1 + Math.sin(now/2600))})`;

      if (wave && !wave.failed) {
        const W = field.clientWidth, H = field.clientHeight;
        const vpx = W*0.5, vpy = H*0.46;
        let maxP = 0;

        const live = wave.monsters.filter(m => !m.dead);
        let reached = null;

        // ── 1패스: 위치 계산 ──
        for (const m of live) {
          const p = Math.max(0, Math.min(1, (now - m.born) / m.dur));
          if (p > maxP) maxP = p;
          if (p >= 1 && !reached) reached = m;

          // p*p 로 두면 초반에 거의 안 커져서 '다가온다'는 느낌이 늦게 온다.
          // 지수를 낮춰 접근 내내 꾸준히 커지게 한다 (도달 시점은 p=1 로 동일).
          const depth = 0.05 + 0.95 * Math.pow(p, 1.55);

          // 이동 폭. 예전에는 depth 에 정비례해서, 멀리 있을 때(=대부분의 시간)
          // 폭이 거의 0 이었다. 게다가 화면 폭에 비례하다 보니 폰 세로에서는
          // 초당 15px 남짓 — 사실상 멈춰 보였다. 하한 0.32 를 깔고 절대 px 로도
          // 가두어, 화면 크기와 무관하게 비슷한 거리를 움직이게 한다.
          const k = 0.34 + 0.66 * depth;
          const spanX = Math.min(Math.max(W*0.46, 265), 480) * k;
          const spanY = Math.min(Math.max(H*0.42, 265), 480) * k;

          if (!m.nextHopAt || now >= m.nextHopAt) {
            // 다른 괴물들의 목적지 + 자기 현위치에서 최대한 먼 지점을 고른다
            // (자기 위치를 안 보면 제자리 근처로 '이동'해서 안 움직인 것처럼 보인다)
            const avoid = live.filter(o => o !== m).map(o => o.to);
            m.from = m.cur; m.to = pickSurface(avoid, m.cur);
            m.moveStart = now;
            // 이동 시간을 '거리 ÷ 속도' 로 잡는다 → 화면이 크든 작든 체감 속도가 같다
            const spd = 145 + stage * 12;  // px/초, 레벨이 오를수록 빠르게
            const dpx = Math.hypot((m.to.dx - m.from.dx)*spanX, (m.to.dy - m.from.dy)*spanY);
            m.moveDur = Math.max(600, Math.min(2600, dpx / spd * 1000));
            m.arc = rnd(-0.26, 0.26);                        // 직선이 아니라 크게 휘어서
            m.nextHopAt = now + m.moveDur + rnd(60, 220);    // 대기는 짧게 — 길면 멈춘 걸로 보인다
          }
          const q = Math.min(1, (now - m.moveStart) / m.moveDur);
          // smootherstep — 시작·끝 가속도까지 연속이라 툭 끊기지 않는다
          const ei = q*q*q*(q*(q*6 - 15) + 10);
          let cdx = m.from.dx + (m.to.dx - m.from.dx)*ei;
          let cdy = m.from.dy + (m.to.dy - m.from.dy)*ei;
          // 이동 방향의 수직으로 호(arc)를 태워 곡선 궤적
          const vx = m.to.dx - m.from.dx, vy = m.to.dy - m.from.dy;
          const vl = Math.hypot(vx, vy) || 1;
          const bow = Math.sin(Math.PI * ei) * m.arc;
          cdx += (-vy / vl) * bow; cdy += (vx / vl) * bow;
          m.cur = { dx: cdx, dy: cdy, z: m.to.z };

          m._depth = depth;
          // base = 예전 4:5 기준 폭. 비율이 달라도 화면 점유 '면적'은 같도록 환산한다.
          //   ar=0.8 이면 _w=base, _h=base*1.25 로 예전과 완전히 동일하다.
          const base = Math.max(26, Math.min(W,H) * (0.09 + 0.60*depth) * (wave.sizeK || 1));
          m._w = base * Math.sqrt(1.25 * m.ar);
          m._h = m._w / m.ar;
          m._d = m._w;
          // 느린 파동 두 겹을 합쳐 걸을 때처럼 자연스럽게 위아래·좌우로 흔들린다.
          // 폭을 절대 px 로 두면 큰 화면에서만 보이므로 **개체 크기 비례**로 잡는다.
          const bobX = (Math.sin(now/260 + m.phase*0.6)*0.075 + Math.sin(now/430 + m.phase*1.3)*0.035) * m._w;
          const bobY = (Math.sin(now/210 + m.phase)*0.065     + Math.sin(now/350 + m.phase*1.7)*0.030) * m._h;
          m._x = vpx + m.cur.dx * spanX + bobX;
          m._y = vpy + m.cur.dy * spanY + bobY;
        }

        // ── 2패스: 화면상 겹침 밀어내기 ──
        // 개체마다 가로세로 비율이 다르므로 각자의 실제 폭·높이로 타원 반경을 잡는다
        for (let iter = 0; iter < 5; iter++) {
          for (let a = 0; a < live.length; a++) {
            for (let b = a + 1; b < live.length; b++) {
              const A = live[a], B = live[b];
              const rx = (A._w + B._w) * 0.46, ry = (A._h + B._h) * 0.46;
              let nx = (B._x - A._x) / rx, ny = (B._y - A._y) / ry;
              let nd = Math.hypot(nx, ny);
              if (nd < 0.001) { nx = (a % 2 ? 1 : -1); ny = 0.2; nd = Math.hypot(nx, ny); }
              if (nd >= 1) continue;
              const push = (1 - nd) / 2;
              const ux = nx / nd, uy = ny / nd;
              // 가까이 온(큰) 괴물일수록 덜 밀린다
              const sA = A._w + A._h, sB = B._w + B._h, sum = sA + sB;
              const wA = sB / sum, wB = sA / sum;
              A._x -= ux * push * rx * 2 * wA; A._y -= uy * push * ry * 2 * wA;
              B._x += ux * push * rx * 2 * wB; B._y += uy * push * ry * 2 * wB;
            }
          }
        }

        // ── 3패스: 화면 안으로 가두고 그리기 ──
        for (const m of live) {
          m._x = Math.max(m._w*0.30, Math.min(W - m._w*0.30, m._x));
          m._y = Math.max(m._h*0.27, Math.min(H - m._h*0.21, m._y));

          m.el.style.setProperty('--d', m._w+'px');
          m.el.style.setProperty('--dh', m._h+'px');
          m.el.style.left = m._x+'px'; m.el.style.top = m._y+'px';
          m.el.style.transform = 'translate(-50%,-50%)';
          m.el.style.zIndex = 30 + Math.round(m._depth*40);
          m.tag.style.transform = `translateX(-50%) scale(${Math.max(.9, Math.min(1.12, 120/m._w))})`;

          // 24프레임 스프라이트: 이미지가 박스의 24배 높이 → 프레임 k 는 k*(100/23)%
          // 다음 프레임을 위에 겹쳐 교차 페이드 → 4.8fps 원본도 매끄럽게 보인다
          const t = now / m.frameMs + m.phase * 3;
          const fi = Math.floor(t) % 24;
          if (fi !== m.frame) {
            m.frame = fi;
            m.faceA.style.backgroundPositionY = (fi * (100 / 23)).toFixed(3) + '%';
            m.faceB.style.backgroundPositionY = (((fi + 1) % 24) * (100 / 23)).toFixed(3) + '%';
          }
          m.faceB.style.opacity = (t - Math.floor(t)).toFixed(3);
        }

        dangerFill.style.width = (maxP*100) + '%';
        if (reached) monsterReached(reached);
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    /* ═══ 발사 ═══ */
    function fire(x, y) {
      sfxShot();
      crosshair.classList.add('bang');
      setTimeout(()=>crosshair.classList.remove('bang'), 70);
      const sp = document.createElement('div');
      sp.className = 'splash'; sp.style.left = x+'px'; sp.style.top = y+'px';
      document.body.appendChild(sp); setTimeout(()=>sp.remove(), 400);

      if (!gameActive || !wave || wave.failed) return;

      let best = null, bestD = Infinity;
      for (const m of wave.monsters) {
        if (m.dead) continue;
        const r = m.el.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height*0.46;
        const rx = r.width*0.5 + 14, ry = r.height*0.42 + 14;
        const nx = (x-cx)/rx, ny = (y-cy)/ry;
        const dd = nx*nx + ny*ny;
        if (dd <= 1 && dd < bestD) { best = m; bestD = dd; }
      }
      if (!best) return;
      (best.order === wave.next) ? hitCorrect(best) : hitWrong(best);
    }

    /*
     * 한 번 읽고 끝나면 done(읽는 데 걸린 ms, 소리가 실제로 났는지) 을 부른다.
     * ⚠ done 은 게임 진행(다음 웨이브)을 물고 있으므로 **어떤 경우에도 반드시 호출**되어야 한다.
     *   - onend 를 안 쏘는 브라우저가 있다 → 길이 기준 안전장치
     *   - 음성 자체가 없는 기기(voices 0, 자동재생 차단)도 있다 → onstart 가 안 오면 짧게 넘어간다
     *   finished 플래그로 중복 호출을 막는다.
     */
    let speakSeqToken = 0;

    /* ═══════════════════════════════════════════════════════════════
     * 🔊 원어민 음성 — 서버 TTS 를 먼저, 브라우저 내장 음성은 폴백
     *
     * 🔴 예전에는 `speechSynthesis` 하나만 썼다. 그런데 **한국 폰에는 중국어 음성이
     *    깔려 있지 않은 경우가 많다** → `speak()` 가 조용히 아무것도 안 하고 끝난다
     *    (에러도 안 난다). 그래서 "맞춰도 단어 소리가 안 난다"는 신고가 계속 나왔다.
     *    효과음(WebAudio)은 나는데 낭독만 안 나니 «소리는 켜져 있는데 단어만 조용»했다.
     * ✅ 서버 `/api/voice/tts` 는 중국어를 원어민 만다린 MP3 로 돌려준다(실측 확인).
     *    이걸 1순위로 쓰고, 실패할 때만 브라우저 음성으로 내려간다.
     * ⚠️ 모바일은 «사용자 제스처 없이 시작한 오디오»를 막는다. 그래서
     *    ① 오디오 요소를 첫 탭에서 한 번 깨워 두고(primeAudio)
     *    ② 웨이브 시작 때 낱말·문장을 **미리 받아 둔다**(prefetch) — 받는 사이에
     *       제스처 유효시간이 끝나 재생이 거부되는 것을 막는다.
     * ═══════════════════════════════════════════════════════════════ */
    const ttsCache = new Map();
    let ttsAudio = null, ttsPrimed = false;
    function ttsEl() {
      if (!ttsAudio) { ttsAudio = new Audio(); ttsAudio.preload = 'auto'; }
      return ttsAudio;
    }
    // 첫 탭에서 오디오 요소를 한 번 재생해 두면(무음) 이후 프로그램 재생이 허용된다
    function primeAudio() {
      if (ttsPrimed) return;
      ttsPrimed = true;
      try {
        const a = ttsEl();
        a.muted = true;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
        setTimeout(() => { try { a.pause(); a.muted = false; } catch (e) {} }, 60);
      } catch (e) {}
    }
    function ttsUrl(text) {
      const key = lang + '|' + text;
      if (ttsCache.has(key)) return ttsCache.get(key);
      const p = fetch('/api/voice/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, lang: (lang === 'zh') ? 'zh' : 'en' })
      }).then(r => {
        const ct = r.headers.get('content-type') || '';
        if (!r.ok || ct.indexOf('audio') < 0) throw new Error('tts_' + r.status);
        return r.blob();
      }).then(b => URL.createObjectURL(b));
      p.catch(() => ttsCache.delete(key));      // 실패한 약속을 캐시에 남기면 영영 폴백만 탄다
      ttsCache.set(key, p);
      return p;
    }
    // 웨이브가 뜰 때 낱말·문장을 미리 받아 둔다 — 맞힌 순간에 바로 소리가 나야 한다
    function ttsPrefetch(list) { (list || []).forEach(t => { if (t) ttsUrl(t).catch(() => {}); }); }

    function speakOnce(text, rate, done) {
      const zh = (lang === 'zh');
      const rt = rate || (zh ? 0.8 : 0.88);
      let finished = false, started = false, t0 = performance.now();
      const fin = () => {
        if (finished) return;
        finished = true;
        done(Math.round(performance.now() - t0), started);
      };
      // 낭독 길이를 모르는 경우의 최후 안전망 — done 은 게임 진행을 물고 있어 반드시 불려야 한다
      const guard = () => {
        setTimeout(() => { if (!started) fin(); }, 2200);
        setTimeout(fin, Math.max(1600, text.length * 105 + 900) + 2600);
      };

      // ── 폴백: 브라우저 내장 음성 ──
      const browser = () => {
        try {
          const u = new SpeechSynthesisUtterance(zh ? text : text.toLowerCase());
          u.lang = zh ? 'zh-CN' : 'en-US';
          u.rate = rt;
          u.onstart = () => { started = true; t0 = performance.now(); };
          u.onend = fin; u.onerror = fin;
          speechSynthesis.cancel(); speechSynthesis.speak(u);
        } catch (e) { setTimeout(fin, 200); }
      };

      guard();
      // ── 1순위: 서버 원어민 음성 ──
      let handed = false;
      ttsUrl(text).then(url => {
        if (finished) return;
        const a = ttsEl();
        try { a.pause(); } catch (e) {}
        a.muted = false;
        a.onplay = () => { started = true; t0 = performance.now(); };
        a.onended = fin;
        a.onerror = () => { if (!started && !handed) { handed = true; browser(); } };
        a.src = url;
        try { a.playbackRate = rt; } catch (e) {}
        const pr = a.play();
        if (pr && pr.catch) pr.catch(() => { if (!started && !handed) { handed = true; browser(); } });
      }).catch(() => { if (!finished && !handed) { handed = true; browser(); } });
    }

    // 한 줄 읽기 (①문장 미리듣기 · ②맞힌 단어). 토큰으로 이전 낭독을 폐기한다.
    function speakLine(text, rate, onDone) {
      const myToken = ++speakSeqToken;
      speakOnce(text, rate, () => {
        if (myToken !== speakSeqToken) return;
        if (onDone) onDone();
      });
    }

    /*
     * ③ 듣고 따라 하기 훈련.
     *   망고아이가 읽어준다 → **학생이 따라 말할 시간을 준다** → 다시 읽어준다 → … times 번.
     *   🔑 쉬는 시간은 고정값이 아니라 **방금 읽는 데 걸린 시간 + 0.6초**.
     *      문장이 길면 따라 말할 시간도 길어야 한다. 고정 0.9초로는 따라 말할 틈이 없었다.
     *   소리가 아예 안 나는 기기면 기다릴 이유가 없으므로 짧게 넘긴다.
     */
    function repeatDrill(text, times, rate, onDone, onPhase) {
      const myToken = ++speakSeqToken;
      const round = (n) => {
        if (myToken !== speakSeqToken) return;
        if (onPhase) onPhase('listen', n, times);           // 지금은 듣는 차례
        speakOnce(text, rate, (spokenMs, started) => {
          if (myToken !== speakSeqToken) return;
          const pause = started ? Math.min(6000, Math.max(1200, spokenMs + 600)) : 400;
          if (onPhase) onPhase(started ? 'say' : 'listen', n, times);   // 이제 따라 말할 차례
          setTimeout(() => {
            if (myToken !== speakSeqToken) return;
            if (n >= times) { if (onDone) onDone(); }
            else round(n + 1);
          }, pause);
        });
      };
      round(1);
    }
    function stopSpeak() {
      speakSeqToken++;
      try { speechSynthesis.cancel(); } catch(e) {}
      // ⚠ 서버 음성(오디오 요소)도 같이 끊어야 한다 — 안 그러면 앞 낭독이 새 낭독 위에 겹친다
      try { if (ttsAudio) { ttsAudio.pause(); ttsAudio.onended = null; ttsAudio.onerror = null; } } catch(e) {}
    }

    function sparks(x, y, tint) {
      for (let i = 0; i < 14; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = x+'px'; s.style.top = y+'px';
        if (tint) s.style.background = 'rgb(' + tint + ')';
        document.body.appendChild(s);
        const a = Math.random()*Math.PI*2, dist = 40 + Math.random()*120;
        s.animate([
          { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
          { transform:`translate(${Math.cos(a)*dist-6}px, ${Math.sin(a)*dist-6}px) scale(.2)`, opacity:0 }
        ], { duration: 420 + Math.random()*260, easing:'cubic-bezier(.2,.7,.3,1)' });
        setTimeout(()=>s.remove(), 720);
      }
    }

    function hitCorrect(m) {
      sfxKill();
      m.dead = true;
      const r = m.el.getBoundingClientRect();
      sparks(r.left + r.width/2, r.top + r.height*0.45, m.creature.aura);
      m.el.classList.add('boom');
      setTimeout(()=>m.el.remove(), 520);

      wave.next++;
      score += 60;
      try{ if(window.MangoiMemory) MangoiMemory.log({ en:m.word }, true); }catch(_e){}   // 🧠 다른 게임과 이어지게
      scoreEl.textContent = score;
      renderSlots();
      flash.className=''; void flash.offsetWidth; flash.classList.add('hitfx');
      field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'), 300);

      const finished = (wave.next >= wave.words.length);
      // ⚠ 마지막 단어면 **먼저 루프를 멈춘다.** 단어를 읽어주는 사이(약 1초)에 남은 괴물이
      //   도달해서 목숨이 깎이면 안 된다.
      if (finished) wave.failed = true;

      // 맞힌 단어를 또박또박 읽어준다. 마지막 단어는 다 읽고 나서 문장 낭독으로 넘어간다.
      speakLine(m.word, (lang === 'zh') ? 0.75 : 0.8, finished ? completeSentence : null);
    }

    function hitWrong(m) {
      sfxDeflect();
      m.el.classList.remove('deflect'); void m.el.offsetWidth; m.el.classList.add('deflect');
      m.el.classList.add('wrongHit');
      score = Math.max(0, score - 20);
      scoreEl.textContent = score;
      /* 🧠 틀린 단어를 기억 큐에 — 다음에 다른 게임에서 이 단어를 먼저 만나게 된다.
         ⚠️ m.word 는 '학생이 쏜 괴물의 단어'(= 오답 단어)다. 목표 단어가 아니다.
            그래도 이걸 적립하는 게 맞다 — 헷갈린 단어가 곧 약점이다. */
      try{ if(window.MangoiMemory) MangoiMemory.log({ en:m.word }, false); }catch(_e){}
      // 오답 = 그 괴물이 확 다가온다
      m.born -= m.dur * 0.16;
      field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'), 300);
    }

    function completeSentence() {
      const S = wave.sentence;
      const bonus = 120;
      score += bonus; cleared++;
      built.push(S);
      scoreEl.textContent = score;
      sentEl.textContent = cleared;

      wave.monsters.forEach(o => { if (!o.dead) { o.dead = true; o.el.classList.add('flee'); } });

      const full = fullSentence(S);
      killPop.querySelector('.en').textContent = full;
      killPop.querySelector('.ko').textContent = S.ko;
      killPop.querySelector('.pts').textContent = '문장 완성! +' + bonus;
      killPop.classList.remove('show'); void killPop.offsetWidth; killPop.classList.add('show');
      sfxClear();

      fetch('/api/games/space-monster/hit', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ score, creature:'sentence', stage, word: full })
      }).catch(()=>{});

      wave.failed = true;   // 루프 정지

      // ③ 문장을 다 맞혔으면 **말해야** 다음으로 간다.
      //    훈련하는 동안은 제한시간을 멈춘다 — 따라 말하는 시간이 손해가 되면 안 된다.
      const dots = repeatPop.querySelectorAll('.dots i');
      const sentLine = repeatPop.querySelector('.sent');
      wave.drilling = true;

      /* 다음 문장(또는 다음 스테이지)으로 넘어가는 공통 마무리 — 어느 경로로 끝나든 여기로 모인다 */
      function afterSpeaking() {
        if (wave) wave.drilling = false;
        repeatPop.classList.remove('show', 'say');
        if (cleared >= stage * SENTENCES_PER_STAGE) {
          if (stage >= LEVELS.length) { endGame(); return; }
          stage++; stageEl.textContent = stage + '/' + LEVELS.length;
        }
        setTimeout(startWave, 700);
      }

      /* 🎤 (2026-08-14) 마이크를 켜고 **채점**하는 드릴.
         ⚠️ 예전 이 자리는 «망고아이가 3번 읽어주고 따라 말하라고만 하는» 경로였다 — 마이크가 없었다.
            4단 사이클(MangoiCycle)은 3문장에 1번만 도니까, 나머지 2번은 이 경로로 빠졌다.
            그래서 학생 눈에는 «점수도 안 나오고 3번을 다 해도 통과가 안 되는» 게임이었다(현장 지적).
         규칙은 다른 게임과 같다:
           · 듣기 1회 → 바로 말하기
           · 첫 시도 100점 → 즉시 통과 + 원샷 보너스
           · 100점 미만이면 정답을 다시 들려주고 최대 3회까지 재도전
           · 마이크가 없거나 소리가 안 잡히는 기기는 예전처럼 듣기만 하고 넘어간다(게임을 막지 않는다) */
      const SM_PERFECT = 0.98;
      function drillFeed(html){ const f = repeatPop.querySelector('.feed'); if (f) f.innerHTML = html || ''; }

      function legacyDrill() {   // 이름은 그대로 둔다 — 부르는 곳이 여러 군데다
        sentLine.textContent = full;                 // 따라 말하려면 문장이 보여야 한다
        drillFeed('');
        repeatPop.classList.add('show');
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        // 마이크가 아예 없는 기기 → 예전처럼 듣기만 (소리 노출은 유지)
        if (!SR || !window.MangoiScore) {
          repeatDrill(full, 3, (lang === 'zh') ? 0.72 : 0.78, afterSpeaking,
            (phase, n) => {
              repeatPop.classList.toggle('say', phase === 'say');
              dots.forEach((d, i) => d.classList.toggle('on', i < n));
            });
          return;
        }

        let tries = 0, best = 0;
        const setDots = (n) => dots.forEach((d, i) => d.classList.toggle('on', i < n));

        function listenThenSpeak() {
          repeatPop.classList.remove('say');
          setDots(0);
          drillFeed('');
          speakOnce(full, (lang === 'zh') ? 0.72 : 0.78, () => {
            if (!wave || !wave.drilling) return;   // 드릴이 끝났으면 중단
            repeatPop.classList.add('say');           // 이제 말할 차례
            listenSay();
          });
        }

        function finish(perfect) {
          stopRec();
          if (perfect) {
            drillFeed('<b>&#127942; 원샷 원킬! 100점</b>');
            try { score += 200; scoreEl.textContent = score; } catch (e) {}
          }
          setTimeout(afterSpeaking, perfect ? 1100 : 700);
        }

        let rec = null;
        function stopRec(){ try { if (rec) { rec.__done = true; rec.stop(); } } catch (e) {} rec = null; }

        function listenSay() {
          tries++;
          setDots(tries - 1);
          let said = '', done = false, sil = null;
          try { rec = new SR(); } catch (e) { afterSpeaking(); return; }
          rec.lang = (lang === 'zh') ? 'zh-CN' : 'en-US';
          rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 3;
          const arm = (ms) => { clearTimeout(sil); sil = setTimeout(() => { try { rec.stop(); } catch (e) {} }, ms || (said ? 2600 : 9000)); };
