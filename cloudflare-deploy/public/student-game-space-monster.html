<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Space Monster Hunter — 우주 괴물 퇴치</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: 'Noto Sans KR', sans-serif; }
    body {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1b4d 100%);
      color: #e8f0ff;
      overflow: hidden;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hud {
      display: flex;
      gap: 20px;
      padding: 12px;
      background: rgba(8, 16, 34, 0.8);
      border-bottom: 1px solid rgba(59, 130, 246, 0.3);
    }

    .stat { display: flex; flex-direction: column; }
    .stat .label { font-size: 10px; color: #9fb3d6; }
    .stat .value { font-size: 18px; font-weight: 800; }

    #field {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(100,150,255,.1), transparent);
      overflow: hidden;
    }

    .monster {
      position: absolute;
      cursor: pointer;
      width: 150px;
      height: 180px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      filter: drop-shadow(0 0 15px rgba(147, 51, 234, 0.6));
      animation: approach 5s linear forwards;
    }

    @keyframes approach {
      0% { transform: scale(0.1); opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { transform: scale(1.0); opacity: 0; }
    }

    .monster.hit {
      animation: none !important;
      opacity: 0.2;
      filter: grayscale(100%);
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(251, 191, 36, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 100;
    }

    #gameOverModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #gameOverModal.show {
      display: flex;
    }

    #gameOverModal h2 {
      font-size: 40px;
      color: #fbbf24;
    }

    #gameOverModal button {
      padding: 12px 24px;
      background: #fbbf24;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="stat">
        <div class="label">SCORE</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="stat">
        <div class="label">STAGE</div>
        <div class="value" id="stageVal">1/3</div>
      </div>
      <div class="stat" style="margin-left: auto;">
        <div class="label">TIME</div>
        <div class="value" id="timerVal">60</div>
      </div>
    </div>
    <div id="field"></div>
  </div>

  <div id="crosshair"></div>

  <div id="gameOverModal">
    <h2 id="gameOverTitle">Game Over!</h2>
    <p id="gameOverText" style="font-size: 18px; color: #9fb3d6;">Score: 0</p>
    <button onclick="location.reload()">Restart</button>
  </div>

  <script>
    console.log('🎮 Space Monster Hunter — Script Started');

    const field = document.getElementById('field');
    const scoreEl = document.getElementById('scoreVal');
    const timerEl = document.getElementById('timerVal');
    const gameOverModal = document.getElementById('gameOverModal');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverText = document.getElementById('gameOverText');

    let score = 0;
    let timeLeft = 60;
    let gameActive = true;
    let spawnTimer = null;

    const creatures = [
      { name: 'tripod', img: 'tripod-level-01-frame-00.png' },
      { name: 'blob', img: 'blob-level-01-frame-00.png' },
      { name: 'spider', img: 'spider-level-01-frame-00.png' }
    ];

    function spawnMonster() {
      if (!gameActive) {
        console.log('❌ Game inactive, skip spawn');
        return;
      }

      console.log('✅ Spawning monster...');

      const creature = creatures[Math.floor(Math.random() * creatures.length)];
      const monster = document.createElement('div');

      monster.className = 'monster';
      monster.style.backgroundImage = `url('/img/space-monsters/${creature.img}')`;
      monster.style.left = Math.random() * 60 + 20 + '%';

      monster.onclick = (e) => {
        e.stopPropagation();
        if (monster.classList.contains('hit')) return;

        monster.classList.add('hit');
        score += 100;
        scoreEl.textContent = score;

        console.log('💥 Hit! Score:', score);

        setTimeout(() => monster.remove(), 500);
      };

      field.appendChild(monster);
      console.log('➕ Monster added to field');

      setTimeout(() => {
        if (monster.parentElement && !monster.classList.contains('hit')) {
          monster.remove();
          console.log('⏰ Monster timeout');
        }
      }, 5000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      clearInterval(spawnTimer);

      document.querySelectorAll('.monster').forEach(m => m.remove());

      gameOverTitle.textContent = 'Game Over!';
      gameOverText.textContent = `Final Score: ${score}`;
      gameOverModal.classList.add('show');

      console.log('🏁 Game Over. Final Score:', score);
    }

    console.log('⏰ Starting game...');

    const timerInterval = setInterval(() => {
      timeLeft--;
      timerEl.textContent = timeLeft;

      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);

    // 첫 괴물 즉시 스폰
    spawnMonster();

    // 매 2초마다 스폰
    spawnTimer = setInterval(() => {
      spawnMonster();
    }, 2000);

    console.log('✅ Game initialized');
  </script>

</body>
</html>
