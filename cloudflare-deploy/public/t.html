<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>레벨테스트 — 망고아이 / Mangoi Level Test</title>
<link rel="stylesheet" href="/css/mangoi-han.css?v=2">
<link rel="stylesheet" href="/css/mangoi-layout.css?v=1"><!-- 📐 화면 비율 통일 (2026-08-14 피드백 ①) --><!-- 한자 글꼴 통일 (전 화면 공통 가드) -->

<!--
  🎟️ 레벨테스트 티켓 — 「확인」과 「입장」을 한 화면에.
  이 페이지 하나가 시간에 따라 모습을 바꾼다: 수업 전엔 일정, 10분 전부터 입장 버튼, 끝난 뒤엔 결과.
  ⚠️ 설계 원칙 — 로그인·앱설치·이름입력을 절대 요구하지 않는다. 링크(서명 토큰)가 곧 신원이다.
     신청자의 절반은 학생 계정이 아직 없다. 여기서 로그인을 물으면 그 사람들은 다시 막힌다.
  ⚠️ 가볍게 유지할 것. 외부 스크립트·폰트·이미지 0개.
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:#0b1020;color:#e6ecff;
       font-family:MangoiHanSC,-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',system-ui,sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{font-weight:800;font-size:15px;color:#fbbf24;letter-spacing:.3px}
  .lang{background:rgba(148,163,184,.14);border:1px solid rgba(148,163,184,.3);color:#cbd5e1;
        border-radius:99px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(148,163,184,.18);
        border-radius:16px;padding:20px 18px;margin-bottom:14px}
  .badge{display:inline-block;padding:5px 13px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:12px}
  h1{font-size:19px;font-weight:800;margin:0 0 6px;line-height:1.4}
  .when{font-size:22px;font-weight:800;color:#fde68a;margin:10px 0 4px;letter-spacing:-.3px}
  .sub{font-size:13px;color:#a3b3d1;line-height:1.65}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
       border-top:1px solid rgba(148,163,184,.13);font-size:13.5px}
  .row:first-of-type{border-top:0}
  .row b{color:#e6ecff;font-weight:700}
  .k{color:#94a3b8}
  .join{display:block;text-align:center;text-decoration:none;padding:22px 16px;border-radius:16px;
        background:linear-gradient(135deg,#34d399,#059669);color:#052e1b;font-weight:800;font-size:22px;
        box-shadow:0 10px 28px -8px rgba(16,185,129,.65);margin-bottom:12px}
  .join:active{transform:translateY(1px)}
  .count{text-align:center;font-size:13px;color:#93c5fd;margin:-4px 0 14px;font-weight:700}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
  .btn{display:block;text-align:center;text-decoration:none;padding:13px 10px;border-radius:11px;
       background:rgba(99,102,241,.16);border:1px solid rgba(129,140,248,.4);color:#c7d2fe;
       font-weight:700;font-size:13.5px}
  /* 🔔 알림 받기 — 수업 «전» 에는 이게 가장 중요한 행동이다. 폰이 대신 기억해 주면
     문자를 놓쳐도 안 놓친다. 그래서 작은 버튼 줄에 섞지 않고 한 줄을 통째로 준다.
     ⚠️ 초록 입장 버튼과 동시에 뜨지 않는다(시작 전에만) — 그래서 색을 세게 써도 안 부딪힌다. */
  .remind{display:block;text-decoration:none;padding:16px 16px;border-radius:14px;margin-bottom:10px;
          background:linear-gradient(135deg,rgba(251,191,36,.20),rgba(245,158,11,.12));
          border:1.5px solid rgba(251,191,36,.55);box-shadow:0 8px 24px -12px rgba(245,158,11,.6)}
  .remind b{display:block;color:#fde68a;font-size:16px;font-weight:800;margin-bottom:4px}
  .remind span{display:block;color:#cbb994;font-size:12.5px;line-height:1.6}
  .muted{font-size:12px;color:#6b7a99;line-height:1.7;text-align:center;margin-top:18px}
  .err{background:rgba(239,68,68,.1);border-color:rgba(248,113,113,.4);color:#fecaca}
  /* 💬 문의 = 카카오 채널. 문자로 들어오는 화면이라 «폰에서 엄지로» 누른다 —
     12px 인라인 글자는 조준이 안 된다. 색은 카카오 노랑으로, 손가락 크기의 칩으로 준다. */
  a.help{display:inline-block;margin-left:4px;padding:9px 15px;border-radius:99px;
         background:#FEE500;color:#191919;font-weight:800;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">🥭 <span data-ko="망고아이 레벨테스트" data-en="Mangoi Level Test">망고아이 레벨테스트</span></div>
    <button class="lang" id="lang-btn" onclick="toggleLang()">EN</button>
  </div>
  <div id="body"><div class="card"><div class="sub" data-ko="불러오는 중…" data-en="Loading…">불러오는 중…</div></div></div>
  <div class="muted">
    <span data-ko="문의" data-en="Questions">문의</span>
    <!-- 🔴 fix (2026-08-08) — 눌러도 아무 일이 안 일어나던 카카오 채널 링크.
         원인이 둘이었다.
         ① 주소가 `/chat` 이었다. PC 웹에서 pf.kakao.com/<id>/chat 은 «비로그인이면»
            accounts.kakao.com 로그인 화면으로 튕긴다. 문의하려던 학부모가 로그인 벽을 만난다.
            채널 «홈»(/<id>)은 로그인 없이 열리고, 그 안에 「채팅으로 문의하기」·전화·위치가 다 있다.
         ② 이 화면은 문자 링크로 들어온다 → 카톡·문자앱 «인앱 브라우저» 인 경우가 많은데
            거기선 target="_blank" 가 조용히 씹힌다(새 창을 못 연다). 그래서 아래에서
            window.open 이 실패하면 같은 창으로라도 반드시 연다.
         ⚠️ 채널 ID `_xlqnSxd` 는 저장소 전체 공통값이다. 바꿀 일이 생기면 여기만 고치지 말 것. -->
    <a class="help" id="kakao-help" href="https://pf.kakao.com/_xlqnSxd"
       target="_blank" rel="noopener"
       data-ko="💬 카카오톡 채널 문의" data-en="💬 Ask on KakaoTalk">💬 카카오톡 채널 문의</a>
  </div>
</div>

<script>
(function(){
  var K = new URLSearchParams(location.search).get('k') || '';
  var EN = false;
  try { EN = (localStorage.getItem('mangoi_lang') || '') === 'en'; } catch(e){}
  var T = null, timer = null;
  /* 🔑 4자리는 «이 화면이 열려 있는 동안만» 기억한다. 저장하면 남의 폰에서도 열린다. */
  var PIN = '';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function t(ko, en){ return EN ? en : ko; }

  function applyStatic(){
    document.getElementById('lang-btn').textContent = EN ? '한국어' : 'EN';
    document.documentElement.lang = EN ? 'en' : 'ko';
    var ns = document.querySelectorAll('[data-ko]');
    for (var i=0;i<ns.length;i++){
      var v = ns[i].getAttribute(EN ? 'data-en' : 'data-ko');
      if (v != null) ns[i].textContent = v;
    }
  }
  window.toggleLang = function(){
    EN = !EN;
    try { localStorage.setItem('mangoi_lang', EN ? 'en' : 'ko'); } catch(e){}
    applyStatic(); if (T) render(T);
  };

  // 「8월 6일(목) 18:00」 — 서버가 준 원시값으로 화면에서 만든다(서버 문자열 이중관리 방지)
  function whenLabel(dateStr, timeStr){
    if (!dateStr) return timeStr || t('일정 협의 중','To be arranged');
    var p = String(dateStr).split('-');
    if (p.length !== 3) return dateStr + (timeStr ? ' ' + timeStr : '');
    var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
    var wkKo = ['일','월','화','수','목','금','토'][d.getUTCDay()];
    var wkEn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()];
    var head = EN ? ((+p[1]) + '/' + (+p[2]) + ' (' + wkEn + ')')
                  : ((+p[1]) + '월 ' + (+p[2]) + '일(' + wkKo + ')');
    return head + (timeStr ? ' ' + timeStr : '');
  }

  var ST = {
    pending:   ['접수 완료 — 담당 선생님을 찾고 있어요','Received — finding a teacher','#fbbf24'],
    proposed:  ['담당 선생님 배정 중','Assigning a teacher','#a78bfa'],
    confirmed: ['확정 — 예정대로 진행됩니다','Confirmed — all set','#34d399'],
    done:      ['테스트 완료','Test completed','#60a5fa'],
    cancelled: ['취소됨','Cancelled','#94a3b8']
  };

  function countdown(ms){
    var m = Math.max(0, Math.round(ms/60000));
    if (m >= 60){
      var h = Math.floor(m/60), r = m%60;
      return EN ? ('in ' + h + 'h ' + r + 'm') : (h + '시간 ' + r + '분 뒤 시작');
    }
    return EN ? ('in ' + m + ' min') : (m + '분 뒤 시작');
  }

  function render(d){
    var st = ST[d.status] || [d.status, d.status, '#94a3b8'];
    var h = '';

    // ── ① 지금 들어갈 수 있으면, 다른 어떤 것보다 먼저 크게 보여준다 ──
    if (d.join_open && d.join_url){
      h += '<a class="join" href="' + esc(d.join_url) + '">▶ ' + t('입장하기','Join now') + '</a>'
        +  '<div class="count">' + t('선생님이 기다리고 있어요','Your teacher is waiting') + '</div>';
    }

    h += '<div class="card">'
      +  '<div class="badge" style="background:' + st[2] + '22;color:' + st[2] + '">' + esc(EN?st[1]:st[0]) + '</div>'
      +  '<h1>' + esc(d.student_name) + t(' 님','') + '</h1>'
      +  '<div class="when">🗓 ' + esc(whenLabel(d.desired_date, d.desired_time)) + '</div>';

    // 시작 전이면 남은 시간과 «언제 문이 열리는지» 를 같이 말해 준다 (지금 못 들어가는 이유)
    if (!d.join_open && d.start_ts && d.start_ts > d.now){
      /* ⏰ 「몇 분 전부터」를 화면에 적어 두지 않는다 — 서버가 준 open_at_ts 에서 계산한다.
         숫자를 양쪽에 적으면 서버만 바뀌었을 때 화면이 거짓말을 한다(실제로 10→30분으로
         늘리면서 이 줄이 «10분»으로 남을 뻔했다). */
      var openMin = (d.open_at_ts && d.start_ts) ? Math.round((d.start_ts - d.open_at_ts) / 60000) : 10;
      h += '<div class="sub">⏳ ' + esc(countdown(d.start_ts - d.now)) + ' · '
        +  t('시작 ' + openMin + '분 전부터 입장 버튼이 열려요', 'Join opens ' + openMin + ' minutes before start') + '</div>';
    } else if (!d.join_open && d.close_at_ts && d.now > d.close_at_ts){
      h += '<div class="sub">' + t('이 수업은 종료되었어요.','This session has ended.') + '</div>';
    } else if (!d.schedule_id){
      h += '<div class="sub">' + t('수업 시간이 확정되면 문자로 알려드릴게요.','We will text you once the time is confirmed.') + '</div>';
    }

    if (d.teacher) h += '<div class="row"><span class="k">👩‍🏫 ' + t('담당 선생님','Teacher') + '</span><b>' + esc(d.teacher) + '</b></div>';

    /* 🔒 결과는 «전화번호 뒷 4자리» 를 맞춰야 열린다.
       링크는 문자로 가지만 문자는 남이 볼 수 있다. 일정·입장이 새는 건 큰일이 아니지만
       성적은 다르다. 새 비밀번호를 만들게 하는 대신, 본인이 적어 낸 번호의 끝 4자리만 묻는다.
       ⚠️ 여기서 막히더라도 위의 입장 버튼은 그대로다 — 수업에 못 들어가는 일은 없다. */
    if (d.result_locked){
      h += '<div class="card" style="margin-top:-2px">'
        +   '<div class="sub" style="margin-bottom:9px">🔒 '
        +     t('결과는 본인만 볼 수 있어요. 신청하신 전화번호 <b>뒷 4자리</b>를 넣어 주세요.',
              'Results are private. Enter the <b>last 4 digits</b> of the phone number you applied with.')
        +   '</div>'
        +   (d.phone_hint ? '<div class="sub" style="color:#6b7a99;margin-bottom:9px">' + esc(d.phone_hint) + '</div>' : '')
        +   '<div style="display:flex;gap:8px">'
        +     '<input id="pin" inputmode="numeric" maxlength="4" placeholder="0000" '
        +       'style="flex:1;min-width:0;padding:12px;border-radius:11px;border:1px solid rgba(148,163,184,.4);'
        +       'background:rgba(255,255,255,.95);color:#1a1a1a;font-size:17px;font-weight:800;letter-spacing:4px;text-align:center">'
        +     '<button id="pin-go" style="padding:12px 18px;border:0;border-radius:11px;cursor:pointer;'
        +       'background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;font-weight:800;font-size:14px">'
        +       t('확인','Check') + '</button>'
        +   '</div>'
        +   '<div id="pin-msg" class="sub" style="color:#fecaca;margin-top:8px;display:none"></div>'
        + '</div>';
    }
    var r = d.result || {};
    if (r.final_level) h += '<div class="row"><span class="k">🏅 ' + t('최종 레벨','Level') + '</span><b>' + esc(r.final_level) + '</b></div>';
    if (r.ai_score != null) h += '<div class="row"><span class="k">🧠 ' + t('AI 진단','AI check') + '</span><b>' + esc(r.ai_score) + '</b></div>';
    if (r.pron_score != null) h += '<div class="row"><span class="k">🎤 ' + t('발음','Pronunciation') + '</span><b>' + esc(r.pron_score) + '</b></div>';
    if (r.teacher_score != null) h += '<div class="row"><span class="k">📝 ' + t('선생님 평가','Teacher score') + '</span><b>' + esc(r.teacher_score) + '</b></div>';
    if (r.recommended_textbook) h += '<div class="row"><span class="k">📚 ' + t('추천 교재','Textbook') + '</span><b>' + esc(r.recommended_textbook) + '</b></div>';
    if (r.next_class_guide) h += '<div class="sub" style="margin-top:10px">📘 ' + esc(r.next_class_guide) + '</div>';
    h += '</div>';

    /* ── ② 🔔 알림 받기 — 수업 «전» 이면 이게 제일 중요한 행동이다 ──
       [왜] 문자는 무음모드·스팸함이면 그냥 놓친다. 캘린더 알람은 잠금화면에 뜨고 비용도 0원인데,
            그동안 「📆 캘린더에 추가」가 「장비 점검」과 같은 크기로 나란히 있어 아무도 안 눌렀다.
            누르는 이유(=알림)를 제목으로 올리고, 몇 번 언제 울리는지 그 자리에서 말해 준다.
       ⚠️ 시작 전에만 보여준다 — 이미 들어갈 수 있거나 끝난 뒤엔 누를 이유가 없다. */
    var beforeStart = !d.join_open && d.start_ts && d.start_ts > d.now;
    var openMinB = (d.open_at_ts && d.start_ts) ? Math.round((d.start_ts - d.open_at_ts) / 60000) : 10;
    if (beforeStart && d.ics_url){
      h += '<a class="remind" href="' + esc(d.ics_url) + '">'
        +   '<b>🔔 ' + t('알림 받기','Get reminders') + '</b>'
        +   '<span>' + t('하루 전과 입장이 열리는 ' + openMinB + '분 전, 두 번 울려드려요 (폰 캘린더에 넣어 둡니다)',
                         'Two alerts — a day before, and ' + openMinB + ' minutes before when joining opens (adds to your phone calendar)') + '</span>'
        +  '</a>';
    }

    // ── ③ 미리 해두면 좋은 것 ──
    h += '<div class="btns">'
      +  '<a class="btn" href="' + esc(d.precheck_url) + '" target="_blank" rel="noopener">🎧 ' + t('장비 점검','Device check') + '</a>'
      /* ⛔ 캘린더는 위 「🔔 알림 받기」 하나로만 낸다. 작은 줄에 또 두면
         ①시작 전엔 같은 것이 두 번 ②이미 들어갈 수 있거나 끝난 뒤엔 «누를 이유가 없는 버튼» 이 된다.
         (실제로 종료된 수업 화면에 「📆 캘린더에 추가」가 남아 있었다) */
      /* 🔗 다른 기기에서도 보려면 «이 링크» 만 옮기면 된다. 계정이 없는 신청자에게는
         링크가 곧 신원이라, 링크를 옮기는 것 자체가 «이어서 보기» 다.
         (카톡 나에게 보내기·메모에 붙여넣고 PC 에서 열면 그 PC 홈에도 카드가 뜬다)
         ⚠️ 이 화면은 어떤 경우에도 아이디·비밀번호를 묻지 않는다 — 하니스가 지킨다. */
      +  '<button type="button" class="btn" id="cp">🔗 ' + t('링크 복사 (다른 기기에서 보기)','Copy link (open on another device)') + '</button>'
      +  '</div>';

    if (!d.join_open && d.start_ts && d.start_ts > d.now){
      h += '<div class="muted">' + t('이 화면은 그대로 두셔도 됩니다 — 시간이 되면 입장 버튼이 저절로 나타나요.',
                                      'You can leave this page open — the Join button appears automatically.') + '</div>';
    }
    document.getElementById('body').innerHTML = h;
    /* 🔗 링크 복사. 30초마다 다시 그리므로 리스너는 «그릴 때마다» 새로 단다.
       ⚠️ navigator.clipboard 는 https 에서만 산다 — 안 되면 조용히 실패하지 말고
          주소를 그대로 띄워서 손으로라도 복사할 수 있게 한다. */
    var cpBtn = document.getElementById('cp');
    if (cpBtn) cpBtn.addEventListener('click', function(){
      var url = location.href;
      var done = function(){
        cpBtn.textContent = '✓ ' + t('복사됐어요 — 다른 기기에 붙여넣으세요','Copied — paste it on your other device');
        setTimeout(function(){ cpBtn.textContent = '🔗 ' + t('링크 복사 (다른 기기에서 보기)','Copy link (open on another device)'); }, 2200);
      };
      try {
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, function(){ prompt(t('이 주소를 복사하세요','Copy this address'), url); });
        else prompt(t('이 주소를 복사하세요','Copy this address'), url);
      } catch(_) { prompt(t('이 주소를 복사하세요','Copy this address'), url); }
    });
    var pinBtn = document.getElementById('pin-go');
    if (pinBtn){
      var inp = document.getElementById('pin'), msg = document.getElementById('pin-msg');
      var go = function(){
        var v = (inp.value || '').replace(/\D/g,'');
        if (v.length !== 4){ msg.style.display=''; msg.textContent = t('4자리를 넣어 주세요.','Please enter 4 digits.'); return; }
        PIN = v;                       // 이 화면이 열려 있는 동안만 기억한다(저장하지 않는다)
        msg.style.display='none';
        load();
      };
      pinBtn.addEventListener('click', go);
      inp.addEventListener('keypress', function(e){ if (e.key === 'Enter') go(); });
      inp.focus();
    }
  }

  function fail(msgKo, msgEn){
    document.getElementById('body').innerHTML =
      '<div class="card err"><h1>' + t('링크를 열 수 없어요','Cannot open this link') + '</h1>'
      + '<div class="sub" style="margin-top:8px">' + t(msgKo, msgEn) + '</div></div>';
  }

  function load(){
    if (!K) { fail('주소가 올바르지 않습니다. 문자로 받은 링크를 그대로 눌러 주세요.',
                   'This address is incomplete. Please tap the link from your text message.'); return; }
    fetch('/api/leveltest/ticket?k=' + encodeURIComponent(K) + (PIN ? '&p=' + encodeURIComponent(PIN) : ''), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok || !d.ticket) {
          fail('링크가 만료되었거나 올바르지 않습니다. 학원에 문의해 주세요.',
               'This link is expired or invalid. Please contact us.');
          /* 죽은 링크를 기기에 남겨 두면 홈 카드가 계속 그 링크를 물고 늘어진다 */
          try { localStorage.removeItem('mangoi_lt_ticket'); } catch(_){}
          return;
        }
        /* 🏠 (2026-08-07) 이 링크를 «연 기기» 가 기억하게 한다 — 그러면 그 기기의 홈에도
           「🎟️ 내 레벨테스트」 카드가 뜬다.
           [왜] 그동안 홈 카드는 «신청한 그 브라우저» 에만 떴다. 문자는 폰으로 오는데
                PC 로 홈에 들어가면 자기 예약이 흔적도 없었다.
           [원리] 계정이 없는 신청자에게는 **링크가 곧 신원**이다(서명 토큰). 그 링크를 연
                기기는 이미 신원을 증명한 셈이라, 거기에 카드를 띄우는 것은 새 권한이 아니다.
           ⛔ 여기서 «로그인한 계정에 자동으로 붙이는» 짓은 하지 않는다 — 남이 이 링크를 열면
              그 사람 계정에 남의 신청이 붙어 버린다. 계정 연결은 관리자가 사람 눈으로 한다. */
        try { localStorage.setItem('mangoi_lt_ticket', location.href); } catch(_){}
        T = d.ticket; render(T);
      })
      .catch(function(e){
        // ⚠️ 이 catch 는 통신 실패뿐 아니라 위 render() 안의 오류까지 삼킨다. 조용히 삼키면
        //    «연결이 불안정해요» 만 보이고 진짜 원인이 영영 안 보인다 — 콘솔에는 남긴다.
        try { console.warn('[ticket] load failed:', e); } catch(_){}
        fail('연결이 불안정해요. 잠시 후 다시 시도해 주세요.','Connection problem. Please try again shortly.');
      });
  }

  /* 🔄 30초마다 다시 확인 — 학부모가 화면을 열어 두고 기다리는 것이 자연스러운 흐름이다.
     새로고침을 시키면 그 순간 이탈한다. 시간이 되면 입장 버튼이 «저절로» 나타나야 한다. */
  /* 💬 카카오 채널 — 인앱 브라우저에서 «새 창» 이 막히면 아무 일도 안 일어난 것처럼 보인다.
     열리지 않으면 같은 창으로라도 반드시 연다. 문의 창구가 조용히 죽는 것이 최악이다. */
  (function(){
    var kh = document.getElementById('kakao-help');
    if (!kh) return;
    kh.addEventListener('click', function(e){
      var url = this.href, w = null;
      /* 🔴 2026-09-02: 'noopener' 를 기능 문자열로 주면 «탭은 열리는데 반환값이 null» 이라(표준) 반환값 판정이 늘 «막힘» 이 된다. 빼고 w.opener=null 로 같은 보호를 건다. */
      try { w = window.open(url, '_blank'); } catch(_){}
      if (w) { try { w.opener = null; } catch(_){} }
      if (!w) { e.preventDefault(); location.href = url; }   // 팝업차단·인앱: 같은 창으로
      else e.preventDefault();                               // 새 창이 떴으면 중복 이동 방지
    });
  })();

  applyStatic();
  load();
  timer = setInterval(load, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });
})();
</script>
