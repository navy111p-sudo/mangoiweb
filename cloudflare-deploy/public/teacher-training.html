    <script src="/js/lucide-local.js?v=1"></script><!-- ph161: unpkg lucide@latest(1500종·버전 미고정) → 실제 쓰는 6종 로컬본 -->
    <!--
      ═══════════════════════════════════════════════════════════════════════
      망고아이 강사 교육 매뉴얼 v3.0 (2026-08-24 개편)

      ⚠️ 이 화면은 «Tailwind 를 쓰지 않습니다».
         v2.0 까지는 /css/tailwind-build.css 를 썼는데, 그 파일은 이 화면과
         suspect-mystery.html 에 «그때 실제로 쓰인 클래스만» 뽑아 구운 정적 빌드다.
         → 새 클래스를 한 개만 써도 스타일이 «조용히» 빠진다(에러도 안 남).
         그래서 이 화면의 모양은 전부 아래 <style> 안 `tt-` 클래스로 직접 정의한다.
         새 디자인을 얹을 때 CSS 빌드를 다시 돌릴 필요가 없다.

      ⚠️ font-family 는 body 한 곳에만 둔다(맨 앞은 반드시 MangoiHanSC).
         hanzi_font_harness 가 «맨 앞이 MangoiHanSC 인가» 를 전 파일에서 검사한다.
         SVG <text> 는 글꼴을 따로 적지 않고 body 에서 상속받는다.

      ⚠️ 차트·다이어그램은 전부 «인라인 SVG» 다. PNG 로 굽지 않는다.
         · 언어를 바꾸면 라벨이 같이 바뀐다(PNG 는 언어별로 두 벌을 구워야 했다)
         · 인쇄·PDF 에서 글자가 깨지지 않는다
         · 오타를 고칠 때 이미지를 다시 만들 필요가 없다
           (v2.0 의 PNG 에는 회사 이름 오타가 그림으로 박혀 있어 고칠 방법이 없었다)
      ═══════════════════════════════════════════════════════════════════════
    -->
    <style>
        :root{
            --tt-o:#f59e0b; --tt-o-d:#d97706; --tt-o-l:#fff7ed; --tt-o-b:#fed7aa;
            --tt-ink:#0f172a; --tt-body:#334155; --tt-mut:#64748b; --tt-soft:#94a3b8;
            --tt-line:#e2e8f0; --tt-bg:#f6f7f9; --tt-card:#ffffff;
            --tt-ok:#059669; --tt-ok-l:#ecfdf5; --tt-no:#e11d48; --tt-no-l:#fff1f2;
            --tt-blue:#2563eb; --tt-blue-l:#eff6ff; --tt-pur:#7c3aed; --tt-pur-l:#f5f3ff;
            --tt-r:16px; --tt-sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.12);
        }
        *{box-sizing:border-box}
        body{
            font-family:MangoiHanSC,'Noto Sans KR','Inter',-apple-system,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
            margin:0; background:var(--tt-bg); color:var(--tt-body);
            -webkit-text-size-adjust:100%; line-height:1.6;
        }
        img{max-width:100%}
        button{font:inherit; cursor:pointer}
        select{font:inherit}

        /* ── 뼈대 ────────────────────────────────────────────── */
        .tt-wrap{max-width:1120px; margin:0 auto; padding:0 16px}
        .tt-head{position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--tt-line)}
        .tt-head-in{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:64px; flex-wrap:wrap; padding:8px 0}
        .tt-brand{display:flex; align-items:center; gap:10px; min-width:0}
        .tt-brand img{width:42px; height:42px; object-fit:contain; flex:0 0 auto}
        .tt-brand h1{margin:0; font-size:17px; font-weight:800; color:var(--tt-ink); letter-spacing:-.2px; line-height:1.25}
        .tt-brand p{margin:1px 0 0; font-size:11.5px; font-weight:700; color:var(--tt-o-d)}
        .tt-head-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

        .tt-seg{display:inline-flex; background:#f1f5f9; border:1px solid var(--tt-line); padding:3px; border-radius:12px; gap:2px}
        .tt-seg button{border:0; background:transparent; color:var(--tt-mut); font-size:12.5px; font-weight:700;
                       padding:7px 12px; border-radius:9px; transition:background .15s,color .15s; white-space:nowrap}
        .tt-seg button:hover{color:var(--tt-ink)}
        .tt-seg button.on{background:#fff; color:var(--tt-o-d); box-shadow:0 1px 2px rgba(15,23,42,.1)}

        .tt-main{padding:24px 0 72px}
        .tt-pane[hidden]{display:none !important}

        /* ── 카드 ────────────────────────────────────────────── */
        .tt-card{background:var(--tt-card); border:1px solid var(--tt-line); border-radius:var(--tt-r); box-shadow:var(--tt-sh); padding:22px; margin-bottom:18px}
        .tt-card.pad-lg{padding:28px}
        .tt-sec-h{display:flex; align-items:flex-start; gap:12px; margin:0 0 4px}
        .tt-sec-n{flex:0 0 auto; width:34px; height:34px; border-radius:11px; background:var(--tt-o-l); color:var(--tt-o-d);
                  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; border:1px solid var(--tt-o-b)}
        .tt-sec-h h2{margin:2px 0 0; font-size:20px; font-weight:800; color:var(--tt-ink); letter-spacing:-.3px; line-height:1.35}
        .tt-sec-sub{margin:6px 0 18px 46px; font-size:13.5px; color:var(--tt-mut)}
        h3.tt-h3{font-size:15px; font-weight:800; color:var(--tt-ink); margin:0 0 10px}
        .tt-p{margin:0 0 12px; font-size:14.5px; line-height:1.85; color:var(--tt-body)}
        .tt-p b, .tt-p strong{color:var(--tt-ink); font-weight:800; background:linear-gradient(transparent 62%, #fde68a 62%)}
        .tt-mut{color:var(--tt-mut)}
        .tt-small{font-size:12.5px}

        /* ── 그리드 ──────────────────────────────────────────── */
        .tt-g{display:grid; gap:14px}
        .tt-g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
        .tt-g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
        .tt-g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
        .tt-g2w{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
        .tt-g>*{min-width:0}

        /* ── 히어로 ──────────────────────────────────────────── */
        .tt-hero{position:relative; overflow:hidden; border-radius:22px; color:#fff; padding:34px 28px;
                 background:radial-gradient(1200px 400px at 88% -10%, #fbbf24 0%, transparent 60%), linear-gradient(135deg,#f59e0b 0%,#ea8c07 48%,#d97706 100%);
                 box-shadow:0 20px 40px -24px rgba(217,119,6,.7); margin-bottom:18px}
        .tt-hero-in{display:flex; align-items:center; gap:26px; flex-wrap:wrap; position:relative; z-index:2}
        .tt-hero-char{flex:0 0 auto; width:150px; filter:drop-shadow(0 12px 18px rgba(120,53,15,.35))}
        .tt-hero-txt{flex:1 1 320px; min-width:0}
        .tt-badge{display:inline-block; background:rgba(255,255,255,.94); color:var(--tt-o-d);
                  font-weight:900; font-size:11.5px; letter-spacing:.6px; padding:5px 11px; border-radius:999px}
        .tt-hero h2{margin:12px 0 0; font-size:clamp(24px,4.2vw,36px); font-weight:900; letter-spacing:-.8px; line-height:1.25; color:#fff}
        .tt-hero .lede{margin:10px 0 0; font-size:15px; color:#fff8ec; line-height:1.7; max-width:52ch}
        .tt-hero .kicker{margin:16px 0 0; display:inline-block; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35);
                         padding:9px 14px; border-radius:12px; font-size:13.5px; font-weight:700; color:#fff}
        .tt-hero-blob{position:absolute; border-radius:50%; background:rgba(255,255,255,.10); z-index:1}

        /* ── 숫자 칩 ─────────────────────────────────────────── */
        .tt-stat{background:#fff; border:1px solid var(--tt-line); border-radius:14px; padding:16px 14px; text-align:center; border-top:4px solid var(--tt-o)}
        .tt-stat .n{font-size:26px; font-weight:900; color:var(--tt-o-d); letter-spacing:-.6px; line-height:1.2}
        .tt-stat .t{font-size:12.5px; color:var(--tt-mut); margin-top:6px; font-weight:600; line-height:1.5}
        .tt-stat.g{border-top-color:var(--tt-ok)} .tt-stat.g .n{color:var(--tt-ok)}
        .tt-stat.b{border-top-color:var(--tt-blue)} .tt-stat.b .n{color:var(--tt-blue)}
        .tt-stat.p{border-top-color:var(--tt-pur)} .tt-stat.p .n{color:var(--tt-pur)}

        /* ── 망고 말풍선 ─────────────────────────────────────── */
        .tt-say{display:flex; align-items:flex-start; gap:12px; background:var(--tt-o-l); border:1px solid var(--tt-o-b);
                border-radius:14px; padding:14px 16px; margin:16px 0}
        .tt-say img{width:46px; height:46px; object-fit:contain; flex:0 0 auto; margin-top:-2px}
        .tt-say .who{font-size:11px; font-weight:900; color:var(--tt-o-d); letter-spacing:.4px; margin-bottom:3px}
        .tt-say p{margin:0; font-size:13.5px; line-height:1.7; color:#7c2d12}
        .tt-say.blue{background:var(--tt-blue-l); border-color:#bfdbfe} .tt-say.blue .who{color:var(--tt-blue)} .tt-say.blue p{color:#1e3a5f}

        /* ── 인용 ────────────────────────────────────────────── */
        .tt-quote{position:relative; background:linear-gradient(135deg,#fffbeb,#fff7ed); border:1px solid var(--tt-o-b);
                  border-left:5px solid var(--tt-o); border-radius:14px; padding:20px 22px; margin:18px 0}
        .tt-quote p{margin:0; font-size:15.5px; font-weight:700; line-height:1.8; color:#7c2d12}
        .tt-quote .mark{font-size:34px; font-weight:900; color:var(--tt-o); line-height:.8; display:block; margin-bottom:6px}

        /* ── 원칙 카드 ───────────────────────────────────────── */
        .tt-pr{background:#fff; border:1px solid var(--tt-line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:8px;
               border-top:4px solid var(--tt-o); height:100%}
        .tt-pr .num{font-size:11px; font-weight:900; letter-spacing:1px; color:var(--tt-o-d)}
        .tt-pr h4{margin:0; font-size:15px; font-weight:800; color:var(--tt-ink); line-height:1.4}
        .tt-pr .why{margin:0; font-size:13px; color:var(--tt-mut); line-height:1.65}
        .tt-pr .do{margin:0; font-size:13px; line-height:1.65; color:#065f46; background:var(--tt-ok-l); border-radius:9px; padding:9px 11px}
        .tt-pr .no{margin:0; font-size:13px; line-height:1.65; color:#9f1239; background:var(--tt-no-l); border-radius:9px; padding:9px 11px}

        /* ── 표 ──────────────────────────────────────────────── */
        .tt-tw{overflow-x:auto; border:1px solid var(--tt-line); border-radius:12px; background:#fff}
        table.tt-t{width:100%; border-collapse:collapse; min-width:640px}
        table.tt-t th{background:#f8fafc; font-size:11.5px; font-weight:800; color:#334155; text-align:left;
                      padding:11px 12px; border-bottom:1px solid var(--tt-line); white-space:nowrap; letter-spacing:.2px}
        table.tt-t td{font-size:13px; padding:12px; border-bottom:1px solid #f1f5f9; vertical-align:top; line-height:1.65; color:var(--tt-body)}
        table.tt-t tr:last-child td{border-bottom:0}
        table.tt-t th.ok, table.tt-t td.ok{background:var(--tt-ok-l); color:#065f46}
        table.tt-t th.no, table.tt-t td.no{background:var(--tt-no-l); color:#9f1239}
        table.tt-t td.k{font-weight:800; color:var(--tt-ink); white-space:nowrap}
        table.tt-t td.c{text-align:center; font-weight:800; color:var(--tt-o-d)}

        /* ── 스크립트 박스 ───────────────────────────────────── */
        .tt-scr{background:#fff; border:1px solid var(--tt-line); border-radius:14px; overflow:hidden; height:100%}
        .tt-scr-h{background:#0f172a; color:#fff; padding:10px 14px; font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:7px}
        .tt-scr-b{padding:6px 0}
        .tt-line{padding:9px 14px; border-bottom:1px dashed #eef2f7}
        .tt-line:last-child{border-bottom:0}
        .tt-line .en{font-size:14px; font-weight:700; color:var(--tt-ink); line-height:1.5}
        .tt-line .ko{font-size:12px; color:var(--tt-mut); margin-top:2px; line-height:1.5}

        /* ── 문답(트러블슈팅) ────────────────────────────────── */
        .tt-fix{background:#fff; border:1px solid var(--tt-line); border-radius:14px; padding:0; overflow:hidden; height:100%}
        .tt-fix-h{padding:14px 16px; background:#fef2f2; border-bottom:1px solid #fee2e2}
        .tt-fix-h .sit{font-size:14px; font-weight:800; color:#9f1239; line-height:1.5}
        .tt-fix-b{padding:14px 16px}
        .tt-fix-b .why{font-size:12.5px; color:var(--tt-mut); margin:0 0 10px; line-height:1.65}
        .tt-fix-b ol{margin:0; padding-left:18px}
        .tt-fix-b li{font-size:13px; line-height:1.7; color:var(--tt-body); margin-bottom:5px}
        .tt-fix-b li b{color:var(--tt-ink)}

        /* ── 비교(전/후) ─────────────────────────────────────── */
        .tt-vs{border-radius:14px; border:1px solid var(--tt-line); overflow:hidden; height:100%}
        .tt-vs.bad{border-color:#fecdd3} .tt-vs.good{border-color:#a7f3d0}
        .tt-vs-h{padding:12px 16px; font-size:13.5px; font-weight:800}
        .tt-vs.bad .tt-vs-h{background:var(--tt-no-l); color:#9f1239}
        .tt-vs.good .tt-vs-h{background:var(--tt-ok-l); color:#065f46}
        .tt-vs ul{margin:0; padding:12px 16px 14px 30px; background:#fff}
        .tt-vs li{font-size:13px; line-height:1.75; margin-bottom:6px; color:var(--tt-body)}

        /* ── 도구 배지 ───────────────────────────────────────── */
        .tt-chip{display:inline-block; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:999px;
                 background:var(--tt-o-l); color:var(--tt-o-d); border:1px solid var(--tt-o-b); white-space:nowrap}
        .tt-chip.g{background:var(--tt-ok-l); color:#065f46; border-color:#a7f3d0}
        .tt-chip.b{background:var(--tt-blue-l); color:#1d4ed8; border-color:#bfdbfe}
        .tt-chip.p{background:var(--tt-pur-l); color:#6d28d9; border-color:#ddd6fe}

        /* ── SVG 그림 상자 ───────────────────────────────────── */
        .tt-fig{background:#fff; border:1px solid var(--tt-line); border-radius:14px; padding:16px; margin:16px 0}
        .tt-fig svg{display:block; width:100%; height:auto; max-width:660px; margin:0 auto}
        .tt-fig.cycle svg{max-width:520px}
        .tt-fig figcaption{margin-top:10px; font-size:12px; color:var(--tt-mut); text-align:center; line-height:1.6}
        .tt-fig.tight{padding:10px}

        /* ── 버튼 ────────────────────────────────────────────── */
        .tt-btn{display:inline-flex; align-items:center; gap:7px; border:0; border-radius:12px; font-size:13px; font-weight:800;
                padding:11px 16px; color:#fff; background:var(--tt-o-d); transition:filter .15s}
        .tt-btn:hover{filter:brightness(1.08)}
        .tt-btn.green{background:var(--tt-ok)}
        .tt-btn.ghost{background:#fff; color:var(--tt-body); border:1px solid var(--tt-line)}
        .tt-btn svg{width:16px; height:16px; flex:0 0 auto}

        /* ── 체크리스트 ──────────────────────────────────────── */
        .tt-prog{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
        .tt-prog .bar{flex:1 1 180px; height:10px; background:#eef2f7; border-radius:999px; overflow:hidden; min-width:120px}
        .tt-prog .bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#f59e0b,#10b981); border-radius:999px; transition:width .3s}
        .tt-prog .pct{font-size:14px; font-weight:900; color:var(--tt-ok); min-width:44px; text-align:right}
        input[type=checkbox].tt-chk{width:19px; height:19px; accent-color:#059669; cursor:pointer}

        /* ── 루브릭 ──────────────────────────────────────────── */
        .tt-rub-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
                    background:#f8fafc; border:1px solid var(--tt-line); border-radius:12px; padding:13px 15px; margin-bottom:10px}
        .tt-rub-row h4{margin:0; font-size:13.5px; font-weight:800; color:var(--tt-ink)}
        .tt-rub-row p{margin:3px 0 0; font-size:12px; color:var(--tt-mut); line-height:1.6}
        .tt-rub-row select{border:1px solid var(--tt-line); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:700;
                           background:#fff; color:var(--tt-ink); min-width:140px}
        .tt-score{background:#0f172a; color:#fff; border-radius:16px; padding:22px}
        .tt-score .lbl{font-size:11px; font-weight:800; letter-spacing:1px; color:#94a3b8; text-transform:uppercase}
        .tt-score .big{font-size:52px; font-weight:900; color:#fbbf24; line-height:1.05; letter-spacing:-2px}
        .tt-score .of{font-size:16px; color:#94a3b8; font-weight:700}
        .tt-score .bdg{display:inline-block; margin-top:12px; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:900; background:#fbbf24; color:#0f172a}
        .tt-score .fb{font-size:13px; line-height:1.75; color:#cbd5e1; margin:12px 0 0}
        .tt-score ul{list-style:none; margin:16px 0 0; padding:14px 0 0; border-top:1px solid #1e293b}
        .tt-score li{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:#cbd5e1; padding:3px 0}

        /* ── 로드맵/타임라인 세로 ────────────────────────────── */
        .tt-steps{list-style:none; margin:0; padding:0}
        .tt-steps li{position:relative; padding:0 0 20px 44px; border-left:2px solid var(--tt-o-b); margin-left:15px}
        .tt-steps li:last-child{border-left-color:transparent; padding-bottom:0}
        .tt-steps li .dot{position:absolute; left:-16px; top:0; width:30px; height:30px; border-radius:50%;
                          background:var(--tt-o); color:#fff; font-weight:900; font-size:12px; display:flex; align-items:center; justify-content:center;
                          box-shadow:0 0 0 4px #fff}
        .tt-steps li h4{margin:3px 0 4px; font-size:14.5px; font-weight:800; color:var(--tt-ink)}
        .tt-steps li p{margin:0 0 6px; font-size:13px; color:var(--tt-body); line-height:1.7}

        /* ── 서명 ────────────────────────────────────────────── */
        .tt-sign{border:2px dashed var(--tt-line); border-radius:16px; padding:22px; text-align:center}
        .tt-sign .row{display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-top:26px}
        .tt-sign .box{flex:1 1 200px; max-width:280px}
        .tt-sign .rule{height:44px; border-bottom:1px solid var(--tt-line); display:flex; align-items:center; justify-content:center;
                       color:var(--tt-soft); font-size:11px; font-style:italic; font-weight:700}

        /* ── 목차 ────────────────────────────────────────────── */
        .tt-toc{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
        .tt-toc a{text-decoration:none; font-size:12.5px; font-weight:700; color:var(--tt-body); background:#fff;
                  border:1px solid var(--tt-line); border-radius:999px; padding:7px 13px; transition:border-color .15s,color .15s}
        .tt-toc a:hover{border-color:var(--tt-o); color:var(--tt-o-d)}
        [id^="sec-"]{scroll-margin-top:88px}

        /* ── 인쇄 ────────────────────────────────────────────── */
        @media print{
            .tt-no-print{display:none !important}
            body{background:#fff}

/* ═══════════════════════════════════════════════════════════════════════
   그림(SVG) 만들기
   ⚠️ <text> 에 font-family 를 적지 않는다 — body 에서 상속받는다.
      (hanzi_font_harness 는 모든 font-family 의 «맨 앞» 이 MangoiHanSC 인지 검사한다.
       SVG 안에 글꼴을 새로 적으면 그 검사를 통과하지 못한다.)
   ═══════════════════════════════════════════════════════════════════════ */
var MANGO = '/img/mango-char.png';

function svgOpen(vb, extra) {
  return '<svg viewBox="' + vb + '" role="img" xmlns="http://www.w3.org/2000/svg" ' +
         'preserveAspectRatio="xMidYMid meet"' + (extra || '') + '>';
}
function txt(x, y, s, size, color, weight, anchor) {
  return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + color +
         '" font-weight="' + (weight || 400) + '" text-anchor="' + (anchor || 'start') + '">' + s + '</text>';
}

/* ① 몰입도 곡선 — 첫 5분이 나머지를 가른다 */
function svgCurve(c) {
  var X0 = 64, X1 = 612, Y0 = 246, Y1 = 44;
  var mx = function (m) { return X0 + (m / 25) * (X1 - X0); };
  var my = function (v) { return Y0 - (v / 100) * (Y0 - Y1); };
  var good = [[0,32],[2,68],[5,88],[8,79],[10,92],[13,76],[16,88],[20,80],[25,90]];
  var bad  = [[0,32],[2,44],[5,38],[8,27],[10,19],[13,15],[16,12],[20,10],[25,8]];
  var pts = function (a) { return a.map(function (p) { return mx(p[0]).toFixed(1) + ',' + my(p[1]).toFixed(1); }).join(' '); };

  var s = svgOpen('0 0 640 300', ' aria-label="' + c.title + '"');
  s += '<rect width="640" height="300" fill="#fff"/>';
  s += txt(320, 22, c.title, 14, '#0f172a', 800, 'middle');
  /* 격자 */
  for (var g = 0; g <= 4; g++) {
    var y = Y1 + (Y0 - Y1) * g / 4;
    s += '<line x1="' + X0 + '" y1="' + y + '" x2="' + X1 + '" y2="' + y + '" stroke="#eef2f7" stroke-width="1"/>';
  }
  /* 첫 5분 구간 강조 */
  s += '<rect x="' + X0 + '" y="' + Y1 + '" width="' + (mx(5) - X0) + '" height="' + (Y0 - Y1) + '" fill="#fef3c7" opacity=".55"/>';
  s += '<line x1="' + mx(5) + '" y1="' + Y1 + '" x2="' + mx(5) + '" y2="' + Y0 + '" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4"/>';
  s += txt(mx(5) + 7, Y1 + 14, c.note1, 11, '#b45309', 800);
  /* 축 */
  s += '<line x1="' + X0 + '" y1="' + Y0 + '" x2="' + X1 + '" y2="' + Y0 + '" stroke="#cbd5e1" stroke-width="1.5"/>';
  s += '<line x1="' + X0 + '" y1="' + Y1 + '" x2="' + X0 + '" y2="' + Y0 + '" stroke="#cbd5e1" stroke-width="1.5"/>';
  [0, 5, 10, 15, 20, 25].forEach(function (m) { s += txt(mx(m), Y0 + 17, String(m), 10.5, '#94a3b8', 600, 'middle'); });
  s += txt((X0 + X1) / 2, Y0 + 36, c.xlab, 11, '#64748b', 700, 'middle');
  s += '<text x="18" y="' + ((Y0 + Y1) / 2) + '" font-size="11" fill="#64748b" font-weight="700" text-anchor="middle" transform="rotate(-90 18 ' + ((Y0 + Y1) / 2) + ')">' + c.ylab + '</text>';
  /* 선 */
  s += '<polyline points="' + pts(bad) + '" fill="none" stroke="#fda4af" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>';
  s += '<polyline points="' + pts(good) + '" fill="none" stroke="#059669" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
  good.forEach(function (p) { s += '<circle cx="' + mx(p[0]) + '" cy="' + my(p[1]) + '" r="3.5" fill="#059669"/>'; });
  bad.forEach(function (p) { s += '<circle cx="' + mx(p[0]) + '" cy="' + my(p[1]) + '" r="3" fill="#fb7185"/>'; });
  /* 이탈 표시 */
  s += txt(mx(19), my(9) + 20, c.note2, 11, '#e11d48', 800, 'middle');
  /* 범례 */
  s += '<line x1="' + (X0 + 8) + '" y1="' + (Y1 - 10) + '" x2="' + (X0 + 34) + '" y2="' + (Y1 - 10) + '" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>';
  s += txt(X0 + 40, Y1 - 6, c.good, 11.5, '#065f46', 700);
  s += '<line x1="' + (X0 + 250) + '" y1="' + (Y1 - 10) + '" x2="' + (X0 + 276) + '" y2="' + (Y1 - 10) + '" stroke="#fda4af" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>';
  s += txt(X0 + 282, Y1 - 6, c.bad, 11.5, '#9f1239', 700);
  return s + '</svg>';
}

/* ② 발화 비율 도넛 — 아이 60% / 강사 40% */
function svgDonut(d) {
  var CX = 150, CY = 150, R = 96, SW = 34;
  var C = 2 * Math.PI * R;
  var s = svgOpen('0 0 560 300', ' aria-label="' + d.sttTitle + '"');
  s += '<rect width="560" height="300" fill="#fff"/>';
  s += '<g transform="rotate(-90 ' + CX + ' ' + CY + ')">';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#e2e8f0" stroke-width="' + SW + '"/>';
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="#059669" stroke-width="' + SW +
       '" stroke-dasharray="' + (C * 0.6).toFixed(1) + ' ' + (C * 0.4).toFixed(1) + '" stroke-linecap="butt"/>';
  s += '</g>';
  s += txt(CX, CY + 2, '60%', 42, '#059669', 900, 'middle');
  s += txt(CX, CY + 26, d.sttStudent, 13, '#64748b', 700, 'middle');
  /* 오른쪽 설명 */
  var LX = 300;
  s += txt(LX, 74, d.sttTitle, 15, '#0f172a', 800);
  s += '<rect x="' + LX + '" y="100" width="14" height="14" rx="4" fill="#059669"/>';
  s += txt(LX + 22, 112, d.sttStudent + ' · 60%+ (15' + (LANG === 'ko' ? '분' : ' min') + ')', 13, '#334155', 700);
  s += '<rect x="' + LX + '" y="130" width="14" height="14" rx="4" fill="#cbd5e1"/>';
  s += txt(LX + 22, 142, d.sttTeacher + ' · 40% (10' + (LANG === 'ko' ? '분' : ' min') + ')', 13, '#334155', 700);
  /* 게이지 */
  s += '<rect x="' + LX + '" y="172" width="220" height="16" rx="8" fill="#e2e8f0"/>';
  s += '<rect x="' + LX + '" y="172" width="132" height="16" rx="8" fill="#059669"/>';
  s += '<line x1="' + (LX + 132) + '" y1="166" x2="' + (LX + 132) + '" y2="194" stroke="#b45309" stroke-width="2"/>';
  s += txt(LX + 132, 210, d.sttGoal + ' 60%', 11.5, '#b45309', 800, 'middle');
  return s + '</svg>';
}

/* ③ 연령별 집중 한계 막대 */
function svgAgeBars(d, rows) {
  var W = 640, H = 290, BASE = 232, X0 = 64, BW = 84, GAP = 56;
  var vals = [6, 9, 13, 18];
  var maxV = 20;
  var cols = ['#f59e0b', '#059669', '#2563eb', '#7c3aed'];
  var s = svgOpen('0 0 ' + W + ' ' + H + '', ' aria-label="' + d.ageTitle + '"');
  s += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';
  s += txt(W / 2, 24, d.ageTitle + ' (' + d.ageUnit + ')', 14, '#0f172a', 800, 'middle');
  for (var g = 0; g <= 4; g++) {
    var y = BASE - (BASE - 56) * g / 4;
    s += '<line x1="' + X0 + '" y1="' + y + '" x2="' + (W - 30) + '" y2="' + y + '" stroke="#eef2f7"/>';
    s += txt(X0 - 10, y + 4, String(g * 5), 10, '#94a3b8', 600, 'end');
  }
  vals.forEach(function (v, i) {
    var h = (BASE - 56) * (v / maxV);
    var x = X0 + 24 + i * (BW + GAP);
    s += '<rect x="' + x + '" y="' + (BASE - h) + '" width="' + BW + '" height="' + h + '" rx="8" fill="' + cols[i] + '"/>';
    s += txt(x + BW / 2, BASE - h - 9, rows[i][1], 12.5, cols[i], 900, 'middle');
    s += txt(x + BW / 2, BASE + 20, rows[i][0], 11.5, '#334155', 700, 'middle');
  });
  s += '<line x1="' + X0 + '" y1="' + BASE + '" x2="' + (W - 30) + '" y2="' + BASE + '" stroke="#cbd5e1" stroke-width="1.5"/>';
  return s + '</svg>';
}

/* ④ 25분 수업 시간 배분 (누적 막대) */
function svgTimeline(d) {
  var W = 640, X0 = 30, X1 = 610, Y = 74, HH = 46;
  var total = 25, s = svgOpen('0 0 ' + W + ' 236', ' aria-label="' + d.tlTitle + '"');
  s += '<rect width="' + W + '" height="236" fill="#fff"/>';
  s += txt(W / 2, 26, d.tlTitle, 14, '#0f172a', 800, 'middle');
  var acc = 0, i, it, x, w;
  for (i = 0; i < d.tlItems.length; i++) {
    it = d.tlItems[i];
    x = X0 + (acc / total) * (X1 - X0);
    w = (it.m / total) * (X1 - X0);
    s += '<rect x="' + x + '" y="' + Y + '" width="' + (w - 2) + '" height="' + HH + '" rx="7" fill="' + it.c + '"/>';
    s += txt(x + w / 2 - 1, Y + 29, it.m + (LANG === 'ko' ? '분' : 'm'), 13, '#ffffff', 900, 'middle');
    acc += it.m;
  }
  /* 눈금 */
  s += '<line x1="' + X0 + '" y1="' + (Y + HH + 10) + '" x2="' + X1 + '" y2="' + (Y + HH + 10) + '" stroke="#e2e8f0"/>';
  [0, 5, 10, 15, 20, 25].forEach(function (m) {
    var mxp = X0 + (m / total) * (X1 - X0);
    s += '<line x1="' + mxp + '" y1="' + (Y + HH + 6) + '" x2="' + mxp + '" y2="' + (Y + HH + 14) + '" stroke="#cbd5e1"/>';
    s += txt(mxp, Y + HH + 28, String(m), 10.5, '#94a3b8', 600, 'middle');
  });
  /* 범례 2줄 */
  acc = 0;
  for (i = 0; i < d.tlItems.length; i++) {
    it = d.tlItems[i];
    var col = i % 3, row = Math.floor(i / 3);
    var lx = 34 + col * 200, ly = 168 + row * 26;
    s += '<rect x="' + lx + '" y="' + (ly - 10) + '" width="12" height="12" rx="4" fill="' + it.c + '"/>';
    s += txt(lx + 19, ly, it.t, 11.5, '#334155', 700);
  }
  return s + '</svg>';
}

/* ⑤ 몰입 사이클 6단계 — 가운데는 Mr.Mango */
function svgCycle(d) {
  var W = 620, H = 524, CX = 310, CY = 274, R = 168, NR = 46;
  var cols = ['#f59e0b', '#f97316', '#2563eb', '#059669', '#7c3aed', '#db2777'];
  var s = svgOpen('0 0 ' + W + ' ' + H + '', ' aria-label="' + d.cycleTitle + '"');
  s += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';
  s += txt(CX, 26, d.cycleTitle, 15, '#0f172a', 800, 'middle');
  s += '<defs><marker id="tt-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
       '<path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/></marker></defs>';
  var ang = function (i) { return (-90 + i * 60) * Math.PI / 180; };
  var px = function (i, r) { return CX + Math.cos(ang(i)) * r; };
  var py = function (i, r) { return CY + Math.sin(ang(i)) * r; };
  /* 이어 주는 호살표 */
  for (var i = 0; i < 6; i++) {
    var a0 = ang(i), a1 = ang(i + 1), pad = 0.30;
    var sx = CX + Math.cos(a0 + pad) * R, sy = CY + Math.sin(a0 + pad) * R;
    var ex = CX + Math.cos(a1 - pad) * R, ey = CY + Math.sin(a1 - pad) * R;
    s += '<path d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' A ' + R + ' ' + R + ' 0 0 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1) +
         '" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#tt-arw)"/>';
  }
  /* 가운데 Mr.Mango */
  s += '<circle cx="' + CX + '" cy="' + CY + '" r="72" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>';
  s += '<image href="' + MANGO + '" x="' + (CX - 52) + '" y="' + (CY - 52) + '" width="104" height="104" preserveAspectRatio="xMidYMid meet"/>';
  /* 노드 */
  for (i = 0; i < 6; i++) {
    var x = px(i, R), y = py(i, R);
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + NR + '" fill="' + cols[i] + '"/>';
    s += txt(x.toFixed(1), (y + 9).toFixed(1), String(i + 1), 24, '#ffffff', 900, 'middle');
    /* 라벨: 좌우 바깥쪽으로 */
    var lx = px(i, R + NR + 12), ly = py(i, R + NR + 12);
    var anchor = 'middle';
    if (i === 1 || i === 2) { anchor = 'start'; }
    if (i === 4 || i === 5) { anchor = 'end'; }
    var label = d.steps[i].h.split(' — ')[0];
    s += txt(lx.toFixed(1), (ly + 5).toFixed(1), label, 12.5, '#0f172a', 800, anchor);
  }
  return s + '</svg>';
}

/* ⑥ 6항목 레이더 — 루브릭 점수와 실시간 연동 */
function svgRadar(scores, items) {
  var W = 420, H = 380, CX = 210, CY = 196, R = 120;
  var n = 6;
  var ang = function (i) { return (-90 + i * (360 / n)) * Math.PI / 180; };
  var pt = function (i, r) { return [CX + Math.cos(ang(i)) * r, CY + Math.sin(ang(i)) * r]; };
  var poly = function (r) {
    var a = []; for (var i = 0; i < n; i++) { var p = pt(i, r); a.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); } return a.join(' ');
  };
  var s = svgOpen('0 0 ' + W + ' ' + H + '', ' aria-label="radar"');
  s += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';
  for (var g = 3; g >= 1; g--) {
    s += '<polygon points="' + poly(R * g / 3) + '" fill="' + (g === 3 ? '#f8fafc' : 'none') + '" stroke="#e2e8f0" stroke-width="1"/>';
  }
  for (var i = 0; i < n; i++) {
    var p = pt(i, R);
    s += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="#e2e8f0"/>';
  }
  var vp = [];
  for (i = 0; i < n; i++) { var q = pt(i, R * (scores[i] / 3)); vp.push(q[0].toFixed(1) + ',' + q[1].toFixed(1)); }
  s += '<polygon points="' + vp.join(' ') + '" fill="#f59e0b" fill-opacity=".28" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>';
  for (i = 0; i < n; i++) {
    var r2 = pt(i, R * (scores[i] / 3));
    s += '<circle cx="' + r2[0].toFixed(1) + '" cy="' + r2[1].toFixed(1) + '" r="4" fill="#d97706"/>';
    var lp = pt(i, R + 30);
    var an = 'middle';
    if (i === 1 || i === 2) an = 'start';
    if (i === 4 || i === 5) an = 'end';
    s += txt(lp[0].toFixed(1), (lp[1] + 4).toFixed(1), items[i].short, 12, '#334155', 800, an);
    s += txt(lp[0].toFixed(1), (lp[1] + 19).toFixed(1), String(scores[i]) + '/3', 11, '#94a3b8', 700, an);
  }
  return s + '</svg>';
}

                   return '<option value="' + (k + 1) + '"' + (k === 2 ? ' selected' : '') + '>' + o + '</option>';
                 }).join('') + '</select></div>';
        }).join('') +
      '</div></div>' +
      '<div><div class="tt-score">' +
        '<div class="lbl">TOTAL SCORE</div>' +
        '<div><span class="big" id="rub-total">18</span> <span class="of">/ 18</span></div>' +
        '<div class="bdg" id="rub-badge">' + sh.rubBadges[0] + '</div>' +
        '<p class="fb" id="rub-fb">' + sh.rubFb[0] + '</p>' +
        '<ul>' + sh.rubRank.map(function (r) {
          return '<li><span>' + r[0] + '</span><span style="font-weight:800">' + r[1] + '</span></li>';
        }).join('') + '</ul>' +
      '</div>' +
      '<figure class="tt-fig" style="margin-top:14px"><div id="rub-radar"></div>' +
      '<figcaption>' + sh.rubRadar + '</figcaption></figure></div>' +
    '</div>';
  }

  updateChk();
  calcRubric();
  if (window.lucide) lucide.createIcons();
}

      '<p class="tt-small tt-mut" style="margin:5px 0 0">' + p.sub + '</p>' +
      '<p class="tt-small tt-mut" style="margin:6px 0 0">&#128161; ' + p.tip + '</p></div>' +
      '<button type="button" class="tt-btn" onclick="window.print()">' +
        '<i data-lucide="printer"></i>' + p.btn + '</button>' +
    '</div>';

  h += '<div class="tt-card pad-lg" style="text-align:center">' +
      '<img src="' + MANGO + '" alt="Mr.Mango" style="width:120px" decoding="async">' +
      '<h1 style="margin:10px 0 6px;font-size:27px;font-weight:900;color:#0f172a;letter-spacing:-.6px">' + p.docTitle + '</h1>' +
      '<p class="tt-mut" style="margin:0 auto;max-width:52ch;font-size:14px">' + p.docSub + '</p>' +
      '<div style="display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:3px solid #f59e0b">' +
        p.meta.map(function (m) {
          return '<div><div class="tt-small tt-mut">' + m[0] + '</div><div style="font-weight:800;color:#0f172a;font-size:13.5px;margin-top:2px">' + m[1] + '</div></div>';

  /* 본문 요약 — 원칙 · 사이클 · 연령 · 숫자 */
  h += '<div class="tt-card pad-lg">' + secHead(d.s2.n, d.s2.title, d.s2.sub) +
       d.s2.items.map(function (it) {
         return '<div style="border-left:4px solid #f59e0b;padding:2px 0 2px 14px;margin-bottom:14px">' +

                '<p class="tt-small" style="margin:4px 0 0;line-height:1.75">' + it.why + '</p>' +

  h += '<div class="tt-pagebreak"></div><div class="tt-card pad-lg">' + secHead(d.s3.n, d.s3.title, d.s3.sub) +

  h += '<div class="tt-pagebreak"></div><div class="tt-card pad-lg">' + secHead(d.s4.n, d.s4.title, d.s4.sub) +
       fig(svgCycle(d.s4), '', 'cycle tight') +

       '<th style="width:64px">' + d.sheet.t1Head[0] + '</th><th style="width:180px">' + d.sheet.t1Head[1] + '</th>' +

       d.s4.steps.map(function (st) {

  h += '<div class="tt-pagebreak"></div><div class="tt-card pad-lg">' + secHead(d.s7.n, d.s7.title, d.s7.sub) +

/* ═══════════════════════════════════════════════════════════════════════
   조작
   ═══════════════════════════════════════════════════════════════════════ */
var chkState = [];      /* 언어를 바꿔도 체크 상태가 유지되도록 따로 들고 있는다 */
var rubState = [3, 3, 3, 3, 3, 3];

function switchTab(name) {
  ['guide', 'sheet', 'print'].forEach(function (k) {
    document.getElementById('pane-' + k).hidden = (k !== name);
    document.getElementById('tab-' + k).className = (k === name) ? 'on' : '';
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchSheet(i) {
  SHEET = i;
  var tabs = document.querySelectorAll('#sheet-tabs button');
  for (var k = 0; k < tabs.length; k++) tabs[k].className = (k === i) ? 'on' : '';
  renderSheetBody(T[LANG]);
}

function setLanguage(lang) {
  LANG = (lang === 'en') ? 'en' : 'ko';
  document.getElementById('lang-ko').className = (LANG === 'ko') ? 'on' : '';
  document.getElementById('lang-en').className = (LANG === 'en') ? 'on' : '';
  /* 이 화면에서 고른 언어는 다른 관리자·강사 화면에서도 이어진다(adm-lang-boot 규칙). */
  try {
    localStorage.setItem('mangoi_lang', LANG);
    localStorage.setItem('mangoi_lang_by', 'user');
    var sess = JSON.parse(localStorage.getItem('mangoi_admin_session') || '{}');
    if (sess && sess.uid) localStorage.setItem('mangoi_lang_uid', String(sess.uid));
  } catch (e) {}
  renderAll();
}

function renderAll() {
  var d = T[LANG];
  document.documentElement.setAttribute('lang', LANG);
  document.getElementById('nav-title').textContent = d.navTitle;
  document.getElementById('nav-sub').textContent = d.navSub;
  document.getElementById('tab-guide-txt').textContent = d.tabGuide;
  document.getElementById('tab-sheet-txt').textContent = d.tabSheet;
  document.getElementById('tab-print-txt').textContent = d.tabPrint;
  document.title = d.navTitle + ' · Mangoi';
  renderGuide(d);
  renderSheet(d);
  renderPrint(d);
  if (window.lucide) lucide.createIcons();
}

/* 체크리스트 */
function updateChk() {
  var boxes = document.querySelectorAll('.tt-chk');
  if (!boxes.length) return;
  var done = 0, i;
  for (i = 0; i < boxes.length; i++) {
    /* 언어 전환 뒤 다시 그려졌으면 이전 상태를 되살린다 */
    if (chkState[i] !== undefined && boxes[i].checked !== chkState[i] && !boxes[i].__touched) {
      boxes[i].checked = chkState[i];
    }
    boxes[i].__touched = true;
    chkState[i] = boxes[i].checked;
    if (boxes[i].checked) done++;
  }
  var pct = Math.round(done / boxes.length * 100);
  var bar = document.getElementById('chk-bar'), lab = document.getElementById('chk-pct');
  if (bar) bar.style.width = pct + '%';
  if (lab) lab.textContent = pct + '%';
}

/* 루브릭 + 레이더 */
function calcRubric() {
  var sels = document.querySelectorAll('select.rub');
  if (!sels.length) return;
  var sum = 0, scores = [], i;
  for (i = 0; i < sels.length; i++) {
    if (sels[i].__touched) { rubState[i] = parseInt(sels[i].value, 10); }
    else { sels[i].value = String(rubState[i]); sels[i].__touched = true; }
    scores.push(rubState[i]);
    sum += rubState[i];
  }
  var d = T[LANG].sheet;
  var tot = document.getElementById('rub-total');
  var bdg = document.getElementById('rub-badge');
  var fb = document.getElementById('rub-fb');
  var rad = document.getElementById('rub-radar');
  if (tot) tot.textContent = String(sum);
  var lo = 0, i2;
  for (i2 = 1; i2 < scores.length; i2++) if (scores[i2] < scores[lo]) lo = i2;
  var idx = (sum >= 15 && scores[lo] >= 2) ? 0 : (sum >= 10 ? 1 : 2);
  if (bdg) {
    bdg.textContent = d.rubBadges[idx];
    bdg.style.background = ['#fbbf24', '#3b82f6', '#e11d48'][idx];
    bdg.style.color = idx === 0 ? '#0f172a' : '#ffffff';
  }
  if (fb) {
    fb.textContent = d.rubFb[idx] +
      (idx === 0 ? '' : ' ' + d.rubFocus + ': ' + d.rubItems[lo].title + '.');
  }
  if (rad) rad.innerHTML = svgRadar(scores, d.rubItems);
}

/* CSV 내려받기 — 엑셀에서 한글이 깨지지 않도록 BOM 을 붙인다 */
function plain(s) {
  return String(s).replace(/<[^>]+>/g, '').replace(/&#8220;|&#8221;/g, '"').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
}
function csvRow(arr) {
  return arr.map(function (v) { return '"' + plain(v).replace(/"/g, '""') + '"'; }).join(',') + '\n';
}
function exportSheet() {
  var d = T[LANG], sh = d.sheet, out = '﻿', name = sh.csvName[SHEET] + '.csv';

  if (SHEET === 0) {
    out += csvRow(sh.t0Head);
    d.s2.items.forEach(function (it, i) { out += csvRow([i + 1, it.h, it.why, it.do, it.no]); });
  } else if (SHEET === 1) {
    out += csvRow(sh.t1Head);
    d.s4.steps.forEach(function (st) { out += csvRow([st.s, st.h, st.tool, st.p, st.goal]); });
  } else if (SHEET === 2) {
    out += csvRow(sh.chkHead.slice(1));
    sh.chkRows.forEach(function (r) { out += csvRow(r); });
  } else {
    out += csvRow(sh.csvRubHead);
    sh.rubItems.forEach(function (it, i) { out += csvRow([it.title, rubState[i]]); });
    out += csvRow([sh.csvTotal, rubState.reduce(function (a, b) { return a + b; }, 0) + ' / 18']);
  }

  var blob = new Blob([out], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ── 시작 ── */
(function boot() {
  /* 해외 강사는 로그인 언어를 그대로 이어받는다(adm-lang-boot 이 정해 준 값). */
  LANG = (window.__ADM_BOOT_LANG === 'en') ? 'en' : 'ko';
  function start() {
    document.getElementById('lang-ko').className = (LANG === 'ko') ? 'on' : '';
    document.getElementById('lang-en').className = (LANG === 'en') ? 'on' : '';
    renderAll();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
