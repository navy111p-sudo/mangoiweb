/* ── 사진 → 축소 → 판독 ───────────────────────────────────────────────────
   휴대폰 사진은 4MB 를 넘는다. 그대로 보내면 느린 회선에서 대부분 실패한다.
   기기에서 먼저 줄여서 보낸다 — 업로드 실패의 대부분이 여기서 사라진다.        */
window.shoot = function(){ var e = document.getElementById('f_file'); if (e) e.click(); };

window.gotFile = function(input){
  var f = input.files && input.files[0];
  if (!f) return;
  if (f.type === 'application/pdf') { FILE = f; note(T('Attached: ', '첨부: ') + f.name); return; }

  /* 영수증이 «반드시» 필요한 분류가 아니면(일반 문서) 사진을 읽지 않는다.
     ⚠️ 그냥 두면 ① 「영수증을 읽는 중」·「금액을 직접 넣어 주세요」라는 엉뚱한 문구가 뜨고
        ② 금액 칸이 없는 화면에서 ③ 돈이 나가는 OCR 을 헛되이 부른다. 첨부만 하면 된다. */
  if (PICK && !PICK.requires_file) {
    note(T('Preparing the file...', '파일을 준비하는 중...'));
    shrink(f).then(function(blob){
      FILE = blob || f;
      note(T('Attached: ', '첨부: ') + f.name);
    }).catch(function(){
      FILE = f;                                  // 줄이기에 실패해도 원본을 붙인다
      note(T('Attached: ', '첨부: ') + f.name);
    });
    return;
  }

  note(T('Preparing the photo...', '사진을 준비하는 중...'));
  shrink(f).then(function(blob){
    FILE = blob || f;
    note(T('Reading the receipt...', '영수증을 읽는 중...'));
    return fetch('/api/approval/ocr', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: FILE
    }).then(function(r){ return r.json(); });
  })
  .then(function(j){
    if (!j || !j.ok) {
      // 못 읽어도 첨부는 남는다. 사람이 직접 넣으면 된다 — 자동화는 «유일한 길»이 아니다.
      note(T('Could not read it — please type the amount. The photo is still attached.',
             '읽지 못했습니다 — 금액을 직접 넣어 주세요. 사진은 첨부되어 있습니다.'));
      return;
    }
    OCR = j;
    if (j.amount != null && !getVal('f_amount')) setVal('f_amount', j.amount);
    if (j.spent_at && !getVal('f_spent')) setVal('f_spent', j.spent_at);
    if (j.vendor && !getVal('f_title')) setVal('f_title', j.vendor);
    note(T('Filled from the receipt. Check it before submitting.',
           '영수증에서 채웠습니다. 올리기 전에 확인해 주세요.'));
  })
  .catch(function(){
    note(T('Could not read it — please type the amount. The photo is still attached.',
           '읽지 못했습니다 — 금액을 직접 넣어 주세요. 사진은 첨부되어 있습니다.'));
  });
};

function shrink(file){
  return new Promise(function(resolve){
    try {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try {
          var max = 1600;
          var w = img.width, h = img.height;
          if (w > max || h > max) { var s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          c.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', 0.82);
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (e) { resolve(file); }
  });
}

/* ── 음성(영어) → 받아쓰기 → 초안 ─────────────────────────────────────────── */
var REC = null, CHUNKS = [];
window.voice = function(){
  var btn = document.getElementById('b_voice');
  if (REC) { try { REC.stop(); } catch (e) {} return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    note(T('Voice input is not available on this device — please type.',
           '이 기기에서는 음성 입력을 쓸 수 없습니다 — 직접 입력해 주세요.'));
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    CHUNKS = [];
    REC = new MediaRecorder(stream);
    REC.ondataavailable = function(e){ if (e.data && e.data.size) CHUNKS.push(e.data); };
    REC.onstop = function(){
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
      REC = null;
      if (btn) { btn.textContent = T('Speak it (English)', '말로 입력 (영어)'); btn.disabled = true; }
      note(T('Listening finished — writing it down...', '받아쓰는 중...'));
      var blob = new Blob(CHUNKS, { type: 'audio/webm' });
      fetch('/api/approval/voice', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: blob
      })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (btn) btn.disabled = false;
        if (!j || !j.ok) {
          note(T('Could not hear it clearly — please type.', '알아듣지 못했습니다 — 직접 입력해 주세요.'));
          return;
        }
        var d = j.draft;
        if (d) {
          if (d.title && !getVal('f_title')) setVal('f_title', d.title);
          if (d.body && !getVal('f_body')) setVal('f_body', d.body);
          if (d.amount != null && !getVal('f_amount')) setVal('f_amount', d.amount);
        } else if (j.transcript && !getVal('f_body')) {
          setVal('f_body', j.transcript);
        }
        note(T('Filled from what you said. Check it before submitting.',
               '말씀하신 내용으로 채웠습니다. 올리기 전에 확인해 주세요.'));
      })
      .catch(function(){
        if (btn) btn.disabled = false;
        note(T('Could not send the recording — please type.', '녹음을 보내지 못했습니다 — 직접 입력해 주세요.'));
      });
    };
    REC.start();
    if (btn) btn.textContent = T('Stop and use it', '그만 말하고 사용');
    note(T('Speak in English, then press the button again.', '영어로 말한 뒤 버튼을 다시 눌러 주세요.'));
    // 안전장치 — 30초가 넘으면 저절로 멈춘다(파일이 커지면 느린 회선에서 못 보낸다)
    setTimeout(function(){ if (REC) { try { REC.stop(); } catch (e) {} } }, 30000);
  })
  .catch(function(){
    note(T('Microphone permission is needed for voice input.', '음성 입력에는 마이크 권한이 필요합니다.'));
  });
};

/* ══════════════════════════════════════════════════════════════════════════
   올리기 — «쓴 것이 사라지지 않는다» 가 이 부분의 전부다.

   왜 이렇게까지 하나 —
     승인·반려는 버튼 한 번이라 실패해도 다시 누르면 그만이다. 그런데 **기안**은 다르다.
     필리핀 매니저가 영수증을 찍고, 판독을 기다리고, 내용을 확인한 뒤 「올리기」를 눌렀는데
     그 순간 회선이 끊기면 — 예전 방식으로는 **그 전부가 통째로 사라진다.**
     정전·태풍이 잦은 곳에서 이건 «가끔»이 아니다.

   그래서 세 겹으로 막는다:
     ① 초안 자동저장 — 글자를 칠 때마다 기기에 적어 둔다. 앱이 죽어도 다시 열면 그대로 있다.
     ② 전송 큐 — 보내다 끊기면 **사진까지 통째로** 기기에 담아 두고, 연결되면 자동으로 보낸다.
        (사진은 용량이 커서 localStorage 에 못 넣는다 → IndexedDB 를 쓴다)
     ③ 같은 열쇠(client_key) — 재전송이 **같은 기안을 두 건으로 만들지 않게** 서버가 합쳐 준다.
        "저장은 됐는데 응답만 못 받은" 경우가 실제로 있어서, 이게 없으면 지출 결재가 두 번 잡힌다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 기기 저장소(IndexedDB) — 사진이 들어가야 해서 localStorage 로는 부족하다 ── */
var DB_NAME = 'mangoi_work', STORE = 'outbox';
function idbOpen(){
  return new Promise(function(res){
    try {
      if (!window.indexedDB) return res(null);
      var rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = function(){
        try { rq.result.createObjectStore(STORE, { keyPath: 'key' }); } catch (e) {}
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ res(null); };
    } catch (e) { res(null); }
  });
}
function idbDo(mode, fn){
  return idbOpen().then(function(db){
    if (!db) return null;
    return new Promise(function(res){
      try {
        var tx = db.transaction(STORE, mode);
        var out = fn(tx.objectStore(STORE));
        tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function(){ res(null); };
        tx.onabort = function(){ res(null); };
      } catch (e) { res(null); }
    });
  }).catch(function(){ return null; });
}
function subQueueAdd(rec){ return idbDo('readwrite', function(s){ return s.put(rec); }); }
function subQueueAll(){ return idbDo('readonly', function(s){ return s.getAll(); }); }
function subQueueDel(key){ return idbDo('readwrite', function(s){ return s.delete(key); }); }

/* ── ① 초안 자동저장 — 글자를 칠 때마다. 사진은 제외(용량) ── */
var DRAFT_KEY = 'mangoi_work_draft_v1';
function draftSave(){
  if (!PICK) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      key: CKEY, type: PICK.key, cur: CUR,
      title: getVal('f_title'), amount: getVal('f_amount'),
      body: getVal('f_body'), spent: getVal('f_spent'),
      from: getVal('f_from'), to: getVal('f_to'), cat: getVal('f_cat'),
      ocr: OCR ? OCR.amount : null, at: Date.now()
    }));
  } catch (e) {}
}
function draftClear(){ try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function draftLoad(){
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    // 하루가 지난 초안은 되살리지 않는다 — 오래된 내용이 뜬금없이 나오면 더 헷갈린다.
    if (!d || !d.type || (Date.now() - Number(d.at || 0)) > 86400000) return null;
    return d;
  } catch (e) { return null; }
}

/* 같은 기안임을 서버에 알려 주는 열쇠. 폼을 열 때 한 번 만들고, 재전송에도 그대로 쓴다. */
var CKEY = null;
function newKey(){
  try {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) {}
  return 'k' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}

function buildFD(rec){
  var fd = new FormData();
  fd.append('client_key', rec.key);
  fd.append('req_type', rec.type);
  fd.append('title', rec.title);
  fd.append('body', rec.body || '');
  fd.append('currency', rec.cur || 'PHP');
  if (rec.amount) fd.append('amount', String(rec.amount));
  if (rec.spent) fd.append('spent_at', rec.spent);
  if (rec.from) fd.append('date_from', rec.from);
  if (rec.to) fd.append('date_to', rec.to);
  if (rec.cat) fd.append('category', rec.cat);
  if (rec.ocr != null) fd.append('ocr_amount', String(rec.ocr));
  if (rec.file) fd.append('file', rec.file, (rec.fileName || 'receipt.jpg'));
  return fd;
}

/** 한 건 보내기. done=끝남(성공이든 서버가 거절했든), retry=회선 문제라 다시 보내야 함. */
function postOne(rec){
  return fetch('/api/approval/requests', { method: 'POST', credentials: 'same-origin', body: buildFD(rec) })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; },
                                            function(){ return { status: r.status, j: {} }; }); })
    .then(function(res){
      if (res.j && res.j.ok) return { done: true, duplicate: !!res.j.duplicate };
      // 서버가 «판단해서» 거절한 것(4xx)은 다시 보내도 소용없다 — 큐에서 빼고 사람에게 알린다.
      // 5xx 는 서버가 잠깐 아픈 것일 수 있으니 다시 보낸다.
      if (res.status >= 400 && res.status < 500 && res.status !== 429) {
        return { done: true, refused: true,
                 message: (EN() ? res.j.message_en : res.j.message) || null };
      }
      return { retry: true };
    })
    .catch(function(){ return { retry: true }; });     // 회선 문제
}

window.submitReq = function(){
  if (!PICK) return;
  var title = String(getVal('f_title') || '').trim();
  if (!title) { toast(T('Please enter a title.', '제목을 넣어 주세요.')); return; }
  var amount = String(getVal('f_amount') || '').trim();
  if (PICK.needs_amount && !amount) {
    toast(T('Please enter the amount.', '금액을 넣어 주세요.')); return;
  }
  // 휴가는 날짜가 없으면 승인돼도 막을 기간을 모른다 — 보내기 전에 여기서 잡는다.
  if (PICK.wants_dates && !getVal('f_from')) {
    toast(T('Please pick the first day off.', '휴가 시작일을 골라 주세요.')); return;
  }
  var btn = document.getElementById('b_submit');
  if (btn) btn.disabled = true;

  if (!CKEY) CKEY = newKey();
  var rec = {
    key: CKEY, type: PICK.key, title: title, body: getVal('f_body') || '',
    cur: CUR, amount: amount, spent: getVal('f_spent') || '',
    from: getVal('f_from') || '', to: getVal('f_to') || '',
    cat: getVal('f_cat') || '',
    ocr: (OCR && OCR.amount != null) ? OCR.amount : null,
    file: FILE || null, fileName: (FILE && FILE.name) || 'receipt.jpg', at: Date.now()
  };

  postOne(rec).then(function(res){
    if (btn) btn.disabled = false;

    if (res.done) {
      if (res.refused) { toast(res.message || T('Could not submit.', '올리지 못했습니다.')); return; }
      toast(res.duplicate
        ? T('Already submitted — this was the same request.', '이미 올라간 기안입니다. 같은 건으로 처리했습니다.')
        : T('Submitted. Head office will review it.', '결재를 올렸습니다. 본사가 확인합니다.'));
      closeForm();
      load().catch(function(){});
      return;
    }

    // 회선 문제 — 사진까지 통째로 담아 두고 연결되면 자동으로 보낸다.
    subQueueAdd(rec).then(function(){
      closeForm();
      paintQueue();
      toast(T('Saved on this phone — it will be sent automatically when you are back online.',
              '이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.'));
    }, function(){
      // IndexedDB 조차 못 쓰는 기기 — 폼을 지우지 않는다. 쓴 것을 없애는 것이 최악이다.
      toast(T('Could not send. Your text is still here — please try again when you reconnect.',
              '보내지 못했습니다. 쓰신 내용은 그대로 있습니다 — 연결되면 다시 눌러 주세요.'));
    });
  });
};

function closeForm(){
  PICK = null; OCR = null; FILE = null; CKEY = null;
  draftClear();
  paintKinds(); paintForm(); paintReuse();
}

/* ── ② 큐 비우기 — 연결되면 자동으로 ── */
var subBusy = false;
function subFlush(){
  if (subBusy) return;
  subBusy = true;
  subQueueAll().then(function(list){
    if (!list || !list.length) { subBusy = false; paintQueue(); return; }
    var rec = list[0];
    return postOne(rec).then(function(res){
      if (res.done) {
        return subQueueDel(rec.key).then(function(){
          subBusy = false;
          paintQueue();
          if (!res.refused) toast(T('A saved request has been sent.', '저장해 둔 기안을 보냈습니다.'));
          // 남은 것이 있으면 이어서, 없으면 목록 최신화
          subQueueAll().then(function(rest){
            if (rest && rest.length) subFlush(); else load().catch(function(){});
          });
        });
      }
      subBusy = false;                 // 아직 끊겨 있다 — 다음 기회에
    });
  }).catch(function(){ subBusy = false; });
}

function paintQueue(){
  subQueueAll().then(function(list){
    var n = (list || []).length;
    var el = document.getElementById('queueNote');
    if (!el) return;
    el.hidden = !n;
    if (n) el.textContent = T(n + ' request(s) saved on this phone — they will be sent automatically when you are back online.',
                              '보내지 못한 기안 ' + n + '건을 이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.');
  });
}

/* ── 알림 받기 (웹푸시) ────────────────────────────────────────────────────
   기존 인프라를 그대로 쓴다 — VAPID 키·구독 표·sw.js 의 push 핸들러가 이미 있다.
   여기서 하는 일은 «직원 계정으로 구독을 하나 붙이는 것»뿐이다.

   ⚠️ 자동 등록하지 않는다. 사용자가 버튼을 눌렀을 때만 권한을 묻는다 —
      묻지도 않고 뜨는 권한 창은 대부분 거절당하고, 그러면 되돌리기 어렵다.
   ⚠️ controllerchange 자동 reload 는 붙이지 않는다 — 과거에 의도적으로 제거한 것이다
      (CLAUDE.md 1-3). 여기서 되살리지 말 것.
   ※ 아이폰은 «홈 화면에 추가» 한 뒤에만 푸시를 받을 수 있다. 그래서 실패해도 조용히 안내만 한다. */
function pushReady(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function b64ToU8(b64){
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function paintPushBtn(){
  var b = document.getElementById('pushBtn');
  if (!b) return;
  if (!pushReady() || !D || !D.me || !D.me.username) { b.hidden = true; return; }
  b.hidden = (Notification.permission === 'granted' && pushOn);
}
var pushOn = false;
window.askPush = function(){
  if (!pushReady()) {
    toast(T('This device cannot receive notifications. On iPhone, add this page to the Home Screen first.',
            '이 기기에서는 알림을 받을 수 없습니다. 아이폰은 «홈 화면에 추가» 후에 가능합니다.'));
    return;
  }
  Notification.requestPermission().then(function(p){
    if (p !== 'granted') { toast(T('Notifications are turned off.', '알림이 꺼져 있습니다.')); return; }
    return subscribePush().then(function(ok){
      toast(ok ? T('You will be notified when an approval needs you.', '결재가 오면 알려 드립니다.')
               : T('Could not turn on notifications.', '알림을 켜지 못했습니다.'));
    });
  }).catch(function(){});
};
function subscribePush(){
  return fetch('/api/push/vapid-public-key', { credentials: 'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.key) throw new Error('no_key');
      return navigator.serviceWorker.register('/sw.js').then(function(reg){
        return navigator.serviceWorker.ready.then(function(){
          return reg.pushManager.getSubscription().then(function(sub){
            if (sub) return sub;
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(j.key) });
          });
        });
      });
    })
    .then(function(sub){
      var s = sub.toJSON ? sub.toJSON() : sub;
      return fetch('/api/push/subscribe', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        // ⚠️ user_id 에 **관리자 계정명**을 넣는다. 서버(api-approval notify)가 이 값으로 찾는다.
        body: JSON.stringify({ subscription: s, user_id: (D && D.me && D.me.username) || null, ua: navigator.userAgent })
      }).then(function(r){ return r.json(); });
    })
    .then(function(j){ pushOn = !!(j && j.ok); paintPushBtn(); return pushOn; })
    .catch(function(){ return false; });
}

/* ── 시작 ─────────────────────────────────────────────────────────────────── */
applyMode();
applyLang();

// 캐시가 있으면 먼저 그린다 — 끊겨 있어도 흰 화면을 보지 않는다.
try {
  var c0 = localStorage.getItem(CACHE_KEY);
  if (c0) { D = JSON.parse(c0); repaint(); }
} catch (e) {}

/* 초안 자동저장 — 폼은 다시 그려지지만 이 리스너는 바깥 상자에 붙어 있어 살아남는다.
   ⚠️ 'change' 도 함께 듣는다 — 고르는 칸(select)은 브라우저·조작 방식에 따라
      'input' 이 안 올 수 있다. 그때 초안에 «고른 항목» 만 조용히 안 담긴다.
   ⛔ 인라인 onchange="draftSave()" 로 풀지 말 것 — 인라인 핸들러는 «전역» 에서 이름을
      찾는데 이 함수는 파일 안 닫힌 스코프라 ReferenceError 가 난다(2026-09-04 실측). */
var formBox = document.getElementById('form');
formBox.addEventListener('input', draftSave);
formBox.addEventListener('change', draftSave);

load().then(restoreDraft).then(openWantedType).catch(function(){ restoreDraft(); openWantedType(); });
outboxFlush();
subFlush();
paintQueue();

/* 쓰다 만 기안 되살리기 — 앱이 죽거나 브라우저가 닫혀도 쓴 것이 남아 있어야 한다. */
function restoreDraft(){
  var d = draftLoad();
  if (!d || PICK) return;
  var types = (D && D.types) || [];
  var found = null;
  for (var i = 0; i < types.length; i++) if (types[i].key === d.type) found = types[i];
  if (!found) return;
  PICK = found; CKEY = d.key || newKey(); CUR = d.cur || 'PHP';
  OCR = (d.ocr != null) ? { amount: d.ocr } : null;
  paintKinds(); paintForm(); paintReuse();
  setVal('f_title', d.title || ''); setVal('f_amount', d.amount || '');
  setVal('f_body', d.body || ''); setVal('f_spent', d.spent || '');
  setVal('f_from', d.from || ''); setVal('f_to', d.to || '');
  setVal('f_cat', d.cat || '');
  // ⚠️ 사진은 되살리지 못한다(기기 저장소에 담기엔 크고, 다시 찍는 편이 확실하다).
  note(T('Restored what you were writing. The photo needs to be taken again.',
         '쓰시던 내용을 되살렸습니다. 사진은 다시 찍어 주세요.'));
}

/* 🔗 분류 딥링크 — `/work?type=leave` 로 들어오면 그 결재 폼을 바로 편다. (2026-08-20)
 *
 * 왜 — 관리자 화면 「보고서 양식」에서 «휴가 계획서» 를 고르고 넘어와도 **분류가 따라오지
 *      않아** 도착해서 또 골라야 했다. 「양식을 골랐다 → 그 폼이 열린다」 가 한 흐름이 되어야
 *      두 화면이 «두 벌» 이 아니라 «한 흐름» 이 된다.
 *
 * ⚠️ 쓰다 만 초안이 우선이다 — restoreDraft 가 이미 폼을 열었으면(PICK) 손대지 않는다.
 *    덮어쓰면 쓰던 글이 사라진다.
 * ⚠️ 올릴 수 없는 분류는 서버가 `types` 에서 아예 빼고 준다(강사의 지출 등).
 *    그때 조용히 넘기면 「눌렀는데 아무 일도 안 일어난다」 가 되므로 한 줄 알려 준다.
 */
function openWantedType(){
  if (!WANT_TYPE || PICK) return;
  var types = (D && D.types) || [];
  if (!types.length) return;                 // 아직 못 받았다 — 여기서 판단하지 않는다
  var want = WANT_TYPE; WANT_TYPE = '';      // 한 번만 — 다시 그릴 때 또 열리지 않게
  var found = null;
  for (var i = 0; i < types.length; i++) if (types[i].key === want) found = types[i];
  if (!found) {
    toast(T('This account cannot submit that type.', '이 계정으로는 올릴 수 없는 분류입니다.'));
    return;
  }
  window.pick(found.key);
  // 폼이 화면 밖에 있으면 «열렸는데 안 보인다» 가 된다. 열었으면 눈에 보이게 한다.
  try {
    var f = document.getElementById('form');
    if (f && !f.hidden) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {}
}

window.addEventListener('online', function(){
  offline(false); outboxFlush(); subFlush(); load().catch(function(){});
});
window.addEventListener('offline', function(){ offline(true); });
/* ── 🔊 소리로 알려주기 ────────────────────────────────────────────────────
   [무엇을 하나] 결재함을 **열어 둔 동안** 새 결재가 들어오면 «띵» 하고 알린다.
   웹푸시(브라우저를 닫아도 오는 알림)와는 별개다 — 이건 열어 둔 화면에서만 난다.

   [왜 이렇게 만들었나]
   · 소리 파일(mp3)을 두지 않고 **그 자리에서 만들어 낸다.** 이 화면의 설계 약속이
     「필리핀 느린 인터넷에서도 가볍게」라, 소리 하나 때문에 내려받을 것을 늘리지 않는다.
   · 🪤 브라우저는 **사람이 한 번 클릭하기 전에는 소리를 막는다**(자동재생 정책).
     그래서 AudioContext 가 suspended 로 시작하고, 그대로 두면 «코드는 도는데 소리만
     안 나는» 상태가 된다. 첫 클릭 때 한 번 깨워 둔다.
   · ⛔ 사용자 지정 소리를 «푸시 알림» 에 붙이는 건 불가능하다 — Notification 의 sound
     옵션은 표준에서 빠졌고 크롬이 구현하지 않는다. 화면이 닫혀 있을 때는 윈도우 기본
     알림음만 난다(sw.js 가 silent 를 안 쓰므로 그건 이미 난다). */
var SOUND_KEY = 'mangoi_work_sound_v1';
var soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== '0'; } catch (e) {}

var actx = null;
function audioWake(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
/* 첫 클릭 한 번으로 소리를 깨운다. once:true 라 그 뒤로는 남지 않는다. */
document.addEventListener('click', audioWake, { once: true });

function beep(){
  if (!soundOn) return;
  audioWake();
  if (!actx) return;
  try {
    // 두 음(솔–도)만 짧게. 길거나 크면 사무실에서 거슬린다.
    [[784, 0], [1046, 0.13]].forEach(function(pair){
      var o = actx.createOscillator(), g = actx.createGain();
      var t0 = actx.currentTime + pair[1];
      o.type = 'sine'; o.frequency.value = pair[0];
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.14);
    });
  } catch (e) {}
}

function paintSoundBtn(){
  var b = document.getElementById('soundBtn');
  if (!b) return;
  var sp = b.querySelector('span');
  /* 🪤 textContent 만 바꾸면 🌐 를 눌렀을 때 옛 글자로 되돌아간다(CLAUDE.md 함정).
        data-en/data-ko 도 함께 갱신해야 한다. */
  var en = soundOn ? 'Sound: on' : 'Sound: off';
  var ko = soundOn ? '소리 켬' : '소리 끔';
  sp.setAttribute('data-en', en);
  sp.setAttribute('data-ko', ko);
  sp.textContent = T(en, ko);
}
/* 🪤 여기서 부른다. 시작부(applyLang 옆)에서 부르면 **위의 `var soundOn = true` 대입보다
      먼저** 실행돼(선언만 끌어올려지고 값은 안 올라간다) undefined = 꺼짐으로 그려진다.
      실제로는 켜져 있는데 화면만 「끔」인 상태가 되어, 눌러야 할 사람이 «이미 껐구나» 하고 지나간다. */
paintSoundBtn();

window.toggleSound = function(){
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  paintSoundBtn();
  if (soundOn) { audioWake(); beep(); }        // 켤 때 한 번 들려준다 — 소리가 나는지 확인용
  toast(soundOn ? T('Sound on.', '소리를 켰습니다.') : T('Sound off.', '소리를 껐습니다.'));
};

/* 새로 들어온 것이 있는가 — 대기 «건수» 가 늘었을 때만 울린다.
   ⚠️ 첫 화면에서는 울리지 않는다(기준을 잡는 것뿐). 들어오자마자 울면 놀란다. */
var lastPending = null;
function noteArrival(j){
  var n = (j && j.inbox) ? j.inbox.length : 0;
  if (lastPending !== null && n > lastPending) {
    beep();
    toast(T('New approval arrived.', '새 결재가 도착했습니다.'));
  }
  lastPending = n;
  /* 탭 제목에도 건수를 적는다 — 다른 탭을 보고 있어도 눈에 띈다. */
  try { document.title = (n ? '(' + n + ') ' : '') + T('Approvals · Mangoi', '결재함 · 망고아이'); } catch (e) {}
}

/* 열어 둔 동안 1분마다 확인. 서버가 ETag 로 «안 바뀜(304)» 을 돌려주므로 거의 공짜다.
   ⚠️ 화면이 숨겨져 있으면 건너뛴다 — 안 보는 화면 때문에 필리핀 데이터를 쓰지 않는다. */
setInterval(function(){
  if (document.hidden) return;
  load().catch(function(){});
}, 60000);

// 화면으로 돌아왔을 때 최신화 — 푸시를 눌러 들어온 경우가 많다.
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) { outboxFlush(); subFlush(); load().catch(function(){}); }
});

})();
</script>
</body>
</html>
