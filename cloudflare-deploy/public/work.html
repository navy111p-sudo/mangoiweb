</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ── 언어 — 기본 영어(필리핀 매니저가 다수). 공통 키는 mangoi_lang. ─────────── */
var LANG = 'en';
try {
  var saved = localStorage.getItem('mangoi_lang');
  if (saved === 'ko' || saved === 'en') LANG = saved;
  else if ((navigator.language || '').indexOf('ko') === 0) LANG = 'ko';
} catch (e) {}
function EN(){ return LANG === 'en'; }
function T(en, ko){ return EN() ? en : ko; }

function applyLang(){
  document.documentElement.lang = LANG;
  var n = document.querySelectorAll('[data-en]');
  for (var i = 0; i < n.length; i++) n[i].textContent = EN() ? n[i].getAttribute('data-en') : n[i].getAttribute('data-ko');
  document.getElementById('lang').textContent = EN() ? 'KO' : 'EN';
  repaint();
}
window.toggleLang = function(){
  LANG = EN() ? 'ko' : 'en';
  try { localStorage.setItem('mangoi_lang', LANG); localStorage.setItem('mangoi_lang_by', 'user'); } catch (e) {}
  applyLang();
  if (NO_ACCESS) showNoAccess(NO_ACCESS_J);   // 안내도 새 언어로 다시 그린다
};

/* ── 어두운 화면 — 버튼으로만. 자동전환 금지. ──────────────────────────────── */
var MODE = 'light';
try { if (localStorage.getItem('mangoi_manager_theme') === 'dark') MODE = 'dark'; } catch (e) {}
function applyMode(){
  document.documentElement.classList.toggle('dark', MODE === 'dark');
  var s = document.getElementById('modeLbl');
  if (s) {
    var en = MODE === 'dark' ? 'Light' : 'Dark';
    var ko = MODE === 'dark' ? '밝게' : '어둡게';
    // ⚠️ data-en/data-ko 도 같이 갱신 — 안 하면 언어 전환 때 라벨이 되돌아간다(CLAUDE.md 함정)
    s.setAttribute('data-en', en); s.setAttribute('data-ko', ko);
    s.textContent = EN() ? en : ko;
  }
}
window.toggleMode = function(){
  MODE = (MODE === 'dark') ? 'light' : 'dark';
  try { localStorage.setItem('mangoi_manager_theme', MODE); } catch (e) {}
  applyMode();
};

/* ── 잡동사니 ─────────────────────────────────────────────────────────────── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(v, cur){
  if (v == null || v === '') return '';
  var n = Math.round(Number(v) || 0).toLocaleString('en-US');
  return (String(cur).toUpperCase() === 'KRW' ? '₩' : '₱') + n;
}
function when(ms){
  if (!ms) return '';
  var d = new Date(Number(ms));
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function offline(on){ document.body.classList.toggle('is-off', !!on); }
var toastT = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function(){ t.className = 'toast'; }, 3200);
}

/* ── 상태 ─────────────────────────────────────────────────────────────────── */
var CACHE_KEY = 'mangoi_work_home_v1';
var D = null;                       // 마지막으로 받은 /api/approval/home
var PICK = null;                    // 고른 분류
var CUR = 'PHP';
var PROXY_OPEN = {};                // 💳 「대신 결재」를 펼쳐 둔 건 id — 60초마다 다시 그려도 안 접히게
var OCR = null;                     // 영수증에서 읽은 값 {amount, spent_at, vendor}
var FILE = null;                    // 첨부할 파일 (사진 축소본)
var FOCUS_ID = 0;                   // 푸시로 들어왔을 때 강조할 건
var WANT_TYPE = '';                 // 🔗 /work?type=leave — 열자마자 그 분류 폼을 편다
try {
  var q = location.search.match(/[?&]id=(\d+)/);
  if (q) FOCUS_ID = Number(q[1]);
  var qt = location.search.match(/[?&]type=([a-zA-Z_]+)/);
  if (qt) WANT_TYPE = String(qt[1]).toLowerCase();
} catch (e) {}

/* ── 첫 화면 — API 1회 ────────────────────────────────────────────────────── */
function load(){
  return fetch('/api/approval/home', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function(r){
      /* 🔐 (2026-09-24) 401 과 403 은 다른 사실이다 — 갈라야 한다.
         401 = 로그인이 안 됨 → 로그인 창.  403 = 로그인은 됐는데 이 계정이 못 씀(지사·대리점).
         예전엔 둘 다 로그인 창으로 보내서, 지사 계정(branch1 폴정)이 다시 로그인해도 또 여기로
         와서 또 403 → «자꾸 다시 로그인하라» 에 갇혔다. 로그인 창은 그 사실을 말해 주지 못한다.
         ⛔ 403 을 다시 로그인 창으로 보내지 말 것. */
      if (r.status === 401) { location.href = '/admin/login?next=%2Fwork'; throw new Error('auth'); }
      if (r.status === 403) {
        return r.json().catch(function(){ return {}; }).then(function(j){
          showNoAccess(j || {});
          throw new Error('auth');
        });
      }
      return r.json();
    })
    .then(function(j){
      if (!j || j.ok === false) throw new Error((j && j.error) || 'load_failed');
      HOME_TRIED = true;              // 이제부터 문서함 자동 조회를 내보내도 된다
      D = j; offline(false);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch (e) {}
      repaint();
      noteArrival(j);   // 🔊 새로 들어온 것이 있으면 소리로 알린다 (함수 선언이라 위로 끌어올려진다)
      return j;
    })
    .catch(function(err){
      if (String(err && err.message) === 'auth') throw err;
      HOME_TRIED = true;              // 실패도 «시도» 다 — 문서함이 영영 안 채워지면 안 된다
      offline(true);
      if (!D) {
        // 마지막으로 성공했던 값이라도 그린다 — 흰 화면보다 낫다
        try {
          var c = localStorage.getItem(CACHE_KEY);
          if (c) { D = JSON.parse(c); repaint(); return D; }
        } catch (e) {}
        document.getElementById('inbox').innerHTML =
          '<div class="empty">' + esc(T('Could not load. Check your connection and press Refresh.',
                                        '불러오지 못했습니다. 연결을 확인하고 새로고침을 눌러 주세요.')) + '</div>';
      }
      throw err;
    });
}
window.reloadAll = function(){ load().catch(function(){}); };

/* 🚫 (2026-09-24) 이 계정은 결재함을 쓸 수 없다 — 로그인 창 대신 «왜» 와 «어디로» 를 말한다.
   - 캐시(mangoi_work_home_v1)를 지운다: 공용 PC 에서 앞사람(본사)의 결재 목록이 남아 보이면 안 된다.
   - 나머지 화면(목록·올리기 폼)은 감춘다 — 눌러도 전부 403 이라 «보이는데 안 되는» 버튼이 된다.
   - 60초 새로고침이 다시 불러도 같은 자리로 온다(멱등). */
var NO_ACCESS = false, NO_ACCESS_J = {};
function showNoAccess(j){
  NO_ACCESS = true; NO_ACCESS_J = j || {};
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  D = null;
  document.body.classList.add('no-access');
  var wrap = document.querySelector('.wrap'); if (!wrap) return;
  var box = document.getElementById('noAccess');
  if (!box) { box = document.createElement('div'); box.id = 'noAccess'; wrap.insertBefore(box, wrap.firstChild); }
  var who = String((j && j.who) || '');
  box.innerHTML =
    '<div class="na-t">' + esc(T('Approvals are for head-office accounts only.', '결재함은 본사 계정 전용입니다.')) + '</div>' +
    (who ? '<div class="na-l">' + esc(T('Signed in as: ', '지금 로그인한 계정: ')) + '<b>' + esc(who) + '</b></div>' : '') +
    '<div class="na-l">' + esc(T('You are signed in correctly — this account simply cannot use approvals. If you need approvals, sign in with a head-office account.',
                                  '로그인은 정상입니다. 이 계정으로는 결재함을 쓸 수 없을 뿐입니다. 결재가 필요하면 본사 계정으로 로그인해 주세요.')) + '</div>' +
    '<div class="na-a"><a class="tbtn" href="/admin.html">' + esc(T('← Back to admin', '← 관리자 화면으로')) + '</a></div>';
}

/* ── 🔙 뒤로 · 🏠 홈 (2026-08-20) ──────────────────────────────────────────
   왜 — 결재함에는 나가는 길이 「로그아웃」밖에 없었다. 관리자 화면에서 「결재 올리기」로
        건너오면 돌아갈 방법이 없어 브라우저 뒤로가기를 눌러야 했다(휴대폰 앱에서는 그것도 없다).
   ⚠️ 새 탭·카톡 링크로 열면 history 가 «이 페이지 하나» 뿐이라 back() 이 아무 일도 하지 않는다.
      그때는 홈으로 보낸다 — 「눌렀는데 아무 일도 안 일어난다」 를 만들지 않는다. */
window.goBack = function(){
  var home = (document.getElementById('homeBtn') || {}).href || '/admin.html';
  try {
    if (window.history.length > 1) { window.history.back(); return; }
  } catch (e) {}
  location.href = home;
  /* ⛔ 「back 이 안 먹으면 홈으로」 를 setTimeout 안전망으로 만들지 말 것.
     뒤로 간 뒤 «앞으로» 로 이 화면에 돌아오면(bfcache 복원) 멈춰 있던 타이머가 깨어나
     사람이 누르지도 않은 이동이 일어난다. history.length 판정만으로 충분하다. */
};

/* 홈은 «그 사람의 홈» 이어야 한다 — 강사에게 1.3MB 관리자 화면을 주지 않는다.
   판정이 오기 전 기본값은 관리자 화면이고, /api/approval/home 이 오면 바로잡는다. */
function applyHome(){
  var a = document.getElementById('homeBtn'); if (!a || !D || !D.me) return;
  a.href = D.me.is_teacher ? '/teacher' : (D.me.is_ph_manager ? '/manager' : '/admin.html');
}

/* ── 그리기 ───────────────────────────────────────────────────────────────── */
function repaint(){
  if (!D) return;
  applyHome();
  paintBadge();
  paintKinds();
  paintReuse();
  // 🚨 긴급 소통 — 남이 올린 것 중 내가 볼 수 있는 것. 결재 권한과 무관하게 «보이는» 것이 목적이다.
  //    (내가 이미 결재할 수 있는 긴급 건은 아래 결재함에 뜨므로 여기서는 뺀다 — 같은 줄이 두 번 나오지 않게)
  var urg = (D.urgent || []).filter(function(u){
    return !(D.inbox || []).some(function(x){ return x.id === u.id; });
  });
  document.getElementById('urgentHead').hidden = !urg.length;
  document.getElementById('urgent').innerHTML = urg.length
    ? urg.map(function(r){ return itemHtml(r, false); }).join('')
    : '';

  paintTop();
  paintAway();
  paintSchedule();
  paintBulk();
  paintAck();
  paintList('inbox', D.inbox || [], true);
  paintList('mine', D.mine || [], false);
  paintForm();          // 언어를 바꿔도 폼 라벨이 따라오게. 값은 paintForm 이 챙겨서 되돌린다.
  // 📂 문서함이 열려 있으면 그것도 다시 그린다 — JS 로 그린 글자는 data-ko/data-en 루프가
  //    못 건드리므로, 여기서 다시 그리지 않으면 언어를 바꿔도 영어/한국어가 섞인 채 남는다.
  var fp = document.getElementById('findPanel');
  if (fp && !fp.hidden) { paintFindChrome(); paintFindBox(); paintFind(); }
  paintFindBtn();
  findAutoOpen();       // 펼쳐진 채로 시작하므로 홈을 다 그린 뒤 한 번 찾아 둔다
  var rp = document.getElementById('repPanel');
  if (rp && !rp.hidden) { paintRepChrome(); paintRep(); }
  paintOutbox();
  paintPushBtn();
  // 이미 권한을 준 사람은 조용히 구독을 되살린다(기기를 바꾸거나 캐시가 지워졌을 수 있다).
  // ⚠️ pushSilentTried — repaint() 는 자주 도는데, 실패하면 pushOn 이 다시 false 로
  //    되돌아오므로 가드가 없으면 그릴 때마다 발급요청·SW등록·POST 가 다시 나간다.
  //    한 번 실패했으면 이 페이지가 살아 있는 동안은 다시 안 묻는다.
  //    ⛔ 버튼(askPush)은 이 가드에 걸리지 않는다 — 사람이 누르면 언제든 다시 시도한다.
  if (!pushOn && !pushSilentTried && pushReady() && Notification.permission === 'granted' && D.me && D.me.username) {
    pushSilentTried = true;
    pushOn = true;                       // 중복 호출 방지 — 실패하면 아래에서 되돌린다
    subscribePush().then(function(r){
      if (!r.ok) pushOn = false;
      // ⚠️ «끊김» 은 저절로 낫는 실패다 — 가드를 풀어 회선이 돌아오면 다음 회차에 붙게 한다.
      //    (이 화면은 60초마다 load()→repaint() 한다. 태풍·정전 때 열면 첫 회차가 net 으로
      //     실패하는데, 여기서 가드를 걸면 그 탭이 사는 동안 영영 안 붙는다.)
      if (!r.ok && r.step === 'net') pushSilentTried = false;
      paintPushBtn();
    });
  }
  if (FOCUS_ID) {
    var el = document.getElementById('req-' + FOCUS_ID);
    if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } }
  }
}

function paintBadge(){
  var b = document.getElementById('badge');
  var n = (D.inbox || []).length;
  var late = (D.inbox || []).filter(isOverdue).length;
  b.textContent = late ? (n + ' / ' + late) : String(n);
  b.className = 'badge' + (late ? ' late' : (n ? '' : ' zero'));
  b.title = late ? T(late + ' overdue', '지연 ' + late + '건') : '';
}

function typeLabel(r){ return EN() ? (r.type_en || r.req_type) : (r.type_ko || r.req_type); }

/* ✅ 확인할 것 — 「결재」와 섞이지 않게 별도 구역으로 그린다.
     ⛔ 이 목록을 결재함(inbox)에 합치지 말 것. 합치면 「내가 결재할 것 5건」이 실제로는
        «눌러야 움직이는 것»과 «이미 끝난 것»을 섞어 세게 되어, 급한 건이 그 안에 묻힌다. */
function paintAck(){
  var host = document.getElementById('ackBox');
  var head = document.getElementById('ackHead');
  if (!host || !head) return;
  var arr = (D && D.ack_pending) || [];
  head.hidden = !arr.length;
  if (!arr.length) { host.innerHTML = ''; return; }
  var s = (D && D.summary) || {};
  var more = s.ack_capped ? '+' : '';
  var h = '<div class="why"><b>' +
    esc(T('These are already approved — nothing is waiting on you.',
          '이미 결재가 끝난 건입니다 — 대표님을 기다리는 것이 아닙니다.')) + '</b> ' +
    esc(T('Press Confirm to mark that you have seen it. Work goes ahead either way.',
          '보셨다는 표시만 남기시면 됩니다. 안 누르셔도 업무는 그대로 진행됩니다.')) +
    '</div>';
  for (var i = 0; i < arr.length; i++) h += itemHtml(arr[i], false, true);
  if (more) {
    h += '<div class="steps">' + esc(T('Showing the 20 most recent.', '최근 20건만 보여 줍니다.')) + '</div>';
  }
  host.innerHTML = h;
}

function paintList(id, arr, decidable){
  var host = document.getElementById(id);
  if (!arr.length) {
    host.innerHTML = '<div class="empty">' +
      esc(decidable ? T('Nothing waiting for you.', '결재할 것이 없습니다.')
                    : T('You have not submitted anything yet.', '올린 결재가 없습니다.')) + '</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < arr.length; i++) h += itemHtml(arr[i], decidable);
  host.innerHTML = h;
}

/* 지연 판정은 **화면이 한다**. 서버가 «지금 지연인가»를 담아 보내면 내용이 그대로여도
   응답이 매초 달라져서, 「바뀐 것 없음(304)」으로 끝낼 수가 없다 — 느린 회선에서 그게 제일 아깝다.
   서버는 «언제까지» 만 보내고, 지금 시각과 비교하는 일은 여기서 한다. */
function isOverdue(r){
  return !!(r.status === 'pending' && r.stage_due_at && Date.now() > Number(r.stage_due_at));
}

/* 🧭 「내가 올린 건인가」 — 진행바와 «멈춤» 안내는 내 건에만 그린다.
   남이 올린 긴급 소통에까지 「승인할 사람이 없습니다」를 띄우면 남의 일에 대고 하는 말이 된다. */
function isMine(r){
  return !!(D && D.me && D.me.username && String(r.requester_username) === String(D.me.username));
}

/* 며칠째인가. 지연 판정과 같은 이유로 **화면이** 센다 — 서버가 담으면 내용이 그대로여도
   응답이 매초 달라져서 「바뀐 것 없음(304)」으로 끝낼 수가 없다. */
/* 「며칠째 기다리는가」.
   🔴 회수하고 다시 올린 건은 **원래 올린 날부터** 센다 — 안 그러면 「6일째」가
      다시 올리는 순간 «오늘» 로 초기화되어 **지연이 조용히 감춰진다.**
      (그래서 「기다리기 지루하니 회수 → 재작성」이 지연을 지우는 길이 되면 안 된다.) */
function daysWaiting(r){
  var base = Number(r.origin_created_at || 0) || Number(r.created_at || 0);
  return Math.floor((Date.now() - base) / 86400000);
}

function roleLabel(role){
  if (role === 'exec') return T('Exec', '경영진');
  /* 💳 'mgr' = 돈이 나가는 건의 지정 결재권자(서버 MONEY_APPROVERS).
     ⛔ 사람 이름을 여기 적지 말 것 — 명단이 바뀌면 화면만 조용히 옛 이름을 말한다. */
  if (role === 'mgr') return T('Approver', '결재권자');
  return T('Office', '본사');
}

/* 진행 추적 줄 — 올림 → (단계마다) → 완료.
   ⚠️ steps 가 비어 있는 옛 건은 «1단계짜리»로 본다(서버 rowOf 와 같은 해석). */
/** 아직 결재를 기다리는 중인가 — 서버 `isLive` 와 같은 뜻. */
function isLiveStatus(st){ return String(st || '') === 'pending'; }

/** 진행바 «완료» 칸의 글자 — 서버가 준 상태 이름을 그대로 쓴다.
    ⛔ 여기에 상태 목록을 다시 적지 않는다(상태가 늘 때 이 칸만 조용히 빈다). */
function endLabel(r){
  if (isLiveStatus(r.status)) return '';
  return (EN() ? r.status_en : r.status_ko) || '';
}

function trackHtml(r){
  var steps = (r.steps && r.steps.length) ? r.steps
            : [{ seq: 1, role: 'staff', status: (r.status === 'pending' ? 'active' : r.status) }];
  function cell(cls, top, bot){
    return '<div class="trkS' + (cls ? ' ' + cls : '') + '"><span class="trkBar"></span>' +
           '<span class="trkB"></span><span class="trkL">' + esc(top) +
           (bot ? ('<br>' + esc(bot)) : '') + '</span></div>';
  }
  var h = '<div class="trk">';
  h += cell('done', T('Submitted', '올림'), when(r.created_at));
  for (var i = 0; i < steps.length; i++) {
    var s = steps[i], cls = '', mark = '';
    if (s.status === 'approved')      { cls = 'done'; mark = T('Approved', '승인'); }
    else if (s.status === 'rejected') { cls = 'no';   mark = T('Rejected', '반려'); }
    else if (s.status === 'skipped')  { cls = 'done'; mark = T('Skipped', '전결'); }
    else if (s.status === 'withdrawn') { cls = 'no'; mark = T('Withdrawn', '회수'); }
    else if (s.status === 'active')   { cls = r.blocked ? 'stop' : 'now';
                                        mark = r.blocked ? T('Stopped', '멈춤') : T('In progress', '진행 중'); }
    /* 🔴 끝난 건의 «남은 단계» 를 「대기」라고 말하면 안 된다 — 배지는 「회수됨」인데
       바로 아래 진행바가 「대기」라고 하면 한 카드가 서로 다른 말을 한다
       (2026-09-05 함정 대조 실측). 아무도 기다리지 않으므로 «—» 로 둔다. */
    else if (!isLiveStatus(r.status)) { mark = '—'; }
    else                              { mark = T('Waiting', '대기'); }
    h += cell(cls, roleLabel(s.role), mark);
  }
  h += cell(r.status === 'approved' ? 'done' : (isLiveStatus(r.status) ? '' : 'no'),
            T('Done', '완료'), endLabel(r));
  return h + '</div>';
}

/* 🔴 「기다려도 처리되지 않습니다」 — **서버가** «결재할 수 있는 사람 0명»이라고 알려 준 건에만.
   ⛔ 화면이 스스로 판정하지 않는다 — 계정 목록도 결재 규칙도 모르므로 틀린 말을 하게 된다. */
function stuckHtml(r){
  var role = 'staff';
  for (var i = 0; i < (r.steps || []).length; i++) {
    if (Number(r.steps[i].seq) === Number(r.stage_seq)) { role = r.steps[i].role; break; }
  }
  var who = roleLabel(role);
  return '<div class="stuck"><b>' +
    esc(T('This will not move on its own.', '이대로는 처리되지 않습니다.')) + '</b> ' +
    esc(EN()
      ? ('Nobody can decide the "' + who + '" step right now — and you cannot approve your own request. ' +
         'Someone else has to be given rights for this step.')
      : ('지금 「' + who + '」 단계를 결재할 수 있는 사람이 없습니다. 본인이 올린 결재는 본인이 승인할 수 없기 때문입니다. ' +
         '이 단계를 결재할 사람을 지정해야 움직입니다.')) +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   📂 결재 문서함 — 지난 결재 찾기 (2026-09-04)

   왜 — 「내가 올린 것」이 최근 15건뿐이라 그 뒤로는 볼 방법이 없었다.
   검색·기간·분류·상태로 찾고, 엑셀로 내려받는다.

   ⚠️ 첫 화면은 API 한 번으로 끝낸다는 이 화면의 설계를 깨지 않는다 —
      사람이 «찾기» 를 눌렀을 때만 서버를 부른다.
   ══════════════════════════════════════════════════════════════════════════ */

var FIND = null;          // 마지막 검색 결과 { items, has_more, offset }
var FIND_BUSY = false;
var FIND_AUTO = false;    // 펼쳐진 채로 시작하므로 «자동 첫 조회» 를 한 번만 한다
/* 🔴 home 을 한 번은 «시도했는가». 자동 조회는 그 뒤에만 나간다.
   왜 — 부팅 경로가 둘이다. 캐시가 있으면(재방문자는 전원 그렇다) load() «전»에
        repaint() 가 동기로 돌아, 이 플래그가 없으면 find 가 home 보다 **먼저** 나간다.
        [잰 것 — 2026-09-07 CDP 실측] 캐시 없음: home 33.3ms → find 113.6ms /
        캐시 있음: **find 33.6ms → home 37.2ms**(역순, 사실상 동시).
   ⛔ 「repaint 뒤에 부르니까 home 이 먼저」로 적지 말 것 — 그 repaint 가 어디서
      불렸는지에 달려 있다. 실제로 그렇게 적었다가 함정 대조에서 잡혔다. */
var HOME_TRIED = false;
/* 🔖 마지막으로 고른 범위를 그 기기에 기억한다 (2026-09-07).
   왜 — 펼쳐 놓아도 기본이 「내가 올린 것」이면 바로 위 목록과 같은 것이 또 보인다.
        찾던 것은 「전체」·「승인 완료」였다. 한 번 고르면 다음에도 그대로 열린다.
   ⚠️ 저장된 값이 목록에 **없으면**(결재 권한을 잃어 「전체」가 사라진 경우) 그냥 둔다 —
      서버도 같은 판정으로 막으므로 «고를 수 없는 값» 이 남아 있으면 안 된다. */
var FSCOPE_KEY = 'mangoi_work_find_scope';
var FSCOPE_APPLIED = false;

window.toggleFind = function(){
  var box = document.getElementById('findPanel');
  if (!box) return;
  var open = box.hidden;                     // 지금 닫혀 있으면 연다
  box.hidden = !open;
  paintFindBtn();
  if (open) {
    paintFindChrome();
    if (!FIND) runFind(0);                   // 처음 열 때 한 번만 부른다
    loadFacets();                            // 함 옆 건수 — 열 때마다 새로(결재가 그사이 바뀐다)
    var q = document.getElementById('fq');
    if (q) { try { q.focus(); } catch (e) {} }
  }
};

/* 여는 버튼의 이름표 — 펼쳐져 있으면 「접기」, 접혀 있으면 「지난 결재 찾기」.
   ⚠️ data-ko/data-en 도 함께 쓴다. applyLang 이 그 속성으로 textContent 를 갈아끼우므로,
      textContent 만 바꾸면 🌐 를 누르는 순간 옛 글자로 되돌아간다(CLAUDE.md). */
function paintFindBtn(){
  var box = document.getElementById('findPanel');
  var btn = document.getElementById('findBtn');
  if (!box || !btn) return;
  var open = !box.hidden;
  var ko = open ? '접기' : '지난 결재 찾기';
  var en = open ? 'Hide' : 'Find past requests';
  btn.setAttribute('data-ko', ko);
  btn.setAttribute('data-en', en);
  btn.textContent = EN() ? en : ko;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

/* 펼쳐진 채로 시작하니 첫 조회도 우리가 한 번 해 준다.
   ⚠️ 첫 화면 «그리기» 는 그대로 /api/approval/home 한 번이다 — 이 함수는 그 응답을
      **시도한 뒤**에만 나간다(위 HOME_TRIED). 홈이 통째로 실패했을 때도 한 번은
      불리도록 부팅 꼬리에서도 부른다(그 경우 화면이 «연결이 좋지 않습니다» 라고 말한다). */
function findAutoOpen(){
  var box = document.getElementById('findPanel');
  if (!HOME_TRIED) return;            // 캐시로 먼저 그린 것뿐이면 아직 기다린다
  if (!box || box.hidden || FIND || FIND_AUTO || FIND_BUSY) return;
  FIND_AUTO = true;
  paintFindChrome();
  paintFindBox();            // 🗂 함 트리(건수는 곧 loadFacets 가 채운다)
  loadFacets();
  runFind(0);
}

/* ══════════════════════════════════════════════════════════════════════════
   🗂 결재 보관함 — 왼쪽 함 트리(시안 A, 2026-09-08)

   사장님 「내가 결재한 것·남이 결재한 것을 다 볼 수 있는 곳이 어디냐」 →
   「보관함 카드를 열면 전체·기간별·결재자별·종류별을 한 번에」.
   함은 «보는 방식» 이다 — 누르면 오른쪽 조건(scope · 기간 · 결재자 · 종류)이 바뀌고
   결과는 지금 있는 runFind 가 그대로 가져온다(서버는 같은 경로, 파라미터만 늘었다).
   ⚠️ 함 옆 건수는 서버 facets 가 센다 — 화면이 세면 15건 창 안에서만 세게 된다.
   ⚠️ 기간 함의 날짜 경계도 서버가 준다(KST). 화면이 따로 계산하면 두 벌이 되어 어긋난다.
   ══════════════════════════════════════════════════════════════════════════ */
var FACETS = null;        // 서버가 준 함 옆 건수
var FIND_BY = '';         // 결재자별 함 — 서버 파라미터 decided_by

function loadFacets(){
  fetch('/api/approval/requests?view=facets', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      // «성공이라고 말했는가» 로 판정 — 404 본문에는 ok 칸이 없다.
      FACETS = (d && d.ok === true && d.facets) ? d.facets : { unknown: true, failed: true };
      paintFindBox();
    })
    .catch(function(){ FACETS = { unknown: true, failed: true }; paintFindBox(); });
}

/** 지금 오른쪽 조건이 무엇인지 — 함의 «켜짐» 표시가 이것을 본다. */
function fbState(){
  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  return { scope: g('fscope') || 'mine', from: g('ffrom'), to: g('fto'), type: g('ftype'), by: FIND_BY };
}

function paintFindBox(){
  var box = document.getElementById('findBox');
  if (!box) return;
  var f = FACETS;
  var st = fbState();
  var canAll = !!(D && D.can_approve);
  var n = function(v){ return (v == null) ? '—' : String(v); };
  var item = function(on, label, count, onclick){
    return '<button type="button" class="fbitem' + (on ? ' on' : '') + '" onclick="' + onclick + '">' +
           '<span>' + esc(label) + '</span><span class="fbn">' + esc(count) + '</span></button>';
  };
  var h = '';
  if (!f) {
    h += '<div class="fbnote">' + esc(T('Counting...', '건수를 세는 중...')) + '</div>';
  }
  var noPeriod = !st.from && !st.to;

  // ① 전체
  h += '<div class="fbgrp">' + esc(T('All', '전체')) + '</div>';
  if (canAll) {
    h += item(st.scope === 'all' && !st.by, T('Everything', '전체 결재'), f ? n(f.all) : '', 'fbPick(\'scope\',\'all\')');
  }
  h += item(st.scope === 'decided' && !st.by, T('Decided by me', '내가 결재한 것'), f ? n(f.decided) : '', 'fbPick(\'scope\',\'decided\')');
  h += item(st.scope === 'mine' && !st.by, T('My requests', '내가 올린 것'), f ? n(f.mine) : '', 'fbPick(\'scope\',\'mine\')');

  // ② 기간별 — 경계는 서버가 준 것(KST)
  var per = (f && f.periods) || null;
  var PER = [['month', T('This month', '이번 달')], ['last_month', T('Last month', '지난 달')],
             ['quarter', T('This quarter', '이번 분기')], ['year', T('This year', '올해')]];
  h += '<div class="fbgrp">' + esc(T('By period', '기간별')) + '</div>';
  for (var i = 0; i < PER.length; i++) {
    var pk = PER[i][0], pv = per ? per[pk] : null;
    var on = !!(pv && st.from === pv.from && st.to === pv.to);
    h += item(on, PER[i][1], pv ? n(pv.n) : '', pv ? ('fbPick(\'period\',\'' + pk + '\')') : 'void 0');
  }

  // ③ 결재자별 — 결재 권한자에게만(서버도 approver_view 로 같은 판정)
  var aps = (f && f.approvers) || [];
  if (canAll && (!f || aps.length)) {
    h += '<div class="fbgrp">' + esc(T('By approver', '결재자별')) + '</div>';
    for (var a = 0; a < aps.length; a++) {
      h += item(st.by === aps[a].username, aps[a].name || aps[a].username, n(aps[a].n),
                'fbPick(\'by\',\'' + esc(aps[a].username).replace(/'/g, '') + '\')');
    }
    if (f && !aps.length) h += '<div class="fbnote">' + esc(T('No decisions yet', '아직 결재한 사람이 없습니다')) + '</div>';
  }

  // ④ 종류별 — 서버 목록(TYPES) 순서 그대로, 0건인 종류는 감춘다(빈 폴더는 눌러도 빈 표다)
  var tys = (f && f.types) || [];
  var shown = 0, th = '';
  for (var k = 0; k < tys.length; k++) {
    if (!tys[k].n) continue;
    shown++;
    th += item(st.type === tys[k].key, EN() ? (tys[k].en || tys[k].key) : (tys[k].ko || tys[k].key), n(tys[k].n),
               'fbPick(\'type\',\'' + esc(tys[k].key) + '\')');
  }
  if (shown) h += '<div class="fbgrp">' + esc(T('By kind', '종류별')) + '</div>' + th;

  if (st.by || st.from || st.to || st.type) {
    h += '<button type="button" class="fbclear" onclick="fbPick(\'clear\')">' + esc(T('Clear folders', '함 조건 지우기')) + '</button>';
  }
  if (f && f.unknown) {
    h += '<div class="fbnote">' + esc(T('Some counts could not be read.', '일부 건수를 읽지 못했습니다.')) + '</div>';
  }
  box.innerHTML = h;
  paintFindWhere();
}

/** 오른쪽 위 한 줄 — 「지금 무엇을 보고 있나」. 함이 여러 축을 겹치면 사람이 잊는다. */
function paintFindWhere(){
  var el = document.getElementById('findWhere');
  if (!el) return;
  var st = fbState();
  var parts = [];
  var SC = { all: T('everything', '전체 결재'), decided: T('decided by me', '내가 결재한 것'),
             mine: T('my requests', '내가 올린 것'), open: T('in progress', '진행 중'),
             done: T('approved', '승인 완료'), rejected: T('not approved', '안 된 것'),
             pending: T('waiting for me', '내가 결재할 것') };
  parts.push(SC[st.scope] || st.scope);
  if (st.by) {
    var ap = ((FACETS && FACETS.approvers) || []).filter(function(x){ return x.username === st.by; })[0];
    parts.push((EN() ? 'decided by ' : '결재자 ') + (ap ? (ap.name || ap.username) : st.by));
  }
  if (st.from || st.to) parts.push((st.from || '…') + ' ~ ' + (st.to || '…'));
  if (st.type) {
    var ty = ((D && D.types) || []).filter(function(x){ return x.key === st.type; })[0];
    parts.push(ty ? (EN() ? ty.en : ty.ko) : st.type);
  }
  el.innerHTML = esc(T('Showing: ', '보는 중: ')) + '<b>' + esc(parts.join(' · ')) + '</b>';
}

/** 함을 눌렀다 — 그 축만 바꾼다(다른 축은 그대로). «전체» 함은 결재자 축을 함께 지운다. */
window.fbPick = function(kind, val){
  var set = function(id, v){ var e = document.getElementById(id); if (e) e.value = v; };
  if (kind === 'scope') { set('fscope', val); FIND_BY = ''; }
  else if (kind === 'by') { FIND_BY = (FIND_BY === val) ? '' : val; if (FIND_BY) set('fscope', 'all'); }
  else if (kind === 'period') {
    var pv = FACETS && FACETS.periods && FACETS.periods[val];
    if (!pv) return;
    var st = fbState();
    if (st.from === pv.from && st.to === pv.to) { set('ffrom', ''); set('fto', ''); }   // 한 번 더 누르면 끄기
    else { set('ffrom', pv.from); set('fto', pv.to); }
  }
  else if (kind === 'type') { var t = document.getElementById('ftype'); if (t) t.value = (t.value === val) ? '' : val; }
  else if (kind === 'clear') { FIND_BY = ''; set('ffrom', ''); set('fto', ''); set('ftype', ''); }
  paintFindBox();
  runFind(0);
};

/** 오른쪽 «함» 고르기 칸을 손으로 바꿨을 때 — 결재자 함과 어긋나지 않게 */
window.fbScopeChanged = function(){
  var st = fbState();
  if (st.scope !== 'all') FIND_BY = '';
  paintFindBox();
  runFind(0);
};

/** 맨 위 「결재 보관함」 카드 → 문서함을 열고 «전체»(권한자) 또는 «내가 올린 것» 으로 */
window.topArchive = function(){
  var box = document.getElementById('findPanel');
  if (box && box.hidden && window.toggleFind) window.toggleFind();
  var sc = document.getElementById('fscope');
  /* «전체» 로 바꾸고 기억까지(fscopePick) — 사람이 고른 것과 같은 길을 탄다 */
  if (sc && D && D.can_approve && sc.value !== 'all') { sc.value = 'all'; FIND_BY = ''; window.fscopePick(); }
  var el = document.getElementById('findBtn');
  if (el) { try { el.scrollIntoView({ block: 'start' }); } catch (e) { el.scrollIntoView(); } }
};

/* 고르는 칸을 그린다.
   ⚠️ 분류 목록은 **서버가 준 것**(D.types)을 쓴다 — 화면에 손으로 적으면
      서버가 분류를 늘리거나 줄여도 따라오지 않는다. */
function paintFindChrome(){
  var sc = document.getElementById('fscope');
  if (!sc) return;
  var scopes = [
    ['mine',     T('My requests (all)', '내가 올린 것 (전체)')],
    /* 🗂 「내가 결재한 것」 — 내가 도장을 찍은 건(2026-09-08 까지 이 함이 없었다) */
    ['decided',  T('Decided by me',     '내가 결재한 것')],
    ['open',     T('In progress',       '진행 중')],
    ['done',     T('Approved',          '승인 완료')],
    /* 🔴 서버 scope 'rejected' 는 반려·회수·취소 **셋** 을 담는다(셋 다 «결국 안 된 것»).
       라벨을 「반려」로 두면 골랐을 때 회수·취소가 섞여 나와 이름표가 거짓말을 한다. */
    ['rejected', T('Not approved (rejected · withdrawn · cancelled)', '안 된 것 (반려·회수·취소)')]
  ];
  // 결재자에게만 «내가 결재할 것»·«전체» 를 준다 — 서버도 같은 판정으로 막는다.
  if (D && D.can_approve) {
    scopes.push(['pending', T('Waiting for me', '내가 결재할 것')]);
    scopes.push(['all',     T('Everything',     '전체')]);
  }
  fillSel(sc, scopes);
  /* 기억해 둔 범위를 **처음 그릴 때 한 번만** 되살린다 — 그 뒤에는 사람이 고른 값이 정본이다.
     ⚠️ fillSel 은 «이미 골라 둔 값» 만 지켜 준다. 처음에는 그 값이 없어 첫 항목(mine)이
        골라지므로, 여기서 따로 넣어 준다. 목록에 없는 값이면 손대지 않는다. */
  if (!FSCOPE_APPLIED) {
    FSCOPE_APPLIED = true;
    try {
      var want = localStorage.getItem(FSCOPE_KEY);
      if (want) {
        for (var wi = 0; wi < sc.options.length; wi++) {
          if (sc.options[wi].value === want) { sc.value = want; break; }
        }
      }
    } catch (e) {}
  }

  var ty = [['', T('All kinds', '분류 전체')]];
  var list = (D && D.types) || [];
  for (var i = 0; i < list.length; i++) {
    ty.push([list[i].key, EN() ? (list[i].en || list[i].key) : (list[i].ko || list[i].key)]);
  }
  fillSel(document.getElementById('ftype'), ty);

  /* 🔴 상태 목록을 **손으로 적지 않는다** — 서버(STATUS_KEYS)는 다 받는데 화면에만
     선택지가 없으면 「기능이 있는데 아무도 못 쓰는」 상태가 된다(회수·취소가 실제로 그랬다).
     ⚠️ 이름은 서버가 준 것을 쓴다(D.statuses) — 없으면 옛 응답이므로 손으로 떨어뜨린다. */
  var st = [['', T('Any status', '상태 전체')]];
  var sl = (D && D.statuses) || [];
  if (sl.length) {
    for (var si = 0; si < sl.length; si++) st.push([sl[si].key, EN() ? sl[si].en : sl[si].ko]);
  } else {
    st.push(['pending',  T('Waiting',  '대기 중')]);
    st.push(['approved', T('Approved', '승인')]);
    st.push(['rejected', T('Rejected', '반려')]);
  }
  fillSel(document.getElementById('fstat'), st);

  /* 🏷️ 지출 항목도 서버 목록(D.categories)으로 그린다. 목록이 안 왔으면 그 칸을 감춘다 —
     빈 «고르기» 칸이 있으면 「고를 게 없다」가 아니라 「고장」으로 읽힌다. */
  var ce = document.getElementById('fcat');
  var cl = (D && D.categories) || [];
  if (ce) {
    ce.hidden = !cl.length;
    if (cl.length) {
      var cp = [['', T('All items', '항목 전체')]];
      for (var k = 0; k < cl.length; k++) {
        cp.push([cl[k].key, EN() ? (cl[k].en || cl[k].key) : (cl[k].ko || cl[k].key)]);
      }
      fillSel(ce, cp);
    }
  }

  // placeholder 는 data-en/data-ko 루프가 못 건드린다(그건 textContent 를 바꾼다).
  var q = document.getElementById('fq');
  if (q) q.placeholder = EN() ? (q.getAttribute('data-en-ph') || '') : (q.getAttribute('data-ko-ph') || '');
}

/** 고른 값을 잃지 않고 다시 그린다 — 언어를 바꿔도 고른 것이 그대로 있어야 한다. */
function fillSel(el, pairs){
  if (!el) return;
  var keep = el.value;
  var h = '';
  for (var i = 0; i < pairs.length; i++) {
    h += '<option value="' + esc(pairs[i][0]) + '">' + esc(pairs[i][1]) + '</option>';
  }
  el.innerHTML = h;
  if (keep) el.value = keep;
}

function findParams(){
  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = [];
  p.push('scope=' + encodeURIComponent(g('fscope') || 'mine'));
  if (g('fq'))    p.push('q=' + encodeURIComponent(g('fq')));
  if (g('ftype')) p.push('type=' + encodeURIComponent(g('ftype')));
  if (g('fstat')) p.push('status=' + encodeURIComponent(g('fstat')));
  if (g('fcat'))  p.push('category=' + encodeURIComponent(g('fcat')));
  if (g('ffrom')) p.push('from=' + encodeURIComponent(g('ffrom')));
  if (g('fto'))   p.push('to=' + encodeURIComponent(g('fto')));
  if (FIND_BY)    p.push('decided_by=' + encodeURIComponent(FIND_BY));   // 🗂 결재자별 함
  return p.join('&');
}

window.runFind = function(offset){
  if (FIND_BUSY) return;
  var host = document.getElementById('findResult');
  if (!host) return;
  FIND_BUSY = true;
  if (!offset) host.innerHTML = '<div class="findnote">' + esc(T('Searching...', '찾는 중...')) + '</div>';

  fetch('/api/approval/requests?' + findParams() + '&limit=20&offset=' + (offset || 0), {
    credentials: 'same-origin', headers: { 'Accept': 'application/json' }
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    FIND_BUSY = false;
    // ⚠️ «실패라고 말했는가» 가 아니라 «성공이라고 말했는가» 로 판정한다.
    //    404 본문에는 ok 칸이 아예 없어서 d.ok === false 는 그냥 통과한다(CLAUDE.md).
    if (!d || d.ok !== true || !Array.isArray(d.items)) {
      host.innerHTML = '<div class="findnote">' +
        esc(T('Could not search. Please try again.', '찾지 못했습니다. 다시 눌러 주세요.')) + '</div>';
      return;
    }
    var prev = (offset && FIND) ? FIND.items : [];
    FIND = { items: prev.concat(d.items), has_more: !!d.has_more, offset: Number(d.offset || 0) };
    paintFind();
  })
  .catch(function(){
    FIND_BUSY = false;
    host.innerHTML = '<div class="findnote">' +
      esc(T('Network problem. Please try again.', '연결이 좋지 않습니다. 다시 눌러 주세요.')) + '</div>';
  });
};

/* 범위를 고르면 기억하고 다시 찾는다.
   🔴 저장을 runFind 안에 두면 «사람이 고르지 않은 값» 까지 덮어쓴다 — 홈이 실패해
      D 가 없으면 목록에 「전체」가 없어 복원이 실패하고, 그 자리의 기본값(mine)이
      저장되어 **결재자가 골라 둔 「전체」가 영구히 지워진다**(2026-09-07 실측).
      그래서 «사람이 고른 순간» 에만 쓴다.
   ⚠️ 인라인 onchange 가 부르므로 반드시 window 에 둔다 — 이 파일 안 닫힌 스코프에
      두면 ReferenceError 이고 «고쳐도 값만 조용히 안 담긴다»(CLAUDE.md). */
window.fscopePick = function(){
  try {
    var fsc = document.getElementById('fscope');
    if (fsc && fsc.value) localStorage.setItem(FSCOPE_KEY, fsc.value);
  } catch (e) {}
  fbScopeChanged();          // 🗂 함 트리의 «켜짐» 표시와 결재자 축을 맞춘 뒤 runFind(0)
};

window.findMore = function(){
  if (!FIND) return;
  runFind(FIND.offset + 20);
};

function paintFind(){
  var host = document.getElementById('findResult');
  if (!host || !FIND) return;
  if (!FIND.items.length) {
    host.innerHTML = '<div class="findnote">' +
      esc(T('Nothing found. Try a different word or period.',
            '찾은 것이 없습니다. 다른 낱말이나 기간으로 해 보세요.')) + '</div>';
    return;
  }
  var h = '<div class="findnote">' +
    esc(EN() ? (FIND.items.length + ' found' + (FIND.has_more ? ' (more below)' : ''))
             : (FIND.items.length + '건' + (FIND.has_more ? ' (더 있습니다)' : ''))) + '</div>';
  for (var i = 0; i < FIND.items.length; i++) h += itemHtml(FIND.items[i], false);
  if (FIND.has_more) {
    h += '<button type="button" class="findmore" onclick="findMore()">' +
         esc(T('Show more', '더 보기')) + '</button>';
  }
  host.innerHTML = h;
}

/* 엑셀 내려받기 — 지금 고른 조건 그대로.
   ⚠️ window.open 을 쓰지 않는다: 카톡·문자 인앱 브라우저는 새 창을 못 열면서
      예외도 안 던지고 null 만 돌려준다(CLAUDE.md). 같은 창에서 연다 —
      서버가 Content-Disposition: attachment 를 주므로 화면은 그대로 있고 파일만 받는다. */
window.findCsv = function(){
  location.href = '/api/approval/requests?' + findParams() + '&format=csv';
};

/* ══════════════════════════════════════════════════════════════════════════
   📊 지출 정리 — 「이번 달 무슨 돈을 얼마나 썼나」

   ⛔ 통화를 섞어서 하나로 보여 주지 않는다 — 환율을 우리가 모른다.
      PHP 와 KRW 를 나란히 적는다. 서버(summarizeApprovals)도 같은 규칙이다.
   ⛔ 「승인」과 「대기」를 합치지 않는다 — 대기는 아직 안 쓴 돈이다.
   ⛔ 모르는 것을 0으로 그리지 않는다 — 「금액 없음 N건」·「항목 없음 N건」으로 적는다.
   ══════════════════════════════════════════════════════════════════════════ */
var REP = null, REP_BUSY = false;

window.toggleRep = function(){
  var box = document.getElementById('repPanel');
  var btn = document.getElementById('repBtn');
  if (!box) return;
  var open = box.hidden;
  box.hidden = !open;
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) {
    paintRepChrome();
    if (!REP) runRep();                  // 처음 열 때 한 번만 부른다
  }
};

function paintRepChrome(){
  var sc = document.getElementById('rscope');
  if (!sc) return;
  var scopes = [['mine', T('My requests', '내가 올린 것')]];
  // 결재자에게만 «전체» — 서버도 같은 판정으로 403 을 준다.
  if (D && D.can_approve) scopes.push(['all', T('Everything', '전체')]);
  var had = sc.value;                       // 사람이 이미 고른 값은 건드리지 않는다
  fillSel(sc, scopes);
  /* 🔴 맨 위 타일과 «같은 말» 을 하게 한다 — 타일이 «전체» 인 사람(경영진)에게
     아래 표가 «내가 올린 것» 으로 열리면 한 화면에서 두 숫자가 다르게 보인다.
     ⛔ 결재자 전원에게 «전체» 를 기본으로 주지는 않는다 — 그 사람들의 «전체» 는
        canView 로 걸러진 값이라 타일(경영진 전용 합계)과 애초에 다른 수다. */
  var wantAll = !!(D && D.summary && D.summary.money_scope === 'all');
  if (!had && wantAll && D && D.can_approve) sc.value = 'all';
  else if (had) sc.value = had;
}

/** 기본 기간은 «이번 달 1일부터» — 비워 두면 전 기간이라 「이번 달 얼마」에 답을 못 한다. */
function repDefaults(){
  var f = document.getElementById('rfrom');
  if (f && !f.value) {
    var n = new Date(Date.now() + 9 * 3600000);   // KST
    f.value = n.getUTCFullYear() + '-' + String(n.getUTCMonth() + 1).padStart(2, '0') + '-01';
  }
}

window.runRep = function(){
  if (REP_BUSY) return;
  var host = document.getElementById('repResult');
  if (!host) return;
  repDefaults();
  REP_BUSY = true;
  host.innerHTML = '<div class="findnote">' + esc(T('Adding up...', '더하는 중...')) + '</div>';

  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = ['view=report', 'scope=' + encodeURIComponent(g('rscope') || 'mine')];
  if (g('rfrom')) p.push('from=' + encodeURIComponent(g('rfrom')));
  if (g('rto'))   p.push('to=' + encodeURIComponent(g('rto')));

  fetch('/api/approval/requests?' + p.join('&'), { credentials: 'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      REP_BUSY = false;
      /* 「성공이라고 말했는가」로 판정한다 — 종단 404 본문에는 ok 칸이 아예 없어서
         `if (d.ok === false)` 는 그냥 통과하고 빈 화면이 «정상» 으로 보인다(CLAUDE.md 2장). */
      if (!d || d.ok !== true || !d.summary) {
        host.innerHTML = '<div class="findnote">' +
          esc(T('Could not add it up. Please try again.', '더하지 못했습니다. 다시 눌러 주세요.')) + '</div>';
        return;
      }
      REP = d;
      paintRep();
    })
    .catch(function(){
      REP_BUSY = false;
      host.innerHTML = '<div class="findnote">' +
        esc(T('Network problem. Please try again.', '연결이 좋지 않습니다. 다시 눌러 주세요.')) + '</div>';
    });
};

/** 통화별 금액을 «한 줄» 로. ⛔ 절대 더해서 하나로 만들지 않는다. */
function repMoney(list){
  if (!list || !list.length) return '—';
  var out = [];
  for (var i = 0; i < list.length; i++) {
    if (!list[i].total) continue;
    out.push(money(list[i].total, list[i].currency));
  }
  return out.length ? out.join('  ·  ') : '—';
}

function paintRep(){
  var host = document.getElementById('repResult');
  if (!host || !REP) return;
  var s = REP.summary;

  if (!s.counted) {
    host.innerHTML = '<div class="findnote">' +
      esc(T('No requests in this period.', '이 기간에 올라온 결재가 없습니다.')) + '</div>';
    return;
  }

  var h = '';

  /* ① 확정된 돈 · 아직 아닌 돈 — 갈라서 적는다 */
  h += '<div class="repcards">';
  h += '<div class="repcard"><div class="rl">' +
       esc(T('Approved', '승인 — 쓰기로 확정')) + '</div><div class="rv">' +
       esc(repMoney(s.approved_money)) + '</div><div class="rn">' +
       esc(EN() ? (s.by_status.approved + ' requests') : (s.by_status.approved + '건')) + '</div></div>';
  h += '<div class="repcard"><div class="rl">' +
       esc(T('Waiting', '대기 — 아직 아닌 돈')) + '</div><div class="rv">' +
       esc(repMoney(s.pending_money)) + '</div><div class="rn">' +
       esc(EN() ? (s.by_status.pending + ' requests') : (s.by_status.pending + '건')) + '</div></div>';
  h += '</div>';

  /* ② 항목별 */
  h += '<div class="repsec">' + esc(T('By item', '지출 항목별')) + '</div>';
  if (!s.by_category.length) {
    h += '<div class="findnote">' +
         esc(T('No spending requests in this period.', '이 기간에 지출·물품 결재가 없습니다.')) + '</div>';
  } else {
    h += '<table class="reptbl"><tbody>';
    for (var i = 0; i < s.by_category.length; i++) {
      var c = s.by_category[i];
      var nm = c.key ? (EN() ? c.en : c.ko) : T('No item picked', '항목 없음');
      h += '<tr' + (c.key ? '' : ' class="dim"') + '><td class="rc">' + esc(nm) +
           (c.account ? '<span class="racct">' + esc(c.account) + '</span>' : '') + '</td>' +
           '<td class="rq">' + esc(EN() ? (c.count + '') : (c.count + '건')) + '</td>' +
           '<td class="rm">' + esc(repMoney(c.money)) + '</td></tr>';
    }
    h += '</tbody></table>';
  }

  /* ③ 달별 (승인만) */
  if (s.by_month.length) {
    h += '<div class="repsec">' + esc(T('By month (approved)', '달별 (승인된 것)')) + '</div>';
    h += '<table class="reptbl"><tbody>';
    for (var j = 0; j < s.by_month.length; j++) {
      var m = s.by_month[j];
      h += '<tr><td class="rc">' + esc(m.month) + '</td>' +
           '<td class="rq">' + esc(EN() ? (m.count + '') : (m.count + '건')) + '</td>' +
           '<td class="rm">' + esc(repMoney(m.money)) + '</td></tr>';
    }
    h += '</tbody></table>';
    /* 🔴 기간은 «올린 날» 로 자르는데 달 묶음은 «지출일» 을 먼저 봅니다 — 두 축이 다릅니다.
       그래서 이달 1일~ 로 열어도 지난달 줄이 나올 수 있고, 지난달에 올린 이달 지출은 빠집니다.
       ⛔ 감추지 말고 그 표 «옆» 에서 말합니다. 축을 맞추는 것은 buildFindQuery 를
          바꾸는 일이라 별건입니다.
       ⛔ 이 줄을 「말하지 않는 것」 상자에 넣지 마세요 — 그 상자는 «이번 기간에 빈 곳» 을
          적는 자리라, 늘 있는 사실을 넣으면 상자가 언제나 떠서 아무도 안 읽게 됩니다. */
    h += '<div class="repnote">' + esc(EN()
      ? 'Period is filtered by the date submitted; months use the date spent when it is filled in.'
      : '기간은 «올린 날» 로 자르고, 달은 지출일이 있으면 그것으로 잡습니다.') + '</div>';
  }

  /* ④ 🔴 화면이 «모르는 것» 을 말한다 — 이것이 이 화면의 핵심이다.
        숫자만 보여 주고 「무엇이 안 채워졌는지」를 감추면 그 합계가 거짓이 된다. */
  var gaps = [];
  if (s.no_category) gaps.push(EN()
    ? (s.no_category + ' spending request(s) have no item — they are counted under "No item".')
    : ('지출·물품 ' + s.no_category + '건에 항목이 없습니다 — 위 「항목 없음」 줄이 그것입니다.'));
  if (s.no_amount) gaps.push(EN()
    ? (s.no_amount + ' have no amount — they are counted in the request count but not in the total.')
    : ('금액이 없는 건이 ' + s.no_amount + '건 있습니다 — 건수에는 들어가고 합계에는 안 들어갑니다.'));
  if (s.no_file) gaps.push(EN()
    ? (s.no_file + ' need a receipt but have none.')
    : ('영수증이 필요한데 없는 건이 ' + s.no_file + '건 있습니다.'));
  if (s.dated_by_created) gaps.push(EN()
    ? (s.dated_by_created + ' had no "date spent", so the month is when it was submitted.')
    : ('지출일이 없어 «올린 날» 로 달을 잡은 건이 ' + s.dated_by_created + '건 있습니다.'));
  if (REP.truncated) gaps.push(EN()
    ? ('Only the first ' + REP.max + ' requests were counted. Narrow the period.')
    : ('앞 ' + REP.max + '건만 셌습니다. 기간을 좁혀 주세요.'));
  /* 엑셀은 500건까지라 그보다 많으면 화면 합계와 파일이 어긋납니다. */
  if (REP.csv_max && s.counted > REP.csv_max) gaps.push(EN()
    ? ('The Excel file holds only ' + REP.csv_max + ' rows, so it will not match this total.')
    : ('엑셀은 ' + REP.csv_max + '건까지만 담기므로 이 합계와 어긋납니다.'));
  /* 결재선을 하나도 못 읽으면 chain 열람 건이 조용히 빠져 총액이 줄어듭니다. */
  if (REP.steps_missing) gaps.push(EN()
    ? 'Approval steps could not be read, so some requests may be missing from this total.'
    : '결재 단계를 읽지 못해 일부 건이 이 합계에서 빠졌을 수 있습니다.');

  if (gaps.length) {
    h += '<div class="repgap"><b>' + esc(T('What this total does not include',
                                           '이 합계가 말하지 않는 것')) + '</b>';
    for (var k = 0; k < gaps.length; k++) h += '<div>· ' + esc(gaps[k]) + '</div>';
    h += '</div>';
  }

  /* ⑤ 같은 조건으로 엑셀 — 회계와 대조할 때 쓴다 */
  var gg = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var cp = ['scope=' + encodeURIComponent(gg('rscope') || 'mine')];
  if (gg('rfrom')) cp.push('from=' + encodeURIComponent(gg('rfrom')));
  if (gg('rto'))   cp.push('to=' + encodeURIComponent(gg('rto')));
  h += '<div class="findrow" style="margin-top:10px">' +
       '<button type="button" class="findcsv" onclick="repCsv()">' +
       esc(T('Excel (same period)', '엑셀 내려받기 (같은 기간)')) + '</button></div>';

  host.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════
   🧭 맨 위 요약 (D안) — 「아침에 30초」

   ⚠️ 여기 숫자는 **이미 받은 /api/approval/home 안에** 있다. 따로 부르지 않는다
      (이 화면은 첫 화면 API 한 번 설계다).
   ⛔ 손봐야 할 것이 없으면 경고 줄을 그리지 않는다 — 늘 뜨는 경고는 아무도 안 읽는다.
   ⛔ 통화를 합치지 않는다(지출 정리와 같은 규칙 — repMoney 를 그대로 쓴다).
   ══════════════════════════════════════════════════════════════════════════ */

/** 지금 손봐야 할 내 건 — 멈춘 것 먼저, 그다음 지연. */
function topStuckItems(){
  var out = [];
  var mine = (D && D.mine) || [];
  for (var i = 0; i < mine.length; i++) {
    var r = mine[i];
    if (r.status !== 'pending') continue;
    if (r.blocked) out.push({ r: r, why: 'blocked' });
    else if (isOverdue(r)) out.push({ r: r, why: 'late' });
  }
  // 멈춘 것이 먼저 — 지연은 기다리면 풀리지만 멈춘 것은 안 풀린다
  out.sort(function(a, b){ return (a.why === 'blocked' ? 0 : 1) - (b.why === 'blocked' ? 0 : 1); });
  return out;
}

function paintTop(){
  var stopHost = document.getElementById('topStop');
  var tileHost = document.getElementById('topTiles');
  if (!stopHost || !tileHost || !D) return;

  var sm = D.summary || null;
  var stuck = topStuckItems();

  /* ── ① 손봐야 할 것 ─────────────────────────────────────────────────── */
  if (!stuck.length) {
    stopHost.innerHTML = '';
  } else {
    var nBlocked = stuck.filter(function(x){ return x.why === 'blocked'; }).length;
    var first = stuck[0];
    var h = '<div class="topstop"><b>' +
      esc(EN() ? ('Needs your attention — ' + stuck.length + (stuck.length === 1 ? ' request' : ' requests'))
               : ('손봐야 할 것 ' + stuck.length + '건')) + '</b>';
    h += '<div>' + esc('“' + String(first.r.title || '').slice(0, 60) + '”') + ' — ' +
      esc(first.why === 'blocked'
        ? T('cannot be processed as it is: nobody can approve this step right now.',
            '이대로는 처리되지 않습니다 — 지금 이 단계를 결재할 수 있는 사람이 없습니다.')
        : T('is past its due time.', '마감이 지났습니다.')) + '</div>';
    if (stuck.length > 1) {
      h += '<div>' + esc(EN() ? ((stuck.length - 1) + ' more below.')
                              : ('나머지 ' + (stuck.length - 1) + '건은 아래 목록에 있습니다.')) + '</div>';
    }
    h += '<button type="button" class="ts-go" onclick="topGo(' + Number(first.r.id) + ')">' +
         esc(T('Show it', '그 건 보기')) + '</button>';
    h += '</div>';
    stopHost.innerHTML = h;
  }

  /* 🔴 「창 밖은 못 봤다」는 **경고 상자 밖**에 둔다.
     ⛔ 상자 «안» 에 두면, 창 안에 멈춘 건이 없을 때 상자가 통째로 안 그려져 그 말까지
        함께 사라진다 — 정작 그때가 알려야 할 때다(화면에는 「손볼 것 없음」처럼 보이는데
        창 밖에 있을 수 있다). mine 은 created_at DESC 라 **오래 멈춘 건일수록 밀려난다.**
     ⚠️ 비교는 «진행 중인 것 중 화면에 있는 수»(my_open_shown)로 한다 —
        mine.length 는 상태를 안 가리는 최근 15건이라 my_open 과 모집단이 다르다. */
  var seen = (sm && typeof sm.my_open_shown === 'number') ? sm.my_open_shown : null;
  if (sm && seen != null && sm.my_open > seen) {
    stopHost.innerHTML += '<div class="repnote">' + esc(EN()
      ? ('Checked ' + seen + ' of your ' + sm.my_open + ' open requests — the rest are outside this list.')
      : ('진행 중 ' + sm.my_open + '건 가운데 ' + seen + '건만 살펴본 것입니다 — 나머지는 이 목록 밖에 있습니다.'))
      + '</div>';
  }
  /* 조회가 실패했으면 «0건» 이 아니라 «모른다» 고 적는다. */
  if (sm && (sm.money_unknown || sm.open_unknown)) {
    stopHost.innerHTML += '<div class="repnote">' + esc(
      T('Could not read some of these numbers — they may be missing.',
        '아래 숫자 가운데 일부를 읽지 못했습니다 — 빠진 것이 있을 수 있습니다.')) + '</div>';
  }

  /* ── ② 타일 넷 ──────────────────────────────────────────────────────── */
  var t = '';
  var tile = function(cls, label, value, note, onclick){
    return '<button type="button" class="tile' + (cls ? ' ' + cls : '') + '"' +
           (onclick ? (' onclick="' + onclick + '"') : ' disabled') + '>' +
           '<span class="tl">' + esc(label) + '</span>' +
           '<span class="tv">' + esc(value) + '</span>' +
           (note ? '<span class="tn">' + esc(note) + '</span>' : '') + '</button>';
  };

  var inboxN = (D.inbox || []).length;
  /* ⚠️ 결재함은 20건에서 자른다(서버 inbox 루프) — 정확한 수처럼 보이지 않게 «+» 를 붙인다. */
  var inboxCap = !!(sm && sm.inbox_capped);
  t += tile(inboxN ? 'hot' : '', T('Waiting for me', '내가 결재할 것'),
            (EN() ? String(inboxN) : (inboxN + '건')) + (inboxCap ? '+' : ''),
            inboxN ? (inboxCap ? T('at least this many', '적어도 이만큼') : '')
                   : T('nothing to decide', '지금은 없습니다'),
            'topScroll(\'inbox\')');

  /* ⛔ 못 읽었으면 «0건» 이 아니라 «—» 다. */
  var openN = (sm && !sm.open_unknown) ? sm.my_open : null;
  t += tile(stuck.length ? 'hot' : '', T('My requests in progress', '내가 올린 것 · 진행 중'),
            openN == null ? '—' : (EN() ? String(openN) : (openN + '건')),
            openN == null ? T('could not read', '읽지 못했습니다')
              : (stuck.length ? (EN() ? (stuck.length + ' need attention')
                                      : ('그중 손볼 것 ' + stuck.length + '건'))
                              : ''),
            'topScroll(\'mine\')');

  /* 💰 금액 타일 — «어느 범위인지» 를 반드시 함께 적는다.
     경영진은 전체, 그 밖은 내가 올린 것이라 같은 타일에서 다른 숫자를 본다. */
  if (sm && sm.money_unknown) {
    /* ⛔ 「전체 · 0건 승인」이라고 적지 않는다 — 못 읽은 것과 0건은 다른 사실이다. */
    t += tile('', T('Approved this month', '이번 달 승인'), '—', T('could not read', '읽지 못했습니다'), '');
    t += tile('', T('Approved this year', '올해 누적'), '—', T('could not read', '읽지 못했습니다'), '');
  } else if (sm && sm.money) {
    var scopeNote = (sm.money_scope === 'all') ? T('everyone', '전체')
                                               : T('my requests', '내가 올린 것');
    var mm = repMoney(sm.money.month), yy = repMoney(sm.money.year);
    var mNote = scopeNote + ' · ' + (EN() ? (sm.money.month_count + ' approved')
                                          : (sm.money.month_count + '건 승인'));
    /* 금액 없는 승인은 «0원» 이 아니다 — 그렇게 적어 준다. */
    if (sm.money.month_no_amount) {
      mNote += ' · ' + (EN() ? (sm.money.month_no_amount + ' with no amount')
                             : ('금액 없음 ' + sm.money.month_no_amount + '건'));
    }
    var yNote = scopeNote + ' · ' + (EN() ? (sm.money.year_count + ' approved')
                                          : (sm.money.year_count + '건 승인'));
    if (sm.money.year_no_amount) {
      yNote += ' · ' + (EN() ? (sm.money.year_no_amount + ' with no amount')
                             : ('금액 없음 ' + sm.money.year_no_amount + '건'));
    }
    t += tile('', T('Approved this month', '이번 달 승인'), mm, mNote, 'topSpending()');
    t += tile('', T('Approved this year', '올해 누적'), yy, yNote, 'topSpending()');
  }

  /* 🗂 결재 보관함(시안 A) — 다섯째 카드. 「올해 몇 건 · 마지막 결재가 언제·누구」.
     범위는 금액 타일과 같다(서버가 같은 판정) — 카드에 그것을 적어 준다.
     ⛔ 못 읽었으면 «0건» 이 아니라 «—». */
  var ar = sm && sm.archive;
  if (ar) {
    var arScope = (sm.money_scope === 'all') ? T('everyone', '전체') : T('my requests', '내가 올린 것');
    var arVal = (ar.year_count == null) ? '—' : (EN() ? String(ar.year_count) : (ar.year_count + '건'));
    var arNote = arScope + ' · ' + (EN() ? 'this year' : '올해');
    if (ar.last_decided_at) {
      var ld = new Date(Number(ar.last_decided_at) + 9 * 3600 * 1000);
      var who = ar.last_decided_by_name || ar.last_decided_by || '';
      arNote += ' · ' + (EN() ? 'last decision ' : '마지막 결재 ') +
                (ld.getUTCMonth() + 1) + '/' + ld.getUTCDate() + (who ? (' ' + who) : '');
    }
    if (ar.unknown) arNote = T('could not read', '읽지 못했습니다');
    t += tile('arch', T('Archive', '결재 보관함'), arVal, arNote + ' · ' + T('open', '열기 →'), 'topArchive()');
  }
  tileHost.innerHTML = t;
}

/** 그 건으로 데려간다 — 목록에 있으면 그 줄로, 없으면 문서함에서 찾게 한다. */
window.topGo = function(id){
  var el = document.getElementById('req-' + id);
  if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } return; }
  /* 최근 15건 밖이면 화면에 그 줄이 없다 — 「눌러도 아무 일도 안 일어남」이 되지 않게
     문서함을 열어 준다.
     ⚠️ 2026-09-07 부터 문서함은 이미 펼쳐져 있다 — 그래서 «여는 것» 만으로는 화면에
        아무 변화가 없다. 그 자리까지 **데려다 놓는다**(접어 둔 사람은 먼저 펴 준다). */
  var box = document.getElementById('findPanel');
  if (box && box.hidden && window.toggleFind) window.toggleFind();
  if (box) { try { box.scrollIntoView({ block: 'start' }); } catch (e) { box.scrollIntoView(); } }
  toast(T('Find it in the document box below.', '아래 문서함에서 찾아 주세요.'));
};

window.topScroll = function(which){
  var el = document.getElementById(which);
  if (el) { try { el.scrollIntoView({ block: 'start' }); } catch (e) { el.scrollIntoView(); } }
};

/** 금액 타일 → 지출 정리를 열고 그리로. */
window.topSpending = function(){
  var box = document.getElementById('repPanel');
  if (box && box.hidden && window.toggleRep) window.toggleRep();
  var el = document.getElementById('repBtn');
  if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } }
};

window.repCsv = function(){
  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = ['scope=' + encodeURIComponent(g('rscope') || 'mine'), 'format=csv'];
  if (g('rfrom')) p.push('from=' + encodeURIComponent(g('rfrom')));
  if (g('rto'))   p.push('to=' + encodeURIComponent(g('rto')));
  location.href = '/api/approval/requests?' + p.join('&');
};

/* ⚠️ 세 번째 인자 ackable — «확인할 것» 구역에서만 true. 옛 호출부는 인자 두 개라
      undefined 가 들어가 예전과 똑같이 동작한다(버튼이 안 그려진다). */
function itemHtml(r, decidable, ackable){
  var late = isOverdue(r);
  // 🧭 «멈춤» — 서버가 결재 가능자 0명이라고 알려 준 내 건. 지연과 다른 사실이라 따로 센다.
  var stop = !decidable && isMine(r) && !!r.blocked;
  var h = '<div class="item' + ((late || stop) ? ' hot' : '') + '" id="req-' + r.id + '">';

  h += '<div class="ihead">';
  h += '<span class="chip">' + esc(typeLabel(r)) + '</span>';
  /* 🏷️ 지출 항목 — «무슨 돈이었나» 를 목록에서 바로 보이게. 없으면 아무것도 안 그린다
     (「항목 없음」이라고 적으면 안 고른 것이 «고장» 처럼 보인다). */
  var catL = EN() ? r.category_en : r.category_ko;
  if (catL) h += '<span class="chip">' + esc(catL) + '</span>';
  if (r.stage_total > 1) {
    h += '<span class="chip">' + esc(T('Step ', '단계 ') + r.stage_seq + '/' + r.stage_total) + '</span>';
  }
  if (late) h += '<span class="chip late">' + esc(T('Overdue', '지연')) + '</span>';
  if (stop) h += '<span class="chip late">' + esc(T('Stopped', '멈춤')) + '</span>';
  if (r.escalated) h += '<span class="chip late">' + esc(T('Escalated', '승격됨')) + '</span>';
  h += '<span class="ititle">' + esc(r.title) + '</span>';
  if (r.amount != null) h += '<span class="iamt">' + esc(money(r.amount, r.currency)) + '</span>';
  h += '</div>';

  h += '<div class="imeta">' + esc(r.requester_name || r.requester_username) +
       ' &middot; ' + esc(when(r.created_at));
  if (!decidable) {
    /* 상태 이름은 **서버가 준 것**(status_ko/en)을 쓴다 — 상태가 늘 때 화면만
       모르는 채로 「대기 중」이라고 거짓말하지 않게. 없으면 옛 응답이므로 손으로. */
    var st = (EN() ? r.status_en : r.status_ko)
           || (r.status === 'approved' ? T('Approved', '승인됨')
             : r.status === 'rejected' ? T('Rejected', '반려됨')
             : T('Waiting', '대기 중'));
    // 「대기 중」만으로는 며칠이 지났는지 알 수 없다. 숫자를 함께 적는다.
    if (r.status === 'pending') {
      var dw = daysWaiting(r);
      st += ' · ' + (dw <= 0 ? T('today', '오늘')
                             : (EN() ? (dw + (dw === 1 ? ' day' : ' days')) : (dw + '일째')));
    }
    h += ' &middot; ' + esc(st);
  }
  h += '</div>';

  // 🏖️ 휴가는 «언제부터 언제까지» 가 결재의 핵심이다. 요약보다 위에 둔다.
  if (r.date_from) {
    var span = r.date_from + (r.date_to && r.date_to !== r.date_from ? (' ~ ' + r.date_to) : '');
    h += '<div class="isum"><b>' + esc(T('Days off: ', '휴가 기간: ') + span) + '</b></div>';
  }

  var sum = EN() ? r.summary_en : r.summary_ko;
  if (sum) h += '<div class="isum">' + esc(sum) + '</div>';
  else if (r.body) h += '<div class="isum">' + esc(String(r.body).slice(0, 240)) + '</div>';

  if (r.flags && r.flags.length) {
    h += '<div class="flags">';
    for (var i = 0; i < r.flags.length; i++) {
      var f = r.flags[i];
      h += '<div class="flag' + (f.level === 'info' ? ' info' : '') + '">' + esc(EN() ? f.en : f.ko) + '</div>';
    }
    h += '</div>';
  }

  if (r.has_file) {
    h += '<div><a class="lnk" href="/api/approval/requests/' + r.id + '/file">' +
         esc(T('Receipt', '첨부 보기')) + (r.file_name ? ' (' + esc(r.file_name) + ')' : '') + '</a></div>';
  }

  /* 🧭 내가 올린 건은 진행바로 — 「지금 누구 차례이고, 왜 안 움직이는가」가 한눈에 보여야 한다.
     결재함(내가 눌러야 할 것)에는 버튼이 더 중요하므로 예전처럼 한 줄 요약만 남긴다. */
  if (!decidable && isMine(r)) {
    h += trackHtml(r);
    if (stop) h += stuckHtml(r);
  } else if (r.steps && r.steps.length > 1) {
    var parts = [];
    for (var k = 0; k < r.steps.length; k++) {
      var s = r.steps[k];
      var lbl = roleLabel(s.role);   // ⛔ 라벨을 여기 다시 적지 말 것(roleLabel 이 정본)
      var mark = s.status === 'approved' ? 'OK' : s.status === 'rejected' ? 'X'
               : s.status === 'skipped' ? T('skipped', '전결') : s.status === 'active' ? '...' : '-';
      parts.push(lbl + ' ' + mark);
    }
    h += '<div class="steps">' + esc(parts.join('  >  ')) + '</div>';
  }

  if (r.decide_memo) {
    h += '<div class="steps">' + esc(T('Note: ', '메모: ') + r.decide_memo) + '</div>';
  }

  /* ↩️ 회수하고 «다시 올린» 건 — 「오늘 올린 새 건」처럼 보이면 안 된다.
     지연을 감추지 않으려고 원래 올린 날을 함께 적는다. */
  if (r.origin_id && r.origin_created_at) {
    h += '<div class="steps">' + esc(
      T('Re-submitted (originally ', '다시 올림 (원래 ') + when(r.origin_created_at) +
      T(', #', ', #') + r.origin_id + ')') + '</div>';
  }
  // 🔁 취소 결재 — «무엇을 없애려는 건인지» 를 카드가 말한다.
  if (r.reverses_id) {
    h += '<div class="steps">' + esc(T('Cancels approved #', '승인된 #') + r.reverses_id +
      T('', ' 을(를) 취소하려는 결재')) + '</div>';
  }
  if (r.cancelled_by_id) {
    h += '<div class="steps">' + esc(T('Cancelled by #', '취소 결재 #') + r.cancelled_by_id +
      T('', ' 로 취소됨')) + '</div>';
  }

  /* ↩️🔁 내가 올린 건에만 손댈 수 있는 것들.
       ① 회수 — 아직 아무도 결재를 안 눌렀을 때만(서버가 다시 확인한다)
       ② 다시 올리기 — 회수된 건의 내용을 그대로 채워 준다(= 「수정」을 대신한다)
       ③ 취소 요청 — 승인된 건은 지우지 않고 «취소 결재» 를 새로 올린다
     ⛔ 여기서 «되는지» 를 최종 판정하지 않는다. 화면은 안 보여 줄 뿐이고,
        주소로 직접 부르면 서버가 막는다(canWithdraw · canReverse). */
  if (!decidable && isMine(r)) {
    var acts = '';
    if (r.status === 'pending' && !anyDecided(r)) {
      acts += '<button class="mini" onclick="askWithdraw(' + r.id + ')">' +
              esc(T('Withdraw', '회수')) + '</button>';
    }
    if (r.status === 'withdrawn') {
      acts += '<button class="mini" onclick="reSubmit(' + r.id + ')">' +
              esc(T('Submit again with this content', '이 내용으로 다시 올리기')) + '</button>';
      /* 🗑️ 「없었던 것으로」 — 회수된 건만. 아무도 결재 도장을 안 찍은 상태라
         지워도 잃을 기록이 없다. ⛔ 승인·반려 건에는 안 그린다(서버도 거절한다).
         ⛔ 이어받아 다시 올린 결재가 있으면(has_child) 버튼을 안 그린다 — 「되돌릴 수 없다」
            고 말해 놓고 서버가 거절하는 흐름이 되면 안 된다(서버는 그래도 막는다). */
      if (r.has_child) {
        acts += '<span class="mineacts-note">' +
                esc(T('Cannot be deleted — a re-submitted request uses this date.',
                      '이어받아 다시 올린 결재가 있어 지울 수 없습니다.')) + '</span>';
      } else {
        acts += '<button class="mini danger" onclick="askDelete(' + r.id + ')">' +
                esc(T('Delete', '삭제')) + '</button>';
      }
    }
    if (r.status === 'approved' && !r.cancelled_by_id) {
      acts += '<button class="mini" onclick="askReverse(' + r.id + ')">' +
              esc(T('Request cancellation', '취소 요청')) + '</button>';
    }
    if (acts) h += '<div class="mineacts">' + acts + '</div><div id="act-' + r.id + '"></div>';
  }

  /* ✅ 확인 — 결재가 아니다. 상태를 바꾸지 않고 «봤다»는 도장만 찍는다. */
  if (ackable) {
    h += '<div class="acts">' +
         '<button class="big ok" onclick="ackOne(' + r.id + ')">' + esc(T('Confirm', '확인')) + '</button>' +
         '</div><div id="ack-' + r.id + '"></div>';
  }

  /* 💳 「대신 결재」를 **접어 둔** 상태 — 서버가 «내가 주 결재자가 아니다»(by_proxy)라고
     알려 준 단계다. 돈 나가는 건의 'mgr'(결재권자) 단계를 경영진이 보고 있을 때만 참이다.

     ⛔ 승인·반려 버튼을 «바로» 그리지 않는다 — 2026-09-10 사장님 지시
        「₱5,000 미만은 장 부장님만 결재하고 저는 확인만」. 버튼이 그대로 보이면 소액 건이
        대표님 결재함에서 «내가 눌러야 할 일» 로 읽힌다. 묶음 승인도 같은 이유로 뺀다(cleanOnes).
     ⛔ 그렇다고 목록에서 통째로 빼지는 않는다 — 결재권자가 휴가·출장이면 그 건이 그대로
        멈춘다(8/30 긴급 건이 그렇게 5일 서 있었다). 한 번 더 눌러 펼치면 예전과 같다.
     ⛔ 화면이 스스로 판정하지 않는다(계정 명단도 결재 규칙도 모른다) — 서버 by_proxy 하나만 본다. */
  if (decidable && r.by_proxy && !PROXY_OPEN[r.id]) {
    /* 🔴 «그다음이 무엇인가» 를 말해야 한다 — 큰돈(₱5,000 이상) 건도 1단계는 결재권자라
       여기로 옵니다. 그 건은 대표님이 **2단계를 직접 결재**하셔야 하고 「확인」은 영영 안
       뜹니다(needsExecAck 는 `decided_by === me` 면 false). 그래서 한 문장으로 뭉치면
       하필 사장님 지시의 그 부류에 **정반대 말**을 하게 됩니다(2026-09-10 함정 대조가 잡음).
       ⛔ 금액 기준(TWO_STEP_THRESHOLD)을 화면에 베끼지 말 것 — 서버가 이미 실어 보낸
          «남은 단계»(steps·stage_total)로만 가른다. 규칙이 바뀌어도 저절로 따라온다.
       ⚠️ 뒤에 단계가 남았는데 그 역할을 모르면 **지어내지 않는다**(가운데 갈래). */
    var mgrLater = (r.steps || []).filter(function(s){
      return Number(s.seq) > Number(r.stage_seq || 1);
    });
    var mgrLaterExec = false;
    for (var mi = 0; mi < mgrLater.length; mi++) {
      if (String(mgrLater[mi].role) === 'exec') { mgrLaterExec = true; break; }
    }
    var mgrMoreAfter = mgrLater.length > 0 ||
                       Number(r.stage_total || 1) > Number(r.stage_seq || 1);
    h += '<div class="steps proxynote">' + esc(
      mgrLaterExec
        ? T('The approver decides this stage — you decide the next one yourself.',
            '이 단계는 결재권자가 결재합니다. 그다음 단계는 대표님이 직접 결재하십니다.')
        : mgrMoreAfter
          ? T('The approver decides this stage — another stage follows.',
              '이 단계는 결재권자가 결재합니다. 이 뒤에 결재 단계가 더 있습니다.')
          : T('The approver decides this one. You only confirm it after it is approved.',
              '이 단계는 결재권자가 결재합니다. 대표님은 승인된 뒤 「확인」만 하시면 됩니다.')) + '</div>';
    h += '<div class="acts">' +
         '<button class="mini" onclick="proxyOpen(' + r.id + ')">' +
         esc(T('Decide on their behalf', '대신 결재하기')) + '</button>' +
         '</div>';
  } else if (decidable) {
    /* 💳 펼친 「대신 결재」 — 자리를 비운 결재권자를 대신해 누르는 자리. */
    if (r.by_proxy) {
      h += '<div class="steps">' + esc(
        T('The approver normally decides this one. You can decide on their behalf.',
          '이 단계는 결재권자가 결재합니다. 자리를 비웠다면 대신 결재하실 수 있습니다.')) + '</div>';
    }
    /* 🖐 앞 단계를 내가 결재한 건 — 서버가 승인을 막는다(sameDeciderBlocked).
       «승인» 버튼을 안 그리고 이유를 적는다. 안 그리면 눌렀다가 403 을 보게 되고,
       묶음 승인에서는 조용히 빠져 건수만 줄어든다.
       ⛔ 「반려」는 남긴다 — 돈이 나가지 않는 방향이라 서버도 막지 않는다.
       ⛔ 화면이 스스로 판정하지 않는다(결재 규칙도 계정 명단도 모른다). */
    if (r.same_decider) {
      h += '<div class="steps">' + esc(
        T('You approved an earlier stage — a different approver must decide this stage.',
          '앞 단계를 결재하셔서 이 단계는 다른 결재자가 눌러야 합니다.')) + '</div>';
    }
    h += '<div class="acts">' +
         (r.same_decider ? '' :
           '<button class="big ok" onclick="decide(' + r.id + ',\'approved\')">' + esc(T('Approve', '승인')) + '</button>') +
         '<button class="big no" onclick="askWhy(' + r.id + ')">' + esc(T('Reject', '반려')) + '</button>' +
         '</div><div id="why-' + r.id + '"></div>';
  }

  h += '</div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   묶어서 승인 — 점검을 모두 통과한 건만.

   왜 «모두» 가 아닌가 — 자동 점검(중복청구·예산초과·첨부누락·금액불일치)에 걸린 건은
   **사람이 봐야 하는 건**이다. 그걸 함께 쓸어 승인해 버리면 점검이 있으나 마나가 된다.
   그래서 경고가 하나도 없는 건만 묶는다. 경고가 붙은 건은 목록에 그대로 남는다.
   ══════════════════════════════════════════════════════════════════════════ */
function cleanOnes(){
  return (D.inbox || []).filter(function(r){
    if (isOverdue(r)) return false;                       // 늦은 건은 눈으로 한 번 보게 한다
    if (r.same_decider) return false;                     // 🖐 서버가 막는 건 — 묶으면 조용히 빠진다
    /* 💳 내가 «주» 결재자가 아닌 단계는 묶지 않는다 — 한 번 누르면 결재권자 몫까지 함께
       승인되어 「소액은 장 부장님만 결재」가 그 자리에서 무너진다(2026-09-10 사장님 지시).
       ⛔ 펼쳤는지(PROXY_OPEN)와 무관하게 뺀다 — 묶음 승인은 «건 하나» 를 보고 누르는
          버튼이 아니라 목록 전체를 쓰는 버튼이다. 대신 결재는 그 건의 버튼으로 한다. */
    if (r.by_proxy) return false;
    var f = r.flags || [];
    for (var i = 0; i < f.length; i++) if (f[i].level === 'warn') return false;
    return true;
  });
}
function paintBulk(){
  var host = document.getElementById('bulkBox');
  if (!host) return;
  var list = cleanOnes();
  if (list.length < 2) { host.innerHTML = ''; return; }
  host.innerHTML =
    '<div class="why"><b>' +
    esc(T(list.length + ' requests passed every check.', '점검을 모두 통과한 ' + list.length + '건이 있습니다.')) +
    '</b><div class="whybtns"><button onclick="bulkApprove()">' +
    esc(T('Approve all ' + list.length, list.length + '건 한 번에 승인')) +
    '</button></div></div>';
}
var bulkBusy = false;
window.bulkApprove = function(){
  if (bulkBusy) return;
  var list = cleanOnes();
  if (!list.length) return;
  if (!confirm(T('Approve these ' + list.length + ' requests?', '이 ' + list.length + '건을 모두 승인할까요?'))) return;
  bulkBusy = true;
  var i = 0, ok = 0;
  (function step(){
    if (i >= list.length) {
      bulkBusy = false;
      toast(T(ok + ' approved.', ok + '건을 승인했습니다.'));
      repaint();
      load().catch(function(){});
      return;
    }
    var r = list[i++];
    send(r.id, { decision: 'approved', memo: null }).then(function(res){
      if (res.done || res.queued) { ok++; removeLocal(r.id); }
      step();                        // 하나씩 순서대로 — 좁은 회선에서 한꺼번에 던지지 않는다
    });
  })();
};

/* 🔗 수업 연기·변경 요청 — 결재함이 «가져오지» 않는다.
   같은 «요청 → 승인» 구조를 두 벌 만들면 반드시 어긋나므로, 건수만 비춰 주고
   누르면 원래 처리 화면으로 보낸다. 데이터는 원래 자리에 그대로 둔다. */
function paintSchedule(){
  var host = document.getElementById('schedBox');
  if (!host) return;
  var n = Number(D.schedule_pending || 0);
  if (!n) { host.innerHTML = ''; return; }
  host.innerHTML = '<div class="why"><b>' +
    esc(T(n + ' class change request(s) are waiting in the schedule screen.',
          '수업 연기 · 변경 요청 ' + n + '건이 스케줄 화면에서 기다리고 있습니다.')) +
    '</b><div class="whybtns"><a class="tbtn" href="/manager">' +
    esc(T('Open schedule screen', '스케줄 화면 열기')) + '</a></div></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   부재중(대결) — 결재자가 휴가·출장이면 결재가 그대로 멈춘다.
   켜 두면 그 기간 동안 지정한 사람에게 알림이 함께 가고, 그 사람이 대신 결재할 수 있다.
   ══════════════════════════════════════════════════════════════════════════ */
function paintAway(){
  var btn = document.getElementById('awayBtn');
  var box = document.getElementById('awayBox');
  var can = D && D.colleagues && D.colleagues.length;
  if (btn) btn.hidden = !can;
  if (!box) return;
  if (D && D.my_delegate) {
    var who = D.my_delegate.delegate_to;
    var until = new Date(Number(D.my_delegate.until_at));
    box.innerHTML = '<div class="why"><b>' +
      esc(T('While you are away, ' + who + ' can decide for you (until ' + until.toLocaleDateString() + ').',
            '부재중입니다 — ' + until.toLocaleDateString() + '까지 ' + who + ' 님이 대신 결재합니다.')) +
      '</b><div class="whybtns"><button onclick="clearAway()">' +
      esc(T('I am back', '복귀 — 해제')) + '</button></div></div>';
  } else {
    box.innerHTML = '';
  }
}
window.openAway = function(){
  var box = document.getElementById('awayBox');
  if (!box || !D || !D.colleagues) return;
  if (box.getAttribute('data-open') === '1') { box.removeAttribute('data-open'); paintAway(); return; }
  var h = '<div class="why"><b>' +
    esc(T('Who should decide while you are away? (7 days)', '부재중에 누가 대신 결재할까요? (7일)')) +
    '</b><div class="whybtns">';
  for (var i = 0; i < D.colleagues.length; i++) {
    var c = D.colleagues[i];
    h += '<button onclick="setAway(' + JSON.stringify(c.username).replace(/"/g, '&quot;') + ')">' +
         esc(c.name) + '</button>';
  }

   ⛔ 인라인 onclick 이 부르므로 반드시 **window 에** 붙인다.

/** 이미 누가 결재를 눌렀는가 — 눌렀으면 회수 버튼을 아예 안 그린다.
    ⚠️ 최종 판정은 서버(canWithdraw)다. 여기는 «보여 줄지» 만 정한다. */
function anyDecided(r){
  var st = r.steps || [];
  for (var i = 0; i < st.length; i++) {
    if (st[i].status === 'approved' || st[i].status === 'rejected') return true;
  }
  return Number(r.stage_seq || 1) > 1;
}

/* ② 「수정」을 대신하는 자리 — 회수한 건의 내용을 폼에 그대로 채우고 원본을 가리켜 둔다.
   ⛔ 올라간 결재의 «내용을 고치는» 기능은 만들지 않는다. 결재는 그때 그 내용에
      도장을 찍는 기록이라, 결재 중에 내용이 바뀌면 결재자가 본 것과 승인한 것이 달라진다. */
/* 🔴 목록의 본문은 **300자로 잘려** 있다. 그 값을 그대로 채우면 «내용이 말없이 바뀌어»
   다시 올라간다 — ②는 「수정」을 대신하는 자리라 그게 제일 나쁘다.
   그래서 잘렸으면 **원문을 받아 온 뒤** 채운다. 못 받아 오면 **채우지 않는다**
   (잘린 채로 채우고 「채웠습니다」라고 말하는 쪽이 더 나쁘다). */
window.reSubmit = function(id){

  if (!r) { toast(T('Open it from the archive first.', '문서함에서 그 건을 먼저 열어 주세요.')); return; }
  if (!r.body_truncated) { doFill(r, id); return; }
  toast(T('Loading the full text...', '원문을 불러오는 중...'));
  fetch('/api/approval/requests/' + id, {
    credentials: 'same-origin', headers: { 'Accept': 'application/json' }
  })
  .then(function(res){ return res.json(); })
  .then(function(d){
    // «성공이라고 말했는가» 로 판정 — ok 칸이 없는 404 본문이 조용히 통과하지 않게.
    if (!d || d.ok !== true || !d.item) {
      toast(T('Could not load the full text — nothing was filled in.',
              '원문을 불러오지 못했습니다 — 아무것도 채우지 않았습니다.'));
      return;
    }
    doFill(d.item, id);
  })
  .catch(function(){
    toast(T('Could not load the full text — nothing was filled in.',
            '원문을 불러오지 못했습니다 — 아무것도 채우지 않았습니다.'));
  });
};

/* 채우고 «정말 채워졌을 때만» 그렇게 말한다.
   ⚠️ pick() 은 같은 분류로 폼이 이미 열려 있으면 **닫고 돌아간다** — 그때 「채웠습니다」가
      뜨면 거짓말이 된다(2026-09-05 함정 대조 지적). fillFormFrom 이 성공 여부를 돌려준다. */
function doFill(r, id){
