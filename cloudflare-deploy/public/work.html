<!-- 한자 글꼴 통일 — 화면마다 한자가 다른 모양으로 뜨는 것을 막는다(test-harness/hanzi_font_harness).
     unicode-range 가 한자 대역으로 제한돼 있어, 한자가 실제로 나올 때만 내려받는다.
     즉 한국어·영어만 쓰는 이 화면에서는 요청이 0건이라 «외부 리소스 0개» 계약과 충돌하지 않는다. -->
<style>@font-face{font-family:'MangoiHanSC';src:url('/fonts/mangoi-han-sc.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+2E80-2EFF,U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+0100-017F,U+01CD-01DC;}</style>
<title>Approvals · Mangoi</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════
  🧾 결재함 — 초경량 전용 화면  (2026-08-16)

  왜 만들었나 — 실측 근거
    결재 API(src/api-approval.ts)는 2026-08-05 부터 있었다. 그런데 결재함 UI 가
    **강사 화면 teacher.html(192KB) 안**에 들어 있었고, 강사는 정작 403 이라 못 본다.
    그리고 결재를 가장 많이 올리는 필리핀 매니저 전용 화면 manager.html(72KB)에는
    **결재 코드가 0줄**이었다(grep approval = 0).
      → 매니저는 결재 한 건 올리려고 자기 경량 화면을 나가서 10배 무거운 강사 화면을
        받아야 했다. 「경로가 복잡하다」는 지적의 실체가 이것이다.
    이 화면은 그 경로를 «로그인 → 여기» 한 걸음으로 만든다.

  ⚠️ 설계 계약 — manager.html · teacher.html 과 동일하다. 깨는 순간 존재 이유가 사라진다.
     1. 외부 리소스 0개. link·script src·웹폰트·CDN·아이콘팩 전부 금지.
     2. 애니메이션·transition 금지. 저사양 기기에서 렉이고, 백그라운드 탭에서 멈춰
        요소가 영영 안 보이는 사고가 난다(과거 실사고).
     3. 첫 화면은 API **1회**로 끝낸다(/api/approval/home 이 결재함 전체를 한 번에 준다).
        회선이 느린 필리핀에서 왕복 횟수가 곧 체감 속도다.
     4. 이모지 금지 — Win10·매니저 단말에서 두부(□)로 뜬다. 표시는 글자와 CSS 로만.
     5. 한/영은 사전 파일이 아니라 data-en/data-ko 속성으로. 기본은 영어(필리핀 다수).
        ⚠️ JS 로 그리는 라벨은 data-en/data-ko 도 같이 갱신해야 언어 전환이 안 깨진다
           (CLAUDE.md 함정 — textContent 대입은 i18n 루프가 못 고친다).
     6. 어두운 화면은 버튼으로만. 낮/밤 자동전환 금지(2026-07-18 사장님 요청).

  자동화 — 「사람은 판단만, 손가락은 클릭만」
     · 영수증 사진 → 서버가 금액·날짜·상점을 읽어 칸을 채운다. 사람은 «맞나» 보고 누른다.
     · 음성(영어) → 받아쓰기 → 제목·분류·금액 초안. 역시 고칠 수 있는 «초안»이다.
     · 반려 사유도 버튼 3개. 타이핑은 필요할 때만.
     ⚠️ 전부 실패해도 직접 입력 경로가 그대로 남는다 — 자동화는 «빠른 길»이지 «유일한 길»이 아니다.

  끊김 대응(필리핀 — 아픈 건 «느린 것»이 아니라 «끊기는 것»: 정전·태풍)
     · 마지막 목록을 기기에 저장해 두고 열자마자 먼저 그린다.
     · 승인·반려가 전송에 실패하면 큐에 담아 두고 연결되면 자동으로 다시 보낸다.
       서버가 «이미 결재됨(409)»을 주면 성공으로 친다 — 두 번 처리되지 않는다.
       (teacher.html 의 검증된 outbox 패턴을 그대로 가져왔다)

  세션: 기존 관리자와 동일한 HttpOnly 쿠키. 별도 로그인 없음.
  ══════════════════════════════════════════════════════════════════════════════
-->
<script>
/* 저장된 어두운 화면을 첫 그리기 «전»에 적용 — 깜빡임 방지. manager.html 과 같은 키를 쓴다. */
try{if(localStorage.getItem('mangoi_manager_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}
</script>

html.dark .trkS.now .trkB{box-shadow:0 0 0 4px #3a2c10}
.trkS.now .trkL{color:#7a5406;font-weight:600}
html.dark .trkS.now .trkL{color:#f0cf8a}
.trkS.no .trkB{background:#a4341f;border-color:#a4341f}
.trkS.no .trkL{color:#8e2b20;font-weight:600}
html.dark .trkS.no .trkL{color:#f0907c}
.trkS.stop .trkB{background:#a4341f;border-color:#a4341f;box-shadow:0 0 0 4px #f7dfdc}
html.dark .trkS.stop .trkB{box-shadow:0 0 0 4px #3a1a16}
.trkS.stop .trkL{color:#8e2b20;font-weight:700}
html.dark .trkS.stop .trkL{color:#f0907c}

/* 🔴 «기다려도 처리되지 않습니다» — 결재할 수 있는 사람이 0명일 때만 나온다.
   ⛔ «대기 중» 이라고만 적지 말 것. 그래서 5일을 그냥 기다린 건이 있었다(2026-08-30). */
.stuck{border:1px solid #a4341f;background:#f7dfdc;color:#7a2418;border-radius:7px;
       padding:9px 11px;margin-top:8px;font-size:13px;line-height:1.6}
html.dark .stuck{background:#3a1a16;border-color:#a4341f;color:#f0b6a8}
.stuck b{font-weight:700}

/* ── 결정 버튼 — 크게, 둘만 ─────────────────────────────── */
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.big{
  font:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;min-height:48px;flex:1;min-width:120px
}
.ok{background:#0b6e63;color:#fff}
.ok:hover{background:#095b52}
.no{background:#fff;color:#a4341f;border-color:#e0b6ad}
html.dark .no{background:#1d2836;border-color:#5a3129;color:#f0907c}
.no:hover{background:#f9ecea}
html.dark .no:hover{background:#3a1a16}
.lnk{font-size:13.5px;color:#0b6e63;text-decoration:underline;text-underline-offset:2px}
html.dark .lnk{color:#4fc0b0}

/* 반려 사유 — 버튼으로. 타이핑은 필요할 때만 */
.why{margin-top:9px;padding:10px;border:1px dashed #ccd4de;border-radius:8px}
html.dark .why{border-color:#33404f}
.why b{display:block;font-size:13px;margin-bottom:7px;color:#4a5765}
html.dark .why b{color:#9fb0c2}
.whybtns{display:flex;gap:6px;flex-wrap:wrap}
.whybtns button{font:inherit;font-size:13.5px;padding:9px 12px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:42px;color:#16202c}
html.dark .whybtns button{background:#1d2836;border-color:#33404f;color:#e6edf3}

/* ── 올리기 ─────────────────────────────────────────────── */
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.kind{
  font:inherit;font-size:15px;font-weight:650;padding:16px 10px;border-radius:9px;
  border:1px solid #ccd4de;background:#fff;cursor:pointer;min-height:58px;color:#16202c
}
html.dark .kind{background:#16202c;border-color:#33404f;color:#e6edf3}
.kind:hover{background:#eef2f6}
html.dark .kind:hover{background:#26313f}
.kind.on{background:#0b6e63;color:#fff;border-color:#0b6e63}

.form{background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:14px;margin-bottom:10px}
html.dark .form{background:#16202c;border-color:#26313f}
.row{margin-bottom:11px}
.row label{display:block;font-size:13px;font-weight:650;margin-bottom:4px;color:#4a5765}
html.dark .row label{color:#9fb0c2}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid #ccd4de;border-radius:7px;
  background:#fff;color:#16202c;min-height:46px
}
/* 고르는 칸도 입력칸과 같은 모양으로. ⚠️ font-size 16px 아래로 내리지 말 것 —
   iOS 사파리가 «작은 글자» 를 만나면 눌렀을 때 화면을 확대해 버린다.
   ⚠️ `.row select` 로 좁힌다 — 그냥 `select` 로 쓰면 문서함 필터(.findsel)까지 덮는다. */
.row select{
  width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid #ccd4de;border-radius:7px;
  background:#fff;color:#16202c;min-height:46px
}
html.dark input,html.dark textarea,html.dark .row select{background:#1d2836;border-color:#33404f;color:#e6edf3}
textarea{min-height:78px;resize:vertical}
.help{font-size:12.5px;color:#7b8794;margin-top:3px}
html.dark .help{color:#8b98a8}
.auto{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.auto button{font:inherit;font-size:14px;font-weight:650;padding:12px 14px;border:1px solid #0b6e63;background:#dcece9;color:#0b5147;border-radius:8px;cursor:pointer;min-height:48px;flex:1;min-width:150px}
html.dark .auto button{background:#12332f;color:#7fd6c8;border-color:#2f6c62}
.auto button[disabled]{opacity:.55;cursor:default}
.cur{display:flex;gap:6px}
.cur button{font:inherit;font-size:14px;padding:10px 16px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:44px;color:#16202c}
html.dark .cur button{background:#1d2836;border-color:#33404f;color:#e6edf3}
.cur button.on{background:#0b6e63;color:#fff;border-color:#0b6e63}
.reuse{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.reuse button{font:inherit;font-size:14px;text-align:left;padding:11px 13px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:46px;color:#16202c}
html.dark .reuse button{background:#16202c;border-color:#33404f;color:#e6edf3}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92%;
  background:#16202c;color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;display:none;z-index:50
}
.toast.show{display:block}
[hidden]{display:none !important}   /* 작성자 CSS 가 display 를 정하면 [hidden] 이 진다 — CLAUDE.md 함정 */
</style>
</head>
<body>

<div class="top">
  <h1>
    <span data-en="Approvals" data-ko="결재함">Approvals</span>
    <span id="badge" class="badge zero">0</span>
  </h1>
  <div class="tbar">
    <button class="tbtn" onclick="goBack()"><span data-en="← Back" data-ko="← 뒤로">← Back</span></button>
    <a class="tbtn" id="homeBtn" href="/admin.html"><span data-en="🏠 Home" data-ko="🏠 홈">🏠 Home</span></a>
    <button class="tbtn" id="lang" onclick="toggleLang()">KO</button>
    <button class="tbtn" onclick="toggleMode()"><span id="modeLbl" data-en="Dark" data-ko="어둡게">Dark</span></button>
    <button class="tbtn" onclick="reloadAll()"><span data-en="Refresh" data-ko="새로고침">Refresh</span></button>
    <button class="tbtn" id="pushBtn" onclick="askPush()" hidden><span data-en="Notify me" data-ko="알림 받기">Notify me</span></button>
    <button class="tbtn" id="soundBtn" onclick="toggleSound()"><span data-en="Sound: on" data-ko="소리 켬">Sound: on</span></button>
    <button class="tbtn" id="awayBtn" onclick="openAway()" hidden><span data-en="Away" data-ko="부재중">Away</span></button>
    <!-- 🚪 (2026-08-21) 예전엔 죽은 경로로 보내 세션이 안 끊겼다 — 아래 onclick 참고. -->
    <button class="tbtn tbtn-out" id="logoutBtn"><span data-en="Log out" data-ko="로그아웃">Log out</span></button>
  </div>
</div>

<div class="offbar" data-en="Offline — showing the last information received. Press Refresh when you reconnect."
     data-ko="오프라인 — 마지막으로 받은 정보입니다. 연결되면 새로고침을 눌러 주세요.">Offline</div>
<div class="outbox" id="outboxNote" hidden></div>
<div class="outbox" id="queueNote" hidden></div>

<div class="wrap">

  <!-- 🧭 맨 위 요약(D안) — 아침에 한 번 열어 보는 자리.
       ⚠️ 첫 화면 API 한 번 설계를 지킨다: 여기 숫자는 이미 받은 /api/approval/home 안에 있고
          따로 부르지 않는다. 손봐야 할 것이 없으면 경고 줄이 아예 안 뜬다. -->
  <div id="topStop"></div>
  <div id="topTiles" class="tiles"></div>

  <h2 id="urgentHead" hidden><span data-en="Urgent" data-ko="긴급 소통">Urgent</span></h2>
  <div id="urgent"></div>

  <h2><span data-en="Waiting for your decision" data-ko="내가 결재할 것">Waiting for your decision</span></h2>
  <div id="awayBox"></div>
  <div id="schedBox"></div>
  <div id="bulkBox"></div>
  <div id="inbox"><div class="empty" data-en="Loading..." data-ko="불러오는 중...">Loading...</div></div>

  <h2><span data-en="Submit a request" data-ko="결재 올리기">Submit a request</span></h2>
  <div id="kinds" class="kinds"></div>
  <div id="reuse" class="reuse"></div>
  <div id="form" class="form" hidden></div>

  <h2>
    <span data-en="My requests" data-ko="내가 올린 것">My requests</span>
    <button type="button" id="findBtn" class="findtoggle" onclick="toggleFind()"
            data-en="Find past requests" data-ko="지난 결재 찾기">Find past requests</button>
  </h2>
  <div id="mine"><div class="empty" data-en="Loading..." data-ko="불러오는 중...">Loading...</div></div>

  <!-- 📂 결재 문서함 — 접혀 있다가 누르면 열린다.
       ⚠️ 첫 화면은 API 한 번으로 끝낸다는 이 화면의 설계를 깨지 않으려고, 여기서는
          사람이 «찾기» 를 눌렀을 때만 서버를 부른다. -->
  <div id="findPanel" class="findpanel" hidden>
    <div class="findrow">
      <input type="search" id="fq" class="findinput" autocomplete="off"
             data-en-ph="Search title, content, or person" data-ko-ph="제목·내용·올린 사람으로 찾기">
      <button type="button" class="findgo" onclick="runFind(0)"
              data-en="Search" data-ko="찾기">Search</button>
    </div>
    <div class="findrow">
      <select id="fscope" class="findsel" onchange="runFind(0)"></select>
      <select id="ftype" class="findsel" onchange="runFind(0)"></select>
      <select id="fstat" class="findsel" onchange="runFind(0)"></select>
      <select id="fcat" class="findsel" onchange="runFind(0)"></select>
    </div>
    <div class="findrow">
      <label class="findlab" data-en="From" data-ko="시작일">From</label>
      <input type="date" id="ffrom" class="finddate" onchange="runFind(0)">
      <label class="findlab" data-en="To" data-ko="종료일">To</label>
      <input type="date" id="fto" class="finddate" onchange="runFind(0)">
      <button type="button" class="findcsv" onclick="findCsv()"
              data-en="Excel" data-ko="엑셀 내려받기">Excel</button>
    </div>
    <div id="findResult"></div>
  </div>

  <h2>
    <span data-en="Spending" data-ko="지출 정리">Spending</span>
    <button type="button" id="repBtn" class="findtoggle" onclick="toggleRep()"
            data-en="How much did we spend?" data-ko="얼마나 썼나 보기">How much did we spend?</button>
  </h2>

  <!-- 📊 지출 정리 — 문서함과 같이 «접혀 있다가 누를 때만» 서버를 부른다.
       첫 화면은 API 한 번으로 끝낸다는 이 화면의 설계를 지킨다. -->
  <div id="repPanel" class="findpanel" hidden>
    <div class="findrow">
      <select id="rscope" class="findsel" onchange="runRep()"></select>
      <label class="findlab" data-en="From" data-ko="시작일">From</label>
      <input type="date" id="rfrom" class="finddate" onchange="runRep()">
      <label class="findlab" data-en="To" data-ko="종료일">To</label>
      <input type="date" id="rto" class="finddate" onchange="runRep()">
    </div>
    <div id="repResult"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ── 언어 — 기본 영어(필리핀 매니저가 다수). 공통 키는 mangoi_lang. ─────────── */
var LANG = 'en';
try {
  var saved = localStorage.getItem('mangoi_lang');
  if (saved === 'ko' || saved === 'en') LANG = saved;
  else if ((navigator.language || '').indexOf('ko') === 0) LANG = 'ko';
} catch (e) {}
function EN(){ return LANG === 'en'; }
function T(en, ko){ return EN() ? en : ko; }

function applyLang(){
  document.documentElement.lang = LANG;
  var n = document.querySelectorAll('[data-en]');
  for (var i = 0; i < n.length; i++) n[i].textContent = EN() ? n[i].getAttribute('data-en') : n[i].getAttribute('data-ko');
  document.getElementById('lang').textContent = EN() ? 'KO' : 'EN';
  repaint();
}
window.toggleLang = function(){
  LANG = EN() ? 'ko' : 'en';
  try { localStorage.setItem('mangoi_lang', LANG); localStorage.setItem('mangoi_lang_by', 'user'); } catch (e) {}
  applyLang();
};

/* ── 어두운 화면 — 버튼으로만. 자동전환 금지. ──────────────────────────────── */
var MODE = 'light';
try { if (localStorage.getItem('mangoi_manager_theme') === 'dark') MODE = 'dark'; } catch (e) {}
function applyMode(){
  document.documentElement.classList.toggle('dark', MODE === 'dark');
  var s = document.getElementById('modeLbl');
  if (s) {
    var en = MODE === 'dark' ? 'Light' : 'Dark';
    var ko = MODE === 'dark' ? '밝게' : '어둡게';
    // ⚠️ data-en/data-ko 도 같이 갱신 — 안 하면 언어 전환 때 라벨이 되돌아간다(CLAUDE.md 함정)
    s.setAttribute('data-en', en); s.setAttribute('data-ko', ko);
    s.textContent = EN() ? en : ko;
  }
}
window.toggleMode = function(){
  MODE = (MODE === 'dark') ? 'light' : 'dark';
  try { localStorage.setItem('mangoi_manager_theme', MODE); } catch (e) {}
  applyMode();
};

/* ── 잡동사니 ─────────────────────────────────────────────────────────────── */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function money(v, cur){
  if (v == null || v === '') return '';
  var n = Math.round(Number(v) || 0).toLocaleString('en-US');
  return (String(cur).toUpperCase() === 'KRW' ? '₩' : '₱') + n;
}
function when(ms){
  if (!ms) return '';
  var d = new Date(Number(ms));
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function offline(on){ document.body.classList.toggle('is-off', !!on); }
var toastT = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function(){ t.className = 'toast'; }, 3200);
}

/* ── 상태 ─────────────────────────────────────────────────────────────────── */
var CACHE_KEY = 'mangoi_work_home_v1';
var D = null;                       // 마지막으로 받은 /api/approval/home
var PICK = null;                    // 고른 분류
var CUR = 'PHP';
var OCR = null;                     // 영수증에서 읽은 값 {amount, spent_at, vendor}
var FILE = null;                    // 첨부할 파일 (사진 축소본)
var FOCUS_ID = 0;                   // 푸시로 들어왔을 때 강조할 건
var WANT_TYPE = '';                 // 🔗 /work?type=leave — 열자마자 그 분류 폼을 편다
try {
  var q = location.search.match(/[?&]id=(\d+)/);
  if (q) FOCUS_ID = Number(q[1]);
  var qt = location.search.match(/[?&]type=([a-zA-Z_]+)/);
  if (qt) WANT_TYPE = String(qt[1]).toLowerCase();
} catch (e) {}

/* ── 첫 화면 — API 1회 ────────────────────────────────────────────────────── */
function load(){
  return fetch('/api/approval/home', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
    .then(function(r){
      if (r.status === 401 || r.status === 403) { location.href = '/admin/login?next=%2Fwork'; throw new Error('auth'); }
      return r.json();
    })
    .then(function(j){
      if (!j || j.ok === false) throw new Error((j && j.error) || 'load_failed');
      D = j; offline(false);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch (e) {}
      repaint();
      noteArrival(j);   // 🔊 새로 들어온 것이 있으면 소리로 알린다 (함수 선언이라 위로 끌어올려진다)
      return j;
    })
    .catch(function(err){
      if (String(err && err.message) === 'auth') throw err;
      offline(true);
      if (!D) {
        // 마지막으로 성공했던 값이라도 그린다 — 흰 화면보다 낫다
        try {
          var c = localStorage.getItem(CACHE_KEY);
          if (c) { D = JSON.parse(c); repaint(); return D; }
        } catch (e) {}
        document.getElementById('inbox').innerHTML =
          '<div class="empty">' + esc(T('Could not load. Check your connection and press Refresh.',
                                        '불러오지 못했습니다. 연결을 확인하고 새로고침을 눌러 주세요.')) + '</div>';
      }
      throw err;
    });
}
window.reloadAll = function(){ load().catch(function(){}); };

/* ── 🔙 뒤로 · 🏠 홈 (2026-08-20) ──────────────────────────────────────────
   왜 — 결재함에는 나가는 길이 「로그아웃」밖에 없었다. 관리자 화면에서 「결재 올리기」로
        건너오면 돌아갈 방법이 없어 브라우저 뒤로가기를 눌러야 했다(휴대폰 앱에서는 그것도 없다).
   ⚠️ 새 탭·카톡 링크로 열면 history 가 «이 페이지 하나» 뿐이라 back() 이 아무 일도 하지 않는다.
      그때는 홈으로 보낸다 — 「눌렀는데 아무 일도 안 일어난다」 를 만들지 않는다. */
window.goBack = function(){
  var home = (document.getElementById('homeBtn') || {}).href || '/admin.html';
  try {
    if (window.history.length > 1) { window.history.back(); return; }
  } catch (e) {}
  location.href = home;
  /* ⛔ 「back 이 안 먹으면 홈으로」 를 setTimeout 안전망으로 만들지 말 것.
     뒤로 간 뒤 «앞으로» 로 이 화면에 돌아오면(bfcache 복원) 멈춰 있던 타이머가 깨어나
     사람이 누르지도 않은 이동이 일어난다. history.length 판정만으로 충분하다. */
};

/* 홈은 «그 사람의 홈» 이어야 한다 — 강사에게 1.3MB 관리자 화면을 주지 않는다.
   판정이 오기 전 기본값은 관리자 화면이고, /api/approval/home 이 오면 바로잡는다. */
function applyHome(){
  var a = document.getElementById('homeBtn'); if (!a || !D || !D.me) return;
  a.href = D.me.is_teacher ? '/teacher' : (D.me.is_ph_manager ? '/manager' : '/admin.html');
}

/* ── 그리기 ───────────────────────────────────────────────────────────────── */
function repaint(){
  if (!D) return;
  applyHome();
  paintBadge();
  paintKinds();
  paintReuse();
  // 🚨 긴급 소통 — 남이 올린 것 중 내가 볼 수 있는 것. 결재 권한과 무관하게 «보이는» 것이 목적이다.
  //    (내가 이미 결재할 수 있는 긴급 건은 아래 결재함에 뜨므로 여기서는 뺀다 — 같은 줄이 두 번 나오지 않게)
  var urg = (D.urgent || []).filter(function(u){
    return !(D.inbox || []).some(function(x){ return x.id === u.id; });
  });
  document.getElementById('urgentHead').hidden = !urg.length;
  document.getElementById('urgent').innerHTML = urg.length
    ? urg.map(function(r){ return itemHtml(r, false); }).join('')
    : '';

  paintTop();
  paintAway();
  paintSchedule();
  paintBulk();
  paintList('inbox', D.inbox || [], true);
  paintList('mine', D.mine || [], false);
  paintForm();          // 언어를 바꿔도 폼 라벨이 따라오게. 값은 paintForm 이 챙겨서 되돌린다.
  // 📂 문서함이 열려 있으면 그것도 다시 그린다 — JS 로 그린 글자는 data-ko/data-en 루프가
  //    못 건드리므로, 여기서 다시 그리지 않으면 언어를 바꿔도 영어/한국어가 섞인 채 남는다.
  var fp = document.getElementById('findPanel');
  if (fp && !fp.hidden) { paintFindChrome(); paintFind(); }
  var rp = document.getElementById('repPanel');
  if (rp && !rp.hidden) { paintRepChrome(); paintRep(); }
  paintOutbox();
  paintPushBtn();
  // 이미 권한을 준 사람은 조용히 구독을 되살린다(기기를 바꾸거나 캐시가 지워졌을 수 있다).
  if (!pushOn && pushReady() && Notification.permission === 'granted' && D.me && D.me.username) {
    pushOn = true;                       // 중복 호출 방지 — 실패하면 아래에서 되돌린다
    subscribePush().then(function(ok){ if (!ok) pushOn = false; paintPushBtn(); });
  }
  if (FOCUS_ID) {
    var el = document.getElementById('req-' + FOCUS_ID);
    if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } }
  }
}

function paintBadge(){
  var b = document.getElementById('badge');
  var n = (D.inbox || []).length;
  var late = (D.inbox || []).filter(isOverdue).length;
  b.textContent = late ? (n + ' / ' + late) : String(n);
  b.className = 'badge' + (late ? ' late' : (n ? '' : ' zero'));
  b.title = late ? T(late + ' overdue', '지연 ' + late + '건') : '';
}

function typeLabel(r){ return EN() ? (r.type_en || r.req_type) : (r.type_ko || r.req_type); }

function paintList(id, arr, decidable){
  var host = document.getElementById(id);
  if (!arr.length) {
    host.innerHTML = '<div class="empty">' +
      esc(decidable ? T('Nothing waiting for you.', '결재할 것이 없습니다.')
                    : T('You have not submitted anything yet.', '올린 결재가 없습니다.')) + '</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < arr.length; i++) h += itemHtml(arr[i], decidable);
  host.innerHTML = h;
}

/* 지연 판정은 **화면이 한다**. 서버가 «지금 지연인가»를 담아 보내면 내용이 그대로여도
   응답이 매초 달라져서, 「바뀐 것 없음(304)」으로 끝낼 수가 없다 — 느린 회선에서 그게 제일 아깝다.
   서버는 «언제까지» 만 보내고, 지금 시각과 비교하는 일은 여기서 한다. */
function isOverdue(r){
  return !!(r.status === 'pending' && r.stage_due_at && Date.now() > Number(r.stage_due_at));
}

/* 🧭 「내가 올린 건인가」 — 진행바와 «멈춤» 안내는 내 건에만 그린다.
   남이 올린 긴급 소통에까지 「승인할 사람이 없습니다」를 띄우면 남의 일에 대고 하는 말이 된다. */
function isMine(r){
  return !!(D && D.me && D.me.username && String(r.requester_username) === String(D.me.username));
}

/* 며칠째인가. 지연 판정과 같은 이유로 **화면이** 센다 — 서버가 담으면 내용이 그대로여도
   응답이 매초 달라져서 「바뀐 것 없음(304)」으로 끝낼 수가 없다. */
function daysWaiting(r){
  return Math.floor((Date.now() - Number(r.created_at || 0)) / 86400000);
}

function roleLabel(role){
  return role === 'exec' ? T('Exec', '경영진') : T('Office', '본사');
}

/* 진행 추적 줄 — 올림 → (단계마다) → 완료.
   ⚠️ steps 가 비어 있는 옛 건은 «1단계짜리»로 본다(서버 rowOf 와 같은 해석). */
function trackHtml(r){
  var steps = (r.steps && r.steps.length) ? r.steps
            : [{ seq: 1, role: 'staff', status: (r.status === 'pending' ? 'active' : r.status) }];
  function cell(cls, top, bot){
    return '<div class="trkS' + (cls ? ' ' + cls : '') + '"><span class="trkBar"></span>' +
           '<span class="trkB"></span><span class="trkL">' + esc(top) +
           (bot ? ('<br>' + esc(bot)) : '') + '</span></div>';
  }
  var h = '<div class="trk">';
  h += cell('done', T('Submitted', '올림'), when(r.created_at));
  for (var i = 0; i < steps.length; i++) {
    var s = steps[i], cls = '', mark = '';
    if (s.status === 'approved')      { cls = 'done'; mark = T('Approved', '승인'); }
    else if (s.status === 'rejected') { cls = 'no';   mark = T('Rejected', '반려'); }
    else if (s.status === 'skipped')  { cls = 'done'; mark = T('Skipped', '전결'); }
    else if (s.status === 'active')   { cls = r.blocked ? 'stop' : 'now';
                                        mark = r.blocked ? T('Stopped', '멈춤') : T('In progress', '진행 중'); }
    else                              { mark = T('Waiting', '대기'); }
    h += cell(cls, roleLabel(s.role), mark);
  }
  h += cell(r.status === 'approved' ? 'done' : (r.status === 'rejected' ? 'no' : ''),
            T('Done', '완료'),
            r.status === 'approved' ? T('Approved', '승인됨')
          : r.status === 'rejected' ? T('Rejected', '반려됨') : '');
  return h + '</div>';
}

/* 🔴 「기다려도 처리되지 않습니다」 — **서버가** «결재할 수 있는 사람 0명»이라고 알려 준 건에만.
   ⛔ 화면이 스스로 판정하지 않는다 — 계정 목록도 결재 규칙도 모르므로 틀린 말을 하게 된다. */
function stuckHtml(r){
  var role = 'staff';
  for (var i = 0; i < (r.steps || []).length; i++) {
    if (Number(r.steps[i].seq) === Number(r.stage_seq)) { role = r.steps[i].role; break; }
  }
  var who = roleLabel(role);
  return '<div class="stuck"><b>' +
    esc(T('This will not move on its own.', '이대로는 처리되지 않습니다.')) + '</b> ' +
    esc(EN()
      ? ('Nobody can decide the "' + who + '" step right now — and you cannot approve your own request. ' +
         'Someone else has to be given rights for this step.')
      : ('지금 「' + who + '」 단계를 결재할 수 있는 사람이 없습니다. 본인이 올린 결재는 본인이 승인할 수 없기 때문입니다. ' +
         '이 단계를 결재할 사람을 지정해야 움직입니다.')) +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   📂 결재 문서함 — 지난 결재 찾기 (2026-09-04)

   왜 — 「내가 올린 것」이 최근 15건뿐이라 그 뒤로는 볼 방법이 없었다.
   검색·기간·분류·상태로 찾고, 엑셀로 내려받는다.

   ⚠️ 첫 화면은 API 한 번으로 끝낸다는 이 화면의 설계를 깨지 않는다 —
      사람이 «찾기» 를 눌렀을 때만 서버를 부른다.
   ══════════════════════════════════════════════════════════════════════════ */

var FIND = null;          // 마지막 검색 결과 { items, has_more, offset }
var FIND_BUSY = false;

window.toggleFind = function(){
  var box = document.getElementById('findPanel');
  var btn = document.getElementById('findBtn');
  if (!box) return;
  var open = box.hidden;                     // 지금 닫혀 있으면 연다
  box.hidden = !open;
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) {
    paintFindChrome();
    if (!FIND) runFind(0);                   // 처음 열 때 한 번만 부른다
    var q = document.getElementById('fq');
    if (q) { try { q.focus(); } catch (e) {} }
  }
};

/* 고르는 칸을 그린다.
   ⚠️ 분류 목록은 **서버가 준 것**(D.types)을 쓴다 — 화면에 손으로 적으면
      서버가 분류를 늘리거나 줄여도 따라오지 않는다. */
function paintFindChrome(){
  var sc = document.getElementById('fscope');
  if (!sc) return;
  var scopes = [
    ['mine',     T('My requests (all)', '내가 올린 것 (전체)')],
    ['open',     T('In progress',       '진행 중')],
    ['done',     T('Approved',          '승인 완료')],
    ['rejected', T('Rejected',          '반려')]
  ];
  // 결재자에게만 «내가 결재할 것»·«전체» 를 준다 — 서버도 같은 판정으로 막는다.
  if (D && D.can_approve) {
    scopes.push(['pending', T('Waiting for me', '내가 결재할 것')]);
    scopes.push(['all',     T('Everything',     '전체')]);
  }
  fillSel(sc, scopes);

  var ty = [['', T('All kinds', '분류 전체')]];
  var list = (D && D.types) || [];
  for (var i = 0; i < list.length; i++) {
    ty.push([list[i].key, EN() ? (list[i].en || list[i].key) : (list[i].ko || list[i].key)]);
  }
  fillSel(document.getElementById('ftype'), ty);

  fillSel(document.getElementById('fstat'), [
    ['',         T('Any status', '상태 전체')],
    ['pending',  T('Waiting',    '대기 중')],
    ['approved', T('Approved',   '승인')],
    ['rejected', T('Rejected',   '반려')]
  ]);

  /* 🏷️ 지출 항목도 서버 목록(D.categories)으로 그린다. 목록이 안 왔으면 그 칸을 감춘다 —
     빈 «고르기» 칸이 있으면 「고를 게 없다」가 아니라 「고장」으로 읽힌다. */
  var ce = document.getElementById('fcat');
  var cl = (D && D.categories) || [];
  if (ce) {
    ce.hidden = !cl.length;
    if (cl.length) {
      var cp = [['', T('All items', '항목 전체')]];
      for (var k = 0; k < cl.length; k++) {
        cp.push([cl[k].key, EN() ? (cl[k].en || cl[k].key) : (cl[k].ko || cl[k].key)]);
      }
      fillSel(ce, cp);
    }
  }

  // placeholder 는 data-en/data-ko 루프가 못 건드린다(그건 textContent 를 바꾼다).
  var q = document.getElementById('fq');
  if (q) q.placeholder = EN() ? (q.getAttribute('data-en-ph') || '') : (q.getAttribute('data-ko-ph') || '');
}

/** 고른 값을 잃지 않고 다시 그린다 — 언어를 바꿔도 고른 것이 그대로 있어야 한다. */
function fillSel(el, pairs){
  if (!el) return;
  var keep = el.value;
  var h = '';
  for (var i = 0; i < pairs.length; i++) {
    h += '<option value="' + esc(pairs[i][0]) + '">' + esc(pairs[i][1]) + '</option>';
  }
  el.innerHTML = h;
  if (keep) el.value = keep;
}

function findParams(){
  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = [];
  p.push('scope=' + encodeURIComponent(g('fscope') || 'mine'));
  if (g('fq'))    p.push('q=' + encodeURIComponent(g('fq')));
  if (g('ftype')) p.push('type=' + encodeURIComponent(g('ftype')));
  if (g('fstat')) p.push('status=' + encodeURIComponent(g('fstat')));
  if (g('fcat'))  p.push('category=' + encodeURIComponent(g('fcat')));
  if (g('ffrom')) p.push('from=' + encodeURIComponent(g('ffrom')));
  if (g('fto'))   p.push('to=' + encodeURIComponent(g('fto')));
  return p.join('&');
}

window.runFind = function(offset){
  if (FIND_BUSY) return;
  var host = document.getElementById('findResult');
  if (!host) return;
  FIND_BUSY = true;
  if (!offset) host.innerHTML = '<div class="findnote">' + esc(T('Searching...', '찾는 중...')) + '</div>';

  fetch('/api/approval/requests?' + findParams() + '&limit=20&offset=' + (offset || 0), {
    credentials: 'same-origin', headers: { 'Accept': 'application/json' }
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    FIND_BUSY = false;
    // ⚠️ «실패라고 말했는가» 가 아니라 «성공이라고 말했는가» 로 판정한다.
    //    404 본문에는 ok 칸이 아예 없어서 d.ok === false 는 그냥 통과한다(CLAUDE.md).
    if (!d || d.ok !== true || !Array.isArray(d.items)) {
      host.innerHTML = '<div class="findnote">' +
        esc(T('Could not search. Please try again.', '찾지 못했습니다. 다시 눌러 주세요.')) + '</div>';
      return;
    }
    var prev = (offset && FIND) ? FIND.items : [];
    FIND = { items: prev.concat(d.items), has_more: !!d.has_more, offset: Number(d.offset || 0) };
    paintFind();
  })
  .catch(function(){
    FIND_BUSY = false;
    host.innerHTML = '<div class="findnote">' +
      esc(T('Network problem. Please try again.', '연결이 좋지 않습니다. 다시 눌러 주세요.')) + '</div>';
  });
};

window.findMore = function(){
  if (!FIND) return;
  runFind(FIND.offset + 20);
};

function paintFind(){
  var host = document.getElementById('findResult');
  if (!host || !FIND) return;
  if (!FIND.items.length) {
    host.innerHTML = '<div class="findnote">' +
      esc(T('Nothing found. Try a different word or period.',
            '찾은 것이 없습니다. 다른 낱말이나 기간으로 해 보세요.')) + '</div>';
    return;
  }
  var h = '<div class="findnote">' +
    esc(EN() ? (FIND.items.length + ' found' + (FIND.has_more ? ' (more below)' : ''))
             : (FIND.items.length + '건' + (FIND.has_more ? ' (더 있습니다)' : ''))) + '</div>';
  for (var i = 0; i < FIND.items.length; i++) h += itemHtml(FIND.items[i], false);
  if (FIND.has_more) {
    h += '<button type="button" class="findmore" onclick="findMore()">' +
         esc(T('Show more', '더 보기')) + '</button>';
  }
  host.innerHTML = h;
}

/* 엑셀 내려받기 — 지금 고른 조건 그대로.
   ⚠️ window.open 을 쓰지 않는다: 카톡·문자 인앱 브라우저는 새 창을 못 열면서
      예외도 안 던지고 null 만 돌려준다(CLAUDE.md). 같은 창에서 연다 —
      서버가 Content-Disposition: attachment 를 주므로 화면은 그대로 있고 파일만 받는다. */
window.findCsv = function(){
  location.href = '/api/approval/requests?' + findParams() + '&format=csv';
};

/* ══════════════════════════════════════════════════════════════════════════
   📊 지출 정리 — 「이번 달 무슨 돈을 얼마나 썼나」

   ⛔ 통화를 섞어서 하나로 보여 주지 않는다 — 환율을 우리가 모른다.
      PHP 와 KRW 를 나란히 적는다. 서버(summarizeApprovals)도 같은 규칙이다.
   ⛔ 「승인」과 「대기」를 합치지 않는다 — 대기는 아직 안 쓴 돈이다.
   ⛔ 모르는 것을 0으로 그리지 않는다 — 「금액 없음 N건」·「항목 없음 N건」으로 적는다.
   ══════════════════════════════════════════════════════════════════════════ */
var REP = null, REP_BUSY = false;

window.toggleRep = function(){
  var box = document.getElementById('repPanel');
  var btn = document.getElementById('repBtn');
  if (!box) return;
  var open = box.hidden;
  box.hidden = !open;
  if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) {
    paintRepChrome();
    if (!REP) runRep();                  // 처음 열 때 한 번만 부른다
  }
};

function paintRepChrome(){
  var sc = document.getElementById('rscope');
  if (!sc) return;
  var scopes = [['mine', T('My requests', '내가 올린 것')]];
  // 결재자에게만 «전체» — 서버도 같은 판정으로 403 을 준다.
  if (D && D.can_approve) scopes.push(['all', T('Everything', '전체')]);
  fillSel(sc, scopes);
}

/** 기본 기간은 «이번 달 1일부터» — 비워 두면 전 기간이라 「이번 달 얼마」에 답을 못 한다. */
function repDefaults(){
  var f = document.getElementById('rfrom');
  if (f && !f.value) {
    var n = new Date(Date.now() + 9 * 3600000);   // KST
    f.value = n.getUTCFullYear() + '-' + String(n.getUTCMonth() + 1).padStart(2, '0') + '-01';
  }
}

window.runRep = function(){
  if (REP_BUSY) return;
  var host = document.getElementById('repResult');
  if (!host) return;
  repDefaults();
  REP_BUSY = true;
  host.innerHTML = '<div class="findnote">' + esc(T('Adding up...', '더하는 중...')) + '</div>';

  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = ['view=report', 'scope=' + encodeURIComponent(g('rscope') || 'mine')];
  if (g('rfrom')) p.push('from=' + encodeURIComponent(g('rfrom')));
  if (g('rto'))   p.push('to=' + encodeURIComponent(g('rto')));

  fetch('/api/approval/requests?' + p.join('&'), { credentials: 'same-origin' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      REP_BUSY = false;
      /* 「성공이라고 말했는가」로 판정한다 — 종단 404 본문에는 ok 칸이 아예 없어서
         `if (d.ok === false)` 는 그냥 통과하고 빈 화면이 «정상» 으로 보인다(CLAUDE.md 2장). */
      if (!d || d.ok !== true || !d.summary) {
        host.innerHTML = '<div class="findnote">' +
          esc(T('Could not add it up. Please try again.', '더하지 못했습니다. 다시 눌러 주세요.')) + '</div>';
        return;
      }
      REP = d;
      paintRep();
    })
    .catch(function(){
      REP_BUSY = false;
      host.innerHTML = '<div class="findnote">' +
        esc(T('Network problem. Please try again.', '연결이 좋지 않습니다. 다시 눌러 주세요.')) + '</div>';
    });
};

/** 통화별 금액을 «한 줄» 로. ⛔ 절대 더해서 하나로 만들지 않는다. */
function repMoney(list){
  if (!list || !list.length) return '—';
  var out = [];
  for (var i = 0; i < list.length; i++) {
    if (!list[i].total) continue;
    out.push(money(list[i].total, list[i].currency));
  }
  return out.length ? out.join('  ·  ') : '—';
}

function paintRep(){
  var host = document.getElementById('repResult');
  if (!host || !REP) return;
  var s = REP.summary;

  if (!s.counted) {
    host.innerHTML = '<div class="findnote">' +
      esc(T('No requests in this period.', '이 기간에 올라온 결재가 없습니다.')) + '</div>';
    return;
  }

  var h = '';

  /* ① 확정된 돈 · 아직 아닌 돈 — 갈라서 적는다 */
  h += '<div class="repcards">';
  h += '<div class="repcard"><div class="rl">' +
       esc(T('Approved', '승인 — 쓰기로 확정')) + '</div><div class="rv">' +
       esc(repMoney(s.approved_money)) + '</div><div class="rn">' +
       esc(EN() ? (s.by_status.approved + ' requests') : (s.by_status.approved + '건')) + '</div></div>';
  h += '<div class="repcard"><div class="rl">' +
       esc(T('Waiting', '대기 — 아직 아닌 돈')) + '</div><div class="rv">' +
       esc(repMoney(s.pending_money)) + '</div><div class="rn">' +
       esc(EN() ? (s.by_status.pending + ' requests') : (s.by_status.pending + '건')) + '</div></div>';
  h += '</div>';

  /* ② 항목별 */
  h += '<div class="repsec">' + esc(T('By item', '지출 항목별')) + '</div>';
  if (!s.by_category.length) {
    h += '<div class="findnote">' +
         esc(T('No spending requests in this period.', '이 기간에 지출·물품 결재가 없습니다.')) + '</div>';
  } else {
    h += '<table class="reptbl"><tbody>';
    for (var i = 0; i < s.by_category.length; i++) {
      var c = s.by_category[i];
      var nm = c.key ? (EN() ? c.en : c.ko) : T('No item picked', '항목 없음');
      h += '<tr' + (c.key ? '' : ' class="dim"') + '><td class="rc">' + esc(nm) +
           (c.account ? '<span class="racct">' + esc(c.account) + '</span>' : '') + '</td>' +
           '<td class="rq">' + esc(EN() ? (c.count + '') : (c.count + '건')) + '</td>' +
           '<td class="rm">' + esc(repMoney(c.money)) + '</td></tr>';
    }
    h += '</tbody></table>';
  }

  /* ③ 달별 (승인만) */
  if (s.by_month.length) {
    h += '<div class="repsec">' + esc(T('By month (approved)', '달별 (승인된 것)')) + '</div>';
    h += '<table class="reptbl"><tbody>';
    for (var j = 0; j < s.by_month.length; j++) {
      var m = s.by_month[j];
      h += '<tr><td class="rc">' + esc(m.month) + '</td>' +
           '<td class="rq">' + esc(EN() ? (m.count + '') : (m.count + '건')) + '</td>' +
           '<td class="rm">' + esc(repMoney(m.money)) + '</td></tr>';
    }
    h += '</tbody></table>';
    /* 🔴 기간은 «올린 날» 로 자르는데 달 묶음은 «지출일» 을 먼저 봅니다 — 두 축이 다릅니다.
       그래서 이달 1일~ 로 열어도 지난달 줄이 나올 수 있고, 지난달에 올린 이달 지출은 빠집니다.
       ⛔ 감추지 말고 그 표 «옆» 에서 말합니다. 축을 맞추는 것은 buildFindQuery 를
          바꾸는 일이라 별건입니다.
       ⛔ 이 줄을 「말하지 않는 것」 상자에 넣지 마세요 — 그 상자는 «이번 기간에 빈 곳» 을
          적는 자리라, 늘 있는 사실을 넣으면 상자가 언제나 떠서 아무도 안 읽게 됩니다. */
    h += '<div class="repnote">' + esc(EN()
      ? 'Period is filtered by the date submitted; months use the date spent when it is filled in.'
      : '기간은 «올린 날» 로 자르고, 달은 지출일이 있으면 그것으로 잡습니다.') + '</div>';
  }

  /* ④ 🔴 화면이 «모르는 것» 을 말한다 — 이것이 이 화면의 핵심이다.
        숫자만 보여 주고 「무엇이 안 채워졌는지」를 감추면 그 합계가 거짓이 된다. */
  var gaps = [];
  if (s.no_category) gaps.push(EN()
    ? (s.no_category + ' spending request(s) have no item — they are counted under "No item".')
    : ('지출·물품 ' + s.no_category + '건에 항목이 없습니다 — 위 「항목 없음」 줄이 그것입니다.'));
  if (s.no_amount) gaps.push(EN()
    ? (s.no_amount + ' have no amount — they are counted in the request count but not in the total.')
    : ('금액이 없는 건이 ' + s.no_amount + '건 있습니다 — 건수에는 들어가고 합계에는 안 들어갑니다.'));
  if (s.no_file) gaps.push(EN()
    ? (s.no_file + ' need a receipt but have none.')
    : ('영수증이 필요한데 없는 건이 ' + s.no_file + '건 있습니다.'));
  if (s.dated_by_created) gaps.push(EN()
    ? (s.dated_by_created + ' had no "date spent", so the month is when it was submitted.')
    : ('지출일이 없어 «올린 날» 로 달을 잡은 건이 ' + s.dated_by_created + '건 있습니다.'));
  if (REP.truncated) gaps.push(EN()
    ? ('Only the first ' + REP.max + ' requests were counted. Narrow the period.')
    : ('앞 ' + REP.max + '건만 셌습니다. 기간을 좁혀 주세요.'));
  /* 엑셀은 500건까지라 그보다 많으면 화면 합계와 파일이 어긋납니다. */
  if (REP.csv_max && s.counted > REP.csv_max) gaps.push(EN()
    ? ('The Excel file holds only ' + REP.csv_max + ' rows, so it will not match this total.')
    : ('엑셀은 ' + REP.csv_max + '건까지만 담기므로 이 합계와 어긋납니다.'));
  /* 결재선을 하나도 못 읽으면 chain 열람 건이 조용히 빠져 총액이 줄어듭니다. */
  if (REP.steps_missing) gaps.push(EN()
    ? 'Approval steps could not be read, so some requests may be missing from this total.'
    : '결재 단계를 읽지 못해 일부 건이 이 합계에서 빠졌을 수 있습니다.');

  if (gaps.length) {
    h += '<div class="repgap"><b>' + esc(T('What this total does not include',
                                           '이 합계가 말하지 않는 것')) + '</b>';
    for (var k = 0; k < gaps.length; k++) h += '<div>· ' + esc(gaps[k]) + '</div>';
    h += '</div>';
  }

  /* ⑤ 같은 조건으로 엑셀 — 회계와 대조할 때 쓴다 */
  var gg = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var cp = ['scope=' + encodeURIComponent(gg('rscope') || 'mine')];
  if (gg('rfrom')) cp.push('from=' + encodeURIComponent(gg('rfrom')));
  if (gg('rto'))   cp.push('to=' + encodeURIComponent(gg('rto')));
  h += '<div class="findrow" style="margin-top:10px">' +
       '<button type="button" class="findcsv" onclick="repCsv()">' +
       esc(T('Excel (same period)', '엑셀 내려받기 (같은 기간)')) + '</button></div>';

  host.innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════
   🧭 맨 위 요약 (D안) — 「아침에 30초」

   ⚠️ 여기 숫자는 **이미 받은 /api/approval/home 안에** 있다. 따로 부르지 않는다
      (이 화면은 첫 화면 API 한 번 설계다).
   ⛔ 손봐야 할 것이 없으면 경고 줄을 그리지 않는다 — 늘 뜨는 경고는 아무도 안 읽는다.
   ⛔ 통화를 합치지 않는다(지출 정리와 같은 규칙 — repMoney 를 그대로 쓴다).
   ══════════════════════════════════════════════════════════════════════════ */

/** 지금 손봐야 할 내 건 — 멈춘 것 먼저, 그다음 지연. */
function topStuckItems(){
  var out = [];
  var mine = (D && D.mine) || [];
  for (var i = 0; i < mine.length; i++) {
    var r = mine[i];
    if (r.status !== 'pending') continue;
    if (r.blocked) out.push({ r: r, why: 'blocked' });
    else if (isOverdue(r)) out.push({ r: r, why: 'late' });
  }
  // 멈춘 것이 먼저 — 지연은 기다리면 풀리지만 멈춘 것은 안 풀린다
  out.sort(function(a, b){ return (a.why === 'blocked' ? 0 : 1) - (b.why === 'blocked' ? 0 : 1); });
  return out;
}

function paintTop(){
  var stopHost = document.getElementById('topStop');
  var tileHost = document.getElementById('topTiles');
  if (!stopHost || !tileHost || !D) return;

  var sm = D.summary || null;
  var stuck = topStuckItems();

  /* ── ① 손봐야 할 것 ─────────────────────────────────────────────────── */
  if (!stuck.length) {
    stopHost.innerHTML = '';
  } else {
    var nBlocked = stuck.filter(function(x){ return x.why === 'blocked'; }).length;
    var first = stuck[0];
    var h = '<div class="topstop"><b>' +
      esc(EN() ? ('Needs your attention — ' + stuck.length + (stuck.length === 1 ? ' request' : ' requests'))
               : ('손봐야 할 것 ' + stuck.length + '건')) + '</b>';
    h += '<div>' + esc('“' + String(first.r.title || '').slice(0, 60) + '”') + ' — ' +
      esc(first.why === 'blocked'
        ? T('cannot be processed as it is: nobody can approve this step right now.',
            '이대로는 처리되지 않습니다 — 지금 이 단계를 결재할 수 있는 사람이 없습니다.')
        : T('is past its due time.', '마감이 지났습니다.')) + '</div>';
    if (stuck.length > 1) {
      h += '<div>' + esc(EN() ? ((stuck.length - 1) + ' more below.')
                              : ('나머지 ' + (stuck.length - 1) + '건은 아래 목록에 있습니다.')) + '</div>';
    }
    h += '<button type="button" class="ts-go" onclick="topGo(' + Number(first.r.id) + ')">' +
         esc(T('Show it', '그 건 보기')) + '</button>';
    h += '</div>';
    stopHost.innerHTML = h;
  }

  /* 🔴 「창 밖은 못 봤다」는 **경고 상자 밖**에 둔다.
     ⛔ 상자 «안» 에 두면, 창 안에 멈춘 건이 없을 때 상자가 통째로 안 그려져 그 말까지
        함께 사라진다 — 정작 그때가 알려야 할 때다(화면에는 「손볼 것 없음」처럼 보이는데
        창 밖에 있을 수 있다). mine 은 created_at DESC 라 **오래 멈춘 건일수록 밀려난다.**
     ⚠️ 비교는 «진행 중인 것 중 화면에 있는 수»(my_open_shown)로 한다 —
        mine.length 는 상태를 안 가리는 최근 15건이라 my_open 과 모집단이 다르다. */
  var seen = (sm && typeof sm.my_open_shown === 'number') ? sm.my_open_shown : null;
  if (sm && seen != null && sm.my_open > seen) {
    stopHost.innerHTML += '<div class="repnote">' + esc(EN()
      ? ('Checked ' + seen + ' of your ' + sm.my_open + ' open requests — the rest are outside this list.')
      : ('진행 중 ' + sm.my_open + '건 가운데 ' + seen + '건만 살펴본 것입니다 — 나머지는 이 목록 밖에 있습니다.'))
      + '</div>';
  }
  /* 조회가 실패했으면 «0건» 이 아니라 «모른다» 고 적는다. */
  if (sm && (sm.money_unknown || sm.open_unknown)) {
    stopHost.innerHTML += '<div class="repnote">' + esc(
      T('Could not read some of these numbers — they may be missing.',
        '아래 숫자 가운데 일부를 읽지 못했습니다 — 빠진 것이 있을 수 있습니다.')) + '</div>';
  }

  /* ── ② 타일 넷 ──────────────────────────────────────────────────────── */
  var t = '';
  var tile = function(cls, label, value, note, onclick){
    return '<button type="button" class="tile' + (cls ? ' ' + cls : '') + '"' +
           (onclick ? (' onclick="' + onclick + '"') : ' disabled') + '>' +
           '<span class="tl">' + esc(label) + '</span>' +
           '<span class="tv">' + esc(value) + '</span>' +
           (note ? '<span class="tn">' + esc(note) + '</span>' : '') + '</button>';
  };

  var inboxN = (D.inbox || []).length;
  /* ⚠️ 결재함은 20건에서 자른다(서버 inbox 루프) — 정확한 수처럼 보이지 않게 «+» 를 붙인다. */
  var inboxCap = !!(sm && sm.inbox_capped);
  t += tile(inboxN ? 'hot' : '', T('Waiting for me', '내가 결재할 것'),
            (EN() ? String(inboxN) : (inboxN + '건')) + (inboxCap ? '+' : ''),
            inboxN ? (inboxCap ? T('at least this many', '적어도 이만큼') : '')
                   : T('nothing to decide', '지금은 없습니다'),
            'topScroll(\'inbox\')');

  /* ⛔ 못 읽었으면 «0건» 이 아니라 «—» 다. */
  var openN = (sm && !sm.open_unknown) ? sm.my_open : null;
  t += tile(stuck.length ? 'hot' : '', T('My requests in progress', '내가 올린 것 · 진행 중'),
            openN == null ? '—' : (EN() ? String(openN) : (openN + '건')),
            openN == null ? T('could not read', '읽지 못했습니다')
              : (stuck.length ? (EN() ? (stuck.length + ' need attention')
                                      : ('그중 손볼 것 ' + stuck.length + '건'))
                              : ''),
            'topScroll(\'mine\')');

  /* 💰 금액 타일 — «어느 범위인지» 를 반드시 함께 적는다.
     경영진은 전체, 그 밖은 내가 올린 것이라 같은 타일에서 다른 숫자를 본다. */
  if (sm && sm.money_unknown) {
    /* ⛔ 「전체 · 0건 승인」이라고 적지 않는다 — 못 읽은 것과 0건은 다른 사실이다. */
    t += tile('', T('Approved this month', '이번 달 승인'), '—', T('could not read', '읽지 못했습니다'), '');
    t += tile('', T('Approved this year', '올해 누적'), '—', T('could not read', '읽지 못했습니다'), '');
  } else if (sm && sm.money) {
    var scopeNote = (sm.money_scope === 'all') ? T('everyone', '전체')
                                               : T('my requests', '내가 올린 것');
    var mm = repMoney(sm.money.month), yy = repMoney(sm.money.year);
    var mNote = scopeNote + ' · ' + (EN() ? (sm.money.month_count + ' approved')
                                          : (sm.money.month_count + '건 승인'));
    /* 금액 없는 승인은 «0원» 이 아니다 — 그렇게 적어 준다. */
    if (sm.money.month_no_amount) {
      mNote += ' · ' + (EN() ? (sm.money.month_no_amount + ' with no amount')
                             : ('금액 없음 ' + sm.money.month_no_amount + '건'));
    }
    var yNote = scopeNote + ' · ' + (EN() ? (sm.money.year_count + ' approved')
                                          : (sm.money.year_count + '건 승인'));
    if (sm.money.year_no_amount) {
      yNote += ' · ' + (EN() ? (sm.money.year_no_amount + ' with no amount')
                             : ('금액 없음 ' + sm.money.year_no_amount + '건'));
    }
    t += tile('', T('Approved this month', '이번 달 승인'), mm, mNote, 'topSpending()');
    t += tile('', T('Approved this year', '올해 누적'), yy, yNote, 'topSpending()');
  }
  tileHost.innerHTML = t;
}

/** 그 건으로 데려간다 — 목록에 있으면 그 줄로, 없으면 문서함에서 찾게 한다. */
window.topGo = function(id){
  var el = document.getElementById('req-' + id);
  if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } return; }
  /* 최근 15건 밖이면 화면에 그 줄이 없다 — 「눌러도 아무 일도 안 일어남」이 되지 않게
     문서함을 열어 준다. */
  var box = document.getElementById('findPanel');
  if (box && box.hidden && window.toggleFind) window.toggleFind();
  toast(T('Find it in the document box below.', '아래 문서함에서 찾아 주세요.'));
};

window.topScroll = function(which){
  var el = document.getElementById(which);
  if (el) { try { el.scrollIntoView({ block: 'start' }); } catch (e) { el.scrollIntoView(); } }
};

/** 금액 타일 → 지출 정리를 열고 그리로. */
window.topSpending = function(){
  var box = document.getElementById('repPanel');
  if (box && box.hidden && window.toggleRep) window.toggleRep();
  var el = document.getElementById('repBtn');
  if (el) { try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); } }
};

window.repCsv = function(){
  var g = function(id){ var e = document.getElementById(id); return e ? String(e.value || '').trim() : ''; };
  var p = ['scope=' + encodeURIComponent(g('rscope') || 'mine'), 'format=csv'];
  if (g('rfrom')) p.push('from=' + encodeURIComponent(g('rfrom')));
  if (g('rto'))   p.push('to=' + encodeURIComponent(g('rto')));
  location.href = '/api/approval/requests?' + p.join('&');
};

function itemHtml(r, decidable){
  var late = isOverdue(r);
  // 🧭 «멈춤» — 서버가 결재 가능자 0명이라고 알려 준 내 건. 지연과 다른 사실이라 따로 센다.
  var stop = !decidable && isMine(r) && !!r.blocked;
  var h = '<div class="item' + ((late || stop) ? ' hot' : '') + '" id="req-' + r.id + '">';

  h += '<div class="ihead">';
  h += '<span class="chip">' + esc(typeLabel(r)) + '</span>';
  /* 🏷️ 지출 항목 — «무슨 돈이었나» 를 목록에서 바로 보이게. 없으면 아무것도 안 그린다
     (「항목 없음」이라고 적으면 안 고른 것이 «고장» 처럼 보인다). */
  var catL = EN() ? r.category_en : r.category_ko;
  if (catL) h += '<span class="chip">' + esc(catL) + '</span>';
  if (r.stage_total > 1) {
    h += '<span class="chip">' + esc(T('Step ', '단계 ') + r.stage_seq + '/' + r.stage_total) + '</span>';
  }
  if (late) h += '<span class="chip late">' + esc(T('Overdue', '지연')) + '</span>';
  if (stop) h += '<span class="chip late">' + esc(T('Stopped', '멈춤')) + '</span>';
  if (r.escalated) h += '<span class="chip late">' + esc(T('Escalated', '승격됨')) + '</span>';
  h += '<span class="ititle">' + esc(r.title) + '</span>';
  if (r.amount != null) h += '<span class="iamt">' + esc(money(r.amount, r.currency)) + '</span>';
  h += '</div>';

  h += '<div class="imeta">' + esc(r.requester_name || r.requester_username) +
       ' &middot; ' + esc(when(r.created_at));
  if (!decidable) {
    var st = r.status === 'approved' ? T('Approved', '승인됨')
           : r.status === 'rejected' ? T('Rejected', '반려됨')
           : T('Waiting', '대기 중');
    // 「대기 중」만으로는 며칠이 지났는지 알 수 없다. 숫자를 함께 적는다.
    if (r.status === 'pending') {
      var dw = daysWaiting(r);
      st += ' · ' + (dw <= 0 ? T('today', '오늘')
                             : (EN() ? (dw + (dw === 1 ? ' day' : ' days')) : (dw + '일째')));
    }
    h += ' &middot; ' + esc(st);
  }
  h += '</div>';

  // 🏖️ 휴가는 «언제부터 언제까지» 가 결재의 핵심이다. 요약보다 위에 둔다.
  if (r.date_from) {
    var span = r.date_from + (r.date_to && r.date_to !== r.date_from ? (' ~ ' + r.date_to) : '');
    h += '<div class="isum"><b>' + esc(T('Days off: ', '휴가 기간: ') + span) + '</b></div>';
  }

  var sum = EN() ? r.summary_en : r.summary_ko;
  if (sum) h += '<div class="isum">' + esc(sum) + '</div>';
  else if (r.body) h += '<div class="isum">' + esc(String(r.body).slice(0, 240)) + '</div>';

  if (r.flags && r.flags.length) {
    h += '<div class="flags">';
    for (var i = 0; i < r.flags.length; i++) {
      var f = r.flags[i];
      h += '<div class="flag' + (f.level === 'info' ? ' info' : '') + '">' + esc(EN() ? f.en : f.ko) + '</div>';
    }
    h += '</div>';
  }

  if (r.has_file) {
    h += '<div><a class="lnk" href="/api/approval/requests/' + r.id + '/file">' +
         esc(T('Receipt', '첨부 보기')) + (r.file_name ? ' (' + esc(r.file_name) + ')' : '') + '</a></div>';
  }

  /* 🧭 내가 올린 건은 진행바로 — 「지금 누구 차례이고, 왜 안 움직이는가」가 한눈에 보여야 한다.
     결재함(내가 눌러야 할 것)에는 버튼이 더 중요하므로 예전처럼 한 줄 요약만 남긴다. */
  if (!decidable && isMine(r)) {
    h += trackHtml(r);
    if (stop) h += stuckHtml(r);
  } else if (r.steps && r.steps.length > 1) {
    var parts = [];
    for (var k = 0; k < r.steps.length; k++) {
      var s = r.steps[k];
      var lbl = s.role === 'exec' ? T('Exec', '경영진') : T('Office', '본사');
      var mark = s.status === 'approved' ? 'OK' : s.status === 'rejected' ? 'X'
               : s.status === 'skipped' ? T('skipped', '전결') : s.status === 'active' ? '...' : '-';
      parts.push(lbl + ' ' + mark);
    }
    h += '<div class="steps">' + esc(parts.join('  >  ')) + '</div>';
  }

  if (r.decide_memo) {
    h += '<div class="steps">' + esc(T('Note: ', '메모: ') + r.decide_memo) + '</div>';
  }

  if (decidable) {
    h += '<div class="acts">' +
         '<button class="big ok" onclick="decide(' + r.id + ',\'approved\')">' + esc(T('Approve', '승인')) + '</button>' +
         '<button class="big no" onclick="askWhy(' + r.id + ')">' + esc(T('Reject', '반려')) + '</button>' +
         '</div><div id="why-' + r.id + '"></div>';
  }

  h += '</div>';
  return h;
}

/* ══════════════════════════════════════════════════════════════════════════
   묶어서 승인 — 점검을 모두 통과한 건만.

   왜 «모두» 가 아닌가 — 자동 점검(중복청구·예산초과·첨부누락·금액불일치)에 걸린 건은
   **사람이 봐야 하는 건**이다. 그걸 함께 쓸어 승인해 버리면 점검이 있으나 마나가 된다.
   그래서 경고가 하나도 없는 건만 묶는다. 경고가 붙은 건은 목록에 그대로 남는다.
   ══════════════════════════════════════════════════════════════════════════ */
function cleanOnes(){
  return (D.inbox || []).filter(function(r){
    if (isOverdue(r)) return false;                       // 늦은 건은 눈으로 한 번 보게 한다
    var f = r.flags || [];
    for (var i = 0; i < f.length; i++) if (f[i].level === 'warn') return false;
    return true;
  });
}
function paintBulk(){
  var host = document.getElementById('bulkBox');
  if (!host) return;
  var list = cleanOnes();
  if (list.length < 2) { host.innerHTML = ''; return; }
  host.innerHTML =
    '<div class="why"><b>' +
    esc(T(list.length + ' requests passed every check.', '점검을 모두 통과한 ' + list.length + '건이 있습니다.')) +
    '</b><div class="whybtns"><button onclick="bulkApprove()">' +
    esc(T('Approve all ' + list.length, list.length + '건 한 번에 승인')) +
    '</button></div></div>';
}
var bulkBusy = false;
window.bulkApprove = function(){
  if (bulkBusy) return;
  var list = cleanOnes();
  if (!list.length) return;
  if (!confirm(T('Approve these ' + list.length + ' requests?', '이 ' + list.length + '건을 모두 승인할까요?'))) return;
  bulkBusy = true;
  var i = 0, ok = 0;
  (function step(){
    if (i >= list.length) {
      bulkBusy = false;
      toast(T(ok + ' approved.', ok + '건을 승인했습니다.'));
      repaint();
      load().catch(function(){});
      return;
    }
    var r = list[i++];
    send(r.id, { decision: 'approved', memo: null }).then(function(res){
      if (res.done || res.queued) { ok++; removeLocal(r.id); }
      step();                        // 하나씩 순서대로 — 좁은 회선에서 한꺼번에 던지지 않는다
    });
  })();
};

/* ── 결정 — 누르는 즉시 화면에 반영하고, 실패하면 되돌린다. ──────────────── */
window.decide = function(id, decision, memo){
  var el = document.getElementById('req-' + id);
  if (el) el.className += ' busy';
  var body = { decision: decision, memo: memo || null };

  send(id, body)
    .then(function(res){
      if (res.done) {
        removeLocal(id);
        toast(decision === 'approved' ? T('Approved.', '승인했습니다.') : T('Rejected.', '반려했습니다.'));
        repaint();
        load().catch(function(){});           // 조용히 최신화 (다음 단계가 열렸을 수 있다)
      } else if (res.queued) {
        removeLocal(id);
        toast(T('Saved on this phone — it will be sent when you are back online.',
                '이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.'));
        repaint();
      } else {
        if (el) el.className = el.className.replace(' busy', '');
        toast(res.message || T('Could not send.', '보내지 못했습니다.'));
        load().catch(function(){});
      }
    });
};

/** 서버로 보내기. 네트워크 실패만 큐에 남긴다 — 서버가 «판단해서» 거절한 것은 다시 보내도 소용없다. */
function send(id, body){
  return fetch('/api/approval/requests/' + id + '/decide', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
  .then(function(res){
    // 409 = 그 사이 다른 사람이 이미 결재함. 이미 처리된 것이므로 «성공»으로 친다.
    if (res.status === 409 || (res.j && res.j.error === 'already_decided')) {
      toast(T('Someone already decided this one.', '이미 다른 분이 결재한 건입니다.'));
      return { done: true };
    }
    if (res.j && res.j.ok) return { done: true };
    return { done: false, message: (res.j && (EN() ? res.j.message_en : res.j.message)) || null };
  })
  .catch(function(){
    outboxAdd({ id: id, body: body });
    return { queued: true };
  });
}

function removeLocal(id){
  if (!D) return;
  var f = function(a){ return (a || []).filter(function(x){ return x.id !== id; }); };
  D.inbox = f(D.inbox);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
}

/* ── 못 보낸 결재 큐 — teacher.html 의 검증된 패턴 ────────────────────────── */
var OUTBOX_KEY = 'mangoi_work_outbox_v1';

/* ── 🚪 로그아웃 ───────────────────────────────────────────────────────────
   세션 정본은 HttpOnly 쿠키라 JS 로 못 지운다 — 서버 POST 뿐(옛 /admin/logout 은 죽은 경로).
   🔴 캐시(mangoi_work_home_v1)에는 신청자 이름·사유·금액이 있다 → 공용 PC 대비로 지운다.
   ⛔ 못 보낸 결재·초안은 **지우지 않는다** — 아직 서버에 없어서 지우면 그대로 사라진다.
      대신 남아 있으면 먼저 알린다(로그아웃하면 자동 전송이 못 돈다).
   배경·버린 방법: docs/작업기록/260821_로그아웃이_서버세션을_안끊던_네곳.md */
document.getElementById('logoutBtn').onclick = function(){
  var pending = 0;
  try { pending = (JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]') || []).length; } catch (e) {}
  if (pending && !confirm(T(
        'You have ' + pending + ' decision(s) not yet sent. They stay on this device but cannot be sent after you log out. Log out anyway?',
        '아직 보내지 못한 결재가 ' + pending + '건 있습니다. 이 기기에는 남지만 로그아웃하면 보낼 수 없습니다. 그래도 로그아웃할까요?'))) return;
  var btn = this;
  btn.disabled = true;
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  var go = function(){ location.href = '/admin/login.html'; };
  // 서버 호출이 실패해도 로그인 화면으로 보낸다 — 여기서 멈추면 로그아웃한 줄 알고 자리를 뜬다.
  fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }).then(go, go);
};
function outboxRead(){
  try { var a = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function outboxWrite(a){
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(a.slice(-50))); } catch (e) {}
  paintOutbox();
}
function outboxAdd(entry){
  var a = outboxRead().filter(function(x){ return x.id !== entry.id; });   // 마지막 것이 이긴다
  a.push(entry);
  outboxWrite(a);
}
function paintOutbox(){
  var el = document.getElementById('outboxNote');
  var n = outboxRead().length;
  el.hidden = !n;
  if (n) el.textContent = T(n + ' decision(s) saved on this phone — they will be sent automatically when you are back online.',
                            '보내지 못한 결재 ' + n + '건을 이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.');
}
var flushing = false;
function outboxFlush(){
  if (flushing) return;
  var a = outboxRead();
  if (!a.length) return;
  flushing = true;
  var e0 = a[0];
  fetch('/api/approval/requests/' + e0.id + '/decide', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(e0.body)
  })
  .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
  .then(function(res){
    // 성공이거나, 이미 처리됐거나(409), 서버가 판단해서 거절한 것 → 큐에서 뺀다.
    // 네트워크 실패만 남긴다. 안 그러면 영영 안 되는 것을 영원히 재시도한다.
    var drop = (res.j && res.j.ok) || res.status === 409 || (res.status >= 400 && res.status < 500);
    if (drop) outboxWrite(outboxRead().slice(1));
    flushing = false;
    if (outboxRead().length) outboxFlush(); else load().catch(function(){});
  })
  .catch(function(){ flushing = false; });     // 아직 끊겨 있다 — 다음 기회에
}

/* ══════════════════════════════════════════════════════════════════════════
   💼 인사·급여 «월 확정» — 여기서는 **아무것도 타이핑하지 않는다.**

   달과 종류(급여/평가)만 고르면, 금액·인원은 **서버가 급여·평가 표를 읽어서** 채운다.
   그래서 «올릴 때 숫자를 잘못 적는» 사고가 구조적으로 일어날 수 없다.
   이미 확정된 달은 눌리지 않게 막고, 누가 언제 확정했는지 함께 보여 준다.
   ══════════════════════════════════════════════════════════════════════════ */
function paintHrForm(host){
  var P = (D && D.hr_periods) || null;
  var h = '<div class="help">' +
    esc(T('Pick what to confirm and which month. The figures are read from the payroll and evaluation screens — you type nothing.',
          '무엇을, 어느 달을 확정할지 고르세요. 금액·인원은 급여·평가 화면에서 그대로 읽어 옵니다 — 직접 적지 않습니다.')) +
    '</div>';

  if (!P || ((!P.payroll || !P.payroll.length) && (!P.evaluation || !P.evaluation.length))) {
    h += '<div class="empty">' + esc(T('No month has payroll or evaluation data yet.',
                                       '급여·평가 자료가 있는 달이 아직 없습니다.')) + '</div>';
    h += '<div class="acts"><button class="big no" type="button" onclick="pick(\'hr\')">' +
         esc(T('Close', '닫기')) + '</button></div>';
    host.innerHTML = h;
    return;
  }

  var block = function(kind, label, list){
    if (!list || !list.length) return '';
    var s = '<div class="row"><label>' + esc(label) + '</label><div class="reuse">';
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.approved) {
        // 이미 확정된 달 — 누르지 못하게 하고, 누가 확정했는지 보여 준다.
        s += '<button type="button" disabled style="opacity:.55">' +
             esc(m.label + ' · ' + m.hint + ' — ' +
                 T('confirmed by ' + (m.approved_by || ''), '확정됨 (' + (m.approved_by || '') + ')')) +
             '</button>';
      } else {
        s += '<button type="button" onclick="submitHr(' +
             JSON.stringify(kind).replace(/"/g, '&quot;') + ',' +
             JSON.stringify(m.period).replace(/"/g, '&quot;') + ')">' +
             esc(m.label + ' · ' + m.hint) + '</button>';
      }
    }
    return s + '</div></div>';
  };

  h += block('payroll', T('Payroll', '급여 확정'), P.payroll);
  h += block('evaluation', T('Teacher evaluations', '인사평가 확정'), P.evaluation);
  h += '<div class="help" id="autoNote"></div>';
  h += '<div class="acts"><button class="big no" type="button" onclick="pick(\'hr\')">' +
       esc(T('Cancel', '취소')) + '</button></div>';
  host.innerHTML = h;
}

/** 달 버튼을 누르면 그대로 올라간다 — 확인 한 번만 받는다. */
window.submitHr = function(kind, period){
  var what = (kind === 'payroll') ? T('payroll', '급여') : T('evaluations', '인사평가');
  if (!confirm(T('Submit ' + period + ' ' + what + ' for approval?',
                 period + ' ' + what + ' 확정을 결재로 올릴까요?'))) return;
  note(T('Reading the figures...', '숫자를 읽는 중...'));

  var fd = new FormData();
  fd.append('client_key', CKEY || (CKEY = newKey()));
  fd.append('req_type', 'hr');
  fd.append('hr_kind', kind);
  fd.append('period', period);

  fetch('/api/approval/requests', { method: 'POST', credentials: 'same-origin', body: fd })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
    .then(function(res){
      if (res.j && res.j.ok) {
        toast(res.j.duplicate
          ? T('Already submitted.', '이미 올라간 건입니다.')
          : T('Submitted. The figures were filled in by the server.', '올렸습니다. 숫자는 서버가 채웠습니다.'));
        closeForm();
        load().catch(function(){});
      } else {
        // 409 = 그 사이 다른 사람이 이미 확정한 달
        toast((res.j && (EN() ? res.j.message_en : res.j.message)) ||
              T('Could not submit.', '올리지 못했습니다.'));
        load().catch(function(){});
      }
    })
    .catch(function(){
      note('');
      toast(T('Could not send — check your connection and try again.',
              '보내지 못했습니다 — 연결을 확인하고 다시 시도해 주세요.'));
    });
};

function paintForm(){

  if (!PICK) { host.hidden = true; host.innerHTML = ''; return; }

  // 💼 인사·급여는 폼이 아니라 «달 고르기» 다. 타이핑 칸이 아예 없다.
  if (PICK.picks_period) { paintHrForm(host); return; }

       말인지 알 수 없다. ⚠️ 서버가 받는 형식은 사진(jpg·png·webp)과 PDF 뿐이다

  }
  h += '<button type="button" id="b_voice" onclick="voice()">' +
       esc(T('Speak it (English)', '말로 입력 (영어)')) + '</button>';
  h += '</div>';
  // ⚠️ capture 속성을 쓰지 않는다 — 붙이면 휴대폰이 카메라만 열고 **앨범을 못 고르게** 막는다.
  //    영수증을 미리 찍어 둔 경우가 실제로 더 많다. 카메라는 파일 선택창에서 그대로 고를 수 있다.

  // 🏖️ 휴가는 기간을 받는다. 승인되는 순간 그 기간 예약이 실제로 막힌다 —

         '<input type="date" id="f_to">' +

                                      '하루면 비워 두세요. 승인되면 이 기간에는 수업 예약이 막힙니다.')) + '</div></div>';

         '</div></div>';
    h += '<div class="row"><label>' + esc(T('Date spent', '지출일')) + '</label>' +
         '<input type="date" id="f_spent"></div>';

     ⚠️ 안 고르고도 올릴 수 있다(«고르세요» 가 기본값) — 못 고르면 결재를 못 올리는

           '<select id="f_cat">' + co + '</select>' +

  h += '<div class="row"><label>' + esc(T('Detail', '내용')) + '</label>' +
       '<textarea id="f_body" maxlength="4000"></textarea></div>';

  h += '<div class="acts">' +
       '<button class="big ok" type="button" id="b_submit" onclick="submitReq()">' + esc(T('Submit', '올리기')) + '</button>' +
       '<button class="big no" type="button" onclick="pick(' + JSON.stringify(PICK.key).replace(/"/g, '&quot;') + ')">' +
       esc(T('Cancel', '취소')) + '</button></div>';

  host.innerHTML = h;
  // 챙겨 둔 값을 그대로 돌려놓는다.
  setVal('f_title', keep.t); setVal('f_amount', keep.a);
  setVal('f_body', keep.b); setVal('f_spent', keep.s);
  setVal('f_from', keep.df); setVal('f_to', keep.dt);
  setVal('f_cat', keep.c);
