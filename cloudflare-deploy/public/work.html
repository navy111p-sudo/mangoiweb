<!-- 한자 글꼴 통일 — 화면마다 한자가 다른 모양으로 뜨는 것을 막는다(test-harness/hanzi_font_harness).
     unicode-range 가 한자 대역으로 제한돼 있어, 한자가 실제로 나올 때만 내려받는다.
     즉 한국어·영어만 쓰는 이 화면에서는 요청이 0건이라 «외부 리소스 0개» 계약과 충돌하지 않는다. -->
<style>@font-face{font-family:'MangoiHanSC';src:url('/fonts/mangoi-han-sc.woff2') format('woff2');font-weight:100 900;font-display:swap;unicode-range:U+2E80-2EFF,U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF,U+0100-017F,U+01CD-01DC;}</style>
<title>Approvals · Mangoi</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════
  🧾 결재함 — 초경량 전용 화면  (2026-08-16)

  왜 만들었나 — 실측 근거
    결재 API(src/api-approval.ts)는 2026-08-05 부터 있었다. 그런데 결재함 UI 가
    **강사 화면 teacher.html(192KB) 안**에 들어 있었고, 강사는 정작 403 이라 못 본다.
    그리고 결재를 가장 많이 올리는 필리핀 매니저 전용 화면 manager.html(72KB)에는
    **결재 코드가 0줄**이었다(grep approval = 0).
      → 매니저는 결재 한 건 올리려고 자기 경량 화면을 나가서 10배 무거운 강사 화면을
        받아야 했다. 「경로가 복잡하다」는 지적의 실체가 이것이다.
    이 화면은 그 경로를 «로그인 → 여기» 한 걸음으로 만든다.

  ⚠️ 설계 계약 — manager.html · teacher.html 과 동일하다. 깨는 순간 존재 이유가 사라진다.
     1. 외부 리소스 0개. link·script src·웹폰트·CDN·아이콘팩 전부 금지.
     2. 애니메이션·transition 금지. 저사양 기기에서 렉이고, 백그라운드 탭에서 멈춰
        요소가 영영 안 보이는 사고가 난다(과거 실사고).
     3. 첫 화면은 API **1회**로 끝낸다(/api/approval/home 이 결재함 전체를 한 번에 준다).
        회선이 느린 필리핀에서 왕복 횟수가 곧 체감 속도다.
     4. 이모지 금지 — Win10·매니저 단말에서 두부(□)로 뜬다. 표시는 글자와 CSS 로만.
     5. 한/영은 사전 파일이 아니라 data-en/data-ko 속성으로. 기본은 영어(필리핀 다수).
        ⚠️ JS 로 그리는 라벨은 data-en/data-ko 도 같이 갱신해야 언어 전환이 안 깨진다
           (CLAUDE.md 함정 — textContent 대입은 i18n 루프가 못 고친다).
     6. 어두운 화면은 버튼으로만. 낮/밤 자동전환 금지(2026-07-18 사장님 요청).

  자동화 — 「사람은 판단만, 손가락은 클릭만」
     · 영수증 사진 → 서버가 금액·날짜·상점을 읽어 칸을 채운다. 사람은 «맞나» 보고 누른다.
     · 음성(영어) → 받아쓰기 → 제목·분류·금액 초안. 역시 고칠 수 있는 «초안»이다.
     · 반려 사유도 버튼 3개. 타이핑은 필요할 때만.
     ⚠️ 전부 실패해도 직접 입력 경로가 그대로 남는다 — 자동화는 «빠른 길»이지 «유일한 길»이 아니다.

  끊김 대응(필리핀 — 아픈 건 «느린 것»이 아니라 «끊기는 것»: 정전·태풍)
     · 마지막 목록을 기기에 저장해 두고 열자마자 먼저 그린다.
     · 승인·반려가 전송에 실패하면 큐에 담아 두고 연결되면 자동으로 다시 보낸다.
       서버가 «이미 결재됨(409)»을 주면 성공으로 친다 — 두 번 처리되지 않는다.
       (teacher.html 의 검증된 outbox 패턴을 그대로 가져왔다)

  세션: 기존 관리자와 동일한 HttpOnly 쿠키. 별도 로그인 없음.
  ══════════════════════════════════════════════════════════════════════════════
-->
<script>
/* 저장된 어두운 화면을 첫 그리기 «전»에 적용 — 깜빡임 방지. manager.html 과 같은 키를 쓴다. */
try{if(localStorage.getItem('mangoi_manager_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}
</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
html,body{margin:0;padding:0}
body{
  font-family:MangoiHanSC,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Malgun Gothic",Arial,sans-serif;
  font-size:17px;line-height:1.5;color:#16202c;background:#f4f6f8;

}

/* ── 머리말 ─────────────────────────────────────────────── */
.top{background:#fff;border-bottom:1px solid #dde3ea;padding:10px 14px}
/* 🖥 넓은 PC 에서 제목·버튼이 화면 왼쪽 끝에 붙고 본문만 가운데로 가서 어긋나 보였다
      (2026-08-17 사장님 화면 1920px 에서 확인). 휴대폰에서는 둘 다 꽉 차서 티가 안 났다.
      띠 배경은 그대로 화면 전체를 쓰고, **안쪽 내용만** 본문과 같은 폭·같은 축으로 맞춘다.
      ⚠️ .wrap 의 max-width 를 바꾸면 여기도 같이 바꿔야 한다. 두 값은 늘 같아야 한다. */
.top>h1,.top>.tbar{max-width:1100px;margin-left:auto;margin-right:auto}
.offbar,.outbox{padding-left:max(14px,calc((100% - 1100px) / 2))}
html.dark .top{background:#16202c;border-bottom-color:#26313f}
.top h1{margin:0 auto 8px;font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbar{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{
  font:inherit;font-size:13px;padding:7px 11px;border:1px solid #ccd4de;background:#fff;color:#16202c;
  border-radius:7px;cursor:pointer;min-height:36px
}
html.dark .tbtn{background:#1d2836;border-color:#33404f;color:#e6edf3}
.tbtn:hover{background:#eef2f6}
html.dark .tbtn:hover{background:#26313f}
.tbtn-out{color:#a4341f;border-color:#e0b6ad}
html.dark .tbtn-out{color:#f0907c;border-color:#5a3129}
a.tbtn{text-decoration:none;display:inline-block;line-height:22px}

.badge{
  display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:20px;
  background:#0b6e63;color:#fff;vertical-align:middle
}
.badge.zero{background:#8894a4}
.badge.late{background:#a4341f}

/* ── 끊김 표시 ──────────────────────────────────────────── */
.offbar{display:none;background:#fbeed2;color:#6b4a08;padding:8px 14px;font-size:13.5px;border-bottom:1px solid #e6d3a4}
body.is-off .offbar{display:block}
html.dark .offbar{background:#3a2c10;color:#f0cf8a;border-bottom-color:#5a4620}
/* ⚠️ 여기에 display:none 을 쓰지 말 것. 이 띠는 hidden 속성으로 켜고 끈다.
   작성자 CSS 가 display 를 정하면 [hidden] 을 이겨서, hidden=false 로 바꿔도 영영 안 보인다
   (CLAUDE.md 함정 — teacher.html 에서 같은 사고가 있었다. 2026-08-16 실측으로 여기서도 확인).
   실제로 이 줄 때문에 «보내지 못한 결재가 저장됐다» 는 안내가 한 번도 뜨지 않았다. */
.outbox{background:#dcece9;color:#0b5147;padding:8px 14px;font-size:13.5px;border-bottom:1px solid #b6d5cf}
html.dark .outbox{background:#12332f;color:#7fd6c8;border-bottom-color:#215048}

/* ── 본문 ───────────────────────────────────────────────── */
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 60px}
/* 🔠 구역 제목 (2026-09-09 사장님 지시) — 옛 값은 15px·700·#4a5765 였다.
   그때 본문이 16px 이었으니 제목이 본문보다 «작았고» 회청색이라 제목으로 안 읽혔다.
   브라우저 실측 대비 6.82:1 → 16.38:1 (라이트) · 8.19:1 → 14.37:1 (다크).
   지금은 21px·800·먹색 + 왼쪽 초록 막대로 구역을 나눈다.
   ⚠️ ::before 는 이 flex 상자의 «첫 칸» 이 된다 — gap:8px 이 그대로 붙는다.
   ⚠️ display:flex 라서 이 파일 위쪽의 [hidden]{display:none!important} 한 줄이 «있어야만»
        감춘 제목(#urgentHead·#ackHead)이 실제로 숨는다. 그 줄을 지우면 «확인할 것» 이 늘 보인다. */
h2{margin:30px 0 8px;font-size:21px;font-weight:800;color:#101828;display:flex;align-items:center;gap:8px;
   padding-bottom:6px;border-bottom:1px solid #e3e9ee}
h2::before{content:"";flex:0 0 auto;width:4px;align-self:stretch;border-radius:2px;background:#0b6e63}
/* ⚠️ 다크에서 막대를 #0b6e63 그대로 두면 배경(#0f1620) 대비 2.96:1 이라 안 보인다 —
      막대의 존재 이유가 «구역을 나누는 것» 이므로 밝은 쪽으로 바꾼다(10.2:1). */
html.dark h2{color:#dbe6f2;border-bottom-color:#2f3d4d}
html.dark h2::before{background:#6fd3ad}
.empty{color:#7b8794;font-size:14px;padding:14px 2px}
/* 🚫 결재함을 쓸 수 없는 계정(지사·대리점) — showNoAccess() 가 붙인다 */
body.no-access .wrap > *:not(#noAccess){display:none !important}
#noAccess{border:1px solid #e0b6ad;background:#fff7f5;color:#5a2118;border-radius:10px;padding:16px 16px;margin:18px 0;line-height:1.65;font-size:15px}
html.dark #noAccess{background:#2a1a17;border-color:#5a3129;color:#f3d6cf}
#noAccess .na-t{font-weight:800;font-size:17px;margin-bottom:6px}
#noAccess .na-l{margin:4px 0}
#noAccess .na-a{margin-top:12px}
html.dark .empty{color:#8b98a8}

/* ── 결재 한 줄 ─────────────────────────────────────────── */
.item{background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:12px 14px;margin-bottom:9px}
html.dark .item{background:#16202c;border-color:#26313f}
.item.hot{border-left:4px solid #a4341f}
.item.busy{opacity:.5}
.ihead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:3px}
.chip{
  font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:#e8eef4;color:#42536a;white-space:nowrap
}
html.dark .chip{background:#233043;color:#a8bcd2}
.chip.warn{background:#fbeed2;color:#7a5406}
html.dark .chip.warn{background:#3a2c10;color:#f0cf8a}
.chip.late{background:#f7dfdc;color:#8e2b20}
html.dark .chip.late{background:#3a1a16;color:#f0907c}
.ititle{font-weight:650;font-size:17px;flex:1;min-width:140px;word-break:break-word}
.iamt{font-weight:700;font-size:17.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.imeta{font-size:13px;color:#6b7785;margin-bottom:5px}
html.dark .imeta{color:#8b98a8}
.isum{font-size:14px;color:#2f3d4d;margin:5px 0;line-height:1.55}
html.dark .isum{color:#c3cfdb}
.flags{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.flag{font-size:13px;padding:5px 9px;border-radius:6px;background:#fbeed2;color:#6b4a08}
html.dark .flag{background:#3a2c10;color:#f0cf8a}
.flag.info{background:#e8eef4;color:#42536a}
html.dark .flag.info{background:#233043;color:#a8bcd2}
.steps{font-size:12.5px;color:#7b8794;margin-top:4px}
html.dark .steps{color:#8b98a8}
/* 💳 «대신 결재» 접힘 안내 — 승인 버튼을 안 그린 «유일한 설명» 이라 다른 안내보다 진하다.
   흐린 회색(#7b8794)은 흰 카드 위 대비 3.66 으로 본문 기준(4.5)에 못 미쳤다.
   ⛔ .steps 전체를 진하게 바꾸지 말 것 — 나머지 안내의 무게까지 함께 올라간다. */
.proxynote{color:#667085}
html.dark .proxynote{color:#aab6c4}

/* 📂 결재 문서함 (2026-09-04) — 지난 결재 찾기.
   ⚠️ 이 주석에 CJK 홑낫표를 쓰지 말 것 — style 안에 있으면 한자 폰트 검사가 잡는다. */
/* ⚠️ h2 가 display:flex 라 float 은 «무시된다»(표준). 오른쪽 정렬은 margin-left:auto 로.
      폭이 1100px 로 넓어지면서 버튼이 제목 옆에 붙어 있는 것이 눈에 띄었다. */
h2 .findtoggle{
  margin-left:auto; font-size:13px; font-weight:600; padding:5px 11px; border-radius:7px;
  border:1px solid #bcc6d2; background:#fff; color:#2f3d4d; cursor:pointer
}
html.dark h2 .findtoggle{background:#16202c;border-color:#33414f;color:#c3cfdb}
h2 .findtoggle[aria-expanded="true"]{border-color:#0f6b4f;color:#0f6b4f;background:#eaf6f1}
html.dark h2 .findtoggle[aria-expanded="true"]{background:#102b22;color:#6fd3ad}
.findpanel{
  background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:11px 12px;margin-bottom:9px
}
html.dark .findpanel{background:#16202c;border-color:#26313f}
/* 결재 보관함(시안 A, 2026-09-08) — 왼쪽 함 트리 + 오른쪽 표.
   그룹웨어(카카오워크·다우오피스)처럼 함이 곧 «보는 방식» 이다. 폰(720px 아래)에서는
   함을 가로로 굴리는 칩 줄로 접는다 — 왼쪽 기둥으로 두면 표가 3분의 2 폭이 된다. */
.findlay{display:grid;grid-template-columns:184px minmax(0,1fr);gap:12px;align-items:start}
.findmain{min-width:0}
.findbox{
  border:1px solid #e3e8ee;border-radius:9px;background:#f8fafc;padding:8px 6px;
  font-size:13.5px;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto
}
html.dark .findbox{background:#101a24;border-color:#26313f}
.fbgrp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7785;margin:10px 8px 3px}

.fbitem{

  border-radius:7px;padding:6px 8px;cursor:pointer;line-height:1.35
}

.fbitem:hover{background:#fff}
html.dark .fbitem:hover{background:#16202c}

html.dark .fbitem.on{background:#16202c;border-color:#33414f}
.fbitem .fbn{font-size:12px;color:#6b7785;font-variant-numeric:tabular-nums;flex:0 0 auto}
html.dark .fbitem .fbn{color:#8b98a8}
.fbitem.on .fbn{color:#0f6b4f}
html.dark .fbitem.on .fbn{color:#6fd3ad}
.fbclear{display:block;width:100%;margin-top:8px;font:inherit;font-size:12.5px;color:#4a5765;background:transparent;border:1px dashed #bcc6d2;border-radius:7px;padding:5px 8px;cursor:pointer}

.fbnote{font-size:12px;color:#7b8794;margin:6px 8px 2px}

  html.dark .fbitem.on{color:#6fd3ad;border-color:#0f6b4f}

/* 📊 지출 정리. ⚠️ 여기 주석에는 CJK 홑낫표를 쓰지 않는다 —
   한자 폰트 검사가 style 안의 그 글자를 세어 983KB 폰트를 받는 화면으로 본다. */
.repcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin-bottom:10px}
.repcard{border:1px solid #dde3ea;border-radius:8px;padding:9px 11px;background:#f8fafc;min-width:0}
html.dark .repcard{background:#101a24;border-color:#26313f}

html.dark .repcard .rl{color:#8b98a8}
.repcard .rv{font-size:17px;font-weight:700;color:#101828;line-height:1.25;word-break:break-word}
html.dark .repcard .rv{color:#e8eef5}
.repcard .rn{font-size:12px;color:#7b8794;margin-top:2px}
/* 소제목도 «제목» 이다 — 2026-09-09 에 h2 를 고치면서 여기가 옛 값(13px·700·#4a5765)으로
   남아 있었다. h2(21px)보다는 작게 두되 색·무게는 같은 기준으로 맞춘다. */
.repsec{font-size:15px;font-weight:800;color:#101828;margin:14px 0 5px}
html.dark .repsec{color:#dbe6f2}
/* 표는 상자 안에서 굴린다 — 문서가 옆으로 밀리면 폰에서 화면 전체가 흔들린다 */
.reptbl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.reptbl td{padding:7px 4px;border-top:1px solid #eef1f5;vertical-align:top}
html.dark .reptbl td{border-color:#222d3a}
.reptbl tr.dim td{color:#7b8794}
.reptbl .rc{color:#101828}
html.dark .reptbl .rc{color:#dbe4ee}
.reptbl .rq{width:56px;text-align:right;color:#6b7785;white-space:nowrap}
.reptbl .rm{width:44%;text-align:right;font-weight:650;color:#101828;word-break:break-word}
html.dark .reptbl .rm{color:#e8eef5}
.racct{display:block;font-size:11.5px;color:#8b98a8;margin-top:1px}
.repgap{
  margin-top:11px;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.55;
  background:#fff8e6;border:1px solid #f0d9a0;color:#5c4708
}
html.dark .repgap{background:#2a2109;border-color:#5c4708;color:#f0d9a0}
/* 🧭 맨 위 요약. 주석에 CJK 홑낫표를 쓰지 않는다(한자 폰트 검사). */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));gap:8px;margin-bottom:12px}
.tile{
  border:1px solid #dde3ea;border-radius:9px;padding:9px 11px;background:#fff;min-width:0;
  font:inherit;text-align:left;cursor:pointer;color:inherit
}
html.dark .tile{background:#16202c;border-color:#26313f}
.tile:disabled{cursor:default}
/* ⚠️ 색을 옅게 두지 말 것 — .tn 이 «전체 / 내가 올린 것»(어느 범위인지)과
   「금액 없음 N건」을 적는 줄이다. 안 읽히면 그 타일의 숫자가 무슨 범위인지 알 수 없다.
   2026-09-04 실측: 옛 색은 흰 카드 3.66 · hot 카드 3.46 · 다크 4.49 로 전부 미달이었다. */
.tile .tl{font-size:12.5px;color:#5a6673;margin-bottom:3px;display:block}
html.dark .tile .tl{color:#9db0c4}
.tile .tv{font-size:23px;font-weight:750;color:#101828;line-height:1.2;display:block;word-break:break-word}
html.dark .tile .tv{color:#e8eef5}
.tile .tn{font-size:12px;color:#5a6673;margin-top:2px;display:block;line-height:1.45}
/* 📏 아주 좁은 폰에서만 타일 숫자를 한 단계 내린다 (2026-09-09).
   23px 이면 8자리 원화가 «숫자 한가운데» 에서 끊긴다 — .tv 에 word-break:break-word 가
   있어 «₩12,345,67 / 8» 이 된다. 금액이 끊기면 자릿수를 잘못 세므로 «크게» 보다 «안 끊기게» 가 먼저다.
   실측(₩12,345,678 · 줄 수): 320~350px 에서 23px=2줄 · 20px=1줄, 360px 이상은 23px 도 1줄.
   ⚠️ 잘림 검사(scrollWidth>clientWidth)로는 이 사고가 원리상 «안 보인다» — 잘리는 게 아니라
      흐르기 때문이다. 확인은 «칸 높이 ÷ lineHeight» 로 줄 수를 세는 것뿐이다. */
@media (max-width:359px){ .tile .tv{font-size:20px} }
html.dark .tile .tn{color:#9db0c4}
/* 결재 보관함 타일 — 다른 넷과 «같은 물건» 이지만 여는 문이라 색을 한 톤 다르게 */
.tile.arch{border-color:#9fc7b6;background:#f2faf6}
html.dark .tile.arch{background:#0f2a21;border-color:#215e49}
.tile.arch .tl,.tile.arch .tn{color:#2f5f4c}
html.dark .tile.arch .tl,html.dark .tile.arch .tn{color:#9fd3bc}
.tile.hot{border-color:#e6a23c;background:#fff8e6}
html.dark .tile.hot{background:#2a2109;border-color:#5c4708}
/* hot 카드는 바탕이 옅은 앰버라 더 진해야 한다 */
.tile.hot .tl,.tile.hot .tn{color:#54492e}
html.dark .tile.hot .tl,html.dark .tile.hot .tn{color:#d9c9a3}
.topstop{
  border:1px solid #e0a1a1;background:#fdf1f1;border-radius:9px;padding:11px 12px;margin-bottom:10px;
  font-size:13.5px;line-height:1.6;color:#7a1c1c
}
html.dark .topstop{background:#2a1212;border-color:#6b2626;color:#f3b7b7}
.topstop b{display:block;margin-bottom:3px;font-size:14px}
.topstop .ts-go{
  display:inline-block;margin-top:6px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;
  padding:7px 11px;border-radius:7px;border:1px solid #b3261e;background:#fff;color:#b3261e
}
html.dark .topstop .ts-go{background:#3a1a1a;color:#f3b7b7;border-color:#8c3a3a}
.repnote{font-size:11.5px;color:#7b8794;margin-top:4px;line-height:1.5}
html.dark .repnote{color:#8b98a8}
.repgap b{display:block;margin-bottom:3px}
.repgap div{margin-top:2px}
.findrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.findrow:last-of-type{margin-bottom:0}
.findinput{
  flex:1;min-width:170px;padding:9px 11px;font-size:15px;border-radius:7px;
  border:1px solid #bcc6d2;background:#fff;color:#101828
}
html.dark .findinput{background:#0f1922;border-color:#33414f;color:#e8eef5}
.findsel,.finddate{
  padding:8px 9px;font-size:14px;border-radius:7px;border:1px solid #bcc6d2;
  background:#fff;color:#2f3d4d;max-width:100%
}
html.dark .findsel,html.dark .finddate{background:#0f1922;border-color:#33414f;color:#c3cfdb}
.findlab{font-size:12.5px;color:#7b8794}
html.dark .findlab{color:#8b98a8}
.findgo{
  padding:9px 15px;font-size:14px;font-weight:600;border-radius:7px;border:0;
  background:#0f6b4f;color:#fff;cursor:pointer
}
.findcsv{
  margin-left:auto;padding:8px 13px;font-size:13px;font-weight:600;border-radius:7px;
  border:1px solid #0f6b4f;background:#fff;color:#0f6b4f;cursor:pointer
}
html.dark .findcsv{background:#16202c}
.findmore{
  display:block;width:100%;margin-top:8px;padding:11px;font-size:14px;font-weight:600;
  border-radius:8px;border:1px solid #bcc6d2;background:#fff;color:#2f3d4d;cursor:pointer
}
html.dark .findmore{background:#16202c;border-color:#33414f;color:#c3cfdb}
.findnote{font-size:13px;color:#7b8794;padding:9px 2px}
html.dark .findnote{color:#8b98a8}

/* 🧭 진행 추적 (2026-09-04) — «올렸는데 어떻게 됐지» 에 답하는 줄.
   내가 올린 건에만 그린다. 결재함(내가 누를 것)에는 버튼이 더 중요하므로 그리지 않는다.
   ⚠️ 이 주석에 CJK 홑낫표를 쓰지 말 것 — style 안에 있으면 한자 폰트 검사가 잡는다. */
.trk{display:flex;align-items:flex-start;margin:10px 0 2px}
.trkS{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.trkB{width:13px;height:13px;border-radius:50%;border:2px solid #cfd8e2;background:#fff;z-index:1;flex:0 0 auto}
html.dark .trkB{border-color:#3a4653;background:#16202c}
.trkL{font-size:11px;color:#7b8794;text-align:center;line-height:1.4;word-break:keep-all}
html.dark .trkL{color:#8b98a8}
.trkBar{position:absolute;top:5px;left:50%;width:100%;height:3px;background:#e3e9ef;z-index:0}
html.dark .trkBar{background:#2a3542}
.trkS:last-child .trkBar{display:none}
.trkS.done .trkB{background:#1c7a45;border-color:#1c7a45}
.trkS.done .trkBar{background:#1c7a45}
.trkS.done .trkL{color:#2f3d4d;font-weight:600}
html.dark .trkS.done .trkL{color:#c3cfdb}
.trkS.now .trkB{background:#b06a06;border-color:#b06a06;box-shadow:0 0 0 4px #fbeed2}
html.dark .trkS.now .trkB{box-shadow:0 0 0 4px #3a2c10}
.trkS.now .trkL{color:#7a5406;font-weight:600}
html.dark .trkS.now .trkL{color:#f0cf8a}
.trkS.no .trkB{background:#a4341f;border-color:#a4341f}
.trkS.no .trkL{color:#8e2b20;font-weight:600}
html.dark .trkS.no .trkL{color:#f0907c}
.trkS.stop .trkB{background:#a4341f;border-color:#a4341f;box-shadow:0 0 0 4px #f7dfdc}
html.dark .trkS.stop .trkB{box-shadow:0 0 0 4px #3a1a16}
.trkS.stop .trkL{color:#8e2b20;font-weight:700}
html.dark .trkS.stop .trkL{color:#f0907c}

/* 🔴 «기다려도 처리되지 않습니다» — 결재할 수 있는 사람이 0명일 때만 나온다.
   ⛔ «대기 중» 이라고만 적지 말 것. 그래서 5일을 그냥 기다린 건이 있었다(2026-08-30). */
.stuck{border:1px solid #a4341f;background:#f7dfdc;color:#7a2418;border-radius:7px;
       padding:9px 11px;margin-top:8px;font-size:13px;line-height:1.6}
html.dark .stuck{background:#3a1a16;border-color:#a4341f;color:#f0b6a8}
.stuck b{font-weight:700}

/* ── 결정 버튼 — 크게, 둘만 ─────────────────────────────── */
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.big{
  font:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;min-height:48px;flex:1;min-width:120px
}
.ok{background:#0b6e63;color:#fff}
.ok:hover{background:#095b52}
.no{background:#fff;color:#a4341f;border-color:#e0b6ad}
html.dark .no{background:#1d2836;border-color:#5a3129;color:#f0907c}
.no:hover{background:#f9ecea}
html.dark .no:hover{background:#3a1a16}
.lnk{font-size:13.5px;color:#0b6e63;text-decoration:underline;text-underline-offset:2px}
html.dark .lnk{color:#4fc0b0}

/* 반려 사유 — 버튼으로. 타이핑은 필요할 때만 */
.why{margin-top:9px;padding:10px;border:1px dashed #ccd4de;border-radius:8px}
html.dark .why{border-color:#33404f}
.why b{display:block;font-size:13px;margin-bottom:7px;color:#4a5765}
html.dark .why b{color:#9fb0c2}
.whybtns{display:flex;gap:6px;flex-wrap:wrap}
.whybtns button{font:inherit;font-size:13.5px;padding:9px 12px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:42px;color:#16202c}
html.dark .whybtns button{background:#1d2836;border-color:#33404f;color:#e6edf3}

/* ↩️🔁 내가 올린 건에 손대는 작은 버튼들 — 회수 · 다시 올리기 · 취소 요청.
   ⚠️ 글자는 16px 아래로 내리지 않는다(iOS 가 누를 때 화면을 확대한다).
   ⚠️ 터치 표적은 44px 이상. 폰에서 결재함을 스크롤하며 누르는 자리다. */
.mineacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.mineacts-note{font-size:13px;color:#667085;line-height:1.3}
html.dark .mineacts-note{color:#98a2b3}
.mini{
  font:inherit;font-size:16px;padding:10px 13px;border:1px solid #ccd4de;background:#fff;
  border-radius:7px;cursor:pointer;min-height:44px;color:#16202c
}
.mini:hover{background:#f3f6f9}
html.dark .mini{background:#1d2836;border-color:#33404f;color:#e6edf3}
html.dark .mini:hover{background:#243244}
/* 🗑️ 되돌릴 수 없는 조작 — 색으로도 구분한다. 반려 버튼(.no)과 같은 계열.
   ⚠️ 대비를 4.5 이상으로 (밝은 빨강 위 흰 글자는 안 읽힌다). */
.mini.danger{color:#a4341f;border-color:#e0b6ad}
.mini.danger:hover{background:#f9ecea}
html.dark .mini.danger{color:#f0907c;border-color:#5a3129}
html.dark .mini.danger:hover{background:#3a1a16}
.whybtns button.danger{color:#a4341f;border-color:#e0b6ad}
html.dark .whybtns button.danger{color:#f0907c;border-color:#5a3129}
/* «무슨 일이 일어나는지» 를 누르기 «전» 에 말하는 줄 — 되돌릴 수 없는 조작이 아님을 밝힌다.
   ⛔ display:flex 로 감싸지 말 것 — 짧은 문장이 낱글자로 쪼개진다. */
.whynote{font-size:13.5px;color:#54606e;margin:6px 0 8px;line-height:1.5}
html.dark .whynote{color:#9db0c4}

/* ── 올리기 ─────────────────────────────────────────────── */
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.kind{
  font:inherit;font-size:16px;font-weight:650;padding:16px 10px;border-radius:9px;
  border:1px solid #ccd4de;background:#fff;cursor:pointer;min-height:62px;color:#16202c
}
html.dark .kind{background:#16202c;border-color:#33404f;color:#e6edf3}
.kind:hover{background:#eef2f6}
html.dark .kind:hover{background:#26313f}
.kind.on{background:#0b6e63;color:#fff;border-color:#0b6e63}

.form{background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:14px;margin-bottom:10px}
html.dark .form{background:#16202c;border-color:#26313f}
.row{margin-bottom:11px}
.row label{display:block;font-size:13px;font-weight:650;margin-bottom:4px;color:#4a5765}
html.dark .row label{color:#9fb0c2}
input[type=text],input[type=number],input[type=date],textarea{
  width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid #ccd4de;border-radius:7px;
  background:#fff;color:#16202c;min-height:46px
}
/* 고르는 칸도 입력칸과 같은 모양으로. ⚠️ font-size 16px 아래로 내리지 말 것 —
   iOS 사파리가 «작은 글자» 를 만나면 눌렀을 때 화면을 확대해 버린다.
   ⚠️ `.row select` 로 좁힌다 — 그냥 `select` 로 쓰면 문서함 필터(.findsel)까지 덮는다. */
.row select{
  width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid #ccd4de;border-radius:7px;
  background:#fff;color:#16202c;min-height:46px
}
html.dark input,html.dark textarea,html.dark .row select{background:#1d2836;border-color:#33404f;color:#e6edf3}
textarea{min-height:78px;resize:vertical}
.help{font-size:12.5px;color:#7b8794;margin-top:3px}
html.dark .help{color:#8b98a8}
.auto{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.auto button{font:inherit;font-size:14px;font-weight:650;padding:12px 14px;border:1px solid #0b6e63;background:#dcece9;color:#0b5147;border-radius:8px;cursor:pointer;min-height:48px;flex:1;min-width:150px}
html.dark .auto button{background:#12332f;color:#7fd6c8;border-color:#2f6c62}
.auto button[disabled]{opacity:.55;cursor:default}
.cur{display:flex;gap:6px}
.cur button{font:inherit;font-size:14px;padding:10px 16px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:44px;color:#16202c}
html.dark .cur button{background:#1d2836;border-color:#33404f;color:#e6edf3}
.cur button.on{background:#0b6e63;color:#fff;border-color:#0b6e63}
.reuse{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.reuse button{font:inherit;font-size:14px;text-align:left;padding:11px 13px;border:1px solid #ccd4de;background:#fff;border-radius:7px;cursor:pointer;min-height:46px;color:#16202c}
html.dark .reuse button{background:#16202c;border-color:#33404f;color:#e6edf3}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92%;
  background:#16202c;color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;display:none;z-index:50
}
.toast.show{display:block}
[hidden]{display:none !important}   /* 작성자 CSS 가 display 를 정하면 [hidden] 이 진다 — CLAUDE.md 함정 */
</style>
</head>
<body>

<div class="top">
  <h1>
    <span data-en="Approvals" data-ko="결재함">Approvals</span>
    <span id="badge" class="badge zero">0</span>
  </h1>
  <div class="tbar">
    <button class="tbtn" onclick="goBack()"><span data-en="← Back" data-ko="← 뒤로">← Back</span></button>
    <a class="tbtn" id="homeBtn" href="/admin.html"><span data-en="🏠 Home" data-ko="🏠 홈">🏠 Home</span></a>
    <button class="tbtn" id="lang" onclick="toggleLang()">KO</button>
    <button class="tbtn" onclick="toggleMode()"><span id="modeLbl" data-en="Dark" data-ko="어둡게">Dark</span></button>
    <button class="tbtn" onclick="reloadAll()"><span data-en="Refresh" data-ko="새로고침">Refresh</span></button>
    <button class="tbtn" id="pushBtn" onclick="askPush()" hidden><span data-en="Notify me" data-ko="알림 받기">Notify me</span></button>
    <button class="tbtn" id="soundBtn" onclick="toggleSound()"><span data-en="Sound: on" data-ko="소리 켬">Sound: on</span></button>
    <button class="tbtn" id="awayBtn" onclick="openAway()" hidden><span data-en="Away" data-ko="부재중">Away</span></button>
    <!-- 🚪 (2026-08-21) 예전엔 죽은 경로로 보내 세션이 안 끊겼다 — 아래 onclick 참고. -->
    <button class="tbtn tbtn-out" id="logoutBtn"><span data-en="Log out" data-ko="로그아웃">Log out</span></button>
  </div>
</div>

<div class="offbar" data-en="Offline — showing the last information received. Press Refresh when you reconnect."
     data-ko="오프라인 — 마지막으로 받은 정보입니다. 연결되면 새로고침을 눌러 주세요.">Offline</div>
<div class="outbox" id="outboxNote" hidden></div>
<div class="outbox" id="queueNote" hidden></div>

<div class="wrap">

  <!-- 🧭 맨 위 요약(D안) — 아침에 한 번 열어 보는 자리.
       ⚠️ 첫 화면 API 한 번 설계를 지킨다: 여기 숫자는 이미 받은 /api/approval/home 안에 있고
          따로 부르지 않는다. 손봐야 할 것이 없으면 경고 줄이 아예 안 뜬다. -->
  <div id="topStop"></div>
  <div id="topTiles" class="tiles"></div>

  <h2 id="urgentHead" hidden><span data-en="Urgent" data-ko="긴급 소통">Urgent</span></h2>
  <div id="urgent"></div>

  <!-- ✅ 확인할 것 — 결재가 아니라 «봤다»는 도장. 경영진에게만, 있을 때만 뜬다.
       ⚠️ 여기 건은 이미 확정되어 필리핀에도 통보가 끝났다. 안 눌러도 업무는 진행된다. -->
  <h2 id="ackHead" hidden><span data-en="To confirm" data-ko="확인할 것">To confirm</span></h2>
  <div id="ackBox"></div>

  <h2><span data-en="Waiting for your decision" data-ko="내가 결재할 것">Waiting for your decision</span></h2>
  <div id="awayBox"></div>
  <div id="schedBox"></div>
  <div id="bulkBox"></div>
  <div id="inbox"><div class="empty" data-en="Loading..." data-ko="불러오는 중...">Loading...</div></div>

  <h2><span data-en="Submit a request" data-ko="결재 올리기">Submit a request</span></h2>
  <div id="kinds" class="kinds"></div>
  <div id="reuse" class="reuse"></div>
  <div id="form" class="form" hidden></div>

  <h2>
    <span data-en="My requests" data-ko="내가 올린 것">My requests</span>
  </h2>
  <div id="mine"><div class="empty" data-en="Loading..." data-ko="불러오는 중...">Loading...</div></div>

  <h2>
    <!-- 📂 (2026-09-08 사장님 지시) 「지출 정리」를 문서함 **위**로 올렸다.
         왜 — 문서함이 펼쳐진 뒤로 높이가 4,336px 이라(360×640 실측) 그 아래에 있던

         ⚠️ 그래서 문서함에 **자기 제목**이 생겼다. 여는 버튼도 여기로 함께 왔다 —
            버튼만 「내가 올린 것」에 두면 «누르면 저 아래 것이 접히는» 꼴이 된다. -->

    <!-- 그래서 라벨이 「접기」로 시작한다. 라벨은 paintFindBtn() 이 상태에 맞춰 다시 쓰는데,

    <button type="button" id="findBtn" class="findtoggle" onclick="toggleFind()" aria-expanded="true"

  <!-- 📂 결재 문서함 — **처음부터 펼쳐져 있다** (2026-09-07 사장님 지시).
       왜 — 접혀 있고 여는 버튼이 제목 옆 작은 글씨라 「남들이 올린 것·승인 완료를
            어디서도 못 찾겠다」는 제보가 나왔다. 그 범위 고르기가 여기에만 있다.
       ⚠️ 그래도 **첫 화면 그리기 비용은 그대로다** — 여기서 서버를 부르지 않는다.
          홈(/api/approval/home)을 «시도한 뒤»에 findAutoOpen() 이 딱 한 번 부른다
          (HOME_TRIED — 캐시로 먼저 그리는 경로가 있어서 그 플래그가 꼭 필요하다).
          ⛔ 이 자리에서 runFind 를 부르지 말 것(첫 화면에 두 요청이 동시에 나간다).
       ⛔ hidden 을 되살리지 말 것 — 되살리면 위 제보가 그대로 재현된다.

  <div id="findPanel" class="findpanel">

      <!-- 🗂 결재 보관함 함 트리(시안 A, 2026-09-08) — 서버 facets 로 그린다. 함을 누르면 오른쪽 조건이 바뀐다. -->
      <nav id="findBox" class="findbox" aria-label="결재 보관함"></nav>

             data-en-ph="Search title, content, or person" data-ko-ph="제목·내용·올린 사람으로 찾기">
      <button type="button" class="findgo" onclick="runFind(0)"
              data-en="Search" data-ko="찾기">Search</button>
    </div>
    <div class="findrow">
      <!-- ⚠️ 범위만 fscopePick — 고른 «그 순간» 에만 기억한다(위 주석 참고). -->
      <select id="fscope" class="findsel" onchange="fscopePick()"></select>

      <input type="date" id="ffrom" class="finddate" onchange="runFind(0)">
      <label class="findlab" data-en="To" data-ko="종료일">To</label>

              data-en="Excel" data-ko="엑셀 내려받기">Excel</button>

    <!-- ⚠️ 빈 칸으로 두지 말 것 — 펼쳐진 채로 아무 글자도 없으면 «고장» 으로 읽힌다.
         홈이 오면 곧바로 「찾는 중...」→ 결과로 바뀌고, 홈이 실패해도 findAutoOpen 이
         한 번 불러 «연결이 좋지 않습니다» 로 바뀐다(이 글자가 남아 있는 일은 없다). -->

      </div><!-- /.findmain -->
