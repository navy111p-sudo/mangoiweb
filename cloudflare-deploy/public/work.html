/* ── 결정 — 누르는 즉시 화면에 반영하고, 실패하면 되돌린다. ──────────────── */
window.decide = function(id, decision, memo){
  var el = document.getElementById('req-' + id);
  if (el) el.className += ' busy';
  var body = { decision: decision, memo: memo || null };

  send(id, body)
    .then(function(res){
      if (res.done) {
        removeLocal(id);
        toast(decision === 'approved' ? T('Approved.', '승인했습니다.') : T('Rejected.', '반려했습니다.'));
        repaint();
        load().catch(function(){});           // 조용히 최신화 (다음 단계가 열렸을 수 있다)
      } else if (res.queued) {
        removeLocal(id);
        toast(T('Saved on this phone — it will be sent when you are back online.',
                '이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.'));
        repaint();
      } else {
        if (el) el.className = el.className.replace(' busy', '');
        toast(res.message || T('Could not send.', '보내지 못했습니다.'));
        load().catch(function(){});
      }
    });
};

/* ✅ 확인 — «봤다»는 도장.
     ⛔ 못 보낸 결재 큐(outbox)에 넣지 않는다. 확인은 아무것도 막지 않으므로 다음에 열 때
        다시 누르면 그만이고, 큐에 섞으면 로그아웃 경고의 「못 보낸 결재 N건」이 거짓이 된다. */
window.ackOne = function(id){
  var el = document.getElementById('ack-' + id);
  if (el) el.innerHTML = '<div class="steps">' + esc(T('Saving...', '저장 중...')) + '</div>';
  fetch('/api/approval/requests/' + id + '/ack', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }
  })
  .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
  .then(function(res){
    // 이미 확인된 건은 «성공» 으로 친다 — 두 기기에서 눌렀을 때 실패로 보이지 않게.
    if ((res.j && res.j.ok) || (res.j && res.j.error === 'already_acked')) {
      if (D) {
        D.ack_pending = (D.ack_pending || []).filter(function(x){ return x.id !== id; });
        if (D.summary) D.summary.ack_pending = (D.ack_pending || []).length;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
      }
      toast(T('Confirmed.', '확인했습니다.'));
      repaint();
      return;
    }
    if (el) el.innerHTML = '';
    toast((res.j && (EN() ? res.j.message_en : res.j.message)) ||
          T('Could not save. Please try again.', '저장하지 못했습니다. 다시 눌러 주세요.'));
  })
  .catch(function(){
    if (el) el.innerHTML = '';
    toast(T('Offline — try again when you reconnect.', '연결이 끊겼습니다 — 연결되면 다시 눌러 주세요.'));
  });
};

/** 서버로 보내기. 네트워크 실패만 큐에 남긴다 — 서버가 «판단해서» 거절한 것은 다시 보내도 소용없다. */
function send(id, body){
  return fetch('/api/approval/requests/' + id + '/decide', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
  .then(function(res){
    // 409 = 그 사이 다른 사람이 이미 결재함. 이미 처리된 것이므로 «성공»으로 친다.
    if (res.status === 409 || (res.j && res.j.error === 'already_decided')) {
      toast(T('Someone already decided this one.', '이미 다른 분이 결재한 건입니다.'));
      return { done: true };
    }
    if (res.j && res.j.ok) return { done: true };
    return { done: false, message: (res.j && (EN() ? res.j.message_en : res.j.message)) || null };
  })
  .catch(function(){
    outboxAdd({ id: id, body: body });
    return { queued: true };
  });
}

function removeLocal(id){
  if (!D) return;
  var f = function(a){ return (a || []).filter(function(x){ return x.id !== id; }); };
  D.inbox = f(D.inbox);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
}

/* ── 못 보낸 결재 큐 — teacher.html 의 검증된 패턴 ────────────────────────── */
var OUTBOX_KEY = 'mangoi_work_outbox_v1';

/* ── 🚪 로그아웃 ───────────────────────────────────────────────────────────
   세션 정본은 HttpOnly 쿠키라 JS 로 못 지운다 — 서버 POST 뿐(옛 /admin/logout 은 죽은 경로).
   🔴 캐시(mangoi_work_home_v1)에는 신청자 이름·사유·금액이 있다 → 공용 PC 대비로 지운다.
   ⛔ 못 보낸 결재·초안은 **지우지 않는다** — 아직 서버에 없어서 지우면 그대로 사라진다.
      대신 남아 있으면 먼저 알린다(로그아웃하면 자동 전송이 못 돈다).
   배경·버린 방법: docs/작업기록/260821_로그아웃이_서버세션을_안끊던_네곳.md */
document.getElementById('logoutBtn').onclick = function(){
  var pending = 0;
  try { pending = (JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]') || []).length; } catch (e) {}
  if (pending && !confirm(T(
        'You have ' + pending + ' decision(s) not yet sent. They stay on this device but cannot be sent after you log out. Log out anyway?',
        '아직 보내지 못한 결재가 ' + pending + '건 있습니다. 이 기기에는 남지만 로그아웃하면 보낼 수 없습니다. 그래도 로그아웃할까요?'))) return;
  var btn = this;
  btn.disabled = true;
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  var go = function(){ location.href = '/admin/login.html'; };
  // 서버 호출이 실패해도 로그인 화면으로 보낸다 — 여기서 멈추면 로그아웃한 줄 알고 자리를 뜬다.
  fetch('/api/admin/logout', { method: 'POST', credentials: 'include' }).then(go, go);
};
function outboxRead(){
  try { var a = JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function outboxWrite(a){
  try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(a.slice(-50))); } catch (e) {}
  paintOutbox();
}
function outboxAdd(entry){
  var a = outboxRead().filter(function(x){ return x.id !== entry.id; });   // 마지막 것이 이긴다
  a.push(entry);
  outboxWrite(a);
}
function paintOutbox(){
  var el = document.getElementById('outboxNote');
  var n = outboxRead().length;
  el.hidden = !n;
  if (n) el.textContent = T(n + ' decision(s) saved on this phone — they will be sent automatically when you are back online.',
                            '보내지 못한 결재 ' + n + '건을 이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.');
}
var flushing = false;
function outboxFlush(){
  if (flushing) return;
  var a = outboxRead();
  if (!a.length) return;
  flushing = true;
  var e0 = a[0];
  fetch('/api/approval/requests/' + e0.id + '/decide', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(e0.body)
  })
  .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
  .then(function(res){
    // 성공이거나, 이미 처리됐거나(409), 서버가 판단해서 거절한 것 → 큐에서 뺀다.
    // 네트워크 실패만 남긴다. 안 그러면 영영 안 되는 것을 영원히 재시도한다.
    var drop = (res.j && res.j.ok) || res.status === 409 || (res.status >= 400 && res.status < 500);
    if (drop) outboxWrite(outboxRead().slice(1));
    flushing = false;
    if (outboxRead().length) outboxFlush(); else load().catch(function(){});
  })
  .catch(function(){ flushing = false; });     // 아직 끊겨 있다 — 다음 기회에
}

/* ── 올리기 — 분류 큰 버튼 ────────────────────────────────────────────────── */
function paintKinds(){
  var host = document.getElementById('kinds');
  var types = D.types || [];
  var h = '';
  for (var i = 0; i < types.length; i++) {
    var t = types[i];
    h += '<button class="kind' + (PICK && PICK.key === t.key ? ' on' : '') + '" onclick="pick(' +
         JSON.stringify(t.key).replace(/"/g, '&quot;') + ')">' + esc(EN() ? t.en : t.ko) + '</button>';
  }
  host.innerHTML = h;
}

window.pick = function(key){
  var types = (D && D.types) || [];
  var found = null;
  for (var i = 0; i < types.length; i++) if (types[i].key === key) found = types[i];
  if (PICK && found && PICK.key === found.key) {
    closeForm(); return;                                          // 한 번 더 누르면 닫기(초안도 지운다)
  }
  /* ⚠️ 분류를 새로 고르면 «다시 올리기» 표식을 지운다 — 내용이 통째로 달라지므로.
     fillFormFrom 은 pick() 을 부른 «뒤» 에 표식을 세우므로 서로 부딪히지 않는다. */
  PICK = found; OCR = null; FILE = null; RESUBMIT_OF = null;
  CKEY = newKey();                    // 이 기안의 «같은 건» 열쇠 — 재전송에도 그대로 쓴다
  paintKinds();
  paintForm();
  paintReuse();
};

function paintReuse(){
  var host = document.getElementById('reuse');
  var arr = D.reuse || [];
  if (!arr.length || PICK) { host.innerHTML = ''; return; }
  var h = '';
  for (var i = 0; i < arr.length; i++) {
    var r = arr[i];
    var lbl = T('Same as last time: ', '지난번과 같이: ') + r.title + (r.amount != null ? ' (' + money(r.amount, r.currency) + ')' : '');
    h += '<button onclick="reuse(' + i + ')">' + esc(lbl) + '</button>';
  }
  host.innerHTML = h;
}
/* 「지난번과 같이」 — 채우는 규칙은 fillFormFrom 한 곳뿐이다.
   ⛔ 여기에 다시 적지 말 것 — 두 벌이 되면 칸을 하나 늘릴 때 한쪽만 고쳐진다. */
window.reuse = function(i){
  var r = (D.reuse || [])[i];
  if (!r) return;
  // 원본을 «가리키지는» 않는다 — 이건 새 결재다
  if (fillFormFrom(r, null)) {
    toast(T('Filled from your last request. Check it and submit.', '지난 기안으로 채웠습니다. 확인하고 올려 주세요.'));
  } else {
    toast(T('The form was already open — it is closed now. Press again to fill it in.',
            '폼이 열려 있어 닫았습니다. 한 번 더 누르면 채웁니다.'));
  }
};

/* ↩️ ② 「이 내용으로 다시 올리기」 — reuse 와 «같은 채우기» 를 쓰되,
   원본 번호를 함께 들고 간다(그래야 「원래 8/30에 올림」이 이어진다).
   ⛔ 채우는 규칙을 따로 만들지 않는다 — 두 벌이 되면 언젠가 어긋난다. */
var RESUBMIT_OF = null;              // 지금 폼이 «어느 회수 건» 을 다시 올리는 것인가

function fillFormFrom(r, originId){
  window.pick(r.req_type);
  if (!PICK) return false;          // 같은 분류로 열려 있어 pick() 이 닫은 것
  /* 🔴 순서가 중요하다 — pick() 이 폼을 그리면서 RESUBMIT_OF 를 지운다.
     표식을 세운 «뒤» 에 한 번 더 그려야 「다시 올리는 중」 줄이 나온다.
     (문자열 검사로는 안 보인다 — 변수도 줄도 다 «있고» 순서만 틀렸다. 브라우저 검사가 잡았다.) */
  RESUBMIT_OF = Number(originId) || null;
  if (RESUBMIT_OF) paintForm();
  setVal('f_title', r.title || '');
  setVal('f_body', r.body || '');
  if (r.amount != null) setVal('f_amount', r.amount);
  if (r.category) setVal('f_cat', r.category);
  if (r.spent_at) setVal('f_spent', r.spent_at);
  CUR = r.currency || 'PHP';
  paintCur();
  var f = document.getElementById('form');
  if (f && f.scrollIntoView) f.scrollIntoView({ block: 'start' });
  return true;
}

/** 화면이 이미 들고 있는 건에서 하나 찾기 — 목록·문서함 어디에 있든. */
function findLocal(id){
  var pools = [ (D && D.mine) || [], (D && D.inbox) || [], (D && D.urgent) || [], (FIND && FIND.items) || [] ];
  for (var p = 0; p < pools.length; p++) {
    for (var i = 0; i < pools[p].length; i++) {
      if (Number(pools[p][i].id) === Number(id)) return pools[p][i];
    }
  }
  return null;
}

function setVal(id, v){ var e = document.getElementById(id); if (e) e.value = v; }
function getVal(id){ var e = document.getElementById(id); return e ? e.value : ''; }

/* ══════════════════════════════════════════════════════════════════════════
   💼 인사·급여 «월 확정» — 여기서는 **아무것도 타이핑하지 않는다.**

   달과 종류(급여/평가)만 고르면, 금액·인원은 **서버가 급여·평가 표를 읽어서** 채운다.
   그래서 «올릴 때 숫자를 잘못 적는» 사고가 구조적으로 일어날 수 없다.
   이미 확정된 달은 눌리지 않게 막고, 누가 언제 확정했는지 함께 보여 준다.
   ══════════════════════════════════════════════════════════════════════════ */
function paintHrForm(host){
  var P = (D && D.hr_periods) || null;
  var h = '<div class="help">' +
    esc(T('Pick what to confirm and which month. The figures are read from the payroll and evaluation screens — you type nothing.',
          '무엇을, 어느 달을 확정할지 고르세요. 금액·인원은 급여·평가 화면에서 그대로 읽어 옵니다 — 직접 적지 않습니다.')) +
    '</div>';

  if (!P || ((!P.payroll || !P.payroll.length) && (!P.evaluation || !P.evaluation.length))) {
    h += '<div class="empty">' + esc(T('No month has payroll or evaluation data yet.',
                                       '급여·평가 자료가 있는 달이 아직 없습니다.')) + '</div>';
    h += '<div class="acts"><button class="big no" type="button" onclick="pick(\'hr\')">' +
         esc(T('Close', '닫기')) + '</button></div>';
    host.innerHTML = h;
    return;
  }

  var block = function(kind, label, list){
    if (!list || !list.length) return '';
    var s = '<div class="row"><label>' + esc(label) + '</label><div class="reuse">';
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.approved) {
        // 이미 확정된 달 — 누르지 못하게 하고, 누가 확정했는지 보여 준다.
        s += '<button type="button" disabled style="opacity:.55">' +
             esc(m.label + ' · ' + m.hint + ' — ' +
                 T('confirmed by ' + (m.approved_by || ''), '확정됨 (' + (m.approved_by || '') + ')')) +
             '</button>';
      } else {
        s += '<button type="button" onclick="submitHr(' +
             JSON.stringify(kind).replace(/"/g, '&quot;') + ',' +
             JSON.stringify(m.period).replace(/"/g, '&quot;') + ')">' +
             esc(m.label + ' · ' + m.hint) + '</button>';
      }
    }
    return s + '</div></div>';
  };

  h += block('payroll', T('Payroll', '급여 확정'), P.payroll);
  h += block('evaluation', T('Teacher evaluations', '인사평가 확정'), P.evaluation);
  h += '<div class="help" id="autoNote"></div>';
  h += '<div class="acts"><button class="big no" type="button" onclick="pick(\'hr\')">' +
       esc(T('Cancel', '취소')) + '</button></div>';
  host.innerHTML = h;
}

/** 달 버튼을 누르면 그대로 올라간다 — 확인 한 번만 받는다. */
window.submitHr = function(kind, period){
  var what = (kind === 'payroll') ? T('payroll', '급여') : T('evaluations', '인사평가');
  if (!confirm(T('Submit ' + period + ' ' + what + ' for approval?',
                 period + ' ' + what + ' 확정을 결재로 올릴까요?'))) return;
  note(T('Reading the figures...', '숫자를 읽는 중...'));

  var fd = new FormData();
  fd.append('client_key', CKEY || (CKEY = newKey()));
  fd.append('req_type', 'hr');
  fd.append('hr_kind', kind);
  fd.append('period', period);

  fetch('/api/approval/requests', { method: 'POST', credentials: 'same-origin', body: fd })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; }); })
    .then(function(res){
      if (res.j && res.j.ok) {
        toast(res.j.duplicate
          ? T('Already submitted.', '이미 올라간 건입니다.')
          : T('Submitted. The figures were filled in by the server.', '올렸습니다. 숫자는 서버가 채웠습니다.'));
        closeForm();
        load().catch(function(){});
      } else {
        // 409 = 그 사이 다른 사람이 이미 확정한 달
        toast((res.j && (EN() ? res.j.message_en : res.j.message)) ||
              T('Could not submit.', '올리지 못했습니다.'));
        load().catch(function(){});
      }
    })
    .catch(function(){
      note('');
      toast(T('Could not send — check your connection and try again.',
              '보내지 못했습니다 — 연결을 확인하고 다시 시도해 주세요.'));
    });
};

function paintForm(){
  var host = document.getElementById('form');
  if (!PICK) { host.hidden = true; host.innerHTML = ''; return; }
  host.hidden = false;

  // 💼 인사·급여는 폼이 아니라 «달 고르기» 다. 타이핑 칸이 아예 없다.
  if (PICK.picks_period) { paintHrForm(host); return; }

  /* ⚠️ 다시 그리기 전에 **쓰던 값을 반드시 챙긴다.**
     이 화면은 언어를 바꾸거나 목록을 새로 받을 때 다시 그려지는데, 그때마다 폼을 비우면
     필리핀에서 타이핑하던 내용이 날아간다 — 이 파일이 막으려는 바로 그 사고다. */
  var keep = {
    t: getVal('f_title'), a: getVal('f_amount'),
    b: getVal('f_body'), s: getVal('f_spent'),
    df: getVal('f_from'), dt: getVal('f_to'), c: getVal('f_cat'),
    n: (function(){
      var e = document.getElementById('autoNote'); return e ? e.textContent : '';
    })()
  };

  var h = '';

  /* ↩️ 「이 내용으로 다시 올리기」로 채운 폼이면 그 사실을 폼이 «말한다» —
     안 적으면 새 결재를 쓰는 것과 구별이 안 되고, 원래 올린 날이 이어지는 것도 모른다. */
  if (RESUBMIT_OF) {
    h += '<div class="whynote" id="resubNote">' + esc(
      T('Re-submitting withdrawn #', '회수한 #') + RESUBMIT_OF +
      T('. The original submission date is kept, so the waiting days do not restart.',
        ' 을(를) 다시 올리는 중입니다. 처음 올린 날이 그대로 이어져 «며칠째»가 초기화되지 않습니다.')
    ) + '</div>';
  }

  // 자동 채움 버튼 — 사진과 음성. 이 화면의 핵심.
  h += '<div class="auto">';
  if (PICK.wants_file) {
    /* 문구는 «반드시 필요한가» 로 가른다 — 일반 문서에 「영수증」이라고 쓰면 무엇을 붙이라는
       말인지 알 수 없다. ⚠️ 서버가 받는 형식은 사진(jpg·png·webp)과 PDF 뿐이다
       (내용을 보고 판정한다 — approval-policy 의 sniffKind). 워드·한글은 아직 못 받는다. */
    h += '<button type="button" id="b_shot" onclick="shoot()">' +
         esc(PICK.requires_file ? T('Photograph receipt', '영수증 사진 찍기')
                                : T('Attach file (photo or PDF)', '파일 첨부 (사진·PDF)')) + '</button>';
  }
  h += '<button type="button" id="b_voice" onclick="voice()">' +
       esc(T('Speak it (English)', '말로 입력 (영어)')) + '</button>';
  h += '</div>';
  // ⚠️ capture 속성을 쓰지 않는다 — 붙이면 휴대폰이 카메라만 열고 **앨범을 못 고르게** 막는다.
  //    영수증을 미리 찍어 둔 경우가 실제로 더 많다. 카메라는 파일 선택창에서 그대로 고를 수 있다.

       '<input type="text" id="f_title" maxlength="200"></div>';

  //    그래서 캘린더에 따로 또 적을 필요가 없다.
  if (PICK.wants_dates) {
    h += '<div class="row"><label>' + esc(T('First day off', '휴가 시작일')) + '</label>' +
         '<input type="date" id="f_from"></div>';
    h += '<div class="row"><label>' + esc(T('Last day off', '휴가 종료일')) + '</label>' +
         '<input type="date" id="f_to">' +
         '<div class="help">' + esc(T('Leave empty for a single day. Once approved, bookings are blocked for these days.',
                                      '하루면 비워 두세요. 승인되면 이 기간에는 수업 예약이 막힙니다.')) + '</div></div>';

         '<button type="button" id="cur_PHP" onclick="setCur(\'PHP\')">PHP</button>' +
         '<button type="button" id="cur_KRW" onclick="setCur(\'KRW\')">KRW</button>' +
         '</div></div>';
    h += '<div class="row"><label>' + esc(T('Date spent', '지출일')) + '</label>' +
         '<input type="date" id="f_spent"></div>';
  }

  /* 🏷️ 지출 항목 — 돈이 나가는 분류에만 나온다.
     ⚠️ 목록을 여기에 적지 않는다. 서버가 내려준 D.categories 를 그대로 그린다 —
        화면과 서버가 각자 목록을 들면 「골랐는데 저장이 안 되는」 사고가 난다.
     ⚠️ 안 고르고도 올릴 수 있다(«고르세요» 가 기본값) — 못 고르면 결재를 못 올리는
        쪽이 더 나쁘다. 비면 나중에 리포트가 「항목 없음」으로 보여 준다. */
  if (PICK.wants_category) {
    var cats = (D && D.categories) || [];
    if (cats.length) {
      var co = '<option value="">' + esc(T('Choose (optional)', '고르세요 (선택)')) + '</option>';
      for (var ci = 0; ci < cats.length; ci++) {
        co += '<option value="' + esc(cats[ci].key) + '">' +

      h += '<div class="row"><label>' + esc(T('Spending item', '지출 항목')) + '</label>' +
           '<select id="f_cat">' + co + '</select>' +
           '<div class="help">' +
           esc(T('Used to total spending later. You can leave it empty.',
                 '나중에 무슨 돈이었는지 합계를 내는 데 씁니다. 비워 둬도 됩니다.')) +
           '</div></div>';
    }
  }

  h += '<div class="row"><label>' + esc(T('Detail', '내용')) + '</label>' +
       '<textarea id="f_body" maxlength="4000"></textarea></div>';

  h += '<div class="acts">' +
       '<button class="big ok" type="button" id="b_submit" onclick="submitReq()">' + esc(T('Submit', '올리기')) + '</button>' +
       '<button class="big no" type="button" onclick="pick(' + JSON.stringify(PICK.key).replace(/"/g, '&quot;') + ')">' +
       esc(T('Cancel', '취소')) + '</button></div>';

  host.innerHTML = h;
  // 챙겨 둔 값을 그대로 돌려놓는다.
  setVal('f_title', keep.t); setVal('f_amount', keep.a);
  setVal('f_body', keep.b); setVal('f_spent', keep.s);
  setVal('f_from', keep.df); setVal('f_to', keep.dt);
  setVal('f_cat', keep.c);
  if (keep.n) note(keep.n);
  paintCur();
}

window.setCur = function(c){ CUR = c; paintCur(); draftSave(); };
function paintCur(){

  if (b) b.className = (CUR === 'KRW') ? 'on' : '';
}
function note(msg){ var e = document.getElementById('autoNote'); if (e) e.textContent = msg || ''; }

/* ── 사진 → 축소 → 판독 ───────────────────────────────────────────────────
   휴대폰 사진은 4MB 를 넘는다. 그대로 보내면 느린 회선에서 대부분 실패한다.
   기기에서 먼저 줄여서 보낸다 — 업로드 실패의 대부분이 여기서 사라진다.        */
window.shoot = function(){ var e = document.getElementById('f_file'); if (e) e.click(); };

window.gotFile = function(input){
  var f = input.files && input.files[0];
  if (!f) return;
  if (f.type === 'application/pdf') { FILE = f; note(T('Attached: ', '첨부: ') + f.name); return; }

  /* 영수증이 «반드시» 필요한 분류가 아니면(일반 문서) 사진을 읽지 않는다.
     ⚠️ 그냥 두면 ① 「영수증을 읽는 중」·「금액을 직접 넣어 주세요」라는 엉뚱한 문구가 뜨고
        ② 금액 칸이 없는 화면에서 ③ 돈이 나가는 OCR 을 헛되이 부른다. 첨부만 하면 된다. */
  if (PICK && !PICK.requires_file) {
    note(T('Preparing the file...', '파일을 준비하는 중...'));
    shrink(f).then(function(blob){
      FILE = blob || f;
      note(T('Attached: ', '첨부: ') + f.name);
    }).catch(function(){
      FILE = f;                                  // 줄이기에 실패해도 원본을 붙인다
      note(T('Attached: ', '첨부: ') + f.name);
    });
    return;
  }

  note(T('Preparing the photo...', '사진을 준비하는 중...'));
  shrink(f).then(function(blob){
    FILE = blob || f;
    note(T('Reading the receipt...', '영수증을 읽는 중...'));
    return fetch('/api/approval/ocr', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: FILE
    }).then(function(r){ return r.json(); });
  })
  .then(function(j){
    if (!j || !j.ok) {
      // 못 읽어도 첨부는 남는다. 사람이 직접 넣으면 된다 — 자동화는 «유일한 길»이 아니다.
      note(T('Could not read it — please type the amount. The photo is still attached.',
             '읽지 못했습니다 — 금액을 직접 넣어 주세요. 사진은 첨부되어 있습니다.'));
      return;
    }
    OCR = j;
    if (j.amount != null && !getVal('f_amount')) setVal('f_amount', j.amount);
    if (j.spent_at && !getVal('f_spent')) setVal('f_spent', j.spent_at);
    if (j.vendor && !getVal('f_title')) setVal('f_title', j.vendor);
    note(T('Filled from the receipt. Check it before submitting.',
           '영수증에서 채웠습니다. 올리기 전에 확인해 주세요.'));
  })
  .catch(function(){
    note(T('Could not read it — please type the amount. The photo is still attached.',
           '읽지 못했습니다 — 금액을 직접 넣어 주세요. 사진은 첨부되어 있습니다.'));
  });
};

function shrink(file){
  return new Promise(function(resolve){
    try {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        try {
          var max = 1600;
          var w = img.width, h = img.height;
          if (w > max || h > max) { var s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          c.toBlob(function(b){ URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', 0.82);
        } catch (e) { URL.revokeObjectURL(url); resolve(file); }
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    } catch (e) { resolve(file); }
  });
}

/* ── 음성(영어) → 받아쓰기 → 초안 ─────────────────────────────────────────── */
var REC = null, CHUNKS = [];
window.voice = function(){
  var btn = document.getElementById('b_voice');
  if (REC) { try { REC.stop(); } catch (e) {} return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    note(T('Voice input is not available on this device — please type.',
           '이 기기에서는 음성 입력을 쓸 수 없습니다 — 직접 입력해 주세요.'));
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    CHUNKS = [];
    REC = new MediaRecorder(stream);
    REC.ondataavailable = function(e){ if (e.data && e.data.size) CHUNKS.push(e.data); };
    REC.onstop = function(){
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch (e) {}
      REC = null;
      if (btn) { btn.textContent = T('Speak it (English)', '말로 입력 (영어)'); btn.disabled = true; }
      note(T('Listening finished — writing it down...', '받아쓰는 중...'));
      var blob = new Blob(CHUNKS, { type: 'audio/webm' });
      fetch('/api/approval/voice', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: blob
      })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (btn) btn.disabled = false;
        if (!j || !j.ok) {
          note(T('Could not hear it clearly — please type.', '알아듣지 못했습니다 — 직접 입력해 주세요.'));
          return;
        }
        var d = j.draft;
        if (d) {
          if (d.title && !getVal('f_title')) setVal('f_title', d.title);
          if (d.body && !getVal('f_body')) setVal('f_body', d.body);
          if (d.amount != null && !getVal('f_amount')) setVal('f_amount', d.amount);
        } else if (j.transcript && !getVal('f_body')) {
          setVal('f_body', j.transcript);
        }
        note(T('Filled from what you said. Check it before submitting.',
               '말씀하신 내용으로 채웠습니다. 올리기 전에 확인해 주세요.'));
      })
      .catch(function(){
        if (btn) btn.disabled = false;
        note(T('Could not send the recording — please type.', '녹음을 보내지 못했습니다 — 직접 입력해 주세요.'));
      });
    };
    REC.start();
    if (btn) btn.textContent = T('Stop and use it', '그만 말하고 사용');
    note(T('Speak in English, then press the button again.', '영어로 말한 뒤 버튼을 다시 눌러 주세요.'));
    // 안전장치 — 30초가 넘으면 저절로 멈춘다(파일이 커지면 느린 회선에서 못 보낸다)
    setTimeout(function(){ if (REC) { try { REC.stop(); } catch (e) {} } }, 30000);
  })
  .catch(function(){
    note(T('Microphone permission is needed for voice input.', '음성 입력에는 마이크 권한이 필요합니다.'));
  });
};

/* ══════════════════════════════════════════════════════════════════════════
   올리기 — «쓴 것이 사라지지 않는다» 가 이 부분의 전부다.

   왜 이렇게까지 하나 —
     승인·반려는 버튼 한 번이라 실패해도 다시 누르면 그만이다. 그런데 **기안**은 다르다.
     필리핀 매니저가 영수증을 찍고, 판독을 기다리고, 내용을 확인한 뒤 「올리기」를 눌렀는데
     그 순간 회선이 끊기면 — 예전 방식으로는 **그 전부가 통째로 사라진다.**
     정전·태풍이 잦은 곳에서 이건 «가끔»이 아니다.

   그래서 세 겹으로 막는다:
     ① 초안 자동저장 — 글자를 칠 때마다 기기에 적어 둔다. 앱이 죽어도 다시 열면 그대로 있다.
     ② 전송 큐 — 보내다 끊기면 **사진까지 통째로** 기기에 담아 두고, 연결되면 자동으로 보낸다.
        (사진은 용량이 커서 localStorage 에 못 넣는다 → IndexedDB 를 쓴다)
     ③ 같은 열쇠(client_key) — 재전송이 **같은 기안을 두 건으로 만들지 않게** 서버가 합쳐 준다.
        "저장은 됐는데 응답만 못 받은" 경우가 실제로 있어서, 이게 없으면 지출 결재가 두 번 잡힌다.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 기기 저장소(IndexedDB) — 사진이 들어가야 해서 localStorage 로는 부족하다 ── */
var DB_NAME = 'mangoi_work', STORE = 'outbox';
function idbOpen(){
  return new Promise(function(res){
    try {
      if (!window.indexedDB) return res(null);
      var rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = function(){
        try { rq.result.createObjectStore(STORE, { keyPath: 'key' }); } catch (e) {}
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ res(null); };
    } catch (e) { res(null); }
  });
}
function idbDo(mode, fn){
  return idbOpen().then(function(db){
    if (!db) return null;
    return new Promise(function(res){
      try {
        var tx = db.transaction(STORE, mode);
        var out = fn(tx.objectStore(STORE));
        tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        tx.onerror = function(){ res(null); };
        tx.onabort = function(){ res(null); };
      } catch (e) { res(null); }
    });
  }).catch(function(){ return null; });
}
function subQueueAdd(rec){ return idbDo('readwrite', function(s){ return s.put(rec); }); }
function subQueueAll(){ return idbDo('readonly', function(s){ return s.getAll(); }); }
function subQueueDel(key){ return idbDo('readwrite', function(s){ return s.delete(key); }); }

/* ── ① 초안 자동저장 — 글자를 칠 때마다. 사진은 제외(용량) ── */
var DRAFT_KEY = 'mangoi_work_draft_v1';
function draftSave(){
  if (!PICK) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      key: CKEY, type: PICK.key, cur: CUR,
      title: getVal('f_title'), amount: getVal('f_amount'),
      body: getVal('f_body'), spent: getVal('f_spent'),
      from: getVal('f_from'), to: getVal('f_to'), cat: getVal('f_cat'),
      ocr: OCR ? OCR.amount : null, origin: RESUBMIT_OF || null, at: Date.now()
    }));
  } catch (e) {}
}
function draftClear(){ try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function draftLoad(){
  try {
    var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    // 하루가 지난 초안은 되살리지 않는다 — 오래된 내용이 뜬금없이 나오면 더 헷갈린다.
    if (!d || !d.type || (Date.now() - Number(d.at || 0)) > 86400000) return null;
    return d;
  } catch (e) { return null; }
}

/* 같은 기안임을 서버에 알려 주는 열쇠. 폼을 열 때 한 번 만들고, 재전송에도 그대로 쓴다. */
var CKEY = null;
function newKey(){
  try {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
  } catch (e) {}
  return 'k' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}

function buildFD(rec){
  var fd = new FormData();
  fd.append('client_key', rec.key);
  fd.append('req_type', rec.type);
  fd.append('title', rec.title);
  fd.append('body', rec.body || '');
  fd.append('currency', rec.cur || 'PHP');
  if (rec.amount) fd.append('amount', String(rec.amount));
  if (rec.spent) fd.append('spent_at', rec.spent);
  if (rec.from) fd.append('date_from', rec.from);
  if (rec.to) fd.append('date_to', rec.to);
  if (rec.cat) fd.append('category', rec.cat);
  if (rec.origin) fd.append('origin_id', String(rec.origin));
  if (rec.ocr != null) fd.append('ocr_amount', String(rec.ocr));
  if (rec.file) fd.append('file', rec.file, (rec.fileName || 'receipt.jpg'));
  return fd;
}

/** 한 건 보내기. done=끝남(성공이든 서버가 거절했든), retry=회선 문제라 다시 보내야 함. */
function postOne(rec){
  return fetch('/api/approval/requests', { method: 'POST', credentials: 'same-origin', body: buildFD(rec) })
    .then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j || {} }; },
                                            function(){ return { status: r.status, j: {} }; }); })
    .then(function(res){
      if (res.j && res.j.ok) return { done: true, duplicate: !!res.j.duplicate };
      // 서버가 «판단해서» 거절한 것(4xx)은 다시 보내도 소용없다 — 큐에서 빼고 사람에게 알린다.
      // 5xx 는 서버가 잠깐 아픈 것일 수 있으니 다시 보낸다.
      if (res.status >= 400 && res.status < 500 && res.status !== 429) {
        return { done: true, refused: true,
                 message: (EN() ? res.j.message_en : res.j.message) || null };
      }
      return { retry: true };
    })
    .catch(function(){ return { retry: true }; });     // 회선 문제
}

window.submitReq = function(){
  if (!PICK) return;
  var title = String(getVal('f_title') || '').trim();
  if (!title) { toast(T('Please enter a title.', '제목을 넣어 주세요.')); return; }
  var amount = String(getVal('f_amount') || '').trim();
  if (PICK.needs_amount && !amount) {
    toast(T('Please enter the amount.', '금액을 넣어 주세요.')); return;
  }
  // 휴가는 날짜가 없으면 승인돼도 막을 기간을 모른다 — 보내기 전에 여기서 잡는다.
  if (PICK.wants_dates && !getVal('f_from')) {
    toast(T('Please pick the first day off.', '휴가 시작일을 골라 주세요.')); return;
  }
  var btn = document.getElementById('b_submit');
  if (btn) btn.disabled = true;

  if (!CKEY) CKEY = newKey();
  var rec = {
    key: CKEY, type: PICK.key, title: title, body: getVal('f_body') || '',
    cur: CUR, amount: amount, spent: getVal('f_spent') || '',
    from: getVal('f_from') || '', to: getVal('f_to') || '',
    cat: getVal('f_cat') || '',
    ocr: (OCR && OCR.amount != null) ? OCR.amount : null,
    file: FILE || null, fileName: (FILE && FILE.name) || 'receipt.jpg', at: Date.now(),
    /* ↩️ 회수한 건을 다시 올리는 것이면 원본 번호를 함께 보낸다 —
       그래야 「6일째」가 «오늘» 로 초기화되지 않는다(서버가 내 회수 건인지 다시 확인한다). */
    origin: RESUBMIT_OF || null
  };

  postOne(rec).then(function(res){
    if (btn) btn.disabled = false;

    if (res.done) {
      if (res.refused) { toast(res.message || T('Could not submit.', '올리지 못했습니다.')); return; }
      toast(res.duplicate
        ? T('Already submitted — this was the same request.', '이미 올라간 기안입니다. 같은 건으로 처리했습니다.')
        : T('Submitted. Head office will review it.', '결재를 올렸습니다. 본사가 확인합니다.'));
      closeForm();
      load().catch(function(){});
      return;
    }

    // 회선 문제 — 사진까지 통째로 담아 두고 연결되면 자동으로 보낸다.
    subQueueAdd(rec).then(function(){
      closeForm();
      paintQueue();
      toast(T('Saved on this phone — it will be sent automatically when you are back online.',
              '이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.'));
    }, function(){
      // IndexedDB 조차 못 쓰는 기기 — 폼을 지우지 않는다. 쓴 것을 없애는 것이 최악이다.
      toast(T('Could not send. Your text is still here — please try again when you reconnect.',
              '보내지 못했습니다. 쓰신 내용은 그대로 있습니다 — 연결되면 다시 눌러 주세요.'));
    });
  });
};

function closeForm(){
  /* ⚠️ RESUBMIT_OF 도 함께 비운다 — 안 비우면 «다음에 올리는 다른 건» 에 남의
     원본 번호가 붙어 「원래 8/30에 올림」이라는 거짓 줄이 생긴다. */
  PICK = null; OCR = null; FILE = null; CKEY = null; RESUBMIT_OF = null;
  draftClear();
  paintKinds(); paintForm(); paintReuse();
}

/* ── ② 큐 비우기 — 연결되면 자동으로 ── */
var subBusy = false;
function subFlush(){
  if (subBusy) return;
  subBusy = true;
  subQueueAll().then(function(list){
    if (!list || !list.length) { subBusy = false; paintQueue(); return; }
    var rec = list[0];
    return postOne(rec).then(function(res){
      if (res.done) {
        return subQueueDel(rec.key).then(function(){
          subBusy = false;
          paintQueue();
          if (!res.refused) toast(T('A saved request has been sent.', '저장해 둔 기안을 보냈습니다.'));
          // 남은 것이 있으면 이어서, 없으면 목록 최신화
          subQueueAll().then(function(rest){
            if (rest && rest.length) subFlush(); else load().catch(function(){});
          });
        });
      }
      subBusy = false;                 // 아직 끊겨 있다 — 다음 기회에
    });
  }).catch(function(){ subBusy = false; });
}

function paintQueue(){
  subQueueAll().then(function(list){
    var n = (list || []).length;
    var el = document.getElementById('queueNote');
    if (!el) return;
    el.hidden = !n;
    if (n) el.textContent = T(n + ' request(s) saved on this phone — they will be sent automatically when you are back online.',
                              '보내지 못한 기안 ' + n + '건을 이 기기에 저장했습니다 — 연결되면 자동으로 보냅니다.');
  });
}

/* ── 알림 받기 (웹푸시) ────────────────────────────────────────────────────
   기존 인프라를 그대로 쓴다 — VAPID 키·구독 표·sw.js 의 push 핸들러가 이미 있다.
   여기서 하는 일은 «직원 계정으로 구독을 하나 붙이는 것»뿐이다.

   ⚠️ 자동 등록하지 않는다. 사용자가 버튼을 눌렀을 때만 권한을 묻는다 —
      묻지도 않고 뜨는 권한 창은 대부분 거절당하고, 그러면 되돌리기 어렵다.
   ⚠️ controllerchange 자동 reload 는 붙이지 않는다 — 과거에 의도적으로 제거한 것이다
      (CLAUDE.md 1-3). 여기서 되살리지 말 것.
   ※ 아이폰은 «홈 화면에 추가» 한 뒤에만 푸시를 받을 수 있다. 그래서 실패해도 조용히 안내만 한다. */
function pushReady(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function b64ToU8(b64){
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  var out = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
function paintPushBtn(){
  var b = document.getElementById('pushBtn');
  if (!b) return;
  if (!pushReady() || !D || !D.me || !D.me.username) { b.hidden = true; return; }
  b.hidden = (Notification.permission === 'granted' && pushOn);
}
var pushOn = false;
var pushSilentTried = false;   // 위 «조용한 되살리기» 가드(버튼은 안 걸린다)
window.askPush = function(){
  if (!pushReady()) {
    toast(T('This device cannot receive notifications. On iPhone, add this page to the Home Screen first.',
            '이 기기에서는 알림을 받을 수 없습니다. 아이폰은 «홈 화면에 추가» 후에 가능합니다.'));
    return;
  }
  Notification.requestPermission().then(function(p){
    if (p !== 'granted') { toast(T('Notifications are turned off.', '알림이 꺼져 있습니다.')); return; }
    return subscribePush().then(function(r){
      // ⚠️ 실패를 한 줄로 뭉개지 않는다 — 사람이 «내 폰 문제인지 서버 설정 문제인지» 를
      //    가릴 수 있어야 다음 할 일이 정해진다(2026-09-10 사장님 제보).
      toast(r.ok ? T('You will be notified when an approval needs you.', '결재가 오면 알려 드립니다.') : r.why);
    });
  }).catch(function(){});
};
/* 몸통이 네 단계라 실패도 네 가지다. 그것을 한 줄로 뭉개면
   보는 사람은 다음에 무엇을 해야 하는지 알 방법이 없다 — 서버 설정인지,
   이 브라우저인지, 마지막 저장만 안 된 것인지가 전부 같은 문장이 된다.
   그래서 { ok, why } 를 돌려준다.
   ⚠️ 불리언이 아니다 — 호출부에서 `if (!ok)` 로 쓰면 반대로 동작한다.
      지금 호출부는 둘(askPush · 조용한 되살리기)이고 둘 다 `r.ok` 를 본다. */
function pushWhy(step, code){
  if (step === 'key')  return T('The server has no notification key yet (VAPID). An administrator must register it.',
                                '서버에 알림 키(VAPID)가 아직 없습니다. 관리자가 등록해야 합니다.');
  // ⛔ HTTP 오류를 'key' 로 읽으면 「관리자가 등록해야 합니다」가 되어 **엉뚱한 곳으로 보낸다.**
  //    fetch 는 404·500 에도 reject 하지 않으므로 'net' 갈래로도 안 온다 — 따로 봐야 한다.
  if (step === 'http') return T('The server could not return the notification key (HTTP ' + code + '). Try again in a moment.',
                                '서버가 알림 키를 주지 못했습니다 (HTTP ' + code + '). 잠시 뒤 다시 눌러 주세요.');
  if (step === 'sw')   return T('This browser could not start the background worker for notifications.',
                                '이 브라우저에서 알림용 백그라운드 등록에 실패했습니다.');
  if (step === 'subscribe') return T('This browser refused the notification subscription.',
                                '이 브라우저가 알림 구독을 거절했습니다.');
  if (step === 'save') return T('Registered on this device, but the server did not save it.',
                                '이 기기에서는 등록됐지만 서버가 저장하지 못했습니다.');
  if (step === 'net')  return T('Could not reach the server. Check your connection and try again.',
                                '서버에 닿지 못했습니다. 연결을 확인하고 다시 눌러 주세요.');
  // ⚠️ 단계를 새로 넣고 이 표를 잊으면 **틀린 문구가 조용히** 나간다 — 모르면 모른다고 말한다.
  return T('Could not turn on notifications (unknown step: ' + step + ').',
           '알림을 켜지 못했습니다 (알 수 없는 단계: ' + step + ').');
}
function subscribePush(){
  var step = 'key', code = 0;
  return fetch('/api/push/vapid-public-key', { credentials: 'same-origin' })
    // ⛔ 연결 실패를 'key' 로 읽으면 «서버에 키가 없다» 고 말하게 되어 관리자를
    //    엉뚱한 곳(시크릿 등록)으로 보낸다. 끊긴 것과 없는 것은 다른 사실이다.
    .catch(function(e){ step = 'net'; throw e; })
    .then(function(r){
      // 🔴 fetch 는 404·500·502 에도 **reject 하지 않는다** — 위 .catch 를 그냥 지나간다.
      //    여기서 안 가르면 서버 장애가 「관리자가 키를 등록해야 합니다」로 나간다.
      if (!r.ok) { code = r.status; step = 'http'; throw new Error('http_' + r.status); }
      // 본문이 JSON 이 아니면(오류페이지 등) null 로 떨어뜨린다. 이 시점의 step 은 'key' 다.
      return r.json().catch(function(){ return null; });
    })
    .then(function(j){
      if (!j || !j.key) throw new Error('no_key');
      step = 'sw';
      return navigator.serviceWorker.register('/sw.js').then(function(reg){
        return navigator.serviceWorker.ready.then(function(){
          step = 'subscribe';
          return reg.pushManager.getSubscription().then(function(sub){
            if (sub) return sub;
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(j.key) });
          });
        });
      });
    })
    .then(function(sub){
      step = 'save';
      var s = sub.toJSON ? sub.toJSON() : sub;
      return fetch('/api/push/subscribe', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        // ⚠️ user_id 에 **관리자 계정명**을 넣는다. 서버(api-approval notify)가 이 값으로 찾는다.
        body: JSON.stringify({ subscription: s, user_id: (D && D.me && D.me.username) || null, ua: navigator.userAgent })
      }).then(function(r){ return r.json().catch(function(){ return null; }); });
    })
    .then(function(j){
      pushOn = !!(j && j.ok); paintPushBtn();
      return pushOn ? { ok: true, why: '', step: '' } : { ok: false, why: pushWhy('save', code), step: 'save' };
    })
    .catch(function(err){
      // ⚠️ 토스트는 몇 초 뒤 사라진다 — 진짜 예외는 콘솔에도 남긴다.
      try { console.warn('[push] 실패 step=' + step, err); } catch (e) {}
      return { ok: false, why: pushWhy(step, code), step: step };
    });
}

/* ── 시작 ─────────────────────────────────────────────────────────────────── */
applyMode();
applyLang();

// 캐시가 있으면 먼저 그린다 — 끊겨 있어도 흰 화면을 보지 않는다.
try {
  var c0 = localStorage.getItem(CACHE_KEY);
  if (c0) { D = JSON.parse(c0); repaint(); }
} catch (e) {}

/* 초안 자동저장 — 폼은 다시 그려지지만 이 리스너는 바깥 상자에 붙어 있어 살아남는다.
   ⚠️ 'change' 도 함께 듣는다 — 고르는 칸(select)은 브라우저·조작 방식에 따라
      'input' 이 안 올 수 있다. 그때 초안에 «고른 항목» 만 조용히 안 담긴다.
   ⛔ 인라인 onchange="draftSave()" 로 풀지 말 것 — 인라인 핸들러는 «전역» 에서 이름을
      찾는데 이 함수는 파일 안 닫힌 스코프라 ReferenceError 가 난다(2026-09-04 실측). */
var formBox = document.getElementById('form');
formBox.addEventListener('input', draftSave);
formBox.addEventListener('change', draftSave);

/* ⚠️ 마지막 .then(f, f) 는 «홈이 실패했을 때도» 문서함을 한 번 채우기 위한 것이다.
      성공하면 repaint 안에서 이미 불렸고 FIND_AUTO 가 막으므로 두 번 나가지 않는다. */
load().then(restoreDraft).then(openWantedType)
      .catch(function(){ restoreDraft(); openWantedType(); })
      .then(findAutoOpen, findAutoOpen);
outboxFlush();
subFlush();
paintQueue();

/* 쓰다 만 기안 되살리기 — 앱이 죽거나 브라우저가 닫혀도 쓴 것이 남아 있어야 한다. */
function restoreDraft(){
  var d = draftLoad();
  if (!d || PICK) return;
  var types = (D && D.types) || [];
  var found = null;
  for (var i = 0; i < types.length; i++) if (types[i].key === d.type) found = types[i];
  if (!found) return;
  PICK = found; CKEY = d.key || newKey(); CUR = d.cur || 'PHP';
  OCR = (d.ocr != null) ? { amount: d.ocr } : null;
  RESUBMIT_OF = Number(d.origin || 0) || null;   // 쓰다 만 «다시 올리기» 도 이어진다
  paintKinds(); paintForm(); paintReuse();
  setVal('f_title', d.title || ''); setVal('f_amount', d.amount || '');
  setVal('f_body', d.body || ''); setVal('f_spent', d.spent || '');
  setVal('f_from', d.from || ''); setVal('f_to', d.to || '');
  setVal('f_cat', d.cat || '');
  // ⚠️ 사진은 되살리지 못한다(기기 저장소에 담기엔 크고, 다시 찍는 편이 확실하다).
  note(T('Restored what you were writing. The photo needs to be taken again.',
         '쓰시던 내용을 되살렸습니다. 사진은 다시 찍어 주세요.'));
}

/* 🔗 분류 딥링크 — `/work?type=leave` 로 들어오면 그 결재 폼을 바로 편다. (2026-08-20)
 *
 * 왜 — 관리자 화면 「보고서 양식」에서 «휴가 계획서» 를 고르고 넘어와도 **분류가 따라오지
 *      않아** 도착해서 또 골라야 했다. 「양식을 골랐다 → 그 폼이 열린다」 가 한 흐름이 되어야
 *      두 화면이 «두 벌» 이 아니라 «한 흐름» 이 된다.
 *
 * ⚠️ 쓰다 만 초안이 우선이다 — restoreDraft 가 이미 폼을 열었으면(PICK) 손대지 않는다.
 *    덮어쓰면 쓰던 글이 사라진다.
 * ⚠️ 올릴 수 없는 분류는 서버가 `types` 에서 아예 빼고 준다(강사의 지출 등).
 *    그때 조용히 넘기면 「눌렀는데 아무 일도 안 일어난다」 가 되므로 한 줄 알려 준다.
 */
function openWantedType(){
  if (!WANT_TYPE || PICK) return;
  var types = (D && D.types) || [];
  if (!types.length) return;                 // 아직 못 받았다 — 여기서 판단하지 않는다
  var want = WANT_TYPE; WANT_TYPE = '';      // 한 번만 — 다시 그릴 때 또 열리지 않게
  var found = null;
  for (var i = 0; i < types.length; i++) if (types[i].key === want) found = types[i];
  if (!found) {
    toast(T('This account cannot submit that type.', '이 계정으로는 올릴 수 없는 분류입니다.'));
    return;
  }
  window.pick(found.key);
  // 폼이 화면 밖에 있으면 «열렸는데 안 보인다» 가 된다. 열었으면 눈에 보이게 한다.
  try {
    var f = document.getElementById('form');
    if (f && !f.hidden) f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {}
}

window.addEventListener('online', function(){
  offline(false); outboxFlush(); subFlush(); load().catch(function(){});
});
window.addEventListener('offline', function(){ offline(true); });
/* ── 🔊 소리로 알려주기 ────────────────────────────────────────────────────
   [무엇을 하나] 결재함을 **열어 둔 동안** 새 결재가 들어오면 «띵» 하고 알린다.
   웹푸시(브라우저를 닫아도 오는 알림)와는 별개다 — 이건 열어 둔 화면에서만 난다.

   [왜 이렇게 만들었나]
   · 소리 파일(mp3)을 두지 않고 **그 자리에서 만들어 낸다.** 이 화면의 설계 약속이
     「필리핀 느린 인터넷에서도 가볍게」라, 소리 하나 때문에 내려받을 것을 늘리지 않는다.
   · 🪤 브라우저는 **사람이 한 번 클릭하기 전에는 소리를 막는다**(자동재생 정책).
     그래서 AudioContext 가 suspended 로 시작하고, 그대로 두면 «코드는 도는데 소리만
     안 나는» 상태가 된다. 첫 클릭 때 한 번 깨워 둔다.
   · ⛔ 사용자 지정 소리를 «푸시 알림» 에 붙이는 건 불가능하다 — Notification 의 sound
     옵션은 표준에서 빠졌고 크롬이 구현하지 않는다. 화면이 닫혀 있을 때는 윈도우 기본
     알림음만 난다(sw.js 가 silent 를 안 쓰므로 그건 이미 난다). */
var SOUND_KEY = 'mangoi_work_sound_v1';
var soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== '0'; } catch (e) {}

var actx = null;
function audioWake(){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
/* 첫 클릭 한 번으로 소리를 깨운다. once:true 라 그 뒤로는 남지 않는다. */
document.addEventListener('click', audioWake, { once: true });

function beep(){
  if (!soundOn) return;
  audioWake();
  if (!actx) return;
  try {
    // 두 음(솔–도)만 짧게. 길거나 크면 사무실에서 거슬린다.
    [[784, 0], [1046, 0.13]].forEach(function(pair){
      var o = actx.createOscillator(), g = actx.createGain();
      var t0 = actx.currentTime + pair[1];
      o.type = 'sine'; o.frequency.value = pair[0];
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.14);
    });
  } catch (e) {}
}

function paintSoundBtn(){
  var b = document.getElementById('soundBtn');
  if (!b) return;
  var sp = b.querySelector('span');
  /* 🪤 textContent 만 바꾸면 🌐 를 눌렀을 때 옛 글자로 되돌아간다(CLAUDE.md 함정).
        data-en/data-ko 도 함께 갱신해야 한다. */
  var en = soundOn ? 'Sound: on' : 'Sound: off';
  var ko = soundOn ? '소리 켬' : '소리 끔';
  sp.setAttribute('data-en', en);
  sp.setAttribute('data-ko', ko);
  sp.textContent = T(en, ko);
}
/* 🪤 여기서 부른다. 시작부(applyLang 옆)에서 부르면 **위의 `var soundOn = true` 대입보다
      먼저** 실행돼(선언만 끌어올려지고 값은 안 올라간다) undefined = 꺼짐으로 그려진다.
      실제로는 켜져 있는데 화면만 「끔」인 상태가 되어, 눌러야 할 사람이 «이미 껐구나» 하고 지나간다. */
paintSoundBtn();

window.toggleSound = function(){
  soundOn = !soundOn;
  try { localStorage.setItem(SOUND_KEY, soundOn ? '1' : '0'); } catch (e) {}
  paintSoundBtn();
  if (soundOn) { audioWake(); beep(); }        // 켤 때 한 번 들려준다 — 소리가 나는지 확인용
  toast(soundOn ? T('Sound on.', '소리를 켰습니다.') : T('Sound off.', '소리를 껐습니다.'));
};

/* 새로 들어온 것이 있는가 — 대기 «건수» 가 늘었을 때만 울린다.
   ⚠️ 첫 화면에서는 울리지 않는다(기준을 잡는 것뿐). 들어오자마자 울면 놀란다. */
var lastPending = null;
function noteArrival(j){
  var n = (j && j.inbox) ? j.inbox.length : 0;
  if (lastPending !== null && n > lastPending) {
    beep();
    toast(T('New approval arrived.', '새 결재가 도착했습니다.'));
  }
  lastPending = n;
  /* 탭 제목에도 건수를 적는다 — 다른 탭을 보고 있어도 눈에 띈다. */
  try { document.title = (n ? '(' + n + ') ' : '') + T('Approvals · Mangoi', '결재함 · 망고아이'); } catch (e) {}
}

/* 열어 둔 동안 1분마다 확인. 서버가 ETag 로 «안 바뀜(304)» 을 돌려주므로 거의 공짜다.
   ⚠️ 화면이 숨겨져 있으면 건너뛴다 — 안 보는 화면 때문에 필리핀 데이터를 쓰지 않는다. */
setInterval(function(){
  if (document.hidden) return;
  load().catch(function(){});
}, 60000);

// 화면으로 돌아왔을 때 최신화 — 푸시를 눌러 들어온 경우가 많다.
document.addEventListener('visibilitychange', function(){
  if (!document.hidden) { outboxFlush(); subFlush(); load().catch(function(){}); }
});

})();
</script>
</body>
</html>
