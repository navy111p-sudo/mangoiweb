#   NEVER put shared keys / phone numbers back in [vars] - this file is committed.
#   Callers of UPTIME_HOOK_KEY_NEW: cafe24 /root/mangoi-watchdog.sh (layer-2 external watchdog,
#     every 5 min: ?run=probe for a deep check, and ?alertType= as a relay when it has no SMS key).
#   Check alerting without sending an SMS:  GET /api/uptime-hook?run=watchdog&key=<UPTIME_HOOK_KEY_NEW>
#     -> config.owner_phone_set / sms_from_set must BOTH be true, and layer2 must not be 'unset'.
#   Add them with:  wrangler secret put <NAME>   (and again with --env production)
#   💬 SOLAPI 발신번호: secret SOLAPI_FROM_PHONE (등록·인증 완료된 번호). API 키/시크릿도 secret.
#      문자 안 보내고 확인:  GET /api/uptime-hook?run=watchdog&key=...  -> config.sms_from_set
#   📧 이메일(Resend) — 레벨테스트 신규신청 관리자(필리핀) 알림 + 교사 배정 알림.
#      활성화: (1) resend.com 도메인 인증 → (2) wrangler secret put RESEND_API_KEY
#      RESEND_API_KEY 미설정 시 이메일은 조용히 skip(신청·문자·대시보드는 정상 동작).
RESEND_FROM = "망고아이 MANGOi <noreply@mangoi.co.kr>"
LEVELTEST_ADMIN_EMAIL = ""   # ← 필리핀 관리자 이메일 입력
# 🧑‍🏫 강사 옛 LMS 통과 인증(운영). "off" + 재배포 = 즉시 차단
LEGACY_TEACHER_LOGIN = "on"
LEGACY_LMS_BASE = "https://www.mangoi.co.kr/lms"

[env.production.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "none"

# 스테이징(-prod)에는 cron 미등록.
#   - 이유1: 계정 cron 한도(5개) — 메인이 4개를 쓰므로 스테이징까지 4개면 초과(code 10072).
#   - 이유2: 스테이징이 cron 을 돌리면 미납독촉/NPS/정기결제/브리핑이 "중복 발송"됨.
#   운영 cron 은 메인(webrtc-unified-platform) 에서만 동작합니다.
[env.production.triggers]
crons = []
