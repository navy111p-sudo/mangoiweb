name = "webrtc-unified-platform"
main = "src/index.ts"
compatibility_date = "2026-04-07"
# fix (2026-06-01) — 계정 자동조회 실패(Authentication/account ID 오류) 방지: account_id 명시
account_id = "7ae16a3c4bcc84743c70828a5156ebb3"

# 🇵🇭 (2026-07-24) Workers Logs 저장 — 화상수업 끊김(close code) 사후 분석용.
#   여기가 없으면 video-call-room.ts 의 [VideoChat][close] 로그가 `wrangler tail` 로
#   실시간으로 볼 때만 보이고 아무 데도 남지 않는다. 필리핀 강사 튕김 원인 규명이 불가능했던 이유.
#   ⚠️ [env.production] 에도 같은 블록이 한 벌 더 있어야 운영 워커에 적용된다.
#   🔴 (재점검) head_sampling_rate 를 1(=100%) 로 두지 말 것. 이 워커는 run_worker_first=true 라
#      정적 파일 요청까지 전부 invocation 이고, 수업 중 25초마다 오가는 ping 도 각각 1건이다.
#      100% 로 두면 일일 한도를 오전에 소진하고, 정작 수업이 몰리는 저녁에 close 로그가 잘린다
#      (한도 초과 시 자동으로 1% 샘플링으로 강등됨) — 로그를 켠 목적 자체가 무너진다.
[observability]
enabled = true
head_sampling_rate = 0.05

# 🔴 (2026-08-19) 이 블록이 [env.production] 에 한 벌 더 있다 = **워커가 두 벌이고, DO 도 두 벌**이다.
#   Durable Object 네임스페이스는 «스크립트마다» 만들어지므로, 같은 이름으로 방을 열어도
#   webrtc-unified-platform 과 webrtc-unified-platform-prod 는 **서로 다른 방**이다.
#   화상수업 WS 주소는 location.host 로 만들어지므로(js/idx-main.js createWebSocket)
#   **어느 도메인으로 열었느냐가 곧 어느 방이냐** 가 된다.
#   ⚠️ D1·KV·R2 는 아래에서 두 환경이 **같은 id** 를 쓴다 → 출석·토큰은 한 DB 에 같이 쌓여
#      «둘 다 같은 방에 있었다» 로 보인다. 갈리는 건 DO 하나뿐이라 DB 만 보면 못 찾는다.
#   실제 사고: test.mangoi.co.kr(기본 워커) 의 강사와 mangoi.ai(-prod) 의 학생이 8회 수업 동안
#      한 번도 만나지 못했다(2026-08-19 규명).
#   ✅ (2026-09-01 이전 완료) 사장님이 대시보드에서 test.mangoi.co.kr 이 기본 워커에 붙어 있는 것을
#      직접 확인하고 -prod 로 옮겼다 → 이제 같은 DO 다.
#      🔴 여기 적혀 있던 「2026-08-27 이전 완료 + demo-1 로 서로 보이는 것까지 확인」은 사실이 아니었다.
#         D1 실측(2026-09-01): 그날 demo-1 접속은 mangoi.ai 1건 · test.mangoi.co.kr 0건 = 확인은 없었다.
#         8/19 에도 같은 일이 있었다(확인을 못 했는데 요약만 완료형). 그 두 문장 때문에 아무도 다시 안 봤고
#         8/25 · 8/27 · 9/1 에 같은 사고가 세 번 더 났다.
#      ⛔ 코드 밖 상태(대시보드·DNS)를 완료형으로 적지 말 것. 못 한 것은 못 했다고 적을 것.
#      ✅ 이제 사람 기억에 기대지 않는다 — 갈리면 15분 감시견이 문자로 알린다(src/room-split-guard.ts).
#         도메인마다 DO 네임스페이스 지문(idFromName)을 적어 두고 대조한다 = 원인 그 자체를 잰다.
#      ⚠️ 워커는 여전히 두 벌 배포된다 — 바뀐 것은 «도메인이 전부 -prod 를 본다» 뿐이다.
#         기본 워커는 cron 5종이 거기에만 있어 계속 살아 있어야 한다(아래 [triggers]).
# 📌 도메인–워커 배치 (2026-09-01 대시보드 실측) — test.mangoi.co.kr · mangoi.ai · www.mangoi.ai → 전부 webrtc-unified-platform-prod(운영)
#    ⚠️ 이 줄은 규격이다 — outgoing_link_domain_harness ④ 가 CLAUDE.md·MAINTENANCE.md 의 같은 줄과
#       **서로 어긋나지 않는지** 대조한다. 배치가 바뀌면 세 곳을 함께 고치고 확인 날짜도 갱신할 것.
#
# 🌐 도메인은 **여기서 관리하지 않는다.** Cloudflare 대시보드
#    (Workers & Pages > 워커 > Settings > Domains & Routes) 가 정본이다.
#    ⛔ 「못 박아 두자」며 routes 를 추가하지 말 것. 두 가지가 조용히 깨진다:
#      ① routes 는 «추가» 가 아니라 «전체 목록» 이다 — 적지 않은 도메인은 다음 배포에서
#         지워진다. test.mangoi.co.kr 만 적으면 **mangoi.ai 가 떨어져 서비스가 내려간다.**
#      ② routes 를 넣는 순간 workers_dev 가 false 로 «추론» 된다(Cloudflare 문서 명시) →
#         webrtc-unified-platform-prod.navy111p.workers.dev 가 죽고, 그 주소로 배포를 확인하는
#         deploy.ps1(77행)·deploy-full.ps1(130행)·deploy.yml(164·174행)이 함께 깨진다.
#    정말 적으려면 **붙어 있는 도메인을 하나도 빠뜨리지 말고 전부 + workers_dev = true** 를 함께.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom", "VideoCallRoom"]

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[durable_objects.bindings]]
name = "VIDEO_CALL_ROOM"
class_name = "VideoCallRoom"

[[kv_namespaces]]
binding = "PDF_STORE"
id = "f2df070b6e6d4b29adceb1dc96be6a67"

[[kv_namespaces]]
binding = "SESSION_STATE"
id = "7fc5f228dbd4490eb775637a8f8ba219"

[[d1_databases]]
binding = "DB"
database_name = "mango-db"
database_id = "80a12a77-4d79-4abd-aa9e-f5e39a7b5cf5"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "webrtc-class-recordings"

# Phase 21 - Workers AI binding (search bar AI command feature)
