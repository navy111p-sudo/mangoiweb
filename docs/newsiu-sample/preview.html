<title>New SIU 001 Sample</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#EEF2F3;--ink:#13303A;--sub:#51666E;--card:#fff;--line:#D4DEE1;--mango:#EF9A12;--mangoD:#A86200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D22;--ink:#E7EFF1;--sub:#9DB0B6;--card:#17292F;--line:#2A4148;--mangoD:#F4B24A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D22;--ink:#E7EFF1;--sub:#9DB0B6;--card:#17292F;--line:#2A4148;--mangoD:#F4B24A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:Lexend,'Noto Sans KR',system-ui,sans-serif;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:clamp(22px,4vw,32px);margin:0;text-wrap:balance}
.meta{color:var(--sub);font-size:14px;line-height:1.6;margin:0}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
button.say{background:var(--mango);border-color:var(--mango);color:#1b1100;font-weight:600}
.pg{font-variant-numeric:tabular-nums;color:var(--sub);margin-left:auto}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lines li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
.lines li span{flex:1}.lines li button{padding:4px 10px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.thumbs button{padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;background:none}
.thumbs button[aria-current="true"]{border-color:var(--mango)}
.thumbs img{display:block;width:100%}
h2{font-size:16px;margin:8px 0 0}
</style>
<div class="wrap">
  <h1>New SIU 샘플 — SIU BASIC 001 · A Talk with You (4판)</h1>
  <p class="meta">4판 · 원본 교재(구글 드라이브 «001 - A talk with you», 2019) 내용 그대로 + 게임쇼 구성: 레벨 3개와 보스 퍼즐, ⭐ 20개 모으기, 질문마다 다른 미니게임. 한글 뜻은 «먼저 짐작 → 나중에 확인» — 쪽 아래 작은 각주와 17쪽 뜻 맞추기 게임에만 나옵니다. 🔊 는 이 미리보기에서는 브라우저 목소리입니다.</p>
  <div class="stage"><img id="big" alt="교재 쪽"></div>
  <div class="bar">
    <button id="prev" type="button">← 이전</button>
    <button id="next" type="button">다음 →</button>
    <button id="all" class="say" type="button">🔊 이 쪽 전체 듣기</button>
    <span class="pg" id="pg"></span>
  </div>
  <ul class="lines" id="lines"></ul>
  <h2>전체 쪽</h2>
  <div class="thumbs" id="thumbs"></div>
</div>
<script>
var D=[{"img":"jpg/Slide1.JPG","lines":["A Talk with You"]},{"img":"jpg/Slide2.JPG","lines":["Your game map.","Level 1, Grammar Gym.","Level 2, Question Quest.","Level 3, Meaning Match.","Beat the Crossword Boss!"]},{"img":"jpg/Slide3.JPG","lines":["What is simple present?","Simple present is used to talk about an action which happens on a regular basis.","I study English every day.","We use the present tense to talk about something that is true in the present.","I am a student."]},{"img":"jpg/Slide4.JPG","lines":["Are you a student?","Yes, I am a student.","No, I am not a student."]},{"img":"jpg/Slide5.JPG","lines":["Do you like kimchi?","I like kimchi.","She likes kimchi.","I don't like kimchi.","He doesn't like kimchi.","Do you like kimchi?","Does she like kimchi?"]},{"img":"jpg/Slide6.JPG","lines":["He likes kimchi.","She doesn't like cats.","Does he play soccer?","They like music."]},{"img":"jpg/Slide7.JPG","lines":["Why do you study English?","study. To spend time learning about a subject, often with books.","I study English because...","Reason Race! Say 3 reasons in 20 seconds!"]},{"img":"jpg/Slide8.JPG","lines":["Where do you live?","live. To have your home in a place.","I live in...","Guess Where! Give 3 clues. Your partner guesses the place!"]},{"img":"jpg/Slide9.JPG","lines":["What is your favorite TV show?","watch. To look at something for a period of time.","My favorite TV show is...","Charades! Act out your favorite show. No talking!"]},{"img":"jpg/Slide10.JPG","lines":["Do you have a pet?","pet. An animal you keep at home for company and fun.","Yes, I do. I have a... / No, I don't.","Dream Pet! Draw your dream pet in 20 seconds. Tell its name!"]},{"img":"jpg/Slide11.JPG","lines":["What is your favorite sport?","sport. A physical game where players or teams compete.","My favorite sport is...","Mime It! Mime a sport. Your partner says \"You play…!\""]},{"img":"jpg/Slide12.JPG","lines":["What is the best thing about your friend?","best. Better than all the others.","The best thing about my friend is...","Compliment Chain! Say one nice thing about the person next to you!"]},{"img":"jpg/Slide13.JPG","lines":["What is one thing you want to learn?","learn. To get knowledge or a skill by studying or practice.","I want to learn how to...","Top 3! Rank 3 things you want to learn. Why is #1 first?"]},{"img":"jpg/Slide14.JPG","lines":["How can you help other people?","help. To make it easier for someone to do something.","I can help people by...","Super Helper! You are a helper hero! What is your power?"]},{"img":"jpg/Slide15.JPG","lines":["What would you like to teach someone?","teach. To show or explain to someone how to do something.","I would like to teach someone how to...","Mini Teacher! Teach your partner something in 30 seconds!"]},{"img":"jpg/Slide16.JPG","lines":["What are your hobbies?","hobby. An activity you do for fun in your free time.","My hobbies are...","Find a Match! Find a classmate with the same hobby!"]},{"img":"jpg/Slide17.JPG","lines":["study","live","watch","pet","sport","best","learn","help","teach","hobby"]},{"img":"jpg/Slide18.JPG","lines":["1. to have your home in a place.","2. to get knowledge or a skill by studying or practice.","3. an animal you keep at home for company and fun.","4. to spend time learning about a subject, often with books.","5. to show or explain to someone how to do something.","6. to make it easier for someone to do something.","7. better than all the others.","8. a physical game where players or teams compete.","9. an activity you do for fun in your free time.","10. to look at something for a period of time."]},{"img":"jpg/Slide19.JPG","lines":["Hot seat interview!","The class asks today's questions. Answer as fast as you can!","She likes soccer. She doesn't have a pet.","Count your stars!","See you next time!"]}], cur=0;
function speak(list){try{speechSynthesis.cancel();list.forEach(function(t){var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);});}catch(e){}}
function show(i){cur=(i+D.length)%D.length;var d=D[cur];
 document.getElementById('big').src=d.img;document.getElementById('pg').textContent=(cur+1)+' / '+D.length;
 var ul=document.getElementById('lines');ul.innerHTML='';
 d.lines.forEach(function(t){var li=document.createElement('li');var s=document.createElement('span');s.textContent=t;var b=document.createElement('button');b.type='button';b.textContent='🔊 듣기';b.onclick=function(){speak([t]);};li.append(s,b);ul.append(li);});
 [].forEach.call(document.querySelectorAll('.thumbs button'),function(b,k){b.setAttribute('aria-current',k===cur?'true':'false');});}
var th=document.getElementById('thumbs');
D.forEach(function(d,k){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',(k+1)+'쪽');var im=document.createElement('img');im.src=d.img;im.alt='';im.loading='lazy';b.append(im);b.onclick=function(){show(k);scrollTo({top:0,behavior:'smooth'});};th.append(b);});
document.getElementById('prev').onclick=function(){show(cur-1);};
document.getElementById('next').onclick=function(){show(cur+1);};
document.getElementById('all').onclick=function(){speak(D[cur].lines);};
addEventListener('keydown',function(e){if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(0);
</script>
