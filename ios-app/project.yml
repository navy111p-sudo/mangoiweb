# XcodeGen 프로젝트 명세 — 맥에서 `xcodegen generate` 하면 MangoiApp.xcodeproj 가 생성된다.
# (Xcode 프로젝트 파일 .pbxproj 를 사람이 손으로 관리하면 충돌·깨짐이 잦아 명세로 관리한다)
name: MangoiApp
options:
  bundleIdPrefix: kr.co.mangoi
  deploymentTarget:
    iOS: "15.0"          # getUserMedia 권한 델리게이트(iOS 15+) 사용
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"          # 사용자에게 보이는 버전
    CURRENT_PROJECT_VERSION: "1"      # 빌드 번호 — App Store 제출마다 반드시 +1
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""              # ← 법인 개발자 계정 Team ID 를 여기 넣는다 (예: ABCDE12345)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"     # 1=iPhone 2=iPad

targets:
  MangoiApp:
    type: application
    platform: iOS
    sources:
      - path: MangoiApp
    info:
      path: MangoiApp/Info.plist
      properties:
        CFBundleDisplayName: 망고아이
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.mangoi.app   # 안드로이드와 동일한 식별자
        INFOPLIST_FILE: MangoiApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    entitlements:
      path: MangoiApp/MangoiApp.entitlements
      properties:
        # 푸시알림 — 심사(4.2 최소기능) 대비 네이티브 근거이자 실제 필요 기능.
        # 서버(APNs) 연동 전까지는 이 줄을 지워도 빌드된다.
        aps-environment: development
