name = "mangoi-ai-avatar-cf"
main = "src/index.js"
compatibility_date = "2026-04-07"
# 계정 자동조회 실패 방지 위해 account_id 명시(메인 워커와 동일 계정)
account_id = "7ae16a3c4bcc84743c70828a5156ebb3"

# Workers AI (Llama 3.3 상담 + Whisper STT)
[ai]
binding = "AI"

# 정적 자산: student.html (상담직원 위젯 UI). html_handling 은 기본값 유지(/student.html → /student).
[assets]
directory = "./public"
binding = "ASSETS"

# 🔁 음성 캐시(R2) — /api/tts 가 같은 문장은 한 번만 Azure 로 만들고 이후엔 무료로 재생합니다.
#    월별 Azure 사용량(usage/YYYY-MM.json)도 여기 둡니다(/api/tts/usage).
#    버킷은 2026-10-26 생성됨(Cloudflare 계정, ENAM). 없으면 배포가 실패합니다.
[[r2_buckets]]
binding = "TTS_CACHE"
bucket_name = "mangoi-avatar-tts-cache"

# 시크릿(대시보드/CLI로 등록 — 배포 간 유지됨, 여기에 값 넣지 말 것):
#   AZURE_SPEECH_KEY, AZURE_SPEECH_REGION   ← /api/tts(운영비서 한국어 음성). 메인 워커와 같은 Speech 리소스 값
#   (선택) AZURE_VOICE_KO, AZURE_VOICE_KO_OPS, AZURE_VOICE_EN
#   TTS_RELAY_URL, TTS_RELAY_KEY            ← /api/tts-free 한국어 구글 음성 KR 릴레이
#   ⛔ TYPECAST_* 는 2026-10-26 부터 안 씁니다(비용 5배 · 403 차단). 대시보드에 남아 있어도 무해.
