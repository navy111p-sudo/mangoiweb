<!doctype html><html lang="ko"><meta charset="utf-8"><title>성인 소유자 로컬 시험 준비</title><h1>공개 서버 없는 로컬 음성 시험</h1><p>이 PC의 기존 Cloudflare 인증으로 음성·텍스트를 Cloudflare에 보냅니다. 앱에는 내용을 저장하지 않습니다. 61회 / AI US$0.40, 최대 1시간(기존 인증이 먼저 만료되면 조기 종료). 실제 학생은 사용하지 마세요. 서버를 종료해도 사용 한도는 초기화되지 않습니다.</p><form><label>ED 시험 비밀번호 <input type="password" required maxlength="128" autocomplete="off"></label><label><input type="checkbox" required>지금 준비됐으며 1시간 시험을 시작합니다.</label><button>로컬 시험 설정</button></form><p id="result" role="status"></p><input id="code" type="password" readonly hidden aria-label="일회용 시작 코드"><button id="show" hidden>시작 코드 보기</button><a id="go" href="/index.html" hidden>ED 로그인 → A.i 말하기</a><script>
const form=document.querySelector('form'),result=document.querySelector('#result');form.onsubmit=async e=>{e.preventDefault();form.querySelector('button').disabled=true;const input=form.querySelector('[type=password]');const body=JSON.stringify({password:input.value,ready:true});input.value='';try{const r=await fetch('/local/setup',{method:'POST',headers:{'Content-Type':'application/json'},body});if(!r.ok)throw Error();const d=await r.json();document.querySelector('#code').value=d.code;for(const id of ['code','show','go'])document.getElementById(id).hidden=false;form.hidden=true;result.textContent='시작 코드는 이 PC에서만 확인해 전용관에 입력하세요. 종료: '+new Date(d.expiresAt).toLocaleString();}catch{result.textContent='설정 실패. 인증 유효기간 또는 기존 사용 원장을 확인하세요. 원장을 삭제하거나 자동 재시도하지 마세요.';}};document.querySelector('#show').onclick=()=>{const code=document.querySelector('#code');code.type=code.type==='password'?'text':'password';};
</script></html>
